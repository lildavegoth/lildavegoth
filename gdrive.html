<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Google Drive Files</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            margin: 0;
            min-height: 100vh;
            background: #fafbfc;
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 24px 16px;
        }
        .app-container {
            max-width: 960px;
            width: 100%;
            background: white;
            border-radius: 20px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.05);
            overflow: hidden;
            border: 1px solid #e9ebf0;
        }
        .app-header {
            padding: 20px 24px;
            border-bottom: 1px solid #eef2f6;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 16px;
        }
        .app-header h1 {
            margin: 0;
            font-size: 1.6rem;
            font-weight: 500;
            color: #1e293b;
            letter-spacing: -0.01em;
        }
        .auth-section {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .user-info {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .user-avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: #e2e8f0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 500;
            color: #475569;
            text-transform: uppercase;
            background-size: cover;
            background-position: center;
        }
        .user-name {
            font-size: 0.95rem;
            font-weight: 500;
            color: #334155;
        }
        button {
            background: white;
            border: 1px solid #cbd5e1;
            padding: 8px 16px;
            border-radius: 40px;
            font-size: 0.9rem;
            font-weight: 500;
            color: #1e293b;
            cursor: pointer;
            transition: all 0.15s ease;
            box-shadow: 0 1px 2px rgba(0,0,0,0.02);
        }
        button:hover {
            background: #f8fafc;
            border-color: #94a3b8;
            box-shadow: 0 4px 8px rgba(0,0,0,0.03);
        }
        button.primary {
            background: #1e293b;
            border-color: #1e293b;
            color: white;
        }
        button.primary:hover {
            background: #0f172a;
        }
        .file-list-container {
            padding: 8px 0;
            min-height: 300px;
        }
        .status-message {
            padding: 32px 24px;
            text-align: center;
            color: #64748b;
            font-size: 0.95rem;
        }
        .file-item {
            display: flex;
            align-items: center;
            padding: 12px 24px;
            border-bottom: 1px solid #f1f5f9;
            transition: background 0.1s;
        }
        .file-item:hover {
            background: #fafcff;
        }
        .file-icon {
            width: 24px;
            margin-right: 16px;
            font-size: 1.3rem;
            color: #5b6c85;
        }
        .file-info {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 2px;
        }
        .file-name {
            font-weight: 500;
            color: #0b1c2e;
            word-break: break-word;
        }
        .file-meta {
            font-size: 0.75rem;
            color: #62748c;
        }
        .load-more-btn {
            margin: 20px 24px 24px;
            width: calc(100% - 48px);
            padding: 12px;
            background: #f8fafc;
            border: 1px dashed #cbd5e1;
            border-radius: 12px;
            color: #475569;
            font-weight: 500;
        }
        .load-more-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        textarea {
            resize: none;
        }
        .empty-folder {
            padding: 40px 24px;
            text-align: center;
            color: #64748b;
        }
    </style>
    <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>
<div class="app-container">
    <div class="app-header">
        <h1>My Drive</h1>
        <div class="auth-section">
            <div id="userProfile" class="user-info" style="display: none;">
                <div id="userAvatar" class="user-avatar"></div>
                <span id="userNameDisplay" class="user-name"></span>
            </div>
            <button id="authButton" class="primary">Sign in with Google</button>
        </div>
    </div>

    <div id="fileListContainer" class="file-list-container">
        <div class="status-message">Sign in to view your Google Drive files</div>
    </div>

    <div id="paginationSection" style="display: none;">
        <button id="loadMoreButton" class="load-more-btn">Load more files</button>
    </div>
</div>

<script>
    (function() {
        const GOOGLE_CLIENT_ID = '557085228193-6o5cajmu35uir990advh7op177upgqrq.apps.googleusercontent.com';
        const REDIRECT_URI_CORDOVA = 'com.kakoikiraku.home://oauth';
        const REDIRECT_URI_WEB = window.location.origin;
        const TOKEN_KEY = 'google_tokens';
        const SCOPES = 'https://www.googleapis.com/auth/drive.readonly';

        let nextPageToken = null;
        let isFetching = false;
        let currentFolderId = 'root';
        let currentAccessToken = null;
        let tokenClient = null;
        let isCordovaEnv = false;

        const authButton = document.getElementById('authButton');
        const userProfileDiv = document.getElementById('userProfile');
        const userAvatar = document.getElementById('userAvatar');
        const userNameDisplay = document.getElementById('userNameDisplay');
        const fileListContainer = document.getElementById('fileListContainer');
        const paginationSection = document.getElementById('paginationSection');
        const loadMoreButton = document.getElementById('loadMoreButton');

        function detectCordova() {
            return typeof window.cordova !== 'undefined' && window.cordova.InAppBrowser;
        }

        isCordovaEnv = detectCordova();

        function getStoredTokens() {
            const stored = localStorage.getItem(TOKEN_KEY);
            return stored ? JSON.parse(stored) : null;
        }

        function setStoredTokens(tokens) {
            localStorage.setItem(TOKEN_KEY, JSON.stringify(tokens));
        }

        function clearStoredTokens() {
            localStorage.removeItem(TOKEN_KEY);
        }

        function buildFileListHtml(files) {
            if (!files || files.length === 0) {
                return '<div class="empty-folder">📂 This folder is empty</div>';
            }
            let html = '';
            files.forEach(file => {
                const icon = file.mimeType && file.mimeType.includes('folder') ? '📁' : '📄';
                const name = file.name || 'Untitled';
                const modified = file.modifiedTime ? new Date(file.modifiedTime).toLocaleDateString() : '';
                html += `
                    <div class="file-item">
                        <div class="file-icon">${icon}</div>
                        <div class="file-info">
                            <span class="file-name">${escapeHtml(name)}</span>
                            <span class="file-meta">${modified}</span>
                        </div>
                    </div>
                `;
            });
            return html;
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function updateUIForSignedOut() {
            userProfileDiv.style.display = 'none';
            authButton.textContent = 'Sign in with Google';
            authButton.classList.add('primary');
            fileListContainer.innerHTML = '<div class="status-message">Sign in to view your Google Drive files</div>';
            paginationSection.style.display = 'none';
            nextPageToken = null;
            currentAccessToken = null;
        }

        async function fetchUserProfile(accessToken) {
            const response = await fetch('https://www.googleapis.com/oauth2/v2/userinfo', {
                headers: { 'Authorization': `Bearer ${accessToken}` }
            });
            if (!response.ok) throw new Error('Failed to fetch user profile');
            return await response.json();
        }

        function displayUserProfile(profile) {
            const name = profile.name;
            const email = profile.email;
            const picture = profile.picture;
            userNameDisplay.textContent = name || email;
            userAvatar.textContent = name ? name.charAt(0).toUpperCase() : (email ? email.charAt(0).toUpperCase() : '?');
            if (picture) {
                userAvatar.style.backgroundImage = `url(${picture})`;
                userAvatar.style.backgroundSize = 'cover';
                userAvatar.style.backgroundPosition = 'center';
                userAvatar.textContent = '';
            } else {
                userAvatar.style.backgroundImage = '';
            }
            userProfileDiv.style.display = 'flex';
            authButton.textContent = 'Sign out';
            authButton.classList.remove('primary');
        }

        async function loadDriveFiles(accessToken, reset = false) {
            if (isFetching) return;
            isFetching = true;

            if (reset) {
                fileListContainer.innerHTML = '<div class="status-message">Loading files…</div>';
                nextPageToken = null;
                paginationSection.style.display = 'none';
            } else {
                loadMoreButton.disabled = true;
                loadMoreButton.textContent = 'Loading…';
            }

            let url = `https://www.googleapis.com/drive/v3/files?pageSize=30&fields=nextPageToken,files(id,name,mimeType,modifiedTime)&q='${currentFolderId}'+in+parents+and+trashed=false&orderBy=folder,name`;
            if (!reset && nextPageToken) {
                url += `&pageToken=${nextPageToken}`;
            }

            try {
                const response = await fetch(url, {
                    headers: { 'Authorization': `Bearer ${accessToken}` }
                });
                if (!response.ok) throw new Error('Failed to list files');
                const data = await response.json();
                const files = data.files || [];
                nextPageToken = data.nextPageToken || null;

                if (reset) {
                    fileListContainer.innerHTML = buildFileListHtml(files);
                } else {
                    const existingContent = fileListContainer.innerHTML;
                    const tempDiv = document.createElement('div');
                    tempDiv.innerHTML = existingContent;
                    const items = tempDiv.querySelectorAll('.file-item');
                    let newHtml = '';
                    for (let item of items) {
                        newHtml += item.outerHTML;
                    }
                    newHtml += buildFileListHtml(files).replace('<div class="file-item">', '').replace(/<\/div>$/, '');
                    fileListContainer.innerHTML = newHtml || '<div class="empty-folder">📂 This folder is empty</div>';
                }

                if (nextPageToken) {
                    paginationSection.style.display = 'block';
                    loadMoreButton.disabled = false;
                    loadMoreButton.textContent = 'Load more files';
                } else {
                    paginationSection.style.display = 'none';
                }
            } catch (error) {
                fileListContainer.innerHTML = '<div class="status-message">Failed to load files. Please try again.</div>';
                paginationSection.style.display = 'none';
            } finally {
                isFetching = false;
            }
        }

        async function onGoogleSignIn(accessToken) {
            currentAccessToken = accessToken;
            try {
                const profile = await fetchUserProfile(accessToken);
                displayUserProfile(profile);
                loadDriveFiles(accessToken, true);
            } catch (error) {
                fileListContainer.innerHTML = '<div class="status-message">Failed to load user profile</div>';
            }
        }

        function initializeBrowserAuth() {
            if (typeof google === 'undefined' || !google.accounts) {
                setTimeout(initializeBrowserAuth, 100);
                return;
            }
            
            tokenClient = google.accounts.oauth2.initTokenClient({
                client_id: GOOGLE_CLIENT_ID,
                scope: SCOPES,
                ux_mode: 'redirect',
                redirect_uri: REDIRECT_URI_WEB,
                callback: (response) => {
                    if (response.error) {
                        fileListContainer.innerHTML = '<div class="status-message">Authentication failed</div>';
                        return;
                    }
                    const accessToken = response.access_token;
                    const expiresAt = Date.now() + (parseInt(response.expires_in) * 1000);
                    setStoredTokens({
                        access_token: accessToken,
                        expires_at: expiresAt,
                        refresh_token: null
                    });
                    onGoogleSignIn(accessToken);
                }
            });
        }

        function handleBrowserAuthClick() {
            if (currentAccessToken) {
                google.accounts.oauth2.revoke(currentAccessToken, () => {});
                clearStoredTokens();
                updateUIForSignedOut();
            } else {
                tokenClient.requestAccessToken();
            }
        }

        function handleRedirectResponse() {
            const params = new URLSearchParams(window.location.hash.substring(1));
            const accessToken = params.get('access_token');
            const expiresIn = params.get('expires_in');
            
            if (accessToken && expiresIn) {
                const expiresAt = Date.now() + (parseInt(expiresIn) * 1000);
                setStoredTokens({
                    access_token: accessToken,
                    expires_at: expiresAt,
                    refresh_token: null
                });
                window.location.hash = '';
                onGoogleSignIn(accessToken);
            }
        }

        function generateRandomString(length) {
            const array = new Uint8Array(length);
            crypto.getRandomValues(array);
            return Array.from(array, byte => ('0' + (byte & 0xFF).toString(16)).slice(-2)).join('');
        }

        async function generateCodeChallenge(codeVerifier) {
            const encoder = new TextEncoder();
            const data = encoder.encode(codeVerifier);
            const digest = await crypto.subtle.digest('SHA-256', data);
            return btoa(String.fromCharCode(...new Uint8Array(digest)))
                .replace(/\+/g, '-')
                .replace(/\//g, '_')
                .replace(/=+$/, '');
        }

        async function authenticateGoogleCordova() {
            const codeVerifier = generateRandomString(64);
            const codeChallenge = await generateCodeChallenge(codeVerifier);
            sessionStorage.setItem('code_verifier', codeVerifier);

            const authUrl = 'https://accounts.google.com/o/oauth2/v2/auth?' + new URLSearchParams({
                client_id: GOOGLE_CLIENT_ID,
                redirect_uri: REDIRECT_URI_CORDOVA,
                response_type: 'code',
                scope: SCOPES,
                code_challenge_method: 'S256',
                code_challenge: codeChallenge,
                access_type: 'offline',
                prompt: 'consent'
            });

            return new Promise((resolve, reject) => {
                const browser = cordova.InAppBrowser.open(authUrl, '_blank', 'location=no,clearsessioncache=yes');
                browser.addEventListener('loadstart', (event) => {
                    if (event.url.startsWith(REDIRECT_URI_CORDOVA)) {
                        browser.close();
                        const url = new URL(event.url);
                        const code = url.searchParams.get('code');
                        if (code) {
                            resolve(code);
                        } else {
                            reject('Authorization failed: no code');
                        }
                    }
                });
                browser.addEventListener('loaderror', (event) => {
                    if (event.url.startsWith(REDIRECT_URI_CORDOVA)) {
                        browser.close();
                        const url = new URL(event.url);
                        const code = url.searchParams.get('code');
                        if (code) {
                            resolve(code);
                        }
                    }
                });
            });
        }

        async function exchangeCodeForToken(code) {
            const codeVerifier = sessionStorage.getItem('code_verifier');
            sessionStorage.removeItem('code_verifier');

            const body = new URLSearchParams({
                code: code,
                client_id: GOOGLE_CLIENT_ID,
                redirect_uri: REDIRECT_URI_CORDOVA,
                grant_type: 'authorization_code',
                code_verifier: codeVerifier
            });
            const response = await fetch('https://oauth2.googleapis.com/token', {
                method: 'POST',
                headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                body: body
            });
            if (!response.ok) throw new Error('Token exchange failed');
            const data = await response.json();
            const tokens = {
                access_token: data.access_token,
                refresh_token: data.refresh_token,
                expires_at: Date.now() + data.expires_in * 1000
            };
            setStoredTokens(tokens);
            return tokens.access_token;
        }

        async function refreshAccessToken(refreshToken) {
            const body = new URLSearchParams({
                grant_type: 'refresh_token',
                refresh_token: refreshToken,
                client_id: GOOGLE_CLIENT_ID
            });
            const response = await fetch('https://oauth2.googleapis.com/token', {
                method: 'POST',
                headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                body: body
            });
            if (!response.ok) throw new Error('Token refresh failed');
            const data = await response.json();
            const tokens = {
                access_token: data.access_token,
                refresh_token: refreshToken,
                expires_at: Date.now() + data.expires_in * 1000
            };
            setStoredTokens(tokens);
            return tokens.access_token;
        }

        async function getValidAccessToken() {
            const tokens = getStoredTokens();
            if (!tokens) return null;
            if (tokens.expires_at && Date.now() < tokens.expires_at - 300000) {
                return tokens.access_token;
            }
            if (tokens.refresh_token) {
                try {
                    return await refreshAccessToken(tokens.refresh_token);
                } catch (e) {
                    clearStoredTokens();
                    return null;
                }
            }
            return null;
        }

        async function handleCordovaAuthClick() {
            const tokens = getStoredTokens();
            if (tokens) {
                clearStoredTokens();
                updateUIForSignedOut();
                return;
            }
            fileListContainer.innerHTML = '<div class="status-message">Authenticating…</div>';
            try {
                const code = await authenticateGoogleCordova();
                const accessToken = await exchangeCodeForToken(code);
                await onGoogleSignIn(accessToken);
            } catch (error) {
                fileListContainer.innerHTML = '<div class="status-message">Authentication failed. Please try again.</div>';
            }
        }

        async function initializeCordova() {
            authButton.addEventListener('click', handleCordovaAuthClick);
            const tokens = getStoredTokens();
            if (tokens) {
                try {
                    const accessToken = await getValidAccessToken();
                    if (accessToken) {
                        await onGoogleSignIn(accessToken);
                    } else {
                        clearStoredTokens();
                        updateUIForSignedOut();
                    }
                } catch (e) {
                    clearStoredTokens();
                    updateUIForSignedOut();
                }
            }
        }

        function initialize() {
            if (isCordovaEnv) {
                initializeCordova();
            } else {
                initializeBrowserAuth();
                authButton.addEventListener('click', handleBrowserAuthClick);
                if (window.location.hash && window.location.hash.includes('access_token')) {
                    handleRedirectResponse();
                } else {
                    const stored = getStoredTokens();
                    if (stored && stored.access_token && stored.expires_at > Date.now()) {
                        onGoogleSignIn(stored.access_token);
                    }
                }
            }
        }

        loadMoreButton.addEventListener('click', async function() {
            if (!nextPageToken) return;
            if (isCordovaEnv) {
                const token = await getValidAccessToken();
                if (token) {
                    loadDriveFiles(token, false);
                } else {
                    updateUIForSignedOut();
                }
            } else {
                if (currentAccessToken) {
                    loadDriveFiles(currentAccessToken, false);
                }
            }
        });

        initialize();
    })();
</script>
</body>
</html>
