<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>lildavegoth | Storage</title>
    <meta name="color-scheme" content="dark">
    <link rel="stylesheet" href="media.css">
    <script src="notification.cssjs"></script>
    <script src="protections.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --accent-color: #C1FC32;
            --accent-dark: #9bc726;
            --bg-black: #000000;
            --bg-dark: #1a1a1a;
            --text-primary: #f5f5f7;
            --text-secondary: #a1a1a6;
            --radius-large: 28px;
            --spacing-sm: 16px;
            --spacing-md: 24px;
            --spacing-lg: 32px;
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }
        body {
            background: var(--bg-black);
            color: var(--text-primary);
            min-height: 100vh;
            padding: 60px 20px 150px;
        }
        .storage-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 40px;
            padding: 0 10px;
        }
        .storage-avatar {
            width: 40px;
            height: 40px;
            background: #333;
            border-radius: 50%;
        }
        .storage-action-btn {
            background: transparent;
            border: none;
            color: var(--text-primary);
            font-size: 1.1rem;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
        }
        .storage-container {
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .storage-card {
            position: relative;
            width: 100%;
            max-width: 380px;
            height: 420px;
            border-radius: var(--radius-large);
            padding: var(--spacing-lg);
            box-shadow: 0 15px 40px rgba(0,0,0,0.7);
            display: flex;
            flex-direction: column;
            margin-top: -120px;
        }
        .storage-card:first-of-type {
            margin-top: 0;
        }
        .storage-card-header {
            display: flex;
            justify-content: flex-end;
            gap: var(--spacing-md);
            margin-bottom: var(--spacing-sm);
        }
        .storage-card-header i {
            font-size: 1.3rem;
            opacity: 0.8;
        }
        .card-content {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
        }
        .storage-key {
            font-size: 1.9rem;
            font-weight: 700;
            line-height: 1.2;
            margin-bottom: var(--spacing-sm);
        }
        .storage-value {
            color: inherit;
            line-height: 1.5;
            font-size: 1rem;
            white-space: pre-wrap;
            word-break: break-all;
        }
        .storage-card-footer {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
        }
        .storage-info {
            line-height: 1.3;
        }
        .storage-label {
            font-size: 1rem;
            opacity: 0.8;
        }
        .storage-detail {
            font-size: 1.3rem;
            font-weight: 600;
        }
        .storage-tag {
            background: rgba(0,0,0,0.4);
            color: #fff;
            padding: 8px 20px;
            border-radius: 30px;
            font-weight: 500;
            font-size: 1rem;
        }
        .dark {
            background: linear-gradient(135deg, #262626, #111);
            color: var(--text-primary);
        }
        .dark .storage-card-header i { color: var(--text-primary); }
        .green {
            background: linear-gradient(135deg, var(--accent-color), var(--accent-dark));
            color: #000;
        }
        .green .storage-card-header i { color: #000; }
        .lime {
            background: linear-gradient(135deg, #e0fc40, #b0e030);
            color: #000;
        }
        .lime .storage-card-header i { color: #000; }
        .orange {
            background: linear-gradient(135deg, #ffb340, #ff9000);
            color: #000;
        }
        .orange .storage-card-header i { color: #000; }
        .red {
            background: linear-gradient(135deg, #ff6666, #ee4444);
            color: #fff;
        }
        .red .storage-card-header i { color: #fff; }
        .red .storage-tag { background: rgba(0,0,0,0.5); }
    </style>
</head>
<body>
    <div class="storage-header">
        <div class="storage-avatar"></div>
        <button class="storage-action-btn" onclick="if(confirm('Clear all LocalStorage? This cannot be undone.')){localStorage.clear();location.reload();}">
            Clear All
            <i class="fas fa-trash-alt"></i>
        </button>
    </div>

    <div class="storage-container" id="storageContainer"></div>

    <script>
        const container = document.getElementById('storageContainer');
        const colors = ['dark', 'green', 'lime', 'orange', 'red'];

        if (localStorage.length === 0) {
            const card = document.createElement('div');
            card.className = 'storage-card dark';
            const header = document.createElement('div');
            header.className = 'storage-card-header';
            header.innerHTML = '<i class="fas fa-share-alt"></i><i class="fas fa-ellipsis-v"></i>';
            const content = document.createElement('div');
            content.className = 'card-content';
            const keyEl = document.createElement('div');
            keyEl.className = 'storage-key';
            keyEl.textContent = 'LocalStorage Empty';
            const valueEl = document.createElement('div');
            valueEl.className = 'storage-value';
            valueEl.textContent = 'No data stored yet on this site.';
            content.appendChild(keyEl);
            content.appendChild(valueEl);
            const footer = document.createElement('div');
            footer.className = 'storage-card-footer';
            footer.innerHTML = '<div class="storage-info"><div class="storage-label">Characters</div><div class="storage-detail">0</div></div><div class="storage-tag">Empty</div>';
            card.appendChild(header);
            card.appendChild(content);
            card.appendChild(footer);
            container.appendChild(card);
        } else {
            let keys = [];
            for (let i = 0; i < localStorage.length; i++) {
                keys.push(localStorage.key(i));
            }
            keys.sort();

            keys.forEach((key, index) => {
                let value = localStorage.getItem(key);
                let displayValue = value;
                try {
                    const parsed = JSON.parse(value);
                    if (typeof parsed === 'object' && parsed !== null) {
                        displayValue = JSON.stringify(parsed, null, 2);
                    }
                } catch (e) {}

                const card = document.createElement('div');
                card.className = `storage-card ${colors[index % colors.length]}`;

                const header = document.createElement('div');
                header.className = 'storage-card-header';
                header.innerHTML = '<i class="fas fa-share-alt"></i><i class="fas fa-ellipsis-v"></i>';

                const content = document.createElement('div');
                content.className = 'card-content';

                const keyEl = document.createElement('div');
                keyEl.className = 'storage-key';
                keyEl.textContent = key;

                const valueEl = document.createElement('div');
                valueEl.className = 'storage-value';
                valueEl.textContent = displayValue;

                content.appendChild(keyEl);
                content.appendChild(valueEl);

                const footer = document.createElement('div');
                footer.className = 'storage-card-footer';
                footer.innerHTML = `<div class="storage-info"><div class="storage-label">Characters</div><div class="storage-detail">${displayValue.length}</div></div><div class="storage-tag">Stored</div>`;

                card.appendChild(header);
                card.appendChild(content);
                card.appendChild(footer);

                container.appendChild(card);
            });
        }
    </script>
</body>
</html>
