<!DOCTYPE html>

<head>

    <style>
        :root {
            --accent-color: #C1FC32;
            --accent-dark: #9bc726;
            --bg-black: #000000;
            --bg-dark: #1a1a1a;
            --bg-card: rgba(30, 30, 30, 0.7);
            --text-primary: #f5f5f7;
            --text-secondary: #a1a1a6;
            --radius-small: 12px;
            --radius-medium: 20px;
            --radius-large: 28px;
            --spacing-xs: 8px;
            --spacing-sm: 16px;
            --spacing-md: 24px;
            --spacing-lg: 32px;
            --spacing-xl: 48px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-black);
            color: var(--text-primary);
            min-height: 100vh;
            overflow-x: hidden;
            padding: var(--spacing-md) var(--spacing-md) 100px var(--spacing-md);
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: var(--spacing-xs);
        }

        .header {
            display: flex;
            align-items: center;
            margin-bottom: 30px;
            gap: 15px;
            flex-wrap: wrap;
        }

        .avatar {
            width: 50px;
            height: 50px;
            background: #333;
            background-size: cover;
            background-position: center;
            border-radius: 50%;
            flex-shrink: 0;
        }

        .user-section {
            display: flex;
            align-items: center;
            flex-grow: 1;
            gap: 15px;
        }

        .username {
            font-size: 1.8rem;
            font-weight: 700;
        }

        .app-header {
            padding: var(--spacing-lg) 0;
            margin-bottom: var(--spacing-md);
        }

        .app-name {
            font-size: 2rem;
            font-weight: 700;
            color: #ffffff;
            margin-bottom: 4px;
        }

        .tagline {
            color: var(--text-secondary);
            font-size: 1rem;
        }

        .action-btn {
            flex: 1;
            padding: 14px 20px;
            border-radius: 40px;
            border: none;
            font-size: 1rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            cursor: pointer;
            transition: transform 0.1s ease;
            min-width: 120px;
        }

        .action-btn:active {
            transform: scale(0.97);
        }

        .btn-backup {
            background: var(--accent-color);
            color: #000;
        }

        .btn-restore {
            background: var(--bg-card);
            color: #fff;
            border: 1px solid rgba(255,255,255,0.1);
        }

        .button-row {
            display: flex;
            gap: 12px;
        }

        .clear-all-btn {

            background: #ff4d4d;

            color: white;
            padding: 14px;
            border-radius: 40px;
            font-size: 1rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            cursor: pointer;
            margin-bottom: 0;
            transition: transform 0.1s ease;
        }

        .clear-all-btn:active {
            transform: scale(0.97);
            background: rgba(255, 80, 80, 0.8);
        }

        .settings-btn {
            background: transparent;
            border: none;
            color: var(--text-secondary);
            font-size: 1.8rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;

            height: 44px;

        .search-container {

        }

        #globalSearch {

            background: var(--bg-card);

            font-size: 0.95rem;

        }

        .search-icon {

            right: 12px;
            top: 50%;

            pointer-events: auto;
            cursor: pointer;

            left: 0;
            right: 0;

            scrollbar-width: none;

        .search-suggestion-item {

        }

        .items-info {

            justify-content: space-between;
            align-items: center;
            margin-bottom: 40px;

    <script>
        async function saveFile(content, filename, mimeType) {
            return new Promise((resolve) => {
                const blob = new Blob([content], { type: mimeType });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = filename;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
                window.showMessage('Backup saved locally');
                resolve();
            });
        }

        const folderDefinitions = [
            { name: 'Account', keys: ['currentUser', 'profilePhoto', 'authToken', 'adminToken'] },

            { name: 'Hiragana Learner', keys: ['hiraganaHistory', 'hiraganaLastCheckin', 'hiraganaScores', 'unlockedAchievements'] },
            { name: 'Home', keys: ['lastPageState', 'pinnedAppsContainer', 'pinnedGamesContainer'] },
            { name: 'Inertia', keys: ['startDate', 'scoreCounts', 'workoutsCards', 'workoutsHistory', 'checkins', 'userRole', 'medicCards', 'reminders', 'lastMonthKey', 'workoutStartDate', 'totalScore', 'totalPoints', 'checkinBonus', 'lastResetMonth'] },
            { name: 'Journal', keys: ['dailyJournalContents'] },

            { name: 'Lyricure', keys: ['lyricsCache'] },

            { name: 'Multi Countdown', keys: ['countdownApp'] },

            { name: 'Work Attendance', keys: ['firstWorkDate', 'profileAbout', 'salaryDeduction', 'employeeId', 'salaryArchives', 'attendanceRecords', 'perdaySalary', 'profileName'] }
        ];

        const excludedKeys = [
            'giveaway_settings', 'giveaway_participants',
            'giveawayParticipants', 'lastGiveawayWinner', 'giveawayData',
            'showDescription', 'hideSettingsButton', 'showSearchBar', 'bodyPosition',
            'showBanner', 'showQuickLinks', 'pinnedItems', 'app_hash_v2', 'app_salt_v2',
            'dropbox_tokens', 'hideImportNote', 'hideSwipeIndicator', 'hintModeEnabled',
            'hiraganaStars', 'hiraganaStreak', 'moneyTrackerCurrentCardId', 'showAllEntries',
            'userName', 'lastPageState', 'giveaway_admins', 'openrouterAPIKey', 'showHeader',
            'hideIcons', 'privacy-policy-notice-dismissed', 'loginPop', 'lastCloudBackupDate',
            'backupFileSizes', 'vault_hash_v1', 'vault_salt_v1', 'secretVault'
        ];

        const BACKUP_META_KEY = 'backupFileSizes';
        const IMAGES_DB_NAME = 'journalImagesDB';
        const IMAGES_STORE_NAME = 'images';

        function openImagesDB() {
            return new Promise((resolve, reject) => {
                const request = indexedDB.open(IMAGES_DB_NAME, 1);
                request.onupgradeneeded = function(e) {
                    const db = e.target.result;
                    if (!db.objectStoreNames.contains(IMAGES_STORE_NAME)) {
                        db.createObjectStore(IMAGES_STORE_NAME, { keyPath: 'id' });
                    }
                };
                request.onsuccess = function(e) { resolve(e.target.result); };
                request.onerror = function(e) { reject(e.target.error); };
            });
        }
        const REDIRECT_URI = window.location.origin + window.location.pathname;

        let currentFolder = 'All';
        let pinnedItems = JSON.parse(localStorage.getItem('pinnedItems') || '[]');
        let tempFolders = [];
        let allPage = 0;

        const avatarEl = document.getElementById('avatar');
        const usernameEl = document.getElementById('username');

        function formatSize(bytes) {
            if (bytes < 1024) return bytes + 'B';
            if (bytes < 1048576) return (bytes / 1024).toFixed(1) + 'KB';
            return (bytes / 1048576).toFixed(1) + 'MB';
        }

        function buildCards() {
            const search = document.getElementById('globalSearch').value.toLowerCase();
            let allKeys = getFilteredKeys();
            let filtered = allKeys.filter(key => {
                if (currentFolder === 'All') return true;
                if (currentFolder === 'Other') {
                    return getFolderForKey(key) === 'Other';
                }
                return getFolderForKey(key) === currentFolder;
            });
            filtered = filtered.filter(key => {
                let val = localStorage.getItem(key);
                if (key === 'currentUser') {
                    try {
                        let user = JSON.parse(val);
                        if (user && typeof user === 'object') {
                            const { admin, ...cleanUser } = user;
                            val = JSON.stringify(cleanUser);
                        }
                    } catch (e) {}
                }
                return key.toLowerCase().includes(search) || val.toLowerCase().includes(search);
            });
            filtered.sort((a, b) => {
                if (isPinned(a) && !isPinned(b)) return -1;
                if (!isPinned(a) && isPinned(b)) return 1;
                return 0;
            });

            let displayKeys = filtered;
            let totalPages = 1;
            let page = 0;

            if (currentFolder === 'All') {
                totalPages = Math.ceil(filtered.length / 7) || 1;
                if (allPage >= totalPages) allPage = totalPages - 1;
                if (allPage < 0) allPage = 0;
                page = allPage;
                const start = page * 7;
                displayKeys = filtered.slice(start, start + 7);
            }

            const container = document.getElementById('storageContainer');
            container.innerHTML = '';
            let totalSize = getTotalStorageSize();
            const pill = document.getElementById('folderPill');
            pill.textContent = currentFolder;
            if (filtered.length === 0) {
                pill.style.background = '#333';
                pill.style.color = '#888';
                let card = document.createElement('div');
                card.className = 'storage-card';
                card.innerHTML = `
                    <div class="card-header">
                        <div class="tag-and-delete">
                            <div class="storage-tag">Empty</div>
                        </div>
                    </div>
                    <div class="storage-key">No items</div>
                    <div class="storage-value">No data in this folder.</div>
                    <div class="card-footer">
                        <div class="due">Length: 0 — 0B</div>
                        <div class="progress"><div class="progress-fill" style="width:0%"></div></div>
                    </div>
                `;
                container.appendChild(card);
            } else {
                pill.style.background = 'var(--accent-color)';
                pill.style.color = '#000';
                displayKeys.forEach(key => {
                    let rawValue = localStorage.getItem(key);
                    let valueForDisplay = rawValue;
                    let isJSON = false;
                    let isBase64 = false;
                    if (key === 'currentUser') {
                        try {
                            let userObj = JSON.parse(rawValue);
                            if (userObj && typeof userObj === 'object') {
                                const { admin, ...cleanUser } = userObj;
                                valueForDisplay = JSON.stringify(cleanUser, null, 2);
                                isJSON = true;
                            }
                        } catch (e) {}
                    } else {
                        if (typeof rawValue === 'string' && rawValue.length > 500 && rawValue.startsWith('data:image')) {
                            valueForDisplay = '[Base64 Image] ' + rawValue.substring(0, 40) + '...';
                            isBase64 = true;
                        } else {
                            try {
                                let parsed = JSON.parse(rawValue);
                                if (typeof parsed === 'object' && parsed !== null) {
                                    valueForDisplay = JSON.stringify(parsed, null, 2);
                                    if (valueForDisplay.length > 300) {
                                        valueForDisplay = valueForDisplay.substring(0, 300) + '...';
                                    }
                                    isJSON = true;
                                }
                            } catch {
                                if (rawValue.length > 300) {
                                    valueForDisplay = rawValue.substring(0, 300) + '...';
                                } else {
                                    valueForDisplay = rawValue;
                                }
                            }
                        }
                    }
                    if (!isJSON && !isBase64 && valueForDisplay.length > 300 && typeof valueForDisplay === 'string') {
                        valueForDisplay = valueForDisplay.substring(0, 300) + '...';
                    }
                    let percent = rawValue.length ? Math.min(100, Math.round((rawValue.length / 500) * 100)) : 0;
                    let itemSizeBytes = key.length + rawValue.length;
                    let itemSizeFormatted = formatSize(itemSizeBytes);
                    let card = document.createElement('div');
                    card.className = 'storage-card';
                    card.innerHTML = `
                        <div class="card-header">
                            <div class="tag-and-delete">
                                <div class="storage-tag">${isBase64 ? 'Base64' : (isJSON ? 'JSON' : 'String')}</div>
                                <button class="delete-btn" data-key="${key}">
                                    <i class="fas fa-trash"></i>
                                </button>
                            </div>
                            <button class="pin-btn" data-key="${key}" style="background:transparent; border:none; color:${isPinned(key) ? 'var(--accent-color)' : 'var(--text-secondary)'}; cursor:pointer; font-size:1.2rem; margin-top:2px;">
                                <i class="fas fa-thumbtack"></i>
                            </button>
                        </div>
                        <div class="storage-key">${key.length > 50 ? key.substring(0, 50) + '...' : key}</div>
                        <div class="storage-value">${valueForDisplay.replace(/</g, '&lt;').replace(/>/g, '&gt;')}</div>
                        <div class="card-footer">
                            <div class="due">Length: ${rawValue.length} — ${itemSizeFormatted}</div>
                            <div class="progress"><div class="progress-fill" style="width:${percent}%"></div></div>
                        </div>
                    `;
                    container.appendChild(card);
                    if (isPinned(key)) {
                        card.style.border = '2px solid var(--accent-color)';
                    }
                });
            }

            const paginationContainer = document.getElementById('paginationContainer');
            paginationContainer.innerHTML = '';
            if (currentFolder === 'All' && totalPages > 1) {
                const pagDiv = document.createElement('div');
                pagDiv.className = 'pagination-controls';
                const prevBtn = document.createElement('button');
                prevBtn.innerHTML = '<i class="fas fa-chevron-left"></i> Previous';
                prevBtn.disabled = page === 0;

                const pageLabel = document.createElement('span');

                const nextBtn = document.createElement('button');

                btn.onclick = (e) => {
                    e.stopPropagation();
                    let k = btn.dataset.key;
                    showConfirmPopup('Delete', 'Delete this item?', () => {

                    let k = btn.dataset.key;
                    togglePin(k);

        const DROPBOX_CLIENT_ID = '5630n4t14l8r80h';
        const DROPBOX_TOKEN_KEY = 'dropbox_tokens';

        function getDropboxTokens() {
            const t = localStorage.getItem(DROPBOX_TOKEN_KEY);
            return t ? JSON.parse(t) : null;
        }

        function setDropboxTokens(tokens) {
            localStorage.setItem(DROPBOX_TOKEN_KEY, JSON.stringify(tokens));
        }

        function clearDropboxTokens() {
            localStorage.removeItem(DROPBOX_TOKEN_KEY);
        }
        
        async function pollForTokens(session) {
            const maxAttempts = 120;
            let attempts = 0;
            const interval = setInterval(async () => {
                attempts++;
                if (attempts > maxAttempts) {
                    clearInterval(interval);
                    window.showMessage('Login timed out.', true);
                    sessionStorage.removeItem('dropbox_poll_session');
                    return;
                }
                try {
                    const resp = await fetch('/api/auth?dropbox_action=tokens&session=' + session);
                    const data = await resp.json();
                    if (data.ready) {
                        clearInterval(interval);
                        sessionStorage.removeItem('dropbox_poll_session');
                        setDropboxTokens(data.tokens);
                        window.showMessage('Dropbox connected!');
                    }
                } catch (e) {}
            }, 2000);
        }

        async function getValidAccessToken() {
            let tokens = getDropboxTokens();
            if (!tokens) return null;
            if (tokens.expires_at && Date.now() < tokens.expires_at - 300000) {
                return tokens.access_token;
            }
            if (tokens.refresh_token) {
                try {
                    const newTokens = await refreshAccessToken(tokens.refresh_token);
                    setDropboxTokens(newTokens);
                    return newTokens.access_token;
                } catch (e) {
                    clearDropboxTokens();
                    return null;
                }
            }
            return null;
        }

        async function refreshAccessToken(refreshToken) {
            const body = new URLSearchParams({
                grant_type: 'refresh_token',
                refresh_token: refreshToken,
                client_id: DROPBOX_CLIENT_ID,
            });
            const resp = await fetch('https://api.dropboxapi.com/oauth2/token', {
                method: 'POST',
                headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                body: body
            });
            if (!resp.ok) throw new Error('Refresh failed');
            const data = await resp.json();
            return {
                access_token: data.access_token,
                expires_at: Date.now() + data.expires_in * 1000,
                refresh_token: refreshToken
            };
        }

        function generateCodeVerifier() {
            const array = new Uint32Array(32);
            crypto.getRandomValues(array);
            return base64URLEncode(array);
        }

        async function generateCodeChallenge(verifier) {
            const encoder = new TextEncoder();
            const data = encoder.encode(verifier);
            const digest = await crypto.subtle.digest('SHA-256', data);
            return base64URLEncode(new Uint8Array(digest));
        }

        function base64URLEncode(buffer) {
            return btoa(String.fromCharCode(...new Uint8Array(buffer)))
                .replace(/\+/g, '-').replace(/\//g, '_').replace(/=/g, '');
        }

        async function authenticateDropbox() {
            const session = crypto.randomUUID();
            sessionStorage.setItem('dropbox_poll_session', session);
            window.open('/api/auth?dropbox_action=login&session=' + session, '_blank');
            pollForTokens(session);
        }

        async function handleOAuthCode(code, verifier) {
            try {
                const body = new URLSearchParams({
                    code: code,
                    grant_type: 'authorization_code',
                    client_id: DROPBOX_CLIENT_ID,
                    redirect_uri: REDIRECT_URI,
                    code_verifier: verifier
                });
                const resp = await fetch('https://api.dropboxapi.com/oauth2/token', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                    body: body
                });
                if (!resp.ok) throw new Error('Token exchange failed');
                const data = await resp.json();
                const tokens = {
                    access_token: data.access_token,
                    refresh_token: data.refresh_token,
                    expires_at: Date.now() + data.expires_in * 1000
                };
                setDropboxTokens(tokens);
                window.showMessage('Dropbox connected!');
            } catch (err) {
                window.showMessage('OAuth error: ' + err.message, true);
            }
        }

        async function handleOAuthRedirect() {
            const params = new URLSearchParams(window.location.search);
            const code = params.get('code');
            const verifier = sessionStorage.getItem('code_verifier');
            if (code && verifier) {
                window.history.replaceState({}, document.title, window.location.pathname);
                sessionStorage.removeItem('code_verifier');
                await handleOAuthCode(code, verifier);
                return;
            }
        }

        async function uploadBackup() {
            const token = await getValidAccessToken();
            if (!token) {
                showConfirmPopup('Dropbox', 'Not connected. Do you want to connect to your Dropbox first?', () => {
                    authenticateDropbox();
                });
                return;
            }
            const notif = window.createTimerNotification('Cloud Backup', 100);
            const progressBar = notif.wrapper.querySelector('.timer-progress-bar-notif');
            const timeElement = notif.wrapper.querySelector('.timer-time-notif');
            if (progressBar) progressBar.style.width = '0%';
            if (timeElement) timeElement.textContent = '0%';
            let progress = 0;
            const interval = setInterval(() => {
                if (progress < 90) {
                    progress += Math.random() * 10 + 5;
                    if (progress > 90) progress = 90;
                    progressBar.style.width = progress + '%';
                    timeElement.textContent = Math.floor(progress) + '%';
                }
            }, 300);
            try {
                let meta = {};
                try {
                    meta = JSON.parse(localStorage.getItem(BACKUP_META_KEY) || '{}');
                } catch (e) {}
                const keys = getFilteredKeys();
                let uploadedCount = 0;
                for (let i = 0; i < keys.length; i++) {
                    const key = keys[i];
                    const value = localStorage.getItem(key);
                    if (value === null) continue;
                    const folder = getFolderForKey(key);
                    const path = `/${folder}/${key}.json`;
                    const currentSize = value.length;
                    if (meta[path] === currentSize) continue;
                    const resp = await fetch('https://content.dropboxapi.com/2/files/upload', {
                        method: 'POST',
                        headers: {
                            'Authorization': `Bearer ${token}`,
                            'Dropbox-API-Arg': JSON.stringify({ path: path, mode: 'overwrite' }),
                            'Content-Type': 'application/octet-stream'
                        },
                        body: value
                    });
                    if (!resp.ok) {
                        const errText = await resp.text();
                        throw new Error(`Upload failed for ${key}: ${errText}`);
                    }
                    meta[path] = currentSize;
                    uploadedCount++;
                }
                try {
                    const db = await openImagesDB();
                    const images = await new Promise((resolve, reject) => {
                        const tx = db.transaction(IMAGES_STORE_NAME, 'readonly');
                        const store = tx.objectStore(IMAGES_STORE_NAME);
                        const req = store.getAll();
                        req.onsuccess = () => resolve(req.result || []);
                        req.onerror = () => reject(req.error);
                    });
                    for (const img of images) {
                        const path = '/Journal/Images/' + img.id + '.json';
                        const content = JSON.stringify(img);
                        const resp = await fetch('https://content.dropboxapi.com/2/files/upload', {
                            method: 'POST',
                            headers: {
                                'Authorization': `Bearer ${token}`,
                                'Dropbox-API-Arg': JSON.stringify({ path: path, mode: 'overwrite' }),
                                'Content-Type': 'application/octet-stream'
                            },
                            body: content
                        });
                        if (!resp.ok) {
                            const errText = await resp.text();
                            throw new Error(`Upload failed for image ${img.id}: ${errText}`);
                        }
                        meta[path] = content.length;
                    }
                } catch (e) {
                    throw new Error('Image upload failed: ' + e.message);
                }
                localStorage.setItem(BACKUP_META_KEY, JSON.stringify(meta));
                localStorage.setItem('lastCloudBackupDate', new Date().toLocaleDateString('en-US', { month: 'short', day: 'numeric' }));
                clearInterval(interval);
                progressBar.style.width = '100%';
                timeElement.textContent = '100%';
                setTimeout(() => notif.close(), 1500);
                window.showMessage(`Backup complete. ${uploadedCount} files updated.`);
            } catch (err) {
                clearInterval(interval);
                notif.close();
                window.showMessage('Upload error: ' + err.message, true);
            }
        }

        async function downloadAndRestore() {
            const token = await getValidAccessToken();
            if (!token) {
                showConfirmPopup('Dropbox', 'Not connected. Do you want to connect to your Dropbox first?', () => {
                    authenticateDropbox();
                });
                return;
            }
            showConfirmPopup('Restore', 'Restore all cloud data? Current data will be overwritten.', async () => {
                const notif = window.createTimerNotification('Cloud Restore', 100);
                const progressBar = notif.wrapper.querySelector('.timer-progress-bar-notif');
                const timeElement = notif.wrapper.querySelector('.timer-time-notif');
                if (progressBar) progressBar.style.width = '0%';
                if (timeElement) timeElement.textContent = '0%';
                let progress = 0;
                const interval = setInterval(() => {
                    if (progress < 90) {
                        progress += Math.random() * 10 + 5;
                        if (progress > 90) progress = 90;
                        progressBar.style.width = progress + '%';
                        timeElement.textContent = Math.floor(progress) + '%';
                    }
                }, 300);
                try {
                    let allFiles = [];
                    let hasMore = true;
                    let cursor = null;
                    while (hasMore) {
                        const payload = cursor ? { cursor } : { path: '', recursive: true };
                        const listResp = await fetch('https://api.dropboxapi.com/2/files/list_folder' + (cursor ? '/continue' : ''), {
                            method: 'POST',
                            headers: {
                                'Authorization': `Bearer ${token}`,
                                'Content-Type': 'application/json'
                            },
                            body: JSON.stringify(payload)
                        });
                        if (!listResp.ok) throw new Error('Failed to list backup files');
                        const data = await listResp.json();
                        const entries = data.entries.filter(e => e['.tag'] === 'file' && e.name.endsWith('.json'));
                        allFiles = allFiles.concat(entries);
                        hasMore = data.has_more;
                        cursor = data.cursor;
                    }
                    if (allFiles.length === 0) {
                        clearInterval(interval);
                        notif.close();
                        window.showMessage('No backup files found.', true);
                        return;
                    }
                    for (let i = 0; i < allFiles.length; i++) {
                        const file = allFiles[i];
                        const key = file.name.replace(/\.json$/, '');
                        const dlResp = await fetch('https://content.dropboxapi.com/2/files/download', {
                            method: 'POST',
                            headers: {
                                'Authorization': `Bearer ${token}`,
                                'Dropbox-API-Arg': JSON.stringify({ path: file.path_lower })
                            }
                        });
                        if (!dlResp.ok) throw new Error(`Download failed for ${key}`);
                        const content = await dlResp.text();
                        localStorage.setItem(key, content);
                    }
                    const imageFiles = allFiles.filter(f => f.path_lower.startsWith('/journal/images/'));
                    if (imageFiles.length > 0) {
                        const db = await openImagesDB();
                        const clearTx = db.transaction(IMAGES_STORE_NAME, 'readwrite');
                        clearTx.objectStore(IMAGES_STORE_NAME).clear();
                        await new Promise((resolve, reject) => {
                            clearTx.oncomplete = resolve;
                            clearTx.onerror = reject;
                        });
                        const tx = db.transaction(IMAGES_STORE_NAME, 'readwrite');
                        const store = tx.objectStore(IMAGES_STORE_NAME);
                        for (const file of imageFiles) {
                            const dlResp = await fetch('https://content.dropboxapi.com/2/files/download', {
                                method: 'POST',
                                headers: {
                                    'Authorization': `Bearer ${token}`,
                                    'Dropbox-API-Arg': JSON.stringify({ path: file.path_lower })
                                }
                            });
                            if (!dlResp.ok) throw new Error(`Download failed for image ${file.name}`);
                            const content = await dlResp.text();
                            const imgData = JSON.parse(content);
                            store.put(imgData);
                        }
                        await new Promise((resolve, reject) => {
                            tx.oncomplete = resolve;
                            tx.onerror = reject;
                        });
                    }
                    clearInterval(interval);
                    progressBar.style.width = '100%';
                    timeElement.textContent = '100%';
                    setTimeout(() => notif.close(), 1500);
                    window.showMessage(`Restore complete! ${allFiles.length} items restored.`);
                    initialize();
                } catch (err) {
                    clearInterval(interval);
                    notif.close();
                    window.showMessage('Restore error: ' + err.message, true);
                }
            });
        }

            const listContainer = document.getElementById('folderList');
            const allKeys = getFilteredKeys();
            const folderCounts = {};
            folderDefinitions.forEach(def => {
                const count = allKeys.filter(key => getFolderForKey(key) === def.name).length;
                if (count > 0) folderCounts[def.name] = count;
            });

            let folders = Object.keys(folderCounts);
            if (filterText) {
                folders = folders.filter(name => name.toLowerCase().includes(filterText));
            }
            folders.sort();

            listContainer.innerHTML = folders.map(name => {
                const count = folderCounts[name];
                return `
                    <div class="folder-card" data-folder="${name}">
                        <div class="folder-card-left">
                            <div class="folder-card-name">${name}</div>
                            <div class="folder-card-count">${count} Data</div>
                        </div>
                        <span class="arrow-circle"><i class="fas fa-arrow-right"></i></span>
                    </div>
                `;
            }).join('');

            document.querySelectorAll('.folder-card').forEach(card => {
                card.onclick = () => {
                    const folderName = card.dataset.folder;
                    if (!tempFolders.includes(folderName)) {
                        tempFolders.push(folderName);
                        const foldersEl = document.getElementById('folders');
                        foldersEl.innerHTML = '';
                    }
                    currentFolder = folderName;
                    allPage = 0;
                    closeFoldersPopup();
                    buildFolders();
                    buildCards();
                };
            });
        }

        async function localBackup() {
            const progress = startProgressNotification();
            const backup = {};
            for (let i = 0; i < localStorage.length; i++) {
                const key = localStorage.key(i);
                if (!excludedKeys.includes(key)) backup[key] = localStorage.getItem(key);
            }
            try {
                const db = await openImagesDB();
                const images = await new Promise((resolve, reject) => {
                    const tx = db.transaction(IMAGES_STORE_NAME, 'readonly');
                    const store = tx.objectStore(IMAGES_STORE_NAME);
                    const req = store.getAll();
                    req.onsuccess = () => resolve(req.result || []);
                    req.onerror = () => reject(req.error);
                });
                if (images.length > 0) {
                    backup['__indexeddb_journal_images__'] = images;
                }
            } catch (e) {}
            const json = JSON.stringify(backup, null, 2);
            const filename = `kakoikiraku_local_backup_${new Date().toISOString().slice(0,10)}.json`;
            const mimeType = 'application/json';
            await saveFile(json, filename, mimeType);
            progress.complete();
        }

        function localRestore() {
            const input = document.createElement('input');
            input.type = 'file';
            input.accept = '.json';
            input.onchange = async (e) => {
                const file = e.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = async (event) => {
                    try {
                        const data = JSON.parse(event.target.result);
                        const imageData = data['__indexeddb_journal_images__'];
                        if (imageData && Array.isArray(imageData)) {
                            const db = await openImagesDB();
                            const clearTx = db.transaction(IMAGES_STORE_NAME, 'readwrite');
                            clearTx.objectStore(IMAGES_STORE_NAME).clear();
                            await new Promise((resolve, reject) => {
                                clearTx.oncomplete = resolve;
                                clearTx.onerror = reject;
                            });
                            const tx = db.transaction(IMAGES_STORE_NAME, 'readwrite');
                            const store = tx.objectStore(IMAGES_STORE_NAME);
                            for (const item of imageData) {
                                store.put(item);
                            }
                            await new Promise((resolve, reject) => {
                                tx.oncomplete = resolve;
                                tx.onerror = reject;
                            });
                            delete data['__indexeddb_journal_images__'];
                        }
                        showConfirmPopup('Local Restore', `Restore ${Object.keys(data).length} items? Current data will be overwritten.`, () => {
                            for (const [key, value] of Object.entries(data)) {
                                localStorage.setItem(key, value);
                            }
                            window.showMessage('Local restore complete');
                            initialize();
                        });
                    } catch (err) {
                        window.showMessage('Invalid backup file', true);
                    }
                };
                reader.readAsText(file);
            };
            input.click();
        }

        async function deleteBackups() {
            const token = await getValidAccessToken();
            if (!token) {
                showConfirmPopup('Dropbox', 'Not connected. Do you want to connect to your Dropbox first?', authenticateDropbox);
                return;
            }
            showConfirmPopup('Delete Backups', 'Delete all backups in Dropbox folder? This cannot be undone.', async () => {
                const progress = startProgressNotification();
                try {
                    let hasMore = true;
                    let cursor = null;
                    while (hasMore) {
                        const listPayload = cursor ? { cursor } : { path: '', recursive: true };
                        const listResp = await fetch('https://api.dropboxapi.com/2/files/list_folder' + (cursor ? '/continue' : ''), {
                            method: 'POST',
                            headers: {
                                'Authorization': `Bearer ${token}`,
                                'Content-Type': 'application/json'
                            },
                            body: JSON.stringify(listPayload)
                        });
                        if (!listResp.ok) throw new Error('Failed to list files');
                        const data = await listResp.json();
                        const entries = data.entries.filter(e => e['.tag'] === 'file');
                        for (let entry of entries) {
                            await fetch('https://api.dropboxapi.com/2/files/delete_v2', {
                                method: 'POST',
                                headers: {
                                    'Authorization': `Bearer ${token}`,
                                    'Content-Type': 'application/json'
                                },
                                body: JSON.stringify({ path: entry.path_lower })
                            });
                        }
                        hasMore = data.has_more;
                        cursor = data.cursor;
                    }
                    localStorage.removeItem(BACKUP_META_KEY);
                    progress.complete();
                    window.showMessage('All backups deleted. Creating a fresh backup...');
                    await uploadBackup();
                } catch (err) {
                    progress.error();
                    window.showMessage('Delete backups error: ' + err.message, true);
                }
            });
        }

        function logoutDropbox() {
            clearDropboxTokens();
            window.showMessage('Dropbox disconnected');
            closeUniversalPopup();
            openSettingsPopup();
        }

        function openSettingsPopup() {
            const popup = document.getElementById('universalPopup');
            const title = document.getElementById('popupTitle');
            const content = document.getElementById('popupContent');
            const tokens = getDropboxTokens();
            const isConnected = !!tokens;
            const lastBackupDate = localStorage.getItem('lastCloudBackupDate') || '';

            title.textContent = 'Settings';
            content.innerHTML = `
                <div style="display: flex; flex-direction: column; gap: 12px;">
                    <div class="cloud-status-line">
                        <span class="cloud-status-text">Cloud — <span class="cloud-status-connected">${isConnected ? 'Connected' : 'Not connected'}</span></span>
                        ${isConnected && lastBackupDate ? `<span class="cloud-status-date">${lastBackupDate}</span>` : ''}
                    </div>
                    <div class="button-row">
                        <button class="action-btn btn-backup" id="popupCloudBackup"><i class="fas fa-cloud-upload-alt"></i> Backup</button>
                        <button class="action-btn btn-restore" id="popupCloudRestore"><i class="fas fa-cloud-download-alt"></i> Restore</button>
                    </div>
                    <h3>Local</h3>
                    <div class="button-row">
                        <button class="action-btn btn-backup" id="popupLocalBackup"><i class="fas fa-download"></i> Backup</button>
                        <button class="action-btn btn-restore" id="popupLocalRestore"><i class="fas fa-upload"></i> Restore</button>
                    </div>
                    <h3>Danger Zone</h3>
                    <button class="clear-all-btn" id="popupResetAppData"><i class="fas fa-trash-alt"></i> Reset App Data</button>
                    <button class="clear-all-btn" id="popupDeleteBackups"><i class="fas fa-trash"></i> Delete Backups</button>
                    <button class="clear-all-btn" id="popupDropboxLogout"><i class="fas fa-sign-out" style="color:white;"></i> Dropbox Logout</button>
                    <h3>Notes</h3>
                    <div class="guide-box">
                        <p><strong>Cloud Details</strong></p>
                        <p style="font-size: 0.8rem;">Cloud Backups and Restore are using Dropbox Storage with OAuth app that i made myself (no third-party used except Dropbox), and nothing i collects or see from your Dropbox except Kakoi Kiraku folder.</p>
                    </div>
                    <div class="guide-box">
                        <p><strong>Delete Backups</strong></p>
                        <p style="font-size: 0.8rem;">Delete Backups button will clear all the backed up JSON files inside your Dropbox entirely.</p>
                    </div>
                </div>
            `;
            document.getElementById('popupCloudBackup').addEventListener('click', () => {
                closeUniversalPopup();
                uploadBackup();
            });
            document.getElementById('popupCloudRestore').addEventListener('click', () => {
                closeUniversalPopup();
                downloadAndRestore();
            });
            document.getElementById('popupLocalBackup').addEventListener('click', () => {
                closeUniversalPopup();
                localBackup();
            });
            document.getElementById('popupLocalRestore').addEventListener('click', () => {
                closeUniversalPopup();
                localRestore();
            });
            document.getElementById('popupResetAppData').addEventListener('click', () => {
                closeUniversalPopup();
                showConfirmPopup('Reset App Data', 'Clear all LocalStorage? This will clear all app data and log you out immediately. It cannot be undone.', () => {
                    localStorage.clear();
                    location.reload();
                });
            });
            document.getElementById('popupDeleteBackups').addEventListener('click', () => {
                closeUniversalPopup();
                deleteBackups();
            });
            document.getElementById('popupDropboxLogout').addEventListener('click', () => {
                showConfirmPopup('Dropbox Logout', 'Disconnect Dropbox OAuth? You will need to reconnect to use cloud features.', () => {
                    logoutDropbox();
                });
            });
            popup.style.display = 'flex';
        }

        function startProgressNotification() {
            return {
                complete: () => {},
                error: () => {}
            };
        }

        document.getElementById('settingsBtn').addEventListener('click', () => openSettingsPopup());

        let searchTimeout;
        function setupSearchDebounce() {
            const searchInput = document.getElementById('globalSearch');
            const suggestionsContainer = document.getElementById('searchSuggestions');
            if (searchInput) {
                searchInput.addEventListener('input', function() {
                    clearTimeout(searchTimeout);
                    showSearchSuggestions(this.value);
                });
                document.getElementById('searchIcon').addEventListener('click', function() {
                    suggestionsContainer.style.display = 'none';
                });
                searchInput.addEventListener('keypress', function(event) {
                    if (event.key === 'Enter') {
                        suggestionsContainer.style.display = 'none';
                    }
                });
                searchInput.addEventListener('focus', function() {
                    if (this.value.trim()) {
                        showSearchSuggestions(this.value);
                    }
                });
                document.addEventListener('click', function(event) {
                    if (!searchInput.contains(event.target) && !suggestionsContainer.contains(event.target)) {
                        suggestionsContainer.style.display = 'none';
                    }
                });
                suggestionsContainer.addEventListener('click', function(event) {
                    const suggestionItem = event.target.closest('.search-suggestion-item');
                    if (suggestionItem) {
                        const key = suggestionItem.dataset.key;
                        if (key) {
                            searchInput.value = key;
                            suggestionsContainer.style.display = 'none';
                            const folder = getFolderForKey(key);
                            if (folder !== currentFolder) {
                                currentFolder = folder;
                                allPage = 0;
                                buildFolders();
                                buildCards();
                            } else {
                                buildCards();
                            }
                            setTimeout(() => {
                                const cards = document.querySelectorAll('.storage-card');
                                for (let card of cards) {
                                    const keyEl = card.querySelector('.storage-key');
                                    if (keyEl && keyEl.textContent.trim() === (key.length > 50 ? key.substring(0, 50) + '...' : key)) {
                                        card.style.borderColor = 'var(--accent-color)';
                                        card.style.borderWidth = '2px';
                                        card.scrollIntoView({ behavior: 'smooth', block: 'center' });
                                        setTimeout(() => {
                                            card.style.borderColor = 'rgba(255, 255, 255, 0.05)';
                                            card.style.borderWidth = '1px';
                                        }, 2000);
                                        break;
                                    }
                                }
                            }, 100);
                        }
                    }
                });
                document.addEventListener('keydown', function(event) {
                    if (event.key === 'Escape' && suggestionsContainer.style.display === 'block') {
                        suggestionsContainer.style.display = 'none';
                    }
                });
            }
        }

        function showSearchSuggestions(searchTerm) {
            const suggestionsContainer = document.getElementById('searchSuggestions');
            if (!searchTerm.trim()) {
                suggestionsContainer.style.display = 'none';
                return;
            }
            let allKeys = getFilteredKeys();
            const term = searchTerm.toLowerCase();
            const matches = allKeys.filter(key => {
                let val = localStorage.getItem(key);
                if (key === 'currentUser') {
                    try {
                        let user = JSON.parse(val);
                        if (user && typeof user === 'object') {
                            const { admin, ...cleanUser } = user;
                            val = JSON.stringify(cleanUser);
                        }
                    } catch (e) {}
                }
                return key.toLowerCase().includes(term) || val.toLowerCase().includes(term);
            }).slice(0, 7);
            if (matches.length === 0) {
                suggestionsContainer.innerHTML = `<div class="search-suggestion-item"><div class="suggestion-title">No results found</div><div class="suggestion-description">Try different keywords</div></div>`;
            } else {
                suggestionsContainer.innerHTML = matches.map(key => {
                    const folder = getFolderForKey(key);
                    let val = localStorage.getItem(key) || '';
                    if (key === 'currentUser') {
                        try {
                            let user = JSON.parse(val);
                            if (user && typeof user === 'object') {
                                const { admin, ...cleanUser } = user;
                                val = JSON.stringify(cleanUser);
                            }
                        } catch (e) {}
                    }
                    const snippet = val.length > 50 ? val.substring(0, 50) + '\u2026' : val;
                    return `
                        <div class="search-suggestion-item" data-key="${key}">
                            <div class="suggestion-title">${key}</div>
                            <div class="suggestion-description">${snippet}</div>
                            <div class="suggestion-category">${folder}</div>
                        </div>
                    `;
                }).join('');
            }
            suggestionsContainer.style.display = 'block';
        }

        setupSearchDebounce();
        initialize();
    </script>
</body>
</html>
