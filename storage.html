<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Storage | lildavegoth</title>
    <meta name="color-scheme" content="dark">
    <script src="protections.js"></script>
    <script src="notification.cssjs"></script>
    <link rel="stylesheet" href="media.css">
    <link rel="stylesheet" href="navigation.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --accent-color: #C1FC32;
            --accent-dark: #9bc726;
            --bg-black: #000000;
            --bg-dark: #1a1a1a;
            --bg-card: rgba(30, 30, 30, 0.7);
            --text-primary: #f5f5f7;
            --text-secondary: #a1a1a6;
            --radius-small: 12px;
            --radius-medium: 20px;
            --radius-large: 28px;
            --spacing-xs: 8px;
            --spacing-sm: 16px;
            --spacing-md: 24px;
            --spacing-lg: 32px;
            --spacing-xl: 48px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        body {
            background: var(--bg-black);
            color: var(--text-primary);
            min-height: 100vh;
            padding: 40px 20px 100px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: var(--spacing-xs);
        }

        .header {
            display: flex;
            align-items: center;
            margin-bottom: 30px;
            gap: 15px;
        }

        .avatar {
            width: 50px;
            height: 50px;
            background: #333;
            background-size: cover;
            background-position: center;
            border-radius: 50%;
            cursor: pointer;
            flex-shrink: 0;
        }

        .user-section {
            display: flex;
            align-items: center;
            flex-grow: 1;
            gap: 15px;
        }

        .username {
            font-size: 1.8rem;
            font-weight: 700;
            cursor: pointer;
        }

        .app-header {
            padding: var(--spacing-lg) 0;
            margin-bottom: var(--spacing-md);
        }

        .app-name {
            font-size: 2rem;
            font-weight: 700;
            color: #ffffff;
            margin-bottom: 4px;
        }

        .tagline {
            color: var(--text-secondary);
            font-size: 1rem;
        }

        .clear-btn {
            background: transparent;
            border: none;
            color: var(--text-primary);
            font-size: 1rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            flex-shrink: 0;
        }

        .search-bar {
            margin-bottom: 30px;
        }

        .search-bar input {
            width: 100%;
            padding: 16px 24px;
            border-radius: 30px;
            border: none;
            background: rgba(255, 255, 255, 0.12);
            color: var(--text-primary);
            font-size: 1rem;
            border: 1px solid rgba(255, 255, 255, 0.15);
        }

        .search-bar input:focus {
            outline: none;
            border-color: var(--accent-color);
            background: rgba(255, 255, 255, 0.15);
        }

        .search-bar input::placeholder {
            color: var(--text-secondary);
        }

        .folders {
            display: flex;
            gap: 12px;
            overflow-x: auto;
            padding-bottom: 10px;
            margin-bottom: 30px;
        }

        .folder-btn {
            background: #222;
            color: #aaa;
            padding: 10px 20px;
            border-radius: 30px;
            border: none;
            cursor: pointer;
            white-space: nowrap;
            font-size: 1rem;
        }

        .folder-btn.active {
            background: var(--accent-color);
            color: #000;
        }

        .items-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 40px;
        }

        #itemsCount {
            font-size: 1.2rem;
        }

        .folder-pill {
            background: var(--accent-color);
            color: #000;
            padding: 10px 24px;
            border-radius: 30px;
            font-weight: 600;
        }

        .storage-container {
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        .storage-card {
            position: relative;
            background: var(--bg-card);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: var(--radius-large);
            padding: var(--spacing-sm);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
            width: 100%;
            max-width: 100%;
            box-sizing: border-box;
        }

        .card-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 10px;
        }

        .tag-and-delete {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .storage-tag {
            background: rgba(255, 255, 255, 0.1);
            padding: 6px 16px;
            border-radius: 30px;
            font-size: 0.9rem;
        }

        .delete-btn {
            background: transparent;
            border: none;
            color: var(--text-secondary);
            font-size: 1rem;
            cursor: pointer;
            padding: 6px;
            opacity: 0.7;
            border-radius: 50%;
            width: 34px;
            height: 34px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .delete-btn:hover {
            background: rgba(255, 255, 255, 0.1);
            opacity: 1;
        }

        .storage-key {
            font-size: 1.6rem;
            font-weight: 700;
            margin: 20px 0 12px;
            padding-right: 50px;
        }

        .storage-value {
            font-size: 0.95rem;
            line-height: 1.5;
            max-height: 120px;
            overflow-y: auto;
            margin-bottom: var(--spacing-sm);
            white-space: pre-wrap;
            word-break: break-all;
        }

        .card-footer {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .due {
            font-size: 0.95rem;
            opacity: 0.8;
        }

        .progress {
            width: 100%;
            height: 10px;
            background: #222;
            border-radius: 20px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: var(--accent-color);
            border-radius: 20px;
        }

        input[type="file"] {
            display: none;
        }

        footer {
            margin-bottom: -150px;
        }

        .social-links {
            display: flex;
            gap: 15px;
            margin-bottom: 10px;
        }
        
        .storage-key {
            word-break: break-word;
            overflow-wrap: break-word;
            max-width: 100%;
            font-size: 1.6rem;
            font-weight: 700;
            margin: 20px 0 12px;
            padding-right: 50px;
        }
        
        .storage-value {
            word-break: break-word;
            overflow-wrap: break-word;
            max-width: 100%;
            font-size: 0.95rem;
            line-height: 1.5;
            max-height: 120px;
            overflow-y: auto;
            margin-bottom: var(--spacing-sm);
            white-space: pre-wrap;
        }
        
        .pin-btn {
            background: transparent;
            border: none;
            color: var(--text-secondary);
            cursor: pointer;
            font-size: 1.2rem;
            padding: 6px;
            border-radius: 50%;
            width: 34px;
            height: 34px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .pin-btn:hover {
            background: rgba(255, 255, 255, 0.1);
        }
        
        .card-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 10px;
        }
        
        .tag-and-delete {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        
    </style>
</head>
<body>
    <div class="container">
        <a href="index.html" class="back-link fade-in">
            <i class="fas fa-arrow-left"></i> Back to Home
        </a>

        <header style="margin-bottom: 50px;" class="fade-in">
            <div>
                <h1 class="app-name">Storage</h1>
                <p class="tagline">Access to all database on Kakoi Kiraku Home pages to clear specific pages data for your account.</p>
            </div>
        </header>

        <div class="header">
            <div class="user-section">
                <div class="avatar" id="avatar"></div>
                <div class="username" id="username">User</div>
            </div>
            <button class="clear-btn" style="color: red; margin-right: -10px;" onclick="if(confirm('Clear all LocalStorage? This cannot be undone.')){localStorage.clear();location.reload();}">
                <i class="fas fa-trash-alt"></i>
            </button>
            <button id="dropboxBackupBtn" class="clear-btn" style="color: var(--accent-color); margin-left: 10px;" title="Backup to Dropbox">
                <i class="fas fa-cloud-upload-alt"></i>
            </button>
            <button id="dropboxRestoreBtn" class="clear-btn" style="color: var(--accent-color);" title="Restore from Dropbox">
                <i class="fas fa-cloud-download-alt"></i>
            </button>
            <span id="dropboxStatus" style="font-size:0.9rem; color:var(--text-secondary); margin-left:10px;"></span>
        </div>

        <div class="search-bar">
            <input type="text" id="searchInput" placeholder="Search keys or values...">
        </div>

        <div class="folders" id="folders"></div>

        <div class="items-info">
            <div id="itemsCount">0 data stored</div>
            <div class="folder-pill" id="folderPill">All</div>
        </div>

        <div class="storage-container" id="storageContainer"></div>

        <input type="file" id="avatarInput" accept="image/*">

        <footer>
            <div class="social-links">
                <a href="https://twitter.com/lildavegoth"><span class="icon icon-twitter"></span></a>
                <a href="https://instagram.com/dave_goth"><span class="icon icon-instagram"></span></a>
            </div>
            <p>© 2026 lildavegoth | Storage</p>
            <p style="margin-top: 8px; font-size: 0.8rem; color: #666;">
                Conveys the Idea of a Protected and Inspiring Space for Creative Expression.
            </p>
        </footer>
    </div>
    
    <script>
        let currentFolder = 'All';
        let pinnedItems = JSON.parse(localStorage.getItem('pinnedItems') || '[]');
    
        const avatar = document.getElementById('avatar');
        const avatarInput = document.getElementById('avatarInput');
        const usernameEl = document.getElementById('username');
    
        let username = localStorage.getItem('username') || 'User';
        usernameEl.textContent = username;
    
        let savedAvatar = localStorage.getItem('avatar');
        if (savedAvatar) avatar.style.backgroundImage = `url(${savedAvatar})`;
    
        avatar.onclick = () => avatarInput.click();
    
        avatarInput.onchange = (e) => {
            if (e.target.files[0]) {
                let reader = new FileReader();
                reader.onload = (ev) => {
                    let data = ev.target.result;
                    localStorage.setItem('avatar', data);
                    avatar.style.backgroundImage = `url(${data})`;
                };
                reader.readAsDataURL(e.target.files[0]);
            }
        };
    
        usernameEl.onclick = () => {
            let input = document.createElement('input');
            input.type = 'text';
            input.value = username;
            usernameEl.textContent = '';
            usernameEl.appendChild(input);
            input.focus();
            input.select();
            input.onblur = () => {
                username = input.value.trim() || 'User';
                localStorage.setItem('username', username);
                usernameEl.textContent = username;
            };
            input.onkeydown = (e) => {
                if (e.key === 'Enter') input.blur();
            };
        };
        
        // ==================== DROPBOX SYNC ====================
        const DROPBOX_CLIENT_ID = '5630n4t14l8r80h';
        const REDIRECT_URI = window.location.origin + window.location.pathname;
        const DROPBOX_TOKEN_KEY = 'dropbox_tokens';
        
        function showMsg(msg, isError = false) {
            if (window.showMessage) window.showMessage(msg, isError ? 'error' : 'success');
            else alert(msg);
        }
        
        function getDropboxTokens() {
            const t = localStorage.getItem(DROPBOX_TOKEN_KEY);
            return t ? JSON.parse(t) : null;
        }
        function setDropboxTokens(tokens) {
            localStorage.setItem(DROPBOX_TOKEN_KEY, JSON.stringify(tokens));
        }
        function clearDropboxTokens() {
            localStorage.removeItem(DROPBOX_TOKEN_KEY);
        }
        
        async function getValidAccessToken() {
            let tokens = getDropboxTokens();
            if (!tokens) return null;
        
            if (tokens.expires_at && Date.now() < tokens.expires_at - 300000) {
                return tokens.access_token;
            }
        
            if (tokens.refresh_token) {
                try {
                    const newTokens = await refreshAccessToken(tokens.refresh_token);
                    setDropboxTokens(newTokens);
                    return newTokens.access_token;
                } catch (e) {
                    clearDropboxTokens();
                    return null;
                }
            }
            return null;
        }
        
        async function refreshAccessToken(refreshToken) {
            const body = new URLSearchParams({
                grant_type: 'refresh_token',
                refresh_token: refreshToken,
                client_id: DROPBOX_CLIENT_ID,
            });
            const resp = await fetch('https://api.dropboxapi.com/oauth2/token', {
                method: 'POST',
                headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                body: body
            });
            if (!resp.ok) throw new Error('Refresh failed');
            const data = await resp.json();
            return {
                access_token: data.access_token,
                expires_at: Date.now() + data.expires_in * 1000,
                refresh_token: refreshToken
            };
        }
        
        async function authenticateDropbox() {
            const verifier = generateCodeVerifier();
            const challenge = await generateCodeChallenge(verifier);
            sessionStorage.setItem('code_verifier', verifier);
        
            const authUrl = 'https://www.dropbox.com/oauth2/authorize?' + new URLSearchParams({
                client_id: DROPBOX_CLIENT_ID,
                response_type: 'code',
                redirect_uri: REDIRECT_URI,
                code_challenge_method: 'S256',
                code_challenge: challenge,
                token_access_type: 'offline'
            });
            window.location.href = authUrl;
        }
        
        function generateCodeVerifier() {
            const array = new Uint8Array(32);
            crypto.getRandomValues(array);
            return base64URLEncode(array);
        }
        async function generateCodeChallenge(verifier) {
            const encoder = new TextEncoder();
            const data = encoder.encode(verifier);
            const digest = await crypto.subtle.digest('SHA-256', data);
            return base64URLEncode(new Uint8Array(digest));
        }
        function base64URLEncode(buffer) {
            return btoa(String.fromCharCode(...new Uint8Array(buffer)))
                .replace(/\+/g, '-')
                .replace(/\//g, '_')
                .replace(/=/g, '');
        }
        
        async function handleOAuthRedirect() {
            const params = new URLSearchParams(window.location.search);
            const code = params.get('code');
            const verifier = sessionStorage.getItem('code_verifier');
            if (code && verifier) {
                window.history.replaceState({}, document.title, window.location.pathname);
                sessionStorage.removeItem('code_verifier');
        
                try {
                    const body = new URLSearchParams({
                        code: code,
                        grant_type: 'authorization_code',
                        client_id: DROPBOX_CLIENT_ID,
                        redirect_uri: REDIRECT_URI,
                        code_verifier: verifier
                    });
                    const resp = await fetch('https://api.dropboxapi.com/oauth2/token', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                        body: body
                    });
                    if (!resp.ok) throw new Error('Token exchange failed');
                    const data = await resp.json();
                    const tokens = {
                        access_token: data.access_token,
                        refresh_token: data.refresh_token,
                        expires_at: Date.now() + data.expires_in * 1000
                    };
                    setDropboxTokens(tokens);
                    showMsg('Dropbox connected!');
                } catch (err) {
                    showMsg('OAuth error: ' + err.message, true);
                }
            }
        }
        
        async function uploadBackup() {
            const token = await getValidAccessToken();
            if (!token) {
                if (confirm('Not connected to Dropbox. Connect now?')) authenticateDropbox();
                return;
            }
        
            const exclude = ['username', 'avatar', 'dropbox_tokens', 'pinnedItems', 
                             'giveaway_settings', 'giveaway_participants', 'lastGiveawayWinner',
                             'app_hash_v2', 'app_salt_v2'];
            const backup = {};
            for (let i = 0; i < localStorage.length; i++) {
                const key = localStorage.key(i);
                if (!exclude.includes(key)) {
                    backup[key] = localStorage.getItem(key);
                }
            }
        
            const content = JSON.stringify(backup, null, 2);
            const fileName = `webapp_backup_${new Date().toISOString().slice(0,10)}.json`;
        
            try {
                const resp = await fetch('https://content.dropboxapi.com/2/files/upload', {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Dropbox-API-Arg': JSON.stringify({
                            path: '/' + fileName,
                            mode: 'overwrite',
                            autorename: false,
                            mute: false
                        }),
                        'Content-Type': 'application/octet-stream'
                    },
                    body: content
                });
        
                if (!resp.ok) {
                    const errorBody = await resp.text();
                    throw new Error(`Dropbox API error (${resp.status}): ${errorBody}`);
                }
        
                showMsg(`Backup saved as ${fileName}`);
            } catch (err) {
                showMsg('Upload error: ' + err.message, true);
            }
        }
        
        async function downloadAndRestore() {
            const token = await getValidAccessToken();
            if (!token) {
                if (confirm('Not connected to Dropbox. Connect now?')) authenticateDropbox();
                return;
            }
        
            try {
                const listResp = await fetch('https://api.dropboxapi.com/2/files/list_folder', {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ path: '', recursive: false })
                });
                if (!listResp.ok) throw new Error('Failed to list files');
                const list = await listResp.json();
                const backups = list.entries
                    .filter(e => e.name.startsWith('webapp_backup_') && e.name.endsWith('.json'))
                    .sort((a, b) => b.server_modified.localeCompare(a.server_modified));
                if (backups.length === 0) {
                    showMsg('No backup files found.', true);
                    return;
                }
                const latest = backups[0].path_lower;
        
                const dlResp = await fetch('https://content.dropboxapi.com/2/files/download', {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Dropbox-API-Arg': JSON.stringify({ path: latest })
                    }
                });
                if (!dlResp.ok) throw new Error('Download failed');
                const backupData = await dlResp.json();
        
                if (!confirm(`Restore ${Object.keys(backupData).length} items? Current data will be overwritten.`)) return;
        
                for (const [key, value] of Object.entries(backupData)) {
                    localStorage.setItem(key, value);
                }
                showMsg('Restore complete! Refreshing view...');
                const {folders} = getData();
                buildFolders(folders);
                buildCards();
            } catch (err) {
                showMsg('Restore error: ' + err.message, true);
            }
        }
        
        async function updateDropboxStatus() {
            const statusSpan = document.getElementById('dropboxStatus');
            const tokens = getDropboxTokens();
            if (!tokens) {
                window.showMessage('Dropbox not connected');
                return;
            }
            const valid = await getValidAccessToken();
            if (valid) {
                window.showMessage('Dropbox connected');
            } else {
                window.showMessage('Dropbox expired');
                clearDropboxTokens();
            }
        }
        
        document.getElementById('dropboxBackupBtn').addEventListener('click', uploadBackup);
        document.getElementById('dropboxRestoreBtn').addEventListener('click', downloadAndRestore);
        
        handleOAuthRedirect().then(() => updateDropboxStatus());
    
        function getData() {
            let keys = [];
            const excludedKeys = ['username', 'avatar', 'giveaway_settings', 
                                   'giveaway_participants', 'giveawayParticipants', 
                                   'lastGiveawayWinner', 'giveawayData', 'showDescription', 
                                   'hideSettingsButton', 'showSearchBar', 'bodyPosition', 
                                   'showBanner', 'showQuickLinks', 'pinnedItems', 
                                   'app_hash_v2', 'app_salt_v2', 'dropbox_tokens'];
            
            for (let i = 0; i < localStorage.length; i++) {
                let k = localStorage.key(i);
                if (!excludedKeys.includes(k)) keys.push(k);
            }
            
            keys.sort((a, b) => a.localeCompare(b));
            
            let folders = new Set(['All']);
            keys.forEach(k => {
                let folderName = 'misc';
                if (k.includes('_')) {
                    folderName = k.split('_')[0];
                }
                folders.add(folderName);
            });
            
            let folderList = Array.from(folders);
            folderList.sort((a, b) => {
                if (a === 'All') return -1;
                if (b === 'All') return 1;
                return a.localeCompare(b);
            });
            
            return {keys, folders: folderList};
        }
        
        function savePinnedItems() {
            localStorage.setItem('pinnedItems', JSON.stringify(pinnedItems));
        }
        
        function togglePin(key) {
            if (pinnedItems.includes(key)) {
                pinnedItems = pinnedItems.filter(item => item !== key);
            } else {
                pinnedItems.push(key);
            }
            savePinnedItems();
            buildCards();
        }
        
        function isPinned(key) {
            return pinnedItems.includes(key);
        }
        
        function buildFolders(foldersList) {
            const foldersEl = document.getElementById('folders');
            foldersEl.innerHTML = '';
    
            foldersList.forEach(f => {
                let btn = document.createElement('button');
                btn.className = 'folder-btn';
                if (f === currentFolder) btn.classList.add('active');
                btn.textContent = f;
                btn.dataset.folder = f;
                btn.onclick = () => {
                    currentFolder = f;
                    document.querySelectorAll('.folder-btn').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    buildCards();
                };
                foldersEl.appendChild(btn);
            });
        }
        
        function getTotalStorageSize() {
            let total = 0;
            for (let i = 0; i < localStorage.length; i++) {
                let key = localStorage.key(i);
                let value = localStorage.getItem(key);
                total += key.length + value.length;
            }
            return total;
        }
        
        function formatSize(bytes) {
            if (bytes < 1024) return bytes + 'B';
            if (bytes < 1048576) return (bytes / 1024).toFixed(1) + 'KB';
            return (bytes / 1048576).toFixed(1) + 'MB';
        }
    
        function buildCards() {
            const search = document.getElementById('searchInput').value.toLowerCase();
            const {keys} = getData();
            
            let filtered = keys.filter(k => {
                let matchesFolder = true;
                if (currentFolder !== 'All') {
                    if (currentFolder === 'misc') {
                        matchesFolder = !k.includes('_');
                    } else {
                        matchesFolder = k.startsWith(currentFolder + '_');
                    }
                }
                
                let matchesSearch = k.toLowerCase().includes(search) || localStorage.getItem(k).toLowerCase().includes(search);
                return matchesFolder && matchesSearch;
            });
            
            filtered.sort((a, b) => {
                if (isPinned(a) && !isPinned(b)) return -1;
                if (!isPinned(a) && isPinned(b)) return 1;
                return 0;
            });
            
            const container = document.getElementById('storageContainer');
            container.innerHTML = '';
            
            const countEl = document.getElementById('itemsCount');
            let plural = filtered.length === 1 ? '' : 's';
            let totalSize = getTotalStorageSize();
            let formattedSize = formatSize(totalSize);
            countEl.textContent = `${filtered.length} item${plural} and ${formattedSize} used of total data stored`;
        
            const pill = document.getElementById('folderPill');
            pill.textContent = currentFolder;
            
            if (filtered.length === 0) {
                pill.style.background = '#333';
                pill.style.color = '#888';
                
                let card = document.createElement('div');
                card.className = 'storage-card';
                card.innerHTML = `
                    <div class="card-header">
                        <div class="tag-and-delete">
                            <div class="storage-tag">Empty</div>
                        </div>
                    </div>
                    <div class="storage-key">No items</div>
                    <div class="storage-value">No data in this folder.</div>
                    <div class="card-footer">
                        <div class="due">Length: 0</div>
                        <div class="progress"><div class="progress-fill" style="width:0%"></div></div>
                    </div>
                `;
                container.appendChild(card);
            } else {
                pill.style.background = 'var(--accent-color)';
                pill.style.color = '#000';
                
                filtered.forEach(key => {
                    let value = localStorage.getItem(key);
                    let displayValue = value;
                    let isJSON = false;
                    let isBase64 = false;
        
                    if (typeof value === 'string' && value.length > 500 && value.startsWith('data:image')) {
                        displayValue = '[Base64 Image] ' + value.substring(0, 40) + '...';
                        isBase64 = true;
                    } else {
                        try {
                            let parsed = JSON.parse(value);
                            if (typeof parsed === 'object' && parsed !== null) {
                                displayValue = JSON.stringify(parsed, null, 2);
                                if (displayValue.length > 300) {
                                    displayValue = displayValue.substring(0, 300) + '...';
                                }
                                isJSON = true;
                            }
                        } catch {
                            if (value.length > 300) {
                                displayValue = value.substring(0, 300) + '...';
                            }
                        }
                    }
        
                    let percent = value.length ? Math.min(100, Math.round((value.length / 500) * 100)) : 0;
        
                    let card = document.createElement('div');
                    card.className = 'storage-card';
                    card.innerHTML = `
                        <div class="card-header">
                            <div class="tag-and-delete">
                                <div class="storage-tag">${isBase64 ? 'Base64' : (isJSON ? 'JSON' : 'String')}</div>
                                <button class="delete-btn" data-key="${key}">
                                    <i class="fas fa-trash"></i>
                                </button>
                            </div>
                            <button class="pin-btn" data-key="${key}" style="background:transparent; border:none; color:${isPinned(key) ? 'var(--accent-color)' : 'var(--text-secondary)'}; cursor:pointer; font-size:1.2rem; margin-top:2px;">
                                <i class="fas fa-thumbtack"></i>
                            </button>
                        </div>
                        <div class="storage-key">${key.length > 50 ? key.substring(0, 50) + '...' : key}</div>
                        <div class="storage-value">${displayValue}</div>
                        <div class="card-footer">
                            <div class="due">Length: ${value.length}</div>
                            <div class="progress"><div class="progress-fill" style="width:${percent}%"></div></div>
                        </div>
                    `;
                    container.appendChild(card);
                    if (isPinned(key)) {
                        card.style.border = '1px solid var(--accent-color)';
                    }
                });
            }
            
            document.querySelectorAll('.delete-btn').forEach(btn => {
                btn.onclick = (e) => {
                    e.stopPropagation();
                    let k = btn.dataset.key;
                    if (confirm('Delete this item?')) {
                        localStorage.removeItem(k);
                        pinnedItems = pinnedItems.filter(item => item !== k);
                        savePinnedItems();
                        let {folders} = getData();
                        buildFolders(folders);
                        buildCards();
                        window.showMessage('Deleted successfully');
                    }
                };
            });
            
            document.querySelectorAll('.pin-btn').forEach(btn => {
                btn.onclick = (e) => {
                    e.stopPropagation();
                    let k = btn.dataset.key;
                    togglePin(k);
                };
            });
        }
        
        document.getElementById('searchInput').oninput = () => {
            buildCards();
        };
    
        let {folders} = getData();
        buildFolders(folders);
        buildCards();
    </script>
</body>
</html>
