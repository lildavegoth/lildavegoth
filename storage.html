<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Storage | lildavegoth</title>
    <meta name="color-scheme" content="dark">
    <script src="protections.js"></script>
    <script src="notification.cssjs"></script>
    <link rel="stylesheet" href="media.css">
    <link rel="stylesheet" href="navigation.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --accent-color: #C1FC32;
            --accent-dark: #9bc726;
            --bg-black: #000000;
            --bg-dark: #1a1a1a;
            --bg-card: rgba(30, 30, 30, 0.7);
            --text-primary: #f5f5f7;
            --text-secondary: #a1a1a6;
            --radius-small: 12px;
            --radius-medium: 20px;
            --radius-large: 28px;
            --spacing-xs: 8px;
            --spacing-sm: 16px;
            --spacing-md: 24px;
            --spacing-lg: 32px;
            --spacing-xl: 48px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        body {
            background: var(--bg-black);
            color: var(--text-primary);
            min-height: 100vh;
            padding: 40px 20px 100px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: var(--spacing-xs);
        }

        .header {
            display: flex;
            align-items: center;
            margin-bottom: 30px;
            gap: 15px;
        }

        .avatar {
            width: 50px;
            height: 50px;
            background: #333;
            background-size: cover;
            background-position: center;
            border-radius: 50%;
            cursor: pointer;
            flex-shrink: 0;
        }

        .user-section {
            display: flex;
            align-items: center;
            flex-grow: 1;
            gap: 15px;
        }

        .username {
            font-size: 1.8rem;
            font-weight: 700;
            cursor: pointer;
        }

        .app-header {
            padding: var(--spacing-lg) 0;
            margin-bottom: var(--spacing-md);
        }

        .app-name {
            font-size: 2rem;
            font-weight: 700;
            color: #ffffff;
            margin-bottom: 4px;
        }

        .tagline {
            color: var(--text-secondary);
            font-size: 1rem;
        }

        .clear-btn {
            background: transparent;
            border: none;
            color: var(--text-primary);
            font-size: 1rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            flex-shrink: 0;
        }

        .search-bar {
            margin-bottom: 30px;
        }

        .search-bar input {
            width: 100%;
            padding: 16px 24px;
            border-radius: 30px;
            border: none;
            background: rgba(255, 255, 255, 0.12);
            color: var(--text-primary);
            font-size: 1rem;
            border: 1px solid rgba(255, 255, 255, 0.15);
        }

        .search-bar input:focus {
            outline: none;
            border-color: var(--accent-color);
            background: rgba(255, 255, 255, 0.15);
        }

        .search-bar input::placeholder {
            color: var(--text-secondary);
        }

        .folders {
            display: flex;
            gap: 12px;
            overflow-x: auto;
            padding-bottom: 10px;
            margin-bottom: 30px;
        }

        .folder-btn {
            background: #222;
            color: #aaa;
            padding: 10px 20px;
            border-radius: 30px;
            border: none;
            cursor: pointer;
            white-space: nowrap;
            font-size: 1rem;
        }

        .folder-btn.active {
            background: var(--accent-color);
            color: #000;
        }

        .items-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 40px;
        }

        #itemsCount {
            font-size: 1.2rem;
        }

        .folder-pill {
            background: var(--accent-color);
            color: #000;
            padding: 10px 24px;
            border-radius: 30px;
            font-weight: 600;
        }

        .storage-container {
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        .storage-card {
            position: relative;
            background: var(--bg-card);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: var(--radius-large);
            padding: var(--spacing-sm);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
            width: 100%;
            max-width: 100%;
            box-sizing: border-box;
        }

        .card-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 10px;
        }

        .tag-and-delete {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .storage-tag {
            background: rgba(255, 255, 255, 0.1);
            padding: 6px 16px;
            border-radius: 30px;
            font-size: 0.9rem;
        }

        .delete-btn {
            background: transparent;
            border: none;
            color: var(--text-secondary);
            font-size: 1rem;
            cursor: pointer;
            padding: 6px;
            opacity: 0.7;
            border-radius: 50%;
            width: 34px;
            height: 34px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .delete-btn:hover {
            background: rgba(255, 255, 255, 0.1);
            opacity: 1;
        }

        .storage-key {
            font-size: 1.6rem;
            font-weight: 700;
            margin: 20px 0 12px;
            padding-right: 50px;
        }

        .storage-value {
            font-size: 0.95rem;
            line-height: 1.5;
            max-height: 120px;
            overflow-y: auto;
            margin-bottom: var(--spacing-sm);
            white-space: pre-wrap;
            word-break: break-all;
        }

        .card-footer {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .due {
            font-size: 0.95rem;
            opacity: 0.8;
        }

        .progress {
            width: 100%;
            height: 10px;
            background: #222;
            border-radius: 20px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: var(--accent-color);
            border-radius: 20px;
        }

        input[type="file"] {
            display: none;
        }

        footer {
            margin-bottom: -150px;
        }

        .social-links {
            display: flex;
            gap: 15px;
            margin-bottom: 10px;
        }
        
        .storage-key {
            word-break: break-word;
            overflow-wrap: break-word;
            max-width: 100%;
            font-size: 1.6rem;
            font-weight: 700;
            margin: 20px 0 12px;
            padding-right: 50px;
        }
        
        .storage-value {
            word-break: break-word;
            overflow-wrap: break-word;
            max-width: 100%;
            font-size: 0.95rem;
            line-height: 1.5;
            max-height: 120px;
            overflow-y: auto;
            margin-bottom: var(--spacing-sm);
            white-space: pre-wrap;
        }
        
        .pin-btn {
            background: transparent;
            border: none;
            color: var(--text-secondary);
            cursor: pointer;
            font-size: 1.2rem;
            padding: 6px;
            border-radius: 50%;
            width: 34px;
            height: 34px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .pin-btn:hover {
            background: rgba(255, 255, 255, 0.1);
        }
        
        .card-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 10px;
        }
        
        .tag-and-delete {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        
        .select-btn {
            background: transparent;
            border: none;
            color: var(--text-secondary);
            cursor: pointer;
            font-size: 1.2rem;
            padding: 6px;
            border-radius: 50%;
            width: 34px;
            height: 34px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .select-btn:hover {
            background: rgba(255, 255, 255, 0.1);
        }
        
        #deleteFab {
            transition: transform 0.2s;
        }
        
        #deleteFab:hover {
            transform: scale(1.1);
        }
        
        #deleteFab:active {
            transform: scale(0.95);
        }
        
    </style>
</head>
<body>
    <div class="container">
        <a href="index.html" class="back-link fade-in">
            <i class="fas fa-arrow-left"></i> Back to Home
        </a>

        <header style="margin-bottom: 50px;" class="fade-in">
            <div>
                <h1 class="app-name">Storage</h1>
                <p class="tagline">Access to all database on Kakoi Kiraku Home pages to clear specific pages data for your account.</p>
            </div>
        </header>

        <div class="header">
            <div class="user-section">
                <div class="avatar" id="avatar"></div>
                <div class="username" id="username">User</div>
            </div>
            <button class="clear-btn" style="color: red;" onclick="if(confirm('Clear all LocalStorage? This cannot be undone.')){localStorage.clear();location.reload();}">
                Clear All
                <i class="fas fa-trash-alt"></i>
            </button>
        </div>

        <div class="search-bar">
            <input type="text" id="searchInput" placeholder="Search keys or values...">
        </div>

        <div class="folders" id="folders"></div>

        <div class="items-info">
            <div id="itemsCount">0 data stored</div>
            <div class="folder-pill" id="folderPill">All</div>
        </div>

        <div class="storage-container" id="storageContainer"></div>

        <input type="file" id="avatarInput" accept="image/*">

        <footer>
            <div class="social-links">
                <a href="https://twitter.com/lildavegoth"><span class="icon icon-twitter"></span></a>
                <a href="https://instagram.com/dave_goth"><span class="icon icon-instagram"></span></a>
            </div>
            <p>© 2026 lildavegoth | Storage</p>
            <p style="margin-top: 8px; font-size: 0.8rem; color: #666;">
                Conveys the Idea of a Protected and Inspiring Space for Creative Expression.
            </p>
        </footer>
    </div>
    
    <div id="deleteFab" style="display:none; position:fixed; bottom:30px; right:30px; background:var(--accent-color); color:#000; width:60px; height:35px; border-radius:20px; align-items:center; justify-content:center; cursor:pointer; z-index:1000;">
        <i class="fas fa-trash" style="font-size:17px;"></i>
        <span class="fab-count" style="position:absolute; top:-5px; right:-5px; background:#ff4444; color:white; border-radius:50%; width:24px; height:24px; display:flex; align-items:center; justify-content:center; font-size:12px; font-weight:bold;">0</span>
    </div>

    <script>
        let currentFolder = 'All';
        let pinnedItems = JSON.parse(localStorage.getItem('pinnedItems') || '[]');
        let selectedItems = [];

        const avatar = document.getElementById('avatar');
        const avatarInput = document.getElementById('avatarInput');
        const usernameEl = document.getElementById('username');

        let username = localStorage.getItem('username') || 'User';
        usernameEl.textContent = username;

        let savedAvatar = localStorage.getItem('avatar');
        if (savedAvatar) avatar.style.backgroundImage = `url(${savedAvatar})`;

        avatar.onclick = () => avatarInput.click();

        avatarInput.onchange = (e) => {
            if (e.target.files[0]) {
                let reader = new FileReader();
                reader.onload = (ev) => {
                    let data = ev.target.result;
                    localStorage.setItem('avatar', data);
                    avatar.style.backgroundImage = `url(${data})`;
                };
                reader.readAsDataURL(e.target.files[0]);
            }
        };

        usernameEl.onclick = () => {
            let input = document.createElement('input');
            input.type = 'text';
            input.value = username;
            usernameEl.textContent = '';
            usernameEl.appendChild(input);
            input.focus();
            input.select();
            input.onblur = () => {
                username = input.value.trim() || 'User';
                localStorage.setItem('username', username);
                usernameEl.textContent = username;
            };
            input.onkeydown = (e) => {
                if (e.key === 'Enter') input.blur();
            };
        };

        function getData() {
            let keys = [];
            const excludedKeys = ['giveaway_settings', 'giveaway_participants', 'giveawayParticipants', 'lastGiveawayWinner', 'giveawayData', 'showDescription', 'hideSettingsButton', 'showSearchBar', 'bodyPosition', 'showBanner', 'showQuickLinks', 'pinnedItems', 'app_hash_v2', 'app_salt_v2'];
            
            for (let i = 0; i < localStorage.length; i++) {
                let k = localStorage.key(i);
                if (!excludedKeys.includes(k)) keys.push(k);
            }
            
            keys.sort((a, b) => {
                return 0;
            });
            
            let folders = new Set(['All']);
            
            keys.forEach(k => {
                let folderName = 'misc';
                if (k.includes('_')) {
                    folderName = k.split('_')[0];
                }
                folders.add(folderName);
            });
            
            return {keys, folders: Array.from(folders)};
        }
        
        function savePinnedItems() {
            localStorage.setItem('pinnedItems', JSON.stringify(pinnedItems));
        }
        
        function togglePin(key) {
            if (pinnedItems.includes(key)) {
                pinnedItems = pinnedItems.filter(item => item !== key);
            } else {
                pinnedItems.push(key);
            }
            savePinnedItems();
            buildCards();
        }
        
        function isPinned(key) {
            return pinnedItems.includes(key);
        }
        
        function toggleSelect(key) {
            if (selectedItems.includes(key)) {
                selectedItems = selectedItems.filter(item => item !== key);
            } else {
                selectedItems.push(key);
            }
            updateFabButton();
            buildCards();
        }
        
        function isSelected(key) {
            return selectedItems.includes(key);
        }
        
        function updateFabButton() {
            let fab = document.getElementById('deleteFab');
            if (selectedItems.length > 0) {
                fab.style.display = 'flex';
                fab.querySelector('.fab-count').textContent = selectedItems.length;
            } else {
                fab.style.display = 'none';
            }
        }
        
        function deleteSelected() {
            if (selectedItems.length === 0) return;
            if (confirm(`Delete ${selectedItems.length} selected item${selectedItems.length === 1 ? '' : 's'}?`)) {
                selectedItems.forEach(key => {
                    localStorage.removeItem(key);
                });
                selectedItems = [];
                let {folders} = getData();
                buildFolders(folders.sort((a, b) => {
                    return 0;
                }));
                buildCards();
                hideBase64Images();
                updateFabButton();
            }
        }

        function buildFolders(foldersList) {
            const foldersEl = document.getElementById('folders');
            foldersEl.innerHTML = '';

            foldersList.forEach(f => {
                let btn = document.createElement('button');
                btn.className = 'folder-btn';
                if (f === currentFolder) btn.classList.add('active');
                btn.textContent = f;
                btn.dataset.folder = f;
                btn.onclick = () => {
                    currentFolder = f;
                    document.querySelectorAll('.folder-btn').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    buildCards();
                };
                foldersEl.appendChild(btn);
            });
        }
        
        function getTotalStorageSize() {
            let total = 0;
            for (let i = 0; i < localStorage.length; i++) {
                let key = localStorage.key(i);
                let value = localStorage.getItem(key);
                total += key.length + value.length;
            }
            return total;
        }
        
        function formatSize(bytes) {
            if (bytes < 1024) return bytes + 'B';
            if (bytes < 1048576) return (bytes / 1024).toFixed(1) + 'KB';
            return (bytes / 1048576).toFixed(1) + 'MB';
        }

        function buildCards() {
            const search = document.getElementById('searchInput').value.toLowerCase();
            const {keys} = getData();
            
            let filtered = keys.filter(k => {
                const excludedKeys = ['username', 'avatar', 'giveaway_settings', 'giveaway_participants', 'giveawayParticipants', 'lastGiveawayWinner', 'giveawayData', 'showDescription', 'hideSettingsButton', 'showSearchBar', 'bodyPosition', 'showBanner', 'showQuickLinks', 'pinnedItems', 'app_hash_v2', 'app_salt_v2'];
                if (excludedKeys.includes(k)) return false;
                
                let matchesFolder = true;
                if (currentFolder !== 'All') {
                    if (currentFolder === 'misc') {
                        matchesFolder = !k.includes('_');
                    } else {
                        matchesFolder = k.startsWith(currentFolder + '_');
                    }
                }
                
                let matchesSearch = k.toLowerCase().includes(search) || localStorage.getItem(k).toLowerCase().includes(search);
                return matchesFolder && matchesSearch;
            });
            
            filtered.sort((a, b) => {
                if (isPinned(a) && !isPinned(b)) return -1;
                if (!isPinned(a) && isPinned(b)) return 1;
                return 0;
            });
            
            const container = document.getElementById('storageContainer');
            container.innerHTML = '';
            
            const countEl = document.getElementById('itemsCount');
            let plural = filtered.length === 1 ? '' : 's';
            let totalSize = getTotalStorageSize();
            let formattedSize = formatSize(totalSize);
            countEl.textContent = `${filtered.length} item${plural} and ${formattedSize} used of total data stored`;
        
            const pill = document.getElementById('folderPill');
            pill.textContent = currentFolder;
        
            if (filtered.length === 0) {
                pill.style.background = '#333';
                pill.style.color = '#888';
        
                let card = document.createElement('div');
                card.className = 'storage-card';
                card.innerHTML = `
                    <div class="card-header">
                        <div class="tag-and-delete">
                            <div class="storage-tag">Empty</div>
                        </div>
                    </div>
                    <div class="storage-key">No items</div>
                    <div class="storage-value">No data in this folder.</div>
                    <div class="card-footer">
                        <div class="due">Length: 0</div>
                        <div class="progress"><div class="progress-fill" style="width:0%"></div></div>
                    </div>
                `;
                container.appendChild(card);
                if (isPinned(key)) {
                    card.style.border = '1px solid var(--accent-color)';
                }
            } else {
                pill.style.background = 'var(--accent-color)';
                pill.style.color = '#000';
        
                filtered.forEach(key => {
                    let value = localStorage.getItem(key);
                    let displayValue = value;
                    let isJSON = false;
                    let isBase64 = false;
        
                    if (typeof value === 'string' && value.length > 500 && value.startsWith('data:image')) {
                        displayValue = '[Base64 Image] ' + value.substring(0, 40) + '...';
                        isBase64 = true;
                    } else {
                        try {
                            let parsed = JSON.parse(value);
                            if (typeof parsed === 'object' && parsed !== null) {
                                displayValue = JSON.stringify(parsed, null, 2);
                                if (displayValue.length > 300) {
                                    displayValue = displayValue.substring(0, 300) + '...';
                                }
                                isJSON = true;
                            }
                        } catch {
                            if (value.length > 300) {
                                displayValue = value.substring(0, 300) + '...';
                            }
                        }
                    }
        
                    let percent = value.length ? Math.min(100, Math.round((value.length / 500) * 100)) : 0;
        
                    let card = document.createElement('div');
                    card.className = 'storage-card';
                    card.innerHTML = `
                        <div class="card-header">
                            <div class="tag-and-delete">
                                <div class="storage-tag">${isBase64 ? 'Base64' : (isJSON ? 'JSON' : 'String')}</div>
                            </div>
                            <button class="select-btn" data-key="${key}" style="background:transparent; border:none; color:${isSelected(key) ? 'var(--accent-color)' : 'var(--text-secondary)'}; cursor:pointer; font-size:1.2rem; padding:6px; border-radius:50%; width:34px; height:34px; display:flex; align-items:center; justify-content:center; margin-right:-170px;">
                                <i class="${isSelected(key) ? 'fas fa-circle' : 'far fa-circle'}"></i>
                            </button>
                            <button class="pin-btn" data-key="${key}" style="background:transparent; border:none; color:${isPinned(key) ? 'var(--accent-color)' : 'var(--text-secondary)'}; cursor:pointer; font-size:1.2rem; margin-top:2px;">
                                <i class="fas fa-thumbtack"></i>
                            </button>
                        </div>
                        <div class="storage-key">${key.length > 50 ? key.substring(0, 50) + '...' : key}</div>
                        <div class="storage-value">${displayValue}</div>
                        <div class="card-footer">
                            <div class="due">Length: ${value.length}</div>
                            <div class="progress"><div class="progress-fill" style="width:${percent}%"></div></div>
                        </div>
                    `;
                    container.appendChild(card);
                    if (isPinned(key)) {
                        card.style.border = '1px solid var(--accent-color)';
                    }
                    if (isSelected(key)) {
                        card.style.border = '1px solid var(--accent-color)';
                    }
                });
            }
      
            function hideBase64Images() {
                document.querySelectorAll('.storage-value').forEach(el => {
                    let text = el.textContent;
                    if (text.includes('data:image') && text.length > 500) {
                        el.textContent = '[Base64 Image] ' + text.substring(0, 40) + '...';
                    }
                });
            }
        
            document.querySelectorAll('.delete-btn').forEach(btn => {
                btn.onclick = (e) => {
                    e.stopPropagation();
                    let k = btn.dataset.key;
                    if (confirm('Delete this item?')) {
                        localStorage.removeItem(k);
                        selectedItems = selectedItems.filter(item => item !== k);
                        updateFabButton();
                        let totalSize = getTotalStorageSize();
                        let formattedSize = formatSize(totalSize);
                        countEl.textContent = `${filtered.length - 1} item${plural} and ${formattedSize} used of total data stored`;
                        let {folders} = getData();
                        buildFolders(folders.sort());
                        buildCards();
                        hideBase64Images();
                        window.showMessage('Deleted successfully');
                    }
                };
            });
            
            document.querySelectorAll('.pin-btn').forEach(btn => {
                btn.onclick = (e) => {
                    e.stopPropagation();
                    let k = btn.dataset.key;
                    togglePin(k);
                };
            });
            
            document.querySelectorAll('.select-btn').forEach(btn => {
                btn.onclick = (e) => {
                    e.stopPropagation();
                    let k = btn.dataset.key;
                    toggleSelect(k);
                };
            });
        }
        
        document.getElementById('searchInput').oninput = () => {
            buildCards();
            hideBase64Images();
        };
        
        document.getElementById('deleteFab').onclick = () => {
            deleteSelected();
        };

        let {folders} = getData();
        buildFolders(folders.sort((a, b) => {
            return 0;
        }));
        buildCards();
        hideBase64Images();
        
    </script>
</body>
</html>
