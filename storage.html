<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Storage | lildavegoth</title>
    <meta name="color-scheme" content="dark">
    <script src="cordova.js"></script>
    <script src="protections.js"></script>
    <script src="notification.cssjs"></script>
    <link rel="stylesheet" href="media.css">
    <link rel="stylesheet" href="navigation.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --accent-color: #C1FC32;
            --accent-dark: #9bc726;
            --bg-black: #000000;
            --bg-dark: #1a1a1a;
            --bg-card: rgba(30, 30, 30, 0.7);
            --text-primary: #f5f5f7;
            --text-secondary: #a1a1a6;
            --radius-small: 12px;
            --radius-medium: 20px;
            --radius-large: 28px;
            --spacing-xs: 8px;
            --spacing-sm: 16px;
            --spacing-md: 24px;
            --spacing-lg: 32px;
            --spacing-xl: 48px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        body {
            background: var(--bg-black);
            color: var(--text-primary);
            min-height: 100vh;
            padding: 40px 20px 100px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: var(--spacing-xs);
        }

        .header {
            display: flex;
            align-items: center;
            margin-bottom: 30px;
            gap: 15px;
        }

        .avatar {
            width: 50px;
            height: 50px;
            background: #333;
            background-size: cover;
            background-position: center;
            border-radius: 50%;
            flex-shrink: 0;
        }

        .user-section {
            display: flex;
            align-items: center;
            flex-grow: 1;
            gap: 15px;
        }

        .username {
            font-size: 1.8rem;
            font-weight: 700;
        }

        .app-header {
            padding: var(--spacing-lg) 0;
            margin-bottom: var(--spacing-md);
        }

        .app-name {
            font-size: 2rem;
            font-weight: 700;
            color: #ffffff;
            margin-bottom: 4px;
        }

        .tagline {
            color: var(--text-secondary);
            font-size: 1rem;
        }

        .action-buttons {
            display: flex;
            gap: 12px;
            margin-bottom: 16px;
            flex-wrap: wrap;
        }

        .action-btn {
            flex: 1;
            padding: 14px 20px;
            border-radius: 40px;
            border: none;
            font-size: 1rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            cursor: pointer;
            transition: transform 0.1s ease;
            min-width: 120px;
        }

        .action-btn:active {
            transform: scale(0.97);
        }

        .btn-backup {
            background: var(--accent-color);
            color: #000;
        }

        .btn-restore {
            background: var(--bg-card);
            color: #fff;
            border: 1px solid rgba(255,255,255,0.1);
        }

        .clear-all-btn {
            width: 100%;
            background: #ff4d4d;
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: white;
            padding: 14px;
            border-radius: 40px;
            font-size: 1rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            cursor: pointer;
            margin-bottom: 24px;
            transition: transform 0.1s ease;
        }

        .clear-all-btn:active {
            transform: scale(0.97);
            background: rgba(255, 80, 80, 0.1);
        }

        .search-container {
            position: relative;
            margin-top: -5px;
            margin-bottom: 19px;
        }

        .search-container > div {
            position: relative;
        }

        #globalSearch {
            width: 100%;
            padding: 17px 44px 17px 16px;
            border-radius: var(--radius-medium);
            background: var(--bg-card);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: var(--text-primary);
            font-size: 0.95rem;
            outline: none;
        }

        #globalSearch:focus {
            border-color: var(--accent-color);
        }

        .search-icon {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-secondary);
            pointer-events: auto;
            cursor: pointer;
        }

        .search-icon i {
            color: var(--accent-color);
            margin-right: 5px;
        }

        .search-suggestions {
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            background: var(--bg-card);
            border-radius: var(--radius-medium);
            border: 1px solid rgba(255, 255, 255, 0.1);
            margin-top: 8px;
            max-height: 300px;
            overflow-y: auto;
            z-index: 1000;
            display: none;
            backdrop-filter: saturate(180%) blur(20px);
            -webkit-backdrop-filter: saturate(180%) blur(20px);
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        .search-suggestion-item {
            padding: 12px 16px;
            cursor: pointer;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            transition: all 0.2s ease;
        }

        .search-suggestion-item:hover {
            background: rgba(193, 252, 50, 0.1);
        }

        .search-suggestion-item:last-child {
            border-bottom: none;
        }

        .suggestion-title {
            font-weight: 500;
            margin-bottom: 4px;
            color: var(--text-primary);
        }

        .suggestion-description {
            font-size: 0.85rem;
            color: var(--text-secondary);
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .suggestion-category {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 12px;
            font-size: 0.7rem;
            margin-top: 4px;
            background: rgba(193, 252, 50, 0.1);
            color: var(--accent-color);
        }

        .search-suggestions::-webkit-scrollbar {
            display: none;
        }

        .folders {
            display: flex;
            gap: 12px;
            overflow-x: auto;
            padding-bottom: 10px;
            margin-bottom: 30px;
        }

        .folder-btn {
            background: #222;
            color: #aaa;
            padding: 10px 20px;
            border-radius: 30px;
            border: none;
            cursor: pointer;
            white-space: nowrap;
            font-size: 1rem;
            transition: transform 0.1s ease;
        }

        .folder-btn:active {
            transform: scale(0.95);
        }

        .folder-btn.active {
            background: var(--accent-color);
            color: #000;
        }

        .items-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 40px;
        }

        #itemsCount, #folderPill {
            display: none;
        }

        .storage-container {
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        .storage-card {
            position: relative;
            background: var(--bg-card);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: var(--radius-large);
            padding: var(--spacing-sm);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
            width: 100%;
            max-width: 100%;
            box-sizing: border-box;
        }

        .card-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 10px;
        }

        .tag-and-delete {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .storage-tag {
            background: rgba(255, 255, 255, 0.1);
            padding: 6px 16px;
            border-radius: 30px;
            font-size: 0.9rem;
        }

        .delete-btn {
            background: transparent;
            border: none;
            color: var(--text-secondary);
            font-size: 1rem;
            cursor: pointer;
            padding: 6px;
            opacity: 0.7;
            border-radius: 50%;
            width: 34px;
            height: 34px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .delete-btn:hover {
            background: rgba(255, 255, 255, 0.1);
            opacity: 1;
        }

        .storage-key {
            font-size: 1.6rem;
            font-weight: 700;
            margin: 20px 0 12px;
            padding-right: 50px;
            word-break: break-word;
            overflow-wrap: break-word;
            max-width: 100%;
        }

        .storage-value {
            font-size: 0.95rem;
            line-height: 1.5;
            max-height: 120px;
            overflow-y: auto;
            margin-bottom: var(--spacing-sm);
            white-space: pre-wrap;
            word-break: break-word;
            overflow-wrap: break-word;
            max-width: 100%;
        }

        .card-footer {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .due {
            font-size: 0.95rem;
            opacity: 0.8;
        }

        .progress {
            width: 100%;
            height: 10px;
            background: #222;
            border-radius: 20px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: var(--accent-color);
            border-radius: 20px;
        }

        .pin-btn {
            background: transparent;
            border: none;
            color: var(--text-secondary);
            cursor: pointer;
            font-size: 1.2rem;
            padding: 6px;
            border-radius: 50%;
            width: 34px;
            height: 34px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .pin-btn:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        input[type="file"] {
            display: none;
        }

        footer {
            margin-bottom: -150px;
        }

        .social-links {
            display: flex;
            gap: 15px;
            margin-bottom: 10px;
        }

        #dropboxStatus {
            font-size: 0.9rem;
            margin-left: 10px;
            font-weight: 800;
        }

        .dropbox-online {
            color: var(--accent-color);
        }

        .dropbox-expired {
            color: #C42833;
        }

        .popup-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 101%;
            background: rgba(0, 0, 0, 1.0);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 99999999;
            animation: fadeIn 0.3s ease;
        }

        .popup-content {
            background: var(--bg-card);
            border-radius: var(--radius-large);
            width: 90%;
            max-width: 500px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
            max-height: 70vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .popup-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: var(--spacing-md);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .popup-header h2 {
            font-size: 1.5rem;
            font-weight: 600;
        }

        .close-popup {
            background: transparent;
            border: none;
            color: var(--text-secondary);
            font-size: 1.2rem;
            cursor: pointer;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .tools-grid {
            padding: var(--spacing-md);
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .confirm-buttons {
            display: flex;
            gap: 12px;
            margin-top: 20px;
        }

        .confirm-btn {
            flex: 1;
            padding: 12px;
            border-radius: 40px;
            border: none;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.1s ease;
        }

        .confirm-btn.confirm {
            background: var(--accent-color);
            color: #000;
        }

        .confirm-btn.cancel {
            background: #333;
            color: #fff;
        }

        .confirm-btn:active {
            transform: scale(0.97);
        }

        .popup-message {
            color: var(--text-secondary);
            line-height: 1.5;
            margin-bottom: 8px;
        }
    </style>
</head>
<body>
    <div class="container">
        <a href="index.html" class="back-link fade-in">
            <i class="fas fa-arrow-left"></i> Back to Home
        </a>

        <header style="margin-bottom: 50px;" class="fade-in">
            <div>
                <h1 class="app-name">Storage</h1>
                <p class="tagline">Access to all database on Kakoi Kiraku Home pages to clear specific pages data and backup or restore data for your account</p>
            </div>
        </header>

        <div class="header">
            <div class="user-section">
                <div class="avatar" id="avatar"></div>
                <div class="username" id="username">User</div>
            </div>
            <span id="dropboxStatus"></span>
        </div>

        <div class="action-buttons">
            <button id="dropboxBackupBtn" class="action-btn btn-backup">
                <i class="fas fa-cloud-upload-alt"></i> Backup
            </button>
            <button id="dropboxRestoreBtn" class="action-btn btn-restore">
                <i class="fas fa-cloud-download-alt"></i> Restore
            </button>
        </div>

        <button class="clear-all-btn" id="clearAllBtn">
            <i class="fas fa-trash-alt"></i> Clear All
        </button>

        <div class="search-container">
            <div>
                <input type="text" id="globalSearch" placeholder="Search keys or values...">
                <div class="search-icon" id="searchIcon">
                    <i class="fas fa-search"></i>
                </div>
            </div>
            <div class="search-suggestions" id="searchSuggestions"></div>
        </div>

        <div class="folders" id="folders"></div>

        <div class="items-info">
            <div id="itemsCount">0 items | 0B</div>
            <div class="folder-pill" id="folderPill">All</div>
        </div>

        <div style="margin-top: -50px;" class="storage-container" id="storageContainer"></div>

        <footer>
            <div class="social-links">
                <a href="https://twitter.com/lildavegoth"><span class="icon icon-twitter"></span></a>
                <a href="https://instagram.com/dave_goth"><span class="icon icon-instagram"></span></a>
            </div>
            <p>© 2026 lildavegoth | Storage</p>
            <p style="margin-top: 8px; font-size: 0.8rem; color: #666;">
                Conveys the Idea of a Protected and Inspiring Space for Creative Expression.
            </p>
        </footer>
    </div>

    <div id="universalPopup" class="popup-overlay" style="display: none;">
        <div class="popup-content">
            <div class="popup-header">
                <h2 id="popupTitle"></h2>
                <button class="close-popup" onclick="closeUniversalPopup()">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            <div class="tools-grid" id="popupContent"></div>
        </div>
    </div>

    <script>
        const folderDefinitions = [
            { name: 'Account', keys: ['currentUser', 'profilePhoto'] },
            { name: 'Browser Homepage', keys: ['weatherCity', 'deadlineDate', 'deadlineDesc'] },
            { name: 'Calculator', keys: ['calcHistory'] },
            { name: 'Calendar', keys: ['monthPlans'] },
            { name: 'Dictionary Manager', keys: ['userDictionary'] },
            { name: 'Downloads Task', keys: ['categories', 'tasks'] },
            { name: 'Heartopia Gift Codes', keys: ['hatoGiftCodes'] },
            { name: 'Hiragana Learner', keys: ['hiraganaHistory', 'hiraganaLastCheckin', 'hiraganaScores', 'unlockedAchievements'] },
            { name: 'Home', keys: ['lastPageState', 'pinnedApps', 'pinnedGames'] },
            { name: 'Journal', keys: ['dailyJournalContents'] },
            { name: 'Links Vault', keys: ['bookmarksSaved'] },
            { name: 'Lyricure', keys: ['lyricure_cache'] },
            { name: 'Movies Gallery', keys: ['mediaGalleryData'] },
            { name: 'Pocket Garden', keys: ['pocketGarden'] },
            { name: 'Projects Task Manager', keys: ['projectFolders'] },
            { name: 'Routine Quest', keys: ['routineGame'] },
            { name: 'Subscription Manager', keys: ['subscriptionsManager'] },
            { name: 'Storage', keys: ['usernameStorage', 'avatarStorage', 'username'] },
            { name: 'Voidgarden', keys: ['farmGameSave'] },
            { name: 'Wallet Money Tracker', keys: ['moneyTrackerCards', 'moneyTrackerTransactions'] }
        ];

        const excludedKeys = [
            'giveaway_settings', 'giveaway_participants',
            'giveawayParticipants', 'lastGiveawayWinner', 'giveawayData',
            'showDescription', 'hideSettingsButton', 'showSearchBar', 'bodyPosition',
            'showBanner', 'showQuickLinks', 'pinnedItems', 'app_hash_v2', 'app_salt_v2',
            'dropbox_tokens', 'hideImportNote', 'hideSwipeIndicator', 'hintModeEnabled',
            'hiraganaStars', 'hiraganaStreak', 'moneyTrackerCurrentCardId', 'showAllEntries',
            'userName', 'lastPageState'
        ];

        let currentFolder = 'All';
        let pinnedItems = JSON.parse(localStorage.getItem('pinnedItems') || '[]');

        const avatarEl = document.getElementById('avatar');
        const usernameEl = document.getElementById('username');

        function updateUserDisplay() {
            const currentUserRaw = localStorage.getItem('currentUser');
            let displayName = 'User';
            if (currentUserRaw) {
                try {
                    const currentUser = JSON.parse(currentUserRaw);
                    if (currentUser.username && currentUser.username.trim()) {
                        displayName = currentUser.username;
                    }
                } catch (e) {}
            }
            usernameEl.textContent = displayName;

            const profilePhoto = localStorage.getItem('profilePhoto');
            if (profilePhoto && profilePhoto.startsWith('data:image')) {
                avatarEl.style.backgroundImage = `url(${profilePhoto})`;
                avatarEl.style.backgroundSize = 'cover';
                avatarEl.style.backgroundPosition = 'center';
            } else {
                avatarEl.style.backgroundImage = '';
                avatarEl.style.backgroundColor = '#333';
            }
        }

        window.addEventListener('storage', function(event) {
            if (event.key === 'currentUser' || event.key === 'profilePhoto') {
                updateUserDisplay();
            }
        });

        function getFilteredKeys() {
            let keys = [];
            for (let i = 0; i < localStorage.length; i++) {
                let k = localStorage.key(i);
                if (!excludedKeys.includes(k)) keys.push(k);
            }
            return keys;
        }

        function getFolderForKey(key) {
            for (let def of folderDefinitions) {
                if (def.keys.includes(key)) return def.name;
            }
            return 'Other';
        }

        function savePinnedItems() {
            localStorage.setItem('pinnedItems', JSON.stringify(pinnedItems));
        }

        function togglePin(key) {
            if (pinnedItems.includes(key)) {
                pinnedItems = pinnedItems.filter(item => item !== key);
            } else {
                pinnedItems.push(key);
            }
            savePinnedItems();
            buildCards();
        }

        function isPinned(key) {
            return pinnedItems.includes(key);
        }

        function buildFolders() {
            const foldersEl = document.getElementById('folders');
            foldersEl.innerHTML = '';

            const allFolders = ['All', ...folderDefinitions.map(f => f.name), 'Other'];

            allFolders.forEach(f => {
                let btn = document.createElement('button');
                btn.className = 'folder-btn';
                if (f === currentFolder) btn.classList.add('active');
                btn.textContent = f;
                btn.dataset.folder = f;
                btn.onclick = () => {
                    currentFolder = f;
                    document.querySelectorAll('.folder-btn').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    buildCards();
                };
                foldersEl.appendChild(btn);
            });
        }

        function getTotalStorageSize() {
            let total = 0;
            for (let i = 0; i < localStorage.length; i++) {
                let key = localStorage.key(i);
                let value = localStorage.getItem(key);
                total += key.length + value.length;
            }
            return total;
        }

        function formatSize(bytes) {
            if (bytes < 1024) return bytes + 'B';
            if (bytes < 1048576) return (bytes / 1024).toFixed(1) + 'KB';
            return (bytes / 1048576).toFixed(1) + 'MB';
        }

        function buildCards() {
            const search = document.getElementById('globalSearch').value.toLowerCase();
            let allKeys = getFilteredKeys();

            let filtered = allKeys.filter(key => {
                if (currentFolder === 'All') return true;
                if (currentFolder === 'Other') {
                    return getFolderForKey(key) === 'Other';
                }
                return getFolderForKey(key) === currentFolder;
            });

            filtered = filtered.filter(key => {
                let val = localStorage.getItem(key);
                if (key === 'currentUser') {
                    try {
                        let user = JSON.parse(val);
                        if (user && typeof user === 'object') {
                            const { admin, ...cleanUser } = user;
                            val = JSON.stringify(cleanUser);
                        }
                    } catch (e) {}
                }
                return key.toLowerCase().includes(search) || val.toLowerCase().includes(search);
            });

            filtered.sort((a, b) => {
                if (isPinned(a) && !isPinned(b)) return -1;
                if (!isPinned(a) && isPinned(b)) return 1;
                return 0;
            });

            const container = document.getElementById('storageContainer');
            container.innerHTML = '';

            let totalSize = getTotalStorageSize();
            let formattedSize = formatSize(totalSize);

            const pill = document.getElementById('folderPill');
            pill.textContent = currentFolder;

            if (filtered.length === 0) {
                pill.style.background = '#333';
                pill.style.color = '#888';

                let card = document.createElement('div');
                card.className = 'storage-card';
                card.innerHTML = `
                    <div class="card-header">
                        <div class="tag-and-delete">
                            <div class="storage-tag">Empty</div>
                        </div>
                    </div>
                    <div class="storage-key">No items</div>
                    <div class="storage-value">No data in this folder.</div>
                    <div class="card-footer">
                        <div class="due">Length: 0 — 0B</div>
                        <div class="progress"><div class="progress-fill" style="width:0%"></div></div>
                    </div>
                `;
                container.appendChild(card);
            } else {
                pill.style.background = 'var(--accent-color)';
                pill.style.color = '#000';

                filtered.forEach(key => {
                    let rawValue = localStorage.getItem(key);
                    let valueForDisplay = rawValue;
                    let isJSON = false;
                    let isBase64 = false;

                    if (key === 'currentUser') {
                        try {
                            let userObj = JSON.parse(rawValue);
                            if (userObj && typeof userObj === 'object') {
                                const { admin, ...cleanUser } = userObj;
                                valueForDisplay = JSON.stringify(cleanUser, null, 2);
                                isJSON = true;
                            }
                        } catch (e) {}
                    } else {
                        if (typeof rawValue === 'string' && rawValue.length > 500 && rawValue.startsWith('data:image')) {
                            valueForDisplay = '[Base64 Image] ' + rawValue.substring(0, 40) + '...';
                            isBase64 = true;
                        } else {
                            try {
                                let parsed = JSON.parse(rawValue);
                                if (typeof parsed === 'object' && parsed !== null) {
                                    valueForDisplay = JSON.stringify(parsed, null, 2);
                                    if (valueForDisplay.length > 300) {
                                        valueForDisplay = valueForDisplay.substring(0, 300) + '...';
                                    }
                                    isJSON = true;
                                }
                            } catch {
                                if (rawValue.length > 300) {
                                    valueForDisplay = rawValue.substring(0, 300) + '...';
                                } else {
                                    valueForDisplay = rawValue;
                                }
                            }
                        }
                    }

                    if (!isJSON && !isBase64 && valueForDisplay.length > 300 && typeof valueForDisplay === 'string') {
                        valueForDisplay = valueForDisplay.substring(0, 300) + '...';
                    }

                    let percent = rawValue.length ? Math.min(100, Math.round((rawValue.length / 500) * 100)) : 0;
                    let itemSizeBytes = key.length + rawValue.length;
                    let itemSizeFormatted = formatSize(itemSizeBytes);

                    let card = document.createElement('div');
                    card.className = 'storage-card';
                    card.innerHTML = `
                        <div class="card-header">
                            <div class="tag-and-delete">
                                <div class="storage-tag">${isBase64 ? 'Base64' : (isJSON ? 'JSON' : 'String')}</div>
                                <button class="delete-btn" data-key="${key}">
                                    <i class="fas fa-trash"></i>
                                </button>
                            </div>
                            <button class="pin-btn" data-key="${key}" style="background:transparent; border:none; color:${isPinned(key) ? 'var(--accent-color)' : 'var(--text-secondary)'}; cursor:pointer; font-size:1.2rem; margin-top:2px;">
                                <i class="fas fa-thumbtack"></i>
                            </button>
                        </div>
                        <div class="storage-key">${key.length > 50 ? key.substring(0, 50) + '...' : key}</div>
                        <div class="storage-value">${valueForDisplay.replace(/</g, '&lt;').replace(/>/g, '&gt;')}</div>
                        <div class="card-footer">
                            <div class="due">Length: ${rawValue.length} — ${itemSizeFormatted}</div>
                            <div class="progress"><div class="progress-fill" style="width:${percent}%"></div></div>
                        </div>
                    `;
                    container.appendChild(card);
                    if (isPinned(key)) {
                        card.style.border = '2px solid var(--accent-color)';
                    }
                });
            }

            document.querySelectorAll('.delete-btn').forEach(btn => {
                btn.onclick = (e) => {
                    e.stopPropagation();
                    let k = btn.dataset.key;
                    showConfirmPopup('Delete', 'Delete this item?', () => {
                        localStorage.removeItem(k);
                        pinnedItems = pinnedItems.filter(item => item !== k);
                        savePinnedItems();
                        initialize();
                        if (window.showMessage) window.showMessage('Deleted successfully');
                    });
                };
            });

            document.querySelectorAll('.pin-btn').forEach(btn => {
                btn.onclick = (e) => {
                    e.stopPropagation();
                    let k = btn.dataset.key;
                    togglePin(k);
                };
            });
        }

        document.getElementById('globalSearch').addEventListener('input', () => {
            buildCards();
        });

        function initialize() {
            buildFolders();
            buildCards();
            updateUserDisplay();
        }

        function closeUniversalPopup() {
            document.getElementById('universalPopup').style.display = 'none';
        }

        function showConfirmPopup(title, message, onConfirm) {
            const popup = document.getElementById('universalPopup');
            const titleEl = document.getElementById('popupTitle');
            const contentEl = document.getElementById('popupContent');

            titleEl.textContent = title;
            contentEl.innerHTML = `
                <div class="popup-message">${message}</div>
                <div class="confirm-buttons">
                    <button class="confirm-btn confirm" id="confirmYes">Yes</button>
                    <button class="confirm-btn cancel" id="confirmNo">No</button>
                </div>
            `;

            document.getElementById('confirmYes').onclick = () => {
                closeUniversalPopup();
                onConfirm();
            };

            document.getElementById('confirmNo').onclick = closeUniversalPopup;

            popup.style.display = 'flex';
        }

        let searchTimeout;
        function setupSearchDebounce() {
            const searchInput = document.getElementById('globalSearch');
            const suggestionsContainer = document.getElementById('searchSuggestions');

            if (searchInput) {
                searchInput.addEventListener('input', function() {
                    clearTimeout(searchTimeout);
                    showSearchSuggestions(this.value);
                });

                document.getElementById('searchIcon').addEventListener('click', function() {
                    suggestionsContainer.style.display = 'none';
                });

                searchInput.addEventListener('keypress', function(event) {
                    if (event.key === 'Enter') {
                        suggestionsContainer.style.display = 'none';
                    }
                });

                searchInput.addEventListener('focus', function() {
                    if (this.value.trim()) {
                        showSearchSuggestions(this.value);
                    }
                });

                document.addEventListener('click', function(event) {
                    if (!searchInput.contains(event.target) && !suggestionsContainer.contains(event.target)) {
                        suggestionsContainer.style.display = 'none';
                    }
                });

                suggestionsContainer.addEventListener('click', function(event) {
                    const suggestionItem = event.target.closest('.search-suggestion-item');
                    if (suggestionItem) {
                        const key = suggestionItem.dataset.key;
                        if (key) {
                            searchInput.value = key;
                            suggestionsContainer.style.display = 'none';
                            const folder = getFolderForKey(key);
                            if (folder !== currentFolder) {
                                currentFolder = folder;
                                buildFolders();
                                buildCards();
                            } else {
                                buildCards();
                            }
                            setTimeout(() => {
                                const cards = document.querySelectorAll('.storage-card');
                                for (let card of cards) {
                                    const keyEl = card.querySelector('.storage-key');
                                    if (keyEl && keyEl.textContent.trim() === (key.length > 50 ? key.substring(0, 50) + '...' : key)) {
                                        card.style.borderColor = 'var(--accent-color)';
                                        card.style.borderWidth = '2px';
                                        card.scrollIntoView({ behavior: 'smooth', block: 'center' });
                                        setTimeout(() => {
                                            card.style.borderColor = 'rgba(255, 255, 255, 0.05)';
                                            card.style.borderWidth = '1px';
                                        }, 2000);
                                        break;
                                    }
                                }
                            }, 100);
                        }
                    }
                });

                document.addEventListener('keydown', function(event) {
                    if (event.key === 'Escape' && suggestionsContainer.style.display === 'block') {
                        suggestionsContainer.style.display = 'none';
                    }
                });
            }
        }

        function showSearchSuggestions(searchTerm) {
            const suggestionsContainer = document.getElementById('searchSuggestions');
            if (!searchTerm.trim()) {
                suggestionsContainer.style.display = 'none';
                return;
            }

            let allKeys = getFilteredKeys();
            const term = searchTerm.toLowerCase();

            const matches = allKeys.filter(key => {
                let val = localStorage.getItem(key);
                if (key === 'currentUser') {
                    try {
                        let user = JSON.parse(val);
                        if (user && typeof user === 'object') {
                            const { admin, ...cleanUser } = user;
                            val = JSON.stringify(cleanUser);
                        }
                    } catch (e) {}
                }
                return key.toLowerCase().includes(term) || val.toLowerCase().includes(term);
            }).slice(0, 7);

            if (matches.length === 0) {
                suggestionsContainer.innerHTML = `<div class="search-suggestion-item"><div class="suggestion-title">No results found</div><div class="suggestion-description">Try different keywords</div></div>`;
            } else {
                suggestionsContainer.innerHTML = matches.map(key => {
                    const folder = getFolderForKey(key);
                    let val = localStorage.getItem(key) || '';
                    if (key === 'currentUser') {
                        try {
                            let user = JSON.parse(val);
                            if (user && typeof user === 'object') {
                                const { admin, ...cleanUser } = user;
                                val = JSON.stringify(cleanUser);
                            }
                        } catch (e) {}
                    }
                    const snippet = val.length > 50 ? val.substring(0, 50) + '…' : val;
                    return `
                        <div class="search-suggestion-item" data-key="${key}">
                            <div class="suggestion-title">${key}</div>
                            <div class="suggestion-description">${snippet}</div>
                            <div class="suggestion-category">${folder}</div>
                        </div>
                    `;
                }).join('');
            }
            suggestionsContainer.style.display = 'block';
        }

        const DROPBOX_CLIENT_ID = '5630n4t14l8r80h';
        const REDIRECT_URI = window.cordova ? 'com.kakoikiraku.home://oauth' : (window.location.origin + window.location.pathname);
        const DROPBOX_TOKEN_KEY = 'dropbox_tokens';

        function showMsg(msg, isError) {
            if (window.showMessage) window.showMessage(msg, isError ? 'error' : 'success');
            else alert(msg);
        }

        function getDropboxTokens() {
            const t = localStorage.getItem(DROPBOX_TOKEN_KEY);
            return t ? JSON.parse(t) : null;
        }

        function setDropboxTokens(tokens) {
            localStorage.setItem(DROPBOX_TOKEN_KEY, JSON.stringify(tokens));
        }

        function clearDropboxTokens() {
            localStorage.removeItem(DROPBOX_TOKEN_KEY);
        }

        async function getValidAccessToken() {
            let tokens = getDropboxTokens();
            if (!tokens) return null;
            if (tokens.expires_at && Date.now() < tokens.expires_at - 300000) {
                return tokens.access_token;
            }
            if (tokens.refresh_token) {
                try {
                    const newTokens = await refreshAccessToken(tokens.refresh_token);
                    setDropboxTokens(newTokens);
                    return newTokens.access_token;
                } catch (e) {
                    clearDropboxTokens();
                    return null;
                }
            }
            return null;
        }

        async function refreshAccessToken(refreshToken) {
            const body = new URLSearchParams({
                grant_type: 'refresh_token',
                refresh_token: refreshToken,
                client_id: DROPBOX_CLIENT_ID,
            });
            const resp = await fetch('https://api.dropboxapi.com/oauth2/token', {
                method: 'POST',
                headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                body: body
            });
            if (!resp.ok) throw new Error('Refresh failed');
            const data = await resp.json();
            return {
                access_token: data.access_token,
                expires_at: Date.now() + data.expires_in * 1000,
                refresh_token: refreshToken
            };
        }

        function generateCodeVerifier() {
            const array = new Uint32Array(32);
            crypto.getRandomValues(array);
            return base64URLEncode(array);
        }

        async function generateCodeChallenge(verifier) {
            const encoder = new TextEncoder();
            const data = encoder.encode(verifier);
            const digest = await crypto.subtle.digest('SHA-256', data);
            return base64URLEncode(new Uint8Array(digest));
        }

        function base64URLEncode(buffer) {
            return btoa(String.fromCharCode(...new Uint8Array(buffer)))
                .replace(/\+/g, '-').replace(/\//g, '_').replace(/=/g, '');
        }

        async function authenticateDropbox() {
            const verifier = generateCodeVerifier();
            const challenge = await generateCodeChallenge(verifier);
            sessionStorage.setItem('code_verifier', verifier);

            const authUrl = 'https://www.dropbox.com/oauth2/authorize?' + new URLSearchParams({
                client_id: DROPBOX_CLIENT_ID,
                response_type: 'code',
                redirect_uri: REDIRECT_URI,
                code_challenge_method: 'S256',
                code_challenge: challenge,
                token_access_type: 'offline'
            });

            if (window.cordova) {
                const browser = cordova.InAppBrowser.open(authUrl, '_blank', 'location=no,hidden=no');
                browser.addEventListener('loadstart', function (event) {
                    if (event.url.startsWith(REDIRECT_URI)) {
                        browser.close();
                        const url = new URL(event.url);
                        const code = url.searchParams.get('code');
                        if (code) {
                            handleOAuthCode(code, verifier);
                        } else {
                            showMsg('OAuth failed: no code', true);
                        }
                    }
                });
                browser.addEventListener('loaderror', function (event) {
                    if (event.url && event.url.startsWith(REDIRECT_URI)) {
                        browser.close();
                        const url = new URL(event.url);
                        const code = url.searchParams.get('code');
                        if (code) {
                            handleOAuthCode(code, verifier);
                        } else {
                            showMsg('OAuth failed: no code', true);
                        }
                    }
                });
            } else {
                window.location.href = authUrl;
            }
        }

        async function handleOAuthCode(code, verifier) {
            try {
                const body = new URLSearchParams({
                    code: code,
                    grant_type: 'authorization_code',
                    client_id: DROPBOX_CLIENT_ID,
                    redirect_uri: REDIRECT_URI,
                    code_verifier: verifier
                });
                const resp = await fetch('https://api.dropboxapi.com/oauth2/token', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                    body: body
                });
                if (!resp.ok) throw new Error('Token exchange failed');
                const data = await resp.json();
                const tokens = {
                    access_token: data.access_token,
                    refresh_token: data.refresh_token,
                    expires_at: Date.now() + data.expires_in * 1000
                };
                setDropboxTokens(tokens);
                showMsg('Dropbox connected!');
                updateDropboxStatus();
            } catch (err) {
                showMsg('OAuth error: ' + err.message, true);
            }
        }

        async function handleOAuthRedirect() {
            const params = new URLSearchParams(window.location.search);
            const code = params.get('code');
            const verifier = sessionStorage.getItem('code_verifier');
            if (code && verifier) {
                window.history.replaceState({}, document.title, window.location.pathname);
                sessionStorage.removeItem('code_verifier');
                await handleOAuthCode(code, verifier);
                return;
            }
            if (window.cordova) return;
        }

        async function uploadBackup() {
            const token = await getValidAccessToken();
            if (!token) {
                showConfirmPopup('Dropbox', 'Not connected to Dropbox. Connect now?', () => {
                    authenticateDropbox();
                });
                return;
            }

            const exclude = ['dropbox_tokens', 'pinnedItems',
                'giveaway_settings', 'giveaway_participants', 'lastGiveawayWinner',
                'app_hash_v2', 'app_salt_v2', 'hideImportNote', 'hideSwipeIndicator',
                'hintModeEnabled', 'hiraganaStars', 'hiraganaStreak', 'moneyTrackerCurrentCardId',
                'showAllEntries', 'userName'];

            const backup = {};
            for (let i = 0; i < localStorage.length; i++) {
                const key = localStorage.key(i);
                if (!exclude.includes(key)) {
                    backup[key] = localStorage.getItem(key);
                }
            }

            const content = JSON.stringify(backup, null, 2);
            const fileName = `kakoikiraku_backup_${new Date().toISOString().slice(0,10)}.json`;

            try {
                const resp = await fetch('https://content.dropboxapi.com/2/files/upload', {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Dropbox-API-Arg': JSON.stringify({ path: '/' + fileName, mode: 'overwrite' }),
                        'Content-Type': 'application/octet-stream'
                    },
                    body: content
                });
                if (!resp.ok) {
                    const errorBody = await resp.text();
                    throw new Error(`Dropbox API error (${resp.status}): ${errorBody}`);
                }
                showMsg(`Backup saved as ${fileName}`);
            } catch (err) {
                showMsg('Upload error: ' + err.message, true);
            }
        }

        async function downloadAndRestore() {
            const token = await getValidAccessToken();
            if (!token) {
                showConfirmPopup('Dropbox', 'Not connected to Dropbox. Connect now?', () => {
                    authenticateDropbox();
                });
                return;
            }

            try {
                const listResp = await fetch('https://api.dropboxapi.com/2/files/list_folder', {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ path: '', recursive: false })
                });
                if (!listResp.ok) throw new Error('Failed to list files');
                const list = await listResp.json();
                const backups = list.entries
                    .filter(e => e.name.startsWith('kakoikiraku_backup_') && e.name.endsWith('.json'))
                    .sort((a, b) => b.server_modified.localeCompare(a.server_modified));
                if (backups.length === 0) {
                    showMsg('No backup files found.', true);
                    return;
                }
                const latest = backups[0].path_lower;

                const dlResp = await fetch('https://content.dropboxapi.com/2/files/download', {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Dropbox-API-Arg': JSON.stringify({ path: latest })
                    }
                });
                if (!dlResp.ok) throw new Error('Download failed');
                const backupData = await dlResp.json();

                showConfirmPopup('Restore', `Restore ${Object.keys(backupData).length} items? Current data will be overwritten.`, () => {
                    for (const [key, value] of Object.entries(backupData)) {
                        localStorage.setItem(key, value);
                    }
                    showMsg('Restore complete! Refreshing view...');
                    initialize();
                });

            } catch (err) {
                showMsg('Restore error: ' + err.message, true);
            }
        }

        async function updateDropboxStatus() {
            const statusSpan = document.getElementById('dropboxStatus');
            const tokens = getDropboxTokens();
            if (!tokens) {
                statusSpan.textContent = '';
                return;
            }
            const valid = await getValidAccessToken();
            if (valid) {
                statusSpan.textContent = 'Connected';
                statusSpan.className = 'dropbox-online';
            } else {
                statusSpan.textContent = 'Expired';
                statusSpan.className = 'dropbox-expired';
                clearDropboxTokens();
            }
        }

        if (window.cordova) {
            document.addEventListener('deviceready', function() {
                document.getElementById('dropboxBackupBtn').addEventListener('click', uploadBackup);
                document.getElementById('dropboxRestoreBtn').addEventListener('click', downloadAndRestore);
                handleOAuthRedirect().then(() => updateDropboxStatus());
            });
        } else {
            document.getElementById('dropboxBackupBtn').addEventListener('click', uploadBackup);
            document.getElementById('dropboxRestoreBtn').addEventListener('click', downloadAndRestore);
            handleOAuthRedirect();
        }

        document.getElementById('clearAllBtn').addEventListener('click', () => {
            showConfirmPopup('Clear All', 'Clear all LocalStorage? This action will Clear All the apps data and your account will be logged out immediately, it also cannot be undone.', () => {
                localStorage.clear();
                location.reload();
            });
        });

        setupSearchDebounce();
        initialize();
    </script>
