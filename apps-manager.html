<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apps Manager | lildavegoth</title>
    <script src="./protections.js"></script>
    <script src="./notification.cssjs"></script>
    <link rel="stylesheet" href="./media.css">
    <meta name="color-scheme" content="dark">
    <script src="./ui-icons.js"></script>
    <style>
        :root {
            --accent-color: #C1FC32;
            --accent-dark: #9bc726;
            --bg-black: #000000;
            --bg-dark: #1a1a1a;
            --bg-card: rgba(30, 30, 30, 0.7);
            --text-primary: #f5f5f7;
            --text-secondary: #a1a1a6;
            --radius-small: 12px;
            --radius-medium: 20px;
            --radius-large: 28px;
            --spacing-xs: 8px;
            --spacing-sm: 16px;
            --spacing-md: 24px;
            --spacing-lg: 32px;
            --spacing-xl: 48px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-black);
            color: var(--text-primary);
            min-height: 100vh;
            overflow-x: hidden;
            padding-bottom: 90px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: var(--spacing-md);
            position: relative;
            min-height: calc(100vh - 90px);
        }

        h2 {
            color: var(--text-primary);
            font-size: 1.8rem;
            margin-bottom: var(--spacing-md);
        }

        .hidden {
            display: none;
        }

        #loginContainer {
            max-width: 400px;
            margin: 6rem auto;
            padding: var(--spacing-md);
            background: var(--bg-card);
            border-radius: var(--radius-medium);
            border: 1px solid rgba(255,255,255,0.1);
        }

        #loginContainer input {
            width: 100%;
            padding: 12px 16px;
            margin-bottom: var(--spacing-sm);
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: var(--radius-small);
            color: var(--text-primary);
            font-size: 1rem;
        }

        #loginContainer button {
            width: 100%;
            padding: 12px;
            background: var(--accent-color);
            color: #000;
            border: none;
            border-radius: var(--radius-small);
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            transition: transform 0.1s, opacity 0.2s;
        }

        #loginContainer button:active {
            transform: scale(0.96);
        }

        #loginContainer button:hover {
            opacity: 0.85;
        }

        .apps-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: var(--spacing-sm);
        }

        .app-card {
            background: var(--bg-card);
            border-radius: var(--radius-medium);
            padding: var(--spacing-sm);
            border: 1px solid rgba(255,255,255,0.08);
            transition: background 0.2s;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .app-card:hover {
            background: rgba(40, 40, 40, 0.8);
        }

        .app-path {
            font-weight: 600;
            color: var(--text-primary);
            font-size: 0.95rem;
            word-break: break-word;
        }

        .app-version {
            font-size: 0.85rem;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .version-text {
            color: var(--accent-color);
            font-weight: 500;
        }

        .live-badge {
            background: #C42833;
            color: #fff;
            padding: 2px 8px;
            border-radius: 12px;
            font-size: 0.7rem;
            font-weight: 700;
            text-transform: uppercase;
        }

        .app-actions {
            display: flex;
            gap: 8px;
            margin-top: 4px;
        }

        .action-btn {
            padding: 6px 12px;
            border-radius: 8px;
            border: 1px solid rgba(255,255,255,0.15);
            background: rgba(255,255,255,0.05);
            color: var(--text-primary);
            font-size: 0.8rem;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.2s;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .action-btn:hover {
            background: rgba(255,255,255,0.1);
        }

        .action-btn.active {
            background: var(--accent-color);
            color: #000;
            border-color: var(--accent-color);
        }

        .fab {
            position: fixed;
            bottom: 28px;
            right: 28px;
            width: 56px;
            height: 56px;
            border-radius: 12px;
            background: var(--accent-color);
            color: #000;
            font-size: 1.6rem;
            font-weight: 700;
            line-height: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            border: none;
            cursor: pointer;
            z-index: 20;
            transition: opacity 0.2s;
            overflow: hidden;
        }

        .popup-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 1.0);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 99999999;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .popup-content {
            background: var(--bg-card);
            border-radius: var(--radius-large);
            width: 90%;
            max-width: 420px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .popup-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: var(--spacing-md);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .popup-header h3 {
            font-size: 1.3rem;
            font-weight: 600;
            margin: 0;
        }

        .close-popup {
            background: transparent;
            border: none;
            color: var(--text-secondary);
            font-size: 1.2rem;
            cursor: pointer;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .popup-body {
            padding: var(--spacing-md);
            display: flex;
            flex-direction: column;
            gap: var(--spacing-sm);
        }

        .popup-body input {
            width: 100%;
            padding: 12px 16px;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: var(--radius-small);
            color: var(--text-primary);
            font-size: 1rem;
        }

        .popup-body input:focus {
            outline: none;
            border-color: var(--accent-color);
        }

        .popup-footer {
            padding: var(--spacing-md);
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            justify-content: flex-end;
            gap: var(--spacing-sm);
        }

        .popup-footer button {
            padding: 10px 20px;
            border-radius: var(--radius-small);
            font-weight: 600;
            font-size: 0.95rem;
            border: none;
            cursor: pointer;
            transition: transform 0.1s;
        }

        .popup-footer button:active {
            transform: scale(0.96);
        }

        .btn-save {
            background: var(--accent-color);
            color: #000;
        }

        .btn-cancel {
            background: rgba(255,255,255,0.1);
            color: var(--text-primary);
        }
    </style>
</head>
<body>
    <div class="container">
        <div id="loginContainer">
            <h2>Admin Login</h2>
            <input type="password" id="passwordInput" placeholder="Enter admin password">
            <button id="loginBtn">Login</button>
        </div>

        <div id="homeContainer" class="hidden">
            <h2>Apps Manager</h2>
            <p style="color: var(--text-secondary); margin-bottom: var(--spacing-md); font-size: 0.9rem;">
                Manage cache versions per page. Changes are applied live via Service Worker.
            </p>
            <div id="appsList" class="apps-grid"></div>
            <button class="fab" id="refreshFab" title="Refresh from service worker">
                <i class="fas fa-sync-alt"></i>
            </button>
        </div>
    </div>

    <div id="versionPopup" class="popup-overlay hidden">
        <div class="popup-content">
            <div class="popup-header">
                <h3>Set Version</h3>
                <button class="close-popup" id="closeVersionPopup">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            <div class="popup-body">
                <label for="versionInput">New version</label>
                <input type="text" id="versionInput" placeholder="1.0.0">
            </div>
            <div class="popup-footer">
                <button class="btn-cancel" id="cancelVersionBtn">Cancel</button>
                <button class="btn-save" id="saveVersionBtn">Save</button>
            </div>
        </div>
    </div>

    <script>
        var token = localStorage.getItem('adminToken');
        var currentUrl = null;
        var swReadyPromise = null;

        function initServiceWorker() {
            if (!('serviceWorker' in navigator)) return;
            navigator.serviceWorker.register('/sw.js').then(function(reg) {
                if (reg.active && !navigator.serviceWorker.controller) {
                    swReadyPromise = new Promise(function(resolve) {
                        var onControllerChange = function() {
                            navigator.serviceWorker.removeEventListener('controllerchange', onControllerChange);
                            window.location.reload();
                        };
                        navigator.serviceWorker.addEventListener('controllerchange', onControllerChange);
                    });
                } else {
                    swReadyPromise = Promise.resolve();
                }
            }).catch(function() {});
        }

        if (token) {
            showHome();
        }

        document.getElementById('loginBtn').addEventListener('click', async function() {
            var password = document.getElementById('passwordInput').value;
            var res = await fetch('/api/verify-password', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ password: password })
            });
            if (res.ok) {
                var data = await res.json();
                token = data.token;
                localStorage.setItem('adminToken', token);
                showHome();
            } else {
                window.showMessage('Wrong password');
            }
        });

        document.getElementById('refreshFab').addEventListener('click', function() {
            loadAppList();
        });

        document.getElementById('closeVersionPopup').addEventListener('click', closeVersionPopup);
        document.getElementById('cancelVersionBtn').addEventListener('click', closeVersionPopup);
        document.getElementById('versionPopup').addEventListener('click', function(e) {
            if (e.target === this) closeVersionPopup();
        });
        document.getElementById('saveVersionBtn').addEventListener('click', saveVersion);

        function showHome() {
            document.getElementById('loginContainer').classList.add('hidden');
            document.getElementById('homeContainer').classList.remove('hidden');
            initServiceWorker();
            loadAppList();
        }

        async function ensureSWReady() {
            if (!navigator.serviceWorker) {
                throw new Error('Service Worker not supported');
            }
            if (swReadyPromise) {
                await swReadyPromise;
            }
            await navigator.serviceWorker.ready;
            if (!navigator.serviceWorker.controller) {
                throw new Error('Service Worker not active. Please reload the page.');
            }
        }

        function sendMessage(message) {
            return new Promise(async function(resolve, reject) {
                try {
                    await ensureSWReady();
                    var messageChannel = new MessageChannel();
                    messageChannel.port1.onmessage = function(event) {
                        if (event.data.error) {
                            reject(new Error(event.data.error));
                        } else {
                            resolve(event.data);
                        }
                    };
                    navigator.serviceWorker.controller.postMessage(message, [messageChannel.port2]);
                } catch (e) {
                    reject(e);
                }
            });
        }

        async function loadAppList() {
            try {
                var urlListResponse = await sendMessage({ type: 'GET_URL_LIST' });
                var manifestResponse = await sendMessage({ type: 'GET_MANIFEST' });
                var urls = urlListResponse.urls || [];
                var manifest = manifestResponse.manifest || {};
                renderApps(urls, manifest);
            } catch (e) {
                window.showMessage('Service Worker error: ' + e.message);
                document.getElementById('appsList').innerHTML = '';
            }
        }

        function renderApps(urls, manifest) {
            var list = document.getElementById('appsList');
            list.innerHTML = '';
            urls.forEach(function(url) {
                var entry = manifest[url] || {};
                var version = entry.version || 'none';
                var live = entry.live || false;
                var card = document.createElement('div');
                card.className = 'app-card';
                card.dataset.url = url;

                var versionDisplay = live ? '<span class="live-badge">LIVE</span>' : '<span class="version-text">v' + version + '</span>';

                card.innerHTML =
                    '<div class="app-path">' + url + '</div>' +
                    '<div class="app-version">' + versionDisplay + '</div>' +
                    '<div class="app-actions">' +
                    '<button class="action-btn edit-version-btn"><i class="fas fa-tag"></i> Version</button>' +
                    '<button class="action-btn toggle-live-btn ' + (live ? 'active' : '') + '"><i class="fas fa-bolt"></i> ' + (live ? 'Live' : 'Cached') + '</button>' +
                    '</div>';

                list.appendChild(card);
            });

            document.querySelectorAll('.edit-version-btn').forEach(function(btn) {
                btn.addEventListener('click', function(e) {
                    var card = e.target.closest('.app-card');
                    currentUrl = card.dataset.url;
                    var entry = manifest[currentUrl] || {};
                    document.getElementById('versionInput').value = entry.version || '';
                    document.getElementById('versionPopup').classList.remove('hidden');
                });
            });

            document.querySelectorAll('.toggle-live-btn').forEach(function(btn) {
                btn.addEventListener('click', function(e) {
                    var card = e.target.closest('.app-card');
                    var url = card.dataset.url;
                    toggleLive(url);
                });
            });
        }

        async function toggleLive(url) {
            try {
                await sendMessage({ type: 'TOGGLE_LIVE', url: url });
                loadAppList();
            } catch (e) {
                window.showMessage('Failed: ' + e.message);
            }
        }

        async function saveVersion() {
            var newVersion = document.getElementById('versionInput').value.trim();
            if (!newVersion) {
                window.showMessage('Version cannot be empty');
                return;
            }
            if (!currentUrl) return;
            try {
                await sendMessage({ type: 'SET_VERSION', url: currentUrl, version: newVersion });
                closeVersionPopup();
                loadAppList();
                window.showMessage('Version updated');
            } catch (e) {
                window.showMessage('Failed: ' + e.message);
                closeVersionPopup();
            }
        }

        function closeVersionPopup() {
            document.getElementById('versionPopup').classList.add('hidden');
            currentUrl = null;
        }
    </script>
</body>
</html>
