<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
        <title>Notification Test</title>
        <script src="cordova.js"></script>
        <style>
            body {
                font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
                background: #eef2ff;
                margin: 0;
                min-height: 100vh;
                display: flex;
                justify-content: center;
                align-items: center;
                text-align: center;
            }
            .card {
                background: white;
                border-radius: 2rem;
                box-shadow: 0 20px 35px -10px rgba(0, 0, 0, 0.1);
                padding: 2rem 1.5rem;
                max-width: 460px;
                width: 90%;
            }
            h1 {
                font-size: 1.8rem;
                font-weight: 700;
                margin: 0 0 0.25rem;
                color: #0f172a;
            }
            .sub {
                color: #475569;
                font-size: 0.85rem;
                margin-bottom: 2rem;
                border-bottom: 1px solid #e2e8f0;
                display: inline-block;
                padding-bottom: 0.4rem;
            }
            button {
                background: #0f3b7a;
                border: none;
                color: white;
                font-weight: 600;
                font-size: 1.2rem;
                padding: 0.9rem 2rem;
                border-radius: 60px;
                cursor: pointer;
                transition: 0.2s;
                width: 100%;
                max-width: 260px;
                box-shadow: 0 8px 20px rgba(15, 59, 122, 0.3);
            }
            button:hover {
                background: #1e4a8a;
                transform: scale(0.97);
            }
            button:active {
                background: #0f2f60;
                transform: scale(0.96);
            }
            .status {
                margin-top: 1.5rem;
                font-size: 0.75rem;
                background: #f1f5f9;
                padding: 0.5rem 1rem;
                border-radius: 30px;
                color: #2d3a5e;
            }
        </style>
    </head>
    <body>
        <div class="card">
            <h1>🔔 Notification test</h1>
            <div class="sub">Cordova + Browser ready</div>
            <button id="triggerBtn">📢 Show notification</button>
            <div class="status" id="statusMsg">Ready</div>
        </div>

        <script>
            (function() {
                var isCordova = false;
                var localNotificationPlugin = null;

                function updateStatus(message) {
                    var statusDiv = document.getElementById('statusMsg');
                    if (statusDiv) {
                        statusDiv.innerText = message;
                    }
                }

                function requestWebPermission() {
                    if (!window.Notification) {
                        updateStatus('Web notifications not supported');
                        return false;
                    }
                    if (Notification.permission === 'granted') {
                        return true;
                    }
                    if (Notification.permission !== 'denied') {
                        Notification.requestPermission().then(function(permission) {
                            if (permission === 'granted') {
                                updateStatus('Web notification permission granted');
                            } else {
                                updateStatus('Web notification permission denied');
                            }
                        });
                    }
                    return Notification.permission === 'granted';
                }

                function showWebNotification() {
                    if (!window.Notification) {
                        alert('Your browser does not support desktop notifications');
                        return;
                    }
                    if (Notification.permission === 'granted') {
                        new Notification('📱 Test from browser', {
                            body: 'You triggered a notification successfully!',
                            icon: null
                        });
                        updateStatus('Web notification sent');
                    } else if (Notification.permission !== 'denied') {
                        Notification.requestPermission().then(function(perm) {
                            if (perm === 'granted') {
                                new Notification('📱 Test from browser', {
                                    body: 'You triggered a notification successfully!',
                                    icon: null
                                });
                                updateStatus('Web notification sent');
                            } else {
                                alert('Please allow notifications to see the alert.');
                            }
                        });
                    } else {
                        alert('Notifications are blocked. Please enable them in browser settings.');
                    }
                }

                function showCordovaNotification() {
                    if (!localNotificationPlugin || typeof localNotificationPlugin.schedule !== 'function') {
                        updateStatus('Cordova plugin not ready, using fallback');
                        showWebNotification();
                        return;
                    }
                    var notifId = Math.floor(Date.now() % 9000) + 1000;
                    localNotificationPlugin.schedule({
                        id: notifId,
                        title: 'Cordova Alert',
                        text: 'Notification from Cordova app',
                        foreground: true,
                        priority: 2,
                        icon: 'res://icon',
                        smallIcon: 'res://icon'
                    }, function() {
                        updateStatus('Cordova notification scheduled');
                    }, function(error) {
                        updateStatus('Plugin error: ' + (error || 'unknown'));
                        showWebNotification();
                    });
                }

                function initCordova() {
                    if (typeof window.cordova !== 'undefined') {
                        isCordova = true;
                        document.addEventListener('deviceready', function() {
                            if (window.cordova && window.cordova.plugins && window.cordova.plugins.notification && window.cordova.plugins.notification.local) {
                                localNotificationPlugin = window.cordova.plugins.notification.local;
                                updateStatus('Cordova plugin ready');
                            } else if (window.plugins && window.plugins.notification && window.plugins.notification.local) {
                                localNotificationPlugin = window.plugins.notification.local;
                                updateStatus('Cordova plugin ready (alternate)');
                            } else {
                                updateStatus('Cordova plugin not found, using web fallback');
                            }
                        }, false);
                    } else {
                        requestWebPermission();
                        updateStatus('Browser mode - web notifications');
                    }
                }

                function handleButtonClick() {
                    if (isCordova && localNotificationPlugin) {
                        showCordovaNotification();
                    } else if (isCordova && !localNotificationPlugin) {
                        updateStatus('Plugin not loaded yet, retrying...');
                        setTimeout(function() {
                            if (localNotificationPlugin) {
                                showCordovaNotification();
                            } else {
                                showWebNotification();
                            }
                        }, 300);
                    } else {
                        showWebNotification();
                    }
                }

                document.addEventListener('DOMContentLoaded', function() {
                    initCordova();
                    var btn = document.getElementById('triggerBtn');
                    if (btn) {
                        btn.addEventListener('click', handleButtonClick);
                    }
                });
            })();
        </script>
    </body>
</html>
