<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
        <title>Notification Test - Browser & Cordova</title>
        <style>
            * {
                box-sizing: border-box;
            }
            body {
                font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
                background: #f0f4f8;
                margin: 0;
                min-height: 100vh;
                display: flex;
                justify-content: center;
                align-items: center;
                text-align: center;
                padding: 1rem;
            }
            .card {
                background: white;
                border-radius: 2rem;
                box-shadow: 0 20px 35px -10px rgba(0, 0, 0, 0.1);
                padding: 2rem 1.5rem;
                max-width: 480px;
                width: 100%;
            }
            h1 {
                font-size: 1.8rem;
                font-weight: 700;
                margin: 0 0 0.25rem;
                color: #0f172a;
            }
            .sub {
                color: #475569;
                font-size: 0.85rem;
                margin-bottom: 1.8rem;
                border-bottom: 1px solid #e2e8f0;
                display: inline-block;
                padding-bottom: 0.4rem;
            }
            button {
                background: #0f3b7a;
                border: none;
                color: white;
                font-weight: 600;
                font-size: 1.2rem;
                padding: 0.9rem 2rem;
                border-radius: 60px;
                cursor: pointer;
                transition: 0.2s;
                width: 100%;
                max-width: 260px;
                box-shadow: 0 8px 20px rgba(15, 59, 122, 0.3);
            }
            button:hover {
                background: #1e4a8a;
                transform: scale(0.97);
            }
            button:active {
                background: #0f2f60;
                transform: scale(0.96);
            }
            .status {
                margin-top: 1.5rem;
                font-size: 0.75rem;
                background: #f1f5f9;
                padding: 0.5rem 1rem;
                border-radius: 30px;
                color: #2d3a5e;
                word-break: break-word;
            }
            .info {
                margin-top: 1rem;
                font-size: 0.7rem;
                color: #5b6e8c;
            }
        </style>
    </head>
    <body>
        <div class="card">
            <h1>🔔 Notification Test</h1>
            <div class="sub">Browser + Cordova ready</div>
            <button id="triggerBtn">📢 Show notification</button>
            <div class="status" id="statusMsg">Initializing...</div>
            <div class="info">Click the button – notification will appear</div>
        </div>

        <script>
            (function() {
                var isCordova = false;
                var localPlugin = null;
                var statusDiv = document.getElementById('statusMsg');

                function updateStatus(msg) {
                    if (statusDiv) statusDiv.innerText = msg;
                }

                function requestWebPermission() {
                    if (!window.Notification) {
                        updateStatus('Web Notifications not supported');
                        return false;
                    }
                    if (Notification.permission === 'granted') {
                        updateStatus('Web permission granted');
                        return true;
                    }
                    if (Notification.permission !== 'denied') {
                        Notification.requestPermission().then(function(perm) {
                            if (perm === 'granted') {
                                updateStatus('Web permission granted');
                            } else {
                                updateStatus('Web permission denied');
                            }
                        });
                    }
                    return Notification.permission === 'granted';
                }

                function showWebNotification() {
                    if (!window.Notification) {
                        updateStatus('Browser does not support notifications');
                        return;
                    }
                    if (Notification.permission === 'granted') {
                        var notification = new Notification('🔔 Browser Alert', {
                            body: 'You triggered a notification!',
                            icon: null
                        });
                        updateStatus('Web notification sent');
                    } else if (Notification.permission !== 'denied') {
                        Notification.requestPermission().then(function(perm) {
                            if (perm === 'granted') {
                                new Notification('🔔 Browser Alert', {
                                    body: 'You triggered a notification!',
                                    icon: null
                                });
                                updateStatus('Web notification sent');
                            } else {
                                updateStatus('Web permission denied – cannot show');
                            }
                        });
                    } else {
                        updateStatus('Web notifications blocked');
                    }
                }

                function showCordovaNotification() {
                    if (!localPlugin || typeof localPlugin.schedule !== 'function') {
                        updateStatus('Cordova plugin not ready, using web fallback');
                        showWebNotification();
                        return;
                    }
                    var notifId = Math.floor(Date.now() % 9000) + 1000;
                    localPlugin.schedule({
                        id: notifId,
                        title: 'Cordova Alert',
                        text: 'Triggered from app!',
                        foreground: true,
                        priority: 2
                    }, function() {
                        updateStatus('Cordova notification scheduled');
                    }, function(err) {
                        updateStatus('Plugin error: ' + (err || 'unknown'));
                        showWebNotification();
                    });
                }

                function init() {
                    if (typeof window.cordova !== 'undefined') {
                        isCordova = true;
                        document.addEventListener('deviceready', function() {
                            var plugin = null;
                            if (window.cordova && window.cordova.plugins && window.cordova.plugins.notification && window.cordova.plugins.notification.local) {
                                plugin = window.cordova.plugins.notification.local;
                            } else if (window.plugins && window.plugins.notification && window.plugins.notification.local) {
                                plugin = window.plugins.notification.local;
                            }
                            if (plugin) {
                                localPlugin = plugin;
                                updateStatus('Cordova plugin ready');
                            } else {
                                updateStatus('Cordova plugin not found, using web fallback');
                            }
                        }, false);
                    } else {
                        requestWebPermission();
                        updateStatus('Browser mode – web notifications');
                    }
                }

                function onButtonClick() {
                    if (isCordova && localPlugin) {
                        showCordovaNotification();
                    } else if (isCordova && !localPlugin) {
                        updateStatus('Waiting for plugin...');
                        setTimeout(function() {
                            if (localPlugin) {
                                showCordovaNotification();
                            } else {
                                showWebNotification();
                            }
                        }, 500);
                    } else {
                        showWebNotification();
                    }
                }

                document.addEventListener('DOMContentLoaded', function() {
                    init();
                    var btn = document.getElementById('triggerBtn');
                    if (btn) btn.addEventListener('click', onButtonClick);
                });
            })();
        </script>
    </body>
</html>
