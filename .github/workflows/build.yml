name: Build and Deploy Icon Pack

on:
    push:
        branches: [main]
    workflow_dispatch:

permissions:
    contents: read
    pages: write
    id-token: write

jobs:
    build-cordova:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Setup Node.js 20
              uses: actions/setup-node@v4
              with:
                  node-version: 20

            - name: Setup Java JDK 17
              uses: actions/setup-java@v4
              with:
                  distribution: temurin
                  java-version: 17

            - name: Setup Android SDK
              uses: android-actions/setup-android@v3

            - name: Install Android SDK 35
              run: yes | sdkmanager "platforms;android-35"

            - name: Install Cordova
              run: npm install -g cordova

            - name: Prepare project
              run: |
                  mkdir -p www
                  mv *.html *.css *.js *.json www/ 2>/dev/null || true
                  mv images pages www/ 2>/dev/null || true

                  cat > config.xml << 'EOF'
                  <?xml version='1.0' encoding='utf-8'?>
                  <widget id="com.iconpack.builder" version="1.0.0" xmlns="http://www.w3.org/ns/widgets" xmlns:cdv="http://cordova.apache.org/ns/1.0" xmlns:android="http://schemas.android.com/apk/res/android">
                      <name>Icon Pack Builder</name>
                      <description>Build and manage custom icon packs</description>
                      <content src="index.html" />
                      <access origin="*" />
                      <allow-intent href="http://*/*" />
                      <allow-intent href="https://*/*" />
                      <allow-intent href="tel:*" />
                      <allow-intent href="mailto:*" />
                      <platform name="android">
                          <preference name="android-minSdkVersion" value="24" />
                          <preference name="android-targetSdkVersion" value="35" />
                          <preference name="android-compileSdkVersion" value="35" />
                          <preference name="AndroidXEnabled" value="true" />
                          <config-file target="AndroidManifest.xml" parent="/manifest" xmlns:android="http://schemas.android.com/apk/res/android">
                              <uses-permission android:name="android.permission.INTERNET" />
                          </config-file>
                          <config-file target="AndroidManifest.xml" parent="/manifest/application/activity[@android:name='MainActivity']">
                              <intent-filter>
                                  <action android:name="android.intent.action.MAIN" />
                                  <category android:name="android.intent.category.LAUNCHER" />
                              </intent-filter>
                              <intent-filter>
                                  <action android:name="android.intent.action.VIEW" />
                                  <category android:name="android.intent.category.DEFAULT" />
                                  <category android:name="com.cyanogenmod.trebuchet.category.ICON_PACK" />
                              </intent-filter>
                          </config-file>
                          <icon src="icon.png" />
                      </platform>
                  </widget>
                  EOF

                  if [ ! -f icon.png ]; then
                      curl -L -o icon.png "https://raw.githubusercontent.com/lildavegoth/lildavegoth/refs/heads/homepage/images/icons/kiraku-home.png"
                  fi

            - name: Add Android platform
              run: |
                  cordova platform rm android --no-fetch || true
                  cordova platform add android@13 --no-fetch

            - name: Add required plugins
              run: |
                  cordova plugin add cordova-plugin-file

            - name: Decode Keystore
              run: |
                  echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > keystore.jks

            - name: Verify keystore
              run: |
                  keytool -list -v -keystore keystore.jks -storepass "${{ secrets.KEYSTORE_PASSWORD }}" -alias "${{ secrets.KEY_ALIAS }}"

            - name: Create build.json
              run: |
                  cat > build.json << EOF
                  {
                    "android": {
                      "release": {
                        "keystore": "keystore.jks",
                        "alias": "${{ secrets.KEY_ALIAS }}",
                        "storePassword": "${{ secrets.KEYSTORE_PASSWORD }}",
                        "password": "${{ secrets.KEY_PASSWORD }}"
                      }
                    }
                  }
                  EOF

            - name: Build release APK
              run: cordova build android --release -- --packageType=apk

            - name: Upload APK
              uses: actions/upload-artifact@v4
              with:
                  name: icon-pack-builder-release-apk
                  path: platforms/android/**/*.apk
                  if-no-files-found: error
