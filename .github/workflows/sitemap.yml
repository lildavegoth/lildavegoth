name: Generate Sitemap

on:
  push:
    branches: [ homepage ]
  schedule:
    - cron: '0 0 * * 0'
  workflow_dispatch:

jobs:
  sitemap:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - uses: actions/checkout@v3
      
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
      
      - name: Install dependencies
        run: npm install puppeteer
        
      - name: Generate sitemap
        run: |
          node -e '
          const puppeteer = require("puppeteer");
          const fs = require("fs");
          
          (async () => {
            const browser = await puppeteer.launch();
            const page = await browser.newPage();
            
            // Navigate to your site
            await page.goto("https://kakoi-kiraku-home.vercel.app/", { 
              waitUntil: "networkidle0" 
            });
            
            // Extract all links from your dynamic content
            const urls = await page.evaluate(() => {
              const links = [];
              
              // Get all project cards
              document.querySelectorAll(".project-card").forEach(card => {
                const onclick = card.getAttribute("onclick");
                if (onclick) {
                  const match = onclick.match(/window\.location\.href=['"]([^'"]+)/);
                  if (match) links.push(match[1]);
                }
              });
              
              // Get navigation links
              document.querySelectorAll("a[href]").forEach(a => {
                const href = a.getAttribute("href");
                if (href && !href.startsWith("#") && !href.startsWith("http")) {
                  links.push(href);
                }
              });
              
              return [...new Set(links)]; // Remove duplicates
            });
            
            // Generate sitemap
            let sitemap = `<?xml version="1.0" encoding="UTF-8"?>
            <urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">
              <url>
                <loc>https://kakoi-kiraku-home.vercel.app/</loc>
                <lastmod>${new Date().toISOString().split("T")[0]}</lastmod>
                <changefreq>daily</changefreq>
                <priority>1.0</priority>
              </url>`;
                        
                        urls.forEach(url => {
                          if (url.includes(".html")) {
                            sitemap += `
              <url>
                <loc>https://kakoi-kiraku-home.vercel.app/${url}</loc>
                <lastmod>${new Date().toISOString().split("T")[0]}</lastmod>
                <changefreq>weekly</changefreq>
                <priority>0.8</priority>
              </url>`;
                          }
                        });
                        
                        sitemap += `
            </urlset>`;
            
            fs.writeFileSync("sitemap.xml", sitemap);
            console.log("Sitemap generated with", urls.length + 1, "URLs");
            await browser.close();
          })();
          '
      
      - name: Commit sitemap
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add sitemap.xml
          git diff --quiet && git diff --staged --quiet || git commit -m "🤖 Auto-update sitemap"
          git push
