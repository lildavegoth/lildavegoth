name: YouTube Downloader

on:
    workflow_dispatch:
        inputs:
            url:
                description: 'YouTube URL'
                required: true
                type: string
            format_id:
                description: 'Format ID (e.g., best, 22, 18)'
                required: true
                type: string
                default: 'best'

jobs:
    download:
        runs-on: ubuntu-latest
        steps:
            -   name: Setup Python
                uses: actions/setup-python@v5
                with:
                    python-version: '3.11'
            -   name: Install yt-dlp and ffmpeg
                run: |
                    pip install yt-dlp
                    sudo apt-get update && sudo apt-get install -y ffmpeg
            -   name: Download video
                run: |
                    yt-dlp -f "${{ github.event.inputs.format_id }}" \
                      -o "video.%(ext)s" \
                      "${{ github.event.inputs.url }}"
            -   name: Upload artifact
                uses: actions/upload-artifact@v4
                with:
                    name: youtube-video
                    path: video.*
