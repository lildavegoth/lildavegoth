name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [homepage]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup JDK 17
      uses: actions/setup-java@v3
      with:
        distribution: 'temurin'
        java-version: '17'
        
    - name: Install Bubblewrap
      run: |
        npm install -g @bubblewrap/cli
        
    - name: Initialize TWA
      run: |
        printf "y\n/usr/lib/jvm/temurin-17-jdk-amd64\n" | bubblewrap init \
          --manifest=https://lildavegoth.vercel.app/manifest.json \
          --directory=./android-app \
          --defaults
      env:
        BUBBLEWRAP_KEYSTORE_PASSWORD: "android"
        BUBBLEWRAP_KEY_PASSWORD: "android"
        
    - name: Build APK
      run: |
        cd android-app
        bubblewrap build
        
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: kakoi-kiraku-app
        path: android-app/app-release-signed.apk
