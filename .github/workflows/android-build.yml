name: Build Android APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Setup Bubblewrap
      run: |
        npm install -g @bubblewrap/cli
        bubblewrap init --manifest=https://YOUR-VERCEL-APP.vercel.app/manifest.json --defaults
        
    - name: Build APK
      run: bubblewrap build
        
    - name: Upload APK
      uses: actions/upload-artifact@v3
      with:
        name: app-release
        path: app-release.apk
