name: Build Cordova Android APK

on:
  push:
    branches: [ homepage ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        run: |
          yes | sdkmanager "platforms;android-35"

      - name: Install Cordova
        run: npm install -g cordova

      - name: Prepare project
        run: |
          mkdir -p www
          # Copy all necessary file types – including .cssjs
          mv *.html *.css *.js *.json *.cssjs sw.js robots.txt sitemap.xml www/ 2>/dev/null || true
          mv images pages www/ 2>/dev/null || true

          # Download icon and create splash resources
          curl -L -o icon.png "https://raw.githubusercontent.com/lildavegoth/lildavegoth/refs/heads/homepage/images/icons/kiraku-home.png"
          
          # Generate config.xml with proper indentation and fixes
          cat > config.xml << 'EOF'
          <?xml version='1.0' encoding='utf-8'?>
          <widget id="com.kakoikiraku.home" version="1.0.0" versionCode="${{ github.run_number }}" xmlns="http://www.w3.org/ns/widgets" xmlns:cdv="http://cordova.apache.org/ns/1.0">
              <name>Kakoi Kiraku Home</name>
              <description>Break the limitation of imaginations</description>
              <content src="index.html" />
              <access origin="*" />
              <allow-intent href="http://*/*" />
              <allow-intent href="https://*/*" />
              <allow-intent href="tel:*" />
              <allow-intent href="mailto:*" />
              <platform name="android">
                  <preference name="android-minSdkVersion" value="24" />
                  <preference name="android-targetSdkVersion" value="35" />
                  <preference name="AndroidXEnabled" value="true" />
                  <!-- Modern splash screen – icon centered on background -->
                  <preference name="AndroidWindowSplashScreenAnimatedIcon" value="icon.png" />
                  <preference name="AndroidWindowSplashScreenBackground" value="#000000" />
                  <!-- Icon (used for app icon and splash) -->
                  <icon src="icon.png" />
                  <config-file target="AndroidManifest.xml" parent="/manifest" xmlns:android="http://schemas.android.com/apk/android">
                      <uses-permission android:name="android.permission.INTERNET" />
                      <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
                      <!-- Only one READ_EXTERNAL_STORAGE declaration (plugins add it) -->
                      <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="32" />
                      <uses-permission android:name="android.permission.READ_MEDIA_IMAGES" />
                      <uses-permission android:name="android.permission.READ_MEDIA_VIDEO" />
                      <uses-permission android:name="android.permission.READ_MEDIA_AUDIO" />
                      <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
                      <uses-permission android:name="android.permission.CAMERA" />
                      <uses-permission android:name="android.permission.RECORD_AUDIO" />
                      <uses-permission android:name="android.permission.VIBRATE" />
                  </config-file>
              </platform>
          </widget>
          EOF
          sed -i 's/^          //' config.xml

      - name: Safe patch export functions for Cordova
        run: |
          node <<'EOF'
          const fs = require('fs');
          const path = require('path');

          // Helper to escape backticks for embedding in a template literal
          function escapeBackticks(str) {
            return str.replace(/`/g, '\\`');
          }

          function patchExportFunction(content) {
            const exportRegex = /exportData\s*\(\s*\)\s*\{([\s\S]*?)(\n\s*\})/g;
            let match;
            let modified = false;

            while ((match = exportRegex.exec(content)) !== null) {
              const fullMatch = match[0];
              const body = match[1];

              if (fullMatch.includes('window.cordova')) continue;

              // New Cordova-specific code block
              const cordovaCode = `
                // Cordova export: write file to Downloads
                let dataToSave;
                // Try to capture data from the original scope
                if (typeof data !== 'undefined') dataToSave = data;
                else if (typeof this !== 'undefined') dataToSave = this;
                else dataToSave = {};

                const jsonStr = JSON.stringify(dataToSave, null, 2);
                const fileName = \`export-\${Date.now()}.json\`;

                window.resolveLocalFileSystemURL(
                  cordova.file.externalRootDirectory + 'Download/',
                  function(dir) {
                    dir.getFile(fileName, { create: true }, function(fileEntry) {
                      fileEntry.createWriter(function(fileWriter) {
                        fileWriter.onwriteend = function() {
                          if (cordova.plugins && cordova.plugins.fileOpener2) {
                            cordova.plugins.fileOpener2.open(
                              fileEntry.toURL(),
                              'application/json',
                              { error: function(e) { console.error('Error opening file', e); } }
                            );
                          }
                          if (window.showMessage) window.showMessage('File saved to Downloads', 'success');
                        };
                        fileWriter.write(jsonStr);
                      }, function(err) { if (window.showMessage) window.showMessage('Error writing file', 'error'); });
                    }, function(err) { if (window.showMessage) window.showMessage('Error creating file', 'error'); });
                  },
                  function(err) { if (window.showMessage) window.showMessage('Error accessing Downloads', 'error'); }
                );
              `;

              const newBody = `exportData() {
                if (window.cordova) {
                  ${escapeBackticks(cordovaCode)}
                } else {
                  // Original browser code
                  ${escapeBackticks(body)}
                }
              }`;

              content = content.replace(fullMatch, newBody);
              modified = true;
            }
            return { content, modified };
          }

          function walkAndPatch(dir) {
            const files = fs.readdirSync(dir);
            for (const file of files) {
              const fullPath = path.join(dir, file);
              const stat = fs.statSync(fullPath);
              if (stat.isDirectory()) {
                walkAndPatch(fullPath);
              } else if (file.endsWith('.html') || file.endsWith('.js')) {
                let content = fs.readFileSync(fullPath, 'utf8');
                const { content: newContent, modified } = patchExportFunction(content);
                if (modified) {
                  fs.writeFileSync(fullPath, newContent, 'utf8');
                  console.log(`Patched export in: ${fullPath}`);
                }
              }
            }
          }

          walkAndPatch('www');
          EOF

      - name: Add Android platform
        run: |
          cordova platform rm android --no-fetch || true
          cordova platform add android --no-fetch

      - name: Add plugins
        run: |
          cordova plugin add cordova-plugin-file
          cordova plugin add cordova-plugin-local-notification
          cordova plugin add cordova-plugin-device
          cordova plugin add cordova-plugin-inappbrowser
          cordova plugin add cordova-plugin-android-permissions
          cordova plugin add cordova-plugin-camera
          cordova plugin add cordova-plugin-media-capture
          cordova plugin add cordova-plugin-splashscreen
          cordova plugin add cordova-plugin-file-opener2

      - name: Build debug APK
        run: cordova build android --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: kakoi-kiraku-home-debug-apk
          path: platforms/android/app/build/outputs/apk/debug/app-debug.apk
