name: Build Cordova Android APK

on:
  push:
    branches: [ homepage ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # Install Android API 35 platform (required for windowOptOutEdgeToEdgeEnforcement)
      - name: Install Android SDK 35
        run: |
          yes | sdkmanager "platforms;android-35"

      - name: Install Cordova
        run: npm install -g cordova

      - name: Prepare project (auto fix)
        run: |
          mkdir -p www
          mv *.html *.css *.js *.json sw.js robots.txt sitemap.xml www/ 2>/dev/null || true
          mv images pages www/ 2>/dev/null || true

          # Download icon and splash image (same image)
          curl -L -o icon.png "https://raw.githubusercontent.com/lildavegoth/lildavegoth/refs/heads/homepage/images/icons/kiraku-home.png"

          # Generate config.xml with proper indentation.
          # YAML indentation adds 10 spaces before each line.
          # We remove exactly 10 spaces from each line with sed,
          # leaving the desired indentation (0 for xml decl, 4 for children, etc.)
          cat > config.xml << 'EOF'
          <?xml version='1.0' encoding='utf-8'?>
          <widget id="com.kakoikiraku.home" version="1.0.0" xmlns="http://www.w3.org/ns/widgets" xmlns:cdv="http://cordova.apache.org/ns/1.0">
              <name>Kakoi Kiraku Home</name>
              <description>Break the limitation of imaginations</description>
              <content src="index.html" />
              <access origin="*" />
              <allow-intent href="http://*/*" />
              <allow-intent href="https://*/*" />
              <allow-intent href="tel:*" />
              <allow-intent href="mailto:*" />
              <platform name="android">
                  <preference name="android-minSdkVersion" value="24" />
                  <preference name="android-targetSdkVersion" value="35" />
                  <preference name="AndroidXEnabled" value="true" />
                  <config-file target="AndroidManifest.xml" parent="/manifest" xmlns:android="http://schemas.android.com/apk/res/android">
                      <uses-permission android:name="android.permission.INTERNET" />
                      <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
                      <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32" />
                      <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="32" />
                      <uses-permission android:name="android.permission.READ_MEDIA_IMAGES" />
                      <uses-permission android:name="android.permission.READ_MEDIA_VIDEO" />
                      <uses-permission android:name="android.permission.READ_MEDIA_AUDIO" />
                      <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
                      <uses-permission android:name="android.permission.CAMERA" />
                      <uses-permission android:name="android.permission.RECORD_AUDIO" />
                      <uses-permission android:name="android.permission.VIBRATE" />
                  </config-file>
                  <!-- Icon configuration (single image used for all densities) -->
                  <icon src="icon.png" />
                  <!-- Splash screen configuration (same image) -->
                  <splash src="icon.png" />
              </platform>
          </widget>
          EOF
          # Remove the 10 spaces added by YAML indentation, preserving the XML indentation
          sed -i 's/^          //' config.xml

      - name: Add Android platform
        run: |
          cordova platform rm android --no-fetch || true
          cordova platform add android --no-fetch

      - name: Add plugins for full features
        run: |
          cordova plugin add cordova-plugin-file
          cordova plugin add cordova-plugin-local-notification
          cordova plugin add cordova-plugin-device
          cordova plugin add cordova-plugin-inappbrowser
          cordova plugin add cordova-plugin-android-permissions
          cordova plugin add cordova-plugin-camera
          cordova plugin add cordova-plugin-media-capture
          cordova plugin add cordova-plugin-splashscreen

      - name: Build debug APK
        run: cordova build android --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: kakoi-kiraku-home-debug-apk
          path: platforms/android/app/build/outputs/apk/debug/app-debug.apk
