name: Build Cordova Android APK

on:
  push:
    branches: [ homepage ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        run: |
          yes | sdkmanager "platforms;android-35"

      - name: Install Cordova
        run: npm install -g cordova

      - name: Prepare project
        run: |
          mkdir -p www
          # Copy all necessary file types – added .cssjs
          mv *.html *.css *.js *.json *.cssjs sw.js robots.txt sitemap.xml www/ 2>/dev/null || true
          mv images pages www/ 2>/dev/null || true

          # Download icon
          curl -L -o icon.png "https://raw.githubusercontent.com/lildavegoth/lildavegoth/refs/heads/homepage/images/icons/kiraku-home.png"

          # Generate config.xml with proper indentation and fixed permissions / splash
          cat > config.xml << 'EOF'
          <?xml version='1.0' encoding='utf-8'?>
          <widget id="com.kakoikiraku.home" version="1.0.0" xmlns="http://www.w3.org/ns/widgets" xmlns:cdv="http://cordova.apache.org/ns/1.0">
              <name>Kakoi Kiraku Home</name>
              <description>Break the limitation of imaginations</description>
              <content src="index.html" />
              <access origin="*" />
              <allow-intent href="http://*/*" />
              <allow-intent href="https://*/*" />
              <allow-intent href="tel:*" />
              <allow-intent href="mailto:*" />
              <platform name="android">
                  <preference name="android-minSdkVersion" value="24" />
                  <preference name="android-targetSdkVersion" value="35" />
                  <preference name="AndroidXEnabled" value="true" />
                  <!-- Modern splash screen preference (replaces deprecated <splash>) -->
                  <preference name="AndroidWindowSplashScreenAnimatedIcon" value="icon.png" />
                  <config-file target="AndroidManifest.xml" parent="/manifest" xmlns:android="http://schemas.android.com/apk/android">
                      <uses-permission android:name="android.permission.INTERNET" />
                      <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
                      <!-- READ_EXTERNAL_STORAGE is now handled by plugins – removed duplicate -->
                      <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="32" />
                      <uses-permission android:name="android.permission.READ_MEDIA_IMAGES" />
                      <uses-permission android:name="android.permission.READ_MEDIA_VIDEO" />
                      <uses-permission android:name="android.permission.READ_MEDIA_AUDIO" />
                      <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
                      <uses-permission android:name="android.permission.CAMERA" />
                      <uses-permission android:name="android.permission.RECORD_AUDIO" />
                      <uses-permission android:name="android.permission.VIBRATE" />
                  </config-file>
                  <icon src="icon.png" />
              </platform>
          </widget>
          EOF
          sed -i 's/^          //' config.xml

      - name: Auto‑patch export functions for Cordova (Node.js)
        run: |
          node <<'EOF'
          const fs = require('fs');
          const path = require('path');

          function patchFile(filePath) {
            let content = fs.readFileSync(filePath, 'utf8');
            // Match exportData function definitions (simple pattern)
            const exportRegex = /exportData\s*\(\s*\)\s*\{([\s\S]*?)\}/g;
            let match;
            let modified = false;

            while ((match = exportRegex.exec(content)) !== null) {
              const fullMatch = match[0];
              const body = match[1];

              // Skip if already patched (contains cordova check)
              if (fullMatch.includes('window.cordova')) continue;

              // Create new function body with platform check
              const newBody = `{
                const data = { /* your data object */ };
                const jsonStr = JSON.stringify(data, null, 2);
                const fileName = \`routine-quest-backup-\${Date.now()}.rqsave\`;

                if (window.cordova) {
                  window.resolveLocalFileSystemURL(
                    cordova.file.externalDataDirectory,
                    function(dir) {
                      dir.getFile(fileName, { create: true }, function(fileEntry) {
                        fileEntry.createWriter(function(fileWriter) {
                          fileWriter.onwriteend = function() {
                            cordova.plugins.fileOpener2.open(
                              fileEntry.toURL(),
                              "text/plain",
                              { error: function(e) { console.error("Error opening file", e); } }
                            );
                            window.showMessage("File saved!", "success");
                          };
                          fileWriter.write(jsonStr);
                        }, function(err) { window.showMessage("Error writing file", "error"); });
                      });
                    },
                    function(err) { window.showMessage("Error accessing storage", "error"); }
                  );
                } else {
                  // Original browser code
                  const blob = new Blob([jsonStr], { type: "text/plain" });
                  const url = URL.createObjectURL(blob);
                  const a = document.createElement("a");
                  a.href = url;
                  a.download = fileName;
                  a.click();
                  URL.revokeObjectURL(url);
                  window.showMessage("Data exported successfully!", "success");
                }
              }`;

              content = content.replace(fullMatch, `exportData() ${newBody}`);
              modified = true;
            }

            if (modified) {
              fs.writeFileSync(filePath, content, 'utf8');
              console.log(`Patched: ${filePath}`);
            }
          }

          function walkDir(dir) {
            const files = fs.readdirSync(dir);
            for (const file of files) {
              const fullPath = path.join(dir, file);
              const stat = fs.statSync(fullPath);
              if (stat.isDirectory()) {
                walkDir(fullPath);
              } else if (file.endsWith('.html') || file.endsWith('.js')) {
                patchFile(fullPath);
              }
            }
          }

          walkDir('www');
          EOF

      - name: Add Android platform
        run: |
          cordova platform rm android --no-fetch || true
          cordova platform add android --no-fetch

      - name: Add plugins for full features
        run: |
          cordova plugin add cordova-plugin-file
          cordova plugin add cordova-plugin-local-notification
          cordova plugin add cordova-plugin-device
          cordova plugin add cordova-plugin-inappbrowser
          cordova plugin add cordova-plugin-android-permissions
          cordova plugin add cordova-plugin-camera
          cordova plugin add cordova-plugin-media-capture
          cordova plugin add cordova-plugin-splashscreen
          cordova plugin add cordova-plugin-file-opener2

      - name: Build debug APK
        run: cordova build android --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: kakoi-kiraku-home-debug-apk
          path: platforms/android/app/build/outputs/apk/debug/app-debug.apk
