name: Build Cordova Android APK

on:
  push:
    branches: [ homepage ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Cordova
        run: npm install -g cordova

      - name: Prepare project (auto fix)
        run: |
          mkdir -p www
          mv *.html *.css *.js *.json sw.js robots.txt sitemap.xml www/ 2>/dev/null || true
          mv images pages www/ 2>/dev/null || true
          cat > config.xml << 'EOF'
          <?xml version='1.0' encoding='utf-8'?>
          <widget id="com.lildavegoth.app" version="1.0.0" xmlns="http://www.w3.org/ns/widgets" xmlns:cdv="http://cordova.apache.org/ns/1.0" xmlns:android="http://schemas.android.com/apk/res/android">
              <name>lildavegoth</name>
              <description>Break the limitation of imaginations</description>
              <content src="index.html" />
              <access origin="*" />
              <allow-intent href="http://*/*" />
              <allow-intent href="https://*/*" />
              <allow-intent href="tel:*" />
              <allow-intent href="mailto:*" />
              <platform name="android">
                  <preference name="android-minSdkVersion" value="24" />
                  <preference name="android-targetSdkVersion" value="34" />
                  <preference name="AndroidXEnabled" value="true" />
                  <config-file target="AndroidManifest.xml" parent="/manifest">
                      <uses-permission android:name="android.permission.INTERNET" />
                      <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
                      <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32" />
                      <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="32" />
                      <uses-permission android:name="android.permission.READ_MEDIA_IMAGES" />
                      <uses-permission android:name="android.permission.READ_MEDIA_VIDEO" />
                      <uses-permission android:name="android.permission.READ_MEDIA_AUDIO" />
                      <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
                      <uses-permission android:name="android.permission.CAMERA" />
                      <uses-permission android:name="android.permission.RECORD_AUDIO" />
                      <uses-permission android:name="android.permission.VIBRATE" />
                  </config-file>
              </platform>
          </widget>
          EOF
          sed -i 's/^          //' config.xml

      - name: Add Android platform
        run: |
          cordova platform rm android --no-fetch || true
          cordova platform add android --no-fetch

      - name: Add plugins for full features
        run: |
          cordova plugin add cordova-plugin-file
          cordova plugin add cordova-plugin-local-notification
          cordova plugin add cordova-plugin-device
          cordova plugin add cordova-plugin-inappbrowser
          cordova plugin add cordova-plugin-android-permissions
          cordova plugin add cordova-plugin-camera
          cordova plugin add cordova-plugin-media-capture

      - name: Build debug APK
        run: cordova build android --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: lildavegoth-debug-apk
          path: platforms/android/app/build/outputs/apk/debug/app-debug.apk
