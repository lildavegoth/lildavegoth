name: Build and Deploy

on:
  push:
    branches: [ homepage ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-cordova:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        run: yes | sdkmanager "platforms;android-35"

      - name: Install Cordova
        run: npm install -g cordova

      - name: Prepare project
        run: |
          mkdir -p www
          mv *.html *.css *.js *.cssjs *.json sw.js robots.txt sitemap.xml www/ 2>/dev/null || true
          mv images pages www/ 2>/dev/null || true

          curl -L -o icon.png "https://raw.githubusercontent.com/lildavegoth/lildavegoth/refs/heads/homepage/images/icons/kiraku-home.png"

          cat > config.xml << 'EOF'
          <?xml version='1.0' encoding='utf-8'?>
          <widget id="com.kakoikiraku.home" version="1.0.0" xmlns="http://www.w3.org/ns/widgets" xmlns:cdv="http://cordova.apache.org/ns/1.0">
              <name>Kakoi Kiraku Home</name>
              <description>Conveys the Idea of a Protected and Inspiring Space for Creative Expression</description>
              <content src="index.html" />
              <access origin="*" />
              <allow-intent href="http://*/*" />
              <allow-intent href="https://*/*" />
              <allow-intent href="tel:*" />
              <allow-intent href="mailto:*" />
              <platform name="android">
                  <preference name="android-minSdkVersion" value="24" />
                  <preference name="android-targetSdkVersion" value="35" />
                  <preference name="AndroidXEnabled" value="true" />
                  <config-file target="AndroidManifest.xml" parent="/manifest" xmlns:android="http://schemas.android.com/apk/res/android">
                      <uses-permission android:name="android.permission.INTERNET" />
                      <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
                      <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32" />
                      <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="32" />
                      <uses-permission android:name="android.permission.READ_MEDIA_IMAGES" />
                      <uses-permission android:name="android.permission.READ_MEDIA_VIDEO" />
                      <uses-permission android:name="android.permission.READ_MEDIA_AUDIO" />
                      <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
                      <uses-permission android:name="android.permission.VIBRATE" />
                  </config-file>
                  <icon src="icon.png" />
              </platform>
          </widget>
          EOF

          sed -i 's/^          //' config.xml

      - name: Add Android platform
        run: |
          cordova platform rm android --no-fetch || true
          cordova platform add android@13 --no-fetch

      - name: Add plugins
        run: |
          cordova plugin add cordova-plugin-file
          cordova plugin add cordova-plugin-local-notification
          cordova plugin add cordova-plugin-device
          cordova plugin add cordova-plugin-inappbrowser
          cordova plugin add cordova-plugin-android-permissions
          cordova plugin add cordova-plugin-media-capture

      - name: Build debug APK
        run: cordova build android --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: kakoi-kiraku-home-apk
          path: platforms/android/app/build/outputs/apk/debug/app-debug.apk

  build-jekyll:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install html-minifier-terser
        run: npm install -g html-minifier-terser

      - name: Minify HTML to new directory
        run: |
          mkdir -p ./_site_min
          html-minifier-terser \
            --collapse-whitespace \
            --remove-comments \
            --remove-redundant-attributes \
            --remove-script-type-attributes \
            --remove-style-link-type-attributes \
            --use-short-doctype \
            --minify-css true \
            --minify-js true \
            --input-dir ./_site \
            --output-dir ./_site_min \
            --file-ext html

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site_min

  deploy-jekyll:
    needs: build-jekyll
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
