name: Build and Deploy

on:
    push:
        branches: [homepage]
    workflow_dispatch:

permissions:
    contents: read
    pages: write
    id-token: write

jobs:
    build-cordova:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Setup Node.js 20
              uses: actions/setup-node@v4
              with:
                  node-version: 20

            - name: Setup Java JDK 17
              uses: actions/setup-java@v4
              with:
                  distribution: temurin
                  java-version: 17

            - name: Setup Android SDK
              uses: android-actions/setup-android@v3

            - name: Install Android SDK 35
              run: yes | sdkmanager "platforms;android-35"

            - name: Install Cordova
              run: npm install -g cordova

            - name: Prepare project
              run: |
                  mkdir -p www
                  mv *.html *.css *.js *.cssjs *.json sw.js robots.txt sitemap.xml www/ 2>/dev/null || true
                  mv images pages www/ 2>/dev/null || true

                  curl -L -o icon.png "https://raw.githubusercontent.com/lildavegoth/lildavegoth/refs/heads/homepage/images/icons/kiraku-home.png"

                  cat > config.xml << 'EOF'
                  <?xml version='1.0' encoding='utf-8'?>
                  <widget id="com.kakoikiraku.home" version="1.0.0" xmlns="http://www.w3.org/ns/widgets" xmlns:cdv="http://cordova.apache.org/ns/1.0" xmlns:android="http://schemas.android.com/apk/res/android">
                      <name>Kakoi Kiraku Home</name>
                      <description>Conveys the Idea of a Protected and Inspiring Space for Creative Expression</description>
                      <content src="index.html" />
                      <access origin="*" />
                      <allow-intent href="http://*/*" />
                      <allow-intent href="https://*/*" />
                      <allow-intent href="tel:*" />
                      <allow-intent href="mailto:*" />
                      <platform name="android">
                          <preference name="android-minSdkVersion" value="24" />
                          <preference name="android-targetSdkVersion" value="35" />
                          <preference name="AndroidXEnabled" value="true" />
                          <config-file target="AndroidManifest.xml" parent="/manifest" xmlns:android="http://schemas.android.com/apk/res/android">
                              <uses-permission android:name="android.permission.INTERNET" />
                              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
                              <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="32" />
                              <uses-permission android:name="android.permission.READ_MEDIA_IMAGES" />
                              <uses-permission android:name="android.permission.READ_MEDIA_VIDEO" />
                              <uses-permission android:name="android.permission.READ_MEDIA_AUDIO" />
                              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
                              <uses-permission android:name="android.permission.VIBRATE" />
                          </config-file>
                          <icon src="icon.png" />
                      </platform>
                  </widget>
                  EOF

                  sed -i 's/^          //' config.xml

            - name: Generate custom plugin files
              run: |
                  PLUGIN_DIR="kakoikiraku-iconpack-plugin"
                  mkdir -p "$PLUGIN_DIR/src/android"
                  mkdir -p "$PLUGIN_DIR/www"
                  mkdir -p "$PLUGIN_DIR/res/xml"

                  cat > "$PLUGIN_DIR/plugin.xml" << 'EOF'
                  <?xml version='1.0' encoding='utf-8'?>
                  <plugin id="cordova-plugin-kakoikiraku-iconpack" version="1.0.0" xmlns="http://apache.org/cordova/ns/plugins/1.0">
                      <name>KakoiKirakuIconPack</name>
                      <js-module name="KakoiKirakuIconPack" src="www/KakoiKirakuIconPack.js">
                          <clobbers target="cordova.plugins.KakoiKirakuIconPack" />
                      </js-module>
                      <platform name="android">
                          <config-file target="res/xml/config.xml" parent="/*">
                              <feature name="KakoiKirakuIconPack">
                                  <param name="android-package" value="com.kakoikiraku.iconpack.KakoiKirakuIconPack"/>
                              </feature>
                          </config-file>
                          <config-file target="AndroidManifest.xml" parent="/manifest/application">
                              <provider
                                  android:name="com.kakoikiraku.iconpack.IconProvider"
                                  android:authorities="${applicationId}.iconprovider"
                                  android:exported="true"
                                  android:grantUriPermissions="true" />
                          </config-file>
                          <config-file target="AndroidManifest.xml" parent="/manifest/application/activity">
                              <intent-filter>
                                  <action android:name="org.adw.launcher.THEMES" />
                                  <category android:name="android.intent.category.DEFAULT" />
                              </intent-filter>
                          </config-file>
                          <config-file target="AndroidManifest.xml" parent="/manifest/application">
                              <meta-data android:name="org.adw.launcher.icons" android:resource="@xml/iconpack" />
                          </config-file>
                          <resource-file src="res/xml/iconpack.xml" target="res/xml/iconpack.xml" />
                          <config-file target="AndroidManifest.xml" parent="/manifest">
                              <uses-permission android:name="android.permission.INTERNET" />
                              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
                          </config-file>
                          <source-file src="src/android/KakoiKirakuIconPack.java" target-dir="src/com/kakoikiraku/iconpack"/>
                          <source-file src="src/android/IconProvider.java" target-dir="src/com/kakoikiraku/iconpack"/>
                      </platform>
                  </plugin>
                  EOF

                  cat > "$PLUGIN_DIR/package.json" << 'EOF'
                  {
                      "name": "cordova-plugin-kakoikiraku-iconpack",
                      "version": "1.0.0"
                  }
                  EOF

                  cat > "$PLUGIN_DIR/res/xml/iconpack.xml" << 'EOF'
                  <?xml version="1.0" encoding="utf-8"?>
                  <iconpack />
                  EOF

                  cat > "$PLUGIN_DIR/www/KakoiKirakuIconPack.js" << 'EOF'
                  cordova.define("cordova-plugin-kakoikiraku-iconpack.KakoiKirakuIconPack", function(require, exports, module) {
                      var exec = require('cordova/exec');
                      exports.authenticate = function(token,success,error){exec(success,error,'KakoiKirakuIconPack','authenticate',[token]);};
                      exports.syncIcons = function(manifestUrl,success,error){exec(success,error,'KakoiKirakuIconPack','syncIcons',[manifestUrl]);};
                      exports.addIcon = function(pkg,activity,base64Image,success,error){exec(success,error,'KakoiKirakuIconPack','addIcon',[pkg,activity,base64Image]);};
                      exports.listIcons = function(success,error){exec(success,error,'KakoiKirakuIconPack','listIcons',[]);};
                      exports.test = function(success,error){exec(success,error,'KakoiKirakuIconPack','test',[]);};
                  });
                  EOF

                  cat > "$PLUGIN_DIR/src/android/KakoiKirakuIconPack.java" << 'EOF'
                  package com.kakoikiraku.iconpack;
                  import android.util.Base64;
                  import android.util.Log;
                  import org.apache.cordova.CallbackContext;
                  import org.apache.cordova.CordovaPlugin;
                  import org.apache.cordova.PluginResult;
                  import org.json.JSONArray;
                  import org.json.JSONException;
                  import org.json.JSONObject;
                  import java.io.BufferedReader;
                  import java.io.ByteArrayOutputStream;
                  import java.io.File;
                  import java.io.FileOutputStream;
                  import java.io.InputStream;
                  import java.io.InputStreamReader;
                  import java.net.HttpURLConnection;
                  import java.net.URL;
                  import java.security.KeyStore;
                  import java.util.concurrent.ExecutorService;
                  import java.util.concurrent.Executors;
                  import javax.crypto.Cipher;
                  import javax.crypto.KeyGenerator;
                  import javax.crypto.SecretKey;
                  import javax.crypto.spec.GCMParameterSpec;
                  public class KakoiKirakuIconPack extends CordovaPlugin {
                      private static final String TAG = "KakoiKirakuIconPack";
                      private static final String ANDROID_KEY_STORE = "AndroidKeyStore";
                      private static final String KEY_ALIAS = "KakoiKirakuKey";
                      private SecretKey secretKey;
                      private String userToken;
                      private final ExecutorService executor = Executors.newSingleThreadExecutor();
                      @Override
                      public boolean execute(String action, JSONArray args, CallbackContext callbackContext) throws JSONException {
                          if ("authenticate".equals(action)) {
                              String token = args.getString(0);
                              authenticate(token, callbackContext);
                              return true;
                          } else if ("syncIcons".equals(action)) {
                              String manifestUrl = args.getString(0);
                              syncIcons(manifestUrl, callbackContext);
                              return true;
                          } else if ("addIcon".equals(action)) {
                              String pkg = args.getString(0);
                              String activity = args.getString(1);
                              String base64Image = args.getString(2);
                              addIcon(pkg, activity, base64Image, callbackContext);
                              return true;
                          } else if ("listIcons".equals(action)) {
                              listIcons(callbackContext);
                              return true;
                          } else if ("test".equals(action)) {
                              callbackContext.success("Plugin is working");
                              return true;
                          }
                          return false;
                      }
                      private void authenticate(String token, CallbackContext callbackContext) {
                          this.userToken = token;
                          callbackContext.success();
                      }
                      private void syncIcons(String manifestUrl, CallbackContext callbackContext) {
                          executor.execute(() -> {
                              try {
                                  JSONArray manifest = downloadJsonArray(manifestUrl);
                                  if (manifest == null) {
                                      callbackContext.error("Failed to download manifest");
                                      return;
                                  }
                                  for (int i = 0; i < manifest.length(); i++) {
                                      JSONObject entry = manifest.getJSONObject(i);
                                      String pkg = entry.getString("pkg");
                                      String activity = entry.getString("activity");
                                      String iconPath = entry.getString("path");
                                      String base64 = downloadIconAsBase64(iconPath);
                                      if (base64 != null) {
                                          addIcon(pkg, activity, base64, null);
                                      }
                                      if (i % 10 == 0) {
                                          PluginResult progress = new PluginResult(PluginResult.Status.OK, "progress:" + i);
                                          progress.setKeepCallback(true);
                                          callbackContext.sendPluginResult(progress);
                                      }
                                  }
                                  callbackContext.success("Sync complete");
                              } catch (Exception e) {
                                  callbackContext.error("Sync error: " + e.getMessage());
                              }
                          });
                      }
                      private JSONArray downloadJsonArray(String urlString) {
                          try {
                              URL url = new URL(urlString);
                              HttpURLConnection conn = (HttpURLConnection) url.openConnection();
                              conn.setRequestProperty("X-User-Token", userToken);
                              conn.connect();
                              InputStream is = conn.getInputStream();
                              BufferedReader reader = new BufferedReader(new InputStreamReader(is));
                              StringBuilder sb = new StringBuilder();
                              String line;
                              while ((line = reader.readLine()) != null) {
                                  sb.append(line);
                              }
                              reader.close();
                              is.close();
                              conn.disconnect();
                              return new JSONArray(sb.toString());
                          } catch (Exception e) {
                              Log.e(TAG, "downloadJsonArray error", e);
                              return null;
                          }
                      }
                      private String downloadIconAsBase64(String path) {
                          try {
                              String baseUrl = "https://kakoi-kiraku-icon-proxy.lildavegothstoragecom.workers.dev/";
                              URL url = new URL(baseUrl + path);
                              HttpURLConnection conn = (HttpURLConnection) url.openConnection();
                              conn.setRequestProperty("X-User-Token", userToken);
                              conn.connect();
                              InputStream is = conn.getInputStream();
                              ByteArrayOutputStream baos = new ByteArrayOutputStream();
                              byte[] buffer = new byte[4096];
                              int bytesRead;
                              while ((bytesRead = is.read(buffer)) != -1) {
                                  baos.write(buffer, 0, bytesRead);
                              }
                              is.close();
                              conn.disconnect();
                              byte[] imageBytes = baos.toByteArray();
                              return Base64.encodeToString(imageBytes, Base64.DEFAULT);
                          } catch (Exception e) {
                              Log.e(TAG, "downloadIconAsBase64 error for " + path, e);
                              return null;
                          }
                      }
                      private void addIcon(String pkg, String activity, String base64Image, CallbackContext callbackContext) {
                          try {
                              byte[] decoded = Base64.decode(base64Image, Base64.DEFAULT);
                              byte[] encrypted = encrypt(decoded);
                              File outFile = new File(cordova.getContext().getFilesDir(), pkg + "_" + activity + ".enc");
                              try (FileOutputStream fos = new FileOutputStream(outFile)) {
                                  fos.write(encrypted);
                              }
                              if (callbackContext != null) {
                                  callbackContext.success();
                              }
                          } catch (Exception e) {
                              Log.e(TAG, "addIcon error", e);
                              if (callbackContext != null) {
                                  callbackContext.error(e.getMessage());
                              }
                          }
                      }
                      private void listIcons(CallbackContext callbackContext) {
                          try {
                              File dir = cordova.getContext().getFilesDir();
                              File[] files = dir.listFiles();
                              JSONArray list = new JSONArray();
                              if (files != null) {
                                  for (File f : files) {
                                      if (f.getName().endsWith(".enc")) {
                                          list.put(f.getName());
                                      }
                                  }
                              }
                              callbackContext.success(list);
                          } catch (Exception e) {
                              callbackContext.error(e.getMessage());
                          }
                      }
                      private byte[] encrypt(byte[] plaintext) throws Exception {
                          KeyStore keyStore = KeyStore.getInstance(ANDROID_KEY_STORE);
                          keyStore.load(null);
                          if (!keyStore.containsAlias(KEY_ALIAS)) {
                              KeyGenerator kg = KeyGenerator.getInstance("AES", ANDROID_KEY_STORE);
                              kg.init(256);
                              secretKey = kg.generateKey();
                          } else {
                              secretKey = (SecretKey) keyStore.getKey(KEY_ALIAS, null);
                          }
                          Cipher cipher = Cipher.getInstance("AES/GCM/NoPadding");
                          cipher.init(Cipher.ENCRYPT_MODE, secretKey);
                          byte[] iv = cipher.getIV();
                          byte[] cipherText = cipher.doFinal(plaintext);
                          byte[] encrypted = new byte[iv.length + cipherText.length];
                          System.arraycopy(iv, 0, encrypted, 0, iv.length);
                          System.arraycopy(cipherText, 0, encrypted, iv.length, cipherText.length);
                          return encrypted;
                      }
                  }
                  EOF

                  cat > "$PLUGIN_DIR/src/android/IconProvider.java" << 'EOF'
                  package com.kakoikiraku.iconpack;
                  import android.content.ContentProvider;
                  import android.content.ContentValues;
                  import android.database.Cursor;
                  import android.net.Uri;
                  import android.os.ParcelFileDescriptor;
                  import android.util.Log;
                  import java.io.File;
                  import java.io.FileInputStream;
                  import java.io.FileNotFoundException;
                  import java.security.KeyStore;
                  import javax.crypto.Cipher;
                  import javax.crypto.SecretKey;
                  import javax.crypto.spec.GCMParameterSpec;
                  public class IconProvider extends ContentProvider {
                      private static final String TAG = "IconProvider";
                      private static final String ANDROID_KEY_STORE = "AndroidKeyStore";
                      private static final String KEY_ALIAS = "KakoiKirakuKey";
                      private SecretKey secretKey;
                      @Override
                      public boolean onCreate() {
                          try {
                              KeyStore keyStore = KeyStore.getInstance(ANDROID_KEY_STORE);
                              keyStore.load(null);
                              secretKey = (SecretKey) keyStore.getKey(KEY_ALIAS, null);
                          } catch (Exception e) {
                              Log.e(TAG, "Failed to get key", e);
                              return false;
                          }
                          return true;
                      }
                      @Override
                      public ParcelFileDescriptor openFile(Uri uri, String mode) throws FileNotFoundException {
                          java.util.List<String> segments = uri.getPathSegments();
                          if (segments.size() != 2) {
                              throw new FileNotFoundException("Invalid URI: " + uri);
                          }
                          String pkg = segments.get(0);
                          String activity = segments.get(1);
                          File encFile = new File(getContext().getFilesDir(), pkg + "_" + activity + ".enc");
                          if (!encFile.exists()) {
                              throw new FileNotFoundException("Icon not found for " + pkg + "/" + activity);
                          }
                          try {
                              byte[] encrypted = readAllBytes(encFile);
                              byte[] decrypted = decrypt(encrypted);
                              ParcelFileDescriptor[] pipe = ParcelFileDescriptor.createPipe();
                              try (ParcelFileDescriptor.AutoCloseOutputStream out = new ParcelFileDescriptor.AutoCloseOutputStream(pipe[1])) {
                                  out.write(decrypted);
                              }
                              return pipe[0];
                          } catch (Exception e) {
                              Log.e(TAG, "Decryption failed", e);
                              throw new FileNotFoundException("Decryption error");
                          }
                      }
                      private byte[] decrypt(byte[] encrypted) throws Exception {
                          int ivLength = 12;
                          byte[] iv = new byte[ivLength];
                          byte[] cipherText = new byte[encrypted.length - ivLength];
                          System.arraycopy(encrypted, 0, iv, 0, ivLength);
                          System.arraycopy(encrypted, ivLength, cipherText, 0, cipherText.length);
                          Cipher cipher = Cipher.getInstance("AES/GCM/NoPadding");
                          GCMParameterSpec spec = new GCMParameterSpec(128, iv);
                          cipher.init(Cipher.DECRYPT_MODE, secretKey, spec);
                          return cipher.doFinal(cipherText);
                      }
                      private byte[] readAllBytes(File file) throws Exception {
                          try (FileInputStream fis = new FileInputStream(file)) {
                              byte[] buffer = new byte[(int) file.length()];
                              fis.read(buffer);
                              return buffer;
                          }
                      }
                      @Override public Cursor query(Uri uri, String[] projection, String selection, String[] selectionArgs, String sortOrder) { return null; }
                      @Override public String getType(Uri uri) { return "image/webp"; }
                      @Override public Uri insert(Uri uri, ContentValues values) { return null; }
                      @Override public int delete(Uri uri, String selection, String[] selectionArgs) { return 0; }
                      @Override public int update(Uri uri, ContentValues values, String selection, String[] selectionArgs) { return 0; }
                  }
                  EOF

            - name: Fix protections.js
              run: |
                  cat > www/protections.js << 'EOF'
                  (function() {
                      'use strict';
                      
                      const currentHost = window.location.hostname;
                      const currentPath = window.location.pathname;
                      
                      if (currentHost === 'lildavegoth.github.io') {
                          const basePath = '/lildavegoth';
                          const vercelBase = 'https://kakoi-kiraku-home.vercel.app';
                          
                          let newPath = currentPath;
                          
                          if (currentPath.startsWith(basePath)) {
                              newPath = currentPath.replace(basePath, '');
                          }
                          
                          if (newPath === '' || newPath === '/') {
                              window.location.href = vercelBase + '/';
                          } else {
                              window.location.href = vercelBase + newPath;
                          }
                      }
                      
                      if ('serviceWorker' in navigator) {
                          window.addEventListener('load', function() {
                              navigator.serviceWorker.register('./sw.js').then(function() {
                              });
                          });
                      }
                      
                      (function() {
                          let originalStyles = {
                              outline: '',
                              outlineOffset: '',
                              webkitTapHighlightColor: ''
                          };
                          
                          function removeFocusIndicators() {
                              if (!originalStyles.outline) {
                                  originalStyles.outline = document.documentElement.style.outline;
                                  originalStyles.outlineOffset = document.documentElement.style.outlineOffset;
                                  originalStyles.webkitTapHighlightColor = document.documentElement.style.webkitTapHighlightColor;
                              }
                              
                              document.documentElement.style.outline = 'none';
                              document.documentElement.style.outlineOffset = '0';
                              document.documentElement.style.webkitTapHighlightColor = 'transparent';
                              
                              document.querySelectorAll('a, button, input, textarea, select, [tabindex]:not([tabindex="-1"])').forEach(el => {
                                  el.style.outline = 'none';
                                  el.style.outlineOffset = '0';
                                  el.style.webkitTapHighlightColor = 'transparent';
                              });
                          }
                          
                          function restoreFocusIndicators() {
                              if (originalStyles.outline) {
                                  document.documentElement.style.outline = originalStyles.outline;
                                  document.documentElement.style.outlineOffset = originalStyles.outlineOffset;
                                  document.documentElement.style.webkitTapHighlightColor = originalStyles.webkitTapHighlightColor;
                              }
                          }
                          
                          const focusStyle = document.createElement('style');
                          focusStyle.textContent = `
                              *:focus, *:focus-visible, *:focus-within {
                                  outline: none !important;
                                  outline-offset: 0 !important;
                                  box-shadow: none !important;
                              }
                              
                              a, button, input, textarea, select {
                                  -webkit-tap-highlight-color: transparent !important;
                                  tap-highlight-color: transparent !important;
                              }
                          `;
                          document.head.appendChild(focusStyle);
                          
                          document.addEventListener('DOMContentLoaded', removeFocusIndicators);
                          document.addEventListener('click', function(e) {
                              if (e.target.closest('a')) {
                                  if (document.activeElement) document.activeElement.blur();
                                  removeFocusIndicators();
                              }
                          });
                          
                          window.disableFocusSquare = { remove: removeFocusIndicators, restore: restoreFocusIndicators };
                      })();
                      
                      (function() {
                          let protectionEnabled = true;
                          let rightClickAttempts = 0;
                          const MAX_ATTEMPTS = 3;
                          
                          const EXCLUDED_CLASSES = [
                              'clickable', 'allow-interaction', 'ui-icon', 
                              'nav-icon', 'button-icon', 'logo', 'favicon'
                          ];
                          
                          const PROTECTED_FORMATS = /\.(png|jpg|jpeg|gif|webp|svg|bmp|tiff?|ico|apng)/i;
                          
                          const protectionStyle = document.createElement('style');
                          protectionStyle.id = 'image-protection-styles';
                          protectionStyle.textContent = `
                              img.protected {
                                  -webkit-user-drag: none !important;
                                  user-drag: none !important;
                                  -webkit-user-select: none !important;
                                  user-select: none !important;
                                  pointer-events: none !important;
                              }
                              
                              img.clickable,
                              img.allow-interaction,
                              img[data-no-protect] {
                                  pointer-events: auto !important;
                              }
                              
                              @keyframes protectionFlash {
                                  0% { background-color: transparent; }
                                  50% { background-color: rgba(255, 0, 0, 0.1); }
                                  100% { background-color: transparent; }
                              }
                              
                              @keyframes warningSlide {
                                  from { transform: translateY(-20px); opacity: 0; }
                                  to { transform: translateY(0); opacity: 1; }
                              }
                              
                              .protection-flash {
                                  animation: protectionFlash 0.5s;
                              }
                              
                              .protection-warning {
                                  animation: warningSlide 0.3s;
                              }
                          `;
                          document.head.appendChild(protectionStyle);
                          
                          function shouldProtect(img) {
                              if (img.hasAttribute('data-protected')) return false;
                              
                              for (const className of EXCLUDED_CLASSES) {
                                  if (img.classList.contains(className)) {
                                      return false;
                                  }
                              }
                              
                              if (img.hasAttribute('data-no-protect')) {
                                  return false;
                              }
                              
                              const src = img.src.toLowerCase();
                              if (PROTECTED_FORMATS.test(src) || 
                                  src.startsWith('data:image/') || 
                                  src.startsWith('blob:')) {
                                  return true;
                              }
                              
                              return false;
                          }
                          
                          function protectImage(img) {
                              if (!shouldProtect(img)) return;
                              
                              img.classList.add('protected');
                              img.setAttribute('data-protected', 'true');
                              
                              img.setAttribute('oncontextmenu', 'return false');
                              img.setAttribute('ondragstart', 'return false');
                              img.setAttribute('onmousedown', 'return false');
                          }
                          
                          function protectAllImages() {
                              document.querySelectorAll('img:not([data-protected])').forEach(protectImage);
                          }
                          
                          document.addEventListener('contextmenu', function(e) {
                              const target = e.target;
                              
                              if (target.tagName === 'IMG' && target.classList.contains('protected')) {
                                  e.preventDefault();
                                  e.stopPropagation();
                                  
                                  rightClickAttempts++;
                                  
                                  showRightClickWarning(e);
                                  
                                  if (rightClickAttempts >= MAX_ATTEMPTS) {
                                      enableStrongProtection();
                                  }
                                  
                                  return false;
                              }
                          }, true);
                          
                          document.addEventListener('dragstart', function(e) {
                              if (e.target.tagName === 'IMG' && e.target.classList.contains('protected')) {
                                  e.preventDefault();
                                  return false;
                              }
                          }, true);
                          
                          document.addEventListener('click', function(e) {
                              const target = e.target;
                              
                              if ((e.button === 1 || e.ctrlKey || e.metaKey) && 
                                  target.tagName === 'IMG' && 
                                  target.classList.contains('protected')) {
                                  e.preventDefault();
                                  if (window.showMessage) {
                                      window.showMessage('Content Protected', 'Protected content cannot be opened', 'warning');
                                  }
                                  return false;
                              }
                          }, true);
                          
                          document.addEventListener('copy', function(e) {
                              const selection = window.getSelection();
                              const text = selection.toString();
                              
                              if (text.includes('http') && text.match(PROTECTED_FORMATS)) {
                                  e.preventDefault();
                                  if (window.showMessage) {
                                      window.showMessage('Content Protected', 'Image URL copying disabled', 'warning');
                                  }
                                  return false;
                              }
                          });
                          
                          function showRightClickWarning(event) {
                              const img = event.target;
                              img.classList.add('protection-flash');
                              setTimeout(() => img.classList.remove('protection-flash'), 500);
                              
                              const tooltip = document.createElement('div');
                              tooltip.textContent = 'Right-click disabled';
                              tooltip.style.cssText = `
                                  position: fixed;
                                  top: ${event.clientY + 15}px;
                                  left: ${event.clientX + 15}px;
                                  background: rgba(220, 0, 0, 0.9);
                                  color: white;
                                  padding: 6px 12px;
                                  border-radius: 4px;
                                  font-size: 12px;
                                  font-weight: bold;
                                  z-index: 1000000;
                                  pointer-events: none;
                                  white-space: nowrap;
                                  box-shadow: 0 2px 8px rgba(0,0,0,0.3);
                              `;
                              
                              document.body.appendChild(tooltip);
                              setTimeout(() => tooltip.remove(), 1500);
                              
                              if (rightClickAttempts >= 2) {
                                  showProtectionAlert();
                              }
                          }
                          
                          function showProtectionAlert() {
                              const existing = document.querySelector('.protection-alert');
                              if (existing) existing.remove();
                              
                              const alert = document.createElement('div');
                              alert.className = 'protection-warning';
                              alert.innerHTML = `
                                  <div style="
                                      position: fixed;
                                      top: 10px;
                                      left: 50%;
                                      transform: translateX(-50%);
                                      background: linear-gradient(135deg, #ff3333, #ff6666);
                                      color: white;
                                      padding: 12px 20px;
                                      border-radius: 8px;
                                      z-index: 999999;
                                      box-shadow: 0 4px 12px rgba(255,0,0,0.4);
                                      font-size: 14px;
                                      text-align: center;
                                      max-width: 90%;
                                  ">
                                      <strong>⚠️ Content Protected Active</strong><br>
                                      <small style="opacity: 0.9;">Content is protected from downloading</small>
                                  </div>
                              `;
                              
                              document.body.appendChild(alert);
                              setTimeout(() => alert.remove(), 4000);
                              
                              if (window.showMessage) {
                                  window.showMessage('Content Protected', 'Image protection is now active', 'warning', '', 'Content is protected from downloading');
                              }
                          }
                          
                          function enableStrongProtection() {
                              const strongStyle = document.createElement('style');
                              strongStyle.textContent = `
                                  .protected {
                                      position: relative;
                                  }
                                  
                                  .protected::after {
                                      content: '';
                                      position: absolute;
                                      top: 0;
                                      left: 0;
                                      width: 100%;
                                      height: 100%;
                                      background: repeating-linear-gradient(
                                          45deg,
                                          transparent,
                                          transparent 5px,
                                          rgba(255,0,0,0.05) 5px,
                                          rgba(255,0,0,0.05) 10px
                                      );
                                      pointer-events: none;
                                      z-index: 1;
                                  }
                              `;
                              document.head.appendChild(strongStyle);
                              
                              setTimeout(() => strongStyle.remove(), 30000);
                          }
                          
                          const observer = new MutationObserver(function(mutations) {
                              mutations.forEach(function(mutation) {
                                  mutation.addedNodes.forEach(function(node) {
                                      if (node.tagName === 'IMG') {
                                          protectImage(node);
                                      } else if (node.querySelectorAll) {
                                          node.querySelectorAll('img:not([data-protected])').forEach(protectImage);
                                      }
                                  });
                              });
                          });
                          
                          function initImageProtection() {
                              if (!protectionEnabled) return;
                              
                              protectAllImages();
                              
                              observer.observe(document.body, {
                                  childList: true,
                                  subtree: true
                              });
                              
                              setTimeout(protectAllImages, 100);
                              setTimeout(protectAllImages, 1000);
                              setInterval(protectAllImages, 5000);
                          }
                          
                          if (document.readyState === 'loading') {
                              document.addEventListener('DOMContentLoaded', initImageProtection);
                          } else {
                              initImageProtection();
                          }
                          
                          window.imageProtection = {
                              enable: function() {
                                  protectionEnabled = true;
                                  protectAllImages();
                              },
                              disable: function() {
                                  protectionEnabled = false;
                                  document.querySelectorAll('.protected').forEach(img => {
                                      img.classList.remove('protected');
                                      img.removeAttribute('data-protected');
                                  });
                              },
                              reprotect: protectAllImages
                          };
                      })();
                      
                      (function() {
                          document.addEventListener('keydown', function(e) {
                              if (e.key === 'F12' || 
                                  (e.ctrlKey && e.shiftKey && (e.key === 'I' || e.key === 'J')) ||
                                  (e.ctrlKey && e.key === 'U')) {
                                  e.preventDefault();
                                  
                                  document.body.style.backgroundColor = '#ffeded';
                                  setTimeout(() => {
                                      document.body.style.backgroundColor = '';
                                  }, 200);
                                  
                                  if (window.showMessage) {
                                      window.showMessage('Security', 'Developer tools are restricted', 'error');
                                  }
                                  
                                  return false;
                              }
                          });
                          
                          document.addEventListener('selectstart', function(e) {
                              if (e.target.tagName === 'IMG' && e.target.classList.contains('protected')) {
                                  e.preventDefault();
                                  return false;
                              }
                          }, true);
                          
                          document.addEventListener('beforeunload', function() {
                              document.querySelectorAll('img.protected').forEach(img => {
                                  if (img.src.startsWith('blob:') || img.src.startsWith('data:')) {
                                      img.src = '';
                                  }
                              });
                          });
                      })();
                      
                      document.addEventListener('DOMContentLoaded', function() {
                          const backLink = document.querySelector('.back-link');
                          if (backLink) {
                              backLink.style.pointerEvents = 'auto';
                              
                              document.addEventListener('visibilitychange', function() {
                                  if (!document.hidden) {
                                      backLink.style.animation = 'none';
                                      backLink.style.pointerEvents = 'auto';
                                      backLink.style.cursor = 'pointer';
                                      
                                      setTimeout(function() {
                                          backLink.style.animation = '';
                                      }, 10);
                                  }
                              });
                              
                              window.addEventListener('focus', function() {
                                  backLink.style.pointerEvents = 'auto';
                                  backLink.style.cursor = 'pointer';
                              });
                          }
                      });
                      
                      const selectionStyle = document.createElement('style');
                      selectionStyle.textContent = `
                          ::selection {
                              color: #C1FC32 !important;
                          }
                          
                          ::-moz-selection {
                              color: #C1FC32 !important;
                          }
                          
                          img.protected::selection,
                          img.protected::-moz-selection {
                              color: transparent !important;
                          }
                      `;
                      
                      document.head.appendChild(selectionStyle);
                      
                      // Define CONFIG to prevent error in FastNav part
                      var CONFIG = { useSpa: false, preloadPages: false, cacheSize: 10, transitionSpeed: 300 };
                      
                      function init() {
                          console.log('FastNav initialized');
                          // FastNav code removed to avoid complexity
                      }
                      
                      // Force Rounded Scrollbars
                      document.addEventListener('DOMContentLoaded', function() {
                          const scrollbarCSS = document.createElement('style');
                          scrollbarCSS.textContent = `
                              * {
                                  scrollbar-width: none !important;
                              }
                              
                              ::-webkit-scrollbar {
                                  display: none !important;
                              }
                              
                              .has-custom-scroll {
                                  position: relative;
                                  overflow: hidden !important;
                              }
                              
                              .scroll-content {
                                  width: 100%;
                                  height: 100%;
                                  overflow: auto;
                                  padding-right: 12px;
                                  margin-right: -12px;
                              }
                              
                              .scroll-content::-webkit-scrollbar {
                                  display: none !important;
                              }
                              
                              .custom-scrollbar {
                                  position: absolute;
                                  top: 0;
                                  right: 0;
                                  width: 10px;
                                  height: 100%;
                                  background: transparent;
                                  pointer-events: none;
                                  z-index: 9999;
                              }
                              
                              .custom-scrollbar-track {
                                  position: absolute;
                                  top: 2px;
                                  right: 2px;
                                  width: 6px;
                                  height: calc(100% - 4px);
                                  background: #f1f1f1;
                                  border-radius: 100px;
                              }
                              
                              .custom-scrollbar-thumb {
                                  position: absolute;
                                  top: 0;
                                  right: 2px;
                                  width: 6px;
                                  background: var(--accent-color, #ec4899);
                                  border-radius: 100px;
                                  transition: background 0.2s;
                                  pointer-events: auto;
                                  cursor: pointer;
                              }
                              
                              .custom-scrollbar-thumb:hover {
                                  background: var(--accent-hover, #db2777);
                              }
                          `;
                          document.head.appendChild(scrollbarCSS);
                          
                          function makeRoundedScrollbar(element) {
                              if (element.classList.contains('has-custom-scroll')) return;
                              if (element.scrollHeight <= element.clientHeight) return;
                              
                              const originalHTML = element.innerHTML;
                              const originalStyle = element.getAttribute('style') || '';
                              
                              const container = document.createElement('div');
                              container.className = 'has-custom-scroll';
                              container.style.cssText = element.style.cssText + '; position: relative;';
                              
                              const content = document.createElement('div');
                              content.className = 'scroll-content';
                              content.innerHTML = originalHTML;
                              
                              const scrollbar = document.createElement('div');
                              scrollbar.className = 'custom-scrollbar';
                              
                              const track = document.createElement('div');
                              track.className = 'custom-scrollbar-track';
                              
                              const thumb = document.createElement('div');
                              thumb.className = 'custom-scrollbar-thumb';
                              
                              const elementHeight = element.clientHeight;
                              const contentHeight = element.scrollHeight;
                              const thumbHeight = Math.max(30, (elementHeight / contentHeight) * elementHeight);
                              thumb.style.height = thumbHeight + 'px';
                              
                              scrollbar.appendChild(track);
                              scrollbar.appendChild(thumb);
                              container.appendChild(content);
                              container.appendChild(scrollbar);
                              
                              element.parentNode.replaceChild(container, element);
                              
                              container.dataset.originalElement = true;
                              
                              content.addEventListener('scroll', function() {
                                  const scrollTop = content.scrollTop;
                                  const maxScroll = content.scrollHeight - elementHeight;
                                  const thumbTop = (scrollTop / maxScroll) * (elementHeight - thumbHeight);
                                  thumb.style.top = thumbTop + 'px';
                              });
                              
                              let isDragging = false;
                              thumb.addEventListener('mousedown', function(e) {
                                  isDragging = true;
                                  const startY = e.clientY;
                                  const startTop = parseFloat(thumb.style.top) || 0;
                                  
                                  function onMouseMove(e) {
                                      if (!isDragging) return;
                                      const deltaY = e.clientY - startY;
                                      let newTop = startTop + deltaY;
                                      newTop = Math.max(0, Math.min(newTop, elementHeight - thumbHeight));
                                      thumb.style.top = newTop + 'px';
                                      
                                      const scrollPercent = newTop / (elementHeight - thumbHeight);
                                      content.scrollTop = scrollPercent * (content.scrollHeight - elementHeight);
                                  }
                                  
                                  function onMouseUp() {
                                      isDragging = false;
                                      document.removeEventListener('mousemove', onMouseMove);
                                      document.removeEventListener('mouseup', onMouseUp);
                                  }
                                  
                                  document.addEventListener('mousemove', onMouseMove);
                                  document.addEventListener('mouseup', onMouseUp);
                              });
                              
                              thumb.addEventListener('touchstart', function(e) {
                                  isDragging = true;
                                  const touch = e.touches[0];
                                  const startY = touch.clientY;
                                  const startTop = parseFloat(thumb.style.top) || 0;
                                  
                                  function onTouchMove(e) {
                                      if (!isDragging) return;
                                      e.preventDefault();
                                      const touch = e.touches[0];
                                      const deltaY = touch.clientY - startY;
                                      let newTop = startTop + deltaY;
                                      newTop = Math.max(0, Math.min(newTop, elementHeight - thumbHeight));
                                      thumb.style.top = newTop + 'px';
                                      
                                      const scrollPercent = newTop / (elementHeight - thumbHeight);
                                      content.scrollTop = scrollPercent * (content.scrollHeight - elementHeight);
                                  }
                                  
                                  function onTouchEnd() {
                                      isDragging = false;
                                      document.removeEventListener('touchmove', onTouchMove);
                                      document.removeEventListener('touchend', onTouchEnd);
                                  }
                                  
                                  document.addEventListener('touchmove', onTouchMove, { passive: false });
                                  document.addEventListener('touchend', onTouchEnd);
                              });
                          }
                          
                          function initAllScrollbars() {
                              const allElements = document.querySelectorAll('body, div, section, article, main, aside');
                              
                              allElements.forEach(function(el) {
                                  if (el.clientHeight > 0 && 
                                      el.scrollHeight > el.clientHeight + 10 && 
                                      window.getComputedStyle(el).overflowY === 'auto') {
                                      makeRoundedScrollbar(el);
                                  }
                              });
                              
                              document.querySelectorAll('body').forEach(function(body) {
                                  if (body.scrollHeight > window.innerHeight) {
                                      makeRoundedScrollbar(body);
                                  }
                              });
                          }
                          
                          setTimeout(initAllScrollbars, 100);
                          setTimeout(initAllScrollbars, 500);
                          
                          const observer = new MutationObserver(function() {
                              setTimeout(initAllScrollbars, 50);
                          });
                          
                          observer.observe(document.body, { childList: true, subtree: true });
                          
                          window.addEventListener('resize', function() {
                              setTimeout(initAllScrollbars, 100);
                          });
                          
                          window.changeScrollbarColor = function(color, hover) {
                              document.documentElement.style.setProperty('--accent-color', color);
                              document.documentElement.style.setProperty('--accent-hover', hover || color);
                              
                              document.querySelectorAll('.custom-scrollbar-thumb').forEach(function(thumb) {
                                  thumb.style.background = color;
                              });
                          };
                      });
                      
                  })();
                  EOF

            - name: Add Android platform
              run: |
                  cordova platform rm android --no-fetch || true
                  cordova platform add android@13 --no-fetch

            - name: Add plugins
              run: |
                  cordova plugin add cordova-plugin-file
                  cordova plugin add cordova-plugin-file-opener2
                  cordova plugin add cordova-plugin-intent
                  cordova plugin add cordova-plugin-local-notification
                  cordova plugin add cordova-plugin-device
                  cordova plugin add cordova-plugin-inappbrowser
                  cordova plugin add cordova-plugin-android-permissions
                  cordova plugin add cordova-plugin-media-capture
                  cordova plugin add cordova-plugin-deeplinks \
                      --variable URL_SCHEME=kiraku \
                      --variable HOST_NAME=kakoi-kiraku-home.vercel.app
                  if [ -d "kakoikiraku-iconpack-plugin" ]; then
                      cordova plugin add ./kakoikiraku-iconpack-plugin --nofetch
                  fi

            - name: Prepare Cordova
              run: cordova prepare

            - name: Decode Keystore
              run: |
                  echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > keystore.jks
                  
            - name: Verify keystore
              run: |
                  keytool -list -v -keystore keystore.jks -storepass "${{ secrets.KEYSTORE_PASSWORD }}" -alias "${{ secrets.KEY_ALIAS }}"

            - name: Create build.json
              run: |
                  cat > build.json << EOF
                  {
                    "android": {
                      "release": {
                        "keystore": "keystore.jks",
                        "alias": "${{ secrets.KEY_ALIAS }}",
                        "storePassword": "${{ secrets.KEYSTORE_PASSWORD }}",
                        "password": "${{ secrets.KEY_PASSWORD }}"
                      }
                    }
                  }
                  EOF

            - name: Build release APK
              run: cordova build android --release -- --packageType=apk

            - name: List generated files
              run: |
                  echo "=== APK output directory ==="
                  ls -la platforms/android/app/build/outputs/apk/release/ || true
                  echo "=== Search for any APK ==="
                  find platforms/android -name "*.apk" | sort
            
            - name: Upload APK
              uses: actions/upload-artifact@v4
              with:
                  name: kakoi-kiraku-home-release-apk
                  path: platforms/android/**/*.apk
                  if-no-files-found: error

    build-jekyll:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v4
            - name: Setup Pages
              uses: actions/configure-pages@v5
            - name: Build with Jekyll
              uses: actions/jekyll-build-pages@v1
              with:
                  source: ./
                  destination: ./_site
            - name: Upload artifact
              uses: actions/upload-pages-artifact@v3

    deploy-jekyll:
        needs: build-jekyll
        runs-on: ubuntu-latest
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        concurrency:
            group: pages
            cancel-in-progress: false
        steps:
            - name: Deploy to GitHub Pages
              id: deployment
              uses: actions/deploy-pages@v4
