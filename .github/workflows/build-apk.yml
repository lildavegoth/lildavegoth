name: Build APK
on:
  push:
    branches: [ "homepage" ]
jobs:
  build-android-apk:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        path: 'source-files'
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
    - name: Set up Android SDK
      uses: android-actions/setup-android@v3
    - name: Setup Node.js and Cordova
      run: |
        npm install -g cordova
    - name: Prepare Cordova Project
      run: |
        cordova create cordova-build com.lildavegoth.homepage "Kiraku Home"
        cd cordova-build
        cordova platform add android
        cordova plugin add cordova-plugin-file
        cordova plugin add cordova-plugin-file-opener2
        cordova plugin add cordova-plugin-android-permissions
        rm -rf www
        cp -r ../source-files www
        if [ -f "www/icon.png" ]; then
            cp www/icon.png icon.png
        fi
        cat > config.xml << 'EOF'
        <?xml version='1.0' encoding='utf-8'?>
        <widget id="com.lildavegoth.homepage" version="1.0.0" xmlns="http://www.w3.org/ns/widgets">
        <name>Kiraku Home</name>
        <description>Collections of offline web Apps, Tools & Games</description>
        <icon src="icon.png" />
        <content src="index.html" />
        </widget>
        EOF
    - name: Build Android APK
      run: |
        cd cordova-build
        cordova build android --no-telemetry
    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: kiraku-homepage-apk
        path: |
          cordova-build/platforms/android/app/build/outputs/apk/debug/*.apk
          cordova-build/platforms/android/app/build/outputs/apk/release/*.apk
        retention-days: 7
