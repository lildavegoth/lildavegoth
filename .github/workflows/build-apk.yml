
name: Build Android APK

on:
  push:
    branches: [ "homepage" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'

    - name: Install dependencies
      run: |
        npm install
        npm install @capacitor/core @capacitor/cli @capacitor/android

    - name: Initialize Capacitor
      run: |
        npx cap init --app-name "Kakoi Kiraku Home" --app-id "com.lildavegoth.kakoikiraku"
        npx cap add android

    - name: Configure Capacitor for root directory
      run: |
        # Update capacitor.config.json to use root directory
        echo '{
          "appId": "com.lildavegoth.kakoikiraku",
          "appName": "Kakoi Kiraku Home",
          "webDir": "./",
          "server": {
            "androidScheme": "https"
          }
        }' > capacitor.config.json

    - name: Sync Android project
      run: |
        npx cap sync android

    - name: Setup Java and Android SDK
      uses: android-actions/setup-android@v3

    - name: Build Debug APK
      run: |
        cd android
        ./gradlew assembleDebug

    - name: Upload APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: kakoi-kiraku-home-apk
        path: android/app/build/outputs/apk/debug/app-debug.apk
