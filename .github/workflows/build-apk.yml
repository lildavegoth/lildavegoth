name: Build APK
on:
  push:
    branches: [ "homepage" ]
jobs:
  build-android-apk:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        path: 'source-files'
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
    - name: Set up Android SDK
      uses: android-actions/setup-android@v3
    - name: Setup Node.js and Cordova
      run: |
        npm install -g cordova
    - name: Prepare Cordova Project
      run: |
        cordova create cordova-build com.lildavegoth.homepage "Kiraku Home"
        cd cordova-build
        cordova platform add android
        cordova plugin add cordova-plugin-file
        cordova plugin add https://github.com/cyph/cordova-plugin-filechooser.git
        cordova plugin add cordova-plugin-file-path
        cordova plugin add cordova-plugin-android-permissions
        sudo apt-get update
        sudo apt-get install -y imagemagick
        rm -rf www
        cp -r ../source-files www
        mkdir -p res/icon/android
        if [ -f "www/icon.png" ]; then
            convert www/icon.png -resize 36x36 res/icon/android/icon-36-ldpi.png
            convert www/icon.png -resize 48x48 res/icon/android/icon-48-mdpi.png
            convert www/icon.png -resize 72x72 res/icon/android/icon-72-hdpi.png
            convert www/icon.png -resize 96x96 res/icon/android/icon-96-xhdpi.png
            convert www/icon.png -resize 144x144 res/icon/android/icon-144-xxhdpi.png
            convert www/icon.png -resize 192x192 res/icon/android/icon-192-xxxhdpi.png
        else
            convert -size 96x96 xc:#007AFF res/icon/android/icon-96-xhdpi.png
        fi
        echo '<?xml version="1.0" encoding="utf-8"?>
        <widget id="com.lildavegoth.homepage" version="1.0.0">
            <name>Kiraku Home</name>
            <description>Collection of offline web tools</description>
            <platform name="android">
                <icon src="res/icon/android/icon-36-ldpi.png" density="ldpi" />
                <icon src="res/icon/android/icon-48-mdpi.png" density="mdpi" />
                <icon src="res/icon/android/icon-72-hdpi.png" density="hdpi" />
                <icon src="res/icon/android/icon-96-xhdpi.png" density="xhdpi" />
                <icon src="res/icon/android/icon-144-xxhdpi.png" density="xxhdpi" />
                <icon src="res/icon/android/icon-192-xxxhdpi.png" density="xxxhdpi" />
                <config-file parent="/*" target="AndroidManifest.xml">
                    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" />
                    <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" />
                    <uses-permission android:name="android.permission.MANAGE_EXTERNAL_STORAGE" />
                    <application android:requestLegacyExternalStorage="true" />
                </config-file>
            </platform>
            <preference name="android-hardwareAcceleration" value="true" />
            <preference name="AndroidPersistentFileLocation" value="Compatibility" />
            <allow-navigation href="*" />
            <content src="index.html" />
        </widget>' > config.xml
    - name: Build Android APK
      run: |
        cd cordova-build
        cordova build android --no-telemetry
    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: kiraku-homepage
        path: |
          cordova-build/platforms/android/app/build/outputs/apk/debug/*.apk
          cordova-build/platforms/android/app/build/outputs/apk/release/*.apk
        retention-days: 7
