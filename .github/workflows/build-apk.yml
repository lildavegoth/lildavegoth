name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: "18"

    - name: Install dependencies
      run: |
        npm init -y
        npm install @capacitor/core@5.7.0 @capacitor/cli@5.7.0 @capacitor/android@5.7.0
        echo '{"appId":"com.lildavegoth.kakoikiraku","appName":"Kakoi Kiraku Home","webDir":"./","server":{"androidScheme":"https"}}' > capacitor.config.json

    - name: Create minimal Android project
      run: |
        # Download a pre-built Android template
        curl -L https://github.com/ionic-team/capacitor-android-template/archive/refs/heads/main.zip -o android-template.zip
        unzip -q android-template.zip -d android-temp
        mv android-temp/capacitor-android-template-main/android .
        rm -rf android-temp android-template.zip
        
        # Update package name and permissions
        sed -i 's/com.getcapacitor.myapp/com.lildavegoth.kakoikiraku/g' android/app/src/main/AndroidManifest.xml
        sed -i 's/My App/Kakoi Kiraku Home/g' android/app/src/main/AndroidManifest.xml
        
        # Add ALL permissions
        PERMISSIONS='<uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" />\n    <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" />\n    <uses-permission android:name="android.permission.MANAGE_EXTERNAL_STORAGE" />\n    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />'
        sed -i "s|<uses-permission|${PERMISSIONS}\n    <uses-permission|" android/app/src/main/AndroidManifest.xml

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Sync Capacitor
      run: |
        npx cap init "Kakoi Kiraku Home" "com.lildavegoth.kakoikiraku" --web-dir="./" --silent
        npx cap add android --silent
        npx cap sync android

    - name: Build APK
      run: |
        cd android
        ./gradlew assembleDebug --no-daemon --stacktrace

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: kakoikiraku-apk
        path: android/app/build/outputs/apk/debug/*.apk
