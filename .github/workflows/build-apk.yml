name: Build Standalone WebView APK

on:
  workflow_dispatch:
  push:
    branches: [homepage]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js and Java
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        distribution: 'temurin'
    
    - name: Setup JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Create React Native project
      run: |
        echo "=== CREATING REACT NATIVE PROJECT ==="
        npx @react-native-community/cli@latest init KirakuApp --skip-install
        
        cd KirakuApp
        
        npm install
        npm install react-native-webview@latest
        
        echo 'import React from "react";
        import { WebView } from "react-native-webview";

        const App = () => {
          return (
            <WebView
              source={{ uri: "https://lildavegoth.github.io/lildavegoth/" }}
              allowFileAccess={true}
              allowUniversalAccessFromFileURLs={true}
              allowFileAccessFromFileURLs={true}
              javaScriptEnabled={true}
              domStorageEnabled={true}
              style={{ flex: 1 }}
            />
          );
        };

        export default App;' > App.js

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Add Android permissions
      run: |
        echo "=== ADDING ANDROID PERMISSIONS ==="
        cd KirakuApp/android/app/src/main
        
        cp AndroidManifest.xml AndroidManifest.xml.backup
        
        sed -i '/<manifest /a\
        <uses-permission android:name="android.permission.INTERNET" />\
        <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" />\
        <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" />\
        <uses-permission android:name="android.permission.MANAGE_EXTERNAL_STORAGE" />\
        <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />' AndroidManifest.xml

    - name: Create JavaScript bundle
      run: |
        echo "=== CREATING JS BUNDLE ==="
        cd KirakuApp
        
        # Create assets directory
        mkdir -p android/app/src/main/assets
        
        # Bundle JavaScript for standalone app
        npx react-native bundle --platform android --dev false \
          --entry-file index.js \
          --bundle-output android/app/src/main/assets/index.android.bundle \
          --assets-dest android/app/src/main/res/

    - name: Build Release APK
      run: |
        echo "=== BUILDING RELEASE APK ==="
        cd KirakuApp/android
        
        chmod +x gradlew
        ./gradlew assembleRelease --no-daemon --stacktrace

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: kiraku-standalone-apk
        path: KirakuApp/android/app/build/outputs/apk/release/*.apk
