name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ homepage ]

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - uses: cemcoe/web-to-apk-action@v1
        with:
          app_name: "Kakoi Kiraku Home"
          app_id: "com.kiraku.home"
          build_command: "npm install && npm run build"
          web_dir: "."
          version: "1.0.0"
          version_code: 1
