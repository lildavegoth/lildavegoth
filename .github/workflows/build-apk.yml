name: Build Kakoi Kiraku Home APK (With Offline Website)

on:
  workflow_dispatch:
  push:
    branches: [homepage]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    steps:
    - name: Checkout YOUR website code
      uses: actions/checkout@v4
      with:
        path: website-source

    - name: Setup Node.js 20 and Java 17
      uses: actions/setup-node@v4
      with:
        node-version: '20'
    
    - name: Setup JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Create project with custom names (WORKING METHOD)
      run: |
        echo "=== CREATING PROJECT ==="
        
        # Method 1: Try multiple approaches until one works
        echo "Attempt 1: Using react-native CLI..."
        npx react-native@0.72.0 init KakoikirakuHome --package-name "com.lildavegoth.kakoikirakuhome" --title "Kakoi Kiraku Home" --skip-install 2>/dev/null || {
          echo "Attempt 1 failed, trying Attempt 2..."
          
          # Method 2: Download pre-made template
          git clone https://github.com/react-native-webview/react-native-webview-template.git KakoikirakuHome 2>/dev/null || {
            echo "Attempt 2 failed, trying Attempt 3..."
            
            # Method 3: Manual creation with npx react-native init (no version)
            npx react-native init KakoikirakuHome --package-name "com.lildavegoth.kakoikirakuhome" --title "Kakoi Kiraku Home" --skip-install 2>/dev/null || {
              echo "All methods failed, creating minimal structure..."
              
              # Last resort: Create minimal structure
              mkdir -p KakoikirakuHome
              cd KakoikirakuHome
              npm init -y
              exit 1
            }
          }
        }
        
        # If we get here, project was created
        cd KakoikirakuHome
        echo "✓ Project created"
        npm install
        npm install react-native-webview@latest
        
        echo "=== PROJECT STRUCTURE ==="
        ls -la
        if [ -d "android" ]; then
          echo "Android folder exists"
          find android -name "*.gradle" -o -name "AndroidManifest.xml" | head -5
        else
          echo "WARNING: No android folder!"
        fi

    - name: Bundle your website into app assets
      run: |
        echo "=== BUNDLING YOUR WEBSITE INTO APK ==="
        cd KakoikirakuHome
        
        mkdir -p android/app/src/main/assets/website
        cd ../website-source
        
        cp -r *.html *.css *.js *.cssjs *.json pages/ images/ ../KakoikirakuHome/android/app/src/main/assets/website/ 2>/dev/null || true
        
        cd ../KakoikirakuHome
        
        echo 'import React from "react";
        import { WebView } from "react-native-webview";
        import { Platform } from "react-native";

        const App = () => {
          const localSource = { 
            uri: Platform.OS === "android" 
              ? "file:///android_asset/website/index.html"
              : "file://\${RNFS.MainBundlePath}/website/index.html" 
          };
          
          return (
            <WebView
              source={localSource}
              allowFileAccess={true}
              allowUniversalAccessFromFileURLs={true}
              allowFileAccessFromFileURLs={true}
              javaScriptEnabled={true}
              domStorageEnabled={true}
              style={{ flex: 1 }}
            />
          );
        };

        export default App;' > App.js
        
        echo "=== WEBSITE BUNDLED ==="
        ls -la android/app/src/main/assets/website/

    - name: Verify names and structure
      run: |
        echo "=== VERIFYING ==="
        cd KakoikirakuHome
        echo "Package name:"
        grep "applicationId" android/app/build.gradle
        echo "App name:"
        cat android/app/src/main/res/values/strings.xml

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Add Android permissions
      run: |
        echo "=== ADDING PERMISSIONS ==="
        cd KakoikirakuHome/android/app/src/main
        cp AndroidManifest.xml AndroidManifest.xml.backup
        
        sed -i '/<manifest /a\
        <uses-permission android:name="android.permission.INTERNET" />\
        <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" />\
        <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" />\
        <uses-permission android:name="android.permission.MANAGE_EXTERNAL_STORAGE" />\
        <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />\
        <uses-permission android:name="android.permission.ACCESS_WIFI_STATE" />' AndroidManifest.xml

    - name: Build Release APK
      run: |
        echo "=== BUILDING APK ==="
        cd KakoikirakuHome/android
        chmod +x gradlew
        ./gradlew assembleRelease --no-daemon

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: kakoikiraku-home-offline-apk
        path: KakoikirakuHome/android/app/build/outputs/apk/release/*.apk

    - name: Upload website bundle info
      if: always()
      run: |
        echo "=== BUNDLE INFO ==="
        if [ -d "KakoikirakuHome" ]; then
          cd KakoikirakuHome
          echo "Files in APK:"
          find android/app/src/main/assets/website -type f | sort || echo "No website folder"
        else
          echo "Project folder not found"
        fi
