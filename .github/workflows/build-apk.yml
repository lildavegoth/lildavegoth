name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Android
      uses: android-actions/setup-android@v3
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
    
    - run: npm install @capacitor/cli @capacitor/core @capacitor/android
    
    - name: Create minimal config files
      run: |
        # Create capacitor.config.json
        echo '{"appId":"com.lildavegoth.kakoikiraku","appName":"Kakoi Kiraku Home","webDir":"./","server":{"androidScheme":"https"}}' > capacitor.config.json
        
        # Create basic Android files if missing
        mkdir -p android/app/src/main/res/values
        echo '<?xml version="1.0" encoding="utf-8"?><manifest xmlns:android="http://schemas.android.com/apk/res/android" package="com.lildavegoth.kakoikiraku"><uses-permission android:name="android.permission.INTERNET"/><uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE"/><uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE"/><application android:allowBackup="true" android:icon="@mipmap/ic_launcher" android:label="Kakoi Kiraku Home"><activity android:name="com.getcapacitor.BridgeActivity" android:exported="true"><intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter></activity></application></manifest>' > android/app/src/main/AndroidManifest.xml
    
    - run: npx cap sync android
    - run: cd android && ./gradlew assembleDebug
    
    - uses: actions/upload-artifact@v4
      with:
        name: app
        path: android/app/build/outputs/apk/debug/*.apk
