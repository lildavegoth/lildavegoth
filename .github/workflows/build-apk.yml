name: Build WebView APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js and Java
      uses: actions/setup-node@v4
      with:
        node-version: '18'
    
    - name: Setup JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Create React Native project
      run: |
        echo "=== CREATING REACT NATIVE PROJECT ==="
        # Use the new CLI command
        npx @react-native-community/cli@latest init KirakuApp --skip-install
        
        cd KirakuApp
        
        # Install dependencies
        npm install
        
        # Install WebView
        npm install react-native-webview@latest
        
        # Create simple App.js with permissions - CORRECT INDENTATION
        echo 'import React from "react";
        import { WebView } from "react-native-webview";

        const App = () => {
          return (
            <WebView
              source={{ uri: "https://lildavegoth.github.io/lildavegoth/" }}
              allowFileAccess={true}
              allowUniversalAccessFromFileURLs={true}
              allowFileAccessFromFileURLs={true}
              javaScriptEnabled={true}
              domStorageEnabled={true}
              style={{ flex: 1 }}
            />
          );
        };

        export default App;' > App.js

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Add Android permissions
      run: |
        echo "=== ADDING ANDROID PERMISSIONS ==="
        cd KirakuApp/android/app/src/main
        
        # Backup original
        cp AndroidManifest.xml AndroidManifest.xml.backup
        
        # Insert permissions after <manifest> tag
        sed -i '/<manifest /a\
        <uses-permission android:name="android.permission.INTERNET" />\
        <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" />\
        <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" />\
        <uses-permission android:name="android.permission.MANAGE_EXTERNAL_STORAGE" />\
        <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />' AndroidManifest.xml
        
        echo "=== PERMISSIONS ADDED ==="
        cat AndroidManifest.xml

    - name: Build Android APK
      run: |
        echo "=== BUILDING APK ==="
        cd KirakuApp/android
        
        # Make gradlew executable
        chmod +x gradlew
        
        # Build debug APK
        ./gradlew assembleDebug --no-daemon --stacktrace

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: kiraku-webview-apk
        path: KirakuApp/android/app/build/outputs/apk/debug/*.apk
        retention-days: 1
