name: Build Kakoi Kiraku Home APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js 20 and Java 17
      uses: actions/setup-node@v4
      with:
        node-version: '20'
    
    - name: Setup JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Create project with custom names
      run: |
        echo "=== CREATING PROJECT WITH CUSTOM NAMES ==="
        # INIT WITH CUSTOM NAMES
        npx @react-native-community/cli@latest init KakoikirakuHome \
          --package-name "com.lildavegoth.kakoikirakuhome" \
          --title "Kakoi Kiraku Home" \
          --skip-install
        
        cd KakoikirakuHome
        
        npm install
        npm install react-native-webview@latest
        
        # Create WebView App.js
        echo 'import React from "react";
        import { WebView } from "react-native-webview";

        const App = () => {
          return (
            <WebView
              source={{ uri: "https://lildavegoth.github.io/lildavegoth/" }}
              allowFileAccess={true}
              allowUniversalAccessFromFileURLs={true}
              allowFileAccessFromFileURLs={true}
              javaScriptEnabled={true}
              domStorageEnabled={true}
              style={{ flex: 1 }}
            />
          );
        };

        export default App;' > App.js

    - name: Verify names
      run: |
        cd KakoikirakuHome
        echo "=== VERIFYING NAMES ==="
        echo "Package name in build.gradle:"
        grep "applicationId" android/app/build.gradle
        echo "App name in strings.xml:"
        cat android/app/src/main/res/values/strings.xml

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Add Android permissions
      run: |
        echo "=== ADDING ANDROID PERMISSIONS ==="
        cd KakoikirakuHome/android/app/src/main
        
        cp AndroidManifest.xml AndroidManifest.xml.backup
        
        sed -i '/<manifest /a\
        <uses-permission android:name="android.permission.INTERNET" />\
        <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" />\
        <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" />\
        <uses-permission android:name="android.permission.MANAGE_EXTERNAL_STORAGE" />\
        <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />' AndroidManifest.xml

    - name: Build Release APK
      run: |
        echo "=== BUILDING RELEASE APK ==="
        cd KakoikirakuHome/android
        
        chmod +x gradlew
        ./gradlew assembleRelease --no-daemon

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: kakoikiraku-home-apk
        path: KakoikirakuHome/android/app/build/outputs/apk/release/*.apk
