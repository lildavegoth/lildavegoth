name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'

    - name: Create package files
      run: |
        npm init -y
        npm install @capacitor/core@5.7.0 @capacitor/cli@5.7.0 @capacitor/android@5.7.0
        echo '{"appId":"com.lildavegoth.kiraku","appName":"Kakoi Kiraku","webDir":"./","server":{"androidScheme":"https"}}' > capacitor.config.json

    - name: Create Android files using echo commands
      run: |
        mkdir -p android/app/src/main/res/values
        
        # Create AndroidManifest.xml line by line (no EOF issues)
        echo '<?xml version="1.0" encoding="utf-8"?>' > android/app/src/main/AndroidManifest.xml
        echo '<manifest xmlns:android="http://schemas.android.com/apk/res/android"' >> android/app/src/main/AndroidManifest.xml
        echo '    package="com.lildavegoth.kiraku">' >> android/app/src/main/AndroidManifest.xml
        echo '' >> android/app/src/main/AndroidManifest.xml
        echo '    <uses-permission android:name="android.permission.INTERNET" />' >> android/app/src/main/AndroidManifest.xml
        echo '    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" />' >> android/app/src/main/AndroidManifest.xml
        echo '    <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" />' >> android/app/src/main/AndroidManifest.xml
        echo '    <uses-permission android:name="android.permission.MANAGE_EXTERNAL_STORAGE" />' >> android/app/src/main/AndroidManifest.xml
        echo '    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />' >> android/app/src/main/AndroidManifest.xml
        echo '' >> android/app/src/main/AndroidManifest.xml
        echo '    <application' >> android/app/src/main/AndroidManifest.xml
        echo '        android:allowBackup="true"' >> android/app/src/main/AndroidManifest.xml
        echo '        android:icon="@mipmap/ic_launcher"' >> android/app/src/main/AndroidManifest.xml
        echo '        android:label="Kakoi Kiraku"' >> android/app/src/main/AndroidManifest.xml
        echo '        android:theme="@style/AppTheme">' >> android/app/src/main/AndroidManifest.xml
        echo '' >> android/app/src/main/AndroidManifest.xml
        echo '        <activity' >> android/app/src/main/AndroidManifest.xml
        echo '            android:name="com.getcapacitor.BridgeActivity"' >> android/app/src/main/AndroidManifest.xml
        echo '            android:exported="true"' >> android/app/src/main/AndroidManifest.xml
        echo '            android:launchMode="singleTask">' >> android/app/src/main/AndroidManifest.xml
        echo '' >> android/app/src/main/AndroidManifest.xml
        echo '            <intent-filter>' >> android/app/src/main/AndroidManifest.xml
        echo '                <action android:name="android.intent.action.MAIN" />' >> android/app/src/main/AndroidManifest.xml
        echo '                <category android:name="android.intent.category.LAUNCHER" />' >> android/app/src/main/AndroidManifest.xml
        echo '            </intent-filter>' >> android/app/src/main/AndroidManifest.xml
        echo '        </activity>' >> android/app/src/main/AndroidManifest.xml
        echo '    </application>' >> android/app/src/main/AndroidManifest.xml
        echo '</manifest>' >> android/app/src/main/AndroidManifest.xml
        
        # Create styles.xml
        echo '<?xml version="1.0" encoding="utf-8"?>' > android/app/src/main/res/values/styles.xml
        echo '<resources>' >> android/app/src/main/res/values/styles.xml
        echo '    <style name="AppTheme" parent="Theme.AppCompat.Light.DarkActionBar">' >> android/app/src/main/res/values/styles.xml
        echo '        <item name="colorPrimary">#000000</item>' >> android/app/src/main/res/values/styles.xml
        echo '        <item name="colorPrimaryDark">#000000</item>' >> android/app/src/main/res/values/styles.xml
        echo '    </style>' >> android/app/src/main/res/values/styles.xml
        echo '</resources>' >> android/app/src/main/res/values/styles.xml
        
        # Create build.gradle files
        echo 'buildscript { repositories { google(); mavenCentral() } }' > android/build.gradle
        echo 'plugins { id "com.android.application" }' > android/app/build.gradle
        echo 'android { compileSdk 34; defaultConfig { applicationId "com.lildavegoth.kiraku" } }' >> android/app/build.gradle

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Build APK with Gradle
      run: |
        cd android
        ./gradlew assembleDebug --stacktrace

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-apk
        path: android/app/build/outputs/apk/debug/*.apk
