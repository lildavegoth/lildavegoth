name: Build APK

on:
  workflow_dispatch:  # This means "Manual trigger" in GitHub Actions
  push:               # Optional: Auto-build on every push
    branches: [ main ]

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - uses: cemcoe/web-to-apk-action@v1
        with:
          app_name: "Kakoi Kiraku Home"
          app_id: "kk.kiraku.home"
          build_command: "npm install && npm run build"
          web_dir: "."
          version: "1.0.0"
          version_code: 1
