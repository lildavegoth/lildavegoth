name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"

      - name: Create package files
        run: |
          npm init -y
          npm install @capacitor/core@5.7.0 @capacitor/cli@5.7.0 @capacitor/android@5.7.0
          echo '{"appId":"com.lildavegoth.kakoikiraku","appName":"Kakoi Kiraku Home","webDir":"./","server":{"androidScheme":"https"}}' > capacitor.config.json

      - name: Create Android files
        run: |
          mkdir -p android/app/src/main/res/values
          
          # Create AndroidManifest.xml
          echo '<?xml version="1.0" encoding="utf-8"?>' > android/app/src/main/AndroidManifest.xml
          echo '<manifest xmlns:android="http://schemas.android.com/apk/res/android"' >> android/app/src/main/AndroidManifest.xml
          echo '    package="com.lildavegoth.kakoikiraku">' >> android/app/src/main/AndroidManifest.xml
          echo '' >> android/app/src/main/AndroidManifest.xml
          echo '    <!-- ALL PERMISSIONS FOR FULL ACCESS -->' >> android/app/src/main/AndroidManifest.xml
          echo '    <uses-permission android:name="android.permission.INTERNET" />' >> android/app/src/main/AndroidManifest.xml
          echo '    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" />' >> android/app/src/main/AndroidManifest.xml
          echo '    <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" />' >> android/app/src/main/AndroidManifest.xml
          echo '    <uses-permission android:name="android.permission.MANAGE_EXTERNAL_STORAGE" />' >> android/app/src/main/AndroidManifest.xml
          echo '    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />' >> android/app/src/main/AndroidManifest.xml
          echo '    <uses-permission android:name="android.permission.ACCESS_WIFI_STATE" />' >> android/app/src/main/AndroidManifest.xml
          echo '    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />' >> android/app/src/main/AndroidManifest.xml
          echo '' >> android/app/src/main/AndroidManifest.xml
          echo '    <application' >> android/app/src/main/AndroidManifest.xml
          echo '        android:allowBackup="true"' >> android/app/src/main/AndroidManifest.xml
          echo '        android:icon="@mipmap/ic_launcher"' >> android/app/src/main/AndroidManifest.xml
          echo '        android:label="Kakoi Kiraku Home"' >> android/app/src/main/AndroidManifest.xml
          echo '        android:theme="@style/AppTheme"' >> android/app/src/main/AndroidManifest.xml
          echo '        android:usesCleartextTraffic="true">' >> android/app/src/main/AndroidManifest.xml
          echo '' >> android/app/src/main/AndroidManifest.xml
          echo '        <activity' >> android/app/src/main/AndroidManifest.xml
          echo '            android:name="com.getcapacitor.BridgeActivity"' >> android/app/src/main/AndroidManifest.xml
          echo '            android:exported="true"' >> android/app/src/main/AndroidManifest.xml
          echo '            android:launchMode="singleTask"' >> android/app/src/main/AndroidManifest.xml
          echo '            android:configChanges="orientation|keyboardHidden|keyboard|screenSize|locale|smallestScreenSize|screenLayout|uiMode"' >> android/app/src/main/AndroidManifest.xml
          echo '            android:windowSoftInputMode="adjustResize">' >> android/app/src/main/AndroidManifest.xml
          echo '' >> android/app/src/main/AndroidManifest.xml
          echo '            <intent-filter>' >> android/app/src/main/AndroidManifest.xml
          echo '                <action android:name="android.intent.action.MAIN" />' >> android/app/src/main/AndroidManifest.xml
          echo '                <category android:name="android.intent.category.LAUNCHER" />' >> android/app/src/main/AndroidManifest.xml
          echo '            </intent-filter>' >> android/app/src/main/AndroidManifest.xml
          echo '        </activity>' >> android/app/src/main/AndroidManifest.xml
          echo '    </application>' >> android/app/src/main/AndroidManifest.xml
          echo '</manifest>' >> android/app/src/main/AndroidManifest.xml
          
          # Create styles.xml
          echo '<?xml version="1.0" encoding="utf-8"?>' > android/app/src/main/res/values/styles.xml
          echo '<resources>' >> android/app/src/main/res/values/styles.xml
          echo '    <style name="AppTheme" parent="Theme.AppCompat.Light.DarkActionBar">' >> android/app/src/main/res/values/styles.xml
          echo '        <item name="colorPrimary">#000000</item>' >> android/app/src/main/res/values/styles.xml
          echo '        <item name="colorPrimaryDark">#000000</item>' >> android/app/src/main/res/values/styles.xml
          echo '        <item name="colorAccent">#FFFFFF</item>' >> android/app/src/main/res/values/styles.xml
          echo '        <item name="android:windowBackground">#FFFFFF</item>' >> android/app/src/main/res/values/styles.xml
          echo '    </style>' >> android/app/src/main/res/values/styles.xml
          echo '</resources>' >> android/app/src/main/res/values/styles.xml
          
          # Create strings.xml
          echo '<?xml version="1.0" encoding="utf-8"?>' > android/app/src/main/res/values/strings.xml
          echo '<resources>' >> android/app/src/main/res/values/strings.xml
          echo '    <string name="app_name">Kakoi Kiraku Home</string>' >> android/app/src/main/res/values/strings.xml
          echo '</resources>' >> android/app/src/main/res/values/strings.xml
          
          # Create build.gradle (project level)
          echo 'buildscript {' > android/build.gradle
          echo '    repositories {' >> android/build.gradle
          echo '        google()' >> android/build.gradle
          echo '        mavenCentral()' >> android/build.gradle
          echo '    }' >> android/build.gradle
          echo '    dependencies {' >> android/build.gradle
          echo '        classpath "com.android.tools.build:gradle:8.0.0"' >> android/build.gradle
          echo '    }' >> android/build.gradle
          echo '}' >> android/build.gradle
          echo '' >> android/build.gradle
          echo 'allprojects {' >> android/build.gradle
          echo '    repositories {' >> android/build.gradle
          echo '        google()' >> android/build.gradle
          echo '        mavenCentral()' >> android/build.gradle
          echo '    }' >> android/build.gradle
          echo '}' >> android/build.gradle
          echo '' >> android/build.gradle
          echo 'task clean(type: Delete) {' >> android/build.gradle
          echo '    delete rootProject.buildDir' >> android/build.gradle
          echo '}' >> android/build.gradle
          
          # Create app/build.gradle
          echo 'plugins {' > android/app/build.gradle
          echo '    id "com.android.application"' >> android/app/build.gradle
          echo '}' >> android/app/build.gradle
          echo '' >> android/app/build.gradle
          echo 'android {' >> android/app/build.gradle
          echo '    namespace "com.lildavegoth.kakoikiraku"' >> android/app/build.gradle
          echo '    compileSdk 34' >> android/app/build.gradle
          echo '' >> android/app/build.gradle
          echo '    defaultConfig {' >> android/app/build.gradle
          echo '        applicationId "com.lildavegoth.kakoikiraku"' >> android/app/build.gradle
          echo '        minSdk 24' >> android/app/build.gradle
          echo '        targetSdk 34' >> android/app/build.gradle
          echo '        versionCode 1' >> android/app/build.gradle
          echo '        versionName "1.0"' >> android/app/build.gradle
          echo '    }' >> android/app/build.gradle
          echo '' >> android/app/build.gradle
          echo '    buildTypes {' >> android/app/build.gradle
          echo '        release {' >> android/app/build.gradle
          echo '            minifyEnabled false' >> android/app/build.gradle
          echo '        }' >> android/app/build.gradle
          echo '        debug {' >> android/app/build.gradle
          echo '            debuggable true' >> android/app/build.gradle
          echo '        }' >> android/app/build.gradle
          echo '    }' >> android/app/build.gradle
          echo '' >> android/app/build.gradle
          echo '    compileOptions {' >> android/app/build.gradle
          echo '        sourceCompatibility JavaVersion.VERSION_17' >> android/app/build.gradle
          echo '        targetCompatibility JavaVersion.VERSION_17' >> android/app/build.gradle
          echo '    }' >> android/app/build.gradle
          echo '}' >> android/app/build.gradle
          echo '' >> android/app/build.gradle
          echo 'dependencies {' >> android/app/build.gradle
          echo '    implementation "androidx.appcompat:appcompat:1.6.1"' >> android/app/build.gradle
          echo '}' >> android/app/build.gradle
          
          # Create settings.gradle
          echo 'rootProject.name = "Kakoi Kiraku Home"' > android/settings.gradle
          echo 'include ":app"' >> android/settings.gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Initialize Capacitor
        run: |
          npx cap init "Kakoi Kiraku Home" "com.lildavegoth.kakoikiraku" --web-dir="./" --silent
          npx cap add android --silent
          npx cap sync android

      - name: Build APK
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: kakoikiraku-home-apk
          path: android/app/build/outputs/apk/debug/*.apk
