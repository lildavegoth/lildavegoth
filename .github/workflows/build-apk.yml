name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [homepage]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: "18"

    - name: Install dependencies
      run: |
        npm init -y
        npm install @capacitor/core@5.7.0 @capacitor/cli@5.7.0 @capacitor/android@5.7.0 --no-audit
        echo '{"appId":"com.lildavegoth.kakoikiraku","appName":"Kakoi Kiraku Home","webDir":"./","server":{"androidScheme":"https"}}' > capacitor.config.json

    - name: Create Android project
      run: |
        echo "=== CREATING ANDROID PROJECT ==="
        
        # First create Android project with Capacitor
        npx cap init "Kakoi Kiraku Home" "com.lildavegoth.kakoikiraku" --web-dir="./"
        npx cap add android
        
        echo "=== UPDATING PERMISSIONS ==="
        
        # Update AndroidManifest.xml with ALL permissions (using echo to avoid EOF issues)
        echo '<?xml version="1.0" encoding="utf-8"?>' > android/app/src/main/AndroidManifest.xml
        echo '<manifest xmlns:android="http://schemas.android.com/apk/res/android"' >> android/app/src/main/AndroidManifest.xml
        echo '  package="com.lildavegoth.kakoikiraku">' >> android/app/src/main/AndroidManifest.xml
        echo '' >> android/app/src/main/AndroidManifest.xml
        echo '  <!-- ALL PERMISSIONS -->' >> android/app/src/main/AndroidManifest.xml
        echo '  <uses-permission android:name="android.permission.INTERNET" />' >> android/app/src/main/AndroidManifest.xml
        echo '  <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" />' >> android/app/src/main/AndroidManifest.xml
        echo '  <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" />' >> android/app/src/main/AndroidManifest.xml
        echo '  <uses-permission android:name="android.permission.MANAGE_EXTERNAL_STORAGE" />' >> android/app/src/main/AndroidManifest.xml
        echo '  <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />' >> android/app/src/main/AndroidManifest.xml
        echo '  <uses-permission android:name="android.permission.ACCESS_WIFI_STATE" />' >> android/app/src/main/AndroidManifest.xml
        echo '  <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />' >> android/app/src/main/AndroidManifest.xml
        echo '' >> android/app/src/main/AndroidManifest.xml
        echo '  <application' >> android/app/src/main/AndroidManifest.xml
        echo '    android:allowBackup="true"' >> android/app/src/main/AndroidManifest.xml
        echo '    android:icon="@mipmap/ic_launcher"' >> android/app/src/main/AndroidManifest.xml
        echo '    android:label="Kakoi Kiraku Home"' >> android/app/src/main/AndroidManifest.xml
        echo '    android:theme="@style/AppTheme"' >> android/app/src/main/AndroidManifest.xml
        echo '    android:usesCleartextTraffic="true">' >> android/app/src/main/AndroidManifest.xml
        echo '' >> android/app/src/main/AndroidManifest.xml
        echo '    <activity' >> android/app/src/main/AndroidManifest.xml
        echo '      android:name="com.getcapacitor.BridgeActivity"' >> android/app/src/main/AndroidManifest.xml
        echo '      android:exported="true"' >> android/app/src/main/AndroidManifest.xml
        echo '      android:launchMode="singleTask"' >> android/app/src/main/AndroidManifest.xml
        echo '      android:configChanges="orientation|keyboardHidden|keyboard|screenSize|locale|smallestScreenSize|screenLayout|uiMode"' >> android/app/src/main/AndroidManifest.xml
        echo '      android:windowSoftInputMode="adjustResize">' >> android/app/src/main/AndroidManifest.xml
        echo '' >> android/app/src/main/AndroidManifest.xml
        echo '      <intent-filter>' >> android/app/src/main/AndroidManifest.xml
        echo '        <action android:name="android.intent.action.MAIN" />' >> android/app/src/main/AndroidManifest.xml
        echo '        <category android:name="android.intent.category.LAUNCHER" />' >> android/app/src/main/AndroidManifest.xml
        echo '      </intent-filter>' >> android/app/src/main/AndroidManifest.xml
        echo '    </activity>' >> android/app/src/main/AndroidManifest.xml
        echo '  </application>' >> android/app/src/main/AndroidManifest.xml
        echo '</manifest>' >> android/app/src/main/AndroidManifest.xml
        
        echo "=== ANDROID PROJECT READY ==="
        ls -la android/

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Sync web files
      run: |
        echo "=== SYNCING WEB FILES ==="
        npx cap sync android

    - name: Build APK
      run: |
        echo "=== BUILDING APK ==="
        cd android
        chmod +x ./gradlew
        ./gradlew assembleDebug --no-daemon --stacktrace

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: kakoikiraku-apk
        path: android/app/build/outputs/apk/debug/*.apk
