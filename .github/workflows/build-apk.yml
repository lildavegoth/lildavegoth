name: Build React Native WebView APK

on:
  workflow_dispatch:
  push:
    branches: [homepage]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'

    - name: Create React Native project
      run: |
        echo "=== CREATING REACT NATIVE PROJECT ==="
        npx react-native init KakoikirakuApp --template react-native-template-typescript
        
        cd KakoikirakuApp
        
        # Install WebView
        npm install react-native-webview
        
        # Install file system access
        npm install react-native-fs
        npm install react-native-document-picker
        
        # Create simplified App.js
        cat > App.js << 'EOF'
        import React from 'react';
        import { WebView } from 'react-native-webview';
        import { PermissionsAndroid, Platform } from 'react-native';
        
        const App = () => {
          React.useEffect(() => {
            if (Platform.OS === 'android') {
              PermissionsAndroid.requestMultiple([
                PermissionsAndroid.PERMISSIONS.READ_EXTERNAL_STORAGE,
                PermissionsAndroid.PERMISSIONS.WRITE_EXTERNAL_STORAGE,
                PermissionsAndroid.PERMISSIONS.MANAGE_EXTERNAL_STORAGE,
                PermissionsAndroid.PERMISSIONS.INTERNET,
              ]);
            }
          }, []);
          
          return (
            <WebView
              source={{ uri: 'https://lildavegoth.github.io/lildavegoth/' }}
              allowFileAccess={true}
              allowUniversalAccessFromFileURLs={true}
              allowFileAccessFromFileURLs={true}
              javaScriptEnabled={true}
              domStorageEnabled={true}
              style={{ flex: 1 }}
            />
          );
        };
        
        export default App;
        EOF
        
        echo "=== PROJECT CREATED ==="

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Build Android APK
      run: |
        echo "=== BUILDING APK ==="
        cd KakoikirakuApp/android
        
        # Build debug APK
        ./gradlew assembleDebug
        
        echo "=== APK LOCATION ==="
        ls -la app/build/outputs/apk/debug/

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: kakoikiraku-webview-apk
        path: KakoikirakuApp/android/app/build/outputs/apk/debug/*.apk
