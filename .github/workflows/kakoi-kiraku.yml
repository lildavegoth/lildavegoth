name: Kakoi Kiraku

on:
  push:
    branches: [homepage]
  workflow_dispatch:
  repository_dispatch:
    types: [compress-video, mirror, capture-frames, fetch-media-info, download-media, enhance-image, restore-image, kira-ai, reduce-image, text-overlay-image, delete-mirror, custom-image]
  schedule:
    - cron: '0 0 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-jekyll:
    if: github.event_name != 'repository_dispatch' && github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3

  deploy-jekyll:
    needs: build-jekyll
    if: github.event_name != 'repository_dispatch' && github.event_name != 'schedule'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  compress:
    if: github.event_name == 'repository_dispatch' && github.event.action == 'compress-video'
    runs-on: ubuntu-latest
    steps:
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Download original video
        run: |
          mkdir -p videos
          wget -O "videos/original.mp4" "${{ github.event.client_payload.video_url }}"
      - name: Compress video
        run: |
          ffmpeg -y -i videos/original.mp4 \
            -vf "scale='min(1280,iw)':'min(720,ih)':force_original_aspect_ratio=decrease,fps=60" \
            -c:v libx264 \
            -crf 28 \
            -preset medium \
            -c:a aac \
            -b:a 128k \
            -ar 48000 \
            -movflags faststart \
            videos/compressed.mp4
      - name: Upload result to Supabase
        run: |
          curl -X POST \
            "https://${{ secrets.SUPABASE_PROJECT_REF }}.supabase.co/storage/v1/object/videos/compressed_${{ github.event.client_payload.original_name }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" \
            -F "file=@videos/compressed.mp4"
      - name: Send compressed video to Telegram
        run: |
          PUBLIC_URL="https://${{ secrets.SUPABASE_PROJECT_REF }}.supabase.co/storage/v1/object/public/videos/compressed_${{ github.event.client_payload.original_name }}"
          curl -X POST "https://api.telegram.org/bot${{ secrets.KIRA_TOKEN }}/sendVideo" \
            -d "chat_id=${{ github.event.client_payload.chat_id }}" \
            -d "video=$PUBLIC_URL" \
            -d "caption=Here's your compressed video."
      - name: Delete progress message
        if: github.event.client_payload.progress_message_id != ''
        run: |
          curl -X POST "https://api.telegram.org/bot${{ secrets.KIRA_TOKEN }}/deleteMessage" \
            -d "chat_id=${{ github.event.client_payload.chat_id }}" \
            -d "message_id=${{ github.event.client_payload.progress_message_id }}"

  mirror:
    if: github.event_name == 'repository_dispatch' && github.event.action == 'mirror'
    runs-on: ubuntu-latest
    env:
      KIRA_TOKEN: ${{ secrets.KIRA_TOKEN }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - name: Install rclone
        run: sudo apt-get update && sudo apt-get install -y rclone
      - name: Configure rclone
        run: |
          export TOKEN='${{ secrets.GDRIVE_TOKEN }}'
          mkdir -p ~/.config/rclone
          cat > ~/.config/rclone/rclone.conf << EOF
          [mirror_drive]
          type = drive
          scope = drive
          client_id = ${{ secrets.GDRIVE_CLIENT_ID }}
          client_secret = ${{ secrets.GDRIVE_CLIENT_SECRET }}
          token = $TOKEN
          root_folder_id = ${{ secrets.GDRIVE_FOLDER_ID }}
          EOF
      - name: Download file
        run: |
          URL="${{ github.event.client_payload.download_url }}"
          mkdir -p downloads
          wget --content-disposition -P downloads "$URL" || \
          curl -L -o "downloads/file" "$URL"
      - name: Rename to original filename if provided
        run: |
          FILENAME="${{ github.event.client_payload.filename }}"
          if [ -n "$FILENAME" ]; then
              cd downloads
              OLD_FILE=$(ls -1 | head -1)
              if [ -f "$OLD_FILE" ] && [ "$OLD_FILE" != "$FILENAME" ]; then
                  mv "$OLD_FILE" "$FILENAME"
              fi
          fi
      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq
      - name: Deliver file based on destination
        run: |
          cd downloads
          FILE=$(ls -1 | head -1)
          if [ -z "$FILE" ]; then
            MSG="Mirror failed: No file found to upload"
            curl -s -X POST "https://api.telegram.org/bot$KIRA_TOKEN/editMessageText" \
              -d "chat_id=${{ github.event.client_payload.chat_id }}" \
              -d "message_id=${{ github.event.client_payload.message_id }}" \
              -d "text=$MSG"
            exit 1
          fi
          SIZE=$(stat -c%s "$FILE")
          DEST="${{ github.event.client_payload.destination }}"
          if [ "$DEST" == "telegram" ]; then
            if [ "$SIZE" -lt 50000000 ]; then
              curl -s -X POST "https://api.telegram.org/bot$KIRA_TOKEN/sendDocument" \
                -F "chat_id=${{ github.event.client_payload.chat_id }}" \
                -F "document=@$FILE" \
                -F "caption=$FILE"
              curl -s -X POST "https://api.telegram.org/bot$KIRA_TOKEN/deleteMessage" \
                -d "chat_id=${{ github.event.client_payload.chat_id }}" \
                -d "message_id=${{ github.event.client_payload.message_id }}"
            else
              MSG="Mirror failed: File too large for Telegram (over 50MB). Use Drive instead."
              curl -s -X POST "https://api.telegram.org/bot$KIRA_TOKEN/editMessageText" \
                -d "chat_id=${{ github.event.client_payload.chat_id }}" \
                -d "message_id=${{ github.event.client_payload.message_id }}" \
                -d "text=$MSG"
            fi
          else
            if rclone copy "$FILE" mirror_drive: -P 2> upload_error.log; then
              LINK=$(rclone link "mirror_drive:$FILE")
              FILE_ID=$(echo "$LINK" | sed -n 's/.*id=\([^&]*\).*/\1/p')
              if [ -n "$FILE_ID" ]; then
                DIRECT_LINK="https://drive.usercontent.google.com/download?id=${FILE_ID}&export=download&authuser=0"
              else
                DIRECT_LINK="$LINK"
              fi
              INSERT_RES=$(curl -s -X POST "${SUPABASE_URL}/rest/v1/mirrored_files" \
                -H "apikey: ${SUPABASE_SERVICE_ROLE_KEY}" \
                -H "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}" \
                -H "Content-Type: application/json" \
                -H "Prefer: return=representation" \
                -d "{\"drive_file_name\": \"$FILE\", \"chat_id\": ${{ github.event.client_payload.chat_id }}}")
              ROW_ID=$(echo "$INSERT_RES" | jq -r '.[0].id // empty')
              if [ -n "$ROW_ID" ]; then
                REPLY_MARKUP="{\"inline_keyboard\":[[{\"text\":\"Delete\",\"callback_data\":\"delete_mirror_${ROW_ID}\"}]]}"
                curl -s -X POST "https://api.telegram.org/bot$KIRA_TOKEN/editMessageText" \
                  -d "chat_id=${{ github.event.client_payload.chat_id }}" \
                  -d "message_id=${{ github.event.client_payload.message_id }}" \
                  -d "text=Mirror completed: $DIRECT_LINK" \
                  -d "reply_markup=$REPLY_MARKUP"
              else
                curl -s -X POST "https://api.telegram.org/bot$KIRA_TOKEN/editMessageText" \
                  -d "chat_id=${{ github.event.client_payload.chat_id }}" \
                  -d "message_id=${{ github.event.client_payload.message_id }}" \
                  -d "text=Mirror completed: $DIRECT_LINK"
              fi
            else
              RAW_ERROR=$(cat upload_error.log)
              if echo "$RAW_ERROR" | grep -qi "storage quota exceeded"; then
                MSG="Mirror failed: Google Drive storage quota exceeded. Please free up space."
              else
                TRUNCATED=$(echo "$RAW_ERROR" | head -c 800)
                MSG="Mirror failed: $TRUNCATED"
              fi
              curl -s -X POST "https://api.telegram.org/bot$KIRA_TOKEN/editMessageText" \
                -d "chat_id=${{ github.event.client_payload.chat_id }}" \
                -d "message_id=${{ github.event.client_payload.message_id }}" \
                -d "text=$MSG"
            fi
          fi
          
  delete-mirror:
    if: github.event_name == 'repository_dispatch' && github.event.action == 'delete-mirror'
    runs-on: ubuntu-latest
    env:
      KIRA_TOKEN: ${{ secrets.KIRA_TOKEN }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - name: Install rclone and jq
        run: |
          sudo rm -f /var/lib/dpkg/lock-frontend /var/lib/dpkg/lock /var/cache/apt/archives/lock
          sudo dpkg --configure -a --force-depends 2>/dev/null || true
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends rclone jq
      - name: Configure rclone
        run: |
          export TOKEN='${{ secrets.GDRIVE_TOKEN }}'
          mkdir -p ~/.config/rclone
          cat > ~/.config/rclone/rclone.conf << EOF
          [mirror_drive]
          type = drive
          scope = drive
          client_id = ${{ secrets.GDRIVE_CLIENT_ID }}
          client_secret = ${{ secrets.GDRIVE_CLIENT_SECRET }}
          token = $TOKEN
          root_folder_id = ${{ secrets.GDRIVE_FOLDER_ID }}
          EOF
      - name: Delete file from Drive
        run: |
          set -e
          FILE_NAME="${{ github.event.client_payload.drive_file_name }}"
          rclone delete "mirror_drive:$FILE_NAME" -P
          ENCODED_NAME=$(printf '%s' "$FILE_NAME" | jq -sRr @uri)
          curl -s -X DELETE "${SUPABASE_URL}/rest/v1/mirrored_files?drive_file_name=eq.${ENCODED_NAME}" \
            -H "apikey: ${SUPABASE_SERVICE_ROLE_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}"
          curl -s -X POST "https://api.telegram.org/bot$KIRA_TOKEN/editMessageText" \
            -d "chat_id=${{ github.event.client_payload.chat_id }}" \
            -d "message_id=${{ github.event.client_payload.message_id }}" \
            -d "text=File deleted."

  capture-frames:
    if: github.event_name == 'repository_dispatch' && github.event.action == 'capture-frames'
    runs-on: ubuntu-latest
    env:
      KIRA_TOKEN: ${{ secrets.KIRA_TOKEN }}
    steps:
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Download video
        run: |
          mkdir -p capture
          wget -O "capture/input.mp4" "${{ github.event.client_payload.video_url }}"
      - name: Extract 10 frames
        run: |
          DURATION=$(ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1:nokey=1 capture/input.mp4)
          FPS=$(echo "scale=6; 10 / $DURATION" | bc)
          ffmpeg -y -i capture/input.mp4 \
            -vf "fps=$FPS,scale=1280:trunc(ow/a/2)*2" \
            -q:v 2 \
            capture/frame_%02d.jpg
      - name: Send frames as media group
        run: |
          cd capture
          FRAMES=(frame_*.jpg)
          if [ ${#FRAMES[@]} -eq 0 ]; then
            echo "No frames extracted"
            exit 1
          fi
          MEDIA="["
          for i in "${!FRAMES[@]}"; do
            if [ $i -gt 0 ]; then MEDIA+=","; fi
            MEDIA+="{\"type\":\"photo\",\"media\":\"attach://frame$i\"}"
          done
          MEDIA+="]"
          CURL_ARGS=(-X POST "https://api.telegram.org/bot${KIRA_TOKEN}/sendMediaGroup")
          CURL_ARGS+=(-F "chat_id=${{ github.event.client_payload.chat_id }}")
          CURL_ARGS+=(-F "media=${MEDIA}")
          for i in "${!FRAMES[@]}"; do
            CURL_ARGS+=(-F "frame${i}=@${FRAMES[$i]}")
          done
          curl "${CURL_ARGS[@]}"
      - name: Delete progress message
        if: github.event.client_payload.progress_message_id != ''
        run: |
          curl -X POST "https://api.telegram.org/bot${{ secrets.KIRA_TOKEN }}/deleteMessage" \
            -d "chat_id=${{ github.event.client_payload.chat_id }}" \
            -d "message_id=${{ github.event.client_payload.progress_message_id }}"

  fetch-media-info:
    if: github.event_name == 'repository_dispatch' && github.event.action == 'fetch-media-info'
    runs-on: ubuntu-latest
    env:
      KIRA_TOKEN: ${{ secrets.KIRA_TOKEN }}
    steps:
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install yt-dlp and ffmpeg
        run: |
          pip install yt-dlp
          sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Fetch media info and send format buttons
        run: |
          echo "${{ secrets.YOUTUBE_COOKIES }}" > cookies.txt
          URL="${{ github.event.client_payload.url }}"
          CHAT_ID="${{ github.event.client_payload.chat_id }}"
          FETCH_MSG_ID="${{ github.event.client_payload.fetching_message_id }}"
          INFO=$(yt-dlp --cookies cookies.txt --js-runtimes node --remote-components ejs:github --dump-json "$URL")
          TITLE=$(echo "$INFO" | jq -r '.title // "Unknown"')
          DURATION=$(echo "$INFO" | jq -r '.duration_string // "?"')
          FORMATS=$(echo "$INFO" | jq -r '
            [.formats[] |
              select(.ext == "mp4" and .height != null and .filesize != null) |
              {
                format_id: .format_id,
                res: "\(.height)p",
                size_mb: ((.filesize / 1048576) | round),
                ext: .ext
              }
            ] | unique_by(.res) | sort_by(.height)
          ')
          FORMAT_LIST=$(echo "$FORMATS" | jq -r '.[] | "\(.res) (\(.size_mb)MB)"' 2>/dev/null || echo "")
          if [ -z "$FORMATS" ] || [ "$FORMATS" == "[]" ]; then
            KEYBOARD='[[{"text":"Best quality","callback_data":"dl_fmt_best_'"$URL"'"}]]'
            FORMAT_LIST="Best quality available"
          else
            KEYBOARD=$(echo "$FORMATS" | jq -r '
              [.[] | {
                text: "\(.res) (\(.size_mb)MB)",
                callback_data: "dl_fmt_\(.format_id)_\($URL)"
              }] | unique_by(.text) |
              reduce .[] as $item ([]; if length == 0 or (.[-1] | length) == 2 then . + [[$item]] else .[-1] += [$item] end)
            ' --arg URL "$URL")
          fi
          REPLY_MARKUP=$(jq -n --argjson keyboard "$KEYBOARD" '{inline_keyboard: $keyboard}')
          printf -v TEXT "Choose format for: %s (%s)\n%s" "$TITLE" "$DURATION" "$FORMAT_LIST"
          curl -X POST "https://api.telegram.org/bot$KIRA_TOKEN/deleteMessage" \
            -d "chat_id=$CHAT_ID" -d "message_id=$FETCH_MSG_ID"
          curl -X POST "https://api.telegram.org/bot$KIRA_TOKEN/sendMessage" \
            -d "chat_id=$CHAT_ID" \
            --data-urlencode "text=$TEXT" \
            -d "reply_markup=$REPLY_MARKUP"

  download-media:
    if: github.event_name == 'repository_dispatch' && github.event.action == 'download-media'
    runs-on: ubuntu-latest
    env:
      KIRA_TOKEN: ${{ secrets.KIRA_TOKEN }}
    steps:
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install yt-dlp, ffmpeg and rclone
        run: |
          pip install yt-dlp
          sudo apt-get update && sudo apt-get install -y ffmpeg rclone

      - name: Configure rclone
        run: |
          export TOKEN='${{ secrets.GDRIVE_TOKEN }}'
          mkdir -p ~/.config/rclone
          cat > ~/.config/rclone/rclone.conf << EOF
          [mirror_drive]
          type = drive
          scope = drive
          client_id = ${{ secrets.GDRIVE_CLIENT_ID }}
          client_secret = ${{ secrets.GDRIVE_CLIENT_SECRET }}
          token = $TOKEN
          root_folder_id = ${{ secrets.GDRIVE_FOLDER_ID }}
          EOF

      - name: Download with chosen format
        run: |
          echo "${{ secrets.YOUTUBE_COOKIES }}" > cookies.txt
          URL="${{ github.event.client_payload.url }}"
          FMT="${{ github.event.client_payload.format_id }}"
          mkdir -p downloads
          yt-dlp --cookies cookies.txt --js-runtimes node --remote-components ejs:github -f "$FMT" -o "downloads/%(title)s.%(ext)s" "$URL"
          # Save the downloaded filename safely
          find downloads -type f -print0 | xargs -0 -I {} basename "{}" > downloads/filename.txt

      - name: Check file size and deliver
        run: |
          FILE=$(cat downloads/filename.txt)
          FILE_PATH="downloads/$FILE"
          SIZE=$(stat -c%s "$FILE_PATH")
          CHAT_ID="${{ github.event.client_payload.chat_id }}"
          PROGRESS_MSG_ID="${{ github.event.client_payload.progress_message_id }}"

          if [ "$SIZE" -lt 50000000 ]; then
            curl -s -X POST "https://api.telegram.org/bot$KIRA_TOKEN/sendDocument" \
              -F "chat_id=$CHAT_ID" \
              -F "document=@$FILE_PATH" \
              -F "caption=$FILE"
            curl -s -X POST "https://api.telegram.org/bot$KIRA_TOKEN/deleteMessage" \
              -d "chat_id=$CHAT_ID" -d "message_id=$PROGRESS_MSG_ID"
          else
            rclone copy "$FILE_PATH" mirror_drive: -P
            LINK=$(rclone link "mirror_drive:$FILE")
            curl -s -X POST "https://api.telegram.org/bot$KIRA_TOKEN/editMessageText" \
              -d "chat_id=$CHAT_ID" \
              -d "message_id=$PROGRESS_MSG_ID" \
              -d "text=Download complete: $LINK"
          fi

  restore-image:
    if: github.event_name == 'repository_dispatch' && github.event.action == 'restore-image'
    runs-on: ubuntu-latest
    env:
      KIRA_TOKEN: ${{ secrets.KIRA_TOKEN }}
    steps:
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y wget unzip
      - name: Download and run Real-ESRGAN, then send result
        run: |
          set -e
          CHAT_ID="${{ github.event.client_payload.chat_id }}"
          PROGRESS_MSG_ID="${{ github.event.client_payload.progress_message_id }}"
          IMAGE_URL="${{ github.event.client_payload.image_url }}"
          mkdir -p Real-ESRGAN
          cd Real-ESRGAN
          wget -q -O realesrgan-ncnn-vulkan-20220424-ubuntu.zip \
            "https://github.com/xinntao/Real-ESRGAN/releases/download/v0.2.5.0/realesrgan-ncnn-vulkan-20220424-ubuntu.zip"
          unzip -q realesrgan-ncnn-vulkan-20220424-ubuntu.zip
          chmod +x realesrgan-ncnn-vulkan
          mkdir -p ../images
          cd ../images
          wget -q -O input.jpg "$IMAGE_URL"
          ../Real-ESRGAN/realesrgan-ncnn-vulkan -i input.jpg -o restored.jpg -s 4 -n realesrgan-x4plus || true
          if [ -f restored.jpg ]; then
            curl -s -X POST "https://api.telegram.org/bot$KIRA_TOKEN/sendDocument" \
              -F "chat_id=$CHAT_ID" \
              -F "document=@restored.jpg" \
              -F "caption=Restored image"
            curl -s -X POST "https://api.telegram.org/bot$KIRA_TOKEN/deleteMessage" \
              -d "chat_id=$CHAT_ID" -d "message_id=$PROGRESS_MSG_ID"
          else
            curl -s -X POST "https://api.telegram.org/bot$KIRA_TOKEN/editMessageText" \
              -d "chat_id=$CHAT_ID" \
              -d "message_id=$PROGRESS_MSG_ID" \
              -d "text=Restoration failed. The image may be too large or unsupported."
          fi

  enhance-image:
    if: github.event_name == 'repository_dispatch' && github.event.action == 'enhance-image'
    runs-on: ubuntu-latest
    env:
      KIRA_TOKEN: ${{ secrets.KIRA_TOKEN }}
    steps:
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Enhance and send result
        run: |
          set -e
          CHAT_ID="${{ github.event.client_payload.chat_id }}"
          PROGRESS_MSG_ID="${{ github.event.client_payload.progress_message_id }}"
          IMAGE_URL="${{ github.event.client_payload.image_url }}"
          mkdir -p images
          cd images
          wget -q -O input.jpg "$IMAGE_URL"
          ffmpeg -y -i input.jpg \
            -vf "unsharp=5:5:1.0:5:5:0.0,eq=contrast=1.1:brightness=0.05" \
            enhanced.jpg || true
          if [ -f enhanced.jpg ]; then
            curl -s -X POST "https://api.telegram.org/bot$KIRA_TOKEN/sendDocument" \
              -F "chat_id=$CHAT_ID" \
              -F "document=@enhanced.jpg" \
              -F "caption=Enhanced image"
            curl -s -X POST "https://api.telegram.org/bot$KIRA_TOKEN/deleteMessage" \
              -d "chat_id=$CHAT_ID" -d "message_id=$PROGRESS_MSG_ID"
          else
            curl -s -X POST "https://api.telegram.org/bot$KIRA_TOKEN/editMessageText" \
              -d "chat_id=$CHAT_ID" \
              -d "message_id=$PROGRESS_MSG_ID" \
              -d "text=Enhancement failed. The image may be too large or unsupported."
          fi

  reduce-image:
    if: github.event_name == 'repository_dispatch' && github.event.action == 'reduce-image'
    runs-on: ubuntu-latest
    env:
      KIRA_TOKEN: ${{ secrets.KIRA_TOKEN }}
    steps:
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install sharp
        run: npm install sharp
      - name: Download and reduce image
        run: |
          mkdir -p images
          wget -q -O images/input.jpg "${{ github.event.client_payload.image_url }}"
          node -e "
            const sharp = require('sharp');
            sharp('images/input.jpg')
              .webp({ quality: 30 })
              .withMetadata({ strip: true })
              .toFile('images/reduced.webp')
              .then(() => {
                const { execSync } = require('child_process');
                const size = require('fs').statSync('images/reduced.webp').size;
                console.log('Reduced, size:', size);
              });
          "
      - name: Send reduced image as document
        run: |
          CHAT_ID="${{ github.event.client_payload.chat_id }}"
          PROGRESS_MSG_ID="${{ github.event.client_payload.progress_message_id }}"
          curl -s -X POST "https://api.telegram.org/bot$KIRA_TOKEN/sendDocument" \
            -F "chat_id=$CHAT_ID" \
            -F "document=@images/reduced.webp" \
            -F "caption=Reduced image"
          curl -s -X POST "https://api.telegram.org/bot$KIRA_TOKEN/deleteMessage" \
            -d "chat_id=$CHAT_ID" -d "message_id=$PROGRESS_MSG_ID"

  text-overlay-image:
    if: github.event_name == 'repository_dispatch' && github.event.action == 'text-overlay-image'
    runs-on: ubuntu-latest
    env:
      KIRA_TOKEN: ${{ secrets.KIRA_TOKEN }}
    steps:
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install sharp
        run: npm install sharp

      - name: Download image and add text overlay with shadow
        run: |
          mkdir -p images
          wget -q -O images/input.jpg "${{ github.event.client_payload.image_url }}"
          node -e "
            const sharp = require('sharp');
            const text = '${{ github.event.client_payload.text }}';
            sharp('images/input.jpg')
              .resize(800, 600, { fit: 'inside' })
              .toBuffer()
              .then(buffer => {
                return sharp(buffer).metadata().then(meta => {
                  const w = meta.width;
                  const h = meta.height;
                  const svg = Buffer.from(
                    '<svg width=\"' + w + '\" height=\"' + h + '\">' +
                    '<text x=\"100%\" y=\"100%\" text-anchor=\"end\" font-size=\"24\" font-family=\"Arial\" dy=\"-10\" fill=\"black\" fill-opacity=\"0.5\">' + text + '</text>' +
                    '<text x=\"100%\" y=\"100%\" text-anchor=\"end\" font-size=\"24\" font-family=\"Arial\" dy=\"-11\" dx=\"-1\" fill=\"white\">' + text + '</text>' +
                    '</svg>'
                  );
                  return sharp(buffer)
                    .composite([{ input: svg, top: 0, left: 0 }])
                    .jpeg()
                    .toFile('images/output.jpg');
                });
              })
              .then(() => process.exit(0))
              .catch(err => { console.error(err); process.exit(1); });
          "

  custom-image:
    if: github.event_name == 'repository_dispatch' && github.event.action == 'custom-image'
    runs-on: ubuntu-latest
    env:
      KIRA_TOKEN: ${{ secrets.KIRA_TOKEN }}
    steps:
      - name: Install ffmpeg
        run: |
          export DEBIAN_FRONTEND=noninteractive
          sudo rm -f /var/lib/dpkg/lock-frontend /var/lib/dpkg/lock /var/cache/apt/archives/lock
          sudo dpkg --configure -a --force-depends 2>/dev/null || true
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends -o Dpkg::Options::="--force-confdef" -o Dpkg::Options::="--force-confold" ffmpeg
      - name: Download image
        run: |
          mkdir -p images
          wget -q -O images/input.jpg "${{ github.event.client_payload.image_url }}"
      - name: Run custom command
        id: custom_cmd
        continue-on-error: true
        run: |
          cd images
          COMMAND="${{ github.event.client_payload.command }}"
          eval "$COMMAND"
      - name: Send result or error
        if: always()
        run: |
          CHAT_ID="${{ github.event.client_payload.chat_id }}"
          PROGRESS_MSG_ID="${{ github.event.client_payload.progress_message_id }}"
          cd images
          if [ -f output.jpg ]; then
            curl -s -X POST "https://api.telegram.org/bot$KIRA_TOKEN/sendDocument" \
              -F "chat_id=$CHAT_ID" \
              -F "document=@output.jpg" \
              -F "caption=Custom processed image"
            curl -s -X POST "https://api.telegram.org/bot$KIRA_TOKEN/deleteMessage" \
              -d "chat_id=$CHAT_ID" -d "message_id=$PROGRESS_MSG_ID"
          else
            curl -s -X POST "https://api.telegram.org/bot$KIRA_TOKEN/editMessageText" \
              -d "chat_id=$CHAT_ID" \
              -d "message_id=$PROGRESS_MSG_ID" \
              -d "text=Custom processing failed. Check your command syntax."
          fi

  kira-ai:
    if: github.event_name == 'repository_dispatch' && github.event.action == 'kira-ai'
    runs-on: ubuntu-latest
    env:
      KIRA_TOKEN: ${{ secrets.KIRA_TOKEN }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      ENCRYPTION_KEY: ${{ secrets.ENCRYPTION_KEY }}
    steps:
      - name: Fetch job from Supabase
        id: fetch
        run: |
          JOB_ID="${{ github.event.client_payload.job_id }}"
          DATA=$(curl -s "https://$SUPABASE_URL/rest/v1/kira_jobs?id=eq.$JOB_ID&select=*" \
            -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY")
          echo "JOB=$DATA" >> $GITHUB_ENV
      - name: Get user token
        id: token
        run: |
          JOB_ID="${{ github.event.client_payload.job_id }}"
          JOB=$(echo "$JOB" | jq '.[0]')
          USER_ID=$(echo "$JOB" | jq -r '.user_id')
          TOKEN_DATA=$(curl -s "https://$SUPABASE_URL/rest/v1/kira_keys?user_id=eq.$USER_ID&select=encrypted_token" \
            -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY")
          ENC_TOKEN=$(echo "$TOKEN_DATA" | jq -r '.[0].encrypted_token')
          echo "ENC_TOKEN=$ENC_TOKEN" >> $GITHUB_ENV
          echo "USER_ID=$USER_ID" >> $GITHUB_ENV
          echo "CHAT_ID=$(echo "$JOB" | jq -r '.chat_id')" >> $GITHUB_ENV
          echo "MESSAGE_ID=$(echo "$JOB" | jq -r '.message_id')" >> $GITHUB_ENV
          echo "TEXT=$(echo "$JOB" | jq -r '.text')" >> $GITHUB_ENV
      - name: Decrypt token and call OpenRouter
        id: ai
        run: |
          # Simple XOR decrypt (Node.js)
          node -e "
            const key = process.env.ENCRYPTION_KEY;
            const cipher = process.env.ENC_TOKEN;
            const decipher = (c) => {
              const k = Buffer.from(key, 'utf-8');
              const cBytes = Buffer.from(c, 'base64');
              const r = Buffer.alloc(cBytes.length);
              for (let i=0; i<cBytes.length; i++) r[i] = cBytes[i] ^ k[i % k.length];
              return r.toString('utf-8');
            };
            console.log(decipher(cipher));
          " > token.txt
          TOKEN=$(cat token.txt)
          RESPONSE=$(curl -s "https://openrouter.ai/api/v1/chat/completions" \
            -H "Authorization: Bearer $TOKEN" \
            -H "Content-Type: application/json" \
            -H "HTTP-Referer: https://github.com" \
            -H "X-Title: Telegram Bot" \
            -d "{\"model\":\"openrouter/free\",\"messages\":[{\"role\":\"user\",\"content\":\"$TEXT\"}],\"max_tokens\":800,\"temperature\":0.7}")
          echo "REPLY=$RESPONSE" >> $GITHUB_ENV
      - name: Edit Telegram message
        run: |
          REPLY_TEXT=$(echo "$REPLY" | jq -r '.choices[0].message.content // "Sorry, I could not generate a reply."')
          curl -s -X POST "https://api.telegram.org/bot$KIRA_TOKEN/editMessageText" \
            -d "chat_id=$CHAT_ID" \
            -d "message_id=$MESSAGE_ID" \
            -d "text=$REPLY_TEXT"
      - name: Delete job
        run: |
          JOB_ID="${{ github.event.client_payload.job_id }}"
          curl -s -X DELETE "https://$SUPABASE_URL/rest/v1/kira_jobs?id=eq.$JOB_ID" \
            -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY"

  cleanup-history:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    steps:
      - name: Delete workflow runs older than 3 days
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          THREE_DAYS_AGO=$(date -d "3 days ago" --utc +%Y-%m-%dT%H:%M:%SZ)
          page=1
          while true; do
            runs=$(gh api "repos/$REPO/actions/runs?per_page=100&page=$page" --jq ".workflow_runs[] | select(.created_at < \"$THREE_DAYS_AGO\") | .id")
            if [ -z "$runs" ]; then
              break
            fi
            for run_id in $runs; do
              gh api -X DELETE "repos/$REPO/actions/runs/$run_id" --silent
            done
            page=$((page + 1))
          done
