name: Kakoi Kiraku

on:
  push:
    branches: [homepage]
  workflow_dispatch:
  repository_dispatch:
    types: [compress-video, mirror, capture-frames, fetch-media-info, download-media, enhance-image, restore-image]
  schedule:
    - cron: '0 0 * * *'
    - cron: '*/5 * * * *'

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-jekyll:
    if: github.event_name != 'repository_dispatch' && github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3

  deploy-jekyll:
    needs: build-jekyll
    if: github.event_name != 'repository_dispatch' && github.event_name != 'schedule'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  compress:
    if: github.event_name == 'repository_dispatch' && github.event.action == 'compress-video'
    runs-on: ubuntu-latest
    steps:
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Download original video
        run: |
          mkdir -p videos
          wget -O "videos/original.mp4" "${{ github.event.client_payload.video_url }}"
      - name: Compress video
        run: |
          ffmpeg -y -i videos/original.mp4 \
            -vf "scale='min(1280,iw)':'min(720,ih)':force_original_aspect_ratio=decrease,fps=60" \
            -c:v libx264 \
            -crf 28 \
            -preset medium \
            -c:a aac \
            -b:a 128k \
            -ar 48000 \
            -movflags faststart \
            videos/compressed.mp4
      - name: Upload result to Supabase
        run: |
          curl -X POST \
            "https://${{ secrets.SUPABASE_PROJECT_REF }}.supabase.co/storage/v1/object/videos/compressed_${{ github.event.client_payload.original_name }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" \
            -F "file=@videos/compressed.mp4"
      - name: Send compressed video to Telegram
        run: |
          PUBLIC_URL="https://${{ secrets.SUPABASE_PROJECT_REF }}.supabase.co/storage/v1/object/public/videos/compressed_${{ github.event.client_payload.original_name }}"
          curl -X POST "https://api.telegram.org/bot${{ secrets.KIRA_TOKEN }}/sendVideo" \
            -d "chat_id=${{ github.event.client_payload.chat_id }}" \
            -d "video=$PUBLIC_URL" \
            -d "caption=Here's your compressed video."
      - name: Delete progress message
        if: github.event.client_payload.progress_message_id != ''
        run: |
          curl -X POST "https://api.telegram.org/bot${{ secrets.KIRA_TOKEN }}/deleteMessage" \
            -d "chat_id=${{ github.event.client_payload.chat_id }}" \
            -d "message_id=${{ github.event.client_payload.progress_message_id }}"

  mirror:
    if: github.event_name == 'repository_dispatch' && github.event.action == 'mirror'
    runs-on: ubuntu-latest
    name: ${{ github.event.client_payload.job_label || 'mirror' }}
    env:
      KIRA_TOKEN: ${{ secrets.KIRA_TOKEN }}
    steps:
      - name: Install rclone
        run: sudo apt-get update && sudo apt-get install -y rclone
      - name: Configure rclone
        run: |
          export TOKEN='${{ secrets.GDRIVE_TOKEN }}'
          mkdir -p ~/.config/rclone
          cat > ~/.config/rclone/rclone.conf << EOF
          [mirror_drive]
          type = drive
          scope = drive
          client_id = ${{ secrets.GDRIVE_CLIENT_ID }}
          client_secret = ${{ secrets.GDRIVE_CLIENT_SECRET }}
          token = $TOKEN
          root_folder_id = ${{ secrets.GDRIVE_FOLDER_ID }}
          EOF
      - name: Download file
        run: |
          URL="${{ github.event.client_payload.download_url }}"
          mkdir -p downloads
          wget --content-disposition -P downloads "$URL" || \
          curl -L -o "downloads/file" "$URL"
      - name: Rename to original filename if provided
        run: |
          FILENAME="${{ github.event.client_payload.filename }}"
          if [ -n "$FILENAME" ]; then
              cd downloads
              OLD_FILE=$(ls -1 | head -1)
              if [ -f "$OLD_FILE" ] && [ "$OLD_FILE" != "$FILENAME" ]; then
                  mv "$OLD_FILE" "$FILENAME"
              fi
          fi
      - name: Upload and get link
        id: upload
        run: |
          cd downloads
          rm -f cookies.txt
          FILE=$(ls -1 | head -1)
          if [ -z "$FILE" ]; then
            echo "UPLOAD_SUCCESS=false" >> $GITHUB_ENV
            echo "UPLOAD_ERROR=No file found to upload" >> $GITHUB_ENV
            exit 1
          fi
          if rclone copy "$FILE" mirror_drive: -P 2> upload_error.log; then
            LINK=$(rclone link "mirror_drive:$FILE")
            echo "UPLOAD_SUCCESS=true" >> $GITHUB_ENV
            echo "DRIVE_LINK=$LINK" >> $GITHUB_ENV
          else
            ERROR_MSG=$(cat upload_error.log)
            echo "UPLOAD_SUCCESS=false" >> $GITHUB_ENV
            echo "UPLOAD_ERROR=$ERROR_MSG" >> $GITHUB_ENV
          fi
      - name: Edit Mirroring message
        run: |
          if [ "$UPLOAD_SUCCESS" = "true" ]; then
            LINK="$DRIVE_LINK"
            if [ -z "$LINK" ]; then
              LINK="https://drive.google.com/drive/folders/${{ secrets.GDRIVE_FOLDER_ID }}"
            fi
            curl -X POST "https://api.telegram.org/bot$KIRA_TOKEN/editMessageText" \
              -d "chat_id=${{ github.event.client_payload.chat_id }}" \
              -d "message_id=${{ github.event.client_payload.message_id }}" \
              -d "text=Mirror completed: $LINK"
          else
            RAW_ERROR="$UPLOAD_ERROR"
            if echo "$RAW_ERROR" | grep -qi "storage quota exceeded"; then
              MSG="Mirror failed: Google Drive storage quota exceeded. Please free up space."
            else
              TRUNCATED=$(echo "$RAW_ERROR" | head -c 800)
              MSG="Mirror failed: $TRUNCATED"
            fi
            curl -X POST "https://api.telegram.org/bot$KIRA_TOKEN/editMessageText" \
              -d "chat_id=${{ github.event.client_payload.chat_id }}" \
              -d "message_id=${{ github.event.client_payload.message_id }}" \
              -d "text=$MSG"
          fi
        env:
          UPLOAD_SUCCESS: ${{ env.UPLOAD_SUCCESS }}
          DRIVE_LINK: ${{ env.DRIVE_LINK }}
          UPLOAD_ERROR: ${{ env.UPLOAD_ERROR }}

  capture-frames:
    if: github.event_name == 'repository_dispatch' && github.event.action == 'capture-frames'
    runs-on: ubuntu-latest
    env:
      KIRA_TOKEN: ${{ secrets.KIRA_TOKEN }}
    steps:
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Download video
        run: |
          mkdir -p capture
          wget -O "capture/input.mp4" "${{ github.event.client_payload.video_url }}"
      - name: Extract 10 frames
        run: |
          DURATION=$(ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1:nokey=1 capture/input.mp4)
          # Calculate fps to get exactly 10 frames over the whole video
          FPS=$(echo "scale=6; 10 / $DURATION" | bc)
          ffmpeg -y -i capture/input.mp4 \
            -vf "fps=$FPS,scale=1280:trunc(ow/a/2)*2" \
            -q:v 2 \
            capture/frame_%02d.jpg
      - name: Send frames as media group
        run: |
          cd capture
          FRAMES=(frame_*.jpg)
          if [ ${#FRAMES[@]} -eq 0 ]; then
            echo "No frames extracted"
            exit 1
          fi
          # Build media JSON array
          MEDIA="["
          for i in "${!FRAMES[@]}"; do
            if [ $i -gt 0 ]; then MEDIA+=","; fi
            MEDIA+="{\"type\":\"photo\",\"media\":\"attach://frame$i\"}"
          done
          MEDIA+="]"

          # Build curl arguments in an array (safe quoting)
          CURL_ARGS=(-X POST "https://api.telegram.org/bot${KIRA_TOKEN}/sendMediaGroup")
          CURL_ARGS+=(-F "chat_id=${{ github.event.client_payload.chat_id }}")
          CURL_ARGS+=(-F "media=${MEDIA}")

          for i in "${!FRAMES[@]}"; do
            CURL_ARGS+=(-F "frame${i}=@${FRAMES[$i]}")
          done

          curl "${CURL_ARGS[@]}"
      - name: Delete progress message
        if: github.event.client_payload.progress_message_id != ''
        run: |
          curl -X POST "https://api.telegram.org/bot${{ secrets.KIRA_TOKEN }}/deleteMessage" \
            -d "chat_id=${{ github.event.client_payload.chat_id }}" \
            -d "message_id=${{ github.event.client_payload.progress_message_id }}"

  fetch-media-info:
    if: github.event_name == 'repository_dispatch' && github.event.action == 'fetch-media-info'
    runs-on: ubuntu-latest
    env:
      KIRA_TOKEN: ${{ secrets.KIRA_TOKEN }}
    steps:
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install yt-dlp and ffmpeg
        run: |
          pip install yt-dlp
          sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Fetch media info and send format buttons
        run: |
          echo "${{ secrets.YOUTUBE_COOKIES }}" > cookies.txt
          URL="${{ github.event.client_payload.url }}"
          CHAT_ID="${{ github.event.client_payload.chat_id }}"
          FETCH_MSG_ID="${{ github.event.client_payload.fetching_message_id }}"

          INFO=$(yt-dlp --cookies cookies.txt --js-runtimes node --remote-components ejs:github --dump-json "$URL")

          TITLE=$(echo "$INFO" | jq -r '.title // "Unknown"')
          DURATION=$(echo "$INFO" | jq -r '.duration_string // "?"')

          FORMATS=$(echo "$INFO" | jq -r '
            [.formats[] |
              select(.ext == "mp4" and .height != null and .filesize != null) |
              {
                format_id: .format_id,
                res: "\(.height)p",
                size_mb: ((.filesize / 1048576) | round),
                ext: .ext
              }
            ] | unique_by(.res) | sort_by(.height)
          ')

          FORMAT_LIST=$(echo "$FORMATS" | jq -r '.[] | "\(.res) (\(.size_mb)MB)"' 2>/dev/null || echo "")

          if [ -z "$FORMATS" ] || [ "$FORMATS" == "[]" ]; then
            KEYBOARD='[[{"text":"Best quality","callback_data":"dl_fmt_best_'"$URL"'"}]]'
            FORMAT_LIST="Best quality available"
          else
            KEYBOARD=$(echo "$FORMATS" | jq -r '
              [.[] | {
                text: "\(.res) (\(.size_mb)MB)",
                callback_data: "dl_fmt_\(.format_id)_\($URL)"
              }] | unique_by(.text) |
              reduce .[] as $item ([]; if length == 0 or (.[-1] | length) == 2 then . + [[$item]] else .[-1] += [$item] end)
            ' --arg URL "$URL")
          fi

          REPLY_MARKUP=$(jq -n --argjson keyboard "$KEYBOARD" '{inline_keyboard: $keyboard}')

          printf -v TEXT "Choose format for: %s (%s)\n%s" "$TITLE" "$DURATION" "$FORMAT_LIST"

          curl -X POST "https://api.telegram.org/bot$KIRA_TOKEN/deleteMessage" \
            -d "chat_id=$CHAT_ID" -d "message_id=$FETCH_MSG_ID"

          curl -X POST "https://api.telegram.org/bot$KIRA_TOKEN/sendMessage" \
            -d "chat_id=$CHAT_ID" \
            --data-urlencode "text=$TEXT" \
            -d "reply_markup=$REPLY_MARKUP"

  download-media:
    if: github.event_name == 'repository_dispatch' && github.event.action == 'download-media'
    runs-on: ubuntu-latest
    env:
      KIRA_TOKEN: ${{ secrets.KIRA_TOKEN }}
    steps:
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install yt-dlp, ffmpeg and rclone
        run: |
          pip install yt-dlp
          sudo apt-get update && sudo apt-get install -y ffmpeg rclone

      - name: Configure rclone
        run: |
          export TOKEN='${{ secrets.GDRIVE_TOKEN }}'
          mkdir -p ~/.config/rclone
          cat > ~/.config/rclone/rclone.conf << EOF
          [mirror_drive]
          type = drive
          scope = drive
          client_id = ${{ secrets.GDRIVE_CLIENT_ID }}
          client_secret = ${{ secrets.GDRIVE_CLIENT_SECRET }}
          token = $TOKEN
          root_folder_id = ${{ secrets.GDRIVE_FOLDER_ID }}
          EOF

      - name: Download with chosen format
        run: |
          echo "${{ secrets.YOUTUBE_COOKIES }}" > cookies.txt
          URL="${{ github.event.client_payload.url }}"
          FMT="${{ github.event.client_payload.format_id }}"
          mkdir -p downloads
          yt-dlp --cookies cookies.txt --js-runtimes node --remote-components ejs:github -f "$FMT" -o "downloads/%(title)s.%(ext)s" "$URL"
          echo "FILE=$(ls downloads)" >> $GITHUB_ENV

      - name: Check file size and deliver
        run: |
          FILE="downloads/${{ env.FILE }}"
          SIZE=$(stat -c%s "$FILE")
          CHAT_ID="${{ github.event.client_payload.chat_id }}"
          PROGRESS_MSG_ID="${{ github.event.client_payload.progress_message_id }}"

          if [ "$SIZE" -lt 50000000 ]; then
            curl -X POST "https://api.telegram.org/bot$KIRA_TOKEN/sendDocument" \
              -F "chat_id=$CHAT_ID" \
              -F "document=@$FILE" \
              -F "caption=Downloaded: ${{ env.FILE }}"
            curl -X POST "https://api.telegram.org/bot$KIRA_TOKEN/deleteMessage" \
              -d "chat_id=$CHAT_ID" -d "message_id=$PROGRESS_MSG_ID"
          else
            rclone copy "$FILE" mirror_drive: -P
            LINK=$(rclone link "mirror_drive:${{ env.FILE }}")
            curl -X POST "https://api.telegram.org/bot$KIRA_TOKEN/editMessageText" \
              -d "chat_id=$CHAT_ID" \
              -d "message_id=$PROGRESS_MSG_ID" \
              -d "text=Download complete: $LINK"
          fi

  restore-image:
    if: github.event_name == 'repository_dispatch' && github.event.action == 'restore-image'
    runs-on: ubuntu-latest
    env:
      KIRA_TOKEN: ${{ secrets.KIRA_TOKEN }}
    steps:
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y wget unzip

      - name: Download and run Real-ESRGAN, then send result
        run: |
          set -e
          CHAT_ID="${{ github.event.client_payload.chat_id }}"
          PROGRESS_MSG_ID="${{ github.event.client_payload.progress_message_id }}"
          IMAGE_URL="${{ github.event.client_payload.image_url }}"

          # Download Real-ESRGAN
          mkdir -p Real-ESRGAN
          cd Real-ESRGAN
          wget -q -O realesrgan-ncnn-vulkan-20220424-ubuntu.zip \
            "https://github.com/xinntao/Real-ESRGAN/releases/download/v0.2.5.0/realesrgan-ncnn-vulkan-20220424-ubuntu.zip"
          unzip -q realesrgan-ncnn-vulkan-20220424-ubuntu.zip
          chmod +x realesrgan-ncnn-vulkan

          # Download input image
          mkdir -p ../images
          cd ../images
          wget -q -O input.jpg "$IMAGE_URL"

          # Run restoration
          ../Real-ESRGAN/realesrgan-ncnn-vulkan -i input.jpg -o restored.jpg -s 4 -n realesrgan-x4plus || true

          # Send result
          if [ -f restored.jpg ]; then
            curl -s -X POST "https://api.telegram.org/bot$KIRA_TOKEN/sendDocument" \
              -F "chat_id=$CHAT_ID" \
              -F "document=@restored.jpg" \
              -F "caption=Restored image"
            curl -s -X POST "https://api.telegram.org/bot$KIRA_TOKEN/deleteMessage" \
              -d "chat_id=$CHAT_ID" -d "message_id=$PROGRESS_MSG_ID"
          else
            curl -s -X POST "https://api.telegram.org/bot$KIRA_TOKEN/editMessageText" \
              -d "chat_id=$CHAT_ID" \
              -d "message_id=$PROGRESS_MSG_ID" \
              -d "text=Restoration failed. The image may be too large or unsupported."
          fi

  enhance-image:
    if: github.event_name == 'repository_dispatch' && github.event.action == 'enhance-image'
    runs-on: ubuntu-latest
    env:
      KIRA_TOKEN: ${{ secrets.KIRA_TOKEN }}
    steps:
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Enhance and send result
        run: |
          set -e
          CHAT_ID="${{ github.event.client_payload.chat_id }}"
          PROGRESS_MSG_ID="${{ github.event.client_payload.progress_message_id }}"
          IMAGE_URL="${{ github.event.client_payload.image_url }}"

          mkdir -p images
          cd images
          wget -q -O input.jpg "$IMAGE_URL"

          ffmpeg -y -i input.jpg \
            -vf "unsharp=5:5:1.0:5:5:0.0,eq=contrast=1.1:brightness=0.05" \
            enhanced.jpg || true

          if [ -f enhanced.jpg ]; then
            curl -s -X POST "https://api.telegram.org/bot$KIRA_TOKEN/sendDocument" \
              -F "chat_id=$CHAT_ID" \
              -F "document=@enhanced.jpg" \
              -F "caption=Enhanced image"
            curl -s -X POST "https://api.telegram.org/bot$KIRA_TOKEN/deleteMessage" \
              -d "chat_id=$CHAT_ID" -d "message_id=$PROGRESS_MSG_ID"
          else
            curl -s -X POST "https://api.telegram.org/bot$KIRA_TOKEN/editMessageText" \
              -d "chat_id=$CHAT_ID" \
              -d "message_id=$PROGRESS_MSG_ID" \
              -d "text=Enhancement failed. The image may be too large or unsupported."
          fi

  check-reminders:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      KIRA_TOKEN: ${{ secrets.KIRA_TOKEN }}
    permissions:
      actions: write
      contents: read
    steps:
      - name: Check and send reminders
        run: |
          echo "Job started"
          set -ex
          NOW=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          echo "Current UTC: $NOW"

          RESPONSE=$(curl -sS -w "\n%{http_code}" -G \
            -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
            "$SUPABASE_URL/rest/v1/reminders" \
            --data-urlencode "select=id,chat_id,description" \
            --data-urlencode "remind_at=lte.$NOW")

          HTTP_CODE=$(echo "$RESPONSE" | tail -1)
          BODY=$(echo "$RESPONSE" | head -c -4)

          echo "HTTP status: $HTTP_CODE"
          echo "Response body: $BODY"

          if [ "$HTTP_CODE" -ne 200 ]; then
            echo "Failed to query Supabase"
            exit 1
          fi

          if [ -z "$BODY" ] || [ "$BODY" = "[]" ]; then
            echo "No reminders due."
            exit 0
          fi

          echo "$BODY" | jq -c '.[]' | while read -r reminder; do
            CHAT_ID=$(echo "$reminder" | jq -r '.chat_id')
            DESCRIPTION=$(echo "$reminder" | jq -r '.description')
            ID=$(echo "$reminder" | jq -r '.id')

            echo "Sending reminder $ID to $CHAT_ID: $DESCRIPTION"
            curl -sS -X POST "https://api.telegram.org/bot$KIRA_TOKEN/sendMessage" \
              -d "chat_id=$CHAT_ID" \
              -d "text=Reminder: $DESCRIPTION"

            echo "Deleting reminder $ID"
            curl -sS -X DELETE \
              -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
              -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
              "$SUPABASE_URL/rest/v1/reminders?id=eq.${ID}"
          done

      - name: Delete this workflow run
        if: success()
        run: |
          curl -X DELETE \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/runs/${{ github.run_id }}"

  cleanup-history:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    steps:
      - name: Delete workflow runs older than 3 days
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          THREE_DAYS_AGO=$(date -d "3 days ago" --utc +%Y-%m-%dT%H:%M:%SZ)
          page=1
          while true; do
            runs=$(gh api "repos/$REPO/actions/runs?per_page=100&page=$page" --jq ".workflow_runs[] | select(.created_at < \"$THREE_DAYS_AGO\") | .id")
            if [ -z "$runs" ]; then
              break
            fi
            for run_id in $runs; do
              gh api -X DELETE "repos/$REPO/actions/runs/$run_id" --silent
            done
            page=$((page + 1))
          done
