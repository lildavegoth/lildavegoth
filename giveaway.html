<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="color-scheme" content="dark">
    <title>Giveaway | lildavegoth</title>
    <script src="auth-check.js"></script>
    <script src="protections.js"></script>
    <script src="notification.cssjs"></script>
    <script src="ui-icons.js"></script>
    <link rel="stylesheet" href="media.css">
    <style>
        :root {
            --accent-color: #C1FC32;
            --accent-dark: #9bc726;
            --bg-black: #000000;
            --bg-dark: #1a1a1a;
            --bg-card: rgba(30, 30, 30, 0.7);
            --text-primary: #f5f5f7;
            --text-secondary: #a1a1a6;
            --radius-small: 12px;
            --radius-medium: 20px;
            --radius-large: 28px;
            --spacing-xs: 8px;
            --spacing-sm: 16px;
            --spacing-md: 24px;
            --spacing-lg: 32px;
            --spacing-xl: 48px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-black);
            color: var(--text-primary);
            min-height: 100vh;
            overflow-x: hidden;
            padding-bottom: 90px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: var(--spacing-md);
            position: relative;
            min-height: calc(100vh - 90px);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
        }

        .event-page {
            width: 100%;
            max-width: 400px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-top: 20px;
        }

        .artist-image-wrap {
            width: 100%;
            max-width: 400px;
            aspect-ratio: 1/1;
            border-radius: 50%;
            overflow: hidden;
            margin-bottom: 24px;
            border: 4px solid var(--bg-black);
        }

        .artist-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .event-card {
            width: 100%;
            background: var(--bg-dark);
            border-radius: var(--radius-large);
            padding: 32px 24px 24px;
            position: relative;
            z-index: 1;
            color: var(--text-primary);
        }

        .event-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 12px;
        }

        .event-title {
            font-size: 32px;
            font-weight: 900;
            color: #fff;
            letter-spacing: -0.5px;
            line-height: 1;
        }

        .event-badge {
            font-size: 14px;
            font-weight: 700;
            background: var(--accent-color);
            color: #000;
            border: none;
            border-radius: 20px;
            padding: 6px 16px;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        .event-details {
            display: flex;
            flex-direction: column;
            gap: 14px;
            padding-top: 4px;
        }

        .detail-row {
            display: flex;
            align-items: center;
            gap: 12px;
            color: #fff;
        }

        .detail-icon {
            width: 20px;
            height: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            color: var(--text-secondary);
            flex-shrink: 0;
        }

        .detail-text {
            font-size: 15px;
            font-weight: 500;
            color: #f5f5f7;
        }

        .tickets-btn {
            width: 100%;
            max-width: 400px;
            margin: 20px auto 0;
            background: var(--accent-color);
            border: none;
            border-radius: 50px;
            padding: 18px 24px;
            font-size: 20px;
            font-weight: 700;
            color: #000;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
            text-align: center;
            display: block;
        }

        .tickets-btn:active {
            transform: scale(0.98);
        }

        .tickets-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none !important;
        }

        .admin-only {
            display: none !important;
        }

        .admin-only.admin-visible {
            display: block !important;
        }

        .winner-display {
            background: var(--bg-card);
            border-radius: var(--radius-large);
            padding: var(--spacing-xl);
            margin-top: 20px;
            border: 2px solid rgba(193, 252, 50, 0.3);
            text-align: center;
            display: none;
            width: 100%;
            max-width: 400px;
        }

        .winner-display.active {
            display: block;
            animation: fadeIn 0.6s ease;
        }

        .winner-name {
            font-size: 3rem;
            font-weight: 700;
            margin-bottom: var(--spacing-md);
            color: var(--accent-color);
        }

        .invite-btn {
            background: #e0deda;
            border: none;
            border-radius: 20px;
            padding: 8px 20px;
            font-size: 13px;
            font-weight: 600;
            color: #555;
            cursor: pointer;
            transition: background 0.2s;
        }

        .invite-btn:hover {
            background: #d0ceca;
        }

        .invite-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .popup-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 1.0);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 99999999;
            animation: fadeIn 0.3s ease;
        }

        .popup-content {
            background: var(--bg-card);
            border-radius: var(--radius-large);
            width: 90%;
            max-width: 500px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
            max-height: 70vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .popup-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: var(--spacing-md);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .popup-header h2 {
            font-size: 1.5rem;
            font-weight: 600;
        }

        .close-popup {
            background: transparent;
            border: none;
            color: var(--text-secondary);
            font-size: 1.2rem;
            cursor: pointer;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .close-popup:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        .tools-grid {
            padding: var(--spacing-md);
            overflow-y: auto;
            flex: 1;
        }

        .popup-footer {
            padding: var(--spacing-md);
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            gap: var(--spacing-sm);
            justify-content: flex-end;
            background: var(--bg-card);
        }

        .admin-section {
            background: rgba(0, 0, 0, 0.3);
            border-radius: var(--radius-medium);
            padding: var(--spacing-md);
            margin-bottom: var(--spacing-md);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .admin-section h4 {
            color: var(--text-primary);
            margin-bottom: var(--spacing-sm);
            font-size: 1.1rem;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .status-buttons {
            display: flex;
            gap: 10px;
            margin-bottom: var(--spacing-md);
        }

        .status-btn {
            flex: 1;
            padding: 12px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: var(--radius-small);
            color: var(--text-secondary);
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            font-weight: 500;
        }

        .status-btn:hover {
            background: rgba(193, 252, 50, 0.1);
            border-color: rgba(193, 252, 50, 0.3);
        }

        .status-btn.active {
            background: var(--accent-color);
            color: var(--bg-black);
            border-color: var(--accent-color);
            font-weight: 600;
        }

        .admin-input {
            width: 100%;
            padding: 12px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: var(--radius-small);
            color: var(--text-primary);
            font-size: 1rem;
            margin-bottom: var(--spacing-sm);
            resize: none;
        }

        .admin-input:focus {
            outline: none;
            border-color: var(--accent-color);
            background: rgba(193, 252, 50, 0.05);
        }

        .admin-btn {
            width: 100%;
            padding: 14px;
            background: var(--accent-color);
            color: var(--bg-black);
            border: none;
            border-radius: var(--radius-medium);
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .admin-btn:hover {
            background: var(--accent-dark);
            transform: translateY(-2px);
        }

        .admin-btn.secondary {
            background: rgba(255, 255, 255, 0.05);
            color: var(--text-primary);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .admin-btn.secondary:hover {
            background: rgba(193, 252, 50, 0.1);
            border-color: rgba(193, 252, 50, 0.3);
        }

        .admin-btn.danger {
            background: rgba(255, 59, 48, 0.1);
            color: #ff3b30;
            border: 1px solid rgba(255, 59, 48, 0.3);
        }

        .admin-btn.danger:hover {
            background: rgba(255, 59, 48, 0.2);
        }

        .action-buttons-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 10px;
            margin-top: var(--spacing-md);
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        footer {
            margin-top: 40px;
            text-align: center;
            color: var(--text-secondary);
            font-size: 0.9rem;
        }

        @media (max-width: 480px) {
            .event-card {
                padding: 28px 20px 20px;
            }
            .event-title {
                font-size: 28px;
            }
            .tickets-btn {
                padding: 16px 20px;
                font-size: 18px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="event-page">
            <div class="artist-image-wrap">
                <img class="artist-image" src="https://raw.githubusercontent.com/lildavegoth/lildavegoth/refs/heads/homepage/pages/articles/images/kakoikiraku.webp" alt="Prize">
            </div>
            <div class="event-card">
                <div class="event-header">
                    <span class="event-title" id="prizeName">Kakoi Kiraku</span>
                    <span class="event-badge" id="giveawayBadge">GIVEAWAY</span>
                </div>
                <div class="event-details">
                    <div class="detail-row">
                        <span class="detail-icon"><i class="fas fa-users"></i></span>
                        <span class="detail-text">Participants: <span id="joinedCount">0</span></span>
                    </div>
                    <div class="detail-row">
                        <span class="detail-icon"><i class="fas fa-wifi-strong"></i></span>
                        <span class="detail-text">Status: <span id="statusText">ACTIVE</span></span>
                    </div>
                    <div class="detail-row">
                        <span class="detail-icon"><i class="fas fa-trophy"></i></span>
                        <span class="detail-text">Max: <span id="maxParticipants">1000</span></span>
                    </div>
                </div>
                <div style="margin-top: 20px; text-align: center;">
                    <button id="startButton" class="invite-btn admin-only" style="background: var(--accent-color); color: black; font-weight: 600;"><i class="fas fa-play"></i> Start Selection</button>
                </div>
            </div>
            <button id="joinButton" class="tickets-btn">Join Giveaway</button>
            <button id="adminPanelButton" class="tickets-btn admin-only" style="background: rgba(255,255,255,0.1); color: white; margin-top: 12px;">Admin Panel</button>
            <div id="winnerDisplay" class="winner-display">
                <div style="color: var(--text-secondary); font-size: 1rem; margin-bottom: var(--spacing-sm);"><i class="fas fa-trophy"></i> CONGRATULATIONS TO OUR WINNER! <i class="fas fa-trophy"></i></div>
                <div class="winner-name" id="winnerName">Loading...</div>
                <div style="color: var(--text-secondary); font-size: 1rem; margin-bottom: var(--spacing-md);" id="winnerDetails">Selected from all participants</div>
                <button id="selectAgainButton" class="invite-btn" style="background: rgba(255,255,255,0.1); color: white;"><i class="fas fa-redo"></i> Select Again</button>
            </div>
        </div>
        <footer>
            <div class="social-links">
                <a href="https://twitter.com/lildavegoth"><span class="icon icon-twitter"></span></a>
                <a href="https://instagram.com/dave_goth"><span class="icon icon-instagram"></span></a>
            </div>
            <p>© 2026 lildavegoth | Giveaways</p>
            <p style="margin-top: 8px; font-size: 0.8rem; color: #666;">Conveys the Idea of a Protected and Inspiring Space for Creative Expression.</p>
        </footer>
    </div>

    <div id="universalPopup" class="popup-overlay" style="display: none;">
        <div class="popup-content">
            <div class="popup-header">
                <h2 id="popupTitle">Admin Controls</h2>
                <button class="close-popup" onclick="closeUniversalPopup()"><i class="fas fa-times"></i></button>
            </div>
            <div class="tools-grid" id="popupContent"></div>
            <div class="popup-footer">
                <button class="action-button secondary" id="popupCancelBtn">Cancel</button>
                <button class="action-button" id="popupConfirmBtn">Confirm</button>
            </div>
        </div>
    </div>

    <script>
        const GOOGLE_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxF5622f2vQnNfE2EbmkuEOVWLNSQasMdnN1pjtGsd3FtRhXp7L7nb4PvX1VIj2aAeU/exec';

        let giveawayParticipants = [];
        let giveawaySettings = {
            status: 'active',
            prize: 'Kakoi Kiraku',
            maxParticipants: 1000
        };
        let currentUser = null;
        let isOnline = true;
        let isAdmin = false;
        let adminIds = [];

        async function initGiveaway() {
            currentUser = window.authCheck ? window.authCheck.getCurrentUser() : null;
            await testConnection();
            await loadGiveawaySettings();
            await loadParticipants();
            await loadAdmins();
            checkAdminStatus();
            updateUI();
            setupEventListeners();
            setInterval(() => {
                loadGiveawaySettings();
                loadParticipants();
                loadAdmins();
            }, 10000);
        }

        async function testConnection() {
            try {
                const response = await fetch(`${GOOGLE_SCRIPT_URL}?action=test&t=${Date.now()}`);
                if (response.ok) {
                    isOnline = true;
                    window.showMessage('Connected to giveaway server');
                }
            } catch (error) {
                isOnline = false;
                window.showMessage('Offline');
            }
        }

        async function loadGiveawaySettings() {
            try {
                const response = await fetch(`${GOOGLE_SCRIPT_URL}?action=getSettings&t=${Date.now()}`);
                if (response.ok) {
                    const data = await response.json();
                    if (data.success) {
                        giveawaySettings = data.settings;
                        updateGiveawayDisplay();
                        localStorage.setItem('giveaway_settings', JSON.stringify(giveawaySettings));
                    }
                }
            } catch (error) {
                const cached = localStorage.getItem('giveaway_settings');
                if (cached) {
                    giveawaySettings = JSON.parse(cached);
                    updateGiveawayDisplay();
                }
            }
        }

        async function loadParticipants() {
            try {
                const response = await fetch(`${GOOGLE_SCRIPT_URL}?action=getParticipants&t=${Date.now()}`);
                if (response.ok) {
                    const data = await response.json();
                    if (data.success) {
                        giveawayParticipants = data.participants || [];
                        updateParticipantCount();
                        localStorage.setItem('giveaway_participants', JSON.stringify(giveawayParticipants));
                    }
                }
            } catch (error) {
                const cached = localStorage.getItem('giveaway_participants');
                if (cached) {
                    giveawayParticipants = JSON.parse(cached);
                    updateParticipantCount();
                }
            }
        }

        async function loadAdmins() {
            try {
                const response = await fetch(`${GOOGLE_SCRIPT_URL}?action=getAdmins&t=${Date.now()}`);
                if (response.ok) {
                    const data = await response.json();
                    if (data.success) {
                        adminIds = data.admins || [];
                        localStorage.setItem('giveaway_admins', JSON.stringify(adminIds));
                    }
                }
            } catch (error) {
                const cached = localStorage.getItem('giveaway_admins');
                if (cached) {
                    adminIds = JSON.parse(cached);
                }
            }
            checkAdminStatus();
            updateUI();
        }

        function updateGiveawayDisplay() {
            const prizeName = document.getElementById('prizeName');
            const statusText = document.getElementById('statusText');
            const badge = document.getElementById('giveawayBadge');
            const maxEl = document.getElementById('maxParticipants');

            if (prizeName) prizeName.textContent = giveawaySettings.prize;
            if (maxEl) maxEl.textContent = giveawaySettings.maxParticipants;

            if (statusText) {
                statusText.textContent = giveawaySettings.status.toUpperCase();
            }

            if (badge) {
                badge.textContent = giveawaySettings.status === 'active' ? 'ACTIVE' : 'PAUSED';
                badge.style.borderColor = 'var(--accent-color)';
                badge.style.color = 'var(--accent-color)';
            }

            const joinButton = document.getElementById('joinButton');
            if (joinButton) {
                if (giveawaySettings.status === 'inactive') {
                    joinButton.disabled = true;
                    joinButton.style.opacity = '0.5';
                    joinButton.innerHTML = '<i class="fas fa-pause"></i> Giveaway Paused';
                } else {
                    if (!giveawayParticipants.some(p => p.id === currentUser?.id)) {
                        joinButton.disabled = false;
                        joinButton.style.opacity = '1';
                        joinButton.innerHTML = '<i class="fas fa-ticket-alt"></i> Join Giveaway';
                        joinButton.style.background = 'var(--accent-color)';
                    }
                }
            }
        }

        function updateParticipantCount() {
            const joinedCount = document.getElementById('joinedCount');
            if (joinedCount) {
                const count = giveawayParticipants.length;
                joinedCount.textContent = count;
                if (count >= giveawaySettings.maxParticipants * 0.9) {
                    joinedCount.style.color = '#ff3b30';
                } else {
                    joinedCount.style.color = '';
                }
            }
        }

        function updateUI() {
            const joinButton = document.getElementById('joinButton');
            const startButton = document.getElementById('startButton');
            const adminPanelBtn = document.getElementById('adminPanelButton');

            if (!currentUser) {
                joinButton.innerHTML = '<i class="fas fa-sign-in-alt"></i> Sign In to Join';
                joinButton.disabled = false;
                if (startButton) startButton.disabled = true;
                if (adminPanelBtn) adminPanelBtn.classList.remove('admin-visible');
                return;
            }

            const hasJoined = giveawayParticipants.some(p => p.id === currentUser.id);

            if (hasJoined) {
                joinButton.innerHTML = 'Already Joined';
                joinButton.disabled = true;
                joinButton.style.background = 'rgba(255, 255, 255, 0.05)';
                joinButton.style.color = '#fff';
            } else if (giveawaySettings.status === 'active') {
                joinButton.innerHTML = '<i class="fas fa-ticket-alt"></i> Join Giveaway';
                joinButton.disabled = false;
                joinButton.style.background = 'var(--accent-color)';
                joinButton.style.color = '#000';
            }

            if (isAdmin && startButton) {
                startButton.classList.add('admin-visible');
                startButton.disabled = false;
                startButton.innerHTML = '<i class="fas fa-play"></i> Start Selection';
            } else if (startButton) {
                startButton.classList.remove('admin-visible');
                startButton.disabled = true;
            }

            if (isAdmin && adminPanelBtn) {
                adminPanelBtn.classList.add('admin-visible');
            } else if (adminPanelBtn) {
                adminPanelBtn.classList.remove('admin-visible');
            }
        }

        function checkAdminStatus() {
            isAdmin = currentUser && adminIds.includes(currentUser.id);
        }

        async function joinGiveaway() {
            if (!currentUser) {
                if (window.authCheck && window.authCheck.showSignInNotification) {
                    window.authCheck.showSignInNotification();
                }
                setTimeout(() => window.location.href = 'account.html', 1500);
                return;
            }

            if (giveawaySettings.status === 'inactive') {
                window.showMessage('No Giveaway available for now');
                return;
            }

            if (giveawayParticipants.length >= giveawaySettings.maxParticipants) {
                window.showMessage('Maximum participants reached');
                return;
            }

            const alreadyJoined = giveawayParticipants.some(p => p.id === currentUser.id);
            if (alreadyJoined) {
                window.showMessage('You already joined');
                return;
            }

            const participant = {
                id: currentUser.id,
                username: currentUser.username || 'Anonymous',
                email: currentUser.email || '',
                joinedAt: new Date().toISOString(),
                timestamp: Date.now()
            };

            try {
                const url = `${GOOGLE_SCRIPT_URL}?action=addParticipant&data=${encodeURIComponent(JSON.stringify(participant))}`;
                const response = await fetch(url);
                const result = await response.json();

                if (result.success) {
                    giveawayParticipants.push(participant);
                    updateParticipantCount();
                    updateUI();
                    window.showMessage('You are now in the giveaway');
                } else {
                    window.showMessage('Error', result.message || 'Join failed');
                }
            } catch (error) {
                window.showMessage('Saved locally, will sync later');
                giveawayParticipants.push(participant);
                localStorage.setItem('giveaway_participants', JSON.stringify(giveawayParticipants));
                updateParticipantCount();
                updateUI();
            }
        }

        function selectWinner() {
            if (!isAdmin) {
                window.showMessage('Only admin can select winner');
                return;
            }

            if (giveawayParticipants.length === 0) {
                window.showMessage('No one joined yet');
                return;
            }

            const startButton = document.getElementById('startButton');
            const winnerDisplay = document.getElementById('winnerDisplay');
            const winnerName = document.getElementById('winnerName');
            const winnerDetails = document.getElementById('winnerDetails');

            startButton.disabled = true;
            startButton.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Selecting...';

            let count = 0;
            const maxCount = 8;
            const interval = setInterval(() => {
                const randomIndex = Math.floor(Math.random() * giveawayParticipants.length);
                winnerName.textContent = giveawayParticipants[randomIndex].username;
                if (++count >= maxCount) {
                    clearInterval(interval);
                    const winnerIndex = Math.floor(Math.random() * giveawayParticipants.length);
                    const winner = giveawayParticipants[winnerIndex];
                    setTimeout(() => {
                        winnerName.textContent = winner.username;
                        winnerDetails.textContent = `ID: ${winner.id} - Selected from ${giveawayParticipants.length} participants`;
                        winnerDisplay.classList.add('active');
                        startButton.disabled = false;
                        startButton.innerHTML = '<i class="fas fa-play"></i> Start Selection';
                        localStorage.setItem('lastGiveawayWinner', JSON.stringify({
                            ...winner,
                            selectedAt: new Date().toISOString()
                        }));
                        winnerDisplay.scrollIntoView({ behavior: 'smooth' });
                    }, 500);
                }
            }, 200);
        }

        async function updateSetting(field, value) {
            try {
                const url = `${GOOGLE_SCRIPT_URL}?action=updateSettings&field=${field}&value=${encodeURIComponent(value)}`;
                const response = await fetch(url);
                const result = await response.json();
                if (result.success) {
                    giveawaySettings[field] = value;
                    updateGiveawayDisplay();
                    window.showMessage(`${field} set to ${value}`);
                    localStorage.setItem('giveaway_settings', JSON.stringify(giveawaySettings));
                    if (document.getElementById('universalPopup').style.display === 'flex') {
                        refreshAdminPopup();
                    }
                }
            } catch (error) {
                window.showMessage('Failed to update');
            }
        }

        async function clearAllParticipants() {
            try {
                const response = await fetch(`${GOOGLE_SCRIPT_URL}?action=clearParticipants`);
                const result = await response.json();
                if (result.success) {
                    giveawayParticipants = [];
                    updateParticipantCount();
                    localStorage.removeItem('giveaway_participants');
                    window.showMessage('All participants cleared');
                    if (document.getElementById('universalPopup').style.display === 'flex') {
                        refreshAdminPopup();
                    }
                }
            } catch (error) {
                window.showMessage('Failed to clear');
            }
        }

        function openPopup(type) {
            const popup = document.getElementById('universalPopup');
            const title = document.getElementById('popupTitle');
            const content = document.getElementById('popupContent');

            if (type === 'admin') {
                title.textContent = 'Admin Controls';
                renderAdminContent(content);
            }

            popup.style.display = 'flex';
        }

        function renderAdminContent(container) {
            let html = `
                <div class="admin-section">
                    <h4><i class="fas fa-power-off"></i> Giveaway Status</h4>
                    <div class="status-buttons">
                        <button class="status-btn ${giveawaySettings.status === 'active' ? 'active' : ''}" data-status="active"><i class="fas fa-play"></i> Active</button>
                        <button class="status-btn ${giveawaySettings.status === 'inactive' ? 'active' : ''}" data-status="inactive"><i class="fas fa-pause"></i> Inactive</button>
                    </div>
                </div>
                <div class="admin-section">
                    <h4><i class="fas fa-gift"></i> Prize Settings</h4>
                    <input type="text" class="admin-input" id="adminPrizeInput" value="${escapeHtml(giveawaySettings.prize)}" placeholder="Prize Name">
                    <button class="admin-btn" id="savePrizeBtn"><i class="fas fa-save"></i> Update Prize</button>
                </div>
                <div class="admin-section">
                    <h4><i class="fas fa-users"></i> Participants Limit</h4>
                    <input type="number" class="admin-input" id="adminMaxInput" value="${giveawaySettings.maxParticipants}" placeholder="Max Participants">
                    <button class="admin-btn" id="saveMaxBtn"><i class="fas fa-save"></i> Update Limit</button>
                </div>
                <div class="admin-section">
                    <h4><i class="fas fa-bolt"></i> Quick Actions</h4>
                    <div class="action-buttons-grid">
                        <button class="admin-btn secondary" id="refreshAdminBtn"><i class="fas fa-sync"></i> Refresh Data</button>
                        <button class="admin-btn danger" id="clearParticipantsAdminBtn"><i class="fas fa-trash"></i> Clear All</button>
                    </div>
                </div>
            `;
            container.innerHTML = html;

            document.querySelectorAll('.status-btn').forEach(btn => {
                btn.addEventListener('click', async function() {
                    const status = this.getAttribute('data-status');
                    await updateSetting('status', status);
                    refreshAdminPopup();
                });
            });

            const savePrize = document.getElementById('savePrizeBtn');
            if (savePrize) {
                savePrize.addEventListener('click', async () => {
                    const newPrize = document.getElementById('adminPrizeInput').value.trim();
                    if (newPrize) {
                        await updateSetting('prize', newPrize);
                        refreshAdminPopup();
                    }
                });
            }

            const saveMax = document.getElementById('saveMaxBtn');
            if (saveMax) {
                saveMax.addEventListener('click', async () => {
                    const newMax = parseInt(document.getElementById('adminMaxInput').value);
                    if (newMax > 0) {
                        await updateSetting('maxParticipants', newMax);
                        refreshAdminPopup();
                    }
                });
            }

            const clearBtn = document.getElementById('clearParticipantsAdminBtn');
            if (clearBtn) {
                clearBtn.addEventListener('click', async () => {
                    if (confirm('Clear ALL participants? This cannot be undone!')) {
                        await clearAllParticipants();
                        refreshAdminPopup();
                    }
                });
            }

            const refreshBtn = document.getElementById('refreshAdminBtn');
            if (refreshBtn) {
                refreshBtn.addEventListener('click', async () => {
                    await loadGiveawaySettings();
                    await loadParticipants();
                    await loadAdmins();
                    window.showMessage('Data updated');
                    refreshAdminPopup();
                });
            }
        }

        function refreshAdminPopup() {
            const popup = document.getElementById('universalPopup');
            if (popup && popup.style.display === 'flex') {
                const content = document.getElementById('popupContent');
                renderAdminContent(content);
            }
        }

        function closeUniversalPopup() {
            document.getElementById('universalPopup').style.display = 'none';
        }

        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/[&<>]/g, function(m) {
                if (m === '&') return '&amp;';
                if (m === '<') return '&lt;';
                if (m === '>') return '&gt;';
                return m;
            });
        }

        function setupEventListeners() {
            const joinButton = document.getElementById('joinButton');
            const startButton = document.getElementById('startButton');
            const selectAgainButton = document.getElementById('selectAgainButton');
            const adminPanelBtn = document.getElementById('adminPanelButton');
            const popupOverlay = document.getElementById('universalPopup');
            const cancelBtn = document.getElementById('popupCancelBtn');
            const confirmBtn = document.getElementById('popupConfirmBtn');

            if (joinButton) {
                joinButton.addEventListener('click', function() {
                    joinGiveaway();
                    joinButton.classList.add('btnMDYE');
                    setTimeout(() => joinButton.classList.remove('btnMDYE'), 500);
                });
            }
            if (startButton) startButton.addEventListener('click', selectWinner);
            if (selectAgainButton) selectAgainButton.addEventListener('click', () => {
                const winnerDisplay = document.getElementById('winnerDisplay');
                if (winnerDisplay) winnerDisplay.classList.remove('active');
            });
            if (adminPanelBtn) {
                adminPanelBtn.addEventListener('click', function() {
                    openPopup('admin');
                    adminPanelBtn.classList.add('btnMDYE');
                    setTimeout(() => adminPanelBtn.classList.remove('btnMDYE'), 500);
                });
            }

            if (cancelBtn) cancelBtn.addEventListener('click', closeUniversalPopup);
            if (confirmBtn) confirmBtn.addEventListener('click', async () => {
                const prizeInput = document.getElementById('adminPrizeInput');
                const maxInput = document.getElementById('adminMaxInput');
                if (prizeInput) {
                    const newPrize = prizeInput.value.trim();
                    if (newPrize && newPrize !== giveawaySettings.prize) {
                        await updateSetting('prize', newPrize);
                    }
                }
                if (maxInput) {
                    const newMax = parseInt(maxInput.value);
                    if (newMax > 0 && newMax !== giveawaySettings.maxParticipants) {
                        await updateSetting('maxParticipants', newMax);
                    }
                }
                closeUniversalPopup();
            });

            if (popupOverlay) {
                popupOverlay.addEventListener('click', (e) => {
                    if (e.target === popupOverlay) closeUniversalPopup();
                });
            }
        }

        document.addEventListener('DOMContentLoaded', initGiveaway);
    </script>
</body>
</html>
