<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>GitHub Publisher | lildavegoth</title>
    <meta name="color-scheme" content="dark">
    <script src="../protections.js"></script>
    <script src="../notification.cssjs"></script>
    <link rel="stylesheet" href="../media.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root {
            --accent-color: #C1FC32;
            --accent-dark: #9bc726;
            --bg-black: #000000;
            --bg-dark: #1a1a1a;
            --bg-card: rgba(30, 30, 30, 0.7);
            --text-primary: #f5f5f7;
            --text-secondary: #a1a1a6;
            --radius-small: 12px;
            --radius-medium: 20px;
            --radius-large: 28px;
            --spacing-xs: 8px;
            --spacing-sm: 16px;
            --spacing-md: 24px;
            --spacing-lg: 32px;
            --spacing-xl: 48px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-black);
            color: var(--text-primary);
            min-height: 100vh;
            overflow-x: hidden;
            padding-bottom: 90px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: var(--spacing-md);
            position: relative;
            min-height: calc(100vh - 90px);
        }

        .config-panel {
            background: var(--bg-card);
            border-radius: var(--radius-large);
            padding: var(--spacing-lg);
            margin-bottom: var(--spacing-lg);
            border: 1px solid rgba(255, 255, 255, 0.05);
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: var(--spacing-sm);
        }

        .config-panel input {
            width: 100%;
            padding: 10px 14px;
            border-radius: var(--radius-medium);
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: var(--text-primary);
            font-size: 0.9rem;
            outline: none;
        }

        .config-panel button {
            grid-column: span 2;
            background: var(--accent-color);
            color: #000;
            border: none;
            border-radius: var(--radius-medium);
            padding: 12px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }

        .config-panel button:hover {
            background: var(--accent-dark);
        }

        .search-container {
            margin-bottom: var(--spacing-md);
            position: relative;
        }

        .search-container input {
            width: 100%;
            padding: 12px 44px 12px 16px;
            border-radius: var(--radius-medium);
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: var(--text-primary);
            font-size: 0.95rem;
            outline: none;
        }

        .search-suggestions {
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            background: var(--bg-card);
            border-radius: var(--radius-medium);
            border: 1px solid rgba(255, 255, 255, 0.1);
            margin-top: 8px;
            max-height: 300px;
            overflow-y: auto;
            z-index: 1000;
            display: none;
            backdrop-filter: saturate(180%) blur(20px);
            -webkit-backdrop-filter: saturate(180%) blur(20px);
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        .search-suggestion-item {
            padding: 12px 16px;
            cursor: pointer;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            transition: all 0.2s ease;
        }

        .search-suggestion-item:hover {
            background: rgba(193, 252, 50, 0.1);
        }

        .search-suggestion-item:last-child {
            border-bottom: none;
        }

        .suggestion-title {
            font-weight: 500;
            margin-bottom: 4px;
            color: var(--text-primary);
        }

        .suggestion-description {
            font-size: 0.85rem;
            color: var(--text-secondary);
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .suggestion-category {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 12px;
            font-size: 0.7rem;
            margin-top: 4px;
            background: rgba(193, 252, 50, 0.1);
            color: var(--accent-color);
        }

        .search-suggestions::-webkit-scrollbar {
            display: none;
        }

        .files-section {
            display: grid;
            grid-template-columns: 1fr;
            gap: var(--spacing-sm);
            margin-bottom: var(--spacing-lg);
        }

        .file-card {
            background: var(--bg-card);
            border-radius: var(--radius-medium);
            padding: var(--spacing-md);
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            border: 1px solid rgba(255, 255, 255, 0.05);
            transition: border-color 0.2s;
        }

        .file-card.selected {
            border-color: var(--accent-color);
            background: rgba(193, 252, 50, 0.05);
        }

        .file-name {
            font-weight: 500;
            word-break: break-all;
        }

        .file-date {
            color: var(--text-secondary);
            font-size: 0.85rem;
            white-space: nowrap;
            margin-left: var(--spacing-sm);
        }

        .action-panel {
            background: var(--bg-card);
            border-radius: var(--radius-large);
            padding: var(--spacing-lg);
            border: 1px solid rgba(255, 255, 255, 0.05);
            display: flex;
            flex-direction: column;
            gap: var(--spacing-md);
        }

        .selected-path {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: var(--radius-medium);
            padding: 12px 16px;
            color: var(--text-primary);
            font-size: 0.9rem;
            word-break: break-all;
        }

        .file-picker-label {
            display: block;
            background: var(--bg-card);
            border: 1px dashed rgba(255, 255, 255, 0.2);
            border-radius: var(--radius-medium);
            padding: 14px;
            text-align: center;
            cursor: pointer;
            transition: border-color 0.2s;
        }

        .file-picker-label:hover {
            border-color: var(--accent-color);
        }

        .file-picker-label input {
            display: none;
        }

        .buttons-row {
            display: flex;
            gap: var(--spacing-sm);
        }

        .btn {
            padding: 12px 20px;
            border-radius: var(--radius-medium);
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            border: none;
            transition: opacity 0.2s;
            flex: 1;
        }

        .btn-publish {
            background: var(--accent-color);
            color: #000;
        }

        .btn-publish:hover {
            background: var(--accent-dark);
        }

        .btn-delete {
            background: #FF3B30;
            color: #fff;
        }

        .btn-delete:hover {
            background: #cc3028;
        }

        .btn:disabled {
            opacity: 0.4;
            pointer-events: none;
        }

        .loading-spinner {
            text-align: center;
            padding: var(--spacing-xl);
            color: var(--text-secondary);
        }
    </style>
</head>
<body>
    <div class="container">
        <h1 style="font-size: 2rem; font-weight: 700; margin-bottom: var(--spacing-md); color: var(--accent-color);">GitHub Publisher | lildavegoth</h1>

        <div class="config-panel">
            <input type="text" id="repoOwner" placeholder="Repository Owner">
            <input type="text" id="repoName" placeholder="Repository Name">
            <input type="text" id="branch" placeholder="Branch (main)" value="main">
            <input type="password" id="token" placeholder="GitHub Token (repo scope)">
            <button id="loadRepoBtn">Load Repository</button>
        </div>

        <div id="repoContent" style="display: none;">
            <div class="search-container">
                <div style="position: relative;">
                    <input type="text" id="globalSearch" placeholder="Search files...">
                    <div style="position: absolute; right: 12px; top: 50%; transform: translateY(-50%); color: var(--text-secondary); pointer-events: none;">
                        <i class="fas fa-search" style="color: var(--accent-color); margin-right: 5px;"></i>
                    </div>
                </div>
                <div class="search-suggestions" id="searchSuggestions"></div>
            </div>

            <div class="files-section" id="filesContainer"></div>

            <div class="action-panel">
                <div class="selected-path" id="selectedPathDisplay">No file selected</div>
                <label class="file-picker-label" id="filePickerLabel">
                    <i class="fas fa-cloud-upload-alt" style="margin-right: 8px; color: var(--accent-color);"></i> Choose a local file to replace
                    <input type="file" id="filePicker">
                </label>
                <div class="buttons-row">
                    <button class="btn btn-publish" id="publishBtn" disabled>Publish</button>
                    <button class="btn btn-delete" id="deleteBtn" disabled>Delete</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        let repoTree = [];
        let selectedItem = null;
        let localFileContent = null;

        const filesContainer = document.getElementById('filesContainer');
        const selectedPathDisplay = document.getElementById('selectedPathDisplay');
        const filePicker = document.getElementById('filePicker');
        const publishBtn = document.getElementById('publishBtn');
        const deleteBtn = document.getElementById('deleteBtn');

        document.getElementById('loadRepoBtn').addEventListener('click', loadRepository);
        filePicker.addEventListener('change', handleFileSelect);
        publishBtn.addEventListener('click', publishFile);
        deleteBtn.addEventListener('click', deleteFile);

        function getConfig() {
            return {
                owner: document.getElementById('repoOwner').value.trim(),
                repo: document.getElementById('repoName').value.trim(),
                branch: document.getElementById('branch').value.trim() || 'main',
                token: document.getElementById('token').value.trim()
            };
        }

        async function loadRepository() {
            const config = getConfig();
            if (!config.owner || !config.repo || !config.token) {
                window.showMessage('Error', 'Please fill in Owner, Repo, and Token.');
                return;
            }

            filesContainer.innerHTML = '<div class="loading-spinner"><i class="fas fa-spinner fa-spin"></i> Loading repository tree...</div>';
            document.getElementById('repoContent').style.display = 'block';
            clearSelection();

            try {
                const response = await fetch(`https://api.github.com/repos/${config.owner}/${config.repo}/git/trees/${config.branch}?recursive=1`, {
                    headers: { 'Authorization': `token ${config.token}`, 'Accept': 'application/vnd.github.v3+json' }
                });
                if (!response.ok) throw new Error('Failed to fetch tree: ' + response.statusText);
                const data = await response.json();
                repoTree = data.tree.filter(item => item.type === 'blob' || item.type === 'tree');
                await fetchDatesForAllItems(config);
                renderFileCards();
                setupSearch();
            } catch (error) {
                filesContainer.innerHTML = '';
                window.showMessage('Error', error.message);
            }
        }

        async function fetchDatesForAllItems(config) {
            const datePromises = repoTree.map(async (item, index) => {
                if (item.type === 'tree') {
                    item.lastDate = 'Folder';
                    return;
                }
                try {
                    const res = await fetch(`https://api.github.com/repos/${config.owner}/${config.repo}/commits?path=${encodeURIComponent(item.path)}&per_page=1`, {
                        headers: { 'Authorization': `token ${config.token}`, 'Accept': 'application/vnd.github.v3+json' }
                    });
                    if (!res.ok) throw new Error('Commit fetch failed');
                    const commits = await res.json();
                    if (commits.length > 0) {
                        const date = new Date(commits[0].commit.committer.date);
                        item.lastDate = date.toLocaleDateString('en-US', { weekday: 'short', day: 'numeric' });
                    } else {
                        item.lastDate = 'Unknown';
                    }
                } catch {
                    item.lastDate = 'N/A';
                }
            });
            await Promise.all(datePromises);
        }

        function renderFileCards() {
            filesContainer.innerHTML = '';
            repoTree.forEach(item => {
                const card = document.createElement('div');
                card.className = 'file-card';
                card.dataset.path = item.path;
                card.dataset.type = item.type;
                card.dataset.sha = item.sha;
                card.innerHTML = `
                    <span class="file-name"><i class="fas ${item.type === 'tree' ? 'fa-folder' : 'fa-file'}" style="margin-right: 8px; color: var(--accent-color);"></i>${item.path.split('/').pop()}</span>
                    <span class="file-date">${item.lastDate}</span>
                `;
                card.addEventListener('click', () => selectFileItem(item, card));
                filesContainer.appendChild(card);
            });
        }

        function selectFileItem(item, cardElement) {
            document.querySelectorAll('.file-card').forEach(c => c.classList.remove('selected'));
            cardElement.classList.add('selected');
            selectedItem = item;
            selectedPathDisplay.textContent = item.path;
            publishBtn.disabled = false;
            deleteBtn.disabled = false;
            localFileContent = null;
            filePicker.value = '';
        }

        function clearSelection() {
            selectedItem = null;
            selectedPathDisplay.textContent = 'No file selected';
            publishBtn.disabled = true;
            deleteBtn.disabled = true;
            localFileContent = null;
            filePicker.value = '';
        }

        function handleFileSelect(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (e) => {
                const base64 = e.target.result.split(',')[1];
                localFileContent = base64;
            };
            reader.readAsDataURL(file);
        }

        async function publishFile() {
            if (!selectedItem || !localFileContent) {
                window.showMessage('Error', 'Select a repository file and choose a local file.');
                return;
            }
            const config = getConfig();
            const commitMessage = formatCommitMessage('updated', selectedItem.path.split('/').pop());
            try {
                const body = {
                    message: commitMessage,
                    content: localFileContent,
                    sha: selectedItem.sha
                };
                const response = await fetch(`https://api.github.com/repos/${config.owner}/${config.repo}/contents/${selectedItem.path}`, {
                    method: 'PUT',
                    headers: {
                        'Authorization': `token ${config.token}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(body)
                });
                if (!response.ok) throw new Error('Publish failed: ' + response.statusText);
                window.showMessage('Success', `File published as "${commitMessage}"`);
                loadRepository();
            } catch (error) {
                window.showMessage('Error', error.message);
            }
        }

        async function deleteFile() {
            if (!selectedItem) return;
            const config = getConfig();
            if (selectedItem.type === 'tree') {
                if (!confirm(`Delete folder "${selectedItem.path}" and all its contents?`)) return;
                const filesToDelete = repoTree.filter(item => item.type === 'blob' && item.path.startsWith(selectedItem.path + '/'));
                try {
                    for (const file of filesToDelete) {
                        await fetch(`https://api.github.com/repos/${config.owner}/${config.repo}/contents/${file.path}`, {
                            method: 'DELETE',
                            headers: {
                                'Authorization': `token ${config.token}`,
                                'Content-Type': 'application/json'
                            },
                            body: JSON.stringify({
                                message: formatCommitMessage('deleted', file.path.split('/').pop()),
                                sha: file.sha
                            })
                        });
                    }
                    window.showMessage('Success', `Folder "${selectedItem.path}" deleted.`);
                } catch (error) {
                    window.showMessage('Error', 'Failed to delete folder: ' + error.message);
                }
            } else {
                if (!confirm(`Delete file "${selectedItem.path}"?`)) return;
                try {
                    const response = await fetch(`https://api.github.com/repos/${config.owner}/${config.repo}/contents/${selectedItem.path}`, {
                        method: 'DELETE',
                        headers: {
                            'Authorization': `token ${config.token}`,
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({
                            message: formatCommitMessage('deleted', selectedItem.path.split('/').pop()),
                            sha: selectedItem.sha
                        })
                    });
                    if (!response.ok) throw new Error('Delete failed: ' + response.statusText);
                    window.showMessage('Success', `File "${selectedItem.path}" deleted.`);
                } catch (error) {
                    window.showMessage('Error', error.message);
                }
            }
            loadRepository();
        }

        function formatCommitMessage(prefix, filename) {
            const nameWithoutExt = filename.replace(/\.[^/.]+$/, '');
            const words = nameWithoutExt.split('-').filter(w => w.length > 0);
            const capitalized = words.map(w => w.charAt(0).toUpperCase() + w.slice(1)).join(' ');
            return `${prefix} ${capitalized}`;
        }

        function setupSearch() {
            const searchInput = document.getElementById('globalSearch');
            const suggestionsContainer = document.getElementById('searchSuggestions');

            searchInput.addEventListener('input', function() {
                const term = this.value.trim().toLowerCase();
                if (!term) {
                    suggestionsContainer.style.display = 'none';
                    return;
                }
                const matching = repoTree.filter(item => item.path.toLowerCase().includes(term));
                if (matching.length === 0) {
                    suggestionsContainer.innerHTML = '<div class="search-suggestion-item"><div class="suggestion-title">No files found</div></div>';
                } else {
                    suggestionsContainer.innerHTML = matching.slice(0, 8).map(item => `
                        <div class="search-suggestion-item" data-path="${item.path}">
                            <div class="suggestion-title"><i class="fas ${item.type === 'tree' ? 'fa-folder' : 'fa-file'}" style="margin-right: 6px;"></i>${item.path.split('/').pop()}</div>
                            <div class="suggestion-description">${item.path}</div>
                            <div class="suggestion-category">${item.type === 'tree' ? 'Folder' : 'File'}</div>
                        </div>
                    `).join('');
                }
                suggestionsContainer.style.display = 'block';
            });

            suggestionsContainer.addEventListener('click', function(event) {
                const suggestionItem = event.target.closest('.search-suggestion-item');
                if (suggestionItem) {
                    const path = suggestionItem.dataset.path;
                    const targetItem = repoTree.find(item => item.path === path);
                    const card = document.querySelector(`.file-card[data-path="${CSS.escape(path)}"]`);
                    if (targetItem && card) {
                        selectFileItem(targetItem, card);
                        card.scrollIntoView({ behavior: 'smooth', block: 'center' });
                    }
                    suggestionsContainer.style.display = 'none';
                    searchInput.value = targetItem ? targetItem.path.split('/').pop() : '';
                }
            });

            searchInput.addEventListener('keypress', function(event) {
                if (event.key === 'Enter') {
                    suggestionsContainer.style.display = 'none';
                    const term = searchInput.value.trim().toLowerCase();
                    const match = repoTree.find(item => item.path.toLowerCase().includes(term));
                    if (match) {
                        const card = document.querySelector(`.file-card[data-path="${CSS.escape(match.path)}"]`);
                        if (card) {
                            selectFileItem(match, card);
                            card.scrollIntoView({ behavior: 'smooth', block: 'center' });
                        }
                    }
                }
            });

            document.addEventListener('click', function(event) {
                if (!searchInput.contains(event.target) && !suggestionsContainer.contains(event.target)) {
                    suggestionsContainer.style.display = 'none';
                }
            });

            document.addEventListener('keydown', function(event) {
                if (event.key === 'Escape') {
                    suggestionsContainer.style.display = 'none';
                }
            });
        }
    </script>
</body>
</html>
