<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="color-scheme" content="dark">
    <title>GitHub Publisher | lildavegoth</title>
    <script src="../protections.js"></script>
    <script src="../notification.cssjs"></script>
    <link rel="stylesheet" href="../media.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root {
            --accent-color: #C1FC32;
            --accent-dark: #9bc726;
            --bg-black: #000000;
            --bg-dark: #1a1a1a;
            --bg-card: rgba(30, 30, 30, 0.7);
            --text-primary: #f5f5f7;
            --text-secondary: #a1a1a6;
            --radius-small: 12px;
            --radius-medium: 20px;
            --radius-large: 28px;
            --spacing-xs: 8px;
            --spacing-sm: 16px;
            --spacing-md: 24px;
            --spacing-lg: 32px;
            --spacing-xl: 48px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-black);
            color: var(--text-primary);
            min-height: 100vh;
            overflow-x: hidden;
            padding-bottom: 90px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: var(--spacing-md);
            position: relative;
            min-height: calc(100vh - 90px);
        }

        .login-panel {
            background: var(--bg-card);
            border-radius: var(--radius-large);
            padding: var(--spacing-lg);
            margin-bottom: var(--spacing-lg);
            border: 1px solid rgba(255, 255, 255, 0.05);
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: var(--spacing-sm);
        }

        .login-panel input {
            width: 100%;
            padding: 10px 14px;
            border-radius: var(--radius-medium);
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: var(--text-primary);
            font-size: 0.9rem;
            outline: none;
        }

        .login-panel button {
            grid-column: span 2;
            background: var(--accent-color);
            color: #000;
            border: none;
            border-radius: var(--radius-medium);
            padding: 12px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }

        .login-panel button:hover {
            background: var(--accent-dark);
        }

        .btn-icon {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: var(--text-primary);
            width: 42px;
            height: 42px;
            border-radius: var(--radius-medium);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 1.2rem;
            transition: background 0.2s;
        }

        .btn-icon:hover {
            background: rgba(193, 252, 50, 0.1);
        }

        .breadcrumb {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: var(--spacing-xs);
            margin-bottom: var(--spacing-md);
            padding: var(--spacing-sm);
            background: var(--bg-card);
            border-radius: var(--radius-medium);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .breadcrumb-item {
            cursor: pointer;
            color: var(--accent-color);
            font-weight: 500;
            padding: 4px 8px;
            border-radius: var(--radius-small);
            transition: background 0.2s;
        }

        .breadcrumb-item:hover {
            background: rgba(193, 252, 50, 0.1);
        }

        .breadcrumb-separator {
            color: var(--text-secondary);
        }

        .files-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: var(--spacing-xs);
        }

        .file-card {
            background: var(--bg-card);
            border-radius: var(--radius-medium);
            padding: var(--spacing-sm) var(--spacing-md);
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            border: 1px solid rgba(255, 255, 255, 0.05);
            transition: border-color 0.2s;
            user-select: none;
        }

        .file-card.folder-item {
            font-weight: 500;
        }

        .file-name {
            display: flex;
            align-items: center;
            gap: var(--spacing-xs);
            word-break: break-all;
        }

        .file-date {
            color: var(--text-secondary);
            font-size: 0.85rem;
            white-space: nowrap;
            margin-left: var(--spacing-sm);
        }

        .fab {
            position: fixed;
            bottom: 30px;
            right: 30px;
            width: 56px;
            height: 56px;
            background: var(--accent-color);
            color: #000;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            cursor: pointer;
            border: none;
            z-index: 999;
            transition: transform 0.2s;
        }

        .fab:active {
            transform: scale(0.95);
        }

        .popup-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 1.0);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 99999999;
            animation: fadeIn 0.3s ease;
        }

        .popup-content {
            background: var(--bg-card);
            border-radius: var(--radius-large);
            width: 90%;
            max-width: 500px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            max-height: 70vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .popup-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: var(--spacing-md);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .popup-header h2 {
            font-size: 1.5rem;
            font-weight: 600;
        }

        .close-popup {
            background: transparent;
            border: none;
            color: var(--text-secondary);
            font-size: 1.2rem;
            cursor: pointer;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .popup-body {
            padding: var(--spacing-md);
            display: flex;
            flex-direction: column;
            gap: var(--spacing-md);
            flex: 1;
        }

        .popup-footer {
            padding: var(--spacing-md);
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            gap: var(--spacing-sm);
            justify-content: flex-end;
        }

        .context-menu {
            position: fixed;
            background: #1a1a1a;
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: var(--radius-medium);
            padding: var(--spacing-xs) 0;
            min-width: 160px;
            z-index: 10000;
            display: none;
            flex-direction: column;
            overflow: hidden;
        }

        .context-menu button {
            background: transparent;
            border: none;
            color: var(--text-primary);
            padding: 12px 16px;
            text-align: left;
            font-size: 0.9rem;
            cursor: pointer;
            transition: background 0.2s;
            display: flex;
            align-items: center;
            gap: 10px;
            width: 100%;
        }

        .context-menu button:hover {
            background: rgba(255, 255, 255, 0.05);
        }

        .context-menu button i {
            width: 20px;
        }

        .popup-input {
            width: 100%;
            padding: 12px;
            border-radius: var(--radius-medium);
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: var(--text-primary);
            font-size: 0.95rem;
            outline: none;
        }

        .popup-input:focus {
            border-color: var(--accent-color);
        }

        .btn-cancel {
            background: #C42833;
            color: white;
            border: none;
            border-radius: var(--radius-medium);
            padding: 12px 20px;
            font-weight: 600;
            cursor: pointer;
            flex: 1;
        }

        .btn-yes {
            background: var(--accent-color);
            color: black;
            border: none;
            border-radius: var(--radius-medium);
            padding: 12px 20px;
            font-weight: 600;
            cursor: pointer;
            flex: 1;
        }

        .settings-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: var(--text-primary);
            width: 100%;
            padding: 14px;
            border-radius: var(--radius-small);
            font-size: 0.95rem;
            cursor: pointer;
            transition: background 0.2s;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .settings-btn i {
            width: 20px;
        }

        .settings-btn.btn-refresh {
            background: var(--accent-color);
            color: #000;
            border: none;
        }

        .settings-btn.btn-logout {
            background: #C42833;
            color: white;
            border: none;
        }
        
        #addNewFileBtn,
        #addNewFolderBtn {
            width: 100%;
            justify-content: center;
        }
        
        .btn-accent-block {
            background: var(--accent-color);
            color: #000;
            border: none;
            border-radius: var(--radius-small);
            padding: 14px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            display: flex;
            align-items: center;
            gap: 10px;
            justify-content: center;
            transition: background 0.2s;
        }
        .btn-accent-block i {
            width: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <a href="../index.html" class="back-link fade-in" onclick="window.location.hash='';">
            <i class="fas fa-arrow-left"></i> Back to Home
        </a>
        
        <app-header class="fade-in">
            <div>
                <h1 class="username">GitHub Publisher</h1>
                <p class="tagline">Forget about old GitHub load pages for every folders and files, this a better GitHub Publish commit replica!</p>
            </div>
        </app-header>
        
        <button class="btn-icon" id="settingsBtn" title="Settings" style="display: none; margin-bottom: 20px;"><i class="fas fa-cog"></i></button>
        
        <div id="loginSection">
            <div class="login-panel">
                <input type="text" id="repoOwner" placeholder="Repository Owner">
                <input type="text" id="repoName" placeholder="Repository Name">
                <input type="text" id="branch" placeholder="Branch" value="main">
                <input type="password" id="token" placeholder="GitHub Token">
                <button id="loadRepoBtn">Load Repository</button>
            </div>
        </div>

        <div id="repoContent" style="display: none;">
            <div class="breadcrumb" id="breadcrumb"></div>
            <div class="files-grid" id="filesContainer"></div>
        </div>
        
        <footer>
            <div class="social-links">
                <a href="https://twitter.com/lildavegoth"><span class="icon icon-twitter"></span></a>
                <a href="https://instagram.com/dave_goth"><span class="icon icon-instagram"></span></a>
            </div>
            <p>© 2026 lildavegoth | GitHub Publisher</p>
            <p style="margin-top: 8px; font-size: 0.8rem; color: #666;">
                Conveys the Idea of a Protected and Inspiring Space for Creative Expression.
            </p>
        </footer>
    </div>

    <button class="fab" id="fabAddBtn" style="display: none;"><i class="fas fa-plus"></i></button>

    <div id="universalPopup" class="popup-overlay" style="display: none;">
        <div class="popup-content">
            <div class="popup-header">
                <h2 id="popupTitle"></h2>
                <button class="close-popup" onclick="closeUniversalPopup()">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            <div class="popup-body" id="popupBody"></div>
            <div class="popup-footer" id="popupFooter"></div>
        </div>
    </div>

    <div class="context-menu" id="contextMenu">
        <button id="ctxUpload"><i class="fas fa-upload"></i> Upload</button>
        <button id="ctxAddFolder"><i class="fas fa-folder-plus"></i> Add Folder</button>
        <button id="ctxDelete"><i class="fas fa-trash"></i> Delete</button>
    </div>

    <script>
        let fullTree = [];
        let childrenMap = {};
        let currentPath = '';
        let contextTarget = null;

        const loginSection = document.getElementById('loginSection');
        const repoContent = document.getElementById('repoContent');
        const breadcrumbEl = document.getElementById('breadcrumb');
        const filesContainer = document.getElementById('filesContainer');
        const contextMenu = document.getElementById('contextMenu');
        const fabAddBtn = document.getElementById('fabAddBtn');
        const settingsBtn = document.getElementById('settingsBtn');

        document.getElementById('loadRepoBtn').addEventListener('click', loadRepository);
        fabAddBtn.addEventListener('click', openAddPopup);
        settingsBtn.addEventListener('click', openSettingsPopup);
        document.addEventListener('click', () => hideContextMenu());

        setupContextMenu();
        loadSavedConfig();
        attemptAutoLogin();

        function getConfig() {
            return {
                owner: document.getElementById('repoOwner').value.trim(),
                repo: document.getElementById('repoName').value.trim(),
                branch: document.getElementById('branch').value.trim() || 'main',
                token: document.getElementById('token').value.trim()
            };
        }

        function saveConfig(config) {
            localStorage.setItem('githubRepo', JSON.stringify(config));
        }

        function loadSavedConfig() {
            const saved = localStorage.getItem('githubRepo');
            if (saved) {
                try {
                    const cfg = JSON.parse(saved);
                    document.getElementById('repoOwner').value = cfg.owner || '';
                    document.getElementById('repoName').value = cfg.repo || '';
                    document.getElementById('branch').value = cfg.branch || 'main';
                    document.getElementById('token').value = cfg.token || '';
                    return true;
                } catch (e) {
                    return false;
                }
            }
            return false;
        }

        function attemptAutoLogin() {
            if (loadSavedConfig()) {
                loadRepository();
            }
        }

        async function loadRepository() {
            const config = getConfig();
            if (!config.owner || !config.repo || !config.token) {
                window.showMessage('Error', 'Please fill all fields.');
                resetToLogin();
                return;
            }
            saveConfig(config);
            filesContainer.innerHTML = '<div style="text-align:center;padding:40px;color:var(--text-secondary);"><i class="fas fa-spinner fa-spin"></i> Loading...</div>';
            loginSection.style.display = 'none';
            repoContent.style.display = 'block';
            currentPath = '';
            showAppControls();

            try {
                const response = await fetch(`https://api.github.com/repos/${config.owner}/${config.repo}/git/trees/${config.branch}?recursive=1&t=${Date.now()}`, {
                    headers: { 'Authorization': `token ${config.token}`, 'Accept': 'application/vnd.github.v3+json' }
                });
                if (!response.ok) throw new Error('Failed to fetch tree: ' + response.statusText);
                const data = await response.json();
                fullTree = data.tree.filter(item => item.type === 'blob' || item.type === 'tree');
                await enrichDates(config);
                buildChildrenMap();
                renderCurrentFolder();
            } catch (error) {
                filesContainer.innerHTML = '';
                window.showMessage('Error', error.message);
                resetToLogin();
            }
        }

        function resetToLogin() {
            loginSection.style.display = 'block';
            repoContent.style.display = 'none';
            hideAppControls();
        }

        function showAppControls() {
            settingsBtn.style.display = 'flex';
            fabAddBtn.style.display = 'flex';
        }

        function hideAppControls() {
            settingsBtn.style.display = 'none';
            fabAddBtn.style.display = 'none';
        }

        async function enrichDates(config) {
            const datePromises = fullTree.map(async (item) => {
                if (item.type === 'tree') {
                    item.lastDate = 'Folder';
                    return;
                }
                try {
                    const res = await fetch(`https://api.github.com/repos/${config.owner}/${config.repo}/commits?path=${encodeURIComponent(item.path)}&per_page=1`, {
                        headers: { 'Authorization': `token ${config.token}`, 'Accept': 'application/vnd.github.v3+json' }
                    });
                    if (!res.ok) throw new Error('Commit fetch failed');
                    const commits = await res.json();
                    if (commits.length > 0) {
                        const date = new Date(commits[0].commit.committer.date);
                        item.lastDate = date.toLocaleDateString('en-US', { weekday: 'short', day: 'numeric' });
                    } else {
                        item.lastDate = 'Unknown';
                    }
                } catch {
                    item.lastDate = 'N/A';
                }
            });
            await Promise.all(datePromises);
        }

        function buildChildrenMap() {
            childrenMap = { '': [] };
            fullTree.forEach(item => {
                const dir = item.path.includes('/') ? item.path.substring(0, item.path.lastIndexOf('/')) + '/' : '';
                if (!childrenMap[dir]) childrenMap[dir] = [];
                childrenMap[dir].push(item);
            });
        }

        function renderCurrentFolder() {
            filesContainer.innerHTML = '';
            const items = childrenMap[currentPath] || [];
            items.sort((a, b) => {
                if (a.type !== b.type) return a.type === 'tree' ? -1 : 1;
                return a.path.localeCompare(b.path);
            });

            if (items.length === 0) {
                filesContainer.innerHTML = '<div style="text-align:center;padding:20px;color:var(--text-secondary);">Empty folder</div>';
            } else {
                items.forEach(item => {
                    const card = document.createElement('div');
                    card.className = 'file-card' + (item.type === 'tree' ? ' folder-item' : '');
                    card.dataset.path = item.path;
                    card.dataset.type = item.type;
                    card.innerHTML = `
                        <span class="file-name">
                            <i class="fas ${item.type === 'tree' ? 'fa-folder' : 'fa-file'}" style="color: var(--accent-color); width: 20px;"></i>
                            ${item.path.split('/').pop()}
                        </span>
                        <span class="file-date">${item.lastDate}</span>
                    `;
                    card.addEventListener('click', () => onItemClick(item));
                    card.addEventListener('contextmenu', (e) => { e.preventDefault(); showContextMenu(e, item); });
                    card.addEventListener('touchstart', (e) => startLongPress(e, item), { passive: true });
                    card.addEventListener('touchend', cancelLongPress);
                    card.addEventListener('touchmove', cancelLongPress);
                    filesContainer.appendChild(card);
                });
            }
            renderBreadcrumb();
        }

        function renderBreadcrumb() {
            breadcrumbEl.innerHTML = '';
            const rootSpan = document.createElement('span');
            rootSpan.className = 'breadcrumb-item';
            rootSpan.textContent = 'root';
            rootSpan.addEventListener('click', () => navigateTo(''));
            breadcrumbEl.appendChild(rootSpan);

            if (currentPath) {
                const parts = currentPath.split('/').filter(p => p);
                let accumulated = '';
                parts.forEach(part => {
                    accumulated += part + '/';
                    const sep = document.createElement('span');
                    sep.className = 'breadcrumb-separator';
                    sep.textContent = ' / ';
                    breadcrumbEl.appendChild(sep);
                    const span = document.createElement('span');
                    span.className = 'breadcrumb-item';
                    span.textContent = part;
                    span.addEventListener('click', () => navigateTo(accumulated));
                    breadcrumbEl.appendChild(span);
                });
            }
        }

        function navigateTo(path) {
            currentPath = path;
            renderCurrentFolder();
        }

        function onItemClick(item) {
            if (item.type === 'tree') {
                navigateTo(item.path + '/');
            }
        }

        async function refreshRepo() {
            const savedPath = currentPath;
            await loadRepository();
            currentPath = savedPath;
            renderCurrentFolder();
        }

        function makeCommitMsg(action, name) {
            const nameWithoutExt = name.includes('.') ? name.replace(/\.[^/.]+$/, '') : name;
            const words = nameWithoutExt.split('-').filter(w => w.length > 0);
            const capitalized = words.map(w => w.charAt(0).toUpperCase() + w.slice(1)).join(' ');
            return `${action} ${capitalized}`;
        }

        let longPressTimer;
        function startLongPress(e, item) {
            e.preventDefault();
            longPressTimer = setTimeout(() => {
                showContextMenu(e, item);
            }, 800);
        }

        function cancelLongPress() {
            clearTimeout(longPressTimer);
        }

        function showContextMenu(e, item) {
            contextTarget = item;
            contextMenu.style.display = 'flex';
            contextMenu.style.left = Math.min(e.clientX || e.touches[0].clientX, window.innerWidth - 170) + 'px';
            contextMenu.style.top = Math.min(e.clientY || e.touches[0].clientY, window.innerHeight - 160) + 'px';

            document.getElementById('ctxAddFolder').style.display = item.type === 'tree' ? 'flex' : 'none';
        }

        function hideContextMenu(clear = true) {
            contextMenu.style.display = 'none';
            if (clear) contextTarget = null;
        }

        function setupContextMenu() {
            document.getElementById('ctxUpload').addEventListener('click', () => {
                if (!contextTarget) return;
            
                const target = contextTarget;
                hideContextMenu(false);
            
                const input = document.createElement('input');
                input.type = 'file';
            
                if (target.type === 'tree') {
                    input.multiple = true;
                    input.onchange = (e) => {
                        if (e.target.files.length === 0) return;
                        const folderPath = target.path + '/';
                        batchUploadFiles(e.target.files, folderPath);
                        contextTarget = null;
                    };
                } else {
                    input.onchange = (e) => {
                        const file = e.target.files[0];
                        if (!file) return;
            
                        const reader = new FileReader();
                        reader.onload = (ev) => {
                            const base64 = ev.target.result.split(',')[1];
                            uploadDirectly(target.path, base64, file.name);
                            contextTarget = null;
                        };
                        reader.readAsDataURL(file);
                    };
                }
            
                input.click();
            });
        
            document.getElementById('ctxAddFolder').addEventListener('click', () => {
                if (!contextTarget || contextTarget.type !== 'tree') return;
        
                const target = contextTarget;
                hideContextMenu();
        
                openCreateFolderPopup(target.path + '/');
            });
        
            document.getElementById('ctxDelete').addEventListener('click', () => {
                if (!contextTarget) return;
        
                const target = contextTarget;
                hideContextMenu();
        
                deleteItem(target);
            });
        }

        async function uploadDirectly(targetPath, base64Content, displayName) {
            const config = getConfig();
            const existing = fullTree.find(i => i.path === targetPath);
        
            const commitMessage = makeCommitMsg(
                existing ? 'updated' : 'added',
                displayName
            );
        
            const notif = window.createTimerNotification('Uploading', 1);
            const progressBar = notif.wrapper.querySelector('.timer-progress-bar-notif');
            const timeEl = notif.wrapper.querySelector('.timer-time-notif');
        
            if (progressBar) progressBar.style.width = '0%';
            if (timeEl) timeEl.textContent = '0%';
        
            setTimeout(() => {
                if (progressBar) progressBar.style.width = '50%';
                if (timeEl) timeEl.textContent = '50%';
            }, 300);
        
            try {
                const body = {
                    message: commitMessage,
                    content: base64Content
                };
        
                if (existing) body.sha = existing.sha;
        
                const response = await fetch(
                    `https://api.github.com/repos/${config.owner}/${config.repo}/contents/${targetPath}`,
                    {
                        method: 'PUT',
                        headers: {
                            'Authorization': `token ${config.token}`,
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify(body)
                    }
                );
        
                if (!response.ok) throw new Error('Upload failed');
        
                if (progressBar) progressBar.style.width = '100%';
                if (timeEl) timeEl.textContent = '100%';
        
                setTimeout(() => notif.close(), 500);
        
                window.showMessage(
                    existing ? 'File overwritten.' : 'File uploaded'
                );
        
                refreshRepo();
        
            } catch (error) {
                notif.close();
                window.showMessage('Error', error.message);
            }
        }
        
        async function batchUploadFiles(files, folderPath) {
            const config = getConfig();
            if (!files.length) return;
        
            const notif = window.createTimerNotification('Uploading', 1);
            const progressBar = notif.wrapper.querySelector('.timer-progress-bar-notif');
            const timeEl = notif.wrapper.querySelector('.timer-time-notif');
            const updateProgress = (pct) => {
                if (progressBar) progressBar.style.width = pct + '%';
                if (timeEl) timeEl.textContent = pct + '%';
            };
        
            try {
                updateProgress(5);
        
                const fileContents = await Promise.all(Array.from(files).map(file => {
                    return new Promise((resolve, reject) => {
                        const reader = new FileReader();
                        reader.onload = ev => resolve({ name: file.name, content: ev.target.result.split(',')[1] });
                        reader.onerror = reject;
                        reader.readAsDataURL(file);
                    });
                }));
        
                updateProgress(20);
        
                const blobs = await Promise.all(fileContents.map(async ({ name, content }) => {
                    const res = await fetch(`https://api.github.com/repos/${config.owner}/${config.repo}/git/blobs`, {
                        method: 'POST',
                        headers: {
                            'Authorization': `token ${config.token}`,
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({ content, encoding: 'base64' })
                    });
                    if (!res.ok) throw new Error(`Blob creation failed for ${name}`);
                    const data = await res.json();
                    return { name, sha: data.sha };
                }));
        
                updateProgress(50);
        
                const treeEntries = blobs.map(({ name, sha }) => ({
                    path: folderPath + name,
                    mode: '100644',
                    type: 'blob',
                    sha
                }));
        
                let attempt = 0;
                const maxAttempts = 2;
        
                while (attempt < maxAttempts) {
                    attempt++;
        
                    const refRes = await fetch(`https://api.github.com/repos/${config.owner}/${config.repo}/git/ref/heads/${config.branch}`, {
                        headers: { 'Authorization': `token ${config.token}` }
                    });
                    if (!refRes.ok) throw new Error('Branch ref fetch failed');
                    const refData = await refRes.json();
                    const parentCommitSha = refData.object.sha;
        
                    const commitRes = await fetch(`https://api.github.com/repos/${config.owner}/${config.repo}/git/commits/${parentCommitSha}`, {
                        headers: { 'Authorization': `token ${config.token}` }
                    });
                    if (!commitRes.ok) throw new Error('Commit fetch failed');
                    const commitData = await commitRes.json();
                    const baseTreeSha = commitData.tree.sha;
        
                    updateProgress(60);
        
                    const treeRes = await fetch(`https://api.github.com/repos/${config.owner}/${config.repo}/git/trees`, {
                        method: 'POST',
                        headers: {
                            'Authorization': `token ${config.token}`,
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({ base_tree: baseTreeSha, tree: treeEntries })
                    });
                    if (!treeRes.ok) throw new Error('Tree creation failed');
                    const newTree = await treeRes.json();
        
                    updateProgress(80);
        
                    const fileLabel = files.length > 1 ? `${files.length} files` : files[0].name;
                    const commitMessage = `Added/updated ${fileLabel}`;
        
                    const commitCreateRes = await fetch(`https://api.github.com/repos/${config.owner}/${config.repo}/git/commits`, {
                        method: 'POST',
                        headers: {
                            'Authorization': `token ${config.token}`,
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({
                            message: commitMessage,
                            tree: newTree.sha,
                            parents: [parentCommitSha]
                        })
                    });
                    if (!commitCreateRes.ok) throw new Error('Commit creation failed');
                    const newCommit = await commitCreateRes.json();
        
                    updateProgress(95);
        
                    const updateRefRes = await fetch(`https://api.github.com/repos/${config.owner}/${config.repo}/git/refs/heads/${config.branch}`, {
                        method: 'PATCH',
                        headers: {
                            'Authorization': `token ${config.token}`,
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({ sha: newCommit.sha, force: false })
                    });
        
                    if (updateRefRes.ok) {
                        updateProgress(100);
                        setTimeout(() => notif.close(), 500);
                        window.showMessage('Upload successful');
                        refreshRepo();
                        return;
                    }
        
                    if (attempt === maxAttempts) {
                        const errorText = await updateRefRes.text();
                        throw new Error(`Branch update failed after ${maxAttempts} attempts: ${errorText}`);
                    }
        
                    updateProgress(55);
                }
            } catch (error) {
                notif.close();
                window.showMessage('Error', error.message);
            }
        }

        async function deleteItem(item) {
            if (!item) return;
            openConfirmPopup(`Delete "${item.path.split('/').pop()}"?`, async () => {
                if (item.type === 'tree') await deleteFolder(item.path);
                else await deleteSingleFile(item.path, item.sha);
                refreshRepo();
            });
        }

        async function deleteSingleFile(path, sha) {
            const config = getConfig();
            const fileName = path.split('/').pop();
            const commitMessage = makeCommitMsg('deleted', fileName);
            try {
                const response = await fetch(`https://api.github.com/repos/${config.owner}/${config.repo}/contents/${path}`, {
                    method: 'DELETE',
                    headers: {
                        'Authorization': `token ${config.token}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ message: commitMessage, sha: sha })
                });
                if (!response.ok) throw new Error('Delete failed: ' + response.statusText);
                window.showMessage('File deleted');
            } catch (error) {
                window.showMessage('Error', error.message);
            }
        }

        async function deleteFolder(folderPath) {
            const config = getConfig();
            const filesToDelete = fullTree.filter(item => item.type === 'blob' && item.path.startsWith(folderPath + '/'));
            for (const file of filesToDelete) {
                await deleteSingleFile(file.path, file.sha);
            }
            window.showMessage(`Folder "${folderPath}" deleted.`);
        }

        function openCreateFolderPopup(parentPath) {
            const popup = document.getElementById('universalPopup');
        
            document.getElementById('popupTitle').textContent = 'Create Folder';
        
            document.getElementById('popupBody').innerHTML = `
                <div
                    id="newFolderName"
                    class="popup-input"
                    contenteditable="true"
                    style="min-height:48px;outline:none;"
                ></div>
            `;
        
            document.getElementById('popupFooter').innerHTML = `
                <button class="btn-cancel" onclick="closeUniversalPopup()">Cancel</button>
                <button class="btn-yes" id="confirmCreateFolder">Create</button>
            `;
        
            popup.style.display = 'flex';
        
            document.getElementById('confirmCreateFolder').onclick = async () => {
                const name = document.getElementById('newFolderName').textContent.trim();
        
                if (!name) return;
        
                const fullPath = parentPath + name + '/.gitkeep';
                const config = getConfig();
                const commitMessage = makeCommitMsg('added', name);
        
                try {
                    await fetch(`https://api.github.com/repos/${config.owner}/${config.repo}/contents/${fullPath}`, {
                        method: 'PUT',
                        headers: {
                            'Authorization': `token ${config.token}`,
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({
                            message: commitMessage,
                            content: btoa('')
                        })
                    });
        
                    window.showMessage(`Folder "${name}" created.`);
                    closeUniversalPopup();
                    refreshRepo();
        
                } catch (error) {
                    window.showMessage('Error', error.message);
                }
            };
        }
        
        async function createFolder(parentPath, name) {
            const fullPath = parentPath + name + '/.gitkeep';
            const config = getConfig();
            const commitMessage = makeCommitMsg('added', name);
        
            try {
                await fetch(`https://api.github.com/repos/${config.owner}/${config.repo}/contents/${fullPath}`, {
                    method: 'PUT',
                    headers: {
                        'Authorization': `token ${config.token}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        message: commitMessage,
                        content: btoa('')
                    })
                });
        
                window.showMessage(`Folder "${name}" created`);
                refreshRepo();
        
            } catch (error) {
                window.showMessage('Error', error.message);
            }
        }

        function openAddPopup() {
            const popup = document.getElementById('universalPopup');
            document.getElementById('popupTitle').textContent = 'Add';
            document.getElementById('popupBody').innerHTML = `
                <button class="btn-accent-block" id="addNewFileBtn" style="margin-bottom:8px;"><i class="fas fa-file"></i> New File</button>
                <button class="btn-accent-block" id="addNewFolderBtn"><i class="fas fa-folder-plus"></i> New Folder</button>
            `;
            document.getElementById('popupFooter').innerHTML = '';
            popup.style.display = 'flex';
        
            document.getElementById('addNewFileBtn').onclick = () => {
                closeUniversalPopup();
                const input = document.createElement('input');
                input.type = 'file';
                input.multiple = true;
                input.onchange = (e) => {
                    if (e.target.files.length === 0) return;
                    batchUploadFiles(e.target.files, currentPath);
                };
                input.click();
            };
        
            document.getElementById('addNewFolderBtn').onclick = () => {
                closeUniversalPopup();
                openCreateFolderPopup(currentPath);
            };
        }

        function openConfirmPopup(message, onYes) {
            const popup = document.getElementById('universalPopup');
            document.getElementById('popupTitle').textContent = 'Confirm';
            document.getElementById('popupBody').innerHTML = `<p>${message}</p>`;
            document.getElementById('popupFooter').innerHTML = `
                <button class="btn-cancel" onclick="closeUniversalPopup()">Cancel</button>
                <button class="btn-yes" id="confirmYes">Yes</button>
            `;
            popup.style.display = 'flex';
            document.getElementById('confirmYes').onclick = () => {
                closeUniversalPopup();
                onYes();
            };
        }

        function openSettingsPopup() {
            const popup = document.getElementById('universalPopup');
            document.getElementById('popupTitle').textContent = 'Settings';
            document.getElementById('popupBody').innerHTML = `
                <button class="settings-btn btn-refresh" id="refreshBtn"><i class="fas fa-sync-alt"></i> <strong>Refresh</strong></button>
                <button class="settings-btn btn-logout" id="logoutBtn"><i class="fas fa-sign-out-alt"></i> <strong>Logout</strong></button>
            `;
            document.getElementById('popupFooter').innerHTML = '';
            popup.style.display = 'flex';

            document.getElementById('refreshBtn').onclick = () => {
                closeUniversalPopup();
                forceRefresh();
            };
            document.getElementById('logoutBtn').onclick = () => {
                localStorage.removeItem('githubRepo');
                location.reload();
            };
        }

        function forceRefresh() {
            fullTree = [];
            childrenMap = {};
            currentPath = '';
            renderCurrentFolder();
            loadRepository();
        }

        function closeUniversalPopup() {
            document.getElementById('universalPopup').style.display = 'none';
        }

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                closeUniversalPopup();
                hideContextMenu();
            }
        });
    </script>
</body>
