    <style>
        :root {
            --accent-color: #C1FC32;
            --accent-dark: #9bc726;
            --bg-black: #000000;
            --bg-dark: #1a1a1a;
            --bg-card: rgba(30, 30, 30, 0.7);
            --text-primary: #f5f5f7;
            --text-secondary: #a1a1a6;
            --radius-small: 12px;
            --radius-medium: 20px;
            --radius-large: 28px;
            --spacing-xs: 8px;
            --spacing-sm: 16px;
            --spacing-md: 24px;
            --spacing-lg: 32px;
            --spacing-xl: 48px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
        }

        body {
            background-color: var(--bg-black);
            color: var(--text-primary);
            min-height: 100vh;
            background-image: 
                radial-gradient(circle at 20% 80%, rgba(193, 252, 50, 0.05) 0%, transparent 20%),
                radial-gradient(circle at 80% 20%, rgba(193, 252, 50, 0.03) 0%, transparent 20%);
            overflow-x: hidden;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: var(--spacing-md);
        }

        .mode-toggle {
            display: flex;
            background: var(--bg-dark);
            border-radius: var(--radius-medium);
            padding: 4px;
            margin-bottom: var(--spacing-md);
            width: 100%;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .mode-btn {
            padding: var(--spacing-sm) var(--spacing-md);
            border: none;
            background: transparent;
            color: var(--text-secondary);
            font-weight: 600;
            cursor: pointer;
            border-radius: calc(var(--radius-medium) - 4px);
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: var(--spacing-xs);
            flex: 1;
            justify-content: center;
        }

        .mode-btn.active {
            background: var(--accent-color);
            color: var(--bg-black);
        }

        .mode-btn:hover:not(.active) {
            background: rgba(255, 255, 255, 0.05);
            color: var(--text-primary);
        }

        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-height: 0;
        }

        .editor-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-height: 0;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: var(--radius-medium);
            overflow: hidden;
            background: var(--bg-dark);
        }

        .editor-wrapper {
            position: relative;
            flex: 1;
            height: calc(100vh - 300px);
        }

        .line-numbers {
            position: absolute;
            left: 0;
            top: 0;
            bottom: 0;
            min-width: 30px;
            width: auto;
            padding: var(--spacing-md) 8px var(--spacing-md) 0;
            text-align: right;
            color: var(--text-secondary);
            user-select: none;
            -webkit-user-select: none;
            pointer-events: auto;
            z-index: 10;
            background: var(--bg-dark);
            line-height: 1.6;
            font-family: 'Courier New', monospace;
            font-size: 1rem;
            overflow: hidden;
        }

        .line-numbers div {
            line-height: 1.6;
        }

        .text-input {
            width: 100%;
            height: calc(100vh - 210px);
            padding: var(--spacing-md) var(--spacing-md) var(--spacing-md) 70px;
            background: transparent;
            border: none;
            color: var(--text-primary);
            font-size: 1rem;
            line-height: 1.6;
            resize: none;
            font-family: 'Courier New', monospace;
            white-space: pre;
            overflow-wrap: normal;
            overflow-x: auto;
            overflow-y: auto;
        }

        .text-input:focus {
            outline: none;
        }

        .toolbar {
            display: flex;
            flex-wrap: nowrap;
            overflow-x: auto;
            gap: var(--spacing-xs);
            padding: var(--spacing-sm);
            background: rgba(30, 30, 30, 0.8);
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }

        .toolbar button {
            min-width: 48px;
            height: 48px;
            padding: 0;
            background: var(--bg-dark);
            color: var(--text-primary);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: var(--radius-small);
            cursor: pointer;
            font-size: 1.2rem;
            display: flex;
            align-items: center;
            justify-content: center;
            flex: 0 0 auto;
        }

        .toolbar button:hover {
            background: var(--accent-color);
            color: var(--bg-black);
        }

        .stats {
            display: flex;
            justify-content: space-between;
            margin-top: var(--spacing-md);
            color: var(--text-secondary);
            font-size: 0.9rem;
            padding: var(--spacing-sm) 0;
        }

        .action-buttons {
            display: flex;
            gap: var(--spacing-sm);
            margin-top: var(--spacing-md);
        }

        .action-btn {
            flex: 1;
            padding: var(--spacing-sm);
            border: none;
            border-radius: var(--radius-medium);
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .action-btn.primary {
            background: var(--accent-color);
            color: var(--bg-black);
        }

        .action-btn.secondary {
            background: var(--bg-dark);
            color: var(--text-primary);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .action-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(193, 252, 50, 0.2);
        }

        .action-btn.secondary:hover {
            border-color: var(--accent-color);
        }

        .preview-container {
            width: 375px;
            height: 667px;
            max-width: 100%;
            margin: var(--spacing-md) auto;
            border: 12px solid #000;
            border-radius: 40px;
            overflow: hidden;

            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
        }

        .preview-frame {
            width: 100%;
            height: 100%;
            border: none;
            background: white;
        }

        .copy-notification {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: var(--accent-color);
            color: var(--bg-black);
            padding: var(--spacing-sm) var(--spacing-md);
            border-radius: var(--radius-medium);
            font-weight: 600;
            opacity: 0;
            transform: translateY(20px);
            transition: all 0.3s ease;
            z-index: 1000;
        }

        .copy-notification.show {
            opacity: 1;
            transform: translateY(0);
        }
    </style>
</head>

    <script>
        const faScript = document.createElement('script');
        faScript.src = 'https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/js/all.min.js';
        document.head.appendChild(faScript);

        const htmlEditor = document.getElementById('htmlEditor');
        const previewFrame = document.getElementById('previewFrame');
        const previewContainer = document.getElementById('previewContainer');
        const editModeBtn = document.getElementById('editModeBtn');
        const previewModeBtn = document.getElementById('previewModeBtn');
        const copyNotification = document.getElementById('copyNotification');
        const charCount = document.getElementById('charCount');
        const lineCount = document.getElementById('lineCount');
        const currentMode = document.getElementById('currentMode');
        const lineNumbers = document.getElementById('lineNumbers');
        const saveButton = document.getElementById('saveButton');

        let history = [];
        let historyIndex = -1;
        let previewTimeout;

        function saveState() {
            const current = htmlEditor.value;
            if (historyIndex >= 0 && history[historyIndex] === current) return;
            historyIndex++;
            history = history.slice(0, historyIndex);
            history.push(current);
            if (history.length > 100) {
                history.shift();
                historyIndex--;
            }
        }

        function undo() {
            if (historyIndex > 0) {
                historyIndex--;
                htmlEditor.value = history[historyIndex];
                updateAfterChange();
            }
        }

        function redo() {
            if (historyIndex < history.length - 1) {
                historyIndex++;
                htmlEditor.value = history[historyIndex];
                updateAfterChange();
            }
        }

        function updateAfterChange() {
            updateStats();
            updateLineNumbers();
            lineNumbers.scrollTop = htmlEditor.scrollTop;
            updatePreview();
        }

        document.addEventListener('DOMContentLoaded', function() {
            saveState();
            updateLineNumbers();
            updateStats();
            updatePreview();

            htmlEditor.addEventListener('input', function() {
                saveState();
                updateStats();
                updateLineNumbers();
                lineNumbers.scrollTop = htmlEditor.scrollTop;
                clearTimeout(previewTimeout);
                previewTimeout = setTimeout(updatePreview, 300);
            });

            htmlEditor.addEventListener('scroll', function() {
                lineNumbers.scrollTop = htmlEditor.scrollTop;
            });

            htmlEditor.addEventListener('keydown', handleKeyDown);

            lineNumbers.addEventListener('click', function(e) {
                if (e.target.tagName === 'DIV') {
                    const lineNum = parseInt(e.target.textContent);
                    const lines = htmlEditor.value.split('\n');
                    const lineText = lines[lineNum - 1] || '';

                    const textArea = document.createElement('textarea');
                    textArea.value = lineText;
                    document.body.appendChild(textArea);
                    textArea.select();
                    textArea.setSelectionRange(0, 99999);

                    try {
                        document.execCommand('copy');
                        showNotification('Line ' + lineNum + ' copied');
                    } catch (err) {
                        navigator.clipboard.writeText(lineText).then(() => {
                            showNotification('Line ' + lineNum + ' copied');
                        }).catch(() => {
                            showNotification('Failed to copy');
                        });
                    }

                    document.body.removeChild(textArea);
                }
            });
        });

        function handleKeyDown(e) {
            if ((e.ctrlKey || e.metaKey) && e.key === 'z') {
                e.preventDefault();
                undo();
                return;
            }
            if ((e.ctrlKey || e.metaKey) && e.key === 'y') {
                e.preventDefault();
                redo();
                return;
            }

            if (e.key === 'Enter') {
                e.preventDefault();
                const start = htmlEditor.selectionStart;
                const text = htmlEditor.value;
                let lineStart = start;
                while (lineStart > 0 && text[lineStart - 1] !== '\n') lineStart--;
                let indent = '';
                let pos = lineStart;
                while (pos < text.length && text[pos] === ' ') {
                    indent += ' ';
                    pos++;
                }
                const newText = text.substring(0, start) + '\n' + indent + text.substring(start);
                htmlEditor.value = newText;
                htmlEditor.selectionStart = htmlEditor.selectionEnd = start + 1 + indent.length;
                updateAfterChange();
            }

            if (e.key === 'Tab') {
                e.preventDefault();
                if (e.shiftKey) {
                    indentLines(false);
                } else {
                    indentLines(true);
                }
            }
        }

        function switchMode(mode) {
            if (mode === 'edit') {
                editModeBtn.classList.add('active');
                previewModeBtn.classList.remove('active');
                previewContainer.style.display = 'none';
                htmlEditor.parentElement.style.display = 'block';
                document.querySelector('.toolbar').style.display = 'flex';
                currentMode.textContent = 'Edit HTML';
                htmlEditor.focus();
            } else {
                previewModeBtn.classList.add('active');
                editModeBtn.classList.remove('active');
                previewContainer.style.display = 'block';
                htmlEditor.parentElement.style.display = 'none';
                document.querySelector('.toolbar').style.display = 'none';
                currentMode.textContent = 'Live Preview';
                updatePreview();
            }
        }

        editModeBtn.addEventListener('click', () => switchMode('edit'));
        previewModeBtn.addEventListener('click', () => switchMode('preview'));

        function updatePreview() {
            previewFrame.srcdoc = htmlEditor.value;
        }

        function updateStats() {
            const text = htmlEditor.value;
            charCount.textContent = text.length;
            lineCount.textContent = text.split('\n').length;
        }

        function updateLineNumbers() {
            const lines = htmlEditor.value.split('\n').length;
            let html = '';
            for (let i = 1; i <= lines; i++) {
                html += `<div>${i}</div>`;
            }
            lineNumbers.innerHTML = html;
            lineNumbers.scrollTop = htmlEditor.scrollTop;
        }

        function indentLines(add) {
            const textarea = htmlEditor;
            const startPos = textarea.selectionStart;
            const endPos = textarea.selectionEnd;
            const text = textarea.value;
            let lineStart = text.lastIndexOf('\n', startPos - 1);
            lineStart = lineStart === -1 ? 0 : lineStart + 1;
            let lineEnd = text.indexOf('\n', endPos);
            lineEnd = lineEnd === -1 ? text.length : lineEnd;
            const selectedText = text.substring(lineStart, lineEnd);
            const lines = selectedText.split('\n');
            const indent = '    ';
            const newLines = lines.map(line => {
                if (add) return indent + line;
                if (line.startsWith(indent)) return line.substring(indent.length);
                const spaces = line.match(/^ */)[0].length;
                if (spaces >= 4) return line.substring(4);
                return line;
            });
            const newSelected = newLines.join('\n');
            const delta = newSelected.length - selectedText.length;
            textarea.value = text.substring(0, lineStart) + newSelected + text.substring(lineEnd);
            textarea.selectionStart = startPos + (add ? indent.length : Math.max(-4, -delta / lines.length));
            textarea.selectionEnd = endPos + delta;
            saveState();
            updateAfterChange();
        }

        function formatCode() {
            let code = htmlEditor.value;
            let formatted = '';
            let indent = 0;
            const lines = code.split('\n');
            lines.forEach(line => {
                const trimmed = line.trim();
                if (trimmed.startsWith('</')) indent--;
                formatted += '    '.repeat(Math.max(0, indent)) + trimmed + '\n';
                if (trimmed.startsWith('<') && !trimmed.startsWith('</') && !trimmed.endsWith('/>')) indent++;
            });
            htmlEditor.value = formatted.trim();
            saveState();
            updateAfterChange();
            showNotification('Code formatted');
        }

        function selectAll() {
            htmlEditor.focus();
            htmlEditor.select();
        }

        function copyCode() {
            const textArea = document.createElement('textarea');
            textArea.value = htmlEditor.value;
            document.body.appendChild(textArea);
            textArea.select();
            textArea.setSelectionRange(0, 99999);

            try {
                document.execCommand('copy');
                showNotification('Code copied');
            } catch (err) {
                navigator.clipboard.writeText(htmlEditor.value).then(() => {
                    showNotification('Code copied');
                }).catch(() => {
                    showNotification('Failed to copy');
                });
            }

            document.body.removeChild(textArea);
        }

        function clearEditor() {
            if (confirm('Clear editor?')) {
                htmlEditor.value = '';
                history = [''];
                historyIndex = 0;
                updateAfterChange();
                showNotification('Editor cleared');
            }
        }

        function loadFile() {
            const input = document.createElement('input');
            input.type = 'file';
            input.accept = '.html,.htm,.txt';
            input.onchange = function(e) {
                const file = e.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = function(e) {
                    htmlEditor.value = e.target.result;
                    history = [e.target.result];
                    historyIndex = 0;
                    updateAfterChange();
                    showNotification('File loaded');
                };
                reader.readAsText(file);
            };
            input.click();
        }

        function insertTag(tag) {
            const start = htmlEditor.selectionStart;
            const end = htmlEditor.selectionEnd;
            const selected = htmlEditor.value.substring(start, end);
            const open = `<${tag}>`;
            const close = `</${tag}>`;
            htmlEditor.value = htmlEditor.value.substring(0, start) + open + selected + close + htmlEditor.value.substring(end);
            htmlEditor.selectionStart = start + open.length;
            htmlEditor.selectionEnd = start + open.length + selected.length;
            saveState();
            updateAfterChange();
        }

        function insertImg() {
            const str = '<img src="" alt="" />';
            const start = htmlEditor.selectionStart;
            htmlEditor.value = htmlEditor.value.substring(0, start) + str + htmlEditor.value.substring(start);
            htmlEditor.selectionStart = htmlEditor.selectionEnd = start + 10;
            saveState();
            updateAfterChange();
        }

        function insertComment() {
            const str = '<!--  -->';
            const start = htmlEditor.selectionStart;
            htmlEditor.value = htmlEditor.value.substring(0, start) + str + htmlEditor.value.substring(start);
            htmlEditor.selectionStart = htmlEditor.selectionEnd = start + 5;
            saveState();
            updateAfterChange();
        }

        function checkHTML() {
            const html = htmlEditor.value.trim();
            if (!html) {
                showNotification('Empty code');
                return;
            }
            const doc = new DOMParser().parseFromString(html, 'text/html');
            const error = doc.querySelector('parsererror');
            if (error) {
                showNotification('HTML has errors');
            } else {
                showNotification('HTML is valid');
            }
        }

        function showNotification(message) {
            copyNotification.innerHTML = `<i class="fas fa-check"></i> ${message}`;
            copyNotification.classList.add('show');
            setTimeout(() => {
                copyNotification.classList.remove('show');
            }, 2000);
        }

        async function saveToCordova(content, filename, mimeType) {
            return new Promise((resolve, reject) => {
                if (!window.cordova) {
                    reject(new Error('Not in Cordova'));
                    return;
                }
        
                const tryDownloads = () => {
                    window.resolveLocalFileSystemURL(
                        cordova.file.externalRootDirectory + 'Download/',
                        (dir) => {
                            dir.getFile(filename, { create: true, exclusive: false }, (fileEntry) => {
                                fileEntry.createWriter((writer) => {
                                    writer.onwriteend = () => {
                                        showNotification(`File saved to Downloads folder`);
                                        if (window.cordova.plugins && window.cordova.plugins.fileOpener2) {
                                            cordova.plugins.fileOpener2.open(fileEntry.nativeURL, mimeType);
                                        }
                                        resolve();
                                    };
                                    writer.onerror = () => {
                                        // Fallback to app folder
                                        fallbackToAppFolder();
                                    };
                                    writer.write(content);
                                }, fallbackToAppFolder);
                            }, fallbackToAppFolder);
                        },
                        fallbackToAppFolder
                    );
                };
        
                const fallbackToAppFolder = () => {
                    window.resolveLocalFileSystemURL(
                        cordova.file.dataDirectory,
                        (dir) => {
                            dir.getFile(filename, { create: true }, (fileEntry) => {
                                fileEntry.createWriter((writer) => {
                                    writer.onwriteend = () => {
                                        showNotification(`File saved to app folder`);
                                        if (window.cordova.plugins && window.cordova.plugins.fileOpener2) {
                                            cordova.plugins.fileOpener2.open(fileEntry.nativeURL, mimeType);
                                        }
                                        resolve();
                                    };
                                    writer.onerror = () => {
                                        showNotification('Error writing file');
                                        reject();
                                    };
                                    writer.write(content);
                                }, () => {
                                    showNotification('Could not create file writer');
                                    reject();
                                });
                            }, () => {
                                showNotification('Could not create file');
                                reject();
                            });
                        },
                        () => {
                            showNotification('Cannot access any storage');
                            reject();
                        }
                    );
                };
        
                // Try to request permission only if needed (optional, but may help on older Android)
                if (cordova.plugins && cordova.plugins.permissions) {
                    cordova.plugins.permissions.requestPermission(
                        cordova.plugins.permissions.WRITE_EXTERNAL_STORAGE,
                        (status) => {
                            // Regardless of permission status, try Downloads (may fail silently on newer Android)
                            tryDownloads();
                        },
                        () => {
                            // Permission request failed, skip Downloads and go straight to app folder
                            fallbackToAppFolder();
                        }
                    );
                } else {
                    // No permissions plugin, try Downloads directly
                    tryDownloads();
                }
            });
        }

        async function saveFile() {
            const content = htmlEditor.value;
            const filename = 'page.html';
            const mimeType = 'text/html';

            if (window.cordova) {
                try {
                    await saveToCordova(content, filename, mimeType);
                } catch (error) {
                    showNotification('Save failed: ' + (error.message || 'unknown error'));
                }
            } else {
                const blob = new Blob([content], { type: mimeType });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = filename;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
                showNotification('File saved');
            }
        }

        saveButton.addEventListener('click', saveFile);
    </script>
</body>
</html>
