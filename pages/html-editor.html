<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML Editor with Live Preview</title>
    <meta name="color-scheme" content="dark">
    <script src="../protections.js"></script>
    <script src="../notification.cssjs"></script>
    <link rel="stylesheet" href="../navigation.css">
    <link rel="stylesheet" href="../media.css">
    <style>
        :root {
            --accent-color: #C1FC32;
            --accent-dark: #9bc726;
            --bg-black: #000000;
            --bg-dark: #1a1a1a;
            --bg-card: rgba(30, 30, 30, 0.7);
            --text-primary: #f5f5f7;
            --text-secondary: #a1a1a6;
            --radius-small: 12px;
            --radius-medium: 20px;
            --radius-large: 28px;
            --spacing-xs: 8px;
            --spacing-sm: 16px;
            --spacing-md: 24px;
            --spacing-lg: 32px;
            --spacing-xl: 48px;
            --reading-mode-bg: #0a0a0a;
            --editing-mode-bg: #1a1a1a;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
        }

        body {
            background-color: var(--bg-black);
            color: var(--text-primary);
            min-height: 100vh;
            background-image: 
                radial-gradient(circle at 20% 80%, rgba(193, 252, 50, 0.05) 0%, transparent 20%),
                radial-gradient(circle at 80% 20%, rgba(193, 252, 50, 0.03) 0%, transparent 20%);
            overflow-x: hidden;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: var(--spacing-md);
        }

        header {
            padding: var(--spacing-lg) 0;
        }

        .username {
            font-size: 2.5rem;
            font-weight: 700;
            color: #ffffff;
            margin-bottom: 4px;
        }

        .tagline {
            color: var(--text-secondary);
            font-size: 1.1rem;
        }

        .mode-toggle {
            display: flex;
            background: var(--bg-dark);
            border-radius: var(--radius-medium);
            padding: 4px;
            margin-bottom: var(--spacing-md);
            width: 100%;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .mode-btn {
            padding: var(--spacing-sm) var(--spacing-md);
            border: none;
            background: transparent;
            color: var(--text-secondary);
            font-weight: 600;
            cursor: pointer;
            border-radius: calc(var(--radius-medium) - 4px);
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: var(--spacing-xs);
            flex: 1;
            justify-content: center;
        }

        .mode-btn.active {
            background: var(--accent-color);
            color: var(--bg-black);
        }

        .mode-btn:hover:not(.active) {
            background: rgba(255, 255, 255, 0.05);
            color: var(--text-primary);
        }

        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-height: 0;
        }

        .editor-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-height: 0;
        }

        .text-input {
            width: 100%;
            height: 600px;
            padding: var(--spacing-md);
            background: var(--bg-dark);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: var(--radius-medium);
            color: var(--text-primary);
            font-size: 1rem;
            line-height: 1.6;
            resize: none;
            transition: all 0.3s ease;
            font-family: 'Courier New', monospace;
            overflow-y: auto;
            max-width: 1200px;
            margin: 0 auto;
        }

        .text-input:focus {
            outline: none;
            border-color: var(--accent-color);
            box-shadow: 0 0 0 2px rgba(193, 252, 50, 0.1);
        }

        .stats {
            display: flex;
            justify-content: space-between;
            margin-top: var(--spacing-md);
            color: var(--text-secondary);
            font-size: 0.9rem;
            padding: var(--spacing-sm) 0;
        }

        .action-buttons {
            display: flex;
            gap: var(--spacing-sm);
            margin-top: var(--spacing-md);
        }

        .action-btn {
            flex: 1;
            padding: var(--spacing-sm);
            border: none;
            border-radius: var(--radius-medium);
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .action-btn.primary {
            background: var(--accent-color);
            color: var(--bg-black);
        }

        .action-btn.secondary {
            background: var(--bg-dark);
            color: var(--text-primary);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .action-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(193, 252, 50, 0.2);
        }

        .action-btn.secondary:hover {
            border-color: var(--accent-color);
        }

        .preview-container {
            width: 100%;
            height: 600px;
            max-width: 1200px;
            margin: 0 auto;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: var(--radius-medium);
            overflow: hidden;
            background: var(--bg-dark);
        }

        .preview-frame {
            width: 100%;
            height: 100%;
            border: none;
            background: white;
        }

        .copy-notification {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: var(--accent-color);
            color: var(--bg-black);
            padding: var(--spacing-sm) var(--spacing-md);
            border-radius: var(--radius-medium);
            font-weight: 600;
            opacity: 0;
            transform: translateY(20px);
            transition: all 0.3s ease;
            z-index: 1000;
        }

        .copy-notification.show {
            opacity: 1;
            transform: translateY(0);
        }

        @media (max-width: 768px) {
            .tool-btn span {
                display: none;
            }
            
            .tool-btn {
                padding: 6px 8px;
            }
        }
        
    </style>
</head>
<body>

        <a href="../index.html" class="back-link">
            <i class="fas fa-arrow-left"></i> Back to Home
        </a>
        
        <header>
            <div>
                <h1 class="username">HTML Editor</h1>
                <p class="tagline">Edit HTML with Live Mobile Preview</p>

        <div class="mode-toggle">
            <button class="mode-btn active" id="editModeBtn">
                <i class="fas fa-edit"></i> Edit HTML
            </button>
            <button class="mode-btn" id="previewModeBtn">
                <i class="fas fa-eye"></i> Live Preview
            </button>
        </div>
        
        <div class="main-content">
            <div class="editor-container">
                <textarea class="text-input" id="htmlEditor" spellcheck="false"><!DOCTYPE html>

<body>
    <div class="container">
        <h1>HTML Editor Live Preview</h1>
        <p>Edit HTML and see live preview.</p>
        <button onclick="showMessage()">Click Me!</button>
        <p id="demo"></p>
        <div class="action-btn primary" style="margin-top: -10px; margin-bottom: -10px; padding: 15px;">
            <h3>Features:</h3>
            <ul>
                <li>Live HTML Preview</li>

        }
    </script>

                <div class="preview-container" id="previewContainer" style="display: none;">
                    <iframe id="previewFrame" class="preview-frame"></iframe>
                </div>
            </div>
            
            <div class="stats">
                <div>
                    <span id="charCount">0</span> characters • 
                    <span id="lineCount">0</span> lines
                </div>
                <div>
                    <span id="currentMode">Edit HTML</span>
                </div>
            </div>
            
            <div class="action-buttons">
                <button class="action-btn primary" onclick="updatePreview()">
                    <i class="fas fa-play"></i> Update Preview
                </button>
                <button class="action-btn secondary" onclick="saveFile()">
                    <i class="fas fa-save"></i> Save HTML
                </button>
            </div>
        </div>
        
        <footer>

                <a href="https://twitter.com/lildavegoth"><span class="icon icon-twitter"></span></a>

            <p style="margin-top: 8px; font-size: 0.8rem; color: #666;">
                Mobile-Focused HTML Editing with Live Preview.
            </p>
        </footer>
    </div>
    
    <div class="copy-notification" id="copyNotification">
        <i class="fas fa-check"></i> Code copied!
    </div>

    <script>
        const faScript = document.createElement('script');
        faScript.src = 'https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/js/all.min.js';
        document.head.appendChild(faScript);
        
        const htmlEditor = document.getElementById('htmlEditor');
        const previewFrame = document.getElementById('previewFrame');
        const previewContainer = document.getElementById('previewContainer');
        const editModeBtn = document.getElementById('editModeBtn');
        const previewModeBtn = document.getElementById('previewModeBtn');
        const copyNotification = document.getElementById('copyNotification');
        const charCount = document.getElementById('charCount');
        const lineCount = document.getElementById('lineCount');
        const currentMode = document.getElementById('currentMode');
        
        let isEditMode = true;
        
        document.addEventListener('DOMContentLoaded', function() {
            updateStats();
            updatePreview();
            
            htmlEditor.addEventListener('input', function() {
                updateStats();
            });
            
            document.addEventListener('keydown', function(e) {
                if ((e.ctrlKey || e.metaKey) && e.key === 's') {
                    e.preventDefault();
                    updatePreview();
                    showNotification('Preview updated');
                }
            });
        });
        
        function switchMode(mode) {
            if (mode === 'edit') {
                isEditMode = true;
                editModeBtn.classList.add('active');
                previewModeBtn.classList.remove('active');
                htmlEditor.style.display = 'block';
                previewContainer.style.display = 'none';
                currentMode.textContent = 'Edit HTML';
                htmlEditor.focus();
            } else {
                isEditMode = false;
                previewModeBtn.classList.add('active');
                editModeBtn.classList.remove('active');
                htmlEditor.style.display = 'none';
                previewContainer.style.display = 'block';
                currentMode.textContent = 'Live Preview';
                updatePreview();
            }
        }
        
        editModeBtn.addEventListener('click', () => switchMode('edit'));
        previewModeBtn.addEventListener('click', () => switchMode('preview'));
        
        function updatePreview() {
            const html = htmlEditor.value;
            const blob = new Blob([html], { type: 'text/html' });
            const url = URL.createObjectURL(blob);
            previewFrame.src = url;
        }
        
        function updateStats() {
            const text = htmlEditor.value;
            const chars = text.length;
            const lines = text.split('\n').length;
            
            charCount.textContent = chars;
            lineCount.textContent = lines;
        }
        
        function insertTag(before, after) {
            const start = htmlEditor.selectionStart;
            const end = htmlEditor.selectionEnd;
            const selectedText = htmlEditor.value.substring(start, end);
            
            htmlEditor.value = htmlEditor.value.substring(0, start) + 
                              before + selectedText + after + 
                              htmlEditor.value.substring(end);
            
            const newCursorPos = start + before.length + selectedText.length + after.length;
            htmlEditor.setSelectionRange(newCursorPos, newCursorPos);
            htmlEditor.focus();
            
            updateStats();
        }
        
        function formatCode() {
            let code = htmlEditor.value;
            let formatted = '';
            let indent = 0;
            const lines = code.split('\n');
            
            lines.forEach(line => {
                const trimmed = line.trim();
                if (trimmed.startsWith('</')) {
                    indent--;
                }
                
                formatted += '    '.repeat(Math.max(0, indent)) + trimmed + '\n';
                
                if (trimmed.startsWith('<') && !trimmed.startsWith('</') && !trimmed.includes('/>')) {
                    if (!trimmed.includes('</')) {
                        indent++;
                    }
                }
            });
            
            htmlEditor.value = formatted;
            updateStats();
            showNotification('Code formatted');
        }
        
        function copyCode() {
            navigator.clipboard.writeText(htmlEditor.value);
            showNotification('Code copied');
        }
        
        function clearEditor() {
            if (confirm('Clear editor?')) {
                htmlEditor.value = '';
                updateStats();
                updatePreview();
                htmlEditor.focus();
                showNotification('Editor cleared');
            }
        }
        
        function saveFile() {
            const blob = new Blob([htmlEditor.value], { type: 'text/html' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'page.html';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
            showNotification('File saved');
        }
        
        function loadFile() {
            const input = document.createElement('input');
            input.type = 'file';
            input.accept = '.html,.htm,.txt';
            
            input.onchange = function(e) {
                const file = e.target.files[0];
                if (!file) return;
                
                const reader = new FileReader();
                reader.onload = function(e) {
                    htmlEditor.value = e.target.result;
                    updateStats();
                    updatePreview();
                    showNotification('File loaded');
                };
                reader.readAsText(file);
            };
            
            input.click();
        }
        
        function showNotification(message) {
            copyNotification.innerHTML = `<i class="fas fa-check"></i> ${message}`;
            copyNotification.classList.add('show');
            setTimeout(() => {
                copyNotification.classList.remove('show');
            }, 2000);
        }
    </script>
</body>
