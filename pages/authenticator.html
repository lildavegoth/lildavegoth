    <script>
        (async function() {
            const BASE32_ALPHABET = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ234567';
            const BASE32_MAP = {};
            for (let i = 0; i < BASE32_ALPHABET.length; i++) {
                BASE32_MAP[BASE32_ALPHABET[i]] = i;
            }

            function base32Decode(base32) {
                base32 = base32.replace(/\s+/g, '').replace(/=+$/, '').toUpperCase();
                if (!/^[A-Z2-7]+$/.test(base32)) {
                    throw new Error('Invalid Base32 characters');
                }
                let bits = '';
                for (let i = 0; i < base32.length; i++) {
                    const val = BASE32_MAP[base32[i]];
                    if (val === undefined) throw new Error('Invalid character');
                    bits += val.toString(2).padStart(5, '0');
                }
                const bytes = [];
                for (let i = 0; i + 8 <= bits.length; i += 8) {
                    bytes.push(parseInt(bits.substring(i, i + 8), 2));
                }
                return new Uint8Array(bytes);
            }

            async function generateTOTP(secretBase32) {
                const keyBytes = base32Decode(secretBase32);
                const period = 30;
                const now = Math.floor(Date.now() / 1000);
                const counter = Math.floor(now / period);
                const counterBytes = new Uint8Array(8);
                const view = new DataView(counterBytes.buffer);
                view.setBigUint64(0, BigInt(counter), false);
                const cryptoKey = await crypto.subtle.importKey(
                    'raw',
                    keyBytes,
                    { name: 'HMAC', hash: 'SHA-1' },
                    false,
                    ['sign']
                );
                const hmacBuffer = await crypto.subtle.sign('HMAC', cryptoKey, counterBytes);
                const hmac = new Uint8Array(hmacBuffer);
                const offset = hmac[19] & 0x0f;
                const binary = ((hmac[offset] & 0x7f) << 24) |
                    (hmac[offset + 1] << 16) |
                    (hmac[offset + 2] << 8) |
                    hmac[offset + 3];
                const otp = binary % 1000000;
                return otp.toString().padStart(6, '0');
            }

            const STORAGE_KEY = 'authTotp';
            const SALT_KEY = 'auth_salt_v1';
            const HASH_KEY = 'auth_hash_v1';
            const ITERATIONS = 100000;
            const ENC_PASSPHRASE = 'totp_local_vault_2024';
            let encryptionKey = null;
            let isSettingPassword = false;

            function generateSalt() {
                const array = new Uint8Array(16);
                crypto.getRandomValues(array);
                return Array.from(array, byte => byte.toString(16).padStart(2, '0')).join('');
            }

            async function hashPassword(password, salt) {
                const encoder = new TextEncoder();
                const passwordBuffer = encoder.encode(password);
                const saltBuffer = encoder.encode(salt);
                const importedKey = await crypto.subtle.importKey(
                    'raw',
                    passwordBuffer,
                    { name: 'PBKDF2' },
                    false,
                    ['deriveBits']
                );
                const derivedBits = await crypto.subtle.deriveBits(
                    { name: 'PBKDF2', salt: saltBuffer, iterations: ITERATIONS, hash: 'SHA-256' },
                    importedKey,
                    256
                );
                const hashArray = Array.from(new Uint8Array(derivedBits));
                return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
            }

            function calculatePasswordStrength(password) {
                let strength = 0;
                if (password.length >= 8) strength += 1;
                if (password.match(/[a-z]/)) strength += 1;
                if (password.match(/[A-Z]/)) strength += 1;
                if (password.match(/[0-9]/)) strength += 1;
                if (password.match(/[^a-zA-Z0-9]/)) strength += 1;

                if (password.length < 4) return { text: 'Too short', color: '#ff3b30' };
                if (strength < 2) return { text: 'Weak', color: '#ff3b30' };
                if (strength < 4) return { text: 'Moderate', color: '#ffaa33' };
                return { text: 'Strong', color: '#4cd964' };
            }

            async function getEncryptionKey() {
                if (encryptionKey) return encryptionKey;
                const enc = new TextEncoder();
                const keyMaterial = await crypto.subtle.digest('SHA-256', enc.encode(ENC_PASSPHRASE));
                encryptionKey = await crypto.subtle.importKey(
                    'raw',
                    keyMaterial,
                    { name: 'AES-GCM' },
                    false,
                    ['encrypt', 'decrypt']
                );
                return encryptionKey;
            }

            async function encryptSecret(plaintext) {
                const key = await getEncryptionKey();
                const iv = crypto.getRandomValues(new Uint8Array(12));
                const enc = new TextEncoder();
                const ciphertext = await crypto.subtle.encrypt(
                    { name: 'AES-GCM', iv: iv },
                    key,
                    enc.encode(plaintext)
                );
                return {
                    iv: btoa(String.fromCharCode(...iv)),
                    ciphertext: btoa(String.fromCharCode(...new Uint8Array(ciphertext)))
                };
            }

            async function decryptSecret(encryptedData) {
                const key = await getEncryptionKey();
                const iv = Uint8Array.from(atob(encryptedData.iv), c => c.charCodeAt(0));
                const ciphertext = Uint8Array.from(atob(encryptedData.ciphertext), c => c.charCodeAt(0));
                const decrypted = await crypto.subtle.decrypt(
                    { name: 'AES-GCM', iv: iv },
                    key,
                    ciphertext
                );
                const dec = new TextDecoder();
                return dec.decode(decrypted);
            }

            let accounts = [];
            const accountsContainer = document.getElementById('accountsContainer');
            const universalPopup = document.getElementById('universalPopup');
            const popupTitle = document.getElementById('popupTitle');
            const popupBody = document.getElementById('popupBody');
            const popupFooter = document.getElementById('popupFooter');
            const popupCloseBtn = document.getElementById('popupCloseBtn');
            const settingsBtn = document.getElementById('settingsBtn');
            const addBtn = document.getElementById('addBtn');

            function waitForUnlock() {
                return new Promise((resolve) => {
                    const overlay = document.getElementById('masterPasswordOverlay');
                    const input = document.getElementById('masterPasswordInput');
                    const toggleBtn = document.getElementById('togglePasswordVisibility');
                    const submitBtn = document.getElementById('passwordSubmitBtn');
                    const clearBtn = document.getElementById('passwordClearBtn');
                    const errorEl = document.getElementById('passwordError');
                    const strengthEl = document.getElementById('passwordStrength');
                    const titleEl = document.getElementById('passwordTitle');
                    const subtitleEl = document.getElementById('passwordSubtitle');

                    const salt = localStorage.getItem(SALT_KEY);
                    const hash = localStorage.getItem(HASH_KEY);

                    if (salt && hash) {
                        isSettingPassword = false;
                        titleEl.textContent = 'Enter Master Password';
                        subtitleEl.textContent = 'Please enter your master password to access your vault';
                        clearBtn.style.display = 'block';
                    } else {
                        isSettingPassword = true;
                        titleEl.textContent = 'Create Master Password';
                        subtitleEl.textContent = 'Set a strong password to secure your authenticator';
                        clearBtn.style.display = 'none';
                    }

                    setTimeout(() => input.focus(), 200);

                    toggleBtn.addEventListener('click', function() {
                        const type = input.getAttribute('type') === 'password' ? 'text' : 'password';
                        input.setAttribute('type', type);
                        this.innerHTML = type === 'password' ? '<i class="fas fa-eye"></i>' : '<i class="fas fa-eye-slash"></i>';
                    });

                    input.addEventListener('input', function() {
                        errorEl.textContent = '';
                        if (isSettingPassword) {
                            const strength = calculatePasswordStrength(this.value);
                            strengthEl.textContent = strength.text;
                            strengthEl.style.color = strength.color;
                        }
                    });

                    clearBtn.addEventListener('click', function() {
                        if (confirm('This will permanently delete ALL stored accounts and reset security. Continue?')) {
                            localStorage.removeItem(SALT_KEY);
                            localStorage.removeItem(HASH_KEY);
                            localStorage.removeItem(STORAGE_KEY);
                            accounts = [];
                            renderAll();
                            isSettingPassword = true;
                            titleEl.textContent = 'Create Master Password';
                            subtitleEl.textContent = 'Set a strong password to secure your authenticator';
                            clearBtn.style.display = 'none';
                            input.value = '';
                            input.setAttribute('type', 'password');
                            toggleBtn.innerHTML = '<i class="fas fa-eye"></i>';
                            strengthEl.textContent = '';
                            errorEl.textContent = '';
                        }
                    });

                    submitBtn.addEventListener('click', async function() {
                        const password = input.value;
                        if (!password) {
                            errorEl.textContent = 'Password cannot be empty';
                            return;
                        }

                        if (isSettingPassword) {
                            if (password.length < 4) {
                                errorEl.textContent = 'Password must be at least 4 characters';
                                return;
                            }
                            const newSalt = generateSalt();
                            const newHash = await hashPassword(password, newSalt);
                            localStorage.setItem(SALT_KEY, newSalt);
                            localStorage.setItem(HASH_KEY, newHash);
                            isSettingPassword = false;
                            overlay.classList.add('hidden');
                            resolve();
                        } else {
                            const currentSalt = localStorage.getItem(SALT_KEY);
                            const storedHash = localStorage.getItem(HASH_KEY);
                            const inputHash = await hashPassword(password, currentSalt);
                            if (inputHash === storedHash) {
                                overlay.classList.add('hidden');
                                resolve();
                            } else {
                                errorEl.textContent = 'Incorrect master password';
                                input.value = '';
                                const container = document.querySelector('.password-container');
                                container.style.animation = 'shake 0.4s ease-in-out';
                                setTimeout(() => container.style.animation = '', 400);
                            }
                        }
                    });

                    input.addEventListener('keypress', function(e) {
                        if (e.key === 'Enter') {
                            submitBtn.click();
                        }
                    });
                });
            }

            function showPopup() {
                universalPopup.classList.add('active');
            }

            function hidePopup() {
                universalPopup.classList.remove('active');
            }

            popupCloseBtn.addEventListener('click', function() {
                hidePopup();
                passwordChangeStep = null;
                tempNewPassword = null;
            });
            universalPopup.addEventListener('click', function(e) {
                if (e.target === universalPopup) {
                    hidePopup();
                    passwordChangeStep = null;
                    tempNewPassword = null;
                }
            });

            async function loadAccounts() {
                const stored = localStorage.getItem(STORAGE_KEY);
                if (!stored) {
                    accounts = [];
                    return;
                }
                try {
                    const raw = JSON.parse(stored);
                    const decryptedAccounts = [];
                    for (const item of raw) {
                        let secret;
                        if (item.secretEncrypted && item.iv) {
                            secret = await decryptSecret({ iv: item.iv, ciphertext: item.secretEncrypted });
                        } else if (item.secret) {
                            secret = item.secret;
                        } else {
                            continue;
                        }
                        decryptedAccounts.push({
                            id: item.id,
                            name: item.name,
                            secret: secret,
                            status: item.status || 'active'
                        });
                    }
                    accounts = decryptedAccounts;
                } catch (e) {
                    accounts = [];
                }
            }

            async function saveAccounts() {
                const toStore = [];
                for (const acc of accounts) {
                    const encrypted = await encryptSecret(acc.secret);
                    toStore.push({
                        id: acc.id,
                        name: acc.name,
                        secretEncrypted: encrypted.ciphertext,
                        iv: encrypted.iv,
                        status: acc.status
                    });
                }
                localStorage.setItem(STORAGE_KEY, JSON.stringify(toStore));
            }

            let currentEditAccountId = null;
            let pendingDeleteAccountId = null;
            let passwordChangeStep = null;
            let tempNewPassword = null;

            function openAddAccountPopup() {
                currentEditAccountId = null;
                popupTitle.textContent = 'Add Account';
                popupBody.innerHTML = `
                    <div class="input-group">
                        <label for="popupAccountName">Account name</label>
                        <input type="text" id="popupAccountName" placeholder="e.g. user@example.com" autocomplete="off">
                    </div>
                    <div class="input-group">
                        <label for="popupSecretKey">Secret key (Base32)</label>
                        <input type="text" id="popupSecretKey" placeholder="e.g. JBSWY3DPEHPK3PXP" autocomplete="off" spellcheck="false">
                    </div>
                    <div class="error-text" id="popupError"></div>
                `;
                popupFooter.innerHTML = `
                    <button class="btn btn-primary" id="popupSaveBtn" type="button">
                        <i class="fa-solid fa-plus"></i> Add
                    </button>
                `;
                document.getElementById('popupSaveBtn').addEventListener('click', async function() {
                    const name = document.getElementById('popupAccountName').value.trim();
                    const secret = document.getElementById('popupSecretKey').value.trim();
                    const errorEl = document.getElementById('popupError');
                    if (!name || !secret) {
                        errorEl.textContent = 'Both fields are required.';
                        return;
                    }
                    try {
                        base32Decode(secret);
                    } catch (e) {
                        errorEl.textContent = 'Invalid secret key.';
                        return;
                    }
                    accounts.push({
                        id: Date.now().toString(),
                        name: name,
                        secret: secret.replace(/\s+/g, '').toUpperCase(),
                        status: 'active'
                    });
                    await saveAccounts();
                    hidePopup();
                    renderAll();
                });
                showPopup();
                setTimeout(() => document.getElementById('popupAccountName').focus(), 100);
            }

            function openEditAccountPopup(accountId) {
                const acc = accounts.find(a => a.id === accountId);
                if (!acc) return;
                currentEditAccountId = accountId;
                popupTitle.textContent = 'Edit Account';
                popupBody.innerHTML = `
                    <div class="input-group">
                        <label for="popupAccountName">Account name</label>
                        <input type="text" id="popupAccountName" value="${escapeHtml(acc.name)}" autocomplete="off">
                    </div>
                    <div class="input-group">
                        <label for="popupSecretKey">Secret key (Base32)</label>
                        <input type="text" id="popupSecretKey" placeholder="Leave blank to keep current secret" autocomplete="off" spellcheck="false">
                    </div>
                    <div class="error-text" id="popupError"></div>
                `;
                const isArchived = acc.status === 'archived';
                popupFooter.innerHTML = `
                    <button class="btn btn-danger" id="popupDeleteBtn" type="button">
                        <i class="fa-solid fa-trash-can"></i>
                    </button>
                    <button class="btn btn-secondary" id="popupArchiveBtn" type="button">
                        <i class="fa-solid fa-${isArchived ? 'box-open' : 'box-archive'}"></i> ${isArchived ? 'Active' : 'Archive'}
                    </button>
                    <button class="btn btn-primary" id="popupSaveBtn" type="button">
                        <i class="fa-solid fa-floppy-disk"></i> Save
                    </button>
                `;

                document.getElementById('popupDeleteBtn').addEventListener('click', function() {
                    openDeleteConfirmPopup(acc);
                });

                document.getElementById('popupArchiveBtn').addEventListener('click', async function() {
                    const target = accounts.find(a => a.id === currentEditAccountId);
                    if (target) {
                        target.status = target.status === 'active' ? 'archived' : 'active';
                        await saveAccounts();
                        hidePopup();
                        renderAll();
                    }
                });

                document.getElementById('popupSaveBtn').addEventListener('click', async function() {
                    const name = document.getElementById('popupAccountName').value.trim();
                    const secretInput = document.getElementById('popupSecretKey').value.trim();
                    const errorEl = document.getElementById('popupError');
                    if (!name) {
                        errorEl.textContent = 'Account name is required.';
                        return;
                    }
                    const target = accounts.find(a => a.id === currentEditAccountId);
                    if (!target) return;

                    if (secretInput === '') {
                        target.name = name;
                    } else {
                        try {
                            base32Decode(secretInput);
                        } catch (e) {
                            errorEl.textContent = 'Invalid secret key.';
                            return;
                        }
                        target.name = name;
                        target.secret = secretInput.replace(/\s+/g, '').toUpperCase();
                    }
                    await saveAccounts();
                    hidePopup();
                    renderAll();
                });

                showPopup();
            }

            function openDeleteConfirmPopup(acc) {
                pendingDeleteAccountId = acc.id;
                popupTitle.textContent = 'Delete Account';
                popupBody.innerHTML = `<p style="color:#fff;">Are you sure you want to delete ${escapeHtml(acc.name)}? This cannot be undone!</p>`;
                popupFooter.innerHTML = `
                    <button class="btn btn-secondary" id="popupCancelBtn" type="button">Cancel</button>
                    <button class="btn btn-danger" id="popupConfirmDeleteBtn" type="button">Delete</button>
                `;
                document.getElementById('popupCancelBtn').addEventListener('click', function() {
                    pendingDeleteAccountId = null;
                    hidePopup();
                });
                document.getElementById('popupConfirmDeleteBtn').addEventListener('click', async function() {
                    if (pendingDeleteAccountId) {
                        accounts = accounts.filter(a => a.id !== pendingDeleteAccountId);
                        pendingDeleteAccountId = null;
                        await saveAccounts();
                        hidePopup();
                        renderAll();
                    }
                });
                showPopup();
            }

            function openSettingsPopup() {
                passwordChangeStep = null;
                tempNewPassword = null;
                popupTitle.textContent = 'Settings';
                popupBody.innerHTML = `
                    <div class="settings-item" id="settingsChangePassword">
                        <div class="settings-icon">
                            <i class="fas fa-key"></i>
                        </div>
                        <div class="settings-info">
                            <div class="settings-name">Change Master Password</div>
                            <div class="settings-desc">Update your existing master password</div>
                        </div>
                        <i class="fas fa-chevron-right settings-arrow"></i>
                    </div>
                    <div class="settings-item" id="settingsPurgeData">
                        <div class="settings-icon danger">
                            <i class="fas fa-trash"></i>
                        </div>
                        <div class="settings-info">
                            <div class="settings-name danger">Purge Data & Reset</div>
                            <div class="settings-desc">Remove all accounts and reset security</div>
                        </div>
                        <i class="fas fa-chevron-right settings-arrow"></i>
                    </div>
                    <div class="settings-footer-info">
                        <i class="fas fa-info-circle"></i> <strong>About</strong>
                        <p style="margin-top: 6px;">Your TOTP secrets are encrypted locally with AES-GCM. Only you can access them. The master password is hashed with PBKDF2 and cannot be recovered. Keep it safe!</p>
                    </div>
                `;
                popupFooter.innerHTML = '';
                showPopup();

                document.getElementById('settingsChangePassword').addEventListener('click', openChangePasswordStepVerify);
                document.getElementById('settingsPurgeData').addEventListener('click', openPurgeConfirmPopup);
            }

            function openChangePasswordStepVerify() {
                passwordChangeStep = 'verify';
                tempNewPassword = null;
                popupTitle.textContent = 'Change Master Password';
                popupBody.innerHTML = `
                    <div class="input-group">
                        <label for="popupPasswordInput">Current password</label>
                        <input type="password" id="popupPasswordInput" placeholder="Enter current master password" autocomplete="off">
                    </div>
                    <div class="error-text" id="popupError"></div>
                `;
                popupFooter.innerHTML = `
                    <button class="btn btn-secondary" id="popupCancelBtn" type="button">Cancel</button>
                    <button class="btn btn-primary" id="popupConfirmBtn" type="button">Next</button>
                `;
                document.getElementById('popupCancelBtn').addEventListener('click', function() {
                    passwordChangeStep = null;
                    tempNewPassword = null;
                    hidePopup();
                });
                document.getElementById('popupConfirmBtn').addEventListener('click', async function() {
                    const password = document.getElementById('popupPasswordInput').value;
                    const errorEl = document.getElementById('popupError');
                    if (!password) {
                        errorEl.textContent = 'Password cannot be empty.';
                        return;
                    }
                    const salt = localStorage.getItem(SALT_KEY);
                    const storedHash = localStorage.getItem(HASH_KEY);
                    const inputHash = await hashPassword(password, salt);
                    if (inputHash !== storedHash) {
                        errorEl.textContent = 'Incorrect current password.';
                        return;
                    }
                    openChangePasswordStepNew();
                });
                setTimeout(() => document.getElementById('popupPasswordInput').focus(), 100);
            }

            function openChangePasswordStepNew() {
                passwordChangeStep = 'new';
                popupTitle.textContent = 'Enter New Password';
                popupBody.innerHTML = `
                    <div class="input-group">
                        <label for="popupPasswordInput">New password</label>
                        <input type="password" id="popupPasswordInput" placeholder="Enter new master password" autocomplete="off">
                    </div>
                    <div class="error-text" id="popupError"></div>
                `;
                popupFooter.innerHTML = `
                    <button class="btn btn-secondary" id="popupCancelBtn" type="button">Cancel</button>
                    <button class="btn btn-primary" id="popupConfirmBtn" type="button">Next</button>
                `;
                document.getElementById('popupCancelBtn').addEventListener('click', function() {
                    passwordChangeStep = null;
                    tempNewPassword = null;
                    hidePopup();
                });
                document.getElementById('popupConfirmBtn').addEventListener('click', function() {
                    const password = document.getElementById('popupPasswordInput').value;
                    const errorEl = document.getElementById('popupError');
                    if (!password || password.length < 4) {
                        errorEl.textContent = 'Password must be at least 4 characters.';
                        return;
                    }
                    tempNewPassword = password;
                    openChangePasswordStepConfirm();
                });
                setTimeout(() => document.getElementById('popupPasswordInput').focus(), 100);
            }

            function openChangePasswordStepConfirm() {
                passwordChangeStep = 'confirm';
                popupTitle.textContent = 'Confirm New Password';
                popupBody.innerHTML = `
                    <div class="input-group">
                        <label for="popupPasswordInput">Confirm new password</label>
                        <input type="password" id="popupPasswordInput" placeholder="Re-enter new master password" autocomplete="off">
                    </div>
                    <div class="error-text" id="popupError"></div>
                `;
                popupFooter.innerHTML = `
                    <button class="btn btn-secondary" id="popupCancelBtn" type="button">Cancel</button>
                    <button class="btn btn-primary" id="popupConfirmBtn" type="button">Save</button>
                `;
                document.getElementById('popupCancelBtn').addEventListener('click', function() {
                    passwordChangeStep = null;
                    tempNewPassword = null;
                    hidePopup();
                });
                document.getElementById('popupConfirmBtn').addEventListener('click', async function() {
                    const password = document.getElementById('popupPasswordInput').value;
                    const errorEl = document.getElementById('popupError');
                    if (!password) {
                        errorEl.textContent = 'Password cannot be empty.';
                        return;
                    }
                    if (password !== tempNewPassword) {
                        errorEl.textContent = 'Passwords do not match.';
                        return;
                    }
                    const newSalt = generateSalt();
                    const newHash = await hashPassword(password, newSalt);
                    localStorage.setItem(SALT_KEY, newSalt);
                    localStorage.setItem(HASH_KEY, newHash);
                    passwordChangeStep = null;
                    tempNewPassword = null;
                    hidePopup();
                });
                setTimeout(() => document.getElementById('popupPasswordInput').focus(), 100);
            }

            function openPurgeConfirmPopup() {
                passwordChangeStep = null;
                tempNewPassword = null;
                popupTitle.textContent = 'Purge Data & Reset';
                popupBody.innerHTML = `
                    <p style="color:#fff; margin-bottom:16px;">This will permanently delete all accounts and reset your master password. This cannot be undone.</p>
                    <div class="input-group">
                        <label for="popupPasswordInput">Enter master password to confirm</label>
                        <input type="password" id="popupPasswordInput" placeholder="Master password" autocomplete="off">
                    </div>
                    <div class="error-text" id="popupError"></div>
                `;
                popupFooter.innerHTML = `
                    <button class="btn btn-secondary" id="popupCancelBtn" type="button">Cancel</button>
                    <button class="btn btn-danger" id="popupConfirmBtn" type="button">Purge All Data</button>
                `;
                document.getElementById('popupCancelBtn').addEventListener('click', hidePopup);
                document.getElementById('popupConfirmBtn').addEventListener('click', async function() {
                    const password = document.getElementById('popupPasswordInput').value;
                    const errorEl = document.getElementById('popupError');
                    if (!password) {
                        errorEl.textContent = 'Password cannot be empty.';
                        return;
                    }
                    const salt = localStorage.getItem(SALT_KEY);
                    const storedHash = localStorage.getItem(HASH_KEY);
                    const inputHash = await hashPassword(password, salt);
                    if (inputHash !== storedHash) {
                        errorEl.textContent = 'Incorrect master password.';
                        return;
                    }
                    localStorage.removeItem(SALT_KEY);
                    localStorage.removeItem(HASH_KEY);
                    localStorage.removeItem(STORAGE_KEY);
                    accounts = [];
                    location.reload();
                });
                showPopup();
                setTimeout(() => document.getElementById('popupPasswordInput').focus(), 100);
            }

            function escapeHtml(text) {
                const div = document.createElement('div');
                div.textContent = text;
                return div.innerHTML;
            }

            function copyTextToClipboard(text) {
                if (navigator.clipboard && navigator.clipboard.writeText) {
                    navigator.clipboard.writeText(text).then(() => {}).catch(() => {
                        fallbackCopy(text);
                    });
                } else {
                    fallbackCopy(text);
                }
            }

            function fallbackCopy(text) {
                const textarea = document.createElement('textarea');
                textarea.value = text;
                textarea.style.position = 'fixed';
                textarea.style.opacity = '0';
                textarea.style.resize = 'none';
                document.body.appendChild(textarea);
                textarea.select();
                try {
                    document.execCommand('copy');
                } catch (e) {}
                document.body.removeChild(textarea);
            }

            addBtn.addEventListener('click', openAddAccountPopup);
            settingsBtn.addEventListener('click', openSettingsPopup);

            async function renderAll() {
                const activeAccounts = accounts.filter(a => a.status === 'active');
                const archivedAccounts = accounts.filter(a => a.status === 'archived');

                if (activeAccounts.length === 0 && archivedAccounts.length === 0) {
                    accountsContainer.innerHTML = '<div class="empty-message">No accounts. Tap + to add one.</div>';
                    return;
                }

                const now = Math.floor(Date.now() / 1000);
                const secondsRemaining = 30 - (now % 30);
                const progressPercent = secondsRemaining / 30;
                const circumference = 2 * Math.PI * 19;

                let html = '';

                if (activeAccounts.length > 0) {
                    const codesPromises = activeAccounts.map(acc =>
                        generateTOTP(acc.secret).catch(() => '------')
                    );
                    const codes = await Promise.all(codesPromises);

                    for (let i = 0; i < activeAccounts.length; i++) {
                        const acc = activeAccounts[i];
                        const code = codes[i];
                        const dashOffset = circumference * (1 - progressPercent);
                        html += `
                            <div class="auth-card" data-account-id="${acc.id}">
                                <div class="auth-info">
                                    <div class="auth-service">${escapeHtml(acc.name)}</div>
                                    <div class="auth-code">${code}</div>
                                </div>
                                <div class="auth-actions">
                                    <div class="progress-circle">
                                        <svg class="progress-svg" viewBox="0 0 47 47">
                                            <circle class="progress-bg" cx="23.5" cy="23.5" r="19"/>
                                            <circle class="progress-fill" cx="23.5" cy="23.5" r="19"
                                                stroke-dasharray="${circumference}"
                                                stroke-dashoffset="${dashOffset}"/>
                                        </svg>
                                    </div>
                                    <button class="copy-btn" data-code="${code}">
                                        <i class="fa-regular fa-copy"></i>
                                    </button>
                                </div>
                            </div>
                        `;
                    }
                }

                if (archivedAccounts.length > 0) {
                    html += '<div class="section-title" style="margin-top: 32px;">Archived</div>';
                    for (const acc of archivedAccounts) {
                        html += `
                            <div class="auth-card archived" data-account-id="${acc.id}">
                                <div class="auth-info">
                                    <div class="auth-service">${escapeHtml(acc.name)}</div>
                                    <div class="auth-code">------</div>
                                </div>
                                <div class="auth-actions">
                                    <div class="progress-circle">
                                        <svg class="progress-svg" viewBox="0 0 47 47">
                                            <circle class="progress-bg" cx="23.5" cy="23.5" r="19"/>
                                        </svg>
                                    </div>
                                    <button class="copy-btn" style="background:#555; pointer-events:none;">
                                        <i class="fa-solid fa-lock"></i>
                                    </button>
                                </div>
                            </div>
                        `;
                    }
                }

                accountsContainer.innerHTML = html;

                document.querySelectorAll('.auth-card').forEach(card => {
                    card.addEventListener('click', function(e) {
                        if (e.target.closest('.copy-btn')) return;
                        const id = this.getAttribute('data-account-id');
                        openEditAccountPopup(id);
                    });
                });

                document.querySelectorAll('.copy-btn').forEach(btn => {
                    btn.addEventListener('click', function(e) {
                        e.stopPropagation();
                        const code = this.getAttribute('data-code');
                        if (code && code !== '------') {
                            copyTextToClipboard(code);
                            this.innerHTML = '<i class="fa-solid fa-check"></i>';
                            setTimeout(() => {
                                this.innerHTML = '<i class="fa-regular fa-copy"></i>';
                            }, 1500);
                        }
                    });
                });
            }

            await waitForUnlock();
            await loadAccounts();
            renderAll();
            setInterval(renderAll, 1000);
        })();
    </script>
</body>
</html>
