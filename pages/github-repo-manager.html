<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="color-scheme" content="dark">
    <title>Github Repo Manager | lildavegoth</title>
    <script src="../protections.js"></script>
    <script src="../notification.cssjs"></script>
    <link rel="stylesheet" href="../media.css">
    <script src="../ui-icons.js"></script>
    <style>
        :root {
            --accent-color: #C1FC32;
            --accent-dark: #9bc726;
            --bg-black: #000000;
            --bg-dark: #1a1a1a;
            --bg-card: rgba(30, 30, 30, 0.7);
            --text-primary: #f5f5f7;
            --text-secondary: #a1a1a6;
            --radius-small: 12px;
            --radius-medium: 20px;
            --radius-large: 28px;
            --spacing-xs: 8px;
            --spacing-sm: 16px;
            --spacing-md: 24px;
            --spacing-lg: 32px;
            --spacing-xl: 48px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-black);
            color: var(--text-primary);
            min-height: 100vh;
            overflow-x: hidden;
            padding-bottom: 90px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: var(--spacing-md);
            position: relative;
        }

        .login-panel {
            background: var(--bg-card);
            border-radius: var(--radius-large);
            padding: var(--spacing-lg);
            margin-bottom: var(--spacing-lg);
            border: 1px solid rgba(255, 255, 255, 0.05);
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: var(--spacing-sm);
        }

        .login-panel input {
            width: 100%;
            padding: 10px 14px;
            border-radius: var(--radius-medium);
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: var(--text-primary);
            font-size: 0.9rem;
            outline: none;
        }

        .login-panel button {
            grid-column: span 2;
            background: var(--accent-color);
            color: #000;
            border: none;
            border-radius: var(--radius-medium);
            padding: 12px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }

        .login-panel button:hover {
            background: var(--accent-dark);
        }

        .pill-btn {
            background: var(--accent-color);
            color: #000;
            border: none;
            border-radius: 50px;
            padding: 8px 16px;
            font-weight: 600;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 0.9rem;
            transition: background 0.2s, transform 0.1s;
            white-space: nowrap;
        }
        .pill-btn:active {
            transform: scale(0.95);
        }
        .pill-btn:disabled {
            opacity: 0.5;
            cursor: default;
            background: #555;
            color: #aaa;
        }
        .home-btn {
            background: transparent;
            border: none;
            color: var(--accent-color);
            padding: 6px;
            font-size: 1.2rem;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 40px;
            height: 40px;
            transition: transform 0.1s;
        }
        .home-btn:active {
            transform: scale(0.9);
        }

        .files-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: var(--spacing-xs);
        }

        .file-card {
            background: var(--bg-card);
            border-radius: var(--radius-medium);
            padding: var(--spacing-sm) var(--spacing-md);
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            border: 1px solid rgba(255, 255, 255, 0.05);
            transition: border-color 0.2s;
            text-decoration: none;
            color: var(--text-primary);
            user-select: none;
        }

        .file-card.folder-item {
            font-weight: 500;
        }

        .file-name {
            display: flex;
            align-items: center;
            gap: var(--spacing-xs);
            word-break: break-all;
        }

        .file-date {
            color: var(--text-secondary);
            font-size: 0.85rem;
            white-space: nowrap;
            margin-left: var(--spacing-sm);
        }

        .popup-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 1.0);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 99999999;
            animation: fadeIn 0.3s ease;
        }

        .popup-content {
            background: var(--bg-card);
            border-radius: var(--radius-large);
            width: 90%;
            max-width: 500px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
            max-height: 70vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .popup-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: var(--spacing-md);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .popup-header h2 {
            font-size: 1.5rem;
            font-weight: 600;
        }

        .close-popup {
            background: transparent;
            border: none;
            color: var(--text-secondary);
            font-size: 1.2rem;
            cursor: pointer;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .popup-body {
            padding: var(--spacing-md);
            display: flex;
            flex-direction: column;
            gap: var(--spacing-md);
            flex: 1;
        }

        .popup-footer {
            padding: var(--spacing-md);
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            gap: var(--spacing-sm);
            justify-content: flex-end;
        }

        .settings-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: var(--text-primary);
            width: 100%;
            padding: 14px;
            border-radius: var(--radius-small);
            font-size: 0.95rem;
            cursor: pointer;
            transition: background 0.2s;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .settings-btn i {
            width: 20px;
        }

        .settings-btn.btn-logout {
            background: #C42833;
            color: white;
            border: none;
            width: auto;
            padding: 8px 16px;
            font-size: 0.85rem;
        }
        .settings-btn.btn-logout:active {
            transform: scale(0.95);
        }

        .btn-cancel {
            background: rgba(255, 255, 255, 0.1);
            color: white;
            border: none;
            border-radius: var(--radius-medium);
            padding: 12px 20px;
            font-weight: 600;
            cursor: pointer;
            flex: 1;
        }

        .btn-yes {
            background: #C42833;
            color: white;
            border: none;
            border-radius: var(--radius-medium);
            padding: 12px 20px;
            font-weight: 600;
            cursor: pointer;
            flex: 1;
        }
        
    </style>
</head>
<body>
    <div class="container">
        <a href="../index.html" class="back-link fade-in" onclick="window.location.hash='';">
            <i class="fas fa-arrow-left"></i> Back to Home
        </a>

        <app-header class="fade-in">
            <div>
                <h1 class="username">Github Repo Manager</h1>
                <p class="tagline">Browse your repository files and open them directly on GitHub without waiting to loads every pages</p>
            </div>
        </app-header>

        <div id="loginSection">
            <div class="login-panel">
                <input type="text" id="repoOwner" placeholder="Repository Owner">
                <input type="text" id="repoName" placeholder="Repository Name">
                <input type="text" id="branch" placeholder="Branch" value="main">
                <input type="password" id="token" placeholder="GitHub Token">
                <button id="loadRepoBtn">Load Repository</button>
            </div>
        </div>

        <div id="repoContent" style="display: none;">
            <div style="display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:8px;">
                <div style="display:flex; align-items:center; gap:10px;">
                    <button id="homeBtn" class="home-btn" onclick="navigateTo('')"><i class="fas fa-home"></i></button>
                    <button id="backBtn" class="pill-btn" onclick="pressAnim(this); goBack()"><i class="fas fa-arrow-left"></i> Back</button>
                </div>
                <button id="logoutBtn" class="settings-btn btn-logout" onclick="pressAnim(this); openLogoutPopup()"><i class="fas fa-sign-out-alt"></i> Logout</button>
            </div>
            <div id="breadcrumbText" style="color:var(--text-secondary); font-size:0.85rem; margin-bottom:12px;"></div>
            <div class="files-grid" id="filesContainer"></div>
        </div>

        <footer>
            <div class="social-links">
                <a href="https://twitter.com/lildavegoth"><span class="icon icon-twitter"></span></a>
                <a href="https://instagram.com/dave_goth"><span class="icon icon-instagram"></span></a>
            </div>
            <p>© 2026 lildavegoth | Github Repo Manager</p>
            <p style="margin-top: 8px; font-size: 0.8rem; color: #666;">
                Conveys the Idea of a Protected and Inspiring Space for Creative Expression.
            </p>
        </footer>
    </div>

    <div id="universalPopup" class="popup-overlay" style="display: none;">
        <div class="popup-content">
            <div class="popup-header">
                <h2 id="popupTitle"></h2>
                <button class="close-popup" onclick="closeUniversalPopup()">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            <div class="popup-body" id="popupBody"></div>
            <div class="popup-footer" id="popupFooter"></div>
        </div>
    </div>

    <script>
        let fullTree = [];
        let childrenMap = {};
        let currentPath = '';
        let longPressTimer;
        let longPressStartX;
        let longPressStartY;

        const loginSection = document.getElementById('loginSection');
        const repoContent = document.getElementById('repoContent');
        const filesContainer = document.getElementById('filesContainer');

        document.getElementById('loadRepoBtn').addEventListener('click', loadRepository);

        loadSavedConfig();
        attemptAutoLogin();

        function getConfig() {
            return {
                owner: document.getElementById('repoOwner').value.trim(),
                repo: document.getElementById('repoName').value.trim(),
                branch: document.getElementById('branch').value.trim() || 'main',
                token: document.getElementById('token').value.trim()
            };
        }

        function saveConfig(config) {
            localStorage.setItem('githubRepo', JSON.stringify(config));
        }

        function loadSavedConfig() {
            const saved = localStorage.getItem('githubRepo');
            if (saved) {
                try {
                    const cfg = JSON.parse(saved);
                    document.getElementById('repoOwner').value = cfg.owner || '';
                    document.getElementById('repoName').value = cfg.repo || '';
                    document.getElementById('branch').value = cfg.branch || 'main';
                    document.getElementById('token').value = cfg.token || '';
                    return true;
                } catch (e) {
                    return false;
                }
            }
            return false;
        }

        function attemptAutoLogin() {
            if (loadSavedConfig()) {
                loadRepository();
            }
        }

        async function loadRepository() {
            const config = getConfig();
            if (!config.owner || !config.repo || !config.token) {
                window.showMessage('Error', 'Please fill all fields.');
                resetToLogin();
                return;
            }
            saveConfig(config);
            filesContainer.innerHTML = '<div style="text-align:center;padding:40px;color:var(--text-secondary);"><i class="fas fa-spinner fa-spin"></i> Loading...</div>';
            loginSection.style.display = 'none';
            repoContent.style.display = 'block';
            currentPath = '';

            try {
                const response = await fetch(`https://api.github.com/repos/${config.owner}/${config.repo}/git/trees/${config.branch}?recursive=1&t=${Date.now()}`, {
                    headers: { 'Authorization': `token ${config.token}`, 'Accept': 'application/vnd.github.v3+json' }
                });
                if (!response.ok) throw new Error('Failed to fetch tree: ' + response.statusText);
                const data = await response.json();
                fullTree = data.tree.filter(item => item.type === 'blob' || item.type === 'tree');
                await enrichDates(config);
                buildChildrenMap();
                renderCurrentFolder();
            } catch (error) {
                filesContainer.innerHTML = '';
                window.showMessage('Error', error.message);
                resetToLogin();
            }
        }

        function resetToLogin() {
            loginSection.style.display = 'block';
            repoContent.style.display = 'none';
        }

        async function enrichDates(config) {
            const datePromises = fullTree.map(async (item) => {
                if (item.type === 'tree') {
                    item.lastDate = 'Folder';
                    return;
                }
                try {
                    const res = await fetch(`https://api.github.com/repos/${config.owner}/${config.repo}/commits?path=${encodeURIComponent(item.path)}&per_page=1`, {
                        headers: { 'Authorization': `token ${config.token}`, 'Accept': 'application/vnd.github.v3+json' }
                    });
                    if (!res.ok) throw new Error('Commit fetch failed');
                    const commits = await res.json();
                    if (commits.length > 0) {
                        const date = new Date(commits[0].commit.committer.date);
                        item.lastDate = date.toLocaleDateString('en-US', { weekday: 'short', day: 'numeric' });
                    } else {
                        item.lastDate = 'Unknown';
                    }
                } catch {
                    item.lastDate = 'N/A';
                }
            });
            await Promise.all(datePromises);
        }

        function buildChildrenMap() {
            childrenMap = { '': [] };
            fullTree.forEach(item => {
                const dir = item.path.includes('/') ? item.path.substring(0, item.path.lastIndexOf('/')) + '/' : '';
                if (!childrenMap[dir]) childrenMap[dir] = [];
                childrenMap[dir].push(item);
            });
        }

        function renderCurrentFolder() {
            filesContainer.innerHTML = '';
            const items = childrenMap[currentPath] || [];
            items.sort((a, b) => {
                if (a.type !== b.type) return a.type === 'tree' ? -1 : 1;
                return a.path.localeCompare(b.path);
            });

            if (items.length === 0) {
                filesContainer.innerHTML = '<div style="text-align:center;padding:20px;color:var(--text-secondary);">Empty folder</div>';
            } else {
                const config = getConfig();
                items.forEach(item => {
                    if (item.type === 'tree') {
                        const card = document.createElement('div');
                        card.className = 'file-card folder-item';
                        card.innerHTML = `
                            <span class="file-name">
                                <i class="fas fa-folder" style="color: var(--accent-color); width: 20px;"></i>
                                ${item.path.split('/').pop()}
                            </span>
                            <span class="file-date">${item.lastDate}</span>
                        `;
                        card.addEventListener('click', () => navigateTo(item.path + '/'));
                        card.addEventListener('touchstart', function(e) { startLongPress(e, item); }, { passive: true });
                        card.addEventListener('touchend', cancelLongPress);
                        card.addEventListener('touchmove', cancelLongPress);
                        filesContainer.appendChild(card);
                    } else {
                        const url = `https://github.com/${config.owner}/${config.repo}/blob/${config.branch}/${item.path}`;
                        const card = document.createElement('a');
                        card.className = 'file-card';
                        card.href = url;
                        card.target = '_blank';
                        card.innerHTML = `
                            <span class="file-name">
                                <i class="fas fa-file" style="color: var(--accent-color); width: 20px;"></i>
                                ${item.path.split('/').pop()}
                            </span>
                            <span class="file-date">${item.lastDate}</span>
                        `;
                        filesContainer.appendChild(card);
                    }
                });
            }
            renderBreadcrumb();
        }

        function renderBreadcrumb() {
            const breadcrumbText = document.getElementById('breadcrumbText');
            if (!breadcrumbText) return;
            if (currentPath === '') {
                breadcrumbText.textContent = 'root';
            } else {
                const cleanPath = currentPath.replace(/\/$/, '');
                breadcrumbText.textContent = 'root/' + cleanPath;
            }
            const backBtn = document.getElementById('backBtn');
            if (backBtn) {
                backBtn.disabled = (currentPath === '');
            }
        }

        function goBack() {
            if (currentPath === '') return;
            const parts = currentPath.split('/').filter(p => p);
            parts.pop();
            const parentPath = parts.length > 0 ? parts.join('/') + '/' : '';
            navigateTo(parentPath);
        }

        function navigateTo(path) {
            currentPath = path;
            renderCurrentFolder();
        }

        function openLogoutPopup() {
            const popup = document.getElementById('universalPopup');
            document.getElementById('popupTitle').textContent = 'Logout';
            document.getElementById('popupBody').innerHTML = '<p style="color:var(--text-primary);">Are you sure you want to logout?</p>';
            document.getElementById('popupFooter').innerHTML = `
                <button class="btn-cancel" onclick="closeUniversalPopup()">Cancel</button>
                <button class="btn-yes" id="confirmLogout">Logout</button>
            `;
            popup.style.display = 'flex';

            document.getElementById('confirmLogout').onclick = () => {
                closeUniversalPopup();
                logout();
            };
        }

        function logout() {
            localStorage.removeItem('githubRepo');
            location.reload();
        }

        function closeUniversalPopup() {
            document.getElementById('universalPopup').style.display = 'none';
        }
        
        function pressAnim(el) {
            el.classList.add('btnMDYE');
            setTimeout(function() {
                el.classList.remove('btnMDYE');
            }, 500);
        }
        
        function startLongPress(e, item) {
            e.preventDefault();
            longPressStartX = e.touches ? e.touches[0].clientX : e.clientX;
            longPressStartY = e.touches ? e.touches[0].clientY : e.clientY;
            longPressTimer = setTimeout(function() {
                triggerNativeContext(longPressStartX, longPressStartY);
            }, 800);
        }

        function cancelLongPress() {
            clearTimeout(longPressTimer);
        }

        function triggerNativeContext(x, y) {
            var event = new MouseEvent('contextmenu', {
                bubbles: true,
                cancelable: false,
                view: window,
                button: 2,
                clientX: x,
                clientY: y
            });
            document.elementFromPoint(x, y).dispatchEvent(event);
        }

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                closeUniversalPopup();
            }
        });
    </script>
</body>
</html>
