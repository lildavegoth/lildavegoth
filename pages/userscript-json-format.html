<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Userscript to JSON Format | lildavegoth</title>
    <meta name="color-scheme" content="dark">
    <script src="../cordova.js"></script>
    <script src="../protections.js"></script>
    <script src="../notification.cssjs"></script>
    <link rel="stylesheet" href="../media.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --accent-color: #C1FC32;
            --accent-dark: #9bc726;
            --bg-black: #000000;
            --bg-dark: #1a1a1a;
            --bg-card: rgba(30, 30, 30, 0.7);
            --text-primary: #f5f5f7;
            --text-secondary: #a1a1a6;
            --radius-small: 12px;
            --radius-medium: 20px;
            --radius-large: 28px;
            --spacing-xs: 8px;
            --spacing-sm: 16px;
            --spacing-md: 24px;
            --spacing-lg: 32px;
            --spacing-xl: 48px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-black);
            color: var(--text-primary);
            min-height: 100vh;
            background-image: 
                radial-gradient(circle at 20% 80%, rgba(193, 252, 50, 0.05) 0%, transparent 20%),
                radial-gradient(circle at 80% 20%, rgba(193, 252, 50, 0.03) 0%, transparent 20%);
            overflow-x: hidden;
            padding-bottom: 90px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: var(--spacing-md);
            position: relative;
            min-height: calc(100vh - 90px);
        }

        .app-header {
            margin-bottom: var(--spacing-xl);
            text-align: center;
        }

        .app-header h1 {
            font-size: 2rem;
            background: linear-gradient(90deg, var(--accent-color), #e8f8b6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: var(--spacing-xs);
        }

        .app-header p {
            color: var(--text-secondary);
            font-size: 0.95rem;
        }

        .form-group {
            margin-bottom: var(--spacing-lg);
        }

        .form-group label {
            display: block;
            margin-bottom: var(--spacing-sm);
            font-weight: 500;
            color: var(--text-primary);
            font-size: 1rem;
        }

        textarea {
            width: 100%;
            padding: var(--spacing-md);
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: var(--radius-medium);
            color: var(--text-primary);
            font-size: 0.9rem;
            line-height: 1.5;
            outline: none;
            transition: border-color 0.3s ease;
            resize: none;
            font-family: 'SF Mono', 'Fira Code', monospace;
        }

        textarea:focus {
            border-color: var(--accent-color);
        }

        .button-group {
            display: flex;
            gap: var(--spacing-md);
            justify-content: center;
            margin: var(--spacing-lg) 0;
        }

        .action-btn {
            background: var(--accent-color);
            color: #000000;
            border: none;
            border-radius: var(--radius-medium);
            padding: 12px 24px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s ease, background 0.2s ease;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            min-width: 120px;
        }

        .action-btn i {
            font-size: 1.2rem;
        }

        .action-btn:active {
            transform: scale(0.96);
        }

        .action-btn:hover {
            background: var(--accent-dark);
            transform: translateY(-2px);
        }

        .output-section {
            margin-top: var(--spacing-lg);
        }

        .output-header {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            margin-bottom: var(--spacing-sm);
        }

        .output-header h3 {
            font-size: 1.2rem;
            font-weight: 500;
        }

        @media (max-width: 768px) {
            .button-group {
                flex-direction: row;
                justify-content: center;
            }
            .action-btn {
                width: auto;
                min-width: 120px;
            }
            .container {
                padding: var(--spacing-sm);
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="app-header">
            <h1>Userscript to JSON Format</h1>
            <p>Convert userscript metadata to structured JSON</p>
        </div>

        <div class="form-group">
            <label><i class="fas fa-code" style="margin-right: 8px; color: var(--accent-color);"></i> Paste Userscript Code</label>
            <textarea id="inputScript" rows="12" placeholder='// ==UserScript==
// @name         My Userscript
// @description  Short description of what this script does
// ==/UserScript==

(function() {
    // your code here
})();'></textarea>
        </div>

        <div class="button-group">
            <button id="convertBtn" class="action-btn"><i class="fas fa-arrow-right-to-bracket"></i> Convert</button>
            <button id="copyBtn" class="action-btn"><i class="fas fa-copy"></i> Copy</button>
        </div>

        <div class="output-section">
            <div class="output-header">
                <h3><i class="fas fa-brackets-curly" style="margin-right: 8px; color: var(--accent-color);"></i> Generated JSON</h3>
            </div>
            <textarea id="outputJson" rows="12" readonly placeholder="JSON output will appear here..." style="background: rgba(0,0,0,0.6);"></textarea>
        </div>
    </div>

    <script>
        (function() {
            const inputArea = document.getElementById('inputScript');
            const outputArea = document.getElementById('outputJson');
            const convertBtn = document.getElementById('convertBtn');
            const copyBtn = document.getElementById('copyBtn');

            function extractMetadata(scriptText) {
                let title = "Untitled Userscript";
                let description = "No description provided";
                const nameMatch = scriptText.match(/\/\/\s*@name\s+(.+)/i);
                if (nameMatch && nameMatch[1]) {
                    title = nameMatch[1].trim();
                }
                const descMatch = scriptText.match(/\/\/\s*@description\s+(.+)/i);
                if (descMatch && descMatch[1]) {
                    description = descMatch[1].trim();
                }
                return { title, description };
            }

            function generateJsonFromScript(scriptCode) {
                const { title, description } = extractMetadata(scriptCode);
                const today = new Date();
                const year = today.getFullYear();
                const month = String(today.getMonth() + 1).padStart(2, '0');
                const day = String(today.getDate()).padStart(2, '0');
                const createdAt = `${year}-${month}-${day}`;
                const jsonObject = {
                    id: "1",
                    title: title,
                    tag: "Browser",
                    description: description,
                    code: scriptCode,
                    createdAt: createdAt
                };
                return JSON.stringify(jsonObject, null, 4);
            }

            function handleConvert() {
                const rawScript = inputArea.value;
                if (!rawScript.trim()) {
                    outputArea.value = '';
                    return;
                }
                const jsonResult = generateJsonFromScript(rawScript);
                outputArea.value = jsonResult;
            }

            function copyTextToClipboard(text) {
                return new Promise((resolve, reject) => {
                    if (navigator.clipboard && navigator.clipboard.writeText) {
                        navigator.clipboard.writeText(text).then(resolve).catch(reject);
                    } else {
                        reject(new Error('Clipboard API not available'));
                    }
                });
            }

            async function handleCopy() {
                const jsonText = outputArea.value;
                if (!jsonText || jsonText.trim() === '') {
                    alert('No JSON content to copy. Generate JSON first.');
                    return;
                }

                let success = false;
                try {
                    await copyTextToClipboard(jsonText);
                    success = true;
                } catch (e) {
                    const textarea = document.createElement('textarea');
                    textarea.value = jsonText;
                    textarea.style.position = 'fixed';
                    textarea.style.top = '-1000px';
                    textarea.style.left = '-1000px';
                    document.body.appendChild(textarea);
                    textarea.focus();
                    textarea.select();

                    let copyResult = false;
                    try {
                        copyResult = document.execCommand('copy');
                    } catch (err) {
                        copyResult = false;
                    }
                    document.body.removeChild(textarea);
                    if (copyResult) {
                        success = true;
                    } else {
                        alert('Unable to copy. Please select the text manually.');
                    }
                }

                if (success) {
                    const originalHTML = copyBtn.innerHTML;
                    copyBtn.innerHTML = '<i class="fas fa-check"></i> Copied!';
                    setTimeout(() => {
                        copyBtn.innerHTML = originalHTML;
                    }, 1800);
                }
            }

            convertBtn.addEventListener('click', handleConvert);
            copyBtn.addEventListener('click', handleCopy);
        })();
    </script>
</body>
</html>
