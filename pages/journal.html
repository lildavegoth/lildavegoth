<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Journal | lildavegoth</title>
    <meta name="color-scheme" content="dark">
    <script src="../protections.js"></script>
    <script src="../notification.cssjs"></script>
    <link rel="stylesheet" href="../media.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --accent-color: #C1FC32;
            --accent-dark: #9bc726;
            --bg-black: #000000;
            --bg-dark: #1a1a1a;
            --bg-card: rgba(30, 30, 30, 0.7);
            --text-primary: #f5f5f7;
            --text-secondary: #a1a1a6;
            --radius-small: 12px;
            --radius-medium: 20px;
            --radius-large: 28px;
            --spacing-xs: 8px;
            --spacing-sm: 16px;
            --spacing-md: 24px;
            --spacing-lg: 32px;
            --spacing-xl: 48px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-black);
            color: var(--text-primary);
            min-height: 100vh;
            overflow-x: hidden;
            padding-bottom: 90px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: var(--spacing-md);
        }

        .greeting h1 {
            font-size: 28px;
            font-weight: 700;
        }

        .week-strip {
            margin-bottom: var(--spacing-lg);
        }

        .weekdays {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 8px;
            margin-bottom: 12px;
            text-align: center;
        }

        .weekday {
            font-size: 12px;
            font-weight: 600;
            color: var(--text-secondary);
            padding: 8px 0;
        }

        .date-circles {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 8px;
        }

        .date-circle {
            aspect-ratio: 1;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: var(--bg-card);
            border: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 500;
            color: var(--text-primary);
            transition: all 0.2s ease;
        }

        .date-circle:hover {
            background: rgba(193, 252, 50, 0.2);
            transform: scale(1.05);
        }

        .date-circle.current {
            background: var(--accent-color);
            color: #000;
            font-weight: 700;
        }

        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: var(--spacing-sm);
        }

        .section-header h2 {
            font-size: 20px;
            font-weight: 600;
        }

        .add-btn {
            background: transparent;
            border: none;
            color: var(--accent-color);
            font-size: 24px;
            cursor: pointer;
        }
        
        .journal-card {
            min-width: 95%;
            max-width: 500px;
            width: auto;
            background: var(--bg-card);
            border-radius: var(--radius-large);
            padding: var(--spacing-lg);
            border: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            flex-direction: column;
            cursor: pointer;
            transition: all 0.2s ease;
            height: 350px;
        }

        .journal-cards,
        .quick-cards {
            display: flex;
            gap: var(--spacing-sm);
            overflow-x: auto;
            padding-bottom: var(--spacing-sm);
            scrollbar-width: none;
            -ms-overflow-style: none;
        }

        .journal-cards::-webkit-scrollbar,
        .quick-cards::-webkit-scrollbar {
            display: none;
        }

        .journal-card,
        .quick-card {
            min-width: 95%;
            background: var(--bg-card);
            border-radius: var(--radius-large);
            padding: var(--spacing-lg);
            border: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            flex-direction: column;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .quick-card {
            min-width: 70%;
            max-width: 450px;
            width: auto;
            background: var(--bg-card);
            border-radius: var(--radius-large);
            padding: var(--spacing-lg);
            border: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            flex-direction: column;
            cursor: pointer;
            transition: all 0.2s ease;
            height: 190px;
        }

        .journal-card:hover,
        .quick-card:hover {
            border-color: rgba(193, 252, 50, 0.3);
        }

        .journal-card h3,
        .quick-card h3 {
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .quick-card .icon {
            font-size: 32px;
            margin-bottom: var(--spacing-sm);
            cursor: pointer;
        }

        .journal-card p,
        .quick-card p {
            font-size: 14px;
            color: var(--text-secondary);
        }

        .journal-content {
            font-size: 15px;
            line-height: 1.6;
            white-space: pre-line;
            word-break: break-word;
            margin-top: var(--spacing-sm);
            overflow-y: auto;
            flex: 1;
            max-height: 250px;
            padding-right: 4px;
        }
        
        .journal-content::-webkit-scrollbar {
            width: 4px;
        }
        
        .journal-content::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.05);
        }
        
        .journal-content::-webkit-scrollbar-thumb {
            background: var(--accent-color);
            border-radius: 4px;
            margin-left: 10px;
        }

        .popup-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 1.0);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 99999999;
            animation: fadeIn 0.3s ease;
        }
        
        .popup-content {
            background: var(--bg-card);
            border-radius: var(--radius-large);
            width: 90%;
            max-width: 500px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
            max-height: 70vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        
        .popup-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: var(--spacing-md);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .popup-header h2 {
            font-size: 1.5rem;
            font-weight: 600;
        }
        
        .close-popup {
            background: transparent;
            border: none;
            color: var(--text-secondary);
            font-size: 1.2rem;
            cursor: pointer;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .popup-textarea {
            width: 100%;
            padding: 16px;
            background: var(--bg-dark);
            border: none;
            border-radius: 0;
            color: var(--text-primary);
            font-size: 16px;
            min-height: 300px;
            resize: vertical;
            margin: 0;
            flex: 1;
            line-height: 1.6;
        }
        
        .popup-textarea:focus {
            outline: none;
        }
        
        .popup-footer {
            display: flex;
            gap: 8px;
            padding: 16px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            background: var(--bg-card);
        }
        
        .popup-footer .popup-btn {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: var(--radius-small);
            font-weight: 600;
            cursor: pointer;
        }
        
        .popup-footer .delete-btn {
            flex: 0.5;
            background: rgba(255, 59, 48, 0.2);
            color: #ff3b30;
            border: 1px solid rgba(255, 59, 48, 0.3);
        }
        
        .popup-footer .delete-btn:hover {
            background: rgba(255, 59, 48, 0.3);
        }
        
        .popup-btn {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: var(--radius-small);
            font-weight: 600;
            cursor: pointer;
        }
        
        .popup-btn-primary {
            background: var(--accent-color);
            color: #000;
        }
        
        .popup-btn-secondary {
            background: var(--bg-dark);
            color: var(--text-primary);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .tools-grid {
            overflow-y: auto;
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 0;
        }

    </style>
</head>
<body>
    <div class="container">
        <a href="../index.html" class="back-link">
            <i class="fas fa-arrow-left"></i> Back to Home
        </a>

        <div class="greeting">
            <h1 id="greetingName">lildavegoth's Journal</h1>
        </div>
        
        <div class="search-container" style="margin-bottom: var(--spacing-md); position: relative;">
            <div style="position: relative;">
                <input type="text" id="globalSearch" placeholder="Search your journal entries..." 
                       style="width: 100%; padding: 12px 44px 12px 16px; border-radius: var(--radius-medium); 
                              background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.1); 
                              color: var(--text-primary); font-size: 0.95rem; outline: none;">
                <div style="position: absolute; right: 12px; top: 50%; transform: translateY(-50%); 
                            color: var(--text-secondary); pointer-events: none;">
                    <i class="fas fa-search" style="color: var(--accent-color); margin-right: 5px;"></i>
                </div>
            </div>
            <div class="search-suggestions" id="searchSuggestions" style="display: none; position: absolute; top: 100%; left: 0; right: 0; background: var(--bg-card); border-radius: var(--radius-medium); margin-top: 4px; padding: 8px 0; z-index: 1000; max-height: 300px; overflow-y: auto; border: 1px solid rgba(255, 255, 255, 0.1); backdrop-filter: blur(10px);"></div>
        </div>

        <div style="margin-top: 10px;" class="week-strip">
            <div class="weekdays" id="weekdays"></div>
            <div class="date-circles" id="dateCircles"></div>
        </div>
        
        <div class="section-header">
            <h2>Quick Journal</h2>
            <button class="add-btn" id="addQuickBtn"><i class="fas fa-plus"></i></button>
        </div>

        <div class="quick-cards" id="quickCards"></div>

        <div class="section-header">
            <h2>My Journal</h2>
            <button class="add-btn" id="addMyBtn"><i class="fas fa-plus"></i></button>
        </div>

        <div class="journal-cards" id="journalCards"></div>

        <div id="universalPopup" class="popup-overlay">
            <div class="popup-content">
                <div class="popup-header">
                    <h2 id="popupTitle"></h2>
                    <button class="close-popup" onclick="closeUniversalPopup()">
                        <i class="fas fa-times"></i>
                    </button>
                </div>
                <div class="tools-grid" id="popupContent"></div>
                <div class="popup-footer" id="popupFooter"></div>
            </div>
        </div>
        
        <div id="confirmPopup" class="popup-overlay" style="display: none;">
            <div class="popup-content" style="max-width: 350px;">
                <div class="popup-header">
                    <h2>Confirm Delete</h2>
                    <button class="close-popup" onclick="closeConfirmPopup()">
                        <i class="fas fa-times"></i>
                    </button>
                </div>
                <div class="tools-grid" style="padding: 24px; text-align: center;">
                    <p id="confirmMessage" style="margin-bottom: 24px; font-size: 16px;">Are you sure you want to delete this entry?</p>
                    <div style="display: flex; gap: 8px;">
                        <button class="popup-btn popup-btn-primary" onclick="confirmDelete()">Delete</button>
                        <button class="popup-btn popup-btn-secondary" onclick="closeConfirmPopup()">Cancel</button>
                    </div>
                </div>
            </div>
        </div>
        
        <div id="addJournalPopup" class="popup-overlay" style="display: none;">
            <div class="popup-content" style="max-width: 400px;">
                <div class="popup-header">
                    <h2>Add New Journal</h2>
                    <button class="close-popup" onclick="closeAddJournalPopup()">
                        <i class="fas fa-times"></i>
                    </button>
                </div>
                <div class="tools-grid" style="padding: 24px;">
                    <input type="text" id="journalTitleInput" class="popup-textarea" style="min-height: auto; height: 50px; margin-bottom: 16px;" placeholder="Enter title">
                    <div style="display: flex; gap: 8px;">
                        <button class="popup-btn popup-btn-primary" onclick="saveNewJournal()">Add</button>
                        <button class="popup-btn popup-btn-secondary" onclick="closeAddJournalPopup()">Cancel</button>
                    </div>
                </div>
            </div>
        </div>
        
        <div id="addQuickPopup" class="popup-overlay" style="display: none;">
            <div class="popup-content" style="max-width: 400px;">
                <div class="popup-header">
                    <h2>Add New Quick Journal</h2>
                    <button class="close-popup" onclick="closeAddQuickPopup()">
                        <i class="fas fa-times"></i>
                    </button>
                </div>
                <div class="tools-grid" style="padding: 24px;">
                    <input type="text" id="quickTitleInput" class="popup-textarea" style="min-height: auto; height: 50px; margin-bottom: 16px;" placeholder="Enter title">
                    <input type="text" id="quickPromptInput" class="popup-textarea" style="min-height: auto; height: 50px; margin-bottom: 16px;" placeholder="Enter journal...">
                    <input type="text" id="quickEmojiInput" class="popup-textarea" style="min-height: auto; height: 50px; margin-bottom: 16px;" placeholder="Enter emoji (e.g., 🌟)" value="🌟">
                    <div style="display: flex; gap: 8px;">
                        <button class="popup-btn popup-btn-primary" onclick="saveNewQuick()">Add</button>
                        <button class="popup-btn popup-btn-secondary" onclick="closeAddQuickPopup()">Cancel</button>
                    </div>
                </div>
            </div>
        </div>
        
        <div id="emojiPopup" class="popup-overlay" style="display: none;">
            <div class="popup-content" style="max-width: 350px;">
                <div class="popup-header">
                    <h2>Change Emoji</h2>
                    <button class="close-popup" onclick="closeEmojiPopup()">
                        <i class="fas fa-times"></i>
                    </button>
                </div>
                <div class="tools-grid" style="padding: 24px; text-align: center;">
                    <input type="text" id="emojiInput" class="popup-textarea" style="min-height: auto; height: 80px; font-size: 32px; text-align: center; margin-bottom: 16px;" placeholder="Enter one emoji" maxlength="1">
                    <div style="display: flex; gap: 8px;">
                        <button class="popup-btn popup-btn-primary" onclick="saveEmoji()">Save</button>
                        <button class="popup-btn popup-btn-secondary" onclick="closeEmojiPopup()">Cancel</button>
                    </div>
                </div>
            </div>
        </div>
        
        <footer>
            <div class="social-links">
                <a href="https://twitter.com/lildavegoth"><span class="icon icon-twitter"></span></a>
                <a href="https://instagram.com/dave_goth"><span class="icon icon-instagram"></span></a>
            </div>
            <p>© 2026 lildavegoth | Journal</p>
            <p style="margin-top: 8px; font-size: 0.8rem; color: #666;">
                Conveys the Idea of a Protected and Inspiring Space for Creative Expression.
            </p>
        </footer>
    </div>

    <script>
        let today = new Date(2026, 1, 15);
        let todayStr = today.toISOString().split('T')[0];
        let currentWeekStart = new Date(today);
        const day = today.getDay();
        currentWeekStart.setDate(today.getDate() - day);
        
        let username = localStorage.getItem('journalUsername') || 'lildavegoth';
        document.getElementById('greetingName').textContent = username + "'s Journal";
        
        const greetingName = document.getElementById('greetingName');
        greetingName.style.cursor = 'pointer';
        greetingName.addEventListener('click', () => {
            const input = document.createElement('input');
            input.value = username;
            input.style.fontSize = '28px';
            input.style.fontWeight = '700';
            input.style.background = 'transparent';
            input.style.border = 'none';
            input.style.color = 'var(--text-primary)';
            input.style.outline = 'none';
            input.style.width = '200px';
            greetingName.textContent = '';
            greetingName.appendChild(input);
            input.focus();
            input.select();
            const save = () => {
                let newName = input.value.trim() || 'User';
                const words = newName.split(' ');
                if (words.length > 15) {
                    newName = words.slice(0, 15).join(' ');
                }
                username = newName;
                localStorage.setItem('journalUsername', username);
                greetingName.textContent = username + "'s Journal";
                greetingName.style.cursor = 'pointer';
            };
            input.addEventListener('blur', save);
            input.addEventListener('keydown', (e) => {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    save();
                }
            });
        });
        
        const weekdaysContainer = document.getElementById('weekdays');
        const dateCircles = document.getElementById('dateCircles');
        const dayNames = ['S', 'M', 'T', 'W', 'T', 'F', 'S'];
        dayNames.forEach((day, i) => {
            const div = document.createElement('div');
            div.className = 'weekday';
            div.textContent = day;
            if (i === 0) div.style.color = 'var(--accent-color)';
            weekdaysContainer.appendChild(div);
        });
        
        function renderWeek() {
            dateCircles.innerHTML = '';
            for (let i = 0; i < 7; i++) {
                const date = new Date(currentWeekStart);
                date.setDate(currentWeekStart.getDate() + i);
                const div = document.createElement('div');
                div.className = 'date-circle';
                const dateStr = date.toISOString().split('T')[0];
                if (dateStr === todayStr) div.classList.add('current');
                div.textContent = date.getDate();
                div.dataset.date = dateStr;
                div.addEventListener('click', () => loadJournalForDate(dateStr));
                dateCircles.appendChild(div);
            }
        }
        
        let touchStartX = 0;
        let touchEndX = 0;
        
        dateCircles.addEventListener('touchstart', (e) => {
            touchStartX = e.changedTouches[0].screenX;
        }, false);
        
        dateCircles.addEventListener('touchend', (e) => {
            touchEndX = e.changedTouches[0].screenX;
            handleSwipe();
        }, false);
        
        dateCircles.addEventListener('mousedown', (e) => {
            touchStartX = e.screenX;
        });
        
        dateCircles.addEventListener('mouseup', (e) => {
            touchEndX = e.screenX;
            handleSwipe();
        });
        
        function handleSwipe() {
            const swipeThreshold = 50;
            if (touchEndX < touchStartX - swipeThreshold) {
                currentWeekStart.setDate(currentWeekStart.getDate() + 7);
                renderWeek();
            }
            if (touchEndX > touchStartX + swipeThreshold) {
                currentWeekStart.setDate(currentWeekStart.getDate() - 7);
                renderWeek();
            }
        }
        
        let quickTypes = [];
        let quickEmojis = {};
        let dailyContents = JSON.parse(localStorage.getItem('dailyJournalContents')) || {};
        
        const sevenDaysAgo = new Date(today);
        sevenDaysAgo.setDate(today.getDate() - 7);
        Object.keys(dailyContents).forEach(key => {
            if (new Date(key) < sevenDaysAgo) delete dailyContents[key];
        });
        localStorage.setItem('dailyJournalContents', JSON.stringify(dailyContents));
        
        if (!dailyContents[todayStr]) dailyContents[todayStr] = { quick: {}, additional: [] };
        let todayContent = dailyContents[todayStr];
        if (!todayContent.quick) todayContent.quick = {};
        if (!todayContent.additional) todayContent.additional = [];
        
        function saveDaily() {
            dailyContents[todayStr] = todayContent;
            localStorage.setItem('dailyJournalContents', JSON.stringify(dailyContents));
        }
        
        let currentEditing = null;
        let pendingDelete = null;
        let currentEmojiId = null;
        let currentTitle = '';
        
        function openPopup(type, content, title) {
            const popup = document.getElementById('universalPopup');
            const popupTitle = document.getElementById('popupTitle');
            const popupContent = document.getElementById('popupContent');
            const popupFooter = document.getElementById('popupFooter');
            
            currentEditing = type;
            currentTitle = title;
            popupTitle.textContent = title;
            
            popupContent.innerHTML = '<textarea id="popupTextarea" class="popup-textarea" placeholder="Write your reflection..."></textarea>';
            
            const safeType = type.replace(/'/g, "\\'");
            popupFooter.innerHTML = `
                <button class="popup-btn popup-btn-primary" onclick="window.savePopup('${safeType}')">Save</button>
                <button class="popup-btn popup-btn-secondary" onclick="window.closeUniversalPopup()">Cancel</button>
                <button class="popup-btn delete-btn" onclick="window.deletePopup('${safeType}')"><i class="fas fa-trash"></i></button>
            `;
            
            document.getElementById('popupTextarea').value = content;
            popup.style.display = 'flex';
        }
        
        window.saveNewJournal = function() {
            const title = document.getElementById('journalTitleInput').value.trim();
            if (!title) return;
            const id = Date.now().toString();
            todayContent.additional.push({ id, title, content: '' });
            saveDaily();
            renderMyJournal();
            closeAddJournalPopup();
            window.showMessage('Journal added');
        }
        
        window.closeAddJournalPopup = function() {
            document.getElementById('addJournalPopup').style.display = 'none';
        }
        
        window.saveNewQuick = function() {
            const title = document.getElementById('quickTitleInput').value.trim();
            const promptText = document.getElementById('quickPromptInput').value.trim();
            const emoji = document.getElementById('quickEmojiInput').value.trim() || '🌟';
            if (!title || !promptText) return;
            const id = Date.now().toString();
            quickTypes.push({ id, emoji, title, prompt: promptText });
            quickEmojis[id] = emoji;
            localStorage.setItem('quickTypes', JSON.stringify(quickTypes));
            localStorage.setItem('quickEmojis', JSON.stringify(quickEmojis));
            renderQuick();
            closeAddQuickPopup();
            window.showMessage('Quick journal added');
        }
        
        window.closeAddQuickPopup = function() {
            document.getElementById('addQuickPopup').style.display = 'none';
        }
        
        window.savePopup = function(type) {
            const value = document.getElementById('popupTextarea').value;
            if (type.startsWith('quick-')) {
                const id = type.split('-')[1];
                todayContent.quick[id] = value;
            } else if (type.startsWith('additional-')) {
                const id = type.split('-')[1];
                const item = todayContent.additional.find(a => a.id === id);
                if (item) item.content = value;
            }
            saveDaily();
            renderMyJournal();
            renderQuick();
            closeUniversalPopup();
            window.showMessage('Journal saved');
        }
        
        window.deletePopup = function(type) {
            pendingDelete = type;
            let message = "Are you sure you want to delete this entry?";
            if (type.startsWith('quick-')) {
                message = "Are you sure you want to permanently delete this Quick Journal? This cannot be undone and will remove it from all days.";
            }
            document.getElementById('confirmMessage').textContent = message;
            document.getElementById('confirmPopup').style.display = 'flex';
        }
        
        window.confirmDelete = function() {
            if (pendingDelete.startsWith('quick-')) {
                const id = pendingDelete.split('-')[1];
                quickTypes = quickTypes.filter(q => q.id !== id);
                delete quickEmojis[id];
                localStorage.setItem('quickTypes', JSON.stringify(quickTypes));
                localStorage.setItem('quickEmojis', JSON.stringify(quickEmojis));
                Object.keys(dailyContents).forEach(date => {
                    if (dailyContents[date] && dailyContents[date].quick && dailyContents[date].quick.hasOwnProperty(id)) {
                        delete dailyContents[date].quick[id];
                    }
                });
                localStorage.setItem('dailyJournalContents', JSON.stringify(dailyContents));
                window.showMessage('Quick Journal deleted');
            } else if (pendingDelete.startsWith('additional-')) {
                const id = pendingDelete.split('-')[1];
                const index = todayContent.additional.findIndex(a => a.id === id);
                if (index !== -1) todayContent.additional.splice(index, 1);
                saveDaily();
                window.showMessage('Journal deleted');
            }
            renderQuick();
            renderMyJournal();
            closeConfirmPopup();
            closeUniversalPopup();
            pendingDelete = null;
        }
        
        window.saveEmoji = function() {
            const newEmoji = document.getElementById('emojiInput').value.trim();
            if (newEmoji) {
                quickEmojis[currentEmojiId] = newEmoji;
                localStorage.setItem('quickEmojis', JSON.stringify(quickEmojis));
                const quickIndex = quickTypes.findIndex(q => q.id === currentEmojiId);
                if (quickIndex !== -1) {
                    quickTypes[quickIndex].emoji = newEmoji;
                    localStorage.setItem('quickTypes', JSON.stringify(quickTypes));
                }
                renderQuick();
            }
            closeEmojiPopup();
            currentEmojiId = null;
        }
        
        window.closeEmojiPopup = function() {
            document.getElementById('emojiPopup').style.display = 'none';
            currentEmojiId = null;
        }
        
        window.closeConfirmPopup = function() {
            document.getElementById('confirmPopup').style.display = 'none';
            pendingDelete = null;
        }
        
        window.closeUniversalPopup = function() {
            document.getElementById('universalPopup').style.display = 'none';
        }
        
        function loadJournalForDate(dateStr) {
            todayStr = dateStr;
            today = new Date(dateStr);
            
            document.querySelectorAll('.date-circle').forEach(circle => {
                circle.classList.remove('current');
                if (circle.dataset.date === dateStr) {
                    circle.classList.add('current');
                }
            });
            
            if (!dailyContents[dateStr]) {
                dailyContents[dateStr] = { quick: {}, additional: [] };
            }
            todayContent = dailyContents[dateStr];
            if (!todayContent.quick) todayContent.quick = {};
            if (!todayContent.additional) todayContent.additional = [];
            
            renderMyJournal();
            renderQuick();
        }
        
        function renderMyJournal() {
            const container = document.getElementById('journalCards');
            container.innerHTML = '';
            todayContent.additional.forEach(item => {
                const content = item.content || '';
                const card = document.createElement('div');
                card.className = 'journal-card';
                card.innerHTML = `
                    <h3>${item.title}</h3>
                    ${content ? `<div class="journal-content">${content.replace(/\n/g, '<br>')}</div>` : `<p>Start writing your reflection...</p>`}
                `;
                card.addEventListener('click', () => openPopup('additional-' + item.id, content, item.title));
                container.appendChild(card);
            });
        }
        
        function renderQuick() {
            const container = document.getElementById('quickCards');
            container.innerHTML = '';
            quickTypes.forEach(q => {
                const qcontent = todayContent.quick[q.id] || '';
                const emoji = quickEmojis[q.id] || q.emoji || '🌟';
                const card = document.createElement('div');
                card.className = 'quick-card';
                card.innerHTML = `
                    <div class="icon" data-id="${q.id}">${emoji}</div>
                    <h3>${q.title}</h3>
                    ${qcontent ? `<div class="journal-content">${qcontent.replace(/\n/g, '<br>')}</div>` : `<p>${q.prompt}</p>`}
                `;
                card.querySelector('.icon').addEventListener('click', (e) => {
                    e.stopPropagation();
                    currentEmojiId = q.id;
                    document.getElementById('emojiInput').value = emoji;
                    document.getElementById('emojiPopup').style.display = 'flex';
                });
                card.addEventListener('click', () => openPopup('quick-' + q.id, qcontent, q.title));
                container.appendChild(card);
            });
        }
        
        function performSearch() {
            document.getElementById('searchSuggestions').style.display = 'none';
            const searchInput = document.getElementById('globalSearch');
            const searchTerm = searchInput.value.trim().toLowerCase();
            if (!searchTerm) return;
            
            const allCards = document.querySelectorAll('.journal-card, .quick-card');
            let foundCard = null;
            
            allCards.forEach(card => {
                const cardTitle = card.querySelector('h3').textContent.toLowerCase();
                const cardContent = card.querySelector('.journal-content, p') ? 
                                   (card.querySelector('.journal-content') || card.querySelector('p')).textContent.toLowerCase() : '';
                
                if (cardTitle.includes(searchTerm) || cardContent.includes(searchTerm)) {
                    foundCard = card;
                }
            });
            
            if (foundCard) {
                foundCard.style.borderColor = 'var(--accent-color)';
                foundCard.style.borderWidth = '2px';
                foundCard.style.transition = 'border-color 0.3s ease, border-width 0.3s ease';
                foundCard.scrollIntoView({ behavior: 'smooth', block: 'center' });
                setTimeout(() => {
                    foundCard.style.borderColor = 'rgba(255, 255, 255, 0.1)';
                    foundCard.style.borderWidth = '1px';
                }, 3000);
            }
        }
        
        let searchTimeout;
        function showSearchSuggestions(searchTerm) {
            const suggestionsContainer = document.getElementById('searchSuggestions');
            if (!searchTerm.trim()) {
                suggestionsContainer.style.display = 'none';
                return;
            }
            
            const allCards = document.querySelectorAll('.journal-card, .quick-card');
            const suggestions = [];
            const term = searchTerm.toLowerCase();
            
            allCards.forEach(card => {
                const cardTitle = card.querySelector('h3').textContent;
                const cardContent = card.querySelector('.journal-content, p') ? 
                                   (card.querySelector('.journal-content') || card.querySelector('p')).textContent : '';
                
                if (cardTitle.toLowerCase().includes(term) || cardContent.toLowerCase().includes(term)) {
                    const type = card.classList.contains('quick-card') ? 'Quick' : 'Journal';
                    suggestions.push({ title: cardTitle, content: cardContent, type: type, element: card });
                }
            });
            
            if (suggestions.length === 0) {
                suggestionsContainer.innerHTML = `<div style="padding: 12px 16px; color: var(--text-secondary);">No results found</div>`;
            } else {
                suggestionsContainer.innerHTML = suggestions.slice(0, 5).map(item => `
                    <div style="padding: 12px 16px; cursor: pointer; border-bottom: 1px solid rgba(255,255,255,0.05);" 
                         onmouseover="this.style.background='rgba(255,255,255,0.05)'" 
                         onmouseout="this.style.background='transparent'"
                         onclick="selectSuggestion('${item.title.replace(/'/g, "\\'")}')">
                        <div style="font-weight: 600;">${item.title}</div>
                        <div style="font-size: 12px; color: var(--text-secondary);">${item.type} • ${item.content.substring(0, 50)}${item.content.length > 50 ? '...' : ''}</div>
                    </div>
                `).join('');
            }
            
            suggestionsContainer.style.display = 'block';
        }
        
        function selectSuggestion(cardTitle) {
            const allCards = document.querySelectorAll('.journal-card, .quick-card');
            let foundCard = null;
            
            allCards.forEach(card => {
                if (card.querySelector('h3').textContent === cardTitle) {
                    foundCard = card;
                }
            });
            
            if (foundCard) {
                foundCard.style.borderColor = 'var(--accent-color)';
                foundCard.style.borderWidth = '2px';
                foundCard.style.transition = 'border-color 0.3s ease, border-width 0.3s ease';
                foundCard.scrollIntoView({ behavior: 'smooth', block: 'center' });
                setTimeout(() => {
                    foundCard.style.borderColor = 'rgba(255, 255, 255, 0.1)';
                    foundCard.style.borderWidth = '1px';
                }, 3000);
                
                document.getElementById('searchSuggestions').style.display = 'none';
                document.getElementById('globalSearch').value = cardTitle;
            }
        }
        
        function setupSearch() {
            const searchInput = document.getElementById('globalSearch');
            const suggestionsContainer = document.getElementById('searchSuggestions');
            
            searchInput.addEventListener('input', function() {
                clearTimeout(searchTimeout);
                searchTimeout = setTimeout(() => showSearchSuggestions(this.value), 300);
            });
            
            searchInput.addEventListener('keypress', function(event) {
                if (event.key === 'Enter') {
                    suggestionsContainer.style.display = 'none';
                    performSearch();
                }
            });
            
            searchInput.addEventListener('focus', function() {
                if (this.value.trim()) {
                    showSearchSuggestions(this.value);
                }
            });
            
            document.addEventListener('click', function(event) {
                if (!searchInput.contains(event.target) && !suggestionsContainer.contains(event.target)) {
                    suggestionsContainer.style.display = 'none';
                }
            });
            
            document.addEventListener('keydown', function(event) {
                if (event.key === 'Escape' && suggestionsContainer.style.display === 'block') {
                    suggestionsContainer.style.display = 'none';
                }
            });
        }
        
        document.getElementById('addMyBtn').addEventListener('click', () => {
            document.getElementById('journalTitleInput').value = '';
            document.getElementById('addJournalPopup').style.display = 'flex';
        });
        
        document.getElementById('addQuickBtn').addEventListener('click', () => {
            document.getElementById('quickTitleInput').value = '';
            document.getElementById('quickPromptInput').value = '';
            document.getElementById('quickEmojiInput').value = '🌟';
            document.getElementById('addQuickPopup').style.display = 'flex';
        });
        
        document.getElementById('confirmPopup').addEventListener('click', (e) => {
            if (e.target.id === 'confirmPopup') closeConfirmPopup();
        });
        
        document.getElementById('addJournalPopup').addEventListener('click', (e) => {
            if (e.target.id === 'addJournalPopup') closeAddJournalPopup();
        });
        
        document.getElementById('addQuickPopup').addEventListener('click', (e) => {
            if (e.target.id === 'addQuickPopup') closeAddQuickPopup();
        });
        
        quickTypes = JSON.parse(localStorage.getItem('quickTypes')) || [];
        quickEmojis = JSON.parse(localStorage.getItem('quickEmojis')) || {};
        
        renderWeek();
        renderMyJournal();
        renderQuick();
        setupSearch();
        
    </script>
</body>
</html>
