<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Projects Task Manager | lildavegoth</title>
    <meta name="color-scheme" content="dark">
    <script src="../cordova.js"></script>
    <script src="../protections.js"></script>
    <script src="../notification.cssjs"></script>
    <link rel="stylesheet" href="../media.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --accent-color: #C1FC32;
            --accent-dark: #9bc726;
            --bg-black: #000000;
            --bg-dark: #1a1a1a;
            --bg-card: rgba(30, 30, 30, 0.7);
            --text-primary: #f5f5f7;
            --text-secondary: #a1a1a6;
            --radius-small: 12px;
            --radius-medium: 20px;
            --radius-large: 28px;
            --spacing-xs: 8px;
            --spacing-sm: 16px;
            --spacing-md: 24px;
            --spacing-lg: 32px;
            --spacing-xl: 48px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
        }

        body {
            background-color: var(--bg-black);
            color: var(--text-primary);
            min-height: 100vh;
            background-image: 
                radial-gradient(circle at 20% 80%, rgba(193, 252, 50, 0.05) 0%, transparent 20%),
                radial-gradient(circle at 80% 20%, rgba(193, 252, 50, 0.03) 0%, transparent 20%);
            overflow-x: hidden;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: var(--spacing-md);
        }

        header {
            padding: var(--spacing-lg) 0;
            margin-bottom: var(--spacing-md);
        }

        .username {
            font-size: 2.5rem;
            font-weight: 700;
            color: #ffffff;
            margin-bottom: 4px;
        }

        .tagline {
            color: var(--text-secondary);
            font-size: 1.1rem;
            margin-bottom: var(--spacing-sm);
        }

        .controls {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: var(--spacing-sm);
            margin-top: var(--spacing-md);
            width: 100%;
            max-width: 400px;
        }
        
        .controls .btn {
            width: 100%;
            justify-content: center;
        }
        
        .controls-row {
            display: flex;
            gap: var(--spacing-sm);
            width: 100%;
        }
        
        .controls-row .btn {
            flex: 1;
            justify-content: center;
        }

        .btn {
            padding: 10px 20px;
            background: var(--bg-dark);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: var(--radius-small);
            color: var(--text-primary);
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.9rem;
        }

        .btn:hover {
            background: rgba(193, 252, 50, 0.1);
            border-color: var(--accent-color);
            transform: translateY(-2px);
        }

        .btn:active {
            transform: translateY(0);
        }

        .btn.primary {
            background: var(--accent-color);
            color: #000;
            font-weight: bold;
        }

        .btn.danger {
            background: rgba(220, 53, 69, 0.2);
            border-color: rgba(220, 53, 69, 0.3);
            color: #ff6b6b;
        }

        .btn.danger:hover {
            background: rgba(220, 53, 69, 0.3);
            border-color: #dc3545;
        }

        .btn.success {
            background: rgba(25, 135, 84, 0.2);
            border-color: rgba(25, 135, 84, 0.3);
            color: #20c997;
        }

        .btn.success:hover {
            background: rgba(25, 135, 84, 0.3);
            border-color: #20c997;
        }

        .btn.small {
            padding: 6px 12px;
            font-size: 0.8rem;
        }

        .spreadsheet-container {
            background: var(--bg-card);
            border-radius: var(--radius-medium);
            border: 1px solid rgba(255, 255, 255, 0.1);
            overflow: hidden;
            margin-top: var(--spacing-lg);
        }

        .spreadsheet-wrapper {
            position: relative;
            overflow: auto;
            max-height: 600px;
            scrollbar-width: none;
            -ms-overflow-style: none;
            scroll-padding-top: 20px;
        }
        
        .spreadsheet-wrapper::-webkit-scrollbar {
            display: none;
            width: 0;
            height: 0;
        }

        .spreadsheet-table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0;
            min-width: 800px;
        }

        .spreadsheet-table th {
            background: var(--bg-dark);
            color: var(--text-secondary);
            font-weight: 600;
            font-size: 0.9rem;
            padding: 12px;
            text-align: left;
            border-bottom: 2px solid rgba(255, 255, 255, 0.1);
            position: sticky;
            top: 0;
            z-index: 10;
            user-select: none;
        }

        .spreadsheet-table td {
            padding: 10px 12px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            border-right: 1px solid rgba(255, 255, 255, 0.08);
            background: rgba(0, 0, 0, 0.2);
            transition: background 0.2s ease;
            vertical-align: top;
        }

        .spreadsheet-table tr:hover td {
            background: rgba(193, 252, 50, 0.03);
        }

        .spreadsheet-table td:last-child {
            border-right: none;
        }

        .spreadsheet-table tr:last-child td {
            border-bottom: none;
        }

        .cell-textarea {
            width: 100%;
            background: transparent;
            border: none;
            color: var(--text-primary);
            font-size: 0.95rem;
            padding: 0;
            outline: none;
            font-family: inherit;
            resize: none;
            overflow-y: auto;
            min-height: 150px;
            line-height: 1.4;
            text-align: left;
            display: block;
        }

        .cell-textarea:focus {
            background: rgba(193, 252, 50, 0.1);
            border-radius: 4px;
        }

        .status-select {
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            color: var(--text-primary);
            padding: 4px 12px;
            font-size: 0.85rem;
            cursor: pointer;
            text-align: center;
            width: auto;
            min-width: unset;
            margin-bottom: 8px;
            display: inline-block;
            -webkit-appearance: none;
            -moz-appearance: none;
            appearance: none;
        }

        .status-select:focus {
            outline: none;
            border-color: var(--accent-color);
        }

        .add-row-btn {
            width: 100%;
            padding: 12px;
            background: var(--bg-dark);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: var(--text-secondary);
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .add-row-btn:hover {
            background: rgba(193, 252, 50, 0.1);
            color: var(--accent-color);
            border-color: var(--accent-color);
        }

        .row-controls {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .row-btn {
            width: 28px;
            height: 28px;
            background: transparent;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: var(--radius-small);
            color: var(--text-secondary);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.8rem;
            transition: all 0.2s ease;
        }

        .row-btn:hover {
            background: rgba(193, 252, 50, 0.1);
            color: var(--accent-color);
            border-color: var(--accent-color);
        }

        .row-btn.delete:hover {
            background: rgba(220, 53, 69, 0.2);
            color: #ff6b6b;
            border-color: rgba(220, 53, 69, 0.3);
        }
        
        .row-btn.pinned {
            background: rgba(193, 252, 50, 0.2);
            color: var(--accent-color);
            border-color: var(--accent-color);
        }
        
        .row-btn.pinned:hover {
            background: rgba(193, 252, 50, 0.3);
        }

        .popup-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 1.0);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 99999999;
            animation: fadeIn 0.3s ease;
        }
        
        .popup-content {
            background: var(--bg-card);
            border-radius: var(--radius-large);
            width: 90%;
            max-width: 500px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
            max-height: 70vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        
        .popup-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: var(--spacing-md);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .popup-header h2 {
            font-size: 1.5rem;
            font-weight: 600;
        }
        
        .close-popup {
            background: transparent;
            border: none;
            color: var(--text-secondary);
            font-size: 1.2rem;
            cursor: pointer;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
        }
        
        .close-popup:hover {
            background: rgba(255, 255, 255, 0.1);
            color: var(--text-primary);
        }
        
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .form-group {
            margin-bottom: var(--spacing-md);
        }

        .form-label {
            display: block;
            margin-bottom: 8px;
            color: var(--text-primary);
            font-weight: 500;
        }

        .form-input {
            width: 100%;
            padding: 12px;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: var(--radius-small);
            color: var(--text-primary);
            font-size: 1rem;
            transition: all 0.3s ease;
        }

        .form-input:focus {
            outline: none;
            border-color: var(--accent-color);
            box-shadow: 0 0 0 2px rgba(193, 252, 50, 0.1);
        }

        .modal-actions {
            display: flex;
            gap: var(--spacing-sm);
            margin-top: var(--spacing-lg);
            flex-wrap: wrap;
        }
        
        @media (max-width: 768px) {
            .modal-actions {
                flex-direction: column;
            }
            
            .modal-actions .btn {
                width: 100%;
                text-align: center;
            }
        }

        textarea.form-input {
            resize: none;
            min-height: 100px;
            font-family: inherit;
        }

        .scrollable {
            overflow-x: auto;
            overflow-y: auto;
        }

        .tasks-container {
            display: flex;
            flex-direction: column;
            gap: 8px;
            max-height: 120px;
            overflow-y: auto;
            padding-right: 12px;
            margin-right: 4px;
        }

        .task-item {
            display: flex;
            gap: 10px;
        }

        .task-checkbox {
            width: 18px;
            height: 18px;
            cursor: pointer;
            flex-shrink: 0;
            appearance: none;
            border: 2px solid var(--accent-color);
            border-radius: 50%;
            background: transparent;
            position: relative;
            margin-top: 4px;
        }

        .task-checkbox:checked {
            background-color: var(--accent-color);
        }

        .task-checkbox:checked::after {
            content: '';
            position: absolute;
            display: block;
        }

        .task-content {
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        .task-textarea {
            width: 100%;
            min-width: 230px;
            background: transparent;
            border: none;
            color: var(--text-primary);
            font-size: 0.9rem;
            padding: 4px;
            outline: none;
            font-family: inherit;
            resize: none;
            overflow-y: auto;
            line-height: 1.4;
            text-align: left;
            scrollbar-width: none;
            -ms-overflow-style: none;
        }
        
        .task-textarea::-webkit-scrollbar {
            display: none;
        }

        .task-textarea:focus {
            background: rgba(193, 252, 50, 0.1);
            border-radius: 4px;
        }

        .task-remove-btn {
            width: 20px;
            height: 20px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 50%;
            color: var(--text-secondary);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.7rem;
            flex-shrink: 0;
            margin-top: 4px;
        }

        .task-remove-btn:hover {
            background: rgba(220, 53, 69, 0.3);
            color: #ff6b6b;
            border-color: rgba(220, 53, 69, 0.5);
        }

        .add-task-btn {
            margin-top: 8px;
            background: rgba(193, 252, 50, 0.1);
            border: 1px solid var(--accent-color);
            color: var(--accent-color);
            border-radius: var(--radius-small);
            padding: 6px 10px;
            font-size: 0.8rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 4px;
            width: fit-content;
        }

        .add-task-btn:hover {
            background: rgba(193, 252, 50, 0.2);
        }

        .add-task-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .clear-tasks-btn {
            margin-top: 0;
            background: rgba(220, 53, 69, 0.1);
            border: 1px solid rgba(220, 53, 69, 0.3);
            color: #ff6b6b;
            border-radius: var(--radius-small);
            padding: 7px 14px;
            font-size: 0.8rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 4px;
            width: fit-content;
        }

        .clear-tasks-btn:hover {
            background: rgba(220, 53, 69, 0.2);
            border-color: rgba(220, 53, 69, 0.5);
        }

        .add-task-btn {
            margin-top: 0;
        }

        .folders-container {
            display: flex;
            gap: var(--spacing-sm);
            margin-bottom: var(--spacing-md);
            overflow-x: auto;
            padding: 12px 4px 20px 4px;
            scrollbar-width: none;
            -ms-overflow-style: none;
            margin-bottom: -20px;
            position: relative;
            z-index: 5;
        }
        
        .folders-container::-webkit-scrollbar {
            display: none;
            width: 0;
            height: 0;
        }

        .folder-tab {
            position: relative;
            padding: 10px 20px;
            background: var(--bg-dark);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: var(--radius-small);
            color: var(--text-secondary);
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
            white-space: nowrap;
            flex-shrink: 0;
            overflow: visible;
            z-index: 10;
        }

        .folder-counter {
            position: absolute;
            top: -8px;
            right: -8px;
            background: #7E50B5;
            color: white;
            font-size: 0.7rem;
            font-weight: 600;
            min-width: 20px;
            height: 20px;
            padding: 0 6px;
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 20;
            pointer-events: none;
        }

        .folder-tab:hover {
            background: rgba(193, 252, 50, 0.1);
            border-color: var(--accent-color);
            color: var(--accent-color);
        }

        .folder-tab.active {
            background: var(--accent-color);
            color: #000;
            font-weight: bold;
            border-color: var(--accent-color);
            z-index: 15;
        }

        .add-folder-btn {
            padding: 10px 20px;
            background: rgba(193, 252, 50, 0.1);
            border: 1px solid var(--accent-color);
            border-radius: var(--radius-small);
            color: var(--accent-color);
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
            white-space: nowrap;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .add-folder-btn:hover {
            background: rgba(193, 252, 50, 0.2);
        }
        
        .search-suggestions {
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            background: var(--bg-card);
            border-radius: var(--radius-medium);
            border: 1px solid rgba(255, 255, 255, 0.1);
            margin-top: 8px;
            max-height: 300px;
            overflow-y: auto;
            z-index: 1000;
            display: none;
            backdrop-filter: saturate(180%) blur(20px);
            scrollbar-width: none;
        }
        
        .search-suggestions::-webkit-scrollbar {
            display: none;
        }
        
        .search-suggestion-item {
            padding: 12px 16px;
            cursor: pointer;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            transition: all 0.2s ease;
        }
        
        .search-suggestion-item:hover {
            background: rgba(193, 252, 50, 0.1);
        }
        
        .search-suggestion-item:last-child {
            border-bottom: none;
        }
        
        #filterBtn.active {
            color: var(--accent-color);
        }
        
        #filterBtn.active i {
            color: var(--accent-color);
        }
        
        #filterBtn i {
            font-size: 1.2rem;
            transition: color 0.3s ease;
        }
        
        .suggestion-title {
            font-weight: 500;
            margin-bottom: 4px;
            color: var(--text-primary);
        }
        
        .suggestion-description {
            font-size: 0.85rem;
            color: var(--text-secondary);
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        
        .suggestion-category {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 12px;
            font-size: 0.7rem;
            margin-top: 4px;
            background: rgba(193, 252, 50, 0.1);
            color: var(--accent-color);
        }
        
        .suggestion-category i {
            font-size: 0.5rem;
            margin-bottom: 3px;
            margin-right: 2px;
        }

        textarea:focus,
        input:focus,
        select:focus {
            scroll-margin-top: 30px;
        }
    </style>
</head>
<body>
    <div class="container">
        <a style="margin-bottom: -20px;" href="../index.html" class="back-link fade-in">
            <i class="fas fa-arrow-left"></i> Back to Home
        </a>
        
        <header>
            <h1 class="username">Projects Task Manager</h1>
            <p class="tagline">Projects management with unlimited rows</p>
            
            <div class="controls">
                <button class="btn" id="addRowBtnTop">
                    <i class="fas fa-plus"></i> Add Row
                </button>
                <button class="btn danger" id="clearBtn">
                    <i class="fas fa-trash"></i> Clear All
                </button>
            </div>
        </header>
        
        <div class="search-container" style="margin-bottom: var(--spacing-xs); margin-top: -40px; position: relative;">
            <div style="position: relative;">
                <input type="text" id="projectSearch" placeholder="Search all projects across folders..." 
                       style="width: 100%; padding: 12px 44px 12px 16px; border-radius: var(--radius-medium); 
                              background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.1); 
                              color: var(--text-primary); font-size: 0.95rem; outline: none;">
                <div style="position: absolute; right: 12px; top: 50%; transform: translateY(-50%); 
                            color: var(--text-secondary); pointer-events: none;">
                    <i class="fas fa-search" style="color: var(--accent-color); margin-right: 5px;"></i>
                </div>
                <button id="filterBtn" style="position: absolute; right: 44px; top: 50%; transform: translateY(-50%); 
                        background: transparent; border: none; color: var(--text-secondary); 
                        cursor: pointer; padding: 8px; display: flex; align-items: center; 
                        transition: all 0.3s ease; border-radius: 4px;">
                    <i class="fas fa-filter" style="font-size: 1.05rem;"></i>
                </button>
            </div>
            <div class="search-suggestions" id="projectSearchSuggestions"></div>
        </div>

        <div class="folders-container" id="foldersContainer"></div>
        
        <div class="spreadsheet-container">
            <div class="spreadsheet-wrapper scrollable">
                <table class="spreadsheet-table" id="spreadsheetTable">
                    <thead>
                        <tr>
                            <th style="min-width: 200px;">Project Name</th>
                            <th style="min-width: 320px;">Tasks</th>
                            <th style="min-width: 300px;">Notes</th>
                            <th style="min-width: 140px;">Status & Actions</th>
                        </tr>
                    </thead>
                    <tbody id="tableBody">
                    </tbody>
                </table>
            </div>
            <button class="add-row-btn" id="addRowBtnBottom">
                Add Row
            </button>
        </div>
        
        <footer class="fade-in">
            <div class="social-links">
                <a href="https://twitter.com/lildavegoth"><span class="icon icon-twitter"></span></a>
                <a href="https://instagram.com/dave_goth"><span class="icon icon-instagram"></span></a>
            </div>
            <p>© 2026 lildavegoth | Projects Task Manager</p>
            <p style="margin-top: 8px; font-size: 0.8rem; color: #666;">
                Conveys the Idea of a Protected and Inspiring Space for Creative Expression.
            </p>
        </footer>
    </div>
    
    <div id="universalPopup" class="popup-overlay" style="display: none;">
        <div class="popup-content">
            <div class="popup-header">
                <h2 id="popupTitle"></h2>
                <button class="close-popup" onclick="closeUniversalPopup()">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            <div class="modal-body" id="popupContent" style="padding: var(--spacing-md); overflow-y: auto;"></div>
        </div>
    </div>

    <script>
        const KEY = "projectFolders"
        let folders = JSON.parse(localStorage.getItem(KEY)) || []
        let currentFolderId = null
        let rowToDeleteIndex = -1
        let filterActive = false
        let clearProject = null
                                
        const body = document.getElementById("tableBody")
        const addRowBtnTop = document.getElementById("addRowBtnTop")
        const addRowBtnBottom = document.getElementById("addRowBtnBottom")
        const clearBtn = document.getElementById("clearBtn")
        const foldersContainer = document.getElementById("foldersContainer")
                
        let searchTimeout
        
        function resizeTaskTextarea(el) {
            if (!el) return
            el.style.height = 'auto'
            el.style.height = el.scrollHeight + 'px'
        }
        
        function setAllTaskTextareaHeights() {
            document.querySelectorAll('.task-textarea').forEach(resizeTaskTextarea)
        }
        
        function openUniversalPopup(title, contentHTML) {
            const popup = document.getElementById('universalPopup')
            const titleEl = document.getElementById('popupTitle')
            const contentEl = document.getElementById('popupContent')
            titleEl.textContent = title

        function setupProjectSearch() {
            const searchInput = document.getElementById('projectSearch')
            const suggestionsContainer = document.getElementById('projectSearchSuggestions')
            const filterBtn = document.getElementById("filterBtn")
            filterBtn.onclick = () => {
                filterActive = !filterActive
                if (filterActive) {
                    filterBtn.classList.add('active')
                } else {
                    filterBtn.classList.remove('active')
                    filterBtn.style.background = 'transparent'
                    filterBtn.style.border = 'none'
                }
                render()
                renderFolders()
            }
            
            if (searchInput) {
                searchInput.addEventListener('input', function() {
                    clearTimeout(searchTimeout)
                    showProjectSuggestions(this.value)
                })
                
                const searchIcon = searchInput.parentElement.querySelector('.fa-search')
                if (searchIcon) {
                    searchIcon.style.pointerEvents = 'auto'
                    searchIcon.addEventListener('click', function() {
                        suggestionsContainer.style.display = 'none'
                        performProjectSearch()
                    })
                }
                
                searchInput.addEventListener('keypress', function(event) {
                    if (event.key === 'Enter') {
                        suggestionsContainer.style.display = 'none'
                        performProjectSearch()
                    }
                })
                
                searchInput.addEventListener('focus', function() {
                    if (this.value.trim()) {
                        showProjectSuggestions(this.value)
                    }
                })
                
                document.addEventListener('click', function(event) {
                    if (!searchInput.contains(event.target) && !suggestionsContainer.contains(event.target)) {
                        suggestionsContainer.style.display = 'none'
                    }
                })

                    const suggestionItem = event.target.closest('.search-suggestion-item')
                    if (suggestionItem) {
                        selectProjectSuggestion(suggestionItem)
                    }
                })
                
                document.addEventListener('keydown', function(event) {
                    if (event.key === 'Escape' && suggestionsContainer.style.display === 'block') {
                        suggestionsContainer.style.display = 'none'
                    }
                })
            }
        }
                
        function showProjectSuggestions(searchTerm) {
            const suggestionsContainer = document.getElementById('projectSearchSuggestions')
            
            if (!searchTerm.trim()) {
                suggestionsContainer.style.display = 'none'
                return
            }
            
            const term = searchTerm.toLowerCase()
            const allSuggestions = []
            
            folders.forEach(folder => {
                let folderData = folder.data || []
                if (filterActive && folder.id === currentFolderId) {
                    folderData = folderData.filter(p => p.status === "Pending" || p.status === "In Progress")
                }
                folderData.forEach((project, idx) => {
                    if (project.name.toLowerCase().includes(term) || 
                        project.notes.toLowerCase().includes(term) ||
                        project.tasks.some(t => t.text.toLowerCase().includes(term))) {
                        
                        let taskCount = project.tasks.length
                        let doneCount = project.tasks.filter(t => t.done).length
                        
                        allSuggestions.push({
                            folderId: folder.id,
                            folderName: folder.name,
                            projectName: project.name || 'Untitled Project',
                            projectIndex: idx,
                            status: project.status,
                            tasks: `${doneCount}/${taskCount} tasks`,
                            pinned: project.pinned
                        })
                    }
                })
            })
            
            if (allSuggestions.length === 0) {
                suggestionsContainer.innerHTML = `
                    <div class="search-suggestion-item">
                        <div class="suggestion-title">No projects found</div>
                        <div class="suggestion-description">Try different keywords</div>
                    </div>
                `
            } else {
                suggestionsContainer.innerHTML = allSuggestions.slice(0, 8).map(item => `
                    <div class="search-suggestion-item" data-folder-id="${item.folderId}" data-project-index="${item.projectIndex}">
                        <div class="suggestion-title">${item.projectName}</div>
                        <div class="suggestion-description">${item.tasks} • ${item.status}</div>
                        <div class="suggestion-category"><i class="fas fa-folder"></i> ${item.pinned ? ' <i class="fas fa-thumbtack"></i>' : ''} ${item.folderName}  </div>
                    </div>
                `).join('')
            }
            
            suggestionsContainer.style.display = 'block'
        }
                
        function selectProjectSuggestion(suggestionItem) {
            const folderId = suggestionItem.getAttribute('data-folder-id')
            const projectIndex = suggestionItem.getAttribute('data-project-index')
            if (folderId && projectIndex !== null) {
                document.getElementById('projectSearchSuggestions').style.display = 'none'
                const targetFolder = folders.find(f => f.id === folderId)
                if (targetFolder) {
                    if (currentFolderId !== folderId) {
                        currentFolderId = folderId
                        renderFolders()
                    }
                    render()
                    setTimeout(() => {
                        scrollToProjectInCurrentFolder(parseInt(projectIndex))
                    }, 50)
                }
            }
        }
                
        function performProjectSearch() {
            const searchInput = document.getElementById('projectSearch')
            const searchTerm = searchInput.value.trim().toLowerCase()
            
            document.getElementById('projectSearchSuggestions').style.display = 'none'
            
            if (!searchTerm) return
            
            for (const folder of folders) {
                const folderData = folder.data || []
                for (let i = 0; i < folderData.length; i++) {
                    const project = folderData[i]
                    if (project.name.toLowerCase().includes(searchTerm) || 
                        project.notes.toLowerCase().includes(searchTerm) ||
                        project.tasks.some(t => t.text.toLowerCase().includes(searchTerm))) {
                        
                        if (currentFolderId !== folder.id) {
                            currentFolderId = folder.id
                            renderFolders()
                        }
                        render()
                        setTimeout(() => {
                            scrollToProjectInCurrentFolder(i)
                        }, 50)
                        return
                    }
                }
            }
            window.showMessage('No matching project found in any folder')
        }
                
        function scrollToProjectInCurrentFolder(projectIndex) {
            const rows = document.querySelectorAll('#tableBody tr')
            const data = getCurrentData()
            if (projectIndex < data.length) {
                const targetProject = data[projectIndex]
                let sortedIndex = -1
                const sortedData = [...data].sort((a, b) => {
                    if (a.pinned && !b.pinned) return -1
                    if (!a.pinned && b.pinned) return 1
                    const nameA = a.name.toLowerCase()
                    const nameB = b.name.toLowerCase()
                    if (nameA < nameB) return -1
                    if (nameA > nameB) return 1
                    return 0
                })
                sortedIndex = sortedData.findIndex(p => p === targetProject)
                
                if (sortedIndex !== -1 && rows[sortedIndex]) {
                    const row = rows[sortedIndex]
                    row.style.transition = 'background 0.3s ease'
                    row.style.background = 'rgba(193, 252, 50, 0.15)'
                    row.scrollIntoView({ behavior: 'smooth', block: 'center' })
                    setTimeout(() => {
                        row.style.background = ''
                    }, 2000)
                }
            }
        }

            return folder ? folder.data : []
        }

        function saveFile(content, filename, mimeType) {
          return new Promise((resolve, reject) => {
            if (window.cordova) {
              const writeFile = (dirEntry, isDownloads) => {
                dirEntry.getFile(filename, { create: true, exclusive: false }, (fileEntry) => {
                  fileEntry.createWriter((writer) => {
                    writer.onwriteend = () => {
                      const location = isDownloads ? 'Downloads' : 'app folder';
                      window.showMessage(`Projects backed up to ${location}!`);
                      if (window.cordova.plugins && window.cordova.plugins.fileOpener2) {
                        cordova.plugins.fileOpener2.open(fileEntry.nativeURL, mimeType);
                      }
                      resolve();
                    };
                    writer.onerror = () => {
                      window.showMessage('Export failed');
                      reject();
                    };
                    writer.write(new Blob([content], { type: mimeType }));
                  }, () => {
                    window.showMessage('Export failed');
                    reject();
                  });
                }, () => {
                  window.showMessage('Export failed');
                  reject();
                });
              };
        
              const saveToDownloads = () => {
                window.resolveLocalFileSystemURL(
                  cordova.file.externalRootDirectory + 'Download/',
                  (dir) => {
                    writeFile(dir, true);
                  },
                  () => {
                    window.resolveLocalFileSystemURL(
                      cordova.file.dataDirectory,
                      (dir) => {
                        writeFile(dir, false);
                      },
                      () => {
                        window.showMessage('Export failed');
                        reject();
                      }
                    );
                  }
                );
              };
        
              if (document.readyState === 'complete' || (window.cordova && window.cordova.device)) {
                saveToDownloads();
              } else {
                document.addEventListener('deviceready', saveToDownloads);
              }
            } else {
              const blob = new Blob([content], { type: mimeType });
              const url = URL.createObjectURL(blob);
              const a = document.createElement('a');
              a.href = url;
              a.download = filename;
              document.body.appendChild(a);
              a.click();
              document.body.removeChild(a);
              URL.revokeObjectURL(url);
              window.showMessage('Projects exported!');
              resolve();
            }
          });
        }

        function encryptData(data) {
            try {
                const jsonString = JSON.stringify(data)
                return btoa(unescape(encodeURIComponent(jsonString)))
            } catch {
                return null
            }
        }
                
        function decryptData(encryptedString) {
            try {
                const jsonString = decodeURIComponent(escape(atob(encryptedString)))
                return JSON.parse(jsonString)
            } catch {
                return null
            }
        }
                
        async function exportData() {
          try {
            const exportData = {
              version: '1.2',
              exportedAt: new Date().toISOString(),
              folders: folders.map(folder => ({
                ...folder,
                data: folder.data.map(project => ({
                  ...project,
                  pinned: project.pinned || false
                }))
              }))
            };
        
            const encryptedData = encryptData(exportData);
            if (!encryptedData) {
              window.showMessage('Export failed');
              return;
            }
        
            const timestamp = new Date().toISOString().split('T')[0];
            const filename = `projects-backup-${timestamp}.json`;
            const mimeType = 'application/json';
        
            await saveFile(encryptedData, filename, mimeType);
          } catch (error) {
            window.showMessage('Export failed');
          }
        }

        }
                
        addRowBtnTop.onclick = addNewRow
        addRowBtnBottom.onclick = addNewRow
                
        if (folders.length === 0) {
            const defaultFolder = {
                id: Date.now().toString(),
                name: "Default",
                data: []
            }
            folders.push(defaultFolder)
            currentFolderId = defaultFolder.id
            save()
            renderFolders()
            render()
        } else {
            currentFolderId = folders[0].id
            renderFolders()
            render()
        }
                
        setupProjectSearch()
                
        function addNewRow() {
            if (!currentFolderId) {
                window.showMessage('Please select a folder first')
                return
            }
            
            const data = getCurrentData()
            const newProject = {
                name: "",
                notes: "",
                tasks: [],
                status: "Pending",
                pinned: false
            }
            data.push(newProject)
            setCurrentData(data)
            render()
            renderFolders()
            
            setTimeout(() => {
                const rows = document.querySelectorAll('#tableBody tr')
                rows.forEach(row => {
                    const nameInput = row.querySelector('.cell-textarea')
                    if (nameInput && nameInput.value === "") {
                        nameInput.focus({ preventScroll: true })
                        nameInput.scrollIntoView({ behavior: 'smooth', block: 'center' })
                        return
                    }
                })
            }, 100)
        }

        document.addEventListener('focusin', (e) => {
            if (e.target.matches('textarea, input, select')) {
                setTimeout(() => {
                    e.target.scrollIntoView({ behavior: 'smooth', block: 'nearest' })
                }, 20)
            }
        })
    </script>
</body>
</html>
