<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Match 3 Tiles</title>
    <meta name="color-scheme" content="dark">
    <script src="../protections.js"></script>
    <script src="../notification.cssjs"></script>
    <link rel="stylesheet" href="../media.css">
    <link rel="stylesheet" href="../navigation.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --accent-color: #C1FC32;
            --accent-dark: #9bc726;
            --bg-black: #000000;
            --bg-dark: #1a1a1a;
            --bg-card: rgba(30, 30, 30, 0.7);
            --text-primary: #f5f5f7;
            --text-secondary: #a1a1a6;
            --radius: 12px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-black);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 10px;
            overflow-x: hidden;
            background-image: radial-gradient(circle at 20% 80%, rgba(193, 252, 50, 0.05) 0%, transparent 20%);
        }

        .container {
            max-width: 1200px;
            max-width: 100%;
            margin: 0 auto;
            padding: 15px;
            position: relative;
        }
        
        .header {
            margin-bottom: 40px;
            text-align: left;
        }

        .header h1 {
            font-size: 2.2rem;
            margin-bottom: 4px;
            font-weight: 700;
            line-height: 1.2;
        }

        .header p {
            color: var(--text-secondary);
            font-size: 0.95rem;
        }

        .game-logo {
            font-size: 1.2rem;
            font-weight: 700;
            color: var(--accent-color);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .game-actions {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-bottom: 15px;
        }

        .action-button {
            background: var(--accent-color);
            color: #000;
            border: none;
            padding: 10px 16px;
            border-radius: var(--radius);
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 6px;
            white-space: nowrap;
        }

        .action-button:hover {
            background: var(--accent-dark);
            transform: translateY(-1px);
        }

        .stats-bar {
            display: grid;
            grid-template-columns: 1fr;
            gap: 10px;
            margin-bottom: 15px;
        }

        .stat-card {
            background: var(--bg-card);
            border-radius: var(--radius);
            padding: 15px;
            display: flex;
            align-items: center;
            gap: 10px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .stat-icon {
            width: 36px;
            height: 36px;
            border-radius: 8px;
            background: rgba(193, 252, 50, 0.1);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--accent-color);
            font-size: 1rem;
        }

        .stat-info h3 {
            font-size: 1.4rem;
            margin-bottom: 2px;
            font-weight: 600;
        }

        .stat-info p {
            color: var(--text-secondary);
            font-size: 0.8rem;
        }

        .game-grid-container {
            background: var(--bg-dark);
            border-radius: var(--radius);
            padding: 15px;
            margin-bottom: 15px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            overflow: hidden;
        }

        .game-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 8px;
            margin: 0 auto;
            max-width: 500px;
        }

        .tile {
            background: var(--bg-card);
            border-radius: var(--radius);
            border: 2px solid rgba(255, 255, 255, 0.1);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            aspect-ratio: 1;
            transition: all 0.2s ease;
            position: relative;
            overflow: hidden;
        }

        .tile:hover {
            border-color: rgba(193, 252, 50, 0.3);
            transform: scale(1.03);
        }

        .tile.selected {
            border-color: var(--accent-color);
            background: rgba(193, 252, 50, 0.1);
            transform: scale(1.05);
            box-shadow: 0 0 15px rgba(193, 252, 50, 0.3);
        }

        .tile.matched {
            animation: matchEffect 0.5s ease;
            opacity: 0.7;
        }

        @keyframes matchEffect {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.2); }
        }

        .tile .icon {
            font-size: 1.5rem;
            color: var(--accent-color);
        }

        .selection-bar {
            background: var(--bg-card);
            border-radius: var(--radius);
            padding: 15px;
            margin-bottom: 15px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            min-height: 80px;
        }

        .selected-tile {
            width: 50px;
            height: 50px;
            background: rgba(193, 252, 50, 0.1);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 2px dashed var(--accent-color);
        }

        .selected-tile .icon {
            font-size: 1.5rem;
            color: var(--accent-color);
        }

        .selected-tile.empty {
            border: 2px dashed var(--text-secondary);
            background: transparent;
        }

        .selected-tile.empty .icon {
            color: var(--text-secondary);
            font-size: 1.2rem;
        }

        .game-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .modal-content {
            background: var(--bg-dark);
            border-radius: var(--radius);
            padding: 20px;
            width: 100%;
            max-width: 400px;
            text-align: center;
            border: 1px solid rgba(193, 252, 50, 0.3);
        }

        .modal-icon {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: rgba(193, 252, 50, 0.1);
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 15px;
            color: var(--accent-color);
            font-size: 1.8rem;
        }

        .modal-title {
            font-size: 1.5rem;
            margin-bottom: 10px;
            color: var(--accent-color);
        }

        @media (max-width: 480px) {
            .game-grid {
                grid-template-columns: repeat(5, 1fr);
                gap: 6px;
            }
            
            .tile .icon {
                font-size: 1.2rem;
            }
            
            .stat-card {
                padding: 12px;
            }
            
            .stat-icon {
                width: 32px;
                height: 32px;
            }
            
            .stat-info h3 {
                font-size: 1.2rem;
            }
            
            .selected-tile {
                width: 40px;
                height: 40px;
            }
            
            .selected-tile .icon {
                font-size: 1.2rem;
            }
        }

        @media (max-width: 360px) {
            .game-grid {
                grid-template-columns: repeat(4, 1fr);
            }
        }
        
    </style>
</head>
<body>
    <div class="container">
        <a href="../index.html" class="back-link fade-in">
            <i class="fas fa-arrow-left"></i> Back to Home
        </a>
        
        <div class="header">
            <h1>3 Tiles</h1>
            <p>Match 3 same icon tiles to het scores</p>
        </div>
        
        <div class="game-actions">
            <button class="action-button" id="newGameBtn">
                <i class="fas fa-plus-circle"></i>
                New Game
            </button>
            <button class="action-button" id="restartBtn">
                <i class="fas fa-redo"></i>
                Restart
            </button>
        </div>
        
        <div class="stats-bar">
            <div class="stat-card">
                <div class="stat-icon">
                    <i class="fas fa-star"></i>
                </div>
                <div class="stat-info">
                    <h3 id="score">0</h3>
                    <p>Score</p>
                </div>
            </div>
        </div>
        
        <div class="game-grid-container">
            <div class="game-grid" id="gameGrid"></div>
        </div>
        
        <div class="selection-bar">
            <div class="selected-tile empty" id="selected1">
                <i class="fas fa-plus"></i>
            </div>
            <div class="selected-tile empty" id="selected2">
                <i class="fas fa-plus"></i>
            </div>
            <div class="selected-tile empty" id="selected3">
                <i class="fas fa-plus"></i>
            </div>
        </div>
        
        <div class="game-modal" id="gameModal">
            <div class="modal-content">
                <div class="modal-icon" id="modalIcon">
                    <i class="fas fa-trophy"></i>
                </div>
                <h2 class="modal-title" id="modalTitle">Game Over</h2>
                <p id="modalMessage">Selected tiles are different!</p>
                <div style="display: flex; gap: 10px; margin-top: 20px;">
                    <button class="action-button" id="closeModalBtn" style="flex: 1;">
                        Play Again
                    </button>
                </div>
            </div>
        </div>
        
        <footer class="fade-in">
            <div style="margin-top: 50px; margin-bottom: 20px;" class="social-links">
                <a style="margin-right: 10px;" href="https://twitter.com/lildavegoth"><span class="icon icon-twitter"></span></a>
                <a style="margin-left: 10px;" href="https://instagram.com/dave_goth"><span class="icon icon-instagram"></span></a>
            </div>
            <p>© 2026 lildavegoth | 3 Tiles</p>
            <p style="margin-top: 8px; font-size: 0.8rem; color: #666;">
                Conveys the Idea of a Protected and Inspiring Space for Creative Expression.
            </p>
        </footer>
        
    </div>

    <script>
        const icons = [
            'fas fa-gamepad', 'fas fa-keyboard', 'fas fa-headphones',
            'fas fa-camera', 'fas fa-music', 'fas fa-film',
            'fas fa-palette', 'fas fa-code', 'fas fa-bug',
            'fas fa-cloud', 'fas fa-wifi', 'fas fa-bolt',
            'fas fa-shield-alt', 'fas fa-lock', 'fas fa-robot'
        ];
    
        let gameState = {
            score: 0,
            selectedTiles: [],
            selectedTileElements: []
        };
    
        const gameGrid = document.getElementById('gameGrid');
        const scoreElement = document.getElementById('score');
        const selected1 = document.getElementById('selected1');
        const selected2 = document.getElementById('selected2');
        const selected3 = document.getElementById('selected3');
        const gameModal = document.getElementById('gameModal');
    
        function initGame() {
            gameState = {
                score: 0,
                selectedTiles: [],
                selectedTileElements: []
            };
            
            updateDisplay();
            clearSelection();
            generateTiles();
        }
    
        function generateTiles() {
            gameGrid.innerHTML = '';
            const tileCount = 25;
            
            for (let i = 0; i < tileCount; i++) {
                const randomIcon = icons[Math.floor(Math.random() * icons.length)];
                const tile = document.createElement('div');
                tile.className = 'tile';
                tile.innerHTML = `<i class="${randomIcon} icon"></i>`;
                tile.dataset.icon = randomIcon;
                tile.dataset.index = i;
                
                tile.addEventListener('click', () => selectTile(tile));
                gameGrid.appendChild(tile);
            }
        }
    
        function selectTile(tile) {
            if (gameState.selectedTileElements.includes(tile)) {
                unselectTile(tile);
                return;
            }
            
            if (gameState.selectedTiles.length >= 3) return;
            
            tile.classList.add('selected');
            gameState.selectedTiles.push(tile.dataset.icon);
            gameState.selectedTileElements.push(tile);
            
            updateSelectionDisplay();
            
            if (gameState.selectedTiles.length === 3) {
                checkForMatch();
            }
        }
    
        function unselectTile(tile) {
            tile.classList.remove('selected');
            const index = gameState.selectedTileElements.indexOf(tile);
            gameState.selectedTiles.splice(index, 1);
            gameState.selectedTileElements.splice(index, 1);
            updateSelectionDisplay();
        }
    
        function updateSelectionDisplay() {
            const selectedElements = [selected1, selected2, selected3];
            
            selectedElements.forEach((element, index) => {
                if (index < gameState.selectedTiles.length) {
                    element.classList.remove('empty');
                    element.innerHTML = `<i class="${gameState.selectedTiles[index]} icon"></i>`;
                } else {
                    element.classList.add('empty');
                    element.innerHTML = '<i class="fas fa-plus"></i>';
                }
            });
        }
    
        function clearSelection() {
            gameState.selectedTileElements.forEach(tile => {
                tile.classList.remove('selected');
            });
            
            gameState.selectedTiles = [];
            gameState.selectedTileElements = [];
            
            updateSelectionDisplay();
        }
    
        function checkForMatch() {
            const firstIcon = gameState.selectedTiles[0];
            const allMatch = gameState.selectedTiles.every(icon => icon === firstIcon);
            
            if (allMatch) {
                processMatch();
            } else {
                endGame();
            }
        }
    
        function processMatch() {
            gameState.score += 100;
            
            gameState.selectedTileElements.forEach(tile => {
                tile.classList.add('matched');
                setTimeout(() => {
                    const randomIcon = icons[Math.floor(Math.random() * icons.length)];
                    tile.innerHTML = `<i class="${randomIcon} icon"></i>`;
                    tile.dataset.icon = randomIcon;
                    tile.classList.remove('matched', 'selected');
                }, 500);
            });
            
            updateDisplay();
            clearSelection();
        }
    
        function endGame() {
            gameModal.style.display = 'flex';
        }
    
        function updateDisplay() {
            scoreElement.textContent = gameState.score;
        }
    
        document.getElementById('newGameBtn').addEventListener('click', initGame);
        document.getElementById('restartBtn').addEventListener('click', initGame);
        document.getElementById('closeModalBtn').addEventListener('click', () => {
            gameModal.style.display = 'none';
            initGame();
        });
    
        window.addEventListener('DOMContentLoaded', initGame);
    </script>
</body>
</html>
