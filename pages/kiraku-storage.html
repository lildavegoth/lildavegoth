<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover">
    <meta name="color-scheme" content="dark">
    <title>Kiraku Storage | lildavegoth</title>
    <script src="../protections.js"></script>
    <script src="../notification.cssjs"></script>
    <link rel="stylesheet" href="../media.css">
    <script src="../ui-icons.js"></script>
    <style>
        :root {
            --accent-color: #C1FC32;
            --accent-dark: #9bc726;
            --bg-black: #000000;
            --bg-dark: #1a1a1a;
            --bg-card: rgba(30, 30, 30, 0.7);
            --text-primary: #f5f5f7;
            --text-secondary: #a1a1a6;
            --radius-small: 12px;
            --radius-medium: 20px;
            --radius-large: 28px;
            --spacing-xs: 8px;
            --spacing-sm: 16px;
            --spacing-md: 24px;
            --spacing-lg: 32px;
            --spacing-xl: 48px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-black);
            color: var(--text-primary);
            min-height: 100vh;
            overflow-x: hidden;
            padding-bottom: 90px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: var(--spacing-md);
            position: relative;
            min-height: calc(100vh - 90px);
        }

        header {
            height: 64px;
            border-bottom: 1px solid #222;
            background: var(--bg-dark);
            padding: 0 var(--spacing-sm);
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 20;
            gap: var(--spacing-xs);
        }

        .logo-area {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-shrink: 0;
        }

        .logo-area img {
            width: 40px;
            height: 40px;
            border-radius: var(--radius-small);
            object-fit: contain;
        }

        .logo-text {
            font-weight: 700;
            font-size: 18px;
            color: var(--text-primary);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .logo-badge {
            font-size: 10px;
            text-transform: uppercase;
            font-weight: 600;
            background: rgba(193, 252, 50, 0.15);
            color: var(--accent-color);
            padding: 2px 8px;
            border-radius: 999px;
        }

        .search-box {
            flex: 1;
            max-width: 480px;
            position: relative;
            margin: 0 var(--spacing-xs);
        }

        .search-box input {
            width: 100%;
            padding: 10px 16px 10px 40px;
            background: #111;
            border: 1px solid #333;
            border-radius: 999px;
            color: var(--text-primary);
            font-size: 14px;
            outline: none;
        }

        .search-box input:focus {
            border-color: var(--accent-color);
        }

        .search-box svg {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            width: 16px;
            height: 16px;
            color: var(--text-secondary);
            pointer-events: none;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-shrink: 0;
        }

        .user-btn {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 4px 10px 4px 4px;
            border-radius: 999px;
            border: 1px solid #333;
            background: transparent;
            color: var(--text-primary);
            cursor: pointer;
        }

        .user-avatar {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--accent-color), var(--accent-dark));
            color: #000;
            font-weight: 700;
            font-size: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .layout {
            display: flex;
            height: calc(100vh - 64px);
        }

        aside {
            width: 260px;
            border-right: 1px solid #222;
            background: var(--bg-dark);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            flex-shrink: 0;
            overflow-y: auto;
            padding: var(--spacing-sm);
        }

        .new-btn {
            display: flex;
            align-items: center;
            gap: 12px;
            width: 100%;
            padding: 14px 20px;
            border-radius: var(--radius-medium);
            background: #222;
            border: 1px solid #333;
            color: var(--text-primary);
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            margin-bottom: var(--spacing-sm);
        }

        .new-btn:hover {
            background: #2a2a2a;
        }

        .new-icon {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--accent-color), var(--accent-dark));
            display: flex;
            align-items: center;
            justify-content: center;
            color: #000;
        }

        nav {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .nav-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 16px;
            border-radius: 999px;
            font-size: 14px;
            font-weight: 500;
            color: var(--text-secondary);
            cursor: pointer;
            transition: all 0.2s;
        }

        .nav-item:hover {
            background: #222;
            color: var(--text-primary);
        }

        .nav-item.active {
            background: rgba(193, 252, 50, 0.12);
            color: var(--accent-color);
            font-weight: 600;
        }

        .nav-item svg {
            width: 18px;
            height: 18px;
            flex-shrink: 0;
        }

        .storage-card {
            background: #111;
            border: 1px solid #333;
            border-radius: var(--radius-medium);
            padding: var(--spacing-sm);
            margin-top: var(--spacing-sm);
        }

        .storage-header {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .storage-header span:last-child {
            color: var(--accent-color);
        }

        .storage-bar {
            width: 100%;
            height: 6px;
            background: #333;
            border-radius: 999px;
            overflow: hidden;
            display: flex;
        }

        .storage-bar div {
            height: 100%;
        }

        .storage-info {
            font-size: 11px;
            color: var(--text-secondary);
            margin-top: 8px;
        }

        main {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-width: 0;
            background: var(--bg-black);
            overflow: hidden;
        }

        .toolbar {
            border-bottom: 1px solid #222;
            background: var(--bg-dark);
            padding: 10px var(--spacing-sm);
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            flex-wrap: wrap;
        }

        .breadcrumb {
            font-size: 14px;
            font-weight: 600;
            color: var(--text-primary);
        }

        .filters {
            display: flex;
            gap: 8px;
            overflow-x: auto;
        }

        .filter-btn {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 6px 14px;
            border-radius: 999px;
            font-size: 12px;
            font-weight: 500;
            background: #222;
            color: var(--text-secondary);
            border: none;
            cursor: pointer;
            white-space: nowrap;
        }

        .filter-btn.active {
            background: var(--accent-color);
            color: #000;
        }

        .filter-btn svg {
            width: 14px;
            height: 14px;
        }

        .content {
            flex: 1;
            overflow-y: auto;
            padding: var(--spacing-md);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
        }

        .empty-icon {
            width: 80px;
            height: 80px;
            border-radius: var(--radius-large);
            background: rgba(193, 252, 50, 0.1);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--accent-color);
            margin-bottom: var(--spacing-sm);
        }

        .empty-icon svg {
            width: 40px;
            height: 40px;
        }

        .empty-title {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 6px;
        }

        .empty-desc {
            font-size: 13px;
            color: var(--text-secondary);
            max-width: 360px;
            margin-bottom: var(--spacing-md);
        }

        .action-row {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .action-btn {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 12px 18px;
            border-radius: var(--radius-small);
            font-size: 13px;
            font-weight: 600;
            border: none;
            cursor: pointer;
            transition: all 0.2s;
        }

        .action-btn.primary {
            background: var(--accent-color);
            color: #000;
        }

        .action-btn.primary:hover {
            background: var(--accent-dark);
        }

        .action-btn.secondary {
            background: #222;
            color: var(--text-primary);
            border: 1px solid #333;
        }

        .action-btn.secondary:hover {
            background: #2a2a2a;
        }

        .action-btn svg {
            width: 16px;
            height: 16px;
        }

        .bottom-nav {
            display: none;
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            z-index: 30;
            background: rgba(26, 26, 26, 0.95);
            backdrop-filter: blur(12px);
            border-top: 1px solid #333;
            padding: 8px 12px max(12px, env(safe-area-inset-bottom));
            justify-content: space-around;
            align-items: center;
        }

        .bottom-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            color: var(--text-secondary);
            font-size: 10px;
            background: none;
            border: none;
            cursor: pointer;
            padding: 4px;
        }

        .bottom-item.active {
            color: var(--accent-color);
            font-weight: 700;
        }

        .bottom-item svg {
            width: 22px;
            height: 22px;
        }

        .upload-fab {
            width: 48px;
            height: 48px;
            border-radius: 16px;
            background: linear-gradient(135deg, var(--accent-color), var(--accent-dark));
            color: #000;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 2px solid var(--bg-black);
            margin-top: -20px;
            box-shadow: 0 4px 16px rgba(193, 252, 50, 0.3);
            cursor: pointer;
        }

        .upload-fab svg {
            width: 24px;
            height: 24px;
        }

        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.7);
            z-index: 100;
            display: none;
            align-items: center;
            justify-content: center;
        }

        .modal-overlay.show {
            display: flex;
        }

        .modal {
            background: var(--bg-dark);
            border: 1px solid #333;
            border-radius: var(--radius-medium);
            width: 90%;
            max-width: 400px;
            padding: var(--spacing-md);
        }

        .modal h3 {
            font-size: 18px;
            margin-bottom: var(--spacing-sm);
        }

        .modal input,
        .modal textarea {
            width: 100%;
            padding: 12px;
            background: #111;
            border: 1px solid #333;
            border-radius: var(--radius-small);
            color: var(--text-primary);
            font-size: 14px;
            margin-bottom: var(--spacing-sm);
            outline: none;
            resize: none;
        }

        .modal input:focus,
        .modal textarea:focus {
            border-color: var(--accent-color);
        }

        .modal-actions {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
        }

        .modal-actions button {
            padding: 10px 18px;
            border-radius: var(--radius-small);
            font-size: 13px;
            font-weight: 600;
            border: none;
            cursor: pointer;
        }

        .modal-actions .cancel {
            background: #333;
            color: var(--text-primary);
        }

        .modal-actions .confirm {
            background: var(--accent-color);
            color: #000;
        }

        .file-list {
            display: none;
            width: 100%;
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 16px;
            padding: var(--spacing-sm) 0;
        }

        .file-list.show {
            display: grid;
        }

        .file-card {
            background: #111;
            border: 1px solid #333;
            border-radius: var(--radius-small);
            padding: 16px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
        }

        .file-card:hover {
            border-color: var(--accent-color);
            background: #1a1a1a;
        }

        .file-icon {
            width: 48px;
            height: 48px;
            margin: 0 auto 10px;
            border-radius: 12px;
            background: rgba(193, 252, 50, 0.1);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--accent-color);
        }

        .file-name {
            font-size: 13px;
            font-weight: 500;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .file-meta {
            font-size: 11px;
            color: var(--text-secondary);
            margin-top: 4px;
        }

        @media (max-width: 900px) {
            aside {
                display: none;
            }

            .bottom-nav {
                display: flex;
            }

            body {
                padding-bottom: 80px;
            }
        }

        @media (max-width: 600px) {
            .logo-text span:last-child {
                display: none;
            }

            .search-box {
                max-width: none;
            }

            .user-btn span {
                display: none;
            }
        }
    </style>
</head>
<body>
    <header>
        <div class="logo-area">
            <div class="user-avatar" style="width:40px;height:40px;font-size:16px;">T</div>
            <div class="logo-text">
                TeleDrive
                <span class="logo-badge">Cloud</span>
            </div>
        </div>
        <div class="search-box">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
            <input type="text" id="searchInput" placeholder="Search files...">
        </div>
        <div class="header-actions">
            <button class="user-btn" id="userMenuBtn">
                <div class="user-avatar">U</div>
                <span>User</span>
            </button>
        </div>
    </header>

    <div class="layout">
        <aside>
            <div>
                <button class="new-btn" id="newBtn">
                    <div class="new-icon">
                        <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M5 12h14"/><path d="M12 5v14"/></svg>
                    </div>
                    New
                </button>
                <nav>
                    <div class="nav-item active" data-view="drive">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="22" x2="2" y1="12" y2="12"/><path d="M5.45 5.11 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"/><line x1="6" x2="6.01" y1="16" y2="16"/><line x1="10" x2="10.01" y1="16" y2="16"/></svg>
                        My Drive
                    </div>
                    <div class="nav-item" data-view="shared">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
                        Shared with me
                    </div>
                    <div class="nav-item" data-view="imports">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14.536 21.686a.5.5 0 0 0 .937-.024l6.5-19a.496.496 0 0 0-.635-.635l-19 6.5a.5.5 0 0 0-.024.937l7.93 3.18a2 2 0 0 1 1.112 1.11z"/><path d="m21.854 2.147-10.94 10.939"/></svg>
                        Imported Media
                    </div>
                    <div class="nav-item" data-view="starred">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11.525 2.295a.53.53 0 0 1 .95 0l2.31 4.679a2.123 2.123 0 0 0 1.595 1.16l5.166.756a.53.53 0 0 1 .294.904l-3.736 3.638a2.123 2.123 0 0 0-.611 1.878l.882 5.14a.53.53 0 0 1-.771.56l-4.618-2.428a2.122 2.122 0 0 0-1.973 0L6.396 21.01a.53.53 0 0 1-.77-.56l.881-5.139a2.122 2.122 0 0 0-.611-1.879L2.16 9.795a.53.53 0 0 1 .294-.906l5.165-.755a2.122 2.122 0 0 0 1.597-1.16z"/></svg>
                        Starred
                    </div>
                    <div class="nav-item" data-view="trash">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/><line x1="10" x2="10" y1="11" y2="17"/><line x1="14" x2="14" y1="11" y2="17"/></svg>
                        Trash
                    </div>
                    <div class="nav-item" data-view="settings">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg>
                        Account Settings
                    </div>
                </nav>
            </div>
            <div class="storage-card">
                <div class="storage-header">
                    <span>Storage</span>
                    <span>Unlimited</span>
                </div>
                <div class="storage-bar">
                    <div style="width:40%;background:#3b82f6;"></div>
                    <div style="width:25%;background:#10b981;"></div>
                    <div style="width:20%;background:#8b5cf6;"></div>
                    <div style="width:10%;background:#f59e0b;"></div>
                </div>
                <p class="storage-info" id="storageInfo">0 B stored · 0 files</p>
            </div>
        </aside>

        <main>
            <div class="toolbar">
                <div class="breadcrumb" id="breadcrumb">My Drive</div>
                <div class="filters">
                    <button class="filter-btn active" data-filter="all">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 7h-3a2 2 0 0 1-2-2V2"/><path d="M9 18a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h7l4 4v10a2 2 0 0 1-2 2Z"/><path d="M3 7.6v12.8A1.6 1.6 0 0 0 4.6 22h9.8"/></svg>
                        All
                    </button>
                    <button class="filter-btn" data-filter="videos">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect width="18" height="18" x="3" y="3" rx="2"/><path d="M7 3v18"/><path d="M3 7.5h4"/><path d="M3 12h18"/><path d="M3 16.5h4"/><path d="M17 3v18"/><path d="M17 7.5h4"/><path d="M17 16.5h4"/></svg>
                        Videos
                    </button>
                    <button class="filter-btn" data-filter="photos">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect width="18" height="18" x="3" y="3" rx="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-3.086-3.086a2 2 0 0 0-2.828 0L6 21"/></svg>
                        Photos
                    </button>
                    <button class="filter-btn" data-filter="pdfs">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"/><path d="M14 2v4a2 2 0 0 0 2 2h4"/><path d="M10 9H8"/><path d="M16 13H8"/><path d="M16 17H8"/></svg>
                        PDFs
                    </button>
                    <button class="filter-btn" data-filter="audio">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>
                        Audio
                    </button>
                    <button class="filter-btn" data-filter="docs">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"/><path d="M14 2v4a2 2 0 0 0 2 2h4"/><path d="M10 9H8"/><path d="M16 13H8"/><path d="M16 17H8"/></svg>
                        Docs
                    </button>
                </div>
            </div>

            <div class="content" id="contentArea">
                <div id="emptyState">
                    <div class="empty-icon">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 20a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.69-.9L9.6 3.9A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2Z"/></svg>
                    </div>
                    <h3 class="empty-title">This folder is empty</h3>
                    <p class="empty-desc">Upload files to your cloud storage or import media links directly.</p>
                    <div class="action-row">
                        <button class="action-btn primary" id="uploadBtn">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" x2="12" y1="3" y2="15"/></svg>
                            Upload File
                        </button>
                        <button class="action-btn secondary" id="importBtn">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 17H7A5 5 0 0 1 7 7h2"/><path d="M15 7h2a5 5 0 1 1 0 10h-2"/><line x1="8" x2="16" y1="12" y2="12"/></svg>
                            Import Link
                        </button>
                        <button class="action-btn secondary" id="newFolderBtn">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 10v6"/><path d="M9 13h6"/><path d="M20 20a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.69-.9L9.6 3.9A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2Z"/></svg>
                            New Folder
                        </button>
                    </div>
                </div>
                <div class="file-list" id="fileList"></div>
            </div>
        </main>
    </div>

    <div class="bottom-nav">
        <button class="bottom-item active" data-view="drive">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="22" x2="2" y1="12" y2="12"/><path d="M5.45 5.11 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"/><line x1="6" x2="6.01" y1="16" y2="16"/><line x1="10" x2="10.01" y1="16" y2="16"/></svg>
            Drive
        </button>
        <button class="bottom-item" data-view="shared">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
            Shared
        </button>
        <button class="upload-fab" id="fabUpload">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M5 12h14"/><path d="M12 5v14"/></svg>
        </button>
        <button class="bottom-item" data-view="imports">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14.536 21.686a.5.5 0 0 0 .937-.024l6.5-19a.496.496 0 0 0-.635-.635l-19 6.5a.5.5 0 0 0-.024.937l7.93 3.18a2 2 0 0 1 1.112 1.11z"/><path d="m21.854 2.147-10.94 10.939"/></svg>
            Imports
        </button>
        <button class="bottom-item" data-view="settings">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg>
            Settings
        </button>
    </div>

    <div class="modal-overlay" id="uploadModal">
        <div class="modal">
            <h3>Upload File</h3>
            <input type="file" id="fileInput" multiple>
            <div class="modal-actions">
                <button class="cancel" data-close="uploadModal">Cancel</button>
                <button class="confirm" id="confirmUpload">Upload</button>
            </div>
        </div>
    </div>

    <div class="modal-overlay" id="importModal">
        <div class="modal">
            <h3>Import Telegram Link</h3>
            <input type="text" id="importLink" placeholder="Paste Telegram media link...">
            <div class="modal-actions">
                <button class="cancel" data-close="importModal">Cancel</button>
                <button class="confirm" id="confirmImport">Import</button>
            </div>
        </div>
    </div>

    <div class="modal-overlay" id="folderModal">
        <div class="modal">
            <h3>New Folder</h3>
            <input type="text" id="folderName" placeholder="Folder name">
            <div class="modal-actions">
                <button class="cancel" data-close="folderModal">Cancel</button>
                <button class="confirm" id="confirmFolder">Create</button>
            </div>
        </div>
    </div>

    <input type="file" id="hiddenFileInput" multiple style="display:none">

    <script>
        const files = [];
        let currentFilter = 'all';
        let currentView = 'drive';

        const emptyState = document.getElementById('emptyState');
        const fileList = document.getElementById('fileList');
        const storageInfo = document.getElementById('storageInfo');
        const breadcrumb = document.getElementById('breadcrumb');

        function formatSize(bytes) {
            if (bytes === 0) return '0 B';
            const k = 1024;
            const sizes = ['B', 'KB', 'MB', 'GB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return parseFloat((bytes / Math.pow(k, i)).toFixed(1)) + ' ' + sizes[i];
        }

        function updateStorage() {
            const total = files.reduce((sum, f) => sum + (f.size || 0), 0);
            storageInfo.textContent = formatSize(total) + ' stored · ' + files.length + ' files';
        }

        function getIcon(type) {
            if (type.startsWith('video')) return '<svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2"><rect width="18" height="18" x="3" y="3" rx="2"/><path d="M7 3v18"/><path d="M3 7.5h4"/><path d="M3 12h18"/><path d="M3 16.5h4"/><path d="M17 3v18"/><path d="M17 7.5h4"/><path d="M17 16.5h4"/></svg>';
            if (type.startsWith('image')) return '<svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2"><rect width="18" height="18" x="3" y="3" rx="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-3.086-3.086a2 2 0 0 0-2.828 0L6 21"/></svg>';
            if (type === 'application/pdf') return '<svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"/><path d="M14 2v4a2 2 0 0 0 2 2h4"/><path d="M10 9H8"/><path d="M16 13H8"/><path d="M16 17H8"/></svg>';
            if (type.startsWith('audio')) return '<svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>';
            if (type === 'folder') return '<svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 20a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.69-.9L9.6 3.9A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2Z"/></svg>';
            return '<svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"/><path d="M14 2v4a2 2 0 0 0 2 2h4"/></svg>';
        }

        function matchesFilter(file) {
            if (currentFilter === 'all') return true;
            if (currentFilter === 'videos') return file.type.startsWith('video');
            if (currentFilter === 'photos') return file.type.startsWith('image');
            if (currentFilter === 'pdfs') return file.type === 'application/pdf';
            if (currentFilter === 'audio') return file.type.startsWith('audio');
            if (currentFilter === 'docs') return file.type.includes('document') || file.type.includes('text') || file.type === 'application/msword';
            return true;
        }

        function renderFiles() {
            const filtered = files.filter(matchesFilter);
            if (filtered.length === 0) {
                emptyState.style.display = 'block';
                fileList.classList.remove('show');
                fileList.innerHTML = '';
            } else {
                emptyState.style.display = 'none';
                fileList.classList.add('show');
                fileList.innerHTML = filtered.map(f => `
                    <div class="file-card" data-id="${f.id}">
                        <div class="file-icon">${getIcon(f.type)}</div>
                        <div class="file-name">${f.name}</div>
                        <div class="file-meta">${f.type === 'folder' ? 'Folder' : formatSize(f.size)}</div>
                    </div>
                `).join('');
            }
            updateStorage();
        }

        function openModal(id) {
            document.getElementById(id).classList.add('show');
        }

        function closeModal(id) {
            document.getElementById(id).classList.remove('show');
        }

        document.querySelectorAll('[data-close]').forEach(btn => {
            btn.addEventListener('click', () => closeModal(btn.getAttribute('data-close')));
        });

        document.getElementById('uploadBtn').addEventListener('click', () => openModal('uploadModal'));
        document.getElementById('fabUpload').addEventListener('click', () => openModal('uploadModal'));
        document.getElementById('importBtn').addEventListener('click', () => openModal('importModal'));
        document.getElementById('newFolderBtn').addEventListener('click', () => openModal('folderModal'));
        document.getElementById('newBtn').addEventListener('click', () => openModal('folderModal'));

        document.getElementById('confirmUpload').addEventListener('click', () => {
            const input = document.getElementById('fileInput');
            if (input.files.length) {
                Array.from(input.files).forEach(file => {
                    files.push({
                        id: Date.now() + Math.random(),
                        name: file.name,
                        size: file.size,
                        type: file.type || 'application/octet-stream'
                    });
                });
                renderFiles();
                input.value = '';
            }
            closeModal('uploadModal');
        });

        document.getElementById('confirmImport').addEventListener('click', () => {
            const link = document.getElementById('importLink').value.trim();
            if (link) {
                const name = link.split('/').pop() || 'Imported Media';
                files.push({
                    id: Date.now() + Math.random(),
                    name: name.slice(0, 40),
                    size: 0,
                    type: 'video/mp4'
                });
                renderFiles();
                document.getElementById('importLink').value = '';
            }
            closeModal('importModal');
        });

        document.getElementById('confirmFolder').addEventListener('click', () => {
            const name = document.getElementById('folderName').value.trim();
            if (name) {
                files.push({
                    id: Date.now() + Math.random(),
                    name: name,
                    size: 0,
                    type: 'folder'
                });
                renderFiles();
                document.getElementById('folderName').value = '';
            }
            closeModal('folderModal');
        });

        document.querySelectorAll('.filter-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentFilter = btn.getAttribute('data-filter');
                renderFiles();
            });
        });

        document.querySelectorAll('.nav-item, .bottom-item').forEach(item => {
            item.addEventListener('click', () => {
                const view = item.getAttribute('data-view');
                if (!view) return;
                currentView = view;
                document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
                document.querySelectorAll('.bottom-item').forEach(n => n.classList.remove('active'));
                document.querySelectorAll(`[data-view="${view}"]`).forEach(n => n.classList.add('active'));
                const titles = {
                    drive: 'My Drive',
                    shared: 'Shared with me',
                    imports: 'Imported Media',
                    starred: 'Starred',
                    trash: 'Trash',
                    settings: 'Account Settings'
                };
                breadcrumb.textContent = titles[view] || 'My Drive';
                if (view === 'settings') {
                    emptyState.style.display = 'block';
                    fileList.classList.remove('show');
                    emptyState.querySelector('.empty-title').textContent = 'Account Settings';
                    emptyState.querySelector('.empty-desc').textContent = 'Manage your account, security and preferences.';
                    emptyState.querySelector('.action-row').style.display = 'none';
                } else {
                    emptyState.querySelector('.empty-title').textContent = 'This folder is empty';
                    emptyState.querySelector('.empty-desc').textContent = 'Upload files to your cloud storage or import media links directly.';
                    emptyState.querySelector('.action-row').style.display = 'flex';
                    renderFiles();
                }
            });
        });

        document.getElementById('searchInput').addEventListener('input', (e) => {
            const q = e.target.value.toLowerCase();
            const cards = fileList.querySelectorAll('.file-card');
            cards.forEach(card => {
                const name = card.querySelector('.file-name').textContent.toLowerCase();
                card.style.display = name.includes(q) ? '' : 'none';
            });
        });

        renderFiles();
    </script>
</body>
</html>
