<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Watermark Applier | lildavegoth</title>
    <meta name="color-scheme" content="dark">
    <script src="../protections.js"></script>
    <script src="../notification.cssjs"></script>
    <link rel="stylesheet" href="../media.css">
    <script src="../ui-icons.js"></script>
    <style>
        :root {
            --accent-color: #C1FC32;
            --bg-black: #000000;
            --bg-dark: #1a1a1a;
            --bg-card: rgba(30, 30, 30, 0.7);
            --text-primary: #f5f5f7;
            --text-secondary: #a1a1a6;
            --radius-small: 12px;
            --radius-medium: 20px;
            --radius-large: 28px;
            --spacing-xs: 8px;
            --spacing-sm: 16px;
            --spacing-md: 24px;
            --spacing-lg: 32px;
            --clear-bg: #C42833;
            --clear-bg-hover: #a01f28;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
        }

        body {
            background-color: var(--bg-black);
            color: var(--text-primary);
            min-height: 100vh;
            background-image:
                radial-gradient(circle at 20% 80%, rgba(193, 252, 50, 0.05) 0%, transparent 20%),
                radial-gradient(circle at 80% 20%, rgba(193, 252, 50, 0.03) 0%, transparent 20%);
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: var(--spacing-sm);
        }

        .tool-card {
            background: var(--bg-card);
            border-radius: var(--radius-large);
            padding: var(--spacing-md);
            border: 1px solid rgba(255, 255, 255, 0.05);
            width: 100%;
            margin-bottom: var(--spacing-md);
        }

        .io-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: var(--spacing-md);
        }

        @media (min-width: 768px) {
            .io-grid {
                grid-template-columns: 1fr 1fr;
                gap: var(--spacing-lg);
            }
        }

        .io-section {
            display: flex;
            flex-direction: column;
            height: 100%;
        }

        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: var(--spacing-xs);
            padding: 0 4px;
        }

        .section-title {
            font-size: 1rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .preview-container {
            background: rgba(0, 0, 0, 0.3);
            border-radius: var(--radius-medium);
            padding: var(--spacing-sm);
            border: 1px solid rgba(255, 255, 255, 0.05);
            margin-bottom: var(--spacing-md);
            position: relative;
            overflow: hidden;
        }

        .preview-content {
            min-height: 250px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: var(--spacing-sm);
            position: relative;
        }

        .watermark-canvas {
            width: 100%;
            height: auto;
            border-radius: var(--radius-small);
            box-shadow: 0 8px 20px rgba(0,0,0,0.5);
            display: block;
            margin: 0 auto;
        }

        .preview-placeholder {
            color: var(--text-secondary);
            text-align: center;
            padding: var(--spacing-lg);
            font-size: 0.9rem;
            background: var(--bg-card);
            border-radius: var(--radius-small);
            border: 1px solid rgba(255,255,255,0.05);
            width: 100%;
            box-sizing: border-box;
        }

        .hidden {
            display: none !important;
        }

        input[type="file"] {
            display: none;
        }

        .watermark-wrapper {
            display: flex;
            gap: 8px;
            margin-top: 4px;
            margin-bottom: var(--spacing-sm);
        }

        .watermark-input {
            flex: 1;
            background: rgba(0,0,0,0.5);
            border: 2px solid rgba(255,255,255,0.1);
            border-radius: var(--radius-medium);
            padding: 12px 14px;
            color: var(--text-primary);
            font-size: 0.95rem;
            width: 100%;
            resize: none;
        }

        .watermark-input:focus {
            outline: none;
            border-color: var(--accent-color);
        }

        .apply-btn {
            background: var(--accent-color);
            color: var(--bg-black);
            border: none;
            border-radius: 100px;
            width: 44px;
            height: 44px;
            font-weight: 600;
            font-size: 1.1rem;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .apply-btn:hover {
            background: var(--accent-color);
        }

        .apply-btn:active {
            transform: scale(0.96) translateY(1px);
        }

        .button-row {
            display: flex;
            gap: 8px;
            margin-top: var(--spacing-sm);
            width: 100%;
        }

        .button-col {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-top: var(--spacing-sm);
            width: 100%;
        }

        .icon-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 12px 10px;
            border: none;
            border-radius: var(--radius-medium);
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.2s ease;
            min-height: 44px;
            text-align: center;
            flex: 1;
        }

        .icon-btn:active {
            transform: scale(0.96) translateY(1px);
        }

        .btn-primary {
            background: var(--accent-color);
            color: var(--bg-black);
        }

        .btn-primary:hover {
            background: var(--accent-color);
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.1);
            color: var(--text-primary);
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        .btn-full {
            width: 100%;
        }

        #clearBtn {
            background-color: var(--clear-bg);
        }

        #clearBtn:hover {
            background-color: var(--clear-bg-hover);
        }

        .watermark-settings {
            display: flex;
            gap: 16px;
            align-items: center;
            margin-bottom: var(--spacing-sm);
            flex-wrap: wrap;
        }

        .setting-group {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .setting-group label {
            font-size: 0.8rem;
            color: var(--text-secondary);
        }

        .popup-trigger {
            background: rgba(0,0,0,0.5);
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 8px;
            color: var(--text-primary);
            padding: 6px 12px;
            font-size: 0.85rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            min-width: 100px;
            justify-content: space-between;
        }

        .popup-trigger.full-width-mode {
            width: 100%;
            justify-content: center;
            padding: 12px;
            font-size: 1rem;
            border-radius: var(--radius-medium);
            margin-bottom: var(--spacing-sm);
        }

        .color-icon-btn {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            background: transparent;
            border: none;
            padding: 0;
        }

        .color-icon-btn i {
            font-size: 24px;
            filter: drop-shadow(0 1px 2px rgba(0,0,0,0.5));
        }

        input[type="range"] {
            -webkit-appearance: none;
            appearance: none;
            width: 100px;
            height: 24px;
            background: transparent;
            outline: none;
            margin: 0;
            padding: 0;
        }

        input[type="range"]::-webkit-slider-runnable-track {
            width: 100%;
            height: 4px;
            background: rgba(255,255,255,0.2);
            border-radius: 2px;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 14px;
            height: 24px;
            border-radius: 50px;
            background: var(--accent-color);
            border: 2px solid #000000;
            box-sizing: border-box;
            margin-top: -10px;
            cursor: pointer;
        }

        .popup-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 1.0);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 99999999;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .popup-content {
            background: var(--bg-card);
            border-radius: var(--radius-large);
            width: 90%;
            max-width: 400px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
            max-height: 70vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .popup-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: var(--spacing-md);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .popup-header h2 {
            font-size: 1.3rem;
            font-weight: 600;
        }

        .close-popup {
            background: transparent;
            border: none;
            color: var(--text-secondary);
            font-size: 1.2rem;
            cursor: pointer;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .popup-options {
            padding: var(--spacing-sm);
            display: flex;
            flex-direction: column;
            gap: 4px;
            overflow-y: auto;
        }

        .popup-option-item {
            padding: 12px 16px;
            border-radius: var(--radius-small);
            cursor: pointer;
            font-size: 0.95rem;
            color: var(--text-primary);
            transition: background 0.2s;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .popup-option-item:hover {
            background: rgba(193,252,50,0.1);
        }

        .popup-option-item.selected {
            background: var(--accent-color);
            font-weight: 600;
            color: black;
        }

        .popup-option-item i {
            width: 20px;
            text-align: center;
        }

        @media (max-width: 480px) {
            .tool-card {
                padding: 14px;
                border-radius: 20px;
            }
            .apply-btn {
                width: 44px;
            }
            .preview-content {
                min-height: 200px;
            }
            .icon-btn {
                padding: 10px 8px;
                font-size: 0.85rem;
            }
            .watermark-settings {
                gap: 8px;
            }
            .popup-content {
                max-width: 320px;
            }
        }

        .icon-btn, .apply-btn, .popup-trigger {
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <a href="../index.html" class="back-link">
            <i class="fas fa-arrow-left"></i> Back To Home
        </a>

        <app-header class="fade-in">
            <div>
                <h1 class="username">Watermark Applier</h1>
                <p class="tagline">Add a Tiled Diagonal or Timestamp with Username watermarks to your images that covers the entire picture</p>

        </app-header>

        <div class="io-grid">
            <div class="io-section">
                <button class="popup-trigger full-width-mode" id="watermarkModeBtn">

                    </div>
                    <div class="setting-group">
                        <label>Weight</label>
                        <button class="popup-trigger" id="weightSelectBtn">

                <div class="preview-container">

                    </label>

                    </button>
                </div>

                <div class="button-col">
                    <button class="icon-btn btn-primary btn-full" id="saveImageBtn">

                    </button>

        </div>

        <footer>
            <div class="social-links">
                <a href="https://twitter.com/lildavegoth"><span class="icon icon-twitter"></span></a>
                <a href="https://instagram.com/dave_goth"><span class="icon icon-instagram"></span></a>
            </div>
            <p>© 2026 lildavegoth | Watermark Applier</p>
            <p style="margin-top: 8px; font-size: 0.8rem; color: #666;">
                Conveys the Idea of a Protected and Inspiring Space for Creative Expression.
            </p>
        </footer>
    </div>

    <div id="universalPopup" class="popup-overlay hidden">
        <div class="popup-content">
            <div class="popup-header">
                <h2 id="popupTitle"></h2>
                <button class="close-popup" id="closePopupBtn">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            <div class="popup-options" id="popupOptions"></div>
        </div>
    </div>

    <script>
        const imageInput = document.getElementById('imageInput');
        const watermarkInput = document.getElementById('watermarkText');
        const applyWatermarkBtn = document.getElementById('applyWatermarkBtn');
        const previewContent = document.getElementById('previewContent');
        const previewPlaceholder = document.getElementById('previewPlaceholder');
        const clearBtn = document.getElementById('clearBtn');
        const saveImageBtn = document.getElementById('saveImageBtn');
        const opacitySlider = document.getElementById('watermarkOpacity');
        const colorPicker = document.getElementById('watermarkColor');
        const colorIcon = document.getElementById('colorIcon');
        const colorIconBtn = document.getElementById('colorIconBtn');
        const weightSelectBtn = document.getElementById('weightSelectBtn');
        const weightLabel = document.getElementById('weightLabel');
        const watermarkModeBtn = document.getElementById('watermarkModeBtn');
        const watermarkModeLabel = document.getElementById('watermarkModeLabel');
        const universalPopup = document.getElementById('universalPopup');
        const popupTitle = document.getElementById('popupTitle');
        const popupOptions = document.getElementById('popupOptions');
        const closePopupBtn = document.getElementById('closePopupBtn');

        let currentBase64 = '';
        let currentFileName = 'watermarked.png';
        let currentImage = null;
        let currentWeight = 'bold';
        let watermarkMode = 'default';
        const randomID = Math.floor(10000 + Math.random() * 90000);

        function getFormattedDate() {
            const now = new Date();
            const day = String(now.getDate()).padStart(2, '0');
            const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
            const month = months[now.getMonth()];
            const year = now.getFullYear();
            return `${day}${month}${year} — ${randomID}`;
        }

        function openUniversalPopup(title, options, currentValue, onSelect) {
            popupTitle.textContent = title;
            popupOptions.innerHTML = '';
            options.forEach(option => {
                const item = document.createElement('div');
                item.className = 'popup-option-item';
                if (option.value === currentValue) {
                    item.classList.add('selected');
                }
                item.innerHTML = `<i class="fas ${option.icon}"></i>${option.label}`;
                item.addEventListener('click', () => {
                    onSelect(option.value);
                    closeUniversalPopup();
                });
                popupOptions.appendChild(item);
            });
            universalPopup.classList.remove('hidden');
        }

        function closeUniversalPopup() {
            universalPopup.classList.add('hidden');
        }

        closePopupBtn.addEventListener('click', closeUniversalPopup);
        universalPopup.addEventListener('click', function(e) {
            if (e.target === universalPopup) {
                closeUniversalPopup();
            }
        });

        opacitySlider.addEventListener('input', function() {
            applyWatermark();
        });

        colorIconBtn.addEventListener('click', function(e) {
            e.stopPropagation();
            colorPicker.click();
        });

        colorPicker.addEventListener('input', function() {
            colorIcon.style.color = colorPicker.value;
            applyWatermark();
        });

        weightSelectBtn.addEventListener('click', function() {
            const options = [
                { value: 'normal', label: 'Normal', icon: 'fa-font' },
                { value: 'bold', label: 'Bold', icon: 'fa-bold' }
            ];
            openUniversalPopup('Font Weight', options, currentWeight, function(weight) {
                currentWeight = weight;
                weightLabel.textContent = weight.charAt(0).toUpperCase() + weight.slice(1);
                applyWatermark();
            });
        });

        watermarkModeBtn.addEventListener('click', function() {
            const options = [
                { value: 'default', label: 'Tiled Diagonal', icon: 'fa-th-large' },
                { value: 'timestamp', label: 'Timestamp Watermark', icon: 'fa-clock' }
            ];
            openUniversalPopup('Watermark Style', options, watermarkMode, function(mode) {
                watermarkMode = mode;
                watermarkModeLabel.textContent = mode === 'default' ? 'Tiled Diagonal' : 'Timestamp Watermark';
                applyWatermark();
            });
        });

        imageInput.addEventListener('change', handleImageUpload);
        applyWatermarkBtn.addEventListener('click', applyWatermark);
        clearBtn.addEventListener('click', clearAll);
        saveImageBtn.addEventListener('click', downloadWatermarked);

        function handleImageUpload(event) {
            const file = event.target.files[0];
            if (!file) return;

            if (file.size > 5 * 1024 * 1024) {
                window.showError('Image Too Large (Max 5MB)');
                return;
            }

            currentFileName = file.name.replace(/\.[^/.]+$/, '') + '.png';

            let text = watermarkInput.value || 'lildavegoth';
            if (text.length > 17) {
                text = text.substring(0, 17);
                watermarkInput.value = text;
            }

            const reader = new FileReader();
            reader.onload = function(e) {
                const img = new Image();
                img.onload = function() {
                    currentImage = img;
                    drawWatermarkOnCanvas(img, text);
                };
                img.src = e.target.result;
            };
            reader.onerror = () => window.showMessage('Failed To Read File');
            reader.readAsDataURL(file);
            window.showMessage('Image imported');
        }

        function applyWatermark() {
            if (!currentImage) return;

            let text = watermarkInput.value || 'lildavegoth';
            if (text.length > 17) {
                text = text.substring(0, 17);
                watermarkInput.value = text;
            }

            previewContent.innerHTML = '';
            previewPlaceholder.classList.remove('hidden');
            currentBase64 = '';

            setTimeout(() => {
                drawWatermarkOnCanvas(currentImage, text);
            }, 10);
        }

        function drawWatermarkOnCanvas(img, text) {
            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');
            canvas.width = img.width;
            canvas.height = img.height;

            ctx.drawImage(img, 0, 0, canvas.width, canvas.height);

            const opacity = parseFloat(opacitySlider.value);
            const color = colorPicker.value;

            const hexToRgb = (hex) => {
                const result = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);
                return result ? {
                    r: parseInt(result[1], 16),
                    g: parseInt(result[2], 16),
                    b: parseInt(result[3], 16)
                } : {r:255,g:255,b:255};
            };

            const rgb = hexToRgb(color);
            const fillStyle = `rgba(${rgb.r}, ${rgb.g}, ${rgb.b}, ${opacity})`;
            const strokeStyle = `rgba(0, 0, 0, ${opacity * 0.7})`;

            const fontString = `${currentWeight} 32px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif`;
            ctx.font = fontString;
            ctx.fillStyle = fillStyle;
            ctx.strokeStyle = strokeStyle;
            ctx.lineWidth = 2;

            const txt = text || 'lildavegoth';

            if (watermarkMode === 'default') {
                const diagonal = Math.sqrt(canvas.width * canvas.width + canvas.height * canvas.height);
                const stepX = 280;
                const stepY = 180;

                ctx.save();
                ctx.translate(canvas.width / 2, canvas.height / 2);
                ctx.rotate(45 * Math.PI / 180);
                ctx.translate(-canvas.width / 2, -canvas.height / 2);

                for (let y = -diagonal; y < diagonal; y += stepY) {
                    for (let x = -diagonal; x < diagonal; x += stepX) {
                        ctx.save();
                        ctx.translate(x, y);
                        ctx.strokeText(txt, 0, 0);
                        ctx.fillText(txt, 0, 0);
                        ctx.restore();
                    }
                }

                ctx.restore();
            } else if (watermarkMode === 'timestamp') {
                const timestamp = getFormattedDate();
                const smallFont = `${currentWeight} 24px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif`;
                ctx.font = smallFont;
                ctx.fillStyle = fillStyle;
                ctx.strokeStyle = strokeStyle;
                ctx.lineWidth = 1.5;

                const padding = 20;
                const usernameY = canvas.height - padding;
                const timestampY = canvas.height - padding;

                ctx.textAlign = 'left';
                ctx.strokeText(txt, padding, usernameY);
                ctx.fillText(txt, padding, usernameY);

                ctx.textAlign = 'right';
                ctx.strokeText(timestamp, canvas.width - padding, timestampY);
                ctx.fillText(timestamp, canvas.width - padding, timestampY);
            }

            currentBase64 = canvas.toDataURL('image/png');
            updatePreview(currentBase64);
        }

        function updatePreview(dataURL) {
            previewContent.innerHTML = '';
            previewPlaceholder.classList.add('hidden');

            const imgEl = document.createElement('img');
            imgEl.src = dataURL;
            imgEl.className = 'watermark-canvas';
            imgEl.alt = 'Watermarked';
            previewContent.appendChild(imgEl);
        }

        function downloadWatermarked() {
            if (!currentBase64) return;

            if (window.cordova && window.cordova.file) {
                cordovaDownload(currentBase64, currentFileName);
            } else {
                const a = document.createElement('a');
                a.href = currentBase64;
                a.download = currentFileName;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                window.showMessage('Watermarked image has been successfully downloaded');
            }
        }

        function cordovaDownload(dataURL, filename) {
            const base64Data = dataURL.replace(/^data:image\/png;base64,/, '');
            const byteCharacters = atob(base64Data);
            const byteNumbers = new Array(byteCharacters.length);
            for (let i = 0; i < byteCharacters.length; i++) {
                byteNumbers[i] = byteCharacters.charCodeAt(i);
            }
            const byteArray = new Uint8Array(byteNumbers);
            const blob = new Blob([byteArray], {type: 'image/png'});

            const directory = cordova.file.externalDataDirectory || cordova.file.dataDirectory;
            window.resolveLocalFileSystemURL(directory, function(dirEntry) {
                dirEntry.getFile(filename, {create: true, exclusive: false}, function(fileEntry) {
                    fileEntry.createWriter(function(fileWriter) {
                        fileWriter.onwriteend = function() {
                            window.showMessage('Watermarked image saved to device');
                        };
                        fileWriter.onerror = function(e) {
                            window.showError('Download failed: ' + e.toString());
                        };
                        fileWriter.write(blob);
                    }, function(e) {
                        window.showError('File writer error: ' + e.toString());
                    });
                }, function(e) {
                    window.showError('Get file error: ' + e.toString());
                });
            }, function(e) {
                window.showError('Directory access error: ' + e.toString());
            });
        }

        function clearAll() {
            imageInput.value = '';
            currentBase64 = '';
            currentImage = null;
            previewContent.innerHTML = '';
            previewPlaceholder.classList.remove('hidden');
            window.showMessage('Cleared. Import new image to start watermarking');
        }
    </script>
</body>
</html>
