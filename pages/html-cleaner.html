<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML Cleaner | lildavegoth</title>
    <meta name="color-scheme" content="dark">
    <script src="../protections.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --accent-color: #C1FC32;
            --accent-dark: #9bc726;
            --bg-black: #000000;
            --bg-dark: #1a1a1a;
            --bg-card: rgba(30, 30, 30, 0.7);
            --text-primary: #f5f5f7;
            --text-secondary: #a1a1a6;
            --radius-small: 12px;
            --radius-medium: 20px;
            --radius-large: 28px;
            --spacing-xs: 8px;
            --spacing-sm: 16px;
            --spacing-md: 24px;
            --spacing-lg: 32px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-black);
            color: var(--text-primary);
            min-height: 100vh;
            background-image: 
                radial-gradient(circle at 20% 80%, rgba(193, 252, 50, 0.05) 0%, transparent 20%),
                radial-gradient(circle at 80% 20%, rgba(193, 252, 50, 0.03) 0%, transparent 20%);
            padding: var(--spacing-md);
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        /* Header */
        header {
            margin-bottom: var(--spacing-lg);
        }

        .username {
            font-size: 2.5rem;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .tagline {
            color: var(--text-secondary);
            font-size: 1.1rem;
        }

        /* Editor Section */
        .editor-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: var(--spacing-md);
            margin-bottom: var(--spacing-lg);
        }

        @media (max-width: 768px) {
            .editor-container {
                grid-template-columns: 1fr;
            }
        }

        .editor-box {
            background: var(--bg-card);
            border-radius: var(--radius-medium);
            border: 1px solid rgba(255, 255, 255, 0.1);
            overflow: hidden;
        }

        .editor-header {
            padding: var(--spacing-sm);
            background: rgba(0, 0, 0, 0.3);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .editor-title {
            font-weight: 600;
        }

        .editor-buttons {
            display: flex;
            gap: 8px;
        }

        .icon-btn {
            background: none;
            border: none;
            color: var(--text-secondary);
            cursor: pointer;
            padding: 8px;
            border-radius: 6px;
        }

        .icon-btn:hover {
            background: rgba(255, 255, 255, 0.1);
            color: var(--accent-color);
        }

        textarea {
            width: 100%;
            height: 200px;
            background: transparent;
            border: none;
            color: var(--text-primary);
            padding: var(--spacing-md);
            font-family: 'Monaco', 'Consolas', monospace;
            font-size: 14px;
            line-height: 1.5;
            resize: vertical;
            outline: none;
        }

        textarea:focus {
            background: rgba(0, 0, 0, 0.2);
        }

        /* Options - New Styles */
        .options {
            display: flex;
            justify-content: center;
            margin-bottom: var(--spacing-lg);
        }

        .options-list {
            background: var(--bg-card);
            border-radius: var(--radius-medium);
            padding: var(--spacing-md);
            border: 1px solid rgba(255, 255, 255, 0.1);
            width: 350px;
            max-width: 100%;
        }

        .option-row {
            display: flex;
            align-items: center;
            gap: var(--spacing-md);
            padding: var(--spacing-sm);
            border-radius: var(--radius-small);
            transition: all 0.3s;
            margin-top: -10px;
        }

        .option-row:hover {
            background: rgba(255, 255, 255, 0.05);
        }

        .option-icon {
            width: 36px;
            height: 36px;
            border-radius: 8px;
            background: rgba(193, 252, 50, 0.1);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--accent-color);
            font-size: 0.9rem;
        }

        .option-text {
            flex: 1;
            color: var(--text-secondary);
            font-size: 0.95rem;
        }

        .option-row.active .option-text {
            color: var(--accent-color);
        }

        .toggle-switch {
            position: relative;
            width: 50px;
            height: 24px;
            flex-shrink: 0;
        }

        .toggle-checkbox {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .toggle-slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: rgba(255, 255, 255, 0.1);
            transition: .4s;
            border-radius: 34px;
        }

        .toggle-slider:before {
            position: absolute;
            content: "";
            height: 18px;
            width: 18px;
            left: 3px;
            bottom: 3px;
            background-color: var(--text-secondary);
            transition: .4s;
            border-radius: 50%;
        }

        .toggle-checkbox:checked + .toggle-slider {
            background-color: rgba(193, 252, 50, 0.2);
        }

        .toggle-checkbox:checked + .toggle-slider:before {
            transform: translateX(26px);
            background-color: var(--accent-color);
        }

        /* Action Buttons */
        .actions {
            display: flex;
            justify-content: center;
            margin-bottom: var(--spacing-lg);
        }
        
        .button-container {
            display: flex;
            gap: var(--spacing-sm);
            width: 300px;
            max-width: 100%;
            justify-content: center;
            margin-top: -5px;
        }
        
        .action-btn {
            background: transparent;
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: var(--text-primary);
            padding: var(--spacing-sm) var(--spacing-md);
            border-radius: var(--radius-small);
            font-size: 0.95rem;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: var(--spacing-sm);
            flex: 1;
            min-height: 44px;
        }
        
        .action-btn:hover {
            background: rgba(193, 252, 50, 0.1);
            border-color: var(--accent-color);
            transform: translateY(-2px);
        }
        
        .action-btn.primary {
            background: var(--accent-color);
            color: #000;
            font-weight: 600;
            border-color: var(--accent-color);
        }
        
        .action-btn.primary:hover {
            background: var(--accent-dark);
            border-color: var(--accent-dark);
        }

        /* Stats */
        .stats {
            display: flex;
            justify-content: center;
            margin-bottom: var(--spacing-lg);
        }

        .stat-info h3 {
            font-size: 2rem;
        }

        .stat-info p {
            color: var(--text-secondary);
            font-size: 0.9rem;
        }
        
        /* Back to Home Button */
        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: var(--accent-color);
            text-decoration: none;
            margin-bottom: var(--spacing-lg);
            font-weight: 500;
            transition: all 0.3s ease-in-out;
            padding: var(--spacing-xs) var(--spacing-sm);
            border-radius: var(--radius-small);
            background: rgba(193, 252, 50, 0.1);
            position: relative;
            transform: translateX(0);
        }
        
        .back-link:hover {
            gap: 12px;
            background: rgba(193, 252, 50, 0.2);
            transform: translateX(10px);
            padding-right: 24px;
        }
        
        .back-link:active {
            transform: translateX(5px) scale(0.95);
            transition: all 0.15s ease;
        }
        
        .back-link i {
            transition: transform 0.3s ease-in-out;
        }
        
        .back-link:hover i {
            transform: translateX(-3px);
        }
        
        /* Smooth slide back when not hovered */
        .back-link:not(:hover) {
            transition: all 0.5s ease-in-out;
        }

        /* Footer */
        footer {
            text-align: center;
            padding: var(--spacing-lg) 0;
            color: var(--text-secondary);
            margin-top: var(--spacing-lg);
        }

        .social-links {
            display: flex;
            justify-content: center;
            gap: var(--spacing-md);
            margin-bottom: var(--spacing-md);
        }

        .social-links a {
            color: var(--text-secondary);
            font-size: 1.2rem;
        }

        .social-links a:hover {
            color: var(--accent-color);
        }

        /* Toast Notification */
        .toast {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: var(--accent-color);
            color: #000;
            padding: 12px 24px;
            border-radius: var(--radius-medium);
            font-weight: 600;
            animation: slideIn 0.3s;
            z-index: 1000;
        }

        @keyframes slideIn {
            from {
                transform: translateX(100%);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }

        /* Scrollbar */
        textarea::-webkit-scrollbar {
            width: 8px;
        }

        textarea::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.05);
        }

        textarea::-webkit-scrollbar-thumb {
            background: rgba(193, 252, 50, 0.3);
            border-radius: 4px;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Back to main portfolio -->
        <a href="../index.html" class="back-link fade-in">
            <i class="fas fa-arrow-left"></i> Back to Home
        </a>
        <!-- Header -->
        <header>
            <h1 class="username">HTML Cleaner</h1>
            <p class="tagline">Instantly clean HTML to reduce it's size</p>
        </header>

        <!-- Editor Section -->
        <div class="editor-container">
            <!-- Input Editor -->
            <div class="editor-box">
                <div class="editor-header">
                    <div class="editor-title">Input HTML</div>
                    <div class="editor-buttons">
                        <button class="icon-btn" onclick="importHtmlFile()" title="Import HTML File">
                            <i class="fas fa-file-import"></i>
                        </button>
                        <button class="icon-btn" onclick="clearInput()" title="Clear">
                            <i class="fas fa-trash"></i>
                        </button>
                        <button class="icon-btn" onclick="loadSample()" title="Load Sample">
                            <i class="fas fa-file-code"></i>
                        </button>
                    </div>
                </div>
                <textarea id="inputHtml" placeholder="Paste your HTML code here..."></textarea>
            </div>

            <!-- Output Editor -->
            <div class="editor-box">
                <div class="editor-header">
                    <div class="editor-title">Output HTML</div>
                    <div class="editor-buttons">
                        <button class="icon-btn" onclick="clearOutput()" title="Clear">
                            <i class="fas fa-trash"></i>
                        </button>
                        <button class="icon-btn" onclick="copyOutput()" title="Copy">
                            <i class="fas fa-copy"></i>
                        </button>
                        <button class="icon-btn" onclick="downloadOutput()" title="Download">
                            <i class="fas fa-download"></i>
                        </button>
                    </div>
                </div>
                <textarea id="outputHtml" placeholder="Cleaned HTML will appear here..." readonly></textarea>
            </div>
        </div>

        <!-- Hidden file input for import -->
        <input type="file" id="fileInput" accept=".html,.htm,.txt" style="display: none;">

        <!-- Options -->
        <div class="options">
            <div class="options-list">
                <div style="margin-left: 15px; margin-bottom: 10px;" class="stat-info">
                    <h3 id="sizeReduction">0%</h3>
                    <p>Reduction</p>
                </div>
            
                <div class="option-row">
                    <div class="option-icon">
                        <i class="fas fa-minus"></i>
                    </div>
                    <div class="option-text">Empty</div>
                    <label class="toggle-switch">
                        <input type="checkbox" id="removeEmptyLines" class="toggle-checkbox" checked>
                        <span class="toggle-slider"></span>
                    </label>
                </div>
                
                <div class="option-row">
                    <div class="option-icon">
                        <i class="fas fa-cut"></i>
                    </div>
                    <div class="option-text">Trim</div>
                    <label class="toggle-switch">
                        <input type="checkbox" id="trimLines" class="toggle-checkbox" checked>
                        <span class="toggle-slider"></span>
                    </label>
                </div>
                
                <div style="margin-bottom: -10px;" class="option-row">
                    <div class="option-icon">
                        <i class="fas fa-comment"></i>
                    </div>
                    <div class="option-text">Comments</div>
                    <label class="toggle-switch">
                        <input type="checkbox" id="preserveComments" class="toggle-checkbox">
                        <span class="toggle-slider"></span>
                    </label>
                </div>
            </div>
        </div>

        <!-- Action Buttons -->
        <div class="actions">
            <div class="button-container">
                <button class="action-btn primary" onclick="cleanHTML()">
                    <i class="fas fa-broom"></i>
                    Clean
                </button>
                <button class="action-btn" onclick="downloadOutput()">
                    <i class="fas fa-download"></i>
                    Download
                </button>
            </div>
        </div>

        <!-- Footer -->
        <footer class="fade-in">
            <div class="social-links">
                <a href="https://twitter.com/lildavegoth"><i class="fab fa-twitter"></i></a>
                <a href="https://instagram.com/dave_goth"><i class="fab fa-instagram"></i></a>
            </div>
            <p>© 2026 lildavegoth | HTML Cleaner</p>
            <p style="margin-top: 8px; font-size: 0.8rem; color: #666;">
                Conveys the Idea of a Protected and Inspiring Space for Creative Expression.
            </p>
        </footer>
    </div>

    <script>
        // Get DOM elements
        const inputHtml = document.getElementById('inputHtml');
        const outputHtml = document.getElementById('outputHtml');
        const sizeReduction = document.getElementById('sizeReduction');
        const fileInput = document.getElementById('fileInput');
        
        // Get option elements
        const removeEmptyLines = document.getElementById('removeEmptyLines');
        const trimLines = document.getElementById('trimLines');
        const preserveComments = document.getElementById('preserveComments');
        
        // Get option rows for active styling
        const optionRows = document.querySelectorAll('.option-row');

        // Basic utility functions
        function showToast(message) {
            const toast = document.createElement('div');
            toast.className = 'toast';
            toast.textContent = message;
            document.body.appendChild(toast);
            
            setTimeout(() => {
                toast.remove();
            }, 2000);
        }

        // Import HTML file function
        function importHtmlFile() {
            fileInput.click();
        }

        // Handle file selection
        function handleFileSelect(event) {
            const file = event.target.files[0];
            
            if (!file) {
                return;
            }
            
            // Check file type
            if (!file.type.includes('text') && !file.name.endsWith('.html') && !file.name.endsWith('.htm')) {
                showToast('Please select an HTML or text file');
                return;
            }
            
            const reader = new FileReader();
            
            reader.onload = function(e) {
                inputHtml.value = e.target.result;
                cleanHTML();
                showToast(`Imported: ${file.name}`);
            };
            
            reader.readAsText(file);
            
            // Reset for next selection
            event.target.value = '';
        }

        // Update option styles
        function updateOptionStyles() {
            // Update each row based on checkbox state
            optionRows[0].classList.toggle('active', removeEmptyLines.checked);
            optionRows[1].classList.toggle('active', trimLines.checked);
            optionRows[2].classList.toggle('active', preserveComments.checked);
        }

        // Initialize option styles
        updateOptionStyles();

        // Add event listeners to checkboxes
        removeEmptyLines.addEventListener('change', updateOptionStyles);
        trimLines.addEventListener('change', updateOptionStyles);
        preserveComments.addEventListener('change', updateOptionStyles);
        fileInput.addEventListener('change', handleFileSelect);

        // Make entire row clickable
        optionRows.forEach(row => {
            const checkbox = row.querySelector('.toggle-checkbox');
            row.addEventListener('click', () => {
                checkbox.checked = !checkbox.checked;
                checkbox.dispatchEvent(new Event('change'));
            });
        });

        // Editor functions
        function clearInput() {
            inputHtml.value = '';
            updateStats();
            showToast('Input cleared');
        }

        function clearOutput() {
            outputHtml.value = '';
            updateStats();
            showToast('Output cleared');
        }

        // Copy output to clipboard
        function copyOutput() {
            if (!outputHtml.value.trim()) {
                showToast('No output to copy');
                return;
            }
            
            const textToCopy = outputHtml.value.trim();
            
            // Method 1: Try the modern Clipboard API
            if (navigator.clipboard && window.isSecureContext) {
                navigator.clipboard.writeText(textToCopy)
                    .then(() => showToast('Copied to clipboard'))
                    .catch(() => {
                        // If fails, use Android fallback
                        copyForAndroid(textToCopy);
                    });
            } else {
                // Use Android fallback
                copyForAndroid(textToCopy);
            }
        }
        
        // Android-specific copy method
        function copyForAndroid(text) {
            // Create a temporary textarea
            const textarea = document.createElement('textarea');
            textarea.value = text;
            
            // Style it to be hidden but visible to the system
            textarea.style.position = 'absolute';
            textarea.style.left = '-9999px';
            textarea.style.top = '0';
            textarea.style.width = '0';
            textarea.style.height = '0';
            textarea.style.opacity = '0';
            textarea.setAttribute('readonly', '');
            
            // Add to page
            document.body.appendChild(textarea);
            
            // For Android, we need special handling
            if (/Android/i.test(navigator.userAgent)) {
                // Focus and select for Android
                textarea.focus();
                textarea.select();
                
                // Use a longer timeout for Android
                setTimeout(() => {
                    try {
                        // Try copy command
                        const success = document.execCommand('copy');
                        if (success) {
                            showToast('Copied to clipboard');
                        } else {
                            showToast('Tap and hold to copy');
                            // For some Android browsers, we need to leave text selected
                            textarea.removeAttribute('readonly');
                            textarea.focus();
                            textarea.select();
                        }
                    } catch {
                        showToast('Tap and hold to copy');
                        textarea.removeAttribute('readonly');
                        textarea.focus();
                        textarea.select();
                    }
                }, 100);
            } else {
                // For non-Android devices
                textarea.select();
                try {
                    document.execCommand('copy');
                    showToast('Copied to clipboard');
                } catch {
                    showToast('Failed to copy');
                }
            }
            
            // Clean up after a delay
            setTimeout(() => {
                document.body.removeChild(textarea);
            }, 1000);
        }
        
        // Fallback copy method using a temporary textarea
        function copyUsingTextArea() {
            const textarea = document.createElement('textarea');
            textarea.value = outputHtml.value.trim();
            textarea.style.position = 'fixed';
            textarea.style.left = '-9999px';
            textarea.style.top = '0';
            textarea.setAttribute('readonly', '');
            document.body.appendChild(textarea);
            
            try {
                // Use helper for better mobile support
                selectTextForCopy(textarea);
                
                const successful = document.execCommand('copy');
                if (successful) {
                    showToast('Copied to clipboard ✓');
                } else {
                    showToast('Copy failed');
                }
            } catch {
                showToast('Copy failed');
            } finally {
                document.body.removeChild(textarea);
            }
        }
        
        // Helper function to select text for copying (better mobile support)
        function selectTextForCopy(element) {
            if (navigator.userAgent.match(/ipad|iphone|android/i)) {
                // Mobile devices need special handling
                const range = document.createRange();
                range.selectNodeContents(element);
                const selection = window.getSelection();
                selection.removeAllRanges();
                selection.addRange(range);
                element.setSelectionRange(0, 99999);
            } else {
                element.select();
            }
        }
        
        // Select text in output box for manual copying
        function selectOutputForCopy() {
            if (!outputHtml.value.trim()) {
                showToast('No output to copy');
                return;
            }
            
            // Focus and select the text
            outputHtml.focus();
            outputHtml.select();
            
            // For Android, we need special timing
            if (/Android/i.test(navigator.userAgent)) {
                setTimeout(() => {
                    outputHtml.setSelectionRange(0, outputHtml.value.length);
                    showToast('Text selected - tap Copy from menu');
                }, 100);
            } else {
                showToast('Text selected - use Ctrl+C to copy');
            }
        }
        
        // Alternative method for difficult Android browsers
        function copyForStubbornAndroid(text) {
            // First try: Create a contenteditable div
            const div = document.createElement('div');
            div.contentEditable = true;
            div.innerHTML = text;
            div.style.position = 'absolute';
            div.style.left = '-9999px';
            document.body.appendChild(div);
            
            // Select the content
            const range = document.createRange();
            range.selectNodeContents(div);
            const selection = window.getSelection();
            selection.removeAllRanges();
            selection.addRange(range);
            
            // Try to copy
            try {
                const success = document.execCommand('copy');
                if (success) {
                    showToast('Copied to clipboard');
                } else {
                    // If that fails, try the textarea method
                    copyForAndroid(text);
                }
            } catch {
                copyForAndroid(text);
            }
            
            // Clean up
            document.body.removeChild(div);
            selection.removeAllRanges();
        }

        // Download output
        function downloadOutput() {
            if (!outputHtml.value.trim()) {
                showToast('No output to download');
                return;
            }
            
            const blob = new Blob([outputHtml.value], { type: 'text/html' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'cleaned-html.html';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
            showToast('Download started');
        }

        // Load sample HTML
        function loadSample() {
            const sample = `<!DOCTYPE html>
<html>
<head>
    <title>Sample Page</title>
    <style>
        body { margin: 0; padding: 20px; }
        h1 { color: #333; }
    </style>
</head>
<body>
    <h1>Welcome</h1>
    
    <!-- Sample comment -->
    <p>This is sample HTML</p>
    
    <div class="container">
        <ul>
            <li>Item 1</li>
            <li>Item 2</li>
            <li>Item 3</li>
        </ul>
    </div>
</body>
</html>`;
            
            inputHtml.value = sample;
            cleanHTML();
            showToast('Sample loaded');
        }

        // HTML processing function
        function cleanHTML() {
            if (!inputHtml.value.trim()) {
                showToast('Please enter HTML first');
                return;
            }
            
            const startTime = Date.now();
            let result = inputHtml.value;
            
            // Get options
            const removeEmptyLinesChecked = removeEmptyLines.checked;
            const trimLinesChecked = trimLines.checked;
            const preserveCommentsChecked = preserveComments.checked;
            
            // Remove comments if not preserving
            if (!preserveCommentsChecked) {
                result = result.replace(/<!--[\s\S]*?-->/g, '');
            }
            
            // Trim each line
            if (trimLinesChecked) {
                result = result.split('\n').map(line => line.trim()).join('\n');
            }
            
            // Remove empty lines
            if (removeEmptyLinesChecked) {
                result = result.split('\n')
                    .filter(line => line.trim() !== '')
                    .join('\n');
            }
            
            outputHtml.value = result;
            updateStats();
            
            const time = Date.now() - startTime;
            showToast(`Cleaned in ${time}ms`);
        }

        // Update statistics
        function updateStats() {
            const input = inputHtml.value;
            const output = outputHtml.value;
            
            if (input.length > 0 && output.length > 0) {
                const reduction = Math.round(((input.length - output.length) / input.length) * 100);
                sizeReduction.textContent = reduction > 0 ? reduction + '%' : '0%';
                
                // Add color coding
                if (reduction > 20) {
                    sizeReduction.style.color = 'var(--accent-color)';
                } else if (reduction > 0) {
                    sizeReduction.style.color = '#ffa500';
                } else {
                    sizeReduction.style.color = 'var(--text-secondary)';
                }
            } else {
                sizeReduction.textContent = '0%';
                sizeReduction.style.color = 'var(--text-secondary)';
            }
        }

        // Auto-clean on input
        let cleanTimeout;
        inputHtml.addEventListener('input', function() {
            clearTimeout(cleanTimeout);
            updateStats();
            cleanTimeout = setTimeout(cleanHTML, 500);
        });

        // Initialize
        window.addEventListener('load', function() {
            updateStats();
            showToast('HTML Cleaner ready');
        });
    </script>
</body>
</html>
