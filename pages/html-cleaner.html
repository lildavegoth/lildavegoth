<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML Cleaner | lildavegoth</title>
    <meta name="color-scheme" content="dark">
    <script src="../protections.js"></script>
    <script src="../notification.cssjs"></script>
    <link rel="stylesheet" href="../navigation.css">
    <link rel="stylesheet" href="../media.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --accent-color: #C1FC32;
            --accent-dark: #9bc726;
            --bg-black: #000000;
            --bg-dark: #1a1a1a;
            --bg-card: rgba(30, 30, 30, 0.7);
            --text-primary: #f5f5f7;
            --text-secondary: #a1a1a6;
            --radius-small: 12px;
            --radius-medium: 20px;
            --radius-large: 28px;
            --spacing-xs: 8px;
            --spacing-sm: 16px;
            --spacing-md: 24px;
            --spacing-lg: 32px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-black);
            color: var(--text-primary);
            min-height: 100vh;
            background-image: 
                radial-gradient(circle at 20% 80%, rgba(193, 252, 50, 0.05) 0%, transparent 20%),
                radial-gradient(circle at 80% 20%, rgba(193, 252, 50, 0.03) 0%, transparent 20%);
            padding: var(--spacing-md);
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        /* Header */
        header {
            margin-bottom: var(--spacing-lg);
        }

        .username {
            font-size: 2.5rem;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .tagline {
            color: var(--text-secondary);
            font-size: 1.1rem;
        }

        /* Editor Section */
        .editor-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: var(--spacing-md);
            margin-bottom: var(--spacing-lg);
        }

        @media (max-width: 768px) {
            .editor-container {
                grid-template-columns: 1fr;
            }
        }

        .editor-box {
            background: var(--bg-card);
            border-radius: var(--radius-medium);
            border: 1px solid rgba(255, 255, 255, 0.1);
            overflow: hidden;
        }

        .editor-header {
            padding: var(--spacing-sm);
            background: rgba(0, 0, 0, 0.3);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .editor-title {
            font-weight: 600;
        }

        .editor-buttons {
            display: flex;
            gap: 8px;
        }

        .icon-btn {
            background: none;
            border: none;
            color: var(--text-secondary);
            cursor: pointer;
            padding: 8px;
            border-radius: 6px;
        }

        .icon-btn:hover {
            background: rgba(255, 255, 255, 0.1);
            color: var(--accent-color);
        }

        textarea {
            width: 100%;
            height: 200px;
            background: transparent;
            border: none;
            color: var(--text-primary);
            padding: var(--spacing-md);
            font-family: 'Monaco', 'Consolas', monospace;
            font-size: 14px;
            line-height: 1.5;
            resize: vertical;
            outline: none;
        }

        textarea:focus {
            background: rgba(0, 0, 0, 0.2);
        }

        /* Options - New Styles */
        .options {
            display: flex;
            justify-content: center;
            margin-bottom: var(--spacing-lg);
        }

        .options-list {
            background: var(--bg-card);
            border-radius: var(--radius-medium);
            padding: var(--spacing-md);
            border: 1px solid rgba(255, 255, 255, 0.1);
            width: 350px;
            max-width: 100%;
        }

        .option-row {
            display: flex;
            align-items: center;
            gap: var(--spacing-md);
            padding: var(--spacing-sm);
            border-radius: var(--radius-small);
            transition: all 0.3s;
            margin-top: -10px;
        }

        .option-row:hover {
            background: rgba(255, 255, 255, 0.05);
        }

        .option-icon {
            width: 36px;
            height: 36px;
            border-radius: 8px;
            background: rgba(193, 252, 50, 0.1);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--accent-color);
            font-size: 0.9rem;
        }

        .option-text {
            flex: 1;
            color: var(--text-secondary);
            font-size: 0.95rem;
        }

        .option-row.active .option-text {
            color: var(--accent-color);
        }

        .toggle-switch {
            position: relative;
            width: 50px;
            height: 24px;
            flex-shrink: 0;
        }

        .toggle-checkbox {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .toggle-slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: rgba(255, 255, 255, 0.1);
            transition: .4s;
            border-radius: 34px;
        }

        .toggle-slider:before {
            position: absolute;
            content: "";
            height: 18px;
            width: 18px;
            left: 3px;
            bottom: 3px;
            background-color: var(--text-secondary);
            transition: .4s;
            border-radius: 50%;
        }

        .toggle-checkbox:checked + .toggle-slider {
            background-color: rgba(193, 252, 50, 0.2);
        }

        .toggle-checkbox:checked + .toggle-slider:before {
            transform: translateX(26px);
            background-color: var(--accent-color);
        }

        /* Action Buttons */
        .actions {
            display: flex;
            justify-content: center;
            margin-bottom: var(--spacing-lg);
        }
        
        .button-container {
            display: flex;
            gap: var(--spacing-sm);
            width: 300px;
            max-width: 100%;
            justify-content: center;
            margin-top: -5px;
        }
        
        .action-btn {
            background: transparent;
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: var(--text-primary);
            padding: var(--spacing-sm) var(--spacing-md);
            border-radius: var(--radius-small);
            font-size: 0.95rem;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: var(--spacing-sm);
            flex: 1;
            min-height: 44px;
        }
        
        .action-btn:hover {
            background: rgba(193, 252, 50, 0.1);
            border-color: var(--accent-color);
            transform: translateY(-2px);
        }
        
        .action-btn.primary {
            background: var(--accent-color);
            color: #000;
            font-weight: 600;
            border-color: var(--accent-color);
        }
        
        .action-btn.primary:hover {
            background: var(--accent-dark);
            border-color: var(--accent-dark);
        }

        /* Stats */
        .stats {
            display: flex;
            justify-content: center;
            margin-bottom: var(--spacing-lg);
        }

        .stat-info h3 {
            font-size: 2rem;
        }

        .stat-info p {
            color: var(--text-secondary);
            font-size: 0.9rem;
        }
        
        /* Toast Notification */
        .toast {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: var(--accent-color);
            color: #000;
            padding: 12px 24px;
            border-radius: var(--radius-medium);
            font-weight: 600;
            animation: slideIn 0.3s;
            z-index: 1000;
        }

        @keyframes slideIn {
            from {
                transform: translateX(100%);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }

        /* Scrollbar */
        textarea::-webkit-scrollbar {
            width: 8px;
        }

        textarea::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.05);
        }

        textarea::-webkit-scrollbar-thumb {
            background: rgba(193, 252, 50, 0.3);
            border-radius: 4px;
        }
        
        /* Tool Navigation */
        .tool-navigation {
            margin-top: var(--spacing-lg);
            padding-top: var(--spacing-md);
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .tool-navigation p {
            color: var(--text-secondary);
            margin-bottom: var(--spacing-sm);
            font-size: 0.9rem;
            text-align: center;
        }
        
        .nav-btn {
            display: inline-flex;
            align-items: center;
            gap: var(--spacing-xs);
            padding: var(--spacing-sm) var(--spacing-md);
            background: rgba(193, 252, 50, 0.1);
            color: var(--accent-color);
            border: 2px solid var(--accent-color);
            border-radius: var(--radius-medium);
            font-weight: 600;
            font-size: 0.95rem;
            text-decoration: none;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .nav-btn:hover {
            background: rgba(193, 252, 50, 0.2);
            transform: translateY(-2px);
        }
        
    </style>
</head>
<body>
    <div class="container">
        <!-- Back to main portfolio -->
        <a href="../index.html" class="back-link fade-in">
            <i class="fas fa-arrow-left"></i> Back to Home
        </a>
        <!-- Header -->
        <header>
            <h1 class="username">HTML Cleaner</h1>
            <p class="tagline">Instantly clean HTML to reduce it's size</p>
        </header>

        <!-- Editor Section -->
        <div class="editor-container">
            <!-- Input Editor -->
            <div class="editor-box">
                <div class="editor-header">
                    <div class="editor-title">Input HTML</div>
                    <div class="editor-buttons">
                        <button class="icon-btn" onclick="importHtmlFile()" title="Import HTML File">
                            <i class="fas fa-file-import"></i>
                        </button>
                        <button class="icon-btn" onclick="clearInput()" title="Clear">
                            <i class="fas fa-trash"></i>
                        </button>
                        <button class="icon-btn" onclick="loadSample()" title="Load Sample">
                            <i class="fas fa-file-code"></i>
                        </button>
                    </div>
                </div>
                <textarea id="inputHtml" placeholder="Paste your HTML code here..."></textarea>
            </div>

            <!-- Output Editor -->
            <div class="editor-box">
                <div class="editor-header">
                    <div class="editor-title">Output HTML</div>
                    <div class="editor-buttons">
                        <button class="icon-btn" onclick="clearOutput()" title="Clear">
                            <i class="fas fa-trash"></i>
                        </button>
                        <button class="icon-btn" onclick="copyOutput()" title="Copy">
                            <i class="fas fa-copy"></i>
                        </button>
                        <button class="icon-btn" onclick="downloadOutput()" title="Download">
                            <i class="fas fa-download"></i>
                        </button>
                    </div>
                </div>
                <textarea id="outputHtml" placeholder="Cleaned HTML will appear here..." readonly></textarea>
            </div>
        </div>

        <!-- Hidden file input for import -->
        <input type="file" id="fileInput" accept=".html,.htm,.txt" style="display: none;">

        <!-- Options -->
        <div class="options">
            <div class="options-list">
                <div style="margin-left: 15px; margin-bottom: 10px;" class="stat-info">
                    <h3 id="sizeReduction">0%</h3>
                    <p>Reduction</p>
                </div>
            
                <div class="option-row">
                    <div class="option-icon">
                        <i class="fas fa-minus"></i>
                    </div>
                    <div class="option-text">Empty</div>
                    <label class="toggle-switch">
                        <input type="checkbox" id="removeEmptyLines" class="toggle-checkbox" checked>
                        <span class="toggle-slider"></span>
                    </label>
                </div>
                
                <div class="option-row">
                    <div class="option-icon">
                        <i class="fas fa-cut"></i>
                    </div>
                    <div class="option-text">Trim</div>
                    <label class="toggle-switch">
                        <input type="checkbox" id="trimLines" class="toggle-checkbox" checked>
                        <span class="toggle-slider"></span>
                    </label>
                </div>
                
                <!-- Add this after the existing options, before the closing </div> -->
                <div class="option-row">
                    <div class="option-icon">
                        <i class="fas fa-comments"></i>
                    </div>
                    <div class="option-text">All Comments</div>
                    <label class="toggle-switch">
                        <input type="checkbox" id="removeAllComments" class="toggle-checkbox" checked>
                        <span class="toggle-slider"></span>
                    </label>
                </div>
            </div>
        </div>

        <!-- Action Buttons -->
        <div class="actions">
            <div class="button-container">
                <button class="action-btn primary" onclick="cleanHTML()">
                    <i class="fas fa-broom"></i>
                    Clean
                </button>
                <button class="action-btn" onclick="downloadOutput()">
                    <i class="fas fa-download"></i>
                    Download
                </button>
            </div>
        </div>
        
        <!-- Tool Navigation -->
        <div class="tool-navigation" style="margin-top: var(--spacing-lg); padding-top: var(--spacing-md); border-top: 1px solid rgba(255, 255, 255, 0.1);">
            <div style="text-align: center;">
                <p style="color: var(--text-secondary); margin-bottom: var(--spacing-sm); font-size: 0.9rem;">
                    Explore other HTML tools
                </p>
                <div style="display: flex; justify-content: center; gap: var(--spacing-sm); flex-wrap: wrap;">
                    <a href="html-generator.html" class="nav-btn">
                        HTML Generator
                    </a>
                </div>
            </div>
        </div>

        <!-- Footer -->
        <footer class="fade-in">
            <div class="social-links">
                <a href="https://twitter.com/lildavegoth"><span class="icon icon-twitter"></span></a>
                <a href="https://instagram.com/dave_goth"><span class="icon icon-instagram"></span></a>
            </div>
            <p>© 2026 lildavegoth | HTML Cleaner</p>
            <p style="margin-top: 8px; font-size: 0.8rem; color: #666;">
                Conveys the Idea of a Protected and Inspiring Space for Creative Expression.
            </p>
        </footer>
    </div>

    <script>
        // Get DOM elements
        const inputHtml = document.getElementById('inputHtml');
        const outputHtml = document.getElementById('outputHtml');
        const sizeReduction = document.getElementById('sizeReduction');
        const fileInput = document.getElementById('fileInput');
        
        // Get all checkboxes
        const removeEmptyLines = document.getElementById('removeEmptyLines');
        const trimLines = document.getElementById('trimLines');
        const removeAllComments = document.getElementById('removeAllComments');
        
        // Get all option rows
        const optionRows = document.querySelectorAll('.option-row');
    
        // Import file
        function importHtmlFile() {
            fileInput.click();
        }
    
        // Handle file selection
        fileInput.addEventListener('change', function(event) {
            const file = event.target.files[0];
            if (!file) return;
            
            const reader = new FileReader();
            reader.onload = function(e) {
                inputHtml.value = e.target.result;
                cleanHTML();
                window.showMessage('File imported');
            };
            reader.readAsText(file);
            event.target.value = '';
        });
    
        // Update option colors
        function updateOptionStyles() {
            optionRows[0].classList.toggle('active', removeEmptyLines.checked);
            optionRows[1].classList.toggle('active', trimLines.checked);
            optionRows[3].classList.toggle('active', removeAllComments.checked);
        }
    
        // Set up checkboxes
        updateOptionStyles();
        removeEmptyLines.addEventListener('change', updateOptionStyles);
        trimLines.addEventListener('change', updateOptionStyles);
        removeAllComments.addEventListener('change', updateOptionStyles);
    
        // Make rows clickable
        optionRows.forEach(row => {
            row.addEventListener('click', () => {
                const checkbox = row.querySelector('.toggle-checkbox');
                checkbox.checked = !checkbox.checked;
                checkbox.dispatchEvent(new Event('change'));
            });
        });
    
        // Clear input
        function clearInput() {
            inputHtml.value = '';
            updateStats();
            window.showMessage('Input cleared');
        }
    
        // Clear output
        function clearOutput() {
            outputHtml.value = '';
            updateStats();
            window.showMessage('Output cleared');
        }
    
        // Copy output
        function copyOutput() {
            if (!outputHtml.value.trim()) {
                window.showMessage('No output to copy');
                return;
            }
            
            const text = outputHtml.value.trim();
            
            if (navigator.clipboard) {
                navigator.clipboard.writeText(text).then(() => {
                    window.showMessage('Copied to clipboard');
                });
            } else {
                // Fallback for old browsers
                const textarea = document.createElement('textarea');
                textarea.value = text;
                textarea.style.position = 'fixed';
                textarea.style.left = '-9999px';
                document.body.appendChild(textarea);
                textarea.select();
                document.execCommand('copy');
                document.body.removeChild(textarea);
                window.showMessage('Copied to clipboard');
            }
        }
    
        // Download output
        function downloadOutput() {
            if (!outputHtml.value.trim()) {
                window.showMessage('No output to download');
                return;
            }
            
            const blob = new Blob([outputHtml.value], { type: 'text/html' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'cleaned-html.html';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
            window.showMessage('Download started');
        }
    
        // Load sample
        function loadSample() {
            const sample = `<!DOCTYPE html>
    <html>
    <head>
        <title>Sample Page</title>
        <style>
            /* CSS comment */
            body { margin: 0; }
        </style>
    </head>
    <body>
        <!-- HTML comment -->
        <h1>Welcome</h1>
        <p>Hello World</p>
    </body>
    </html>`;
            
            inputHtml.value = sample;
            cleanHTML();
            window.showMessage('Sample loaded');
        }
    
        // Clean HTML - MAIN FUNCTION
        function cleanHTML() {
            if (!inputHtml.value.trim()) {
                window.showMessage('Enter HTML first');
                return;
            }
            
            let result = inputHtml.value;
            
            // Remove comments based on settings
            if (removeAllComments.checked) {
                // Remove /* comments */
                result = result.replace(/\/\*[\s\S]*?\*\//g, '');
                // Remove // comments
                result = result.replace(/\/\/.*$/gm, '');
                // Remove <!-- comments -->
                result = result.replace(/<!--[\s\S]*?-->/g, '');
                // Remove ===== separators
                result = result.replace(/^=+.*=+$/gm, '');
            }
            
            // Trim whitespace from lines
            if (trimLines.checked) {
                result = result.split('\n').map(line => line.trim()).join('\n');
            }
            
            // Remove empty lines
            if (removeEmptyLines.checked) {
                result = result.split('\n').filter(line => line.trim() !== '').join('\n');
            }
            
            outputHtml.value = result;
            updateStats();
            window.showMessage('HTML cleaned');
        }
    
        // Update size reduction
        function updateStats() {
            const input = inputHtml.value;
            const output = outputHtml.value;
            
            if (input.length > 0 && output.length > 0) {
                const reduction = Math.round(((input.length - output.length) / input.length) * 100);
                sizeReduction.textContent = reduction > 0 ? reduction + '%' : '0%';
                
                if (reduction > 20) {
                    sizeReduction.style.color = 'var(--accent-color)';
                } else if (reduction > 0) {
                    sizeReduction.style.color = '#ffa500';
                } else {
                    sizeReduction.style.color = 'var(--text-secondary)';
                }
            } else {
                sizeReduction.textContent = '0%';
                sizeReduction.style.color = 'var(--text-secondary)';
            }
        }
    
        // Auto clean when typing
        let cleanTimeout;
        inputHtml.addEventListener('input', function() {
            clearTimeout(cleanTimeout);
            updateStats();
            cleanTimeout = setTimeout(cleanHTML, 500);
        });
    
        // Start
        window.addEventListener('load', function() {
            updateStats();
            window.showMessage('Ready to clean HTML');
        });
    </script>
</body>
</html>
