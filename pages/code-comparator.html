            min-height: 0;
        }

        .text-input {
            width: 100%;
            height: 600px;
            padding: var(--spacing-md);
            background: var(--bg-dark);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: var(--radius-medium);
            color: var(--text-primary);
            font-size: 1rem;
            line-height: 1.6;
            resize: none;
            transition: all 0.3s ease;
            font-family: 'Courier New', monospace;
            overflow-y: auto;
            max-width: 1200px;
            margin: 0 auto;
        }

        .text-input:focus {
            outline: none;
            border-color: var(--accent-color);
            box-shadow: 0 0 0 2px rgba(193, 252, 50, 0.1);
        }

        .stats {
            display: flex;
            justify-content: space-between;
            margin-top: var(--spacing-md);
            color: var(--text-secondary);
            font-size: 0.9rem;
            padding: var(--spacing-sm) 0;
        }

        .action-buttons {
            display: flex;
            gap: var(--spacing-sm);
            margin-top: var(--spacing-md);
        }

        .action-btn {
            flex: 1;
            padding: var(--spacing-sm);
            border: none;
            border-radius: var(--radius-medium);
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .action-btn.primary {
            background: var(--accent-color);
            color: var(--bg-black);
        }

        .action-btn.secondary {
            background: var(--bg-dark);
            color: var(--text-primary);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .action-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(193, 252, 50, 0.2);
        }

        .action-btn.secondary:hover {
            border-color: var(--accent-color);
        }

        .preview-container {
            width: 100%;
            height: 600px;
            max-width: 1200px;
            margin: 0 auto;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: var(--radius-medium);
            overflow: hidden;
            background: var(--bg-dark);
        }

        .preview-frame {
            width: 100%;
            height: 100%;
            border: none;
            background: #1a1a1a;
        }

        @media (max-width: 768px) {
            .tool-btn span {
                display: none;
            }
            
            .tool-btn {
                padding: 6px 8px;
            }
        }
        .diff-display {
            width: 100%;
            height: 600px;
            padding: var(--spacing-md);
            background: var(--bg-dark);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: var(--radius-medium);
            color: var(--text-primary);
            font-family: 'Courier New', monospace;
            font-size: 1rem;
            line-height: 1.6;
            overflow-y: auto;
            white-space: pre-wrap;
            word-wrap: break-word;
            max-width: 1200px;
            margin: 0 auto;
        }
    </style>

    <script>
        const faScript = document.createElement('script');
        faScript.src = 'https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/js/all.min.js';
        document.head.appendChild(faScript);
        
        const htmlEditor = document.getElementById('htmlEditor');
        const secondEditor = document.getElementById('secondEditor');
        const previewContainer = document.getElementById('previewContainer');
        const firstBtn = document.getElementById('firstBtn');
        const secondBtn = document.getElementById('secondBtn');
        const diffBtn = document.getElementById('diffBtn');
        const charCount = document.getElementById('charCount');
        const lineCount = document.getElementById('lineCount');
        const currentMode = document.getElementById('currentMode');
        
        let activeEditor = htmlEditor;
        
        document.addEventListener('DOMContentLoaded', function() {
            updateStats();
        });
        
        htmlEditor.addEventListener('input', updateStats);
        secondEditor.addEventListener('input', updateStats);
        
        firstBtn.addEventListener('click', () => switchMode('first'));
        secondBtn.addEventListener('click', () => switchMode('second'));
        diffBtn.addEventListener('click', () => switchMode('diff'));
        
        function switchMode(mode) {
            activeEditor = (mode === 'first') ? htmlEditor : secondEditor;
            
            htmlEditor.style.display = (mode === 'first') ? 'block' : 'none';
            secondEditor.style.display = (mode === 'second') ? 'block' : 'none';
            previewContainer.style.display = (mode === 'diff') ? 'block' : 'none';
            
            firstBtn.classList.toggle('active', mode === 'first');
            secondBtn.classList.toggle('active', mode === 'second');
            diffBtn.classList.toggle('active', mode === 'diff');
            
            currentMode.textContent = (mode === 'first') ? 'First Code' : (mode === 'second') ? 'Second Code' : 'Differences';
            
            if (mode === 'diff') {
                updateDiff();
            } else {
                activeEditor.focus();
            }
        }
        
        function computeDiff(text1, text2) {
            const a = text1.split('\n');
            const b = text2.split('\n');
            const m = a.length;
            const n = b.length;
            const dp = Array.from({length: m + 1}, () => Array(n + 1).fill(0));
            
            for (let i = 1; i <= m; i++) {
                for (let j = 1; j <= n; j++) {
                    if (a[i - 1] === b[j - 1]) {
                        dp[i][j] = dp[i - 1][j - 1] + 1;
                    } else {
                        dp[i][j] = Math.max(dp[i][j - 1], dp[i - 1][j]);
                    }
                }
            }
            
            let result = [];
            let i = m;
            let j = n;
            
            while (i > 0 || j > 0) {
                if (i > 0 && j > 0 && a[i - 1] === b[j - 1]) {
                    result.unshift('  ' + a[i - 1]);
                    i--;
                    j--;
                } else if (j > 0 && (i === 0 || dp[i][j - 1] >= dp[i - 1][j])) {
                    result.unshift('+ ' + b[j - 1]);
                    j--;
                } else if (i > 0) {
                    result.unshift('- ' + a[i - 1]);
                    i--;
                }
            }
            
            return result.join('\n');
        }
        
        function updateDiff() {
            const text1 = htmlEditor.value;
            const text2 = secondEditor.value;
            const diffText = computeDiff(text1, text2);
        
            let displayHtml = '';
            const lines = diffText.split('\n');
        
            lines.forEach(line => {
                let prefix = line.slice(0, 2);
                let content = line.slice(2);
                let style = '';
        
                if (prefix === '+ ') {
                    style = 'color:#C1FC32; background:rgba(193,252,50,0.1);';
                } else if (prefix === '- ') {
                    style = 'color:#ff6b6b; background:rgba(255,107,107,0.1);';
                } else {
                    style = 'color:#a1a1a6;';
                }
        
                content = content.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
                displayHtml += `<span style="${style}">${prefix}${content}</span><br>`;
            });
        
            document.getElementById('diffDisplay').innerHTML = displayHtml;
        }
        
        function updateStats() {
            const text = activeEditor.value;
            charCount.textContent = text.length;
            lineCount.textContent = text.split('\n').length;
        }
        
        switchMode('first');
        
    </script>
