<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Farmstead · Realm</title>
    <meta name="color-scheme" content="dark">
    <script src="../protections.js"></script>
    <script src="../notification.cssjs"></script>
    <link rel="stylesheet" href="../media.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --accent-color: #C1FC32;
            --bg-black: #000000;
            --bg-dark: #1a1a1a;
            --bg-card: rgba(30, 30, 30, 0.7);
            --text-primary: #f5f5f7;
            --text-secondary: #a1a1a6;
            --radius-large: 28px;
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            background-color: var(--bg-black);
            color: var(--text-primary);
            min-height: 100vh;
            overflow-x: hidden;
            padding-bottom: 20px;
        }
        #gameView {
            display: flex;
            flex-direction: column;
            max-width: 720px;
            margin: 0 auto;
            height: 100vh;
        }
        .chat-header {
            background-color: #111111;
            padding: 12px 16px;
            display: flex;
            flex-direction: column;
            gap: 6px;
            position: sticky;
            top: 0;
            z-index: 12;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }
        .resource-row {
            display: flex;
            gap: 8px;
            font-size: 14px;
            background: #1f1f21;
            padding: 6px 12px;
            border-radius: 40px;
            flex-wrap: wrap;
        }
        .resource-badge {
            display: flex;
            align-items: center;
            gap: 4px;
            white-space: nowrap;
        }
        .chat-area {
            flex: 1;
            background: #0c0c0c;
            padding: 16px 12px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .chat-message {
            background: #1f1f21;
            padding: 14px 18px;
            border-radius: 22px;
            max-width: 85%;
            align-self: flex-start;
            color: #e6e6e6;
            font-size: 15px;
            line-height: 1.45;
            border-bottom-left-radius: 6px;
            word-break: break-word;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.3);
        }
        .chat-message.system {
            align-self: center;
            background: #2a2a2d;
            color: #b0b0b0;
            border-radius: 30px;
            font-style: italic;
            max-width: 90%;
            text-align: center;
        }
        .action-row {
            display: flex;
            gap: 10px;
            padding: 12px 16px 6px;
            background: #0c0c0c;
        }
        .action-btn {
            flex: 1;
            background: #1f1f21;
            border: 1px solid #3a3a3c;
            color: var(--text-primary);
            font-weight: 600;
            font-size: 15px;
            padding: 14px 4px;
            border-radius: 60px;
            box-shadow: 0 4px 0 #0a0a0a;
            cursor: pointer;
            transition: all 0.05s;
            text-transform: uppercase;
            letter-spacing: 0.3px;
            text-align: center;
        }
        .action-btn:active {
            transform: translateY(3px);
            box-shadow: 0 1px 0 #0a0a0a;
        }
        .action-btn.disabled {
            opacity: 0.4;
            transform: none;
            box-shadow: 0 4px 0 #0a0a0a;
        }
        .nav-row {
            display: flex;
            gap: 10px;
            padding: 6px 16px 18px;
            background: #0c0c0c;
        }
        .nav-btn {
            flex: 1;
            background: #2c2c2e;
            border: 1px solid #4a4a4d;
            color: white;
            font-weight: 600;
            font-size: 16px;
            padding: 12px 4px;
            border-radius: 40px;
            cursor: pointer;
            text-align: center;
        }
        .nav-btn:active {
            transform: scale(0.97);
        }
        .nav-btn.disabled {
            opacity: 0.3;
            pointer-events: none;
        }
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            75% { transform: translateX(5px); }
        }
        .chat-message.shake {
            animation: shake 0.3s ease-in-out;
        }
        .popup-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 1.0);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 99999999;
            animation: fadeIn 0.3s ease;
        }
        .popup-content {
            background: var(--bg-card);
            border-radius: var(--radius-large);
            width: 90%;
            max-width: 500px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
            max-height: 70vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .popup-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }
        .popup-header h2 {
            font-size: 1.5rem;
            font-weight: 600;
        }
        .close-popup {
            background: transparent;
            border: none;
            color: var(--text-secondary);
            font-size: 1.2rem;
            cursor: pointer;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .popup-body {
            padding: 20px;
            overflow-y: auto;
        }
        .crop-option {
            background: #2c2c2e;
            padding: 16px;
            border-radius: 20px;
            margin-bottom: 12px;
            cursor: pointer;
            border: 1px solid #3a3a3c;
        }
        .crop-option h3 {
            font-size: 18px;
            margin-bottom: 4px;
        }
        .crop-option p {
            color: var(--text-secondary);
        }
        .inn-offer-container {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
            margin: 6px 0 2px;
        }
        .market-buttons-container {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin: 10px 0 4px;
        }
        .market-btn {
            background: #2c2c2e;
            border: none;
            color: white;
            padding: 8px 14px;
            border-radius: 40px;
            font-weight: 500;
            font-size: 13px;
            cursor: pointer;
        }
        .chat-area::-webkit-scrollbar {
            width: 6px;
        }
        .chat-area::-webkit-scrollbar-thumb {
            background: #3a3a3c;
            border-radius: 10px;
        }
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
    </style>
</head>
<body>
    <div id="gameView">
        <div class="chat-header">
            <div class="resource-row">
                <span class="resource-badge"><i class="fas fa-bread-slice"></i> <span id="foodDisplay">0</span></span>
                <span class="resource-badge"><i class="fas fa-coins"></i> <span id="goldDisplay">0</span></span>
                <span class="resource-badge"><i class="fas fa-wheat-awn"></i> <span id="wheatDisplay">0</span></span>
                <span class="resource-badge"><i class="fas fa-home"></i> <span id="housePopDisplay">1-3/10</span></span>
                <span class="resource-badge"><i class="fas fa-tractor"></i> <span id="farmLevelBadge">Lv.1</span></span>
            </div>
            <div class="resource-row" id="extraResourceRow">
                <span class="resource-badge"><i class="fas fa-gem"></i> <span id="jewelsDisplay">0</span></span>
                <span class="resource-badge"><i class="fas fa-mountain"></i> <span id="rocksDisplay">0</span></span>
                <span class="resource-badge"><i class="fas fa-cube"></i> <span id="ironDisplay">0</span></span>
                <span class="resource-badge"><i class="fas fa-coins"></i> <span id="goldOreDisplay">0</span></span>
                <span class="resource-badge"><i class="fas fa-tree"></i> <span id="logsDisplay">0</span></span>
                <span class="resource-badge"><i class="fas fa-hammer"></i> <span id="pickaxeDisplay">Pick 0</span></span>
                <span class="resource-badge"><i class="fas fa-cogs"></i> <span id="drillStatus">Drill -</span></span>
            </div>
        </div>
        <div class="chat-area" id="chatMessages">
            <div class="chat-message system"><i class="fas fa-crown"></i> Welcome, chieftain. Build your realm.</div>
        </div>
        <div class="action-row" id="actionRow">
            <button class="action-btn" id="actionBtn1"><i class="fas fa-seedling"></i> Plant</button>
            <button class="action-btn" id="actionBtn2"><i class="fas fa-leaf"></i> Crop</button>
            <button class="action-btn" id="actionBtn3"><i class="fas fa-bread-slice"></i> Bakery</button>
        </div>
        <div class="nav-row" id="navRow">
            <button class="nav-btn" id="prevBtn"><i class="fas fa-arrow-left"></i> Prev</button>
            <button class="nav-btn" id="nextBtn">Next <i class="fas fa-arrow-right"></i></button>
        </div>
    </div>
    <div id="universalPopup" class="popup-overlay" style="display: none;">
        <div class="popup-content">
            <div class="popup-header">
                <h2 id="popupTitle">Menu</h2>
                <button class="close-popup" onclick="closeUniversalPopup()"><i class="fas fa-times"></i></button>
            </div>
            <div class="popup-body" id="popupContent"></div>
        </div>
    </div>
    <script>
        (function() {
            const STORAGE_KEY = 'textFarmV2';
            let food = 300;
            let gold = 400;
            let wheat = 60;
            let carrot = 0;
            let houses = 1;
            let population = 3;
            const HOUSE_CAPACITY = 10;
            let farmLevel = 1;
            const BASE_FOOD_PER_HOUR = 20;

            let plantedCrop = null;
            let plantedCropName = '';
            let plantTime = 0;
            let selectedCropKey = 'wheat';

            let medals = 0;
            let jewelry = 0;
            let swords = 0;
            let clothes = 0;

            let dailyFoodCollected = 0;
            let competitionJoined = false;
            let botTargetScore = 0;
            let botName = "Aldric";
            let lastCompetitionDate = '';

            let fishInventory = [];
            let baits = 5;
            let rodLevel = 1;

            let restEndTime = 0;
            let restNextTick = 0;
            let innNearby = false;
            let innOfferActive = false;
            let autoExploreCount = 0;
            let autoExploring = false;
            let autoInterval = null;

            let plantCountdownInterval = null;

            let currentPage = 0;
            let subMenu = null;

            let jewels = 0;
            let rocks = 0;
            let ironOre = 0;
            let goldOre = 0;
            let logs = 0;
            let pickaxeLevel = 0;
            let drillOwned = false;
            let drillBonusActive = false;
            let drillCooldownEnd = 0;
            let axeOwned = false;

            const botNames = ["Aldric", "Bryn", "Cedric", "Doran", "Eldon", "Finn", "Garrett", "Harlan", "Ivor",
                "Jasper", "Kellan", "Lorcan", "Merrick", "Niall", "Orson"
            ];
            const cropData = {
                wheat: { minYield: 50, maxYield: 75, name: 'Wheat', type: 'wheat', icon: 'fa-wheat-awn' },
                carrot: { minYield: 75, maxYield: 100, name: 'Carrot', type: 'carrot', icon: 'fa-carrot' }
            };
            const fishSpecies = [{ name: 'Salmon', basePrice: 15 }, { name: 'Trout', basePrice: 12 }, { name: 'Bass',
                    basePrice: 10 }, { name: 'Catfish', basePrice: 8 }, { name: 'Carp', basePrice: 6 },
            { name: 'Legendary', basePrice: 2000, legendary: true, weight: 200 }];

            const foodDisplay = document.getElementById('foodDisplay');
            const goldDisplay = document.getElementById('goldDisplay');
            const wheatDisplay = document.getElementById('wheatDisplay');
            const housePopDisplay = document.getElementById('housePopDisplay');
            const farmLevelBadge = document.getElementById('farmLevelBadge');
            const jewelsDisplay = document.getElementById('jewelsDisplay');
            const rocksDisplay = document.getElementById('rocksDisplay');
            const ironDisplay = document.getElementById('ironDisplay');
            const goldOreDisplay = document.getElementById('goldOreDisplay');
            const logsDisplay = document.getElementById('logsDisplay');
            const pickaxeDisplay = document.getElementById('pickaxeDisplay');
            const drillStatus = document.getElementById('drillStatus');
            const chatMessages = document.getElementById('chatMessages');
            const actionBtn1 = document.getElementById('actionBtn1');
            const actionBtn2 = document.getElementById('actionBtn2');
            const actionBtn3 = document.getElementById('actionBtn3');
            const prevBtn = document.getElementById('prevBtn');
            const nextBtn = document.getElementById('nextBtn');

            function formatNumber(n) {
                if (n >= 1000000) {
                    const val = n / 1000000;
                    const fixed = val.toFixed(1).replace('.', ',');
                    return (val % 1 === 0 ? val : fixed) + 'M';
                }
                if (n >= 1000) {
                    const val = n / 1000;
                    const fixed = val.toFixed(1).replace('.', ',');
                    return (val % 1 === 0 ? val : fixed) + 'K';
                }
                return Math.floor(n).toString();
            }

            function loadGame() {
                const saved = localStorage.getItem(STORAGE_KEY);
                if (saved) {
                    try {
                        const data = JSON.parse(saved);
                        food = data.food ?? food;
                        gold = data.gold ?? gold;
                        wheat = data.wheat ?? wheat;
                        carrot = data.carrot ?? carrot;
                        houses = data.houses ?? houses;
                        population = data.population ?? population;
                        farmLevel = data.farmLevel ?? farmLevel;
                        plantedCrop = data.plantedCropType ? cropData[data.plantedCropType] : null;
                        plantedCropName = data.plantedCropName || '';
                        plantTime = data.plantTime || 0;
                        selectedCropKey = data.selectedCropKey || 'wheat';
                        medals = data.medals || 0;
                        jewelry = data.jewelry || 0;
                        swords = data.swords || 0;
                        clothes = data.clothes || 0;
                        dailyFoodCollected = data.dailyFoodCollected || 0;
                        competitionJoined = data.competitionJoined || false;
                        botTargetScore = data.botTargetScore || generateBotScore();
                        botName = data.botName || pickRandomBot();
                        lastCompetitionDate = data.lastCompetitionDate || '';
                        fishInventory = data.fishInventory || [];
                        baits = data.baits ?? 5;
                        rodLevel = data.rodLevel || 1;
                        restEndTime = data.restEndTime || 0;
                        jewels = data.jewels || 0;
                        rocks = data.rocks || 0;
                        ironOre = data.ironOre || 0;
                        goldOre = data.goldOre || 0;
                        logs = data.logs || 0;
                        pickaxeLevel = data.pickaxeLevel || 0;
                        drillOwned = data.drillOwned || false;
                        drillCooldownEnd = data.drillCooldownEnd || 0;
                        axeOwned = data.axeOwned || false;
                    } catch (e) {}
                }
            }

            function saveGame() {
                const data = {
                    food,
                    gold,
                    wheat,
                    carrot,
                    houses,
                    population,
                    farmLevel,
                    plantedCropType: plantedCrop ? plantedCrop.type : null,
                    plantedCropName,
                    plantTime,
                    selectedCropKey,
                    medals,
                    jewelry,
                    swords,
                    clothes,
                    dailyFoodCollected,
                    competitionJoined,
                    botTargetScore,
                    botName,
                    lastCompetitionDate,
                    fishInventory,
                    baits,
                    rodLevel,
                    restEndTime,
                    jewels,
                    rocks,
                    ironOre,
                    goldOre,
                    logs,
                    pickaxeLevel,
                    drillOwned,
                    drillCooldownEnd,
                    axeOwned
                };
                localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
            }

            function removeMessagesOfType(type) {
                const messages = chatMessages.querySelectorAll(`.chat-message[data-type="${type}"]`);
                messages.forEach(el => el.remove());
            }

            function getMessageElement(type) {
                return chatMessages.querySelector(`.chat-message[data-type="${type}"]`);
            }

            function updateOrAddMessage(type, content, isSystem = false) {
                const existing = getMessageElement(type);
                if (existing) {
                    existing.innerHTML = content;
                    existing.className = isSystem ? 'chat-message system' : 'chat-message';
                    existing.setAttribute('data-type', type);
                } else {
                    const msgDiv = document.createElement('div');
                    msgDiv.className = isSystem ? 'chat-message system' : 'chat-message';
                    msgDiv.setAttribute('data-type', type);
                    msgDiv.innerHTML = content;
                    chatMessages.appendChild(msgDiv);
                }
                chatMessages.scrollTop = chatMessages.scrollHeight;
                while (chatMessages.children.length > 30) {
                    chatMessages.removeChild(chatMessages.children[0]);
                }
            }

            function shakeMessage(type) {
                const el = getMessageElement(type);
                if (!el) return;
                el.classList.add('shake');
                setTimeout(() => el.classList.remove('shake'), 300);
            }

            function startPlantCountdown() {
                if (plantCountdownInterval) clearInterval(plantCountdownInterval);
                const endTime = plantTime + 5000;
                const updateCountdown = () => {
                    const remaining = Math.max(0, Math.ceil((endTime - Date.now()) / 1000));
                    updateOrAddMessage('plant',
                        `<i class="fas fa-seedling"></i> Planted ${plantedCropName}. Ready in ${remaining}s.`);
                    if (remaining <= 0) {
                        clearInterval(plantCountdownInterval);
                        plantCountdownInterval = null;
                        updateOrAddMessage('plant',
                            `<i class="fas fa-seedling"></i> Planted ${plantedCropName}. Ready to harvest!`);
                    }
                };
                updateCountdown();
                plantCountdownInterval = setInterval(updateCountdown, 200);
            }

            function getHarvestMultiplier() { return 1 + (farmLevel - 1) * 0.25; }

            function updateUI() {
                let maxPop = houses * HOUSE_CAPACITY;
                foodDisplay.textContent = formatNumber(Math.floor(food));
                goldDisplay.textContent = formatNumber(gold);
                wheatDisplay.textContent = formatNumber(Math.floor(wheat));
                housePopDisplay.textContent = `${houses}-${population}/${maxPop}`;
                farmLevelBadge.textContent = `Lv.${farmLevel}`;
                jewelsDisplay.textContent = formatNumber(jewels);
                rocksDisplay.textContent = formatNumber(rocks);
                ironDisplay.textContent = formatNumber(ironOre);
                goldOreDisplay.textContent = formatNumber(goldOre);
                logsDisplay.textContent = formatNumber(logs);
                pickaxeDisplay.textContent = `Pick ${pickaxeLevel}`;
                if (drillOwned) {
                    const cd = drillCooldownEnd > Date.now() ? Math.ceil((drillCooldownEnd - Date.now()) / 1000) + 's' : 'Ready';
                    drillStatus.textContent = `Drill ${cd}`;
                } else {
                    drillStatus.textContent = 'Drill -';
                }
                updateActionButtons();
                updateNavButtons();
                saveGame();
            }

            function updateActionButtons() {
                actionBtn1.classList.remove('disabled');
                actionBtn2.classList.remove('disabled');
                actionBtn3.classList.remove('disabled');
                actionBtn1.style.display = 'block';
                actionBtn2.style.display = 'block';
                actionBtn3.style.display = 'block';
                const resting = restEndTime > Date.now();

                if (subMenu === 'upgrades') {
                    actionBtn1.innerHTML = '<i class="fas fa-tractor"></i> Farm';
                    actionBtn2.innerHTML = '<i class="fas fa-home"></i> House';
                    actionBtn3.innerHTML = '<i class="fas fa-user-plus"></i> Recruit';
                    if (gold < getFarmUpgradeGoldCost() || food < getFarmUpgradeFoodCost()) actionBtn1.classList.add('disabled');
                    if (gold < getHouseUpgradeGoldCost() || food < getHouseUpgradeFoodCost()) actionBtn2.classList.add('disabled');
                    if (gold < 100) actionBtn3.classList.add('disabled');
                    return;
                }
                if (subMenu === 'adventure') {
                    actionBtn1.innerHTML = '<i class="fas fa-dragon"></i> Explore';
                    actionBtn2.innerHTML = '<i class="fas fa-running"></i> Auto';
                    actionBtn3.innerHTML = '<i class="fas fa-inn"></i> Inn';
                    if (innOfferActive || resting || food < 10 || population < 2) actionBtn1.classList.add('disabled');
                    if (innOfferActive || resting || autoExploring || food < 10 || population < 2) actionBtn2.classList.add('disabled');
                    if (!innNearby || autoExploring || innOfferActive) actionBtn3.classList.add('disabled');
                    return;
                }
                if (subMenu === 'fishing') {
                    actionBtn1.innerHTML = '<i class="fas fa-fish"></i> Fish';
                    actionBtn2.innerHTML = '<i class="fas fa-store"></i> Shop';
                    actionBtn3.style.display = 'none';
                    if (baits <= 0) actionBtn1.classList.add('disabled');
                    return;
                }
                if (subMenu === 'fishing_shop') {
                    actionBtn1.innerHTML = '<i class="fas fa-worm"></i> Baits (5g)';
                    actionBtn2.innerHTML = `<i class="fas fa-fishing-rod"></i> Rod (${getRodUpgradeCost()}g)`;
                    actionBtn3.innerHTML = '<i class="fas fa-coins"></i> Sell fish';
                    if (gold < 5) actionBtn1.classList.add('disabled');
                    if (gold < getRodUpgradeCost()) actionBtn2.classList.add('disabled');
                    return;
                }
                if (subMenu === 'mining') {
                    actionBtn1.innerHTML = '<i class="fas fa-gem"></i> Mine';
                    actionBtn2.innerHTML = '<i class="fas fa-store"></i> Shop';
                    actionBtn3.innerHTML = '<i class="fas fa-cogs"></i> Drill';
                    if (pickaxeLevel <= 0) actionBtn1.classList.add('disabled');
                    if (!drillOwned || drillBonusActive || drillCooldownEnd > Date.now()) actionBtn3.classList.add('disabled');
                    if (drillCooldownEnd > Date.now() && drillOwned && !drillBonusActive) {
                        actionBtn3.innerHTML = `<i class="fas fa-cogs"></i> Drill (${Math.ceil((drillCooldownEnd-Date.now())/1000)}s)`;
                    }
                    return;
                }
                if (subMenu === 'mining_shop') {
                    const pickCost = 100 + 50 * pickaxeLevel;
                    actionBtn1.innerHTML = `<i class="fas fa-hammer"></i> Pickaxe (${pickCost}g)`;
                    actionBtn2.innerHTML = '<i class="fas fa-cogs"></i> Drill (1000g)';
                    actionBtn3.innerHTML = '<i class="fas fa-coins"></i> Sell mined';
                    if (gold < pickCost) actionBtn1.classList.add('disabled');
                    if (gold < 1000 || drillOwned) actionBtn2.classList.add('disabled');
                    return;
                }
                if (subMenu === 'blacksmith') {
                    actionBtn1.innerHTML = '<i class="fas fa-hammer"></i> Forge Sword';
                    actionBtn2.innerHTML = '<i class="fas fa-coins"></i> Smelt Gold';
                    actionBtn3.style.display = 'none';
                    if (ironOre < 3) actionBtn1.classList.add('disabled');
                    if (goldOre < 1) actionBtn2.classList.add('disabled');
                    return;
                }
                if (subMenu === 'forager') {
                    actionBtn1.innerHTML = '<i class="fas fa-tree"></i> Forage';
                    actionBtn2.innerHTML = '<i class="fas fa-store"></i> Shop';
                    actionBtn3.style.display = 'none';
                    if (!axeOwned) actionBtn1.classList.add('disabled');
                    return;
                }
                if (subMenu === 'forager_shop') {
                    actionBtn1.innerHTML = '<i class="fas fa-axe"></i> Buy Axe (100g)';
                    actionBtn2.innerHTML = '<i class="fas fa-coins"></i> Sell Logs';
                    actionBtn3.style.display = 'none';
                    if (axeOwned || gold < 100) actionBtn1.classList.add('disabled');
                    if (logs <= 0) actionBtn2.classList.add('disabled');
                    return;
                }

                if (currentPage === 0) {
                    actionBtn1.innerHTML = plantedCrop ? (Date.now() - plantTime >= 5000 ?
                        '<i class="fas fa-tractor"></i> Harvest' :
                        '<i class="fas fa-hourglass-half"></i> Growing') :
                        '<i class="fas fa-seedling"></i> Plant';
                    actionBtn2.innerHTML = '<i class="fas fa-leaf"></i> Crop';
                    actionBtn3.innerHTML = '<i class="fas fa-bread-slice"></i> Bakery';
                    if (plantedCrop && Date.now() - plantTime < 5000) actionBtn1.classList.add('disabled');
                    if (wheat < 5) actionBtn3.classList.add('disabled');
                } else if (currentPage === 1) {
                    actionBtn1.innerHTML = '<i class="fas fa-arrow-up"></i> Upgrades';
                    actionBtn2.innerHTML = '<i class="fas fa-dragon"></i> Adventure';
                    actionBtn3.innerHTML = '<i class="fas fa-fish"></i> Fishing';
                } else if (currentPage === 2) {
                    actionBtn1.innerHTML = '<i class="fas fa-box"></i> Storage';
                    actionBtn2.innerHTML = '<i class="fas fa-store"></i> Market';
                    actionBtn3.innerHTML = competitionJoined ? '<i class="fas fa-trophy"></i> Joined' :
                        '<i class="fas fa-medal"></i> Join Comp';
                    if (competitionJoined || gold < 100) actionBtn3.classList.add('disabled');
                } else if (currentPage === 3) {
                    actionBtn1.innerHTML = '<i class="fas fa-skull"></i> War';
                    actionBtn2.style.display = 'none';
                    actionBtn3.style.display = 'none';
                    if (population < 10 || gold < 500 || food < 200) actionBtn1.classList.add('disabled');
                } else if (currentPage === 4) {
                    actionBtn1.innerHTML = '<i class="fas fa-gem"></i> Mining';
                    actionBtn2.innerHTML = '<i class="fas fa-hammer"></i> Blacksmith';
                    actionBtn3.innerHTML = '<i class="fas fa-tree"></i> Forager';
                }
            }

            function updateNavButtons() {
                prevBtn.classList.remove('disabled');
                nextBtn.classList.remove('disabled');
                if (subMenu) {
                    prevBtn.innerHTML = '<i class="fas fa-arrow-left"></i> Back';
                    nextBtn.classList.add('disabled');
                    nextBtn.innerHTML = 'Next <i class="fas fa-arrow-right"></i>';
                } else {
                    prevBtn.innerHTML = '<i class="fas fa-arrow-left"></i> Prev';
                    nextBtn.innerHTML = 'Next <i class="fas fa-arrow-right"></i>';
                    if (currentPage === 0) prevBtn.classList.add('disabled');
                    if (currentPage === 4) nextBtn.classList.add('disabled');
                }
            }

            function getHouseUpgradeGoldCost() { return 55 * houses; }
            function getHouseUpgradeFoodCost() { return 30 * houses; }
            function getFarmUpgradeGoldCost() { return 90 * farmLevel; }
            function getFarmUpgradeFoodCost() { return 40 * farmLevel; }
            function getRodUpgradeCost() { return 100 + (rodLevel - 1) * 50; }

            function handleAction(actionId) {
                const buttons = [actionBtn1, actionBtn2, actionBtn3];
                const button = buttons[actionId - 1];
                if (!button || button.classList.contains('disabled')) {
                    let shakeType = subMenu || `page${currentPage}`;
                    if (subMenu === 'upgrades') shakeType = 'upgrade';
                    else if (subMenu === 'adventure') shakeType = 'adventure';
                    else if (subMenu === 'fishing') shakeType = 'fishing';
                    else if (subMenu === 'fishing_shop') shakeType = 'fishing_shop';
                    else if (subMenu === 'mining') shakeType = 'mining';
                    else if (subMenu === 'mining_shop') shakeType = 'mining_shop';
                    else if (subMenu === 'blacksmith') shakeType = 'blacksmith';
                    else if (subMenu === 'forager') shakeType = 'forager';
                    else if (subMenu === 'forager_shop') shakeType = 'forager_shop';
                    else if (currentPage === 0 && actionId === 1) shakeType = plantedCrop ? 'plant' : 'harvest';
                    else if (currentPage === 0 && actionId === 3) shakeType = 'bakery';
                    else if (currentPage === 2 && actionId === 3) shakeType = 'competition';
                    else if (currentPage === 3 && actionId === 1) shakeType = 'war';
                    shakeMessage(shakeType);
                    return;
                }

                if (subMenu === 'upgrades') {
                    if (actionId === 1) upgradeFarm();
                    else if (actionId === 2) upgradeHouse();
                    else if (actionId === 3) recruitPopulation();
                    updateUI();
                    return;
                }
                if (subMenu === 'adventure') {
                    if (actionId === 1) exploreAdventure();
                    else if (actionId === 2) startAutoExplore();
                    else if (actionId === 3) openInnPopup();
                    updateUI();
                    return;
                }
                if (subMenu === 'fishing') {
                    if (actionId === 1) goFish();
                    else if (actionId === 2) { subMenu = 'fishing_shop'; updateUI(); }
                    updateUI();
                    return;
                }
                if (subMenu === 'fishing_shop') {
                    if (actionId === 1) buyBait();
                    else if (actionId === 2) upgradeRod();
                    else if (actionId === 3) sellAllFish();
                    updateUI();
                    return;
                }
                if (subMenu === 'mining') {
                    if (actionId === 1) mine(false);
                    else if (actionId === 2) { subMenu = 'mining_shop'; updateUI(); }
                    else if (actionId === 3) mine(true);
                    updateUI();
                    return;
                }
                if (subMenu === 'mining_shop') {
                    if (actionId === 1) upgradePickaxe();
                    else if (actionId === 2) buyDrill();
                    else if (actionId === 3) sellMined();
                    updateUI();
                    return;
                }
                if (subMenu === 'blacksmith') {
                    if (actionId === 1) forgeSword();
                    else if (actionId === 2) smeltGold();
                    updateUI();
                    return;
                }
                if (subMenu === 'forager') {
                    if (actionId === 1) forage();
                    else if (actionId === 2) { subMenu = 'forager_shop'; updateUI(); }
                    updateUI();
                    return;
                }
                if (subMenu === 'forager_shop') {
                    if (actionId === 1) buyAxe();
                    else if (actionId === 2) sellLogs();
                    updateUI();
                    return;
                }

                if (currentPage === 0) {
                    if (actionId === 1) togglePlantHarvest();
                    else if (actionId === 2) openCropSelectionPopup();
                    else if (actionId === 3) bakeBread();
                } else if (currentPage === 1) {
                    if (actionId === 1) subMenu = 'upgrades';
                    else if (actionId === 2) { innNearby = Math.random() < 0.5; innOfferActive = false; subMenu = 'adventure'; removeMessagesOfType('inn_offer'); }
                    else if (actionId === 3) subMenu = 'fishing';
                } else if (currentPage === 2) {
                    if (actionId === 1) showStorage();
                    else if (actionId === 2) openMarket();
                    else if (actionId === 3) joinCompetition();
                } else if (currentPage === 3) {
                    if (actionId === 1) startWar();
                } else if (currentPage === 4) {
                    if (actionId === 1) subMenu = 'mining';
                    else if (actionId === 2) subMenu = 'blacksmith';
                    else if (actionId === 3) subMenu = 'forager';
                }
                updateUI();
            }

            function recruitPopulation() {
                if (gold < 100) return;
                gold -= 100;
                population++;
                updateOrAddMessage('upgrade', `<i class="fas fa-user-plus"></i> Recruited 1 villager.`);
            }

            function upgradePickaxe() {
                const cost = 100 + 50 * pickaxeLevel;
                if (gold < cost) return;
                gold -= cost;
                pickaxeLevel++;
                updateOrAddMessage('mining_shop', `<i class="fas fa-hammer"></i> Pickaxe upgraded to Lv.${pickaxeLevel}.`);
            }

            function buyDrill() {
                if (gold < 1000 || drillOwned) return;
                gold -= 1000;
                drillOwned = true;
                updateOrAddMessage('mining_shop', `<i class="fas fa-cogs"></i> Drill Machine purchased!`);
            }

            function mine(useDrill) {
                if (pickaxeLevel <= 0) return;
                if (useDrill) {
                    if (!drillOwned || drillBonusActive || drillCooldownEnd > Date.now()) return;
                    drillBonusActive = true;
                    drillCooldownEnd = Date.now() + 5 * 60 * 1000;
                }
                const mult = useDrill ? 5 : 1;
                const jewelCount = Math.floor(Math.random() * 3 + 1) * mult;
                const rockCount = Math.floor(Math.random() * 5 + 1) * mult;
                const ironCount = Math.floor(Math.random() * 3 + 1) * mult;
                const goldOreCount = Math.floor(Math.random() * 2 + 1) * mult;
                jewels += jewelCount;
                rocks += rockCount;
                ironOre += ironCount;
                goldOre += goldOreCount;
                let msg = `Mined ${jewelCount} jewels, ${rockCount} rocks, ${ironCount} iron, ${goldOreCount} gold ore.`;
                if (useDrill) {
                    msg = `Drill activated: ` + msg;
                    drillBonusActive = false;
                }
                updateOrAddMessage('mining', `<i class="fas fa-gem"></i> ${msg}`);
            }

            function sellMined() {
                if (jewels === 0 && rocks === 0 && ironOre === 0 && goldOre === 0) return;
                let total = 0;
                for (let i = 0; i < jewels; i++) total += Math.floor(Math.random() * 41 + 80);
                for (let i = 0; i < rocks; i++) total += Math.floor(Math.random() * 10 + 3);
                for (let i = 0; i < ironOre; i++) total += Math.floor(Math.random() * 10 + 6);
                for (let i = 0; i < goldOre; i++) total += Math.floor(Math.random() * 12 + 9);
                gold += total;
                const count = jewels + rocks + ironOre + goldOre;
                jewels = 0;
                rocks = 0;
                ironOre = 0;
                goldOre = 0;
                updateOrAddMessage('mining_shop', `<i class="fas fa-coins"></i> Sold ${count} mined items for ${formatNumber(total)}g.`);
            }

            function forgeSword() {
                if (ironOre < 3) return;
                ironOre -= 3;
                swords++;
                updateOrAddMessage('blacksmith', `<i class="fas fa-hammer"></i> Forged 1 sword from 3 iron.`);
            }

            function smeltGold() {
                if (goldOre < 1) return;
                goldOre--;
                gold += 500;
                updateOrAddMessage('blacksmith', `<i class="fas fa-coins"></i> Smelted gold ore into 500 coins.`);
            }

            function forage() {
                if (!axeOwned) return;
                const logCount = Math.floor(Math.random() * 3) + 1;
                logs += logCount;
                updateOrAddMessage('forager', `<i class="fas fa-tree"></i> Foraged ${logCount} logs.`);
            }

            function buyAxe() {
                if (axeOwned || gold < 100) return;
                gold -= 100;
                axeOwned = true;
                updateOrAddMessage('forager_shop', `<i class="fas fa-axe"></i> Axe purchased!`);
            }

            function sellLogs() {
                if (logs <= 0) return;
                let total = 0;
                for (let i = 0; i < logs; i++) total += Math.floor(Math.random() * 16 + 5);
                gold += total;
                const count = logs;
                logs = 0;
                updateOrAddMessage('forager_shop', `<i class="fas fa-coins"></i> Sold ${count} logs for ${formatNumber(total)}g.`);
            }

            function togglePlantHarvest() {
                if (plantedCrop) {
                    if (Date.now() - plantTime >= 5000) harvestCrop();
                } else {
                    plantCrop();
                }
            }

            function plantCrop() {
                const crop = cropData[selectedCropKey];
                plantedCrop = crop;
                plantedCropName = crop.name;
                plantTime = Date.now();
                removeMessagesOfType('harvest');
                startPlantCountdown();
                updateUI();
            }

            function harvestCrop() {
                if (!plantedCrop) return;
                if (plantCountdownInterval) { clearInterval(plantCountdownInterval); plantCountdownInterval = null; }
                const mult = getHarvestMultiplier();
                const baseYield = Math.floor(Math.random() * (plantedCrop.maxYield - plantedCrop.minYield + 1) + plantedCrop.minYield);
                const gain = Math.floor(baseYield * mult);
                if (plantedCrop.type === 'wheat') wheat += gain;
                else if (plantedCrop.type === 'carrot') carrot += gain;
                removeMessagesOfType('plant');
                updateOrAddMessage('harvest', `<i class="fas fa-tractor"></i> Harvested ${plantedCropName}! +${gain} ${plantedCrop.type}.`);
                plantedCrop = null;
                plantedCropName = '';
                plantTime = 0;
                updateUI();
            }

            function upgradeHouse() {
                const g = getHouseUpgradeGoldCost();
                const f = getHouseUpgradeFoodCost();
                if (gold < g || food < f) return;
                gold -= g; food -= f;
                houses++;
                updateOrAddMessage('upgrade', `<i class="fas fa-home"></i> House built! Now ${houses}.`);
            }

            function upgradeFarm() {
                const g = getFarmUpgradeGoldCost();
                const f = getFarmUpgradeFoodCost();
                if (gold < g || food < f) return;
                gold -= g; food -= f;
                farmLevel++;
                updateOrAddMessage('upgrade', `<i class="fas fa-tractor"></i> Farm upgraded to Lv.${farmLevel}!`);
            }

            function exploreAdventure() {
                if (population < 2 || food < 10) return;
                innNearby = false;
                food -= 10;
                const dice = Math.random();
                let msg = "";
                if (dice < 0.18) { jewelry++; msg = "You got Jewelry!"; }
                else if (dice < 0.36) { swords++; msg = "You got Sword!"; }
                else if (dice < 0.52) { clothes++; msg = "Clothes!"; }
                else if (dice < 0.68) { let f = 15 + Math.floor(Math.random()*40); food += f; dailyFoodCollected += f; msg = `+${f} food.`; }
                else if (dice < 0.83) { let g = 20 + Math.floor(Math.random()*50); gold += g; msg = `+${g} gold.`; }
                else if (dice < 0.92) { if (population > 1) { population--; msg = `Lost one.`; } else msg = `Safe escape.`; }
                else { population++; msg = `Found wanderer! +1 pop.`; }
                if (Math.random() < 0.1 && !innOfferActive) {
                    if (autoExploring) pauseAutoForInn();
                    innOfferActive = true;
                    showInnOffer();
                }
                updateOrAddMessage('adventure', `<i class="fas fa-dragon"></i> Explore: ${msg}`);
                if (autoExploring && !innOfferActive) {
                    autoExploreCount--;
                    if (autoExploreCount <= 0) stopAutoExplore();
                }
            }

            function showInnOffer() {
                const container = document.createElement('div');
                container.className = 'inn-offer-container';
                const yesBtn = document.createElement('button');
                yesBtn.innerHTML = '<i class="fas fa-check"></i> Yes';
                yesBtn.className = 'market-btn';
                yesBtn.addEventListener('click', () => {
                    innNearby = true;
                    innOfferActive = false;
                    autoExploreCount = 0;
                    stopAutoExplore();
                    removeMessagesOfType('inn_offer');
                    container.remove();
                    updateUI();
                });
                const noBtn = document.createElement('button');
                noBtn.innerHTML = '<i class="fas fa-times"></i> No';
                noBtn.className = 'market-btn';
                noBtn.addEventListener('click', () => {
                    innOfferActive = false;
                    container.remove();
                    removeMessagesOfType('inn_offer');
                    if (autoExploreCount > 0 && !autoExploring) resumeAutoExplore();
                    updateUI();
                });
                container.appendChild(yesBtn);
                container.appendChild(noBtn);
                updateOrAddMessage('inn_offer', '<i class="fas fa-inn"></i> Found an Inn! Want to stop?');
                const msgEl = getMessageElement('inn_offer');
                if (msgEl) msgEl.appendChild(container);
            }

            function pauseAutoForInn() {
                if (autoInterval) clearInterval(autoInterval);
                autoInterval = null;
                autoExploring = false;
            }

            function resumeAutoExplore() {
                if (autoExploreCount <= 0) return;
                autoExploring = true;
                autoInterval = setInterval(() => {
                    if (!autoExploring || innOfferActive) return;
                    exploreAdventure();
                }, 1000);
                updateOrAddMessage('adventure', `<i class="fas fa-running"></i> Auto Explore resumed (${autoExploreCount} left).`);
            }

            function startAutoExplore() {
                if (autoExploring || innOfferActive || restEndTime > Date.now()) return;
                innNearby = false;
                autoExploreCount = 10;
                autoExploring = true;
                autoInterval = setInterval(() => {
                    if (!autoExploring || innOfferActive) return;
                    exploreAdventure();
                }, 1000);
                updateOrAddMessage('adventure', `<i class="fas fa-running"></i> Auto Explore started (10 times).`);
                updateUI();
            }

            function stopAutoExplore() {
                if (autoInterval) clearInterval(autoInterval);
                autoExploring = false;
                autoExploreCount = 0;
                autoInterval = null;
                updateUI();
            }

            function openInnPopup() {
                const popup = document.getElementById('universalPopup');
                document.getElementById('popupTitle').innerHTML = '<i class="fas fa-inn"></i> Inn';
                let html = '<div style="display:flex; flex-direction:column; gap:12px;">';
                html += `<button class="action-btn" onclick="window.innRecruit()"><i class="fas fa-user-plus"></i> Recruit (100g)</button>`;
                html += `<button class="action-btn" onclick="window.innRest()" ${restEndTime > Date.now() ? 'disabled' : ''}><i class="fas fa-bed"></i> Rest (200g/20s, +4pop/5s)</button>`;
                html += '</div>';
                document.getElementById('popupContent').innerHTML = html;
                popup.style.display = 'flex';
            }
            window.innRecruit = function() {
                if (gold < 100) return;
                gold -= 100;
                population++;
                updateOrAddMessage('upgrade', `<i class="fas fa-user-plus"></i> Recruited 1 villager.`);
                closeUniversalPopup();
                updateUI();
            };
            window.innRest = function() {
                if (gold < 200 || restEndTime > Date.now()) return;
                gold -= 200;
                restEndTime = Date.now() + 20000;
                restNextTick = Date.now() + 5000;
                updateOrAddMessage('upgrade', `<i class="fas fa-bed"></i> Resting 20s... +4 pop every 5s.`);
                closeUniversalPopup();
                updateUI();
            };

            function bakeBread() {
                if (wheat < 5) return;
                let used = Math.min(wheat, 50);
                let bread = Math.floor(used * 1.2);
                wheat -= used;
                food += bread;
                dailyFoodCollected += bread;
                updateOrAddMessage('bakery', `<i class="fas fa-bread-slice"></i> ${used} wheat → ${bread} food.`);
            }

            function openFishingShop() {
                subMenu = 'fishing_shop';
                updateUI();
                const rodCost = getRodUpgradeCost();
                updateOrAddMessage('fishing_shop', `<i class="fas fa-store"></i> FISHING SHOP | Baits: ${baits} | Rod Lv.${rodLevel} | Upgrade: ${rodCost}g`);
            }

            function goFish() {
                if (baits <= 0) return;
                baits--;
                const isLegendary = Math.random() < 0.04;
                let species, weight, price;
                if (isLegendary) {
                    species = fishSpecies[5];
                    weight = 200;
                    if (rodLevel < 10 && Math.random() < 0.75) {
                        rodLevel = Math.max(1, rodLevel - 1);
                        updateOrAddMessage('fishing', `<i class="fas fa-exclamation-triangle"></i> Legendary fish broke your rod! Lv.${rodLevel}.`);
                        updateUI();
                        return;
                    }
                    price = Math.floor(species.basePrice * (weight / 10));
                } else {
                    species = fishSpecies[Math.floor(Math.random() * 5)];
                    const maxWeight = 4.5 + rodLevel * 1.2;
                    weight = parseFloat((0.5 + Math.random() * maxWeight).toFixed(1));
                    price = Math.floor(species.basePrice * weight);
                }
                fishInventory.push({ name: species.name, weight, price });
                updateOrAddMessage('fishing', `<i class="fas fa-fish"></i> Caught ${species.name} ${weight}kg worth ${price}g. (Rod Lv.${rodLevel})`);
                if (subMenu === 'fishing_shop') openFishingShop();
            }

            function buyBait() {
                if (gold < 5) return;
                gold -= 5;
                baits++;
                if (subMenu === 'fishing_shop') openFishingShop();
            }

            function upgradeRod() {
                const cost = getRodUpgradeCost();
                if (gold < cost) return;
                gold -= cost;
                rodLevel++;
                if (subMenu === 'fishing_shop') openFishingShop();
            }

            function sellAllFish() {
                if (fishInventory.length === 0) return;
                let total = fishInventory.reduce((s, f) => s + f.price, 0);
                gold += total;
                updateOrAddMessage('fishing_shop', `<i class="fas fa-coins"></i> Sold ${fishInventory.length} fish for ${formatNumber(total)}g.`);
                fishInventory = [];
                if (subMenu === 'fishing_shop') openFishingShop();
            }

            function showStorage() {
                let lines = [
                    `<i class="fas fa-box"></i> STORAGE`,
                    `Food: ${formatNumber(Math.floor(food))} | Gold: ${formatNumber(gold)}`,
                    `Wheat: ${formatNumber(Math.floor(wheat))} | Carrot: ${formatNumber(carrot)}`,
                    `Medals: ${formatNumber(medals)} | Jewelry: ${formatNumber(jewelry)} | Swords: ${formatNumber(swords)} | Clothes: ${formatNumber(clothes)}`,
                    `Fish: ${fishInventory.length} (Baits: ${baits}, Rod Lv.${rodLevel})`,
                    `Jewels: ${formatNumber(jewels)} | Rocks: ${formatNumber(rocks)} | Iron: ${formatNumber(ironOre)} | Gold Ore: ${formatNumber(goldOre)}`,
                    `Logs: ${formatNumber(logs)} | Axe: ${axeOwned ? 'Yes' : 'No'} | Pickaxe Lv.${pickaxeLevel} | Drill: ${drillOwned ? 'Yes' : 'No'}`
                ];
                updateOrAddMessage('storage', lines.join('<br>'));
            }

            function openMarket() {
                let inv = `<i class="fas fa-store"></i> MARKET<br>`;
                inv += `Wheat: ${formatNumber(wheat)} (3g) | Carrot: ${formatNumber(carrot)} (3g)<br>`;
                inv += `Medals: ${formatNumber(medals)} (10k) | Jewelry: ${formatNumber(jewelry)} (500) | Swords: ${formatNumber(swords)} (250) | Clothes: ${formatNumber(clothes)} (100)<br>`;
                inv += `Jewels: ${formatNumber(jewels)} | Rocks: ${formatNumber(rocks)} | Iron Ore: ${formatNumber(ironOre)} | Gold Ore: ${formatNumber(goldOre)} | Logs: ${formatNumber(logs)}`;
                updateOrAddMessage('market', inv);
                const msgEl = getMessageElement('market');
                if (msgEl) {
                    const container = document.createElement('div');
                    container.className = 'market-buttons-container';
                    const items = [
                        { name: '<i class="fas fa-wheat-awn"></i> Wheat', action: () => { sellItem('wheat'); refreshMarket(); } },
                        { name: '<i class="fas fa-carrot"></i> Carrot', action: () => { sellItem('carrot'); refreshMarket(); } },
                        { name: '<i class="fas fa-medal"></i> Medal', action: () => { sellMedal(); refreshMarket(); } },
                        { name: '<i class="fas fa-gem"></i> Jewelry', action: () => { sellLoot('jewelry', 500); refreshMarket(); } },
                        { name: '<i class="fas fa-sword"></i> Sword', action: () => { sellLoot('swords', 250); refreshMarket(); } },
                        { name: '<i class="fas fa-tshirt"></i> Clothes', action: () => { sellLoot('clothes', 100); refreshMarket(); } },
                        { name: '<i class="fas fa-gem"></i> Jewels', action: () => { sellMinedType('jewels'); refreshMarket(); } },
                        { name: '<i class="fas fa-mountain"></i> Rocks', action: () => { sellMinedType('rocks'); refreshMarket(); } },
                        { name: '<i class="fas fa-cube"></i> Iron Ore', action: () => { sellMinedType('ironOre'); refreshMarket(); } },
                        { name: '<i class="fas fa-coins"></i> Gold Ore', action: () => { sellMinedType('goldOre'); refreshMarket(); } },
                        { name: '<i class="fas fa-tree"></i> Logs', action: () => { sellLogsAll(); refreshMarket(); } }
                    ];
                    items.forEach(it => {
                        let btn = document.createElement('button');
                        btn.innerHTML = it.name;
                        btn.className = 'market-btn';
                        btn.addEventListener('click', it.action);
                        container.appendChild(btn);
                    });
                    let sellAllBtn = document.createElement('button');
                    sellAllBtn.innerHTML = '<i class="fas fa-coins"></i> Sell All (except plants)';
                    sellAllBtn.className = 'market-btn';
                    sellAllBtn.addEventListener('click', () => { sellAllNonPlants(); refreshMarket(); });
                    container.appendChild(sellAllBtn);
                    msgEl.appendChild(container);
                }
            }

            function refreshMarket() {
                removeMessagesOfType('market');
                openMarket();
            }

            function sellItem(type) {
                let amt = 0;
                if (type === 'wheat') { amt = wheat; wheat = 0; }
                else if (type === 'carrot') { amt = carrot; carrot = 0; }
                if (amt <= 0) return;
                gold += amt * 3;
            }

            function sellMedal() { if (medals > 0) { medals--; gold += 10000; } }
            function sellLoot(item, price) {
                if (item === 'jewelry') { if (jewelry > 0) { gold += jewelry * price; jewelry = 0; } }
                else if (item === 'swords') { if (swords > 0) { gold += swords * price; swords = 0; } }
                else if (item === 'clothes') { if (clothes > 0) { gold += clothes * price; clothes = 0; } }
            }

            function sellMinedType(type) {
                let count = 0;
                if (type === 'jewels') { count = jewels; jewels = 0; for (let i=0;i<count;i++) gold += Math.floor(Math.random()*41+80); }
                else if (type === 'rocks') { count = rocks; rocks = 0; for (let i=0;i<count;i++) gold += Math.floor(Math.random()*10+3); }
                else if (type === 'ironOre') { count = ironOre; ironOre = 0; for (let i=0;i<count;i++) gold += Math.floor(Math.random()*10+6); }
                else if (type === 'goldOre') { count = goldOre; goldOre = 0; for (let i=0;i<count;i++) gold += Math.floor(Math.random()*12+9); }
            }

            function sellLogsAll() {
                if (logs <= 0) return;
                let total = 0;
                for (let i=0;i<logs;i++) total += Math.floor(Math.random()*16+5);
                gold += total;
                logs = 0;
            }

            function sellAllNonPlants() {
                let total = 0;
                if (medals > 0) { total += medals * 10000; medals = 0; }
                if (jewelry > 0) { total += jewelry * 500; jewelry = 0; }
                if (swords > 0) { total += swords * 250; swords = 0; }
                if (clothes > 0) { total += clothes * 100; clothes = 0; }
                sellMinedType('jewels');
                sellMinedType('rocks');
                sellMinedType('ironOre');
                sellMinedType('goldOre');
                sellLogsAll();
                if (total > 0) gold += total;
            }

            function joinCompetition() {
                if (competitionJoined || gold < 100) return;
                gold -= 100;
                competitionJoined = true;
                updateOrAddMessage('competition', `<i class="fas fa-medal"></i> Joined comp! Beat ${botName} (${formatNumber(botTargetScore)} food). If you collect more food today, you win 1 medal and gold equal to your daily food. Next reset at 9:00 AM.`);
            }

            function generateBotScore() { return Math.floor(200 + Math.random() * 80000); }
            function pickRandomBot() { return botNames[Math.floor(Math.random() * botNames.length)]; }

            function checkCompetitionReset() {
                const now = new Date();
                const dateKey = `${now.getFullYear()}-${now.getMonth()+1}-${now.getDate()}`;
                if (lastCompetitionDate !== dateKey && now.getHours() >= 9) {
                    if (lastCompetitionDate) resolveCompetition();
                    dailyFoodCollected = 0;
                    competitionJoined = false;
                    botTargetScore = generateBotScore();
                    botName = pickRandomBot();
                    lastCompetitionDate = dateKey;
                    updateOrAddMessage('system', `<i class="fas fa-flag-checkered"></i> New comp! ${botName} needs ${formatNumber(botTargetScore)} food. Reset at 9 AM.`, true);
                } else if (!lastCompetitionDate) {
                    botTargetScore = generateBotScore();
                    botName = pickRandomBot();
                    lastCompetitionDate = dateKey;
                    updateOrAddMessage('system', `<i class="fas fa-flag-checkered"></i> Today's competition: ${botName} needs ${formatNumber(botTargetScore)} food. Reset at 9 AM.`, true);
                }
                updateUI();
            }

            function resolveCompetition() {
                if (!competitionJoined) return;
                if (dailyFoodCollected > botTargetScore) {
                    medals++;
                    gold += dailyFoodCollected;
                    updateOrAddMessage('system', `<i class="fas fa-trophy"></i> You beat ${botName}! +${formatNumber(dailyFoodCollected)}g +1 medal.`, true);
                } else {
                    updateOrAddMessage('system', `<i class="fas fa-frown"></i> ${botName} won. Better luck next time.`, true);
                }
            }

            function startWar() {
                if (population < 10 || gold < 500 || food < 200) return;
                gold -= 500;
                food -= 200;
                population = Math.max(1, population - (5 + Math.floor(Math.random() * 3)));
                const r = Math.random();
                let msg = "";
                if (r < 0.2) { swords += 3; msg = "3 Swords!"; }
                else if (r < 0.35) { jewelry += 2; msg = "2 Jewelry!"; }
                else if (r < 0.5) { clothes += 4; msg = "4 Clothes!"; }
                else if (r < 0.65) { gold += 5000; msg = "5k gold!"; }
                else if (r < 0.8) { gold += 10000; msg = "10k gold!"; }
                else if (r < 0.93) { gold += 25000; msg = "25k gold!"; }
                else { gold += 200000; msg = "200k gold!!"; }
                updateOrAddMessage('war', `<i class="fas fa-skull"></i> WAR! ${msg}`);
            }

            function openCropSelectionPopup() {
                const popup = document.getElementById('universalPopup');
                document.getElementById('popupTitle').innerHTML = '<i class="fas fa-leaf"></i> Select Crop';
                let html = '';
                Object.entries(cropData).forEach(([key, crop]) => {
                    html += `<div class="crop-option" onclick="selectCrop('${key}')">
                        <h3><i class="fas ${crop.icon}"></i> ${crop.name}</h3>
                        <p>Yield: ${crop.minYield}-${crop.maxYield} ${crop.type}</p>
                    </div>`;
                });
                document.getElementById('popupContent').innerHTML = html;
                popup.style.display = 'flex';
            }
            window.selectCrop = function(key) { selectedCropKey = key; closeUniversalPopup(); updateUI(); };
            window.closeUniversalPopup = function() { document.getElementById('universalPopup').style.display = 'none'; };

            function processRest() {
                if (restEndTime && Date.now() >= restEndTime) {
                    population += 4;
                    restEndTime = 0;
                    restNextTick = 0;
                    updateOrAddMessage('upgrade', '<i class="fas fa-bed"></i> Rest complete: +4 population.');
                }
                if (restNextTick && Date.now() >= restNextTick && restEndTime > Date.now()) {
                    population += 4;
                    restNextTick += 5000;
                    updateOrAddMessage('upgrade', `<i class="fas fa-bed"></i> Rest tick: +4 pop (now ${population}).`);
                }
            }

            function passiveFoodGain() {
                const gain = (BASE_FOOD_PER_HOUR * farmLevel) / 3600;
                food += gain;
                dailyFoodCollected += gain;
                processRest();
                updateUI();
            }

            actionBtn1.addEventListener('click', () => handleAction(1));
            actionBtn2.addEventListener('click', () => handleAction(2));
            actionBtn3.addEventListener('click', () => handleAction(3));

            prevBtn.addEventListener('click', () => {
                if (subMenu) {
                    subMenu = null;
                    updateUI();
                } else if (currentPage > 0) {
                    currentPage--;
                    updateUI();
                }
            });
            nextBtn.addEventListener('click', () => {
                if (!subMenu && currentPage < 4) {
                    currentPage++;
                    updateUI();
                }
            });

            setInterval(passiveFoodGain, 1000);
            setInterval(checkCompetitionReset, 1000);

            loadGame();
            if (!lastCompetitionDate) { botTargetScore = generateBotScore(); botName = pickRandomBot(); }
            chatMessages.innerHTML = '';
            updateOrAddMessage('system', `<i class="fas fa-leaf"></i> Farm, mine, fish, fight. Beat ${botName} (${formatNumber(botTargetScore)} food)`, true);
            updateUI();
        })();
    </script>
</body>
</html>
