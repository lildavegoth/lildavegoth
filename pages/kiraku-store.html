<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SOON | lildavegoth</title>
    <meta name="color-scheme" content="dark">
    <script src="../protections.js"></script>
    <script src="../notification.cssjs"></script>
    <link rel="stylesheet" href="../media.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --accent-color: #C1FC32;
            --accent-dark: #9bc726;
            --bg-black: #000000;
            --bg-dark: #1a1a1a;
            --bg-card: rgba(30, 30, 30, 0.7);
            --text-primary: #f5f5f7;
            --text-secondary: #a1a1a6;
            --radius-small: 12px;
            --radius-medium: 20px;
            --radius-large: 28px;
            --spacing-xs: 8px;
            --spacing-sm: 16px;
            --spacing-md: 24px;
            --spacing-lg: 32px;
            --spacing-xl: 48px;
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
        }
        body {
            background-color: var(--bg-black);
            color: var(--text-primary);
            min-height: 100vh;
            background-image: 
                radial-gradient(circle at 20% 80%, rgba(193, 252, 50, 0.05) 0%, transparent 20%),
                radial-gradient(circle at 80% 20%, rgba(193, 252, 50, 0.03) 0%, transparent 20%);
            overflow-x: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: var(--spacing-md);
        }
        .container {
            max-width: 500px;
            width: 100%;
            margin: 0 auto;
        }
        .blur-background {
            backdrop-filter: saturate(180%) blur(20px);
            -webkit-backdrop-filter: saturate(180%) blur(20px);
            background-color: rgba(22, 22, 24, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        header {
            text-align: center;
            margin-bottom: var(--spacing-xl);
        }
        .logo {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: var(--spacing-sm);
            margin-bottom: var(--spacing-sm);
        }
        .avatar {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid var(--accent-color);
            padding: 2px;
        }
        .username {
            font-size: 2rem;
            font-weight: 700;
        }
        .tagline {
            color: var(--text-secondary);
            font-size: 1rem;
            margin-bottom: var(--spacing-md);
        }
        .soon-container {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: var(--spacing-xl) 0;
        }
        .soon-text {
            font-size: 5rem;
            font-weight: 800;
            color: var(--accent-color);
            text-transform: uppercase;
            letter-spacing: 12px;
            text-shadow: 0 0 20px rgba(193, 252, 50, 0.3);
            animation: pulse 2s infinite ease-in-out;
        }
    </style>
</head>
<body>
    <div class="container fade-in">
        <a href="../index.html" class="back-link fade-in">
            <i class="fas fa-arrow-left"></i> Back to Home
        </a>
        <div class="soon-container">
            <div class="soon-text">SOON</div>
        </div>
        <footer>
            <div class="social-links">
                <a href="https://twitter.com/lildavegoth"><span class="icon icon-twitter"></span></a>
                <a href="https://instagram.com/dave_goth"><span class="icon icon-instagram"></span></a>
            </div>
            <p>© 2026 lildavegoth | SOON</p>
            <p style="margin-top: 8px; font-size: 0.8rem; color: #666;">
                Conveys the Idea of a Protected and Inspiring Space for Creative Expression.
            </p>
        </footer>
    </div>
</body>
</html>
