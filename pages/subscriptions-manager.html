<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Subscriptions Manager | lildavegoth</title>
    <meta name="color-scheme" content="dark">
    <script src="../protections.js"></script>
    <link rel="stylesheet" href="../media.css">
    <script src="../notification.cssjs"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root {
            --accent-color: #C1FC32;
            --accent-dark: #9bc726;
            --bg-black: #000000;
            --bg-dark: #1a1a1a;
            --bg-card: rgba(30, 30, 30, 0.7);
            --text-primary: #f5f5f7;
            --text-secondary: #a1a1a6;
            --radius-small: 12px;
            --radius-medium: 20px;
            --radius-large: 28px;
            --spacing-xs: 8px;
            --spacing-sm: 16px;
            --spacing-md: 24px;
            --spacing-lg: 32px;
            --spacing-xl: 48px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-black);
            color: var(--text-primary);
            min-height: 100vh;
            background-image: 
                radial-gradient(circle at 20% 80%, rgba(193, 252, 50, 0.05) 0%, transparent 20%),
                radial-gradient(circle at 80% 20%, rgba(193, 252, 50, 0.03) 0%, transparent 20%);
            overflow-x: hidden;
        }

        .container {
            max-width: 1600px;
            margin: 0 auto;
            padding: var(--spacing-md);
            position: relative;
            min-height: calc(100vh - 90px);
        }

        .subscriptions-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 28px 0 20px 0;
        }
        .subscriptions-header h2 {
            font-size: 1.8rem;
            font-weight: 600;
        }
        .add-pill {
            background: var(--accent-color);
            color: #111;
            border: none;
            padding: 8px 20px;
            border-radius: 60px;
            font-size: 1rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
            transition: 0.2s;
        }
        .add-pill i { font-size: 1rem; }
        .add-pill:hover { background: #d0ff5e; }
        .add-pill:active { transform: scale(0.97); }

        .card {
            position: relative;
            display: flex;
            align-items: center;
            background-color: #1f1f1f;
            border-radius: 24px;
            gap: 20px;
            margin-top: 15px;
            height: 90px;
            max-height: 90px;
            width: 100%;
            transition: 0.2s;
            border: 1px solid transparent;
        }
        .card.pinned { border-color: var(--accent-color); }

        .duration-box {
            width: 58px;
            height: 58px;
            margin-left: 18px;
            background-color: #aaff00;
            border-radius: 16px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            flex-shrink: 0;
            transition: 0.2s;
        }
        .duration-box.urgent {
            background-color: #C42833 !important;
        }
        .duration-box.urgent .number,
        .duration-box.urgent .unit {
            color: #ffffff !important;
        }
        .duration-box .number {
            font-size: 22px;
            font-weight: 700;
            color: #111111;
            line-height: 1;
        }
        .duration-box .unit {
            font-size: 11px;
            font-weight: 600;
            color: #111111;
            margin-top: 2px;
        }

        .info {
            flex: 1;
            min-width: 0;
        }
        .info h3 {
            font-size: 19px;
            font-weight: 700;
            margin: 0 0 6px 0;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 200px;
        }
        .info .date {
            font-size: 12px;
            color: #888888;
            margin: -5px 0 10px 0;
        }
        .info .price {
            font-size: 15px;
            font-weight: 700;
            margin: 0;
            color: var(--accent-color);
        }

        .icons {
            position: absolute;
            top: 18px;
            right: 18px;
            display: flex;
            gap: 14px;
        }
        .icons i {
            font-size: 18px;
            color: #ffffff;
            cursor: pointer;
            transition: 0.15s;
        }
        .icons i.pinned { color: var(--accent-color); }
        .icons i:active { transform: scale(0.9); }
        .icons i:hover { opacity: 0.8; }

        .renew-button {
            position: absolute;
            bottom: 12px;
            right: 12px;
            background: var(--accent-color);
            color: #111;
            border: none;
            border-radius: 30px;
            padding: 4px 8px;
            font-size: 0.85rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            cursor: pointer;
            transition: 0.2s;
            z-index: 2;
        }
        .renew-button:active { transform: scale(0.95); }

        .popup-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 1.0);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 99999999;
            animation: fadeIn 0.3s ease;
        }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        .popup-content {
            background: var(--bg-card);
            border-radius: var(--radius-large);
            width: 90%;
            max-width: 500px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            max-height: 80vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            backdrop-filter: blur(8px);
        }
        .popup-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: var(--spacing-sm);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }
        .popup-header h2 { font-size: 1.3rem; font-weight: 600; }
        .close-popup {
            background: transparent;
            border: none;
            color: var(--text-secondary);
            font-size: 1.2rem;
            cursor: pointer;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .close-popup:hover { background: rgba(255,255,255,0.1); }
        .close-popup:active { transform: scale(0.9); }

        .popup-body {
            padding: var(--spacing-sm);
            overflow-y: auto;
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        .popup-footer {
            padding: var(--spacing-sm);
            border-top: 1px solid rgba(255,255,255,0.1);
            display: flex;
            justify-content: flex-end;
            gap: 12px;
            background: rgba(20,20,20,0.95);
        }
        .field-group {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .field-group label { font-size: 0.85rem; color: var(--text-secondary); }
        .field-group input, .field-group select {
            background: #2a2a2a;
            border: 1px solid #3a3a3a;
            border-radius: 12px;
            padding: 10px 14px;
            color: white;
            font-size: 0.95rem;
            outline: none;
            appearance: none;
            -webkit-appearance: none;
        }
        .field-group input:focus, .field-group select:focus { border-color: var(--accent-color); }
        .field-group input[type=number]::-webkit-inner-spin-button,
        .field-group input[type=number]::-webkit-outer-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
        .field-group input[type=number] { appearance: textfield; }
        .field-group select {
            background-image: none;
        }
        .date-col input {
            background: #2a2a2a;
            border: 1px solid #3a3a3a;
            border-radius: 12px;
            padding: 10px 14px;
            color: white;
            font-size: 0.95rem;
            outline: none;
            appearance: none;
            -webkit-appearance: none;
            width: 100%;
        }
        .date-col input:focus {
            border-color: var(--accent-color);
        }
        input[type="date"]::-webkit-calendar-picker-indicator {
            display: none;
        }

        .date-row {
            display: flex;
            gap: 12px;
        }
        .date-col {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .btn {
            padding: 12px 24px;
            border-radius: 12px;
            border: none;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            transition: 0.2s;
        }
        .btn:active { transform: scale(0.97); }
        .btn-primary { background: var(--accent-color); color: #111; }
        .btn-primary:hover { background: #d0ff5e; }
        .btn-secondary { background: #2a2a2a; color: white; }
        .btn-secondary:hover { background: #3a3a3a; }
        .btn-danger { background: #C42833; color: white; }
        .btn-danger:hover { background: #a0202a; }

        #cardsContainer { margin-top: 10px; }

        .search-container {
            margin-bottom: var(--spacing-md);
            position: relative;
            margin-top: 24px;
        }
        .search-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }
        .search-wrapper input {
            width: 100%;
            padding: 12px 44px 12px 16px;
            border-radius: var(--radius-medium);
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: var(--text-primary);
            font-size: 0.95rem;
            outline: none;
        }
        .search-wrapper input:focus {
            border-color: var(--accent-color);
        }
        .search-icon {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-secondary);
            pointer-events: none;
        }
        .search-icon i {
            color: var(--accent-color);
            margin-right: 5px;
        }
        .clear-search {
            position: absolute;
            right: 40px;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(255,255,255,0.1);
            border: none;
            color: white;
            width: 24px;
            height: 24px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 16px;
            transition: 0.2s;
            z-index: 5;
        }
        .clear-search:hover {
            background: rgba(255,255,255,0.2);
        }
        .clear-search.hidden {
            display: none;
        }

        .search-suggestions {
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            background: var(--bg-card);
            border-radius: var(--radius-medium);
            border: 1px solid rgba(255, 255, 255, 0.1);
            margin-top: 8px;
            max-height: 300px;
            overflow-y: auto;
            z-index: 1000;
            display: none;
            backdrop-filter: saturate(180%) blur(20px);
            -webkit-backdrop-filter: saturate(180%) blur(20px);
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        .search-suggestion-item {
            padding: 12px 16px;
            cursor: pointer;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            transition: all 0.2s ease;
        }

        .search-suggestion-item:hover {
            background: rgba(193, 252, 50, 0.1);
        }

        .search-suggestion-item:last-child {
            border-bottom: none;
        }

        .suggestion-title {
            font-weight: 500;
            margin-bottom: 4px;
            color: var(--text-primary);
        }

        .suggestion-description {
            font-size: 0.85rem;
            color: var(--text-secondary);
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .suggestion-category {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 12px;
            font-size: 0.7rem;
            margin-top: 4px;
            background: rgba(193, 252, 50, 0.1);
            color: var(--accent-color);
        }

        .search-suggestions::-webkit-scrollbar {
            display: none;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-secondary);
            font-size: 1.1rem;
            background: rgba(255,255,255,0.02);
            border-radius: var(--radius-large);
            margin-top: 20px;
        }
        .empty-state i {
            font-size: 3rem;
            color: var(--accent-color);
            margin-bottom: 16px;
            opacity: 0.6;
        }
    </style>
</head>
<body>
    <div class="container">
        <a href="../index.html" class="back-link fade-in">
            <i class="fas fa-arrow-left"></i> Back to Home
        </a>
        
        <div class="app-header">
            <h1 style="font-size: 1.8rem;" class="app-title">Subscriptions Manager</h1>
            <p class="app-subtitle">Manage all of your Subscriptions to keep them tracked and reminded</p>
        </div>

        <div class="search-container">
            <div class="search-wrapper">
                <input type="text" id="globalSearch" placeholder="Search for subscriptions...">
                <button class="clear-search hidden" id="clearSearchBtn" aria-label="Clear search"><i class="fas fa-times"></i></button>
                <div class="search-icon">
                    <i class="fas fa-search"></i>
                </div>
            </div>
            <div class="search-suggestions" id="searchSuggestions"></div>
        </div>

        <div class="subscriptions-header">
            <h2>Subscriptions</h2>
            <button class="add-pill" id="openAddPopupBtn"><i class="fas fa-plus"></i> Add</button>
        </div>

        <div id="cardsContainer"></div>

        <footer class="fade-in">
            <div class="social-links">
                <a href="https://twitter.com/lildavegoth"><span class="icon icon-twitter"></span></a>
                <a href="https://instagram.com/dave_goth"><span class="icon icon-instagram"></span></a>
            </div>
            <p>© 2026 lildavegoth | Subscriptions Manager</p>
            <p style="margin-top: 8px; font-size: 0.8rem; color: #666;">
                Conveys the Idea of a Protected and Inspiring Space for Creative Expression.
            </p>
        </footer>
    </div>

    <div id="universalPopup" class="popup-overlay" style="display: none;">
        <div class="popup-content">
            <div class="popup-header">
                <h2 id="popupTitle"></h2>
                <button class="close-popup" id="closePopupBtn"><i class="fas fa-times"></i></button>
            </div>
            <div class="popup-body" id="popupBody"></div>
            <div class="popup-footer" id="popupFooter"></div>
        </div>
    </div>

    <script>
        (function() {
            let subscriptions = [];
            const STORAGE_KEY = 'subscriptionsManager';

            const currencyData = {
                USD: { symbol: '$', decimals: 2 },
                EUR: { symbol: '€', decimals: 2 },
                GBP: { symbol: '£', decimals: 2 },
                JPY: { symbol: '¥', decimals: 0 },
                CNY: { symbol: '¥', decimals: 2 },
                INR: { symbol: '₹', decimals: 2 },
                IDR: { symbol: 'Rp', decimals: 0 },
                AUD: { symbol: 'A$', decimals: 2 },
                CAD: { symbol: 'C$', decimals: 2 },
                CHF: { symbol: 'CHF', decimals: 2 },
                SGD: { symbol: 'S$', decimals: 2 },
                MYR: { symbol: 'RM', decimals: 2 },
                PHP: { symbol: '₱', decimals: 2 },
                THB: { symbol: '฿', decimals: 2 },
                KRW: { symbol: '₩', decimals: 0 },
            };

            function loadFromStorage() {
                const stored = localStorage.getItem(STORAGE_KEY);
                if (stored) {
                    try {
                        subscriptions = JSON.parse(stored);
                    } catch (e) {
                        subscriptions = [];
                    }
                } else {
                    subscriptions = [];
                }
            }
            loadFromStorage();

            function saveToStorage() {
                localStorage.setItem(STORAGE_KEY, JSON.stringify(subscriptions));
            }

            function addMonths(date, months) {
                const d = new Date(date);
                d.setMonth(d.getMonth() + months);
                return d;
            }
            function addYears(date, years) {
                const d = new Date(date);
                d.setFullYear(d.getFullYear() + years);
                return d;
            }
            function addWeeks(date, weeks) {
                const d = new Date(date);
                d.setDate(d.getDate() + weeks * 7);
                return d;
            }

            function getRemainingDays(endDate) {
                const end = new Date(endDate);
                const today = new Date();
                today.setHours(0,0,0,0);
                const diff = end - today;
                return Math.ceil(diff / (1000 * 60 * 60 * 24));
            }

            function formatRemaining(days) {
                if (days <= 0) return { number: 0, unit: 'Dead' };
                if (days < 30) return { number: days, unit: days === 1 ? 'Day' : 'Days' };
                const months = Math.floor(days / 30);
                return { number: months, unit: months === 1 ? 'Month' : 'Months' };
            }

            function formatPrice(price, currency) {
                const info = currencyData[currency] || currencyData.USD;
                if (info.decimals === 0) {
                    return info.symbol + Math.round(price).toLocaleString();
                }
                return info.symbol + price.toFixed(info.decimals);
            }

            function renderCards(filterText = '') {
                const container = document.getElementById('cardsContainer');
                if (!container) return;

                let filtered = subscriptions;
                if (filterText.trim()) {
                    const term = filterText.toLowerCase();
                    filtered = subscriptions.filter(sub => sub.name.toLowerCase().includes(term));
                }

                if (filtered.length === 0) {
                    container.innerHTML = `
                        <div class="empty-state">
                            <i class="fas fa-box-open"></i>
                            <p>There are no Subscriptions yet, add a new one to tracks your subscriptions.</p>
                        </div>
                    `;
                    return;
                }

                const sorted = [...filtered].sort((a, b) => {
                    if (a.pinned && !b.pinned) return -1;
                    if (!a.pinned && b.pinned) return 1;
                    const daysA = getRemainingDays(a.endDate);
                    const daysB = getRemainingDays(b.endDate);
                    return daysA - daysB;
                });

                let html = '';
                sorted.forEach(sub => {
                    const daysLeft = getRemainingDays(sub.endDate);
                    const { number, unit } = formatRemaining(daysLeft);
                    const urgentClass = daysLeft < 7 ? 'urgent' : '';
                    const pinnedClass = sub.pinned ? 'pinned' : '';
                    const pinIconClass = sub.pinned ? 'pinned' : '';
                    const start = new Date(sub.startDate);
                    const formattedDate = start.toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' }).replace(/ /g, ' ');
                    const priceStr = formatPrice(sub.price, sub.currency);

                    html += `
                        <div class="card ${pinnedClass}" data-id="${sub.id}">
                            <div class="duration-box ${urgentClass}">
                                <span class="number">${number}</span>
                                <span class="unit">${unit}</span>
                            </div>
                            <div class="info">
                                <h3>${sub.name}</h3>
                                <p class="date">Subscribed at ${formattedDate}</p>
                                <p class="price">${priceStr}</p>
                            </div>
                            <div class="icons">
                                <i class="fa-solid fa-pencil" data-action="edit" data-id="${sub.id}"></i>
                                <i class="fa-solid fa-thumbtack ${pinIconClass}" data-action="pin" data-id="${sub.id}"></i>
                            </div>
                            <div class="renew-button" data-action="renew" data-id="${sub.id}">ReNew</div>
                        </div>
                    `;
                });
                container.innerHTML = html;
            }

            const popup = document.getElementById('universalPopup');
            const popupTitle = document.getElementById('popupTitle');
            const popupBody = document.getElementById('popupBody');
            const popupFooter = document.getElementById('popupFooter');
            let popupMode = 'add';
            let currentEditId = null;

            function closeUniversalPopup() {
                popup.style.display = 'none';
                document.body.style.overflow = '';
            }

            function getTodayISO() {
                const d = new Date();
                const year = d.getFullYear();
                const month = String(d.getMonth() + 1).padStart(2, '0');
                const day = String(d.getDate()).padStart(2, '0');
                return `${year}-${month}-${day}`;
            }

            function buildForm(sub = null) {
                const name = sub ? sub.name : '';
                const start = sub ? sub.startDate : getTodayISO();
                const end = sub ? sub.endDate : getTodayISO();
                const currency = sub ? sub.currency : 'USD';
                const price = sub ? sub.price : '';
                const cycle = sub ? sub.cycle : 'monthly';

                const currencyOptions = Object.keys(currencyData).map(code => {
                    const selected = code === currency ? 'selected' : '';
                    return `<option value="${code}" ${selected}>${code} (${currencyData[code].symbol})</option>`;
                }).join('');

                return `
                    <div class="field-group">
                        <label>Name (max 15 characters)</label>
                        <input type="text" id="popupName" value="${name}" maxlength="15" placeholder="e.g. Spotify">
                    </div>
                    <div class="date-row">
                        <div class="date-col">
                            <label>Start date</label>
                            <input type="date" id="popupStart" value="${start}">
                        </div>
                        <div class="date-col">
                            <label>End date</label>
                            <input type="date" id="popupEnd" value="${end}" required>
                        </div>
                    </div>
                    <div class="field-group">
                        <label>Currency</label>
                        <select id="popupCurrency">
                            ${currencyOptions}
                        </select>
                    </div>
                    <div class="field-group">
                        <label>Price</label>
                        <input type="number" id="popupPrice" step="0.01" value="${price}" placeholder="0.00">
                    </div>
                    <div class="field-group">
                        <label>Billing cycle</label>
                        <select id="popupCycle">
                            <option value="monthly" ${cycle==='monthly'?'selected':''}>Monthly</option>
                            <option value="yearly" ${cycle==='yearly'?'selected':''}>Yearly</option>
                            <option value="weekly" ${cycle==='weekly'?'selected':''}>Weekly</option>
                        </select>
                    </div>
                `;
            }

            function showDeleteConfirmation(id) {
                popupMode = 'deleteConfirm';
                currentEditId = id;
                popupTitle.textContent = 'Confirm Delete';
                popupBody.innerHTML = '<p style="text-align: center; padding: 20px;">Are you sure you want to delete this subscription?</p>';
                popupFooter.innerHTML = `
                    <button class="btn btn-secondary" id="cancelDeleteBtn">No</button>
                    <button class="btn btn-danger" id="confirmDeleteBtn">Yes, Delete</button>
                `;
                popup.style.display = 'flex';
                document.body.style.overflow = 'hidden';

                document.getElementById('cancelDeleteBtn').addEventListener('click', closeUniversalPopup);
                document.getElementById('confirmDeleteBtn').addEventListener('click', () => {
                    if (currentEditId) {
                        subscriptions = subscriptions.filter(s => s.id !== currentEditId);
                        saveToStorage();
                        renderCards(document.getElementById('globalSearch')?.value || '');
                        window.showMessage('Subscription deleted');
                        closeUniversalPopup();
                    }
                });
            }

            function openPopup(mode, id = null) {
                popupMode = mode;
                currentEditId = id;
                let sub = null;
                if (mode === 'edit' && id) {
                    sub = subscriptions.find(s => s.id === id);
                }
                popupTitle.textContent = mode === 'add' ? 'Add Subscription' : 'Edit Subscription';
                popupBody.innerHTML = buildForm(sub);

                let footerHtml = '<button class="btn btn-secondary" id="cancelPopupBtn">Cancel</button>';
                if (mode === 'edit') {
                    footerHtml += '<button class="btn btn-danger" id="deletePopupBtn">Delete</button>';
                }
                footerHtml += '<button class="btn btn-primary" id="savePopupBtn">Save</button>';
                popupFooter.innerHTML = footerHtml;

                popup.style.display = 'flex';
                document.body.style.overflow = 'hidden';

                document.getElementById('cancelPopupBtn')?.addEventListener('click', closeUniversalPopup);
                if (mode === 'edit') {
                    document.getElementById('deletePopupBtn')?.addEventListener('click', () => {
                        closeUniversalPopup();
                        showDeleteConfirmation(currentEditId);
                    });
                }
                document.getElementById('savePopupBtn')?.addEventListener('click', savePopup);
            }

            function savePopup() {
                const name = document.getElementById('popupName')?.value.trim();
                const start = document.getElementById('popupStart')?.value;
                const end = document.getElementById('popupEnd')?.value;
                const currency = document.getElementById('popupCurrency')?.value;
                let price = parseFloat(document.getElementById('popupPrice')?.value);
                const cycle = document.getElementById('popupCycle')?.value;

                if (!name || !start || !end || isNaN(price) || price < 0) {
                    window.showMessage('Please fill all fields correctly');
                    return;
                }

                const info = currencyData[currency] || currencyData.USD;
                if (info.decimals === 0) {
                    price = Math.round(price);
                }

                if (popupMode === 'add') {
                    const newSub = {
                        id: 'id_' + Date.now() + Math.random(),
                        name,
                        startDate: start,
                        endDate: end,
                        price: price,
                        currency,
                        cycle,
                        pinned: false
                    };
                    subscriptions.push(newSub);
                    window.showMessage('Subscription added');
                } else if (popupMode === 'edit' && currentEditId) {
                    const index = subscriptions.findIndex(s => s.id === currentEditId);
                    if (index !== -1) {
                        subscriptions[index] = {
                            ...subscriptions[index],
                            name,
                            startDate: start,
                            endDate: end,
                            price: price,
                            currency,
                            cycle
                        };
                        window.showMessage('Subscription updated');
                    }
                }
                saveToStorage();
                renderCards(document.getElementById('globalSearch')?.value || '');
                closeUniversalPopup();
            }

            function renewSubscription(id) {
                const sub = subscriptions.find(s => s.id === id);
                if (!sub) return;

                const originalStart = new Date(sub.startDate);
                const originalEnd = new Date(sub.endDate);
                const durationMs = originalEnd - originalStart;

                const today = new Date();
                today.setHours(0,0,0,0);
                const newStart = today;
                const newEnd = new Date(newStart.getTime() + durationMs);

                const formatDate = (d) => {
                    const year = d.getFullYear();
                    const month = String(d.getMonth() + 1).padStart(2, '0');
                    const day = String(d.getDate()).padStart(2, '0');
                    return `${year}-${month}-${day}`;
                };

                sub.startDate = formatDate(newStart);
                sub.endDate = formatDate(newEnd);

                saveToStorage();
                renderCards(document.getElementById('globalSearch')?.value || '');
                window.showMessage('Subscription renewed');
            }

            document.addEventListener('click', (e) => {
                const target = e.target;
                const editIcon = target.closest('.fa-pencil');
                if (editIcon) {
                    const id = editIcon.dataset.id;
                    if (id) openPopup('edit', id);
                }
                const pinIcon = target.closest('.fa-thumbtack');
                if (pinIcon) {
                    const id = pinIcon.dataset.id;
                    if (id) {
                        const sub = subscriptions.find(s => s.id === id);
                        if (sub) {
                            sub.pinned = !sub.pinned;
                            saveToStorage();
                            renderCards(document.getElementById('globalSearch')?.value || '');
                        }
                    }
                }
                const renewBtn = target.closest('.renew-button');
                if (renewBtn) {
                    const id = renewBtn.dataset.id;
                    if (id) renewSubscription(id);
                }
            });

            document.getElementById('openAddPopupBtn')?.addEventListener('click', () => openPopup('add'));
            document.getElementById('closePopupBtn')?.addEventListener('click', closeUniversalPopup);

            const searchInput = document.getElementById('globalSearch');
            const clearBtn = document.getElementById('clearSearchBtn');
            const suggestionsContainer = document.getElementById('searchSuggestions');

            function toggleClearButton() {
                if (searchInput.value.trim().length > 0) {
                    clearBtn.classList.remove('hidden');
                } else {
                    clearBtn.classList.add('hidden');
                }
            }

            function clearSearch() {
                searchInput.value = '';
                renderCards('');
                toggleClearButton();
                suggestionsContainer.style.display = 'none';
            }

            clearBtn.addEventListener('click', clearSearch);

            function updateSuggestions() {
                const term = searchInput.value.trim().toLowerCase();
                if (!term) {
                    suggestionsContainer.style.display = 'none';
                    return;
                }
                const matches = subscriptions.filter(sub => sub.name.toLowerCase().includes(term)).slice(0,5);
                if (matches.length === 0) {
                    suggestionsContainer.innerHTML = `<div class="search-suggestion-item"><div class="suggestion-title">No results found</div><div class="suggestion-description">Try different keywords</div></div>`;
                } else {
                    suggestionsContainer.innerHTML = matches.map(sub => {
                        const priceStr = formatPrice(sub.price, sub.currency);
                        return `
                        <div class="search-suggestion-item" data-name="${sub.name}">
                            <div class="suggestion-title">${sub.name}</div>
                            <div class="suggestion-description">${priceStr} · ${sub.cycle}</div>
                            <div class="suggestion-category">Subscription</div>
                        </div>
                    `}).join('');
                }
                suggestionsContainer.style.display = 'block';
            }

            searchInput.addEventListener('input', () => {
                clearTimeout(window.searchTimeout);
                window.searchTimeout = setTimeout(updateSuggestions, 200);
                renderCards(searchInput.value);
                toggleClearButton();
            });

            searchInput.addEventListener('focus', () => {
                if (searchInput.value.trim()) updateSuggestions();
            });

            document.addEventListener('click', (e) => {
                if (!searchInput.contains(e.target) && !suggestionsContainer.contains(e.target) && !clearBtn.contains(e.target)) {
                    suggestionsContainer.style.display = 'none';
                }
            });

            suggestionsContainer.addEventListener('click', (e) => {
                const item = e.target.closest('.search-suggestion-item');
                if (item && item.dataset.name) {
                    searchInput.value = item.dataset.name;
                    renderCards(item.dataset.name);
                    toggleClearButton();
                    suggestionsContainer.style.display = 'none';
                }
            });

            searchInput.addEventListener('keypress', (e) => {
                if (e.key === 'Enter') {
                    suggestionsContainer.style.display = 'none';
                }
            });

            toggleClearButton();
            renderCards();
        })();
    </script>
</body>
</html>
