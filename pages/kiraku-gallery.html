<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gallery</title>
    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            margin: 0;
            padding: 20px;
            background: #111;
            color: #eee;
        }
        #login-container {
            text-align: center;
            margin-top: 100px;
        }
        #login-btn {
            background: #2AABEE;
            color: white;
            border: none;
            padding: 12px 28px;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
        }
        #error-msg {
            color: #ff6b6b;
            margin-top: 16px;
        }
        #gallery {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 12px;
            margin-top: 20px;
        }
        .card {
            background: #222;
            border-radius: 8px;
            overflow: hidden;
        }
        .card img,
        .card video {
            width: 100%;
            display: block;
        }
        .card audio {
            width: 100%;
        }
        .card a {
            color: #8af;
            text-decoration: none;
            padding: 8px;
            display: block;
        }
        #load-more {
            display: block;
            margin: 20px auto;
            padding: 10px 24px;
            background: #333;
            border: none;
            color: white;
            border-radius: 6px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div id="login-container">
        <h2>Login with Telegram</h2>
        <button id="login-btn">Login via Telegram</button>
        <div id="error-msg"></div>
    </div>
    <div id="gallery" style="display:none;"></div>
    <button id="load-more" style="display:none;">Load more</button>

    <script>
        const CLIENT_ID = "8611480465";
        const REDIRECT_URI = "https://kakoi-kiraku-home.vercel.app/pages/kiraku-gallery.html";
        const API_BASE = "/api/gallery";
        let token = localStorage.getItem("tg_token");
        let cursor = null;

        function generateState() {
            const state = Math.random().toString(36).substring(2, 15);
            localStorage.setItem("oauth_state", state);
            return state;
        }

        function showError(msg) {
            const el = document.getElementById("error-msg");
            el.textContent = msg;
            el.style.display = "block";
        }

        async function checkAuth() {
            const urlParams = new URLSearchParams(window.location.search);
            const code = urlParams.get("code");
            const state = urlParams.get("state");
            const savedState = localStorage.getItem("oauth_state");

            if (code && state && state === savedState) {
                localStorage.removeItem("oauth_state");
                window.history.replaceState({}, document.title, window.location.pathname);

                let resp;
                try {
                    resp = await fetch(API_BASE + "?action=auth", {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({ code, redirect_uri: REDIRECT_URI })
                    });
                } catch (e) {
                    alert("Network error during auth: " + e.message);
                    return;
                }

                let data;
                try {
                    data = await resp.json();
                } catch (e) {
                    alert("Auth endpoint did not return JSON. Status: " + resp.status + ". Check server logs.");
                    return;
                }

                if (data.token) {
                    localStorage.setItem("tg_token", data.token);
                    token = data.token;
                    showGallery();
                } else {
                    alert("Login failed. Server response: " + JSON.stringify(data, null, 2));
                    showError(data.error || "Unknown error. Are you a member of the channel?");
                    document.getElementById("login-container").style.display = "block";
                }
                return;
            }

            if (token) {
                let resp;
                try {
                    resp = await fetch(API_BASE + "?action=media&limit=1", {
                        headers: { "Authorization": "Bearer " + token }
                    });
                } catch (e) {
                    alert("Network error checking token: " + e.message);
                    return;
                }

                if (resp.status === 401) {
                    localStorage.removeItem("tg_token");
                    token = null;
                    document.getElementById("login-container").style.display = "block";
                    showError("Session expired. Please login again.");
                } else {
                    showGallery();
                }
            }
        }

        function showGallery() {
            document.getElementById("login-container").style.display = "none";
            document.getElementById("gallery").style.display = "grid";
            document.getElementById("load-more").style.display = "block";
            loadMedia();
            document.getElementById("load-more").addEventListener("click", loadMedia);
        }

        document.getElementById("login-btn").addEventListener("click", () => {
            const state = generateState();
            const authUrl = `https://oauth.telegram.org/auth?response_type=code&client_id=${CLIENT_ID}&redirect_uri=${encodeURIComponent(REDIRECT_URI)}&scope=openid&state=${state}`;
            window.location.href = authUrl;
        });

        async function loadMedia() {
            const params = new URLSearchParams({ action: "media", limit: "30" });
            if (cursor !== null) params.set("cursor", cursor);
            let resp;
            try {
                resp = await fetch(API_BASE + "?" + params.toString(), {
                    headers: { "Authorization": "Bearer " + token }
                });
            } catch (e) {
                alert("Network error loading media: " + e.message);
                return;
            }

            let data;
            try {
                data = await resp.json();
            } catch (e) {
                alert("Media endpoint returned non-JSON. Status: " + resp.status);
                return;
            }

            if (!data.items || data.items.length === 0) {
                document.getElementById("load-more").style.display = "none";
                return;
            }

            const gallery = document.getElementById("gallery");
            data.items.forEach(item => {
                const card = document.createElement("div");
                card.className = "card";
                const fileUrl = API_BASE + "?action=file&file_id=" + item.file_id;
                if (item.type === "photo") {
                    const img = document.createElement("img");
                    img.src = fileUrl;
                    img.loading = "lazy";
                    card.appendChild(img);
                } else if (item.type === "video") {
                    const video = document.createElement("video");
                    video.src = fileUrl;
                    video.controls = true;
                    card.appendChild(video);
                } else if (item.type === "audio" || item.type === "voice") {
                    const audio = document.createElement("audio");
                    audio.src = fileUrl;
                    audio.controls = true;
                    card.appendChild(audio);
                } else {
                    const a = document.createElement("a");
                    a.href = fileUrl;
                    a.target = "_blank";
                    a.textContent = "View file";
                    card.appendChild(a);
                }
                gallery.appendChild(card);
            });
            cursor = data.nextCursor;
            if (!cursor) {
                document.getElementById("load-more").style.display = "none";
            }
        }

        checkAuth();
    </script>
</body>
</html>
