<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gallery</title>
    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            margin: 0;
            padding: 20px;
            background: #111;
            color: #eee;
        }
        #login-container {
            text-align: center;
            margin-top: 100px;
        }
        #login-code {
            font-size: 24px;
            font-weight: bold;
            margin: 20px 0;
            padding: 12px;
            background: #333;
            border-radius: 6px;
            display: inline-block;
        }
        #login-instructions {
            margin: 10px 0 20px;
        }
        #gallery {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 12px;
            margin-top: 20px;
        }
        .card {
            background: #222;
            border-radius: 8px;
            overflow: hidden;
        }
        .card img,
        .card video {
            width: 100%;
            display: block;
        }
        .card audio {
            width: 100%;
        }
        .card a {
            color: #8af;
            text-decoration: none;
            padding: 8px;
            display: block;
        }
        #load-more {
            display: block;
            margin: 20px auto;
            padding: 10px 24px;
            background: #333;
            border: none;
            color: white;
            border-radius: 6px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div id="login-container">
        <h2>Login with Telegram</h2>
        <p id="login-instructions">Send this code to <strong>@purekira_bot</strong> in a private chat:</p>
        <div id="login-code"></div>
        <p>Waiting for confirmation...</p>
    </div>
    <div id="gallery" style="display:none;"></div>
    <button id="load-more" style="display:none;">Load more</button>

    <script>
        const API_BASE = "/api/gallery";
        let token = localStorage.getItem("tg_token");
        let cursor = null;

        async function checkToken() {
            if (!token) return false;
            const resp = await fetch(API_BASE + "?action=media&limit=1", {
                headers: { "Authorization": "Bearer " + token }
            });
            return resp.status === 200;
        }

        function generateLoginCode() {
            return Math.random().toString(36).substring(2, 10);
        }

        async function pollLogin(code) {
            const resp = await fetch(API_BASE + "?action=poll&code=" + code);
            if (resp.status === 404) return null;
            const data = await resp.json();
            return data.token || null;
        }

        async function init() {
            if (token && (await checkToken())) {
                showGallery();
                return;
            }
            document.getElementById("login-container").style.display = "block";
            const code = generateLoginCode();
            document.getElementById("login-code").textContent = code;

            const interval = setInterval(async () => {
                const newToken = await pollLogin(code);
                if (newToken) {
                    clearInterval(interval);
                    localStorage.setItem("tg_token", newToken);
                    token = newToken;
                    showGallery();
                }
            }, 2000);
        }

        function showGallery() {
            document.getElementById("login-container").style.display = "none";
            document.getElementById("gallery").style.display = "grid";
            document.getElementById("load-more").style.display = "block";
            loadMedia();
            document.getElementById("load-more").addEventListener("click", loadMedia);
        }

        async function loadMedia() {
            const params = new URLSearchParams({ action: "media", limit: "30" });
            if (cursor !== null) params.set("cursor", cursor);
            const resp = await fetch(API_BASE + "?" + params.toString(), {
                headers: { "Authorization": "Bearer " + token }
            });
            const data = await resp.json();
            if (!data.items || data.items.length === 0) {
                document.getElementById("load-more").style.display = "none";
                if (!cursor) {
                    gallery.innerHTML = "<p style='text-align:center;color:#888;'>No media yet.</p>";
                }
                return;
            }
            const gallery = document.getElementById("gallery");
            data.items.forEach(item => {
                const card = document.createElement("div");
                card.className = "card";
                const fileUrl = API_BASE + "?action=file&file_id=" + item.file_id;
                if (item.type === "photo") {
                    const img = document.createElement("img");
                    img.src = fileUrl;
                    img.loading = "lazy";
                    card.appendChild(img);
                } else if (item.type === "video") {
                    const video = document.createElement("video");
                    video.src = fileUrl;
                    video.controls = true;
                    card.appendChild(video);
                } else if (item.type === "audio" || item.type === "voice") {
                    const audio = document.createElement("audio");
                    audio.src = fileUrl;
                    audio.controls = true;
                    card.appendChild(audio);
                } else {
                    const a = document.createElement("a");
                    a.href = fileUrl;
                    a.target = "_blank";
                    a.textContent = "View file";
                    card.appendChild(a);
                }
                gallery.appendChild(card);
            });
            cursor = data.nextCursor;
            if (!cursor) {
                document.getElementById("load-more").style.display = "none";
            }
        }

        init();
    </script>
</body>
</html>
