<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>QR Scanner | lildavegoth</title>
    <meta name="color-scheme" content="dark">
    <script src="../cordova.js"></script>
    <script src="../protections.js"></script>
    <script src="../auth-check.js"></script>
    <script src="../notification.cssjs"></script>
    <link rel="stylesheet" href="../media.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
    <style>
        :root {
            --accent-color: #C1FC32;
            --accent-dark: #9bc726;
            --bg-black: #000000;
            --bg-dark: #1a1a1a;
            --bg-card: rgba(30, 30, 30, 0.7);
            --text-primary: #f5f5f7;
            --text-secondary: #a1a1a6;
            --radius-small: 12px;
            --radius-medium: 20px;
            --radius-large: 28px;
            --spacing-xs: 8px;
            --spacing-sm: 16px;
            --spacing-md: 24px;
            --spacing-lg: 32px;
            --spacing-xl: 48px;
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            background: var(--bg-black);
            color: var(--text-primary);
            min-height: 100vh;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: var(--spacing-md);
            position: relative;
            min-height: calc(100vh - 90px);
        }
        .video-wrapper {
            position: relative;
            background: var(--bg-card);
            aspect-ratio: 1 / 1;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 32px;
            overflow: hidden;
            margin-bottom: 20px;
            cursor: pointer;
            transition: box-shadow 0.2s ease;
        }
        .video-wrapper::after {
            content: "\f030";
            font-family: "Font Awesome 6 Free";
            font-weight: 900;
            font-size: 3rem;
            color: rgba(193, 252, 50, 0.5);
            position: absolute;
            z-index: 0;
        }
        .video-wrapper.active-camera::after {
            display: none;
        }
        video, canvas, #previewImage {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        #previewImage {
            display: none;
            z-index: 1;
        }
        canvas {
            z-index: 2;
        }
        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 3;
            border-radius: 32px;
        }
        .controls {
            display: flex;
            gap: 12px;
            justify-content: center;
            margin-bottom: 20px;
        }
        .controls button {
            background: rgba(193, 252, 50, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: var(--accent-color);
            font-size: 1.4rem;
            padding: 12px;
            border-radius: 50px;
            cursor: pointer;
            transition: 0.2s;
            width: 64px;
            height: 64px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .controls button:active {
            transform: scale(0.92);
            background: rgba(193, 252, 50, 0.2);
        }
        #resultPanel.visible {
            display: block;
        }
        .result-value {
            font-size: 1rem;
            background: var(--bg-card);
            padding: 14px;
            border-radius: 16px;
            line-height: 1.4;
        }
        .result-domain {
            color: white;
            font-weight: 600;
            display: block;
            margin-bottom: 6px;
        }
        .result-url {
            color: var(--accent-color);
            font-size: 0.9rem;
            opacity: 0.9;
            word-break: break-all;
        }
        .popup-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 1.0);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 99999999;
            animation: fadeIn 0.3s ease;
        }
        .popup-content {
            background: var(--bg-card);
            border-radius: var(--radius-large);
            width: 90%;
            max-width: 500px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            max-height: 70vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
        }
        .popup-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: var(--spacing-md) var(--spacing-md) 8px var(--spacing-md);
        }
        .popup-header h2 {
            font-size: 1.5rem;
            font-weight: 600;
        }
        .close-popup {
            background: transparent;
            border: none;
            color: var(--text-secondary);
            font-size: 1.2rem;
            cursor: pointer;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            position: absolute;
            top: 16px;
            right: 16px;
            z-index: 10;
        }
        .popup-search-container {
            position: relative;
            padding: 8px 16px 8px 16px;
        }
        .popup-search-container input {
            width: 100%;
            padding: 12px 44px 12px 16px;
            border-radius: var(--radius-medium);
            background: #252525;
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: var(--text-primary);
            font-size: 0.95rem;
            outline: none;
        }
        .popup-search-icon {
            position: absolute;
            right: 36px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--accent-color);
            pointer-events: none;
        }
        .popup-suggestions {
            background: #1e1e1e;
            border-radius: var(--radius-medium);
            border: 1px solid rgba(255, 255, 255, 0.1);
            margin: 0 16px 8px 16px;
            max-height: 30vh;
            min-height: 0;
            overflow-y: auto;
            display: none;
            flex-shrink: 0;
        }
        .suggestion-item {
            padding: 12px 16px;
            cursor: pointer;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            transition: background 0.2s;
            background: #252525;
        }
        .suggestion-item:hover {
            background: #333;
        }
        .suggestion-title {
            font-weight: 500;
            margin-bottom: 4px;
            color: var(--accent-color);
        }
        .suggestion-url {
            font-size: 0.8rem;
            color: var(--text-secondary);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .history-list {
            flex: 1;
            padding: 8px 16px 0 16px;
            overflow-y: auto;
        }
        .history-item {
            background: #252525;
            border-radius: var(--radius-medium);
            padding: var(--spacing-sm);
            margin-bottom: 10px;
            border: 1px solid rgba(255,255,255,0.05);
            transition: all 0.2s;
        }
        .history-item:hover {
            background: rgba(193, 252, 50, 0.08);
            border-color: rgba(193, 252, 50, 0.2);
        }
        .history-title {
            font-size: 1rem;
            font-weight: 600;
            margin-bottom: 4px;
            color: var(--accent-color);
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .history-url {
            font-size: 0.85rem;
            color: var(--text-secondary);
            word-break: break-all;
            margin-bottom: 8px;
        }
        .history-date {
            font-size: 0.7rem;
            color: #888;
            margin-bottom: 10px;
        }
        .history-actions {
            display: flex;
            gap: 10px;
        }
        .history-actions button {
            background: rgba(193, 252, 50, 0.1);
            border: none;
            padding: 6px 14px;
            font-size: 0.8rem;
            border-radius: 30px;
            color: var(--accent-color);
            cursor: pointer;
        }
        .clear-history-wrapper {
            padding: 12px 16px 16px 16px;
        }
        .clear-history {
            background: rgba(239, 68, 68, 0.15);
            color: #f87171;
            width: 100%;
            padding: 12px;
            border-radius: var(--radius-medium);
            border: none;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.95rem;
        }
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        @media (max-width: 480px) {
            .controls button {
                width: 56px;
                height: 56px;
                font-size: 1.3rem;
            }
            body { padding: 12px; }
        }
    </style>
</head>
<body>
    <div class="app-main">
        <a href="../index.html" class="back-link fade-in" onclick="window.location.hash='';">
            <i class="fas fa-arrow-left"></i> Back to Home
        </a>
        <app-header class="fade-in">
            <div>
                <h1 class="username">QR Scanner</h1>
                <p class="tagline">QR scanning made ridiculously easy — and totally free</p>
            </div>
        </app-header>
        <div class="video-wrapper" id="videoWrapper">
            <video id="video" autoplay playsinline muted></video>
            <img id="previewImage" alt="Uploaded preview">
            <canvas id="canvas"></canvas>
            <div class="overlay"></div>
        </div>
        <div class="controls">
            <button id="resetBtn" title="Reset Scanner">
                <i class="fas fa-undo-alt"></i>
            </button>
            <button id="copyBtn" title="Copy URL">
                <i class="fas fa-copy"></i>
            </button>
            <button id="uploadBtn" title="Upload Image">
                <i class="fas fa-image"></i>
            </button>
            <button id="historyBtn" title="History">
                <i class="fas fa-history"></i>
            </button>
        </div>
        <div id="resultPanel">
            <div class="result-value" id="result">Start scan by click on Camera icon above or import image by click on Picture icon</div>
        </div>
        <footer>
            <div class="social-links">
                <a href="https://twitter.com/lildavegoth"><span class="icon icon-twitter"></span></a>
                <a href="https://instagram.com/dave_goth"><span class="icon icon-instagram"></span></a>
            </div>
            <p>© 2026 lildavegoth | QR Scanner</p>
            <p style="margin-top: 8px; font-size: 0.8rem; color: #666;">
                Conveys the Idea of a Protected and Inspiring Space for Creative Expression.
            </p>
        </footer>
    </div>
    <input type="file" id="imageUpload" accept="image/*" style="display: none;">
    <div id="universalPopup" class="popup-overlay" style="display: none;">
        <div class="popup-content">
            <button class="close-popup" onclick="closeUniversalPopup()">
                <i class="fas fa-times"></i>
            </button>
            <div class="popup-header">
                <h2 id="popupTitle">Scan History</h2>
            </div>
            <div id="popupContent" style="display: flex; flex-direction: column; flex: 1; overflow: hidden;"></div>
        </div>
    </div>
    <script>
        (function(){
            const video = document.getElementById('video');
            const canvas = document.getElementById('canvas');
            const ctx = canvas.getContext('2d');
            const previewImage = document.getElementById('previewImage');
            const videoWrapper = document.getElementById('videoWrapper');
            const resetBtn = document.getElementById('resetBtn');
            const copyBtn = document.getElementById('copyBtn');
            const historyBtn = document.getElementById('historyBtn');
            const uploadBtn = document.getElementById('uploadBtn');
            const imageUpload = document.getElementById('imageUpload');
            const resultDiv = document.getElementById('result');
            const resultPanel = document.getElementById('resultPanel');
            let stream = null;
            let scanningActive = false;
            let lastScannedCode = '';
            let lastScannedRawUrl = '';
            let scanTimer = null;
            const isCordova = typeof cordova !== 'undefined';
            let cameraPreviewAvailable = false;
            if (isCordova && typeof CameraPreview !== 'undefined') {
                cameraPreviewAvailable = true;
            }
            if (!cameraPreviewAvailable) {
                videoWrapper.style.display = 'none';
            }
            function extractDomain(url) {
                try {
                    const hostname = new URL(url).hostname;
                    return hostname.replace('www.', '');
                } catch(e) {
                    return url.length > 50 ? url.substring(0, 47) + '...' : url;
                }
            }
            function saveToHistory(code) {
                if (!code) return;
                let history = JSON.parse(localStorage.getItem('scannedResults') || '[]');
                const domain = extractDomain(code);
                const newEntry = {
                    id: Date.now(),
                    url: code,
                    title: domain,
                    date: new Date().toLocaleDateString()
                };
                history.unshift(newEntry);
                if (history.length > 50) history = history.slice(0, 50);
                localStorage.setItem('scannedResults', JSON.stringify(history));
            }
            function updateResultText(code) {
                if (!code) return;
                lastScannedRawUrl = code;
                const domain = extractDomain(code);
                resultDiv.innerHTML = `
                    <span class="result-domain"><i class="fas fa-link" style="margin-right: 6px;"></i>${domain}</span>
                    <span class="result-url">${code}</span>
                `;
                resultPanel.classList.add('visible');
            }
            function handleScannedCode(code) {
                if (code === lastScannedCode) return;
                lastScannedCode = code;
                updateResultText(code);
                saveToHistory(code);
            }
            function resetScannerUI() {
                scanningActive = false;
                if (scanTimer) {
                    clearTimeout(scanTimer);
                    scanTimer = null;
                }
                if (cameraPreviewAvailable) {
                    try {
                        CameraPreview.stopCamera();
                    } catch (e) {}
                } else {
                    if (stream) {
                        stream.getTracks().forEach(track => track.stop());
                        stream = null;
                    }
                    video.srcObject = null;
                }
                video.style.display = 'block';
                previewImage.style.display = 'none';
                videoWrapper.classList.remove('active-camera');
                resultDiv.innerHTML = 'Start scan by click on Camera icon above or import image by click on Picture icon';
                resultPanel.classList.remove('visible');
                lastScannedCode = '';
                lastScannedRawUrl = '';
            }
            function stopScanner() {
                resetScannerUI();
            }
            function captureFrameFromPreview() {
                if (!scanningActive) return;
                CameraPreview.takePicture({ quality: 50, width: 640, height: 640 }, function(base64Data) {
                    const img = new Image();
                    img.onload = function() {
                        canvas.width = img.width;
                        canvas.height = img.height;
                        ctx.drawImage(img, 0, 0);
                        const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
                        const code = jsQR(imageData.data, canvas.width, canvas.height);
                        if (code) {
                            handleScannedCode(code.data);
                        }
                        if (scanningActive) {
                            scanTimer = setTimeout(captureFrameFromPreview, 300);
                        }
                    };
                    img.src = 'data:image/jpeg;base64,' + base64Data;
                }, function(err) {
                    window.showMessage('Camera capture failed');
                    stopScanner();
                });
            }
            function startCameraPreview() {
                const options = {
                    x: 0,
                    y: 0,
                    width: videoWrapper.clientWidth,
                    height: videoWrapper.clientHeight,
                    camera: CameraPreview.CAMERA_DIRECTION.BACK,
                    toBack: false,
                    tapPhoto: false,
                    previewDrag: false
                };
                CameraPreview.startCamera(options, function() {
                    videoWrapper.classList.add('active-camera');
                    scanningActive = true;
                    captureFrameFromPreview();
                }, function(err) {
                    window.showMessage('Camera error');
                });
            }
            function requestCameraPermission() {
                return new Promise(function(resolve, reject) {
                    if (!isCordova || !cordova.plugins || !cordova.plugins.permissions) {
                        resolve();
                        return;
                    }
                    const permissions = cordova.plugins.permissions;
                    permissions.checkPermission(permissions.CAMERA, function(status) {
                        if (status.hasPermission) {
                            resolve();
                        } else {
                            permissions.requestPermission(permissions.CAMERA, resolve, reject);
                        }
                    }, reject);
                });
            }
            function startWebScanner() {
                stopScanner();
                previewImage.style.display = 'none';
                video.style.display = 'block';
                navigator.mediaDevices.getUserMedia({
                    video: { facingMode: { exact: "environment" } }
                }).catch(function() {
                    return navigator.mediaDevices.getUserMedia({ video: true });
                }).then(function(s) {
                    stream = s;
                    video.srcObject = stream;
                    return video.play();
                }).then(function() {
                    canvas.width = video.videoWidth;
                    canvas.height = video.videoHeight;
                    scanningActive = true;
                    videoWrapper.classList.add('active-camera');
                    function scanFrame() {
                        if (!scanningActive) return;
                        if (video.readyState === video.HAVE_ENOUGH_DATA) {
                            if (canvas.width !== video.videoWidth || canvas.height !== video.videoHeight) {
                                canvas.width = video.videoWidth;
                                canvas.height = video.videoHeight;
                            }
                            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
                            const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
                            const code = jsQR(imageData.data, imageData.width, imageData.height, { inversionAttempts: "dontInvert" });
                            if (code) {
                                handleScannedCode(code.data);
                            }
                        }
                        requestAnimationFrame(scanFrame);
                    }
                    requestAnimationFrame(scanFrame);
                }).catch(function() {
                    window.showMessage('Camera access denied');
                    videoWrapper.classList.remove('active-camera');
                });
            }
            async function startScanner() {
                if (!cameraPreviewAvailable) {
                    return;
                }
                await stopScanner();
                try {
                    await requestCameraPermission();
                    startCameraPreview();
                } catch (e) {
                    window.showMessage('Camera permission required');
                }
            }
            function scanImageFromFile(file) {
                if (!file) return;
                if (scanningActive) {
                    stopScanner();
                }
                const reader = new FileReader();
                reader.onload = function(e) {
                    const img = new Image();
                    img.onload = function() {
                        previewImage.src = e.target.result;
                        previewImage.style.display = 'block';
                        video.style.display = 'none';
                        canvas.width = img.width;
                        canvas.height = img.height;
                        ctx.drawImage(img, 0, 0);
                        const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
                        const code = jsQR(imageData.data, imageData.width, imageData.height);
                        if (code) {
                            handleScannedCode(code.data);
                        } else {
                            window.showMessage('No QR code found');
                        }
                        videoWrapper.classList.remove('active-camera');
                        if (cameraPreviewAvailable) {
                            videoWrapper.style.display = 'flex';
                        }
                    };
                    img.src = e.target.result;
                };
                reader.readAsDataURL(file);
            }
            if (cameraPreviewAvailable) {
                videoWrapper.addEventListener('click', function() {
                    if (scanningActive) {
                        stopScanner();
                    } else {
                        startScanner();
                    }
                });
            }
            resetBtn.addEventListener('click', function() {
                stopScanner();
            });
            copyBtn.addEventListener('click', function() {
                if (lastScannedRawUrl) {
                    const textarea = document.createElement("textarea");
                    textarea.value = lastScannedRawUrl;
                    textarea.style.position = "fixed";
                    textarea.style.left = "-9999px";
                    document.body.appendChild(textarea);
                    textarea.select();
                    document.execCommand("copy");
                    document.body.removeChild(textarea);
                    const originalIcon = copyBtn.innerHTML;
                    copyBtn.innerHTML = '<i class="fas fa-check"></i>';
                    setTimeout(function() { copyBtn.innerHTML = originalIcon; }, 1500);
                } else {
                    window.showMessage('Nothing to copy');
                }
            });
            resultPanel.addEventListener('click', function() {
                if (lastScannedRawUrl && (lastScannedRawUrl.startsWith('http://') || lastScannedRawUrl.startsWith('https://'))) {
                    window.open(lastScannedRawUrl, '_blank');
                } else if (lastScannedRawUrl) {
                    window.showMessage('Not a valid URL');
                }
            });
            uploadBtn.addEventListener('click', function() {
                imageUpload.click();
            });
            imageUpload.addEventListener('change', function(e) {
                const file = e.target.files[0];
                if (file) {
                    scanImageFromFile(file);
                }
                imageUpload.value = '';
            });
            function escapeHtml(str) {
                return str.replace(/[&<>]/g, function(m) {
                    if (m === '&') return '&amp;';
                    if (m === '<') return '&lt;';
                    if (m === '>') return '&gt;';
                    return m;
                });
            }
            function renderHistoryContent(filterTerm) {
                filterTerm = filterTerm || '';
                const contentDiv = document.getElementById('popupContent');
                const history = JSON.parse(localStorage.getItem('scannedResults') || '[]');
                const filtered = filterTerm.trim() ? history.filter(function(item) {
                    return item.url.toLowerCase().includes(filterTerm.toLowerCase()) || item.title.toLowerCase().includes(filterTerm.toLowerCase());
                }) : history;
                let html = '';
                html += '<div class="popup-search-container">';
                html += '<input type="text" id="popupSearchInput" placeholder="Search by URL or domain..." value="' + escapeHtml(filterTerm) + '">';
                html += '<div class="popup-search-icon"><i class="fas fa-search"></i></div>';
                html += '</div>';
                html += '<div class="popup-suggestions" id="popupSuggestions"></div>';
                html += '<div class="history-list" id="historyListContainer">';
                if (filtered.length === 0) {
                    html += '<div style="text-align: center; padding: 20px; color: #aaa;">No scans found.</div>';
                } else {
                    filtered.forEach(function(item) {
                        html += '<div class="history-item" data-url="' + escapeHtml(item.url) + '">';
                        html += '<div class="history-title"><i class="fas fa-link"></i> ' + escapeHtml(item.title) + '</div>';
                        html += '<div class="history-url">' + escapeHtml(item.url) + '</div>';
                        html += '<div class="history-date"><i class="far fa-calendar-alt"></i> ' + escapeHtml(item.date) + '</div>';
                        html += '<div class="history-actions">';
                        html += '<button class="use-history" data-url="' + escapeHtml(item.url) + '">Use</button>';
                        html += '<button class="delete-history" data-id="' + item.id + '">Delete</button>';
                        html += '</div></div>';
                    });
                }
                html += '</div>';
                html += '<div class="clear-history-wrapper"><button class="clear-history"><i class="fas fa-trash-alt"></i> Clear All</button></div>';
                contentDiv.innerHTML = html;
                const searchInput = document.getElementById('popupSearchInput');
                const suggestionsDiv = document.getElementById('popupSuggestions');
                function updateSuggestions(term) {
                    if (!term.trim()) {
                        suggestionsDiv.style.display = 'none';
                        return;
                    }
                    const allHistory = JSON.parse(localStorage.getItem('scannedResults') || '[]');
                    const matches = allHistory.filter(function(item) {
                        return item.url.toLowerCase().includes(term.toLowerCase()) || item.title.toLowerCase().includes(term.toLowerCase());
                    }).slice(0, 5);
                    if (matches.length === 0) {
                        suggestionsDiv.innerHTML = '<div class="suggestion-item"><div class="suggestion-title">No matches</div></div>';
                    } else {
                        let sugHtml = '';
                        matches.forEach(function(item) {
                            sugHtml += '<div class="suggestion-item" data-url="' + escapeHtml(item.url) + '">';
                            sugHtml += '<div class="suggestion-title">' + escapeHtml(item.title) + '</div>';
                            sugHtml += '<div class="suggestion-url">' + escapeHtml(item.url) + '</div>';
                            sugHtml += '</div>';
                        });
                        suggestionsDiv.innerHTML = sugHtml;
                    }
                    suggestionsDiv.style.display = 'block';
                }
                searchInput.addEventListener('input', function() { updateSuggestions(searchInput.value); });
                searchInput.addEventListener('focus', function() { if (searchInput.value.trim()) updateSuggestions(searchInput.value); });
                searchInput.addEventListener('keypress', function(e) { if (e.key === 'Enter') renderHistoryContent(searchInput.value); });
                document.addEventListener('click', function closeSugg(e) {
                    if (!searchInput.contains(e.target) && !suggestionsDiv.contains(e.target)) {
                        suggestionsDiv.style.display = 'none';
                    }
                }, { once: false });
                suggestionsDiv.addEventListener('click', function(e) {
                    const item = e.target.closest('.suggestion-item');
                    if (item) {
                        const url = item.getAttribute('data-url');
                        if (url) {
                            updateResultText(url);
                            lastScannedCode = url;
                            closeUniversalPopup();
                        }
                    }
                });
                contentDiv.querySelectorAll('.use-history').forEach(function(btn) {
                    btn.addEventListener('click', function() {
                        const url = btn.getAttribute('data-url');
                        updateResultText(url);
                        lastScannedCode = url;
                        closeUniversalPopup();
                    });
                });
                contentDiv.querySelectorAll('.delete-history').forEach(function(btn) {
                    btn.addEventListener('click', function() {
                        const id = parseInt(btn.getAttribute('data-id'));
                        let history = JSON.parse(localStorage.getItem('scannedResults') || '[]');
                        history = history.filter(function(item) { return item.id !== id; });
                        localStorage.setItem('scannedResults', JSON.stringify(history));
                        renderHistoryContent(searchInput.value);
                        window.showMessage('Deleted successfully');
                    });
                });
                const clearBtn = contentDiv.querySelector('.clear-history');
                if (clearBtn) {
                    clearBtn.addEventListener('click', function() {
                        localStorage.removeItem('scannedResults');
                        renderHistoryContent('');
                    });
                }
            }
            function showHistoryPopup() {
                document.getElementById('popupTitle').textContent = 'Scan History';
                renderHistoryContent('');
                document.getElementById('universalPopup').style.display = 'flex';
            }
            window.closeUniversalPopup = function() {
                document.getElementById('universalPopup').style.display = 'none';
            };
            historyBtn.addEventListener('click', showHistoryPopup);
            window.addEventListener('beforeunload', function() {
                if (stream) {
                    stream.getTracks().forEach(function(track) { track.stop(); });
                }
                if (cameraPreviewAvailable && scanningActive) {
                    try {
                        CameraPreview.stopCamera();
                    } catch (e) {}
                }
            });
        })();
    </script>
</body>
</html>
