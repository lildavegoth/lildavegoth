<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="dark">
    <title>CSS Icons Displayer | lildavegoth</title>
    <script src="../protections.js"></script>
    <script src="../notification.cssjs"></script>
    <link rel="stylesheet" href="../media.css">
    <script src="icon-updater.js"></script>
    <style>
        :root {
            --accent-color: #C1FC32;
            --accent-dark: #9bc726;
            --bg-black: #000000;
            --bg-dark: #1a1a1a;
            --bg-card: #1e1e1e;
            --text-primary: #f5f5f7;
            --text-secondary: #a1a1a6;
            --radius-small: 12px;
            --radius-medium: 20px;
            --radius-large: 28px;
            --spacing-xs: 8px;
            --spacing-sm: 16px;
            --spacing-md: 24px;
            --spacing-lg: 32px;
            --spacing-xl: 48px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-black);
            color: var(--text-primary);
            min-height: 100vh;
            overflow-x: hidden;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: var(--spacing-md);
            position: relative;
            min-height: calc(100vh - 90px);
        }

        h1 {
            font-weight: 600;
            font-size: 2.4rem;
            letter-spacing: -0.02em;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 14px;
            flex-wrap: wrap;
        }

        h1 i {
            color: var(--accent-color);
        }

        .subhead {
            color: var(--text-secondary);
            margin-bottom: 30px;
            font-weight: 400;
            border-left: 5px solid var(--accent-color);
            padding-left: 20px;
            font-size: 1.1rem;
        }

        .toolbar {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 28px;
            flex-wrap: wrap;
        }

        .search-box {
            position: relative;
            flex: 1;
            min-width: 200px;
        }

        .search-box i {
            position: absolute;
            left: 18px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--accent-color);
            font-size: 1rem;
            pointer-events: none;
        }

        .search-box input {
            width: 100%;
            padding: 14px 18px 14px 48px;
            font-size: 1rem;
            background: var(--bg-dark);
            border: 1.5px solid #2a2a2a;
            border-radius: 60px;
            color: var(--text-primary);
            transition: 0.15s;
            outline: none;
        }

        .search-box input:focus {
            border-color: var(--accent-color);
        }

        .selector-btn {
            background: var(--bg-dark);
            border: 1.5px solid #2a2a2a;
            color: var(--text-primary);
            padding: 12px 24px;
            border-radius: 60px;
            font-size: 1rem;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            transition: all 0.15s;
            white-space: nowrap;
        }

        .selector-btn i {
            color: var(--accent-color);
        }

        .selector-btn:hover {
            border-color: var(--accent-color);
            background: #222;
        }

        .library-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 16px;
            flex-wrap: wrap;
            gap: 16px;
        }

        .library-title h2 {
            font-weight: 500;
            font-size: 1.8rem;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .counter-chip {
            background: var(--bg-dark);
            padding: 8px 22px;
            border-radius: 60px;
            font-weight: 500;
            color: var(--text-primary);
            border: 1px solid #2a2a2a;
            font-size: 0.95rem;
        }

        .counter-chip i {
            margin-right: 8px;
            color: var(--accent-color);
        }

        .usage-badge {
            background: rgba(193, 252, 50, 0.1);
            border-radius: 40px;
            padding: 6px 18px;
            font-size: 0.9rem;
            color: var(--accent-color);
            border: 1px solid rgba(193, 252, 50, 0.3);
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .categories-wrapper {
            margin-bottom: 20px;
            overflow-x: auto;
            overflow-y: hidden;
            white-space: nowrap;
            -webkit-overflow-scrolling: touch;
            scrollbar-width: thin;
            scrollbar-color: var(--accent-color) var(--bg-dark);
        }

        .categories-wrapper::-webkit-scrollbar {
            height: 4px;
        }

        .categories-wrapper::-webkit-scrollbar-track {
            background: var(--bg-dark);
            border-radius: 10px;
        }

        .categories-wrapper::-webkit-scrollbar-thumb {
            background: var(--accent-color);
            border-radius: 10px;
        }

        .categories-pills {
            display: flex;
            gap: 8px;
            padding-bottom: 4px;
        }
        
        .categories-wrapper {
            scrollbar-width: none;
        }

        .categories-wrapper::-webkit-scrollbar {
            display: none;
        }

        .category-pill {
            background: var(--bg-dark);
            border: 1px solid #2a2a2a;
            color: var(--text-secondary);
            padding: 8px 18px;
            border-radius: 40px;
            font-size: 0.9rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.15s;
            white-space: nowrap;
            flex-shrink: 0;
        }

        .category-pill:hover {
            border-color: var(--accent-color);
            color: var(--text-primary);
        }

        .category-pill.active {
            background: var(--accent-color);
            border-color: var(--accent-color);
            color: var(--bg-black);
        }

        .icon-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
            gap: 14px;
        }

        .icon-card {
            background: var(--bg-card);
            border-radius: var(--radius-medium);
            padding: 18px 6px 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.05);
            transition: all 0.18s;
            cursor: pointer;
            user-select: none;
        }

        .icon-card:hover {
            border-color: var(--accent-color);
            background: #252525;
            transform: translateY(-4px);
        }

        .icon-card i {
            font-size: 2.5rem;
            margin-bottom: 12px;
            color: var(--text-primary);
            transition: color 0.1s;
        }

        .icon-card:hover i {
            color: var(--accent-color);
        }

        .icon-card:active i {
            color: var(--accent-dark);
            transform: scale(0.98);
        }

        .icon-name {
            font-size: 0.75rem;
            font-weight: 450;
            background: rgba(255, 255, 255, 0.05);
            padding: 5px 10px;
            border-radius: 40px;
            color: var(--text-secondary);
            font-family: 'SF Mono', Menlo, monospace;
            max-width: 100%;
            word-break: break-word;
        }

        .hidden-card {
            display: none !important;
        }

        .loading-placeholder {
            padding: 40px 24px;
            background: var(--bg-dark);
            border-radius: var(--radius-large);
            text-align: center;
            color: var(--text-secondary);
            font-size: 1.2rem;
            border: 1px dashed #3a3a3a;
        }

        .error-block {
            background: rgba(255, 80, 80, 0.1);
            border: 1px solid rgba(255, 80, 80, 0.3);
            padding: 20px 28px;
            border-radius: 48px;
            color: #ff7b7b;
            font-weight: 500;
        }

        .popup-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 1.0);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 99999999;
            animation: fadeIn 0.3s ease;
        }

        .popup-content {
            background: var(--bg-card);
            border-radius: var(--radius-large);
            width: 90%;
            max-width: 500px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            max-height: 70vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .popup-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: var(--spacing-md);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .popup-header h2 {
            font-size: 1.5rem;
            font-weight: 600;
        }

        .close-popup {
            background: transparent;
            border: none;
            color: var(--text-secondary);
            font-size: 1.2rem;
            cursor: pointer;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s;
        }

        .close-popup:hover {
            background: rgba(255,255,255,0.05);
        }

        .tools-grid {
            padding: var(--spacing-md);
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .tool-option {
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: var(--radius-medium);
            padding: 18px 20px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .tool-option:hover {
            background: rgba(193, 252, 50, 0.08);
            border-color: var(--accent-color);
        }

        .tool-option h3 {
            font-size: 1.2rem;
            margin-bottom: 6px;
            color: var(--accent-color);
        }

        .tool-option p {
            color: var(--text-secondary);
            font-size: 0.9rem;
        }
        
        .tool-option {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .tool-option-content {
            flex: 1;
            cursor: pointer;
        }

        .external-link-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background-color: var(--accent-color);
            color: var(--bg-black);
            text-decoration: none;
            transition: transform 0.15s;
            flex-shrink: 0;
            margin-left: 12px;
        }

        .external-link-btn:hover {
            transform: scale(1.05);
            background-color: var(--accent-dark);
        }

        .external-link-btn i {
            font-size: 1.1rem;
            color: var(--bg-black);
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .spin {
            animation: spin 1.2s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <a href="../index.html" class="back-link fade-in" onclick="window.location.hash='';">
            <i class="fas fa-arrow-left"></i> Back to Home
        </a>
        
        <app-header class="fade-in">
            <div>
                <h1 class="username">CSS Icons Displayer</h1>
                <p class="tagline">Font Awesome + Bootstrap Icons displayer with functionality to copy css codes when clicked</p>
            </div>
        </app-header>

        <div class="toolbar">
            <div class="search-box">
                <i class="fas fa-search"></i>
                <input type="text" id="globalSearchInput" placeholder="Filter icons..." autocomplete="off">
            </div>
            <button class="selector-btn" id="selectorBtn">
                <i class="fas fa-chevron-circle-down"></i>
                <span id="currentLibLabel">Font Awesome</span>
            </button>
        </div>

        <div id="libraryContainer"></div>

        <footer style="margin-bottom: 100px;">
            <div class="social-links">
                <a href="https://twitter.com/lildavegoth"><span class="icon icon-twitter"></span></a>
                <a href="https://instagram.com/dave_goth"><span class="icon icon-instagram"></span></a>
            </div>
            <p>© 2026 lildavegoth | CSS Icons Displayer</p>
            <p style="margin-top: 8px; font-size: 0.8rem; color: #666;">
                Conveys the Idea of a Protected and Inspiring Space for Creative Expression.
            </p>
        </footer>
        
    </div>

    <div id="universalPopup" class="popup-overlay" style="display: none;">
        <div class="popup-content">
            <div class="popup-header">
                <h2 id="popupTitle">Select Icon Library</h2>
                <button class="close-popup" onclick="closeUniversalPopup()">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            <div class="tools-grid" id="popupContent"></div>
        </div>
    </div>

    <script>
        (function(){
            const FA_CSS_URL = "https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css";
            const BI_CSS_URL = "https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css";
        
            let activeLibrary = 'fa';
            let faIconsData = [];
            let biIconsData = [];
            let faCardMap = new Map();
            let biCardMap = new Map();
            let libraryContainer = document.getElementById('libraryContainer');
            let searchInput = document.getElementById('globalSearchInput');
            let currentLibLabel = document.getElementById('currentLibLabel');
            let currentCategory = null;
        
            const faUsageText = 'fas / far / fab';
            const biUsageText = 'bi bi-*';
        
            function copyTextToClipboard(text) {
                if (navigator.clipboard && navigator.clipboard.writeText) {
                    navigator.clipboard.writeText(text).then(() => {
                        if (typeof window.showMessage === 'function') window.showMessage('Copied to clipboard');
                    }).catch(() => {
                        fallbackCopy(text);
                    });
                } else {
                    fallbackCopy(text);
                }
            }
        
            function fallbackCopy(text) {
                const textArea = document.createElement("textarea");
                textArea.value = text;
                textArea.style.position = "fixed";
                textArea.style.top = "0";
                textArea.style.left = "0";
                textArea.style.opacity = "0";
                document.body.appendChild(textArea);
                textArea.focus();
                textArea.select();
                try {
                    document.execCommand('copy');
                    if (typeof window.showMessage === 'function') window.showMessage('Copied to clipboard');
                } catch (err) {
                    if (typeof window.showMessage === 'function') window.showMessage('Copy failed');
                }
                document.body.removeChild(textArea);
            }
        
            function createIconCard(item) {
                const card = document.createElement('div');
                card.className = 'icon-card';
                card.dataset.iconName = item.name;
                card.dataset.category = item.category;
                const i = document.createElement('i');
                i.className = item.displayClass;
                const nameSpan = document.createElement('span');
                nameSpan.className = 'icon-name';
                nameSpan.textContent = item.name;
                card.appendChild(i);
                card.appendChild(nameSpan);
                card.addEventListener('click', () => {
                    copyTextToClipboard(item.copyValue);
                });
                return card;
            }
        
            function getCategoriesFromData(data) {
                const cats = new Set();
                data.forEach(item => cats.add(item.category));
                const sorted = Array.from(cats).sort((a,b) => {
                    if (a === 'Other') return 1;
                    if (b === 'Other') return -1;
                    return a.localeCompare(b);
                });
                return sorted;
            }
        
            function buildCategoriesPills(categories, onSelect) {
                const wrapper = document.createElement('div');
                wrapper.className = 'categories-wrapper';
                const pillsDiv = document.createElement('div');
                pillsDiv.className = 'categories-pills';
                const allPill = document.createElement('span');
                allPill.className = 'category-pill active';
                allPill.textContent = 'All';
                allPill.dataset.category = 'all';
                allPill.addEventListener('click', () => {
                    document.querySelectorAll('.category-pill').forEach(p => p.classList.remove('active'));
                    allPill.classList.add('active');
                    onSelect(null);
                });
                pillsDiv.appendChild(allPill);
                categories.forEach(cat => {
                    const pill = document.createElement('span');
                    pill.className = 'category-pill';
                    pill.textContent = cat;
                    pill.dataset.category = cat;
                    pill.addEventListener('click', () => {
                        document.querySelectorAll('.category-pill').forEach(p => p.classList.remove('active'));
                        pill.classList.add('active');
                        onSelect(cat);
                    });
                    pillsDiv.appendChild(pill);
                });
                wrapper.appendChild(pillsDiv);
                return wrapper;
            }
        
            function renderLibraryUI(library) {
                libraryContainer.innerHTML = '';
                if (library === 'fa' && faIconsData.length > 0) {
                    libraryContainer.appendChild(buildLibrarySection('fa', 'Font Awesome', faUsageText, faIconsData, faCardMap));
                } else if (library === 'bi' && biIconsData.length > 0) {
                    libraryContainer.appendChild(buildLibrarySection('bi', 'Bootstrap Icons', biUsageText, biIconsData, biCardMap));
                } else {
                    libraryContainer.innerHTML = `<div class="loading-placeholder"><i class="fas fa-spinner fa-pulse"></i> Loading...</div>`;
                }
                filterCurrentLibrary();
            }
        
            function buildLibrarySection(libKey, title, usageText, dataArray, cardMap) {
                const section = document.createElement('div');
                section.className = 'library-section';
                section.id = `${libKey}Section`;
                
                const headerDiv = document.createElement('div');
                headerDiv.className = 'library-header';
                
                const titleDiv = document.createElement('div');
                titleDiv.className = 'library-title';
                const h2 = document.createElement('h2');
                h2.innerHTML = libKey === 'fa' ? '<i class="fab fa-font-awesome" style="color:#C1FC32;"></i> Font Awesome' : '<i class="bi bi-bootstrap-fill" style="color:#C1FC32;"></i> Bootstrap Icons';
                titleDiv.appendChild(h2);
                
                const headerRight = document.createElement('div');
                headerRight.className = 'header-right';
                
                const counter = document.createElement('div');
                counter.className = 'counter-chip';
                counter.innerHTML = `<i class="far fa-eye"></i> <span class="visible-count">${dataArray.length}</span> / ${dataArray.length}`;
                
                const usageBadge = document.createElement('span');
                usageBadge.className = 'usage-badge';
                usageBadge.textContent = usageText;
                
                headerRight.appendChild(counter);
                headerRight.appendChild(usageBadge);
                
                headerDiv.appendChild(titleDiv);
                headerDiv.appendChild(headerRight);
                section.appendChild(headerDiv);
                
                const categories = getCategoriesFromData(dataArray);
                const categoriesPills = buildCategoriesPills(categories, (cat) => {
                    currentCategory = cat;
                    filterCurrentLibrary();
                });
                section.appendChild(categoriesPills);
                
                const gridDiv = document.createElement('div');
                gridDiv.className = 'icon-grid';
                const fragment = document.createDocumentFragment();
                cardMap.clear();
                for (const item of dataArray) {
                    const card = createIconCard(item);
                    fragment.appendChild(card);
                    cardMap.set(item.name, card);
                }
                gridDiv.appendChild(fragment);
                section.appendChild(gridDiv);
                
                return section;
            }
        
            function filterCurrentLibrary() {
                const term = searchInput.value.trim().toLowerCase();
                let visibleCount = 0;
                const activeMap = activeLibrary === 'fa' ? faCardMap : biCardMap;
                const counterSpan = document.querySelector('.library-section .visible-count');
                for (let [name, card] of activeMap.entries()) {
                    const matchesSearch = term === '' || name.toLowerCase().includes(term);
                    const matchesCategory = !currentCategory || card.dataset.category === currentCategory;
                    if (matchesSearch && matchesCategory) {
                        card.classList.remove('hidden-card');
                        visibleCount++;
                    } else {
                        card.classList.add('hidden-card');
                    }
                }
                if (counterSpan) counterSpan.textContent = visibleCount;
            }
        
            function switchLibrary(lib) {
                activeLibrary = lib;
                currentLibLabel.textContent = lib === 'fa' ? 'Font Awesome' : 'Bootstrap Icons';
                currentCategory = null;
                if (lib === 'fa' && faIconsData.length > 0) {
                    renderLibraryUI('fa');
                } else if (lib === 'bi' && biIconsData.length > 0) {
                    renderLibraryUI('bi');
                } else {
                    libraryContainer.innerHTML = `<div class="loading-placeholder"><i class="fas fa-spinner fa-pulse"></i> Loading...</div>`;
                }
                closeUniversalPopup();
            }
        
            function openPopup(type) {
                const popup = document.getElementById('universalPopup');
                const title = document.getElementById('popupTitle');
                const content = document.getElementById('popupContent');
                if (type === 'selector') {
                    title.textContent = 'Select Icon Library';
                    let itemsHTML = `
                        <div class="tool-option">
                            <div class="tool-option-content" onclick="switchLibrary('fa')">
                                <h3><i class="fab fa-font-awesome"></i> Font Awesome</h3>
                                <p>6.4.0 · Solid, Regular, Brands</p>
                            </div>
                            <a href="https://fontawesome.com/icons" target="_blank" class="external-link-btn" onclick="event.stopPropagation()">
                                <i class="fas fa-arrow-up-right-from-square"></i>
                            </a>
                        </div>
                        <div class="tool-option">
                            <div class="tool-option-content" onclick="switchLibrary('bi')">
                                <h3><i class="bi bi-bootstrap-fill"></i> Bootstrap Icons</h3>
                                <p>v1.11.3 · MIT license</p>
                            </div>
                            <a href="https://icons.getbootstrap.com/" target="_blank" class="external-link-btn" onclick="event.stopPropagation()">
                                <i class="fas fa-arrow-up-right-from-square"></i>
                            </a>
                        </div>
                    `;
                    content.innerHTML = itemsHTML;
                }
                popup.style.display = 'flex';
            }
        
            window.closeUniversalPopup = function() {
                document.getElementById('universalPopup').style.display = 'none';
            };
        
            window.switchLibrary = switchLibrary;
        
            document.getElementById('selectorBtn').addEventListener('click', () => openPopup('selector'));
            searchInput.addEventListener('input', filterCurrentLibrary);
        
            window.addEventListener('iconsReady', () => {
                const sets = window.iconSets;
                if (!sets) {
                    libraryContainer.innerHTML = `<div class="error-block"><i class="fas fa-exclamation-triangle"></i> Icon data not loaded.</div>`;
                    return;
                }
                faIconsData = sets.fa || [];
                biIconsData = sets.bi || [];
                if (faIconsData.length === 0 && biIconsData.length === 0) {
                    libraryContainer.innerHTML = `<div class="error-block"><i class="fas fa-exclamation-triangle"></i> No icons parsed.</div>`;
                    return;
                }
                renderLibraryUI('fa');
            });
        
            document.addEventListener('click', (e) => {
                const popup = document.getElementById('universalPopup');
                if (e.target === popup) closeUniversalPopup();
            });
        })();
    </script>
</body>
</html>
