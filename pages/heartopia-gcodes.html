<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Heartopia Gift Codes | lildavegoth</title>
    <meta name="color-scheme" content="dark">
    <meta http-equiv="Content-Security-Policy" content="
        default-src 'self' data: gap: https:;
        style-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com;
        script-src 'self' 'unsafe-inline' 'unsafe-eval';
        connect-src 'self' https:;
        img-src 'self' data:;
        font-src 'self' https://cdnjs.cloudflare.com;
    ">
    <script src="../protections.js"></script>
    <link rel="stylesheet" href="../media.css">
    <script src="../notification.cssjs"></script>
    <script src="../cordova.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root {
            --accent-color: #C1FC32;
            --accent-dark: #9bc726;
            --bg-black: #000000;
            --bg-dark: #1a1a1a;
            --bg-card: rgba(30, 30, 30, 0.7);
            --text-primary: #f5f5f7;
            --text-secondary: #a1a1a6;
            --radius-small: 12px;
            --radius-medium: 20px;
            --radius-large: 28px;
            --spacing-xs: 8px;
            --spacing-sm: 16px;
            --spacing-md: 24px;
            --spacing-lg: 32px;
            --spacing-xl: 48px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-black);
            color: var(--text-primary);
            min-height: 100vh;
            background-image: 
                radial-gradient(circle at 20% 80%, rgba(193, 252, 50, 0.05) 0%, transparent 20%),
                radial-gradient(circle at 80% 20%, rgba(193, 252, 50, 0.03) 0%, transparent 20%);
            overflow-x: hidden;
        }

        .container {
            max-width: 1600px;
            margin: 0 auto;
            padding: var(--spacing-md);
            position: relative;
            min-height: calc(100vh - 90px);
        }

        .refresh-pill {
            background: var(--accent-color);
            color: #111;
            border: none;
            padding: 4px 10px;
            border-radius: 60px;
            font-size: 1rem;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
            transition: 0.2s;
            margin-top: 20px;
            margin-left: -30px;
        }
        .refresh-pill i { font-size: 1rem; }
        .refresh-pill:hover { background: #d0ff5e; }
        .refresh-pill:active { transform: scale(0.97); }

        .cards-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 1.5rem;
            margin-top: 1rem;
        }

        .code-card {
            background: var(--bg-card);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: var(--radius-medium);
            padding: 1.25rem;
            transition: all 0.2s;
        }
        .code-card:hover {
            border-color: var(--accent-color);
            transform: translateY(-2px);
        }
        .code-value {
            font-size: 1.25rem;
            font-weight: 700;
            background: var(--accent-color);
            color: black;
            display: inline-block;
            padding: 0.25rem 0.75rem;
            border-radius: 999px;
            margin-bottom: 0.75rem;
            letter-spacing: 0.5px;
            cursor: pointer;
            transition: 0.1s ease;
        }
        .code-value:active {
            transform: scale(0.98);
            background: rgba(193, 252, 50, 0.2);
        }
        .rewards {
            font-size: 0.95rem;
            color: var(--text-secondary);
            margin-bottom: 0.75rem;
            line-height: 1.4;
        }
        .expiry {
            font-size: 0.85rem;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            flex-wrap: wrap;
            padding: 0.2rem 0;
            margin-left: -10px;
            margin-bottom: 0;
        }
        .claimed-pill {
            background: var(--accent-color);
            color: #000000;
            font-size: 0.7rem;
            font-weight: bold;
            padding: 2px 10px;
            border-radius: 999px;
            display: inline-block;
            letter-spacing: 0.3px;
        }

        .loading, .error {
            text-align: center;
            padding: 2rem;
            color: var(--text-secondary);
        }
        .error {
            color: #ff6b6b;
            background: rgba(255, 107, 107, 0.1);
            border-radius: var(--radius-small);
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-secondary);
            font-size: 1.1rem;
            background: rgba(255,255,255,0.02);
            border-radius: var(--radius-large);
            margin-top: 20px;
        }
        .empty-state i {
            font-size: 3rem;
            color: var(--accent-color);
            margin-bottom: 16px;
            opacity: 0.6;
        }

        textarea,
        input {
            resize: none;
        }

        @media (max-width: 640px) {
            .cards-grid {
                grid-template-columns: 1fr;
            }
            .code-value {
                font-size: 1rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <a href="../index.html" class="back-link fade-in">
            <i class="fas fa-arrow-left"></i> Back to Home
        </a>

        <app-header>
            <h1 class="username">Heartopia Gift Codes</h1>
            <p class="title">Active Gift Codes from Official Source + Exclusive Extras</p>
        </app-header>

        <button class="refresh-pill" id="refreshBtn"><i class="fas fa-sync-alt"></i> Refresh</button>

        <div id="codes-container">
            <div class="loading"><i class="fas fa-spinner fa-pulse"></i> Loading codes...</div>
        </div>

        <footer>
            <div class="social-links">
                <a href="https://twitter.com/lildavegoth"><span class="icon icon-twitter"></span></a>
                <a href="https://instagram.com/dave_goth"><span class="icon icon-instagram"></span></a>
            </div>
            <p>© 2026 lildavegoth | Heartopia Gift Codes</p>
            <p style="margin-top: 8px; font-size: 0.8rem; color: #666;">
                Conveys the Idea of a Protected and Inspiring Space for Creative Expression.
            </p>
        </footer>
    </div>

    <script>
        const STORAGE_KEY = 'hatoGiftCodes';
        const TARGET_URL = 'https://www.heartopia.live/en/codes/';
        const MANUAL_CODES_URL = 'https://j1x1ajaevaygfyxv.public.blob.vercel-storage.com/Heartopia/gift-codes.json';
        const PROXIES = [
            'https://api.allorigins.win/raw?url=',
            'https://corsproxy.io/?',
            'https://thingproxy.freeboard.io/fetch/'
        ];

        async function fetchRawHtml() {
            for (let i = 0; i < PROXIES.length; i++) {
                const fullUrl = PROXIES[i] + encodeURIComponent(TARGET_URL);
                try {
                    const response = await fetch(fullUrl);
                    if (response.ok) {
                        return await response.text();
                    }
                } catch (err) {}
            }
            throw new Error('fetch failed');
        }

        function parseCodesFromHtml(html) {
            const parser = new DOMParser();
            const doc = parser.parseFromString(html, 'text/html');
            const activeCards = doc.querySelectorAll('.card.p-6.border-amber-400');
            const parsed = [];
            for (const card of activeCards) {
                const codeElem = card.querySelector('code');
                const rewardElem = card.querySelector('p.text-text-secondary');
                const expiryElem = card.querySelector('.flex.items-center.text-amber-600.font-medium');
                if (codeElem && rewardElem) {
                    let code = codeElem.textContent.trim();
                    let rewardText = rewardElem.textContent.trim();
                    rewardText = rewardText.replace(/^Rewards:\s*/, '');
                    let expiry = expiryElem ? expiryElem.textContent.trim() : 'Unknown';
                    expiry = expiry.replace(/^Expires:\s*/, '');
                    parsed.push({ code, reward: rewardText, expiry });
                }
            }
            return parsed;
        }

        async function fetchManualCodes() {
            try {
                const response = await fetch(MANUAL_CODES_URL);
                if (response.ok) {
                    const data = await response.json();
                    if (Array.isArray(data)) {
                        return data;
                    }
                }
                return [];
            } catch (err) {
                return [];
            }
        }

        async function fetchSiteCodes() {
            const html = await fetchRawHtml();
            return parseCodesFromHtml(html);
        }

        function combineCodes(siteCodes, manualCodes) {
            const map = new Map();
            for (const manual of manualCodes) {
                map.set(manual.code, { ...manual });
            }
            for (const site of siteCodes) {
                if (!map.has(site.code)) {
                    map.set(site.code, { ...site });
                }
            }
            return Array.from(map.values());
        }

        function mergeClaimedStatus(combinedCodes, storedCodes) {
            const claimedMap = new Map();
            if (storedCodes && Array.isArray(storedCodes)) {
                for (const item of storedCodes) {
                    if (item.code && typeof item.claimed === 'boolean') {
                        claimedMap.set(item.code, item.claimed);
                    }
                }
            }
            return combinedCodes.map(codeItem => ({
                ...codeItem,
                claimed: claimedMap.get(codeItem.code) || false
            }));
        }

        function saveToLocalStorage(codesArray) {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(codesArray));
        }

        function loadFromLocalStorage() {
            const raw = localStorage.getItem(STORAGE_KEY);
            if (raw) {
                try {
                    const parsed = JSON.parse(raw);
                    if (Array.isArray(parsed)) return parsed;
                } catch (e) {}
            }
            return null;
        }

        function renderCodes(codes, warningMessage = '') {
            const container = document.getElementById('codes-container');
            if (!codes || codes.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <i class="fas fa-gift"></i>
                        <p>No active gift codes available.</p>
                        <p style="font-size:0.85rem; margin-top:8px;">Click refresh to check for new codes.</p>
                    </div>
                `;
                if (warningMessage) {
                    const warningDiv = document.createElement('div');
                    warningDiv.className = 'error';
                    warningDiv.innerHTML = `<i class="fas fa-exclamation-triangle"></i> ${warningMessage}`;
                    container.prepend(warningDiv);
                }
                return;
            }

            let cardsHtml = '<div class="cards-grid">';
            for (const c of codes) {
                const safeCode = escapeHtml(c.code);
                const safeReward = escapeHtml(c.reward);
                const safeExpiry = escapeHtml(c.expiry);
                const claimedBadgeHtml = c.claimed ? '<span class="claimed-pill">Claimed</span>' : '';
                cardsHtml += `
                    <div class="code-card" data-code-key="${safeCode}">
                        <div class="code-value">${safeCode}</div>
                        <div class="rewards">${safeReward}</div>
                        <div class="expiry">
                            <div style="margin-left: 10px;">Expires: ${safeExpiry}</div>
                            ${claimedBadgeHtml}
                        </div>
                    </div>
                `;
            }
            cardsHtml += '</div>';
            if (warningMessage) {
                cardsHtml = `<div class="error"><i class="fas fa-exclamation-triangle"></i> ${warningMessage}</div>` + cardsHtml;
            }
            container.innerHTML = cardsHtml;
        }

        function updateClaimedStatusAndReRender(codeToClaim) {
            const stored = loadFromLocalStorage();
            if (!stored) return false;
            let updated = false;
            const newCodes = stored.map(item => {
                if (item.code === codeToClaim && !item.claimed) {
                    updated = true;
                    return { ...item, claimed: true };
                }
                return item;
            });
            if (updated) {
                saveToLocalStorage(newCodes);
                renderCodes(newCodes);
                return true;
            } else {
                const alreadyClaimed = stored.some(item => item.code === codeToClaim && item.claimed);
                if (!alreadyClaimed) return false;
                renderCodes(stored);
            }
            return false;
        }

        function copyToClipboard(text) {
            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(text).catch(() => {
                    fallbackCopy(text);
                });
            } else {
                fallbackCopy(text);
            }
        }

        function fallbackCopy(text) {
            const textarea = document.createElement('textarea');
            textarea.value = text;
            document.body.appendChild(textarea);
            textarea.select();
            document.execCommand('copy');
            document.body.removeChild(textarea);
        }

        function attachGlobalCopyHandler() {
            const container = document.getElementById('codes-container');
            if (!container) return;
            container.removeEventListener('click', copyAndClaimHandler);
            container.addEventListener('click', copyAndClaimHandler);
        }

        function copyAndClaimHandler(event) {
            const codeDiv = event.target.closest('.code-value');
            if (!codeDiv) return;
            const codeText = codeDiv.textContent.trim();
            if (!codeText) return;
            copyToClipboard(codeText);
            updateClaimedStatusAndReRender(codeText);
        }

        async function fetchAndCombineAll() {
            let siteCodes = [];
            let manualCodes = [];
            let siteError = false;
            let manualError = false;

            try {
                siteCodes = await fetchSiteCodes();
            } catch (err) {
                siteError = true;
            }

            try {
                manualCodes = await fetchManualCodes();
                if (manualCodes.length === 0) manualError = true;
            } catch (err) {
                manualError = true;
            }

            const combined = combineCodes(siteCodes, manualCodes);
            const stored = loadFromLocalStorage();
            const mergedWithClaimed = mergeClaimedStatus(combined, stored);
            saveToLocalStorage(mergedWithClaimed);

            let warningMsg = '';
            if (siteError && manualError) warningMsg = 'Failed to load codes from official site and external database. Showing cached codes if available.';
            else if (siteError) warningMsg = 'Could not fetch official codes from Heartopia.live, showing external database + cached.';
            else if (manualError) warningMsg = 'External manual codes database unreachable, showing official codes only.';

            return { codes: mergedWithClaimed, warning: warningMsg, hasSiteError: siteError, hasManualError: manualError };
        }

        async function refreshCodes() {
            const container = document.getElementById('codes-container');
            container.innerHTML = '<div class="loading"><i class="fas fa-spinner fa-pulse"></i> Fetching latest codes...</div><p>This app fetches data from <a style="text-decoration: none; color: var(--accent-color);" href="https://www.heartopia.live/en/codes/" target="_blank" rel="noopener noreferrer">Heartopia.live</a> and external JSON database.</p>';
            try {
                const { codes, warning } = await fetchAndCombineAll();
                if (codes && codes.length > 0) {
                    renderCodes(codes, warning);
                } else {
                    const fallbackManualOnly = await fetchManualCodes();
                    if (fallbackManualOnly.length > 0) {
                        const fallbackCombined = combineCodes([], fallbackManualOnly);
                        const storedFallback = loadFromLocalStorage();
                        const mergedFallback = mergeClaimedStatus(fallbackCombined, storedFallback);
                        saveToLocalStorage(mergedFallback);
                        renderCodes(mergedFallback, 'Unable to fetch official codes, showing only external database.');
                    } else {
                        const lastResort = loadFromLocalStorage();
                        if (lastResort && lastResort.length > 0) {
                            renderCodes(lastResort, 'Could not fetch fresh data, showing last saved codes.');
                        } else {
                            renderCodes([], 'No codes available at this time.');
                        }
                    }
                }
            } catch (err) {
                const cached = loadFromLocalStorage();
                if (cached && cached.length > 0) {
                    renderCodes(cached, 'Refresh failed. Showing cached codes.');
                } else {
                    container.innerHTML = `<div class="error"><i class="fas fa-exclamation-circle"></i> Failed to fetch codes. Please try again later.<br><a href="https://www.heartopia.live/en/codes/" target="_blank" style="color: var(--accent-color);">Visit official page</a></div>`;
                }
            }
            attachGlobalCopyHandler();
        }

        async function initializeApp() {
            const existingData = loadFromLocalStorage();
            if (existingData && existingData.length > 0) {
                let siteCodes = [];
                let manualCodes = [];
                let warningMsg = '';
                try {
                    siteCodes = await fetchSiteCodes();
                } catch (err) {}
                try {
                    manualCodes = await fetchManualCodes();
                } catch (err) {}
                const combined = combineCodes(siteCodes, manualCodes);
                const merged = mergeClaimedStatus(combined, existingData);
                if (merged.length > 0) {
                    saveToLocalStorage(merged);
                    renderCodes(merged);
                } else {
                    renderCodes(existingData);
                }
                if (siteCodes.length === 0 && manualCodes.length === 0) {
                    const warningDiv = document.getElementById('codes-container');
                    if (warningDiv && !warningDiv.querySelector('.error')) {
                        const errDiv = document.createElement('div');
                        errDiv.className = 'error';
                        errDiv.innerHTML = '<i class="fas fa-cloud-download-alt"></i> Could not sync with external sources, using cached codes.';
                        warningDiv.prepend(errDiv);
                    }
                }
                attachGlobalCopyHandler();
                return;
            }

            const container = document.getElementById('codes-container');
            container.innerHTML = '<div class="loading"><i class="fas fa-spinner fa-pulse"></i> Loading gift codes...</div>';
            try {
                const { codes, warning } = await fetchAndCombineAll();
                if (codes.length > 0) {
                    renderCodes(codes, warning);
                } else {
                    const manualFallback = await fetchManualCodes();
                    if (manualFallback.length > 0) {
                        const combinedOnlyManual = combineCodes([], manualFallback);
                        const withClaimedFalse = combinedOnlyManual.map(c => ({ ...c, claimed: false }));
                        saveToLocalStorage(withClaimedFalse);
                        renderCodes(withClaimedFalse, 'Using external database only (official source unavailable).');
                    } else {
                        renderCodes([], 'No codes available. Please refresh later.');
                    }
                }
            } catch (err) {
                const manualEmergency = await fetchManualCodes();
                if (manualEmergency.length > 0) {
                    const emergencyCombined = combineCodes([], manualEmergency);
                    const emergencyWithClaimed = emergencyCombined.map(c => ({ ...c, claimed: false }));
                    saveToLocalStorage(emergencyWithClaimed);
                    renderCodes(emergencyWithClaimed, 'Limited connectivity: showing external codes only.');
                } else {
                    container.innerHTML = `<div class="error"><i class="fas fa-exclamation-triangle"></i> Unable to load any codes. Please check your internet connection.<br><a href="https://www.heartopia.live/en/codes/" target="_blank" style="color: var(--accent-color);">Visit official page</a></div>`;
                }
            }
            attachGlobalCopyHandler();
        }

        function escapeHtml(str) {
            return str.replace(/[&<>]/g, function(m) {
                if (m === '&') return '&amp;';
                if (m === '<') return '&lt;';
                if (m === '>') return '&gt;';
                return m;
            });
        }

        document.getElementById('refreshBtn').addEventListener('click', refreshCodes);
        initializeApp();
    </script>
</body>
</html>
