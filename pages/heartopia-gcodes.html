<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Heartopia Gift Codes | lildavegoth</title>
    <meta name="color-scheme" content="dark">
    <meta http-equiv="Content-Security-Policy" content="
        default-src 'self' data: gap: https:;
        style-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com;
        script-src 'self' 'unsafe-inline' 'unsafe-eval';
        connect-src 'self' https:;
        img-src 'self' data:;
        font-src 'self' https://cdnjs.cloudflare.com;
    ">
    <script src="../protections.js"></script>
    <link rel="stylesheet" href="../media.css">
    <script src="../notification.cssjs"></script>
    <script src="../cordova.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root {
            --accent-color: #C1FC32;
            --accent-dark: #9bc726;
            --bg-black: #000000;
            --bg-dark: #1a1a1a;
            --bg-card: rgba(30, 30, 30, 0.7);
            --text-primary: #f5f5f7;
            --text-secondary: #a1a1a6;
            --radius-small: 12px;
            --radius-medium: 20px;
            --radius-large: 28px;
            --spacing-xs: 8px;
            --spacing-sm: 16px;
            --spacing-md: 24px;
            --spacing-lg: 32px;
            --spacing-xl: 48px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-black);
            color: var(--text-primary);
            min-height: 100vh;
            background-image: 
                radial-gradient(circle at 20% 80%, rgba(193, 252, 50, 0.05) 0%, transparent 20%),
                radial-gradient(circle at 80% 20%, rgba(193, 252, 50, 0.03) 0%, transparent 20%);
            overflow-x: hidden;
        }

        .container {
            max-width: 1600px;
            margin: 0 auto;
            padding: var(--spacing-md);
            position: relative;
            min-height: calc(100vh - 90px);
        }

        .cards-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 1.5rem;
            margin-top: 1rem;
        }

        .code-card {
            background: var(--bg-card);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: var(--radius-medium);
            padding: 1.25rem;
            transition: all 0.2s;
        }
        .code-card:hover {
            border-color: var(--accent-color);
            transform: translateY(-2px);
        }
        .code-value {
            font-size: 1.25rem;
            font-weight: 700;
            background: var(--accent-color);
            color: black;
            display: inline-block;
            padding: 0.25rem 0.75rem;
            border-radius: 999px;
            margin-bottom: 0.75rem;
            letter-spacing: 0.5px;
            cursor: pointer;
            transition: 0.1s ease;
        }
        .code-value:active {
            transform: scale(0.98);
            background: rgba(193, 252, 50, 0.2);
        }
        .rewards {
            font-size: 0.95rem;
            color: var(--text-secondary);
            margin-bottom: 0.75rem;
            line-height: 1.4;
        }
        .expiry {
            font-size: 0.85rem;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            flex-wrap: wrap;
            padding: 0.2rem 0;
            margin-left: -10px;
            margin-bottom: 0;
        }
        .claimed-pill {
            background: var(--accent-color);
            color: #000000;
            font-size: 0.7rem;
            font-weight: bold;
            padding: 2px 10px;
            border-radius: 999px;
            display: inline-block;
            letter-spacing: 0.3px;
        }

        .loading, .error {
            text-align: center;
            padding: 2rem;
            color: var(--text-secondary);
        }
        .error {
            color: #ff6b6b;
            background: rgba(255, 107, 107, 0.1);
            border-radius: var(--radius-small);
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-secondary);
            font-size: 1.1rem;
            background: rgba(255,255,255,0.02);
            border-radius: var(--radius-large);
            margin-top: 20px;
        }
        .empty-state i {
            font-size: 3rem;
            color: var(--accent-color);
            margin-bottom: 16px;
            opacity: 0.6;
        }

        textarea,
        input {
            resize: none;
        }

        @media (max-width: 640px) {
            .cards-grid {
                grid-template-columns: 1fr;
            }
            .code-value {
                font-size: 1rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <a href="../index.html" class="back-link fade-in">
            <i class="fas fa-arrow-left"></i> Back to Home
        </a>

        <app-header>
            <h1 class="username">Heartopia Gift Codes</h1>
            <p class="title">Active Gift Codes — Updated via Official Database</p>
        </app-header>
        
        <div style="display: flex; justify-content: flex-end; margin-bottom: 16px;">
        <button id="refreshCodesBtn" style="
            background: var(--accent-color);
            color: black;
            border: none;
            border-radius: 999px;
            padding: 10px 20px;
            font-weight: 600;
            font-size: 1rem;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            transition: opacity 0.2s;
        ">
            <i class="fas fa-sync-alt"></i> Refresh Codes
        </button>
    </div>

        <div id="codes-container">
            <div class="loading"><i class="fas fa-spinner fa-pulse"></i> Loading codes...</div>
        </div>

        <footer>
            <div class="social-links">
                <a href="https://twitter.com/lildavegoth"><span class="icon icon-twitter"></span></a>
                <a href="https://instagram.com/dave_goth"><span class="icon icon-instagram"></span></a>
            </div>
            <p>© 2026 lildavegoth | Heartopia Gift Codes</p>
            <p style="margin-top: 8px; font-size: 0.8rem; color: #666;">
                Conveys the Idea of a Protected and Inspiring Space for Creative Expression.
            </p>
        </footer>
    </div>

    <script>
        const STORAGE_KEY = 'hatoGiftCodes';
        const CODES_JSON_URL = 'https://j1x1ajaevaygfyxv.public.blob.vercel-storage.com/Heartopia/gift-codes.json';

        function escapeHtml(str) {
            return str.replace(/[&<>]/g, function(m) {
                if (m === '&') return '&amp;';
                if (m === '<') return '&lt;';
                if (m === '>') return '&gt;';
                return m;
            });
        }

        function loadFromLocalStorage() {
            const raw = localStorage.getItem(STORAGE_KEY);
            if (!raw) return null;
            try {
                const parsed = JSON.parse(raw);
                return Array.isArray(parsed) ? parsed : null;
            } catch (e) {
                return null;
            }
        }

        function saveToLocalStorage(codesArray) {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(codesArray));
        }

        function mergeClaimedStatus(freshCodes, storedCodes) {
            const claimedMap = new Map();
            if (storedCodes && Array.isArray(storedCodes)) {
                for (const item of storedCodes) {
                    if (item.code && typeof item.claimed === 'boolean') {
                        claimedMap.set(item.code, item.claimed);
                    }
                }
            }
            return freshCodes.map(item => ({
                ...item,
                claimed: claimedMap.get(item.code) || false
            }));
        }

        async function fetchCodesFromJson() {
            const url = CODES_JSON_URL;
            
            if (window.cordova && cordova.plugin && cordova.plugin.http) {
                return new Promise((resolve, reject) => {
                    cordova.plugin.http.get(url, {}, {}, function(response) {
                        try {
                            const data = JSON.parse(response.data);
                            resolve(Array.isArray(data) ? data : []);
                        } catch (e) {
                            reject(e);
                        }
                    }, function(error) {
                        reject(error);
                    });
                });
            }
            
            const response = await fetch(url, { cache: 'no-cache' });
            if (!response.ok) throw new Error('Fetch failed');
            const data = await response.json();
            return Array.isArray(data) ? data : [];
        }

        function renderCodes(codes, errorMessage = '') {
            const container = document.getElementById('codes-container');
            if (!codes || codes.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <i class="fas fa-gift"></i>
                        <p>No active gift codes available.</p>
                    </div>
                `;
                if (errorMessage) {
                    const warningDiv = document.createElement('div');
                    warningDiv.className = 'error';
                    warningDiv.innerHTML = `<i class="fas fa-exclamation-triangle"></i> ${errorMessage}`;
                    container.prepend(warningDiv);
                }
                return;
            }

            let cardsHtml = '<div class="cards-grid">';
            for (const c of codes) {
                const safeCode = escapeHtml(c.code);
                const safeReward = escapeHtml(c.reward);
                const safeExpiry = escapeHtml(c.expiry);
                const claimedBadge = c.claimed ? '<span class="claimed-pill">Claimed</span>' : '';
                cardsHtml += `
                    <div class="code-card" data-code-key="${safeCode}">
                        <div class="code-value">${safeCode}</div>
                        <div class="rewards">${safeReward}</div>
                        <div class="expiry">
                            <div style="margin-left: 10px;">Expires: ${safeExpiry}</div>
                            ${claimedBadge}
                        </div>
                    </div>
                `;
            }
            cardsHtml += '</div>';
            if (errorMessage) {
                cardsHtml = `<div class="error"><i class="fas fa-exclamation-triangle"></i> ${errorMessage}</div>` + cardsHtml;
            }
            container.innerHTML = cardsHtml;
        }

        function updateClaimedStatusAndReRender(codeToClaim) {
            const stored = loadFromLocalStorage();
            if (!stored) return false;
            let updated = false;
            const newCodes = stored.map(item => {
                if (item.code === codeToClaim && !item.claimed) {
                    updated = true;
                    return { ...item, claimed: true };
                }
                return item;
            });
            if (updated) {
                saveToLocalStorage(newCodes);
                renderCodes(newCodes);
                return true;
            }
            return false;
        }

        function copyToClipboard(text) {
            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(text).catch(() => fallbackCopy(text));
            } else {
                fallbackCopy(text);
            }
        }

        function fallbackCopy(text) {
            const textarea = document.createElement('textarea');
            textarea.value = text;
            document.body.appendChild(textarea);
            textarea.select();
            document.execCommand('copy');
            document.body.removeChild(textarea);
        }

        function copyAndClaimHandler(event) {
            const codeDiv = event.target.closest('.code-value');
            if (!codeDiv) return;
            const codeText = codeDiv.textContent.trim();
            if (!codeText) return;
            copyToClipboard(codeText);
            updateClaimedStatusAndReRender(codeText);
        }

        function attachGlobalCopyHandler() {
            const container = document.getElementById('codes-container');
            if (!container) return;
            container.removeEventListener('click', copyAndClaimHandler);
            container.addEventListener('click', copyAndClaimHandler);
        }
        
        async function refreshCodes() {
            const container = document.getElementById('codes-container');
            const button = document.getElementById('refreshCodesBtn');
            const originalContent = container.innerHTML;
            const originalButtonHtml = button.innerHTML;
        
            container.innerHTML = '<div class="loading"><i class="fas fa-spinner fa-pulse"></i> Refreshing codes...</div>';
            button.disabled = true;
            button.innerHTML = '<i class="fas fa-spinner fa-pulse"></i> Refreshing';
        
            try {
                const fresh = await fetchCodesFromJson();
                const stored = loadFromLocalStorage() || [];
                const merged = mergeClaimedStatus(fresh, stored);
                saveToLocalStorage(merged);
                renderCodes(merged);
                attachGlobalCopyHandler();
            } catch (err) {
                container.innerHTML = `<div class="error"><i class="fas fa-exclamation-triangle"></i> Refresh failed. Check connection.</div>`;
            } finally {
                button.disabled = false;
                button.innerHTML = originalButtonHtml;
            }
        }

        async function initializeApp() {
            const cached = loadFromLocalStorage();
            if (cached && cached.length > 0) {
                renderCodes(cached);
                attachGlobalCopyHandler();
                try {
                    const fresh = await fetchCodesFromJson();
                    const merged = mergeClaimedStatus(fresh, cached);
                    saveToLocalStorage(merged);
                    renderCodes(merged);
                } catch (e) {
                    const warningDiv = document.createElement('div');
                    warningDiv.className = 'error';
                    warningDiv.innerHTML = '<i class="fas fa-cloud-download-alt"></i> Could not sync with server, showing cached codes.';
                    const container = document.getElementById('codes-container');
                    if (container && !container.querySelector('.error')) {
                        container.prepend(warningDiv);
                    }
                }
                attachGlobalCopyHandler();
                return;
            }

            const container = document.getElementById('codes-container');
            container.innerHTML = '<div class="loading"><i class="fas fa-spinner fa-pulse"></i> Loading gift codes...</div>';
            try {
                const fresh = await fetchCodesFromJson();
                if (fresh.length > 0) {
                    const merged = mergeClaimedStatus(fresh, []);
                    saveToLocalStorage(merged);
                    renderCodes(merged);
                } else {
                    renderCodes([], 'No codes found in database.');
                }
            } catch (err) {
                container.innerHTML = `<div class="error"><i class="fas fa-exclamation-triangle"></i> Unable to load any codes. Please try refreshing or reopen this app.</div>`;
            }
            attachGlobalCopyHandler();
        }

        initializeApp();
        attachGlobalCopyHandler();
        document.getElementById('refreshCodesBtn').addEventListener('click', refreshCodes);
    </script>
</body>
</html>
