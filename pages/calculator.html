<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Calculator | lildavegoth</title>
    <meta name="color-scheme" content="dark">
    <script src="../protections.js"></script>
    <link rel="stylesheet" href="../media.css">
    <link rel="stylesheet" href="../navigation.css">
    <script src="../notification.cssjs"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --accent-color: #C1FC32;
            --accent-dark: #9bc726;
            --bg-black: #000000;
            --bg-dark: #1a1a1a;
            --bg-card: rgba(30, 30, 30, 0.7);
            --text-primary: #f5f5f7;
            --text-secondary: #a1a1a6;
            --radius-small: 12px;
            --radius-medium: 20px;
            --radius-large: 28px;
            --spacing-xs: 8px;
            --spacing-sm: 16px;
            --spacing-md: 24px;
            --spacing-lg: 32px;
            --spacing-xl: 48px;
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
        
        body {
            background-color: var(--bg-black);
            color: var(--text-primary);
            min-height: 100vh;
            background-image: 
                radial-gradient(circle at 20% 80%, rgba(193, 252, 50, 0.05) 0%, transparent 20%),
                radial-gradient(circle at 80% 20%, rgba(193, 252, 50, 0.03) 0%, transparent 20%);
            overflow-x: hidden;
            padding-bottom: 90px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .container {
            width: 90%;
            max-width: 1400px;
            margin: 0 auto;
            padding: var(--spacing-xs);
            position: relative;
            min-height: calc(100vh - 90px);
        }
        
        .header {
            background: var(--accent-color);
            color: #000000;
            padding: 20px 20px;
            max-width: 440px;
            margin-left: auto;
            margin-right: auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-radius: var(--radius-large);
            cursor: pointer;
        }
        
        .header-left {
            line-height: 1.25;
        }
        
        .header-title {
            font-size: 15px;
            font-weight: 600;
        }
        
        .header-currency {
            font-size: 17px;
            font-weight: 600;
        }
        
        .header-icon {
            background: #000000;
            width: 45px;
            height: 45px;
            border-radius: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
        }
        
        .display {
            height: 190px;
            background: #000000;
            width: 100%;
            max-width: 440px;
            margin: 0 auto;
            border-radius: var(--radius-large);
            padding: 0 30px 20px 30px;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            overflow: hidden;
        }
        
        .main-amount {
            font-size: 48px;
            font-weight: 500;
            margin-bottom: 6px;
            white-space: nowrap;
            overflow: auto;
            text-align: right;
            width: 100%;
        }
        
        .secondary-amount {
            font-size: 21px;
            color: #aaaaaa;
            white-space: nowrap;
            overflow: auto;
            text-align: right;
            width: 100%;
        }
        
        .keypad {
            max-width: 440px;
            margin-left: auto;
            margin-right: auto;
            display: flex;
            gap: 13px;
            align-items: stretch;
        }
        
        .numbers-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 13px;
            flex: 3;
        }
        
        .operations {
            display: flex;
            flex-direction: column;
            gap: 13px;
            flex: 1;
        }
        
        .key {
            border-radius: 25px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            font-weight: 400;
            cursor: pointer;
            transition: all 0.1s;
        }
        
        .key:active {
            transform: scale(0.92);
        }
        
        .key.number {
            background: #1f1f1f;
            color: #ffffff;
            aspect-ratio: 1 / 1;
        }
        
        .key.number:active {
            background: #2d2d2d;
        }
        
        .key.op {
            background: #1f1f1f;
            color: var(--accent-color);
            aspect-ratio: 1 / 1;
        }
        
        .key.op:active {
            background: #2d2d2d;
        }
        
        .key.special {
            background: var(--accent-color);
            color: #000000;
        }
        
        .key.special:active {
            background: #9bc726;
        }
        
        .operations .key {
            background: #1f1f1f;
            color: var(--accent-color);
            border-radius: 30px;
            flex: 1;
            font-size: 36px;
            aspect-ratio: auto;
            padding: 0 5px;
        }
        
        .operations .key:active {
            background: #2d2d2d;
        }
        
        .operations .key.accent {
            background: var(--accent-color);
            color: #000000;
        }
        
        .operations .key.accent:active {
            background: #9bc726;
        }
        
        .circle-dot {
            font-size: 38px;
            line-height: 1;
        }
        
        .popup-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 101%;
            background: rgba(0, 0, 0, 1.0);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 99999999;
            animation: fadeIn 0.3s ease;
        }
        
        .popup-content {
            background: var(--bg-card);
            border-radius: var(--radius-large);
            width: 90%;
            max-width: 500px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
            max-height: 70vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        
        .popup-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: var(--spacing-md);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .popup-header h2 {
            font-size: 1.5rem;
            font-weight: 600;
        }
        
        .close-popup {
            background: transparent;
            border: none;
            color: var(--text-secondary);
            font-size: 1.2rem;
            cursor: pointer;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .history-item {
            padding: 14px 18px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 14px;
            cursor: default;
            border-radius: var(--radius-small);
            border-bottom: 1px solid rgba(255,255,255,0.05);
            font-size: 18px;
        }
        
        .history-item .expression {
            color: var(--text-secondary);
        }
        
        .history-item .result {
            font-weight: 600;
            color: var(--accent-color);
        }
        
        .clear-btn {
            background: var(--accent-color);
            color: #000000;
            border: none;
            border-radius: 30px;
            padding: 12px 20px;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            margin: 16px;
            width: calc(100% - 32px);
        }
        
        .clear-btn:active {
            background: #9bc726;
        }
        
        #historyList {
            max-height: 360px;
            overflow-y: auto;
            padding: 10px 0;
            flex: 1;
        }
    </style>
</head>
<body>
    <div class="container">
        <a style="margin-top: 20px;" href="../index.html" class="back-link fade-in">
            <i class="fas fa-arrow-left"></i> Back to Home
        </a>
        <app-header>
            <h1 class="username">Calculator</h1>
            <p style="margin-bottom: 20px;" class="tagline">Simple Calculator with history</p>
        </app-header>
        <div class="header" id="historyHeader">
            <div class="header-left">
                <div class="header-title">History</div>
                <div class="header-currency" id="historyCount">0 entries</div>
            </div>
            <div class="header-icon">
                <i class="fa-regular fa-clock" style="color: white; font-size: 24px;"></i>
            </div>
        </div>
        <div class="display">
            <div class="main-amount" id="main">0</div>
            <div class="secondary-amount" id="secondary"></div>
        </div>
        <div class="keypad">
            <div class="numbers-grid">
                <div class="key op" data-op="+">+</div>
                <div class="key op" data-op="−">−</div>
                <div class="key op" data-op="×">×</div>
                <div class="key number" data-val="7">7</div>
                <div class="key number" data-val="8">8</div>
                <div class="key number" data-val="9">9</div>
                <div class="key number" data-val="4">4</div>
                <div class="key number" data-val="5">5</div>
                <div class="key number" data-val="6">6</div>
                <div class="key number" data-val="1">1</div>
                <div class="key number" data-val="2">2</div>
                <div class="key number" data-val="3">3</div>
                <div class="key number circle-dot" data-val=".">
                    <svg width="28" height="28" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="12" r="8"/>
                    </svg>
                </div>
                <div class="key number" data-val="0">0</div>
                <div class="key number" id="back">
                    <svg width="32" height="26" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M19 12H5M12 19l-7-7 7-7"/>
                    </svg>
                </div>
            </div>
            <div class="operations">
                <div class="key accent" id="clearAll">AC</div>
                <div class="key" data-op="÷">÷</div>
                <div class="key accent" id="calculate">=</div>
            </div>
        </div>
        <footer class="fade-in">
            <div class="social-links">
                <a href="https://twitter.com/lildavegoth"><span class="icon icon-twitter"></span></a>
                <a href="https://instagram.com/dave_goth"><span class="icon icon-instagram"></span></a>
            </div>
            <p>© 2026 lildavegoth | Calculator</p>
            <p style="margin-top: 8px; font-size: 0.8rem; color: #666;">
                Conveys the Idea of a Protected and Inspiring Space for Creative Expression.
            </p>
        </footer>
    </div>
    
    <div id="universalPopup" class="popup-overlay" style="display: none;">
        <div class="popup-content">
            <div class="popup-header">
                <h2 id="popupTitle">Calculation History</h2>
                <button class="close-popup" id="closePopupBtn">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            <div id="historyList"></div>
            <button class="clear-btn" id="clearHistoryBtn">Clear All History</button>
        </div>
    </div>
    
    <script>
        let currentInput = '0';
        let previousOperand = null;
        let currentOperator = null;
        let shouldResetInput = false;
        let history = JSON.parse(localStorage.getItem('calcHistory')) || [];
        
        const mainDisplay = document.getElementById('main');
        const secondaryDisplay = document.getElementById('secondary');
        const historyCount = document.getElementById('historyCount');
        
        function updateHistoryCounter() {
            historyCount.textContent = history.length + ' entries';
        }
        
        function saveHistory() {
            localStorage.setItem('calcHistory', JSON.stringify(history));
            updateHistoryCounter();
        }
        
        function updateDisplay() {
            mainDisplay.textContent = currentInput;
            if (previousOperand !== null && currentOperator !== null) {
                secondaryDisplay.textContent = previousOperand + ' ' + currentOperator;
            } else {
                secondaryDisplay.textContent = '';
            }
            mainDisplay.scrollLeft = mainDisplay.scrollWidth;
            secondaryDisplay.scrollLeft = secondaryDisplay.scrollWidth;
        }
        
        function appendNumber(number) {
            if (shouldResetInput) {
                currentInput = '';
                shouldResetInput = false;
            }
            if (number === '.' && currentInput.includes('.')) return;
            if (currentInput === '0' && number !== '.') {
                currentInput = number;
            } else {
                currentInput += number;
            }
            updateDisplay();
        }
        
        function handleOperator(op) {
            const current = parseFloat(currentInput);
            if (isNaN(current)) return;
            if (previousOperand === null) {
                previousOperand = current;
                currentOperator = op;
                shouldResetInput = true;
            } else if (currentOperator) {
                compute();
                previousOperand = parseFloat(currentInput);
                currentOperator = op;
                shouldResetInput = true;
            }
            updateDisplay();
        }
        
        function compute() {
            const prev = previousOperand;
            const current = parseFloat(currentInput);
            if (prev === null || isNaN(current)) return;
            let result;
            switch (currentOperator) {
                case '+': result = prev + current; break;
                case '−': result = prev - current; break;
                case '×': result = prev * current; break;
                case '÷': result = prev / current; break;
                default: return;
            }
            result = parseFloat(result.toFixed(10));
            const expression = prev + ' ' + currentOperator + ' ' + current + ' =';
            history.unshift({ expression, result: result.toString() });
            if (history.length > 20) history.pop();
            saveHistory();
            currentInput = result.toString();
            previousOperand = null;
            currentOperator = null;
            shouldResetInput = true;
            updateDisplay();
        }
        
        function backspace() {
            if (currentInput.length > 1) {
                currentInput = currentInput.slice(0, -1);
            } else {
                currentInput = '0';
            }
            updateDisplay();
        }
        
        function allClear() {
            currentInput = '0';
            previousOperand = null;
            currentOperator = null;
            shouldResetInput = false;
            updateDisplay();
        }
        
        document.querySelectorAll('.key[data-val]').forEach(btn => {
            btn.addEventListener('click', () => {
                appendNumber(btn.getAttribute('data-val'));
            });
        });
        
        document.querySelectorAll('.key[data-op]').forEach(btn => {
            btn.addEventListener('click', () => {
                handleOperator(btn.getAttribute('data-op'));
            });
        });
        
        document.getElementById('calculate').addEventListener('click', () => {
            if (previousOperand !== null && currentOperator !== null) {
                compute();
            }
        });
        
        document.getElementById('clearAll').addEventListener('click', allClear);
        document.getElementById('back').addEventListener('click', backspace);
        
        document.getElementById('historyHeader').addEventListener('click', () => {
            renderHistoryPopup();
            document.getElementById('universalPopup').style.display = 'flex';
        });
        
        document.getElementById('closePopupBtn').addEventListener('click', () => {
            document.getElementById('universalPopup').style.display = 'none';
        });
        
        document.getElementById('clearHistoryBtn').addEventListener('click', () => {
            history = [];
            saveHistory();
            renderHistoryPopup();
            window.show('All histories has been cleared');
        });
        
        function renderHistoryPopup() {
            const list = document.getElementById('historyList');
            if (history.length === 0) {
                list.innerHTML = '<div style="padding:20px; text-align:center; color:#666;">No history yet</div>';
                return;
            }
            let html = '';
            history.forEach(entry => {
                html += `<div class="history-item">
                    <span class="expression">${entry.expression}</span>
                    <span class="result">${entry.result}</span>
                </div>`;
            });
            list.innerHTML = html;
        }
        
        window.addEventListener('click', (e) => {
            if (e.target.classList.contains('popup-overlay')) {
                document.getElementById('universalPopup').style.display = 'none';
            }
        });
        
        updateHistoryCounter();
        updateDisplay();
    </script>
</body>
</html>
