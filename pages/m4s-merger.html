<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="dark">
    <script src="../protections.js"></script>
    <script src="../notification.cssjs"></script>
    <link rel="stylesheet" href="../media.css">
    <script src="../ui-icons.js"></script>
    <style>
        :root {
            --accent-color: #C1FC32;
            --accent-dark: #9bc726;
            --bg-black: #000000;
            --bg-dark: #1a1a1a;
            --bg-card: rgba(30, 30, 30, 0.7);
            --text-primary: #f5f5f7;
            --text-secondary: #a1a1a6;
            --radius-small: 12px;
            --radius-medium: 20px;
            --radius-large: 28px;
            --spacing-xs: 8px;
            --spacing-sm: 16px;
            --spacing-md: 24px;
            --spacing-lg: 32px;
            --spacing-xl: 48px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-black);
            color: var(--text-primary);
            min-height: 100vh;
            overflow-x: hidden;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: var(--spacing-md);
            position: relative;
        }

        .card {
            background-color: var(--bg-card);
            border-radius: var(--radius-medium);
            padding: var(--spacing-md);
            margin-bottom: var(--spacing-md);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .title {
            font-size: 1.5rem;
            font-weight: 600;
            margin-bottom: var(--spacing-sm);
            color: var(--accent-color);
        }

        .subtitle {
            font-size: 0.9rem;
            color: var(--text-secondary);
            margin-bottom: var(--spacing-md);
        }

        .file-input-group {
            display: flex;
            flex-direction: column;
            gap: var(--spacing-sm);
            margin-bottom: var(--spacing-md);
        }

        .file-label {
            font-size: 0.85rem;
            color: var(--text-secondary);
            margin-bottom: var(--spacing-xs);
        }

        input[type="file"] {
            display: block;
            width: 100%;
            min-height: 52px;
            padding: var(--spacing-sm);
            background-color: var(--bg-dark);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: var(--radius-small);
            color: var(--text-primary);
            font-size: 0.9rem;
            cursor: pointer;
        }

        input[type="file"]::file-selector-button {
            display: none;
        }

        input[type="file"]::-webkit-file-upload-button {
            display: none;
        }

        button {
            background-color: var(--accent-color);
            color: var(--bg-black);
            border: none;
            border-radius: var(--radius-small);
            padding: var(--spacing-sm) var(--spacing-md);
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
            margin-top: var(--spacing-sm);
            width: 100%;
            display: block;
        }

        button:hover {
            background-color: var(--accent-dark);
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        #downloadBtn {
            display: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <a href="../index.html" class="back-link fade-in" style="margin-bottom: 12px;">
            <i class="fas fa-arrow-left"></i> Back to Home
        </a>
        <app-header class="fade-in">
            <div>
                <h1>M4S Merger</h1>
                <p class="tagline">Select video and audio M4S files to merge them into a single MP4 file</p>
            </div>
        </app-header>
        <div class="card">
            <div class="file-input-group">
                <label class="file-label" for="audioFile">Audio M4S File:</label>
                <input type="file" id="audioFile" accept=".m4s">
            </div>
            <div class="file-input-group">
                <label class="file-label" for="videoFile">Video M4S File:</label>
                <input type="file" id="videoFile" accept=".m4s">
            </div>
        </div>
        <button id="mergeBtn" disabled>Merge Files</button>
        <button id="downloadBtn">Download MP4</button>

        <footer class="fade-in">
            <div class="social-links">
                <a href="https://twitter.com/lildavegoth"><span class="icon icon-twitter"></span></a>
                <a href="https://instagram.com/dave_goth"><span class="icon icon-instagram"></span></a>
            </div>
            <p>© 2026 lildavegoth | M4S Merger</p>
            <p style="margin-top: 8px; font-size: 0.8rem; color: #666;">
                Conveys the Idea of a Protected and Inspiring Space for Creative Expression.
            </p>
        </footer>
    </div>

<script>
    function loadFFmpeg(callback) {
        if (window.FFmpeg) {
            callback();
            return;
        }

        var sources = [
            'https://unpkg.com/@ffmpeg/ffmpeg@0.11.6/dist/ffmpeg.min.js',
            'https://m4s-merger-tools-web.vercel.app/scripts/ffmpeg/ffmpeg.min.js'
        ];

        var index = 0;

        function tryNext() {
            if (index >= sources.length) {
                window.showMessage('Failed to load FFmpeg engine.', true);
                mergeBtn.disabled = false;
                return;
            }

            var script = document.createElement('script');
            script.src = sources[index];
            script.onload = function() {
                if (window.FFmpeg) {
                    callback();
                } else {
                    index++;
                    tryNext();
                }
            };
            script.onerror = function() {
                index++;
                tryNext();
            };
            document.head.appendChild(script);
        }

        tryNext();
    }

    function startProgressNotification(title) {
        var notif = window.createTimerNotification(title, 100);
        var progressBar = notif.wrapper.querySelector('.timer-progress-bar-notif');
        var timeElement = notif.wrapper.querySelector('.timer-time-notif');
        if (progressBar) progressBar.style.width = '0%';
        if (timeElement) timeElement.textContent = '0%';
        return notif;
    }

    function updateProgress(notif, percent) {
        var progressBar = notif.wrapper.querySelector('.timer-progress-bar-notif');
        var timeElement = notif.wrapper.querySelector('.timer-time-notif');
        if (progressBar) progressBar.style.width = percent + '%';
        if (timeElement) timeElement.textContent = Math.floor(percent) + '%';
    }

    function closeNotification(notif) {
        if (notif && typeof notif.close === 'function') {
            notif.close();
        }
    }

    var videoInput = document.getElementById('videoFile');
    var audioInput = document.getElementById('audioFile');
    var mergeBtn = document.getElementById('mergeBtn');
    var downloadBtn = document.getElementById('downloadBtn');

    var ffmpegInstance = null;
    var videoFile = null;
    var audioFile = null;
    var mergedUrl = null;

    videoInput.addEventListener('change', function(e) {
        videoFile = e.target.files[0];
        checkFiles();
    });

    audioInput.addEventListener('change', function(e) {
        audioFile = e.target.files[0];
        checkFiles();
    });

    function checkFiles() {
        if (videoFile && audioFile) {
            mergeBtn.disabled = false;
        } else {
            mergeBtn.disabled = true;
        }
        resetButtons();
    }

    function resetButtons() {
        if (mergedUrl) {
            URL.revokeObjectURL(mergedUrl);
            mergedUrl = null;
        }
        mergeBtn.style.display = 'block';
        downloadBtn.style.display = 'none';
    }

    function delay(ms) {
        return new Promise(function(resolve) {
            setTimeout(resolve, ms);
        });
    }

    mergeBtn.addEventListener('click', function() {
        if (!videoFile || !audioFile) return;
        mergeBtn.disabled = true;
        mergeBtn.style.display = 'none';
        downloadBtn.style.display = 'none';

        loadFFmpeg(async function() {
            var loadingNotif = null;
            var mergeNotif = null;
            var loadingInterval = null;
            var mergeInterval = null;

            try {
                if (!ffmpegInstance) {
                    loadingNotif = startProgressNotification('Loading FFmpeg');
                    var loadStep = 0;
                    loadingInterval = setInterval(function() {
                        if (loadStep < 90) {
                            loadStep += 3;
                            if (loadStep > 90) loadStep = 90;
                            updateProgress(loadingNotif, loadStep);
                        }
                    }, 150);

                    var createFFmpeg = FFmpeg.createFFmpeg;
                    ffmpegInstance = createFFmpeg({
                        log: false,
                        corePath: 'https://unpkg.com/@ffmpeg/core@0.11.0/dist/ffmpeg-core.js'
                    });
                    await ffmpegInstance.load();

                    clearInterval(loadingInterval);
                    loadingInterval = null;
                    updateProgress(loadingNotif, 100);
                    await delay(400);
                    closeNotification(loadingNotif);
                    loadingNotif = null;
                }

                mergeNotif = startProgressNotification('Merging Files');
                var mergeStep = 10;
                mergeInterval = setInterval(function() {
                    if (mergeStep < 90) {
                        mergeStep += Math.random() * 6 + 2;
                        if (mergeStep > 90) mergeStep = 90;
                        updateProgress(mergeNotif, mergeStep);
                    }
                }, 300);

                ffmpegInstance.FS('writeFile', 'video.m4s', await FFmpeg.fetchFile(videoFile));
                ffmpegInstance.FS('writeFile', 'audio.m4s', await FFmpeg.fetchFile(audioFile));
                updateProgress(mergeNotif, 45);

                await ffmpegInstance.run('-i', 'video.m4s', '-i', 'audio.m4s', '-c', 'copy', 'output.mp4');

                var data = ffmpegInstance.FS('readFile', 'output.mp4');
                var blob = new Blob([data.buffer], { type: 'video/mp4' });
                mergedUrl = URL.createObjectURL(blob);

                clearInterval(mergeInterval);
                mergeInterval = null;
                updateProgress(mergeNotif, 100);
                await delay(500);
                closeNotification(mergeNotif);
                mergeNotif = null;

                ffmpegInstance.FS('unlink', 'video.m4s');
                ffmpegInstance.FS('unlink', 'audio.m4s');
                ffmpegInstance.FS('unlink', 'output.mp4');

                mergeBtn.style.display = 'none';
                downloadBtn.style.display = 'block';
                mergeBtn.disabled = false;
            } catch (error) {
                if (loadingInterval) clearInterval(loadingInterval);
                if (mergeInterval) clearInterval(mergeInterval);
                closeNotification(loadingNotif);
                closeNotification(mergeNotif);
                window.showMessage('Error: ' + error.message, true);
                mergeBtn.style.display = 'block';
                downloadBtn.style.display = 'none';
                mergeBtn.disabled = false;
            }
        });
    });

    downloadBtn.addEventListener('click', function() {
        if (!mergedUrl) return;
        var link = document.createElement('a');
        link.href = mergedUrl;
        link.download = 'merged.mp4';
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
    });
</script>
</body>
</html>
