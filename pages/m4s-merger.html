<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="dark">
    <script src="../protections.js"></script>
    <script src="../notification.cssjs"></script>
    <link rel="stylesheet" href="../media.css">
    <script src="../ui-icons.js"></script>
    <style>
        :root {
            --accent-color: #C1FC32;
            --accent-dark: #9bc726;
            --bg-black: #000000;
            --bg-dark: #1a1a1a;
            --bg-card: rgba(30, 30, 30, 0.7);
            --text-primary: #f5f5f7;
            --text-secondary: #a1a1a6;
            --radius-small: 12px;
            --radius-medium: 20px;
            --radius-large: 28px;
            --spacing-xs: 8px;
            --spacing-sm: 16px;
            --spacing-md: 24px;
            --spacing-lg: 32px;
            --spacing-xl: 48px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-black);
            color: var(--text-primary);
            min-height: 100vh;
            overflow-x: hidden;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: var(--spacing-md);
            position: relative;
        }

        .card {
            background-color: var(--bg-card);
            border-radius: var(--radius-medium);
            padding: var(--spacing-md);
            margin-bottom: var(--spacing-md);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .title {
            font-size: 1.5rem;
            font-weight: 600;
            margin-bottom: var(--spacing-sm);
            color: var(--accent-color);
        }

        .subtitle {
            font-size: 0.9rem;
            color: var(--text-secondary);
            margin-bottom: var(--spacing-md);
        }

        .file-input-group {
            display: flex;
            flex-direction: column;
            gap: var(--spacing-sm);
            margin-bottom: var(--spacing-md);
        }

        .file-label {
            font-size: 0.85rem;
            color: var(--text-secondary);
            margin-bottom: var(--spacing-xs);
        }

        input[type="file"] {
            display: block;
            width: 100%;
            min-height: 52px;
            padding: var(--spacing-sm);
            background-color: var(--bg-dark);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: var(--radius-small);
            color: var(--text-primary);
            font-size: 0.9rem;
            cursor: pointer;
        }

        input[type="file"]::file-selector-button {
            display: none;
        }

        input[type="file"]::-webkit-file-upload-button {
            display: none;
        }

        button {
            background-color: var(--accent-color);
            color: var(--bg-black);
            border: none;
            border-radius: var(--radius-small);
            padding: var(--spacing-sm) var(--spacing-md);
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
            margin-top: var(--spacing-sm);
            width: 100%;
            display: block;
        }

        button:hover {
            background-color: var(--accent-dark);
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .download-link {
            display: inline-block;
            margin-top: var(--spacing-sm);
            color: var(--accent-color);
            text-decoration: none;
            font-weight: 600;
            font-size: 0.9rem;
        }

        .download-link:hover {
            text-decoration: underline;
        }

        .error-text {
            margin-top: var(--spacing-sm);
            padding: var(--spacing-sm);
            border-radius: var(--radius-small);
            background-color: rgba(255, 60, 60, 0.1);
            color: #ff6b6b;
            font-size: 0.9rem;
            text-align: center;
            display: none;
        }

        .error-text.visible {
            display: block;
        }
    </style>
</head>
<body>
    <div class="container">
        <a href="../index.html" class="back-link fade-in" style="margin-bottom: 12px;">
            <i class="fas fa-arrow-left"></i> Back to Home
        </a>
        <app-header class="fade-in">
            <div>
                <h1>M4S Merger</h1>
                <p class="tagline">Select video and audio M4S files to merge them into a single MP4 file</p>
            </div>
        </app-header>
        <div class="card">
            <div class="file-input-group">
                <label class="file-label" for="audioFile">Audio M4S File:</label>
                <input type="file" id="audioFile" accept=".m4s">
            </div>
            <div class="file-input-group">
                <label class="file-label" for="videoFile">Video M4S File:</label>
                <input type="file" id="videoFile" accept=".m4s">
            </div>
            <div id="downloadContainer"></div>
            <div class="error-text" id="errorText"></div>
        </div>
        <button id="mergeBtn" disabled>Merge Files</button>

        <footer class="fade-in">
            <div class="social-links">
                <a href="https://twitter.com/lildavegoth"><span class="icon icon-twitter"></span></a>
                <a href="https://instagram.com/dave_goth"><span class="icon icon-instagram"></span></a>
            </div>
            <p>© 2026 lildavegoth | M4S Merger</p>
            <p style="margin-top: 8px; font-size: 0.8rem; color: #666;">
                Conveys the Idea of a Protected and Inspiring Space for Creative Expression.
            </p>
        </footer>
    </div>

<script src="/scripts/ffmpeg/ffmpeg.min.js"></script>
<script>
    const videoInput = document.getElementById('videoFile');
    const audioInput = document.getElementById('audioFile');
    const mergeBtn = document.getElementById('mergeBtn');
    const downloadContainer = document.getElementById('downloadContainer');
    const errorText = document.getElementById('errorText');

    let ffmpegInstance = null;
    let videoFile = null;
    let audioFile = null;
    let activeNotif = null;
    let activeInterval = null;

    videoInput.addEventListener('change', (e) => {
        videoFile = e.target.files[0];
        checkFiles();
    });

    audioInput.addEventListener('change', (e) => {
        audioFile = e.target.files[0];
        checkFiles();
    });

    function checkFiles() {
        if (videoFile && audioFile) {
            mergeBtn.disabled = false;
        } else {
            mergeBtn.disabled = true;
        }
        downloadContainer.innerHTML = '';
        errorText.classList.remove('visible');
        errorText.textContent = '';
    }

    function startNotification(title, total) {
        stopNotification();
        let remaining = total;
        activeNotif = window.createTimerNotification(title, total);
        activeInterval = setInterval(() => {
            remaining--;
            if (remaining >= 0) {
                activeNotif.update(remaining, total);
            } else {
                clearInterval(activeInterval);
                activeInterval = null;
            }
        }, 1000);
    }

    function stopNotification() {
        if (activeInterval) {
            clearInterval(activeInterval);
            activeInterval = null;
        }
        if (activeNotif) {
            activeNotif.close();
            activeNotif = null;
        }
    }

    mergeBtn.addEventListener('click', async () => {
        if (!videoFile || !audioFile) return;
        mergeBtn.disabled = true;
        downloadContainer.innerHTML = '';
        errorText.classList.remove('visible');
        errorText.textContent = '';

        try {
            if (!ffmpegInstance) {
                startNotification('Loading FFmpeg', 20);
                const { createFFmpeg, fetchFile } = FFmpeg;
                ffmpegInstance = createFFmpeg({
                    log: false,
                    corePath: '/scripts/ffmpeg/ffmpeg-core.js'
                });
                await ffmpegInstance.load();
            }

            startNotification('Merging Files', 30);

            ffmpegInstance.FS('writeFile', 'video.m4s', await FFmpeg.fetchFile(videoFile));
            ffmpegInstance.FS('writeFile', 'audio.m4s', await FFmpeg.fetchFile(audioFile));

            await ffmpegInstance.run('-i', 'video.m4s', '-i', 'audio.m4s', '-c', 'copy', 'output.mp4');

            const data = ffmpegInstance.FS('readFile', 'output.mp4');
            const blob = new Blob([data.buffer], { type: 'video/mp4' });
            const url = URL.createObjectURL(blob);
            const link = document.createElement('a');
            link.href = url;
            link.download = 'merged.mp4';
            link.textContent = 'Download merged MP4';
            link.className = 'download-link';
            downloadContainer.appendChild(link);

            ffmpegInstance.FS('unlink', 'video.m4s');
            ffmpegInstance.FS('unlink', 'audio.m4s');
            ffmpegInstance.FS('unlink', 'output.mp4');

            stopNotification();
        } catch (error) {
            stopNotification();
            errorText.textContent = 'Error: ' + error.message;
            errorText.classList.add('visible');
        } finally {
            mergeBtn.disabled = false;
        }
    });
</script>
</body>
</html>
