<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="dark">
    <script src="../protections.js"></script>
    <script src="../notification.cssjs"></script>
    <link rel="stylesheet" href="../media.css">
    <script src="../ui-icons.js"></script>
    <style>
        :root {
            --accent-color: #C1FC32;
            --accent-dark: #9bc726;
            --bg-black: #000000;
            --bg-dark: #1a1a1a;
            --bg-card: rgba(30, 30, 30, 0.7);
            --text-primary: #f5f5f7;
            --text-secondary: #a1a1a6;
            --radius-small: 12px;
            --radius-medium: 20px;
            --radius-large: 28px;
            --spacing-xs: 8px;
            --spacing-sm: 16px;
            --spacing-md: 24px;
            --spacing-lg: 32px;
            --spacing-xl: 48px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-black);
            color: var(--text-primary);
            min-height: 100vh;
            overflow-x: hidden;
            padding-bottom: 90px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: var(--spacing-md);
            position: relative;
            min-height: calc(100vh - 90px);
        }

        .card {
            background-color: var(--bg-card);
            border-radius: var(--radius-medium);
            padding: var(--spacing-md);
            margin-bottom: var(--spacing-md);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .title {
            font-size: 1.5rem;
            font-weight: 600;
            margin-bottom: var(--spacing-sm);
            color: var(--accent-color);
        }

        .subtitle {
            font-size: 0.9rem;
            color: var(--text-secondary);
            margin-bottom: var(--spacing-md);
        }

        .file-input-group {
            display: flex;
            flex-direction: column;
            gap: var(--spacing-sm);
            margin-bottom: var(--spacing-md);
        }

        .file-label {
            font-size: 0.85rem;
            color: var(--text-secondary);
            margin-bottom: var(--spacing-xs);
        }

        input[type="file"] {
            display: block;
            width: 100%;
            padding: var(--spacing-xs) var(--spacing-sm);
            background-color: var(--bg-dark);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: var(--radius-small);
            color: var(--text-primary);
            font-size: 0.9rem;
        }

        button {
            background-color: var(--accent-color);
            color: var(--bg-black);
            border: none;
            border-radius: var(--radius-small);
            padding: var(--spacing-sm) var(--spacing-md);
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
            margin-top: var(--spacing-sm);
        }

        button:hover {
            background-color: var(--accent-dark);
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .status {
            margin-top: var(--spacing-md);
            padding: var(--spacing-sm);
            border-radius: var(--radius-small);
            background-color: var(--bg-dark);
            min-height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-secondary);
            font-size: 0.9rem;
            text-align: center;
            word-break: break-all;
        }

        .download-link {
            display: inline-block;
            margin-top: var(--spacing-sm);
            color: var(--accent-color);
            text-decoration: none;
            font-weight: 600;
            font-size: 0.9rem;
        }

        .download-link:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <div class="title">M4S to MP4 Merger</div>
            <div class="subtitle">Select video and audio M4S files, then merge them into a single MP4 file.</div>
            <div class="file-input-group">
                <label class="file-label" for="videoFile">Video M4S file:</label>
                <input type="file" id="videoFile" accept=".m4s">
            </div>
            <div class="file-input-group">
                <label class="file-label" for="audioFile">Audio M4S file:</label>
                <input type="file" id="audioFile" accept=".m4s">
            </div>
            <button id="mergeBtn" disabled>Merge Files</button>
            <div class="status" id="status">Select both files to begin.</div>
            <div id="downloadContainer"></div>
        </div>
    </div>

    <script src="scripts/ffmpeg/ffmpeg.min.js"></script>
    <script>
        const videoInput = document.getElementById('videoFile');
        const audioInput = document.getElementById('audioFile');
        const mergeBtn = document.getElementById('mergeBtn');
        const statusDiv = document.getElementById('status');
        const downloadContainer = document.getElementById('downloadContainer');

        let ffmpegInstance = null;
        let videoFile = null;
        let audioFile = null;

        videoInput.addEventListener('change', (e) => {
            videoFile = e.target.files[0];
            checkFiles();
        });

        audioInput.addEventListener('change', (e) => {
            audioFile = e.target.files[0];
            checkFiles();
        });

        function checkFiles() {
            if (videoFile && audioFile) {
                mergeBtn.disabled = false;
                statusDiv.textContent = 'Ready to merge.';
            } else {
                mergeBtn.disabled = true;
                statusDiv.textContent = 'Select both files to begin.';
            }
            downloadContainer.innerHTML = '';
        }

        mergeBtn.addEventListener('click', async () => {
            if (!videoFile || !audioFile) return;
            mergeBtn.disabled = true;
            statusDiv.textContent = 'Loading FFmpeg...';
            downloadContainer.innerHTML = '';

            try {
                if (!ffmpegInstance) {
                    const { createFFmpeg, fetchFile } = FFmpeg;
                    ffmpegInstance = createFFmpeg({
                        corePath: 'scripts/ffmpeg/ffmpeg-core.js',
                        log: false
                    });
                    await ffmpegInstance.load();
                }

                statusDiv.textContent = 'Writing files to memory...';
                ffmpegInstance.FS('writeFile', 'video.m4s', await FFmpeg.fetchFile(videoFile));
                ffmpegInstance.FS('writeFile', 'audio.m4s', await FFmpeg.fetchFile(audioFile));

                statusDiv.textContent = 'Merging files...';
                await ffmpegInstance.run('-i', 'video.m4s', '-i', 'audio.m4s', '-c', 'copy', 'output.mp4');

                statusDiv.textContent = 'Reading output file...';
                const data = ffmpegInstance.FS('readFile', 'output.mp4');
                const blob = new Blob([data.buffer], { type: 'video/mp4' });
                const url = URL.createObjectURL(blob);
                const link = document.createElement('a');
                link.href = url;
                link.download = 'merged.mp4';
                link.textContent = 'Download merged MP4';
                link.className = 'download-link';
                downloadContainer.appendChild(link);
                statusDiv.textContent = 'Merge complete.';
                ffmpegInstance.FS('unlink', 'video.m4s');
                ffmpegInstance.FS('unlink', 'audio.m4s');
                ffmpegInstance.FS('unlink', 'output.mp4');
            } catch (error) {
                statusDiv.textContent = 'Error: ' + error.message;
            } finally {
                mergeBtn.disabled = false;
            }
        });
    </script>
</body>
</html>
