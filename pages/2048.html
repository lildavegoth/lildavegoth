<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>2048</title>
    <meta name="color-scheme" content="dark">
    <script src="../protections.js"></script>
    <script src="../notification.cssjs"></script>
    <link rel="stylesheet" href="../media.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --accent-color: #C1FC32;
            --bg-black: #000000;
            --bg-dark: #1a1a1a;
            --bg-card: rgba(30, 30, 30, 0.7);
            --text-primary: #f5f5f7;
            --text-secondary: #a1a1a6;
            --radius-medium: 20px;
            --spacing-sm: 16px;
            --spacing-md: 24px;
            --spacing-lg: 32px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-black);
            color: var(--text-primary);
            min-height: 100vh;
            background-image: radial-gradient(circle at 20% 80%, rgba(193, 252, 50, 0.05) 0%, transparent 20%),
                            radial-gradient(circle at 80% 20%, rgba(193, 252, 50, 0.03) 0%, transparent 20%);
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: var(--spacing-md);
        }

        header {
            padding: var(--spacing-lg) 0;
            margin-bottom: var(--spacing-md);
        }

        .username {
            font-size: 2.5rem;
            font-weight: 700;
            color: #ffffff;
            margin-bottom: 4px;
        }

        .tagline {
            color: var(--text-secondary);
            font-size: 1.1rem;
        }

        .game-section {
            margin: var(--spacing-lg) 0;
            display: flex;
            justify-content: center;
        }

        .game-wrapper {
            display: flex;
            gap: var(--spacing-lg);
            align-items: center;
        }

        .game-container {
            background: var(--bg-card);
            border-radius: var(--radius-medium);
            padding: var(--spacing-lg);
            border: 1px solid rgba(255, 255, 255, 0.05);
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .game-stats {
            display: flex;
            justify-content: space-around;
            width: 100%;
            margin-bottom: var(--spacing-md);
        }

        .stat-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            flex: 1;
            padding: 1px;
        }

        .stat-value {
            font-size: 1.2rem;
            font-weight: bold;
            color: var(--accent-color);
            margin-bottom: 4px;
        }

        .stat-label {
            font-size: 0.5rem;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .controls-side {
            background: var(--bg-card);
            border-radius: var(--radius-medium);
            padding: var(--spacing-lg);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .game-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            grid-template-rows: repeat(4, 1fr);
            gap: 10px;
        }

        .grid-cell {
            width: 80px;
            height: 80px;
            background: rgba(40, 40, 40, 0.6);
            border-radius: 12px;
            border: 2px solid rgba(255, 255, 255, 0.05);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.8rem;
            font-weight: bold;
            color: #f5f5f7;
        }

        .tile-2 { background: rgba(255, 255, 255, 0.1); color: #f5f5f7; }
        .tile-4 { background: rgba(255, 255, 255, 0.2); color: #f5f5f7; }
        .tile-8 { background: rgba(193, 252, 50, 0.2); color: var(--accent-color); }
        .tile-16 { background: rgba(193, 252, 50, 0.3); color: var(--accent-color); }
        .tile-32 { background: rgba(193, 252, 50, 0.4); color: var(--accent-color); }
        .tile-64 { background: rgba(193, 252, 50, 0.5); color: var(--accent-color); }
        .tile-128 { background: rgba(193, 252, 50, 0.6); color: var(--accent-color); }
        .tile-256 { background: rgba(193, 252, 50, 0.7); color: var(--accent-color); }
        .tile-512 { background: rgba(193, 252, 50, 0.8); color: var(--accent-color); }
        .tile-1024 { background: rgba(193, 252, 50, 0.9); color: var(--accent-color); }
        .tile-2048 { background: var(--accent-color); color: #000000; }

        .controls-container {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            grid-template-rows: 1fr 1fr 1fr;
            gap: 8px;
        }

        .control-btn {
            background: var(--bg-dark);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            width: 60px;
            height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--accent-color);
            font-size: 1.5rem;
            cursor: pointer;
        }

        .control-btn:hover {
            background: rgba(193, 252, 50, 0.1);
        }

        .control-btn.up { grid-column: 2; grid-row: 1; }
        .control-btn.down { grid-column: 2; grid-row: 3; }
        .control-btn.left { grid-column: 1; grid-row: 2; }
        .control-btn.right { grid-column: 3; grid-row: 2; }

        .action-buttons {
            display: flex;
            gap: var(--spacing-sm);
            margin-top: var(--spacing-md);
            justify-content: center;
        }

        .action-btn {
            padding: var(--spacing-sm) var(--spacing-lg);
            background: var(--bg-dark);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            color: var(--text-primary);
            font-weight: 500;
            cursor: pointer;
            text-align: center;
        }

        .action-btn:hover {
            background: rgba(193, 252, 50, 0.1);
            border-color: var(--accent-color);
        }

        .action-btn.primary {
            background: var(--accent-color);
            color: #000;
            font-weight: bold;
        }

        @media (max-width: 768px) {
            .game-wrapper {
                flex-direction: column;
            }
            
            .controls-side {
                margin-top: var(--spacing-md);
            }
            
            .grid-cell {
                width: 60px;
                height: 60px;
                font-size: 1.4rem;
            }
        }
        
        @media (min-width: 769px) {
            .controls-container {
                margin-bottom: 0;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <a href="../index.html" class="back-link fade-in">
            <i class="fas fa-arrow-left"></i> Back to Home
        </a>
        
        <header>
            <h1 class="username">2048</h1>
            <p class="tagline">Join the numbers and reach 2048!</p>
        </header>
        
        <section class="game-section">
            <div class="game-wrapper">
                <div class="game-container">
                    <div class="game-stats">
                        <div class="stat-item">
                            <div class="stat-value" id="score">0</div>
                            <div class="stat-label">SCORE</div>
                        </div>
                        <div class="stat-item">
                            <div class="stat-value" id="best">0</div>
                            <div class="stat-label">BEST</div>
                        </div>
                    </div>
                    
                    <div class="game-grid" id="gameGrid"></div>
                </div>
                
                <div class="controls-side">
                    <div class="controls-container">
                        <div class="control-btn up" id="moveUp">
                            <i class="fas fa-arrow-up"></i>
                        </div>
                        <div class="control-btn left" id="moveLeft">
                            <i class="fas fa-arrow-left"></i>
                        </div>
                        <div class="control-btn down" id="moveDown">
                            <i class="fas fa-arrow-down"></i>
                        </div>
                        <div class="control-btn right" id="moveRight">
                            <i class="fas fa-arrow-right"></i>
                        </div>
                    </div>
                </div>
            </div>
        </section>
        
        <div class="action-buttons">
            <button class="action-btn" id="newGameBtn">
                <i class="fas fa-redo"></i> New Game
            </button>
            <button class="action-btn primary" id="tryAgainBtn" style="display:none;">
                <i class="fas fa-play"></i> Try Again
            </button>
        </div>
        
        <footer>
            <div class="social-links">
                <a href="https://twitter.com/lildavegoth"><span class="icon icon-twitter"></span></a>
                <a href="https://instagram.com/dave_goth"><span class="icon icon-instagram"></span></a>
            </div>
            <p>© 2026 lildavegoth | 2048</p>
            <p style="margin-top: 8px; font-size: 0.8rem; color: #666;">
                Conveys the Idea of a Protected and Inspiring Space for Creative Expression.
            </p>
        </footer>
    </div>

    <script>
        let grid = [];
        let score = 0;
        let best = localStorage.getItem('best') || 0;
        let gameOver = false;
        let won = false;

        document.addEventListener('DOMContentLoaded', function() {
            initializeGame();
            setupEventListeners();
            updateUI();
        });

        function initializeGame() {
            grid = Array(4).fill().map(() => Array(4).fill(0));
            score = 0;
            gameOver = false;
            won = false;
            document.getElementById('tryAgainBtn').style.display = 'none';
            addRandomTile();
            addRandomTile();
            updateGrid();
        }

        function updateGrid() {
            const gridElement = document.getElementById('gameGrid');
            gridElement.innerHTML = '';
            
            for (let r = 0; r < 4; r++) {
                for (let c = 0; c < 4; c++) {
                    const cell = document.createElement('div');
                    cell.className = 'grid-cell';
                    const value = grid[r][c];
                    if (value !== 0) {
                        cell.textContent = value;
                        cell.classList.add(`tile-${value}`);
                    }
                    gridElement.appendChild(cell);
                }
            }
        }

        function updateUI() {
            document.getElementById('score').textContent = score;
            document.getElementById('best').textContent = best;
        }

        function addRandomTile() {
            const emptyCells = [];
            for (let r = 0; r < 4; r++) {
                for (let c = 0; c < 4; c++) {
                    if (grid[r][c] === 0) {
                        emptyCells.push({r, c});
                    }
                }
            }
            
            if (emptyCells.length > 0) {
                const {r, c} = emptyCells[Math.floor(Math.random() * emptyCells.length)];
                grid[r][c] = Math.random() < 0.9 ? 2 : 4;
            }
        }

        function move(direction) {
            if (gameOver) return false;
            
            let moved = false;
            const oldGrid = JSON.parse(JSON.stringify(grid));
            
            if (direction === 'left') {
                for (let r = 0; r < 4; r++) {
                    const row = grid[r].filter(val => val !== 0);
                    for (let i = 0; i < row.length - 1; i++) {
                        if (row[i] === row[i + 1]) {
                            row[i] *= 2;
                            score += row[i];
                            if (row[i] === 2048 && !won) {
                                won = true;
                                window.showMessage('You Win!', 'Congratulations! You reached 2048!');
                            }
                            row.splice(i + 1, 1);
                        }
                    }
                    while (row.length < 4) row.push(0);
                    grid[r] = row;
                }
            } else if (direction === 'right') {
                for (let r = 0; r < 4; r++) {
                    const row = grid[r].filter(val => val !== 0);
                    for (let i = row.length - 1; i > 0; i--) {
                        if (row[i] === row[i - 1]) {
                            row[i] *= 2;
                            score += row[i];
                            if (row[i] === 2048 && !won) {
                                won = true;
                                window.showMessage('You Win!', 'Congratulations! You reached 2048!');
                            }
                            row.splice(i - 1, 1);
                        }
                    }
                    while (row.length < 4) row.unshift(0);
                    grid[r] = row;
                }
            } else if (direction === 'up') {
                for (let c = 0; c < 4; c++) {
                    const column = [];
                    for (let r = 0; r < 4; r++) {
                        if (grid[r][c] !== 0) column.push(grid[r][c]);
                    }
                    for (let i = 0; i < column.length - 1; i++) {
                        if (column[i] === column[i + 1]) {
                            column[i] *= 2;
                            score += column[i];
                            if (column[i] === 2048 && !won) {
                                won = true;
                                window.showMessage('You Win!', 'Congratulations! You reached 2048!');
                            }
                            column.splice(i + 1, 1);
                        }
                    }
                    while (column.length < 4) column.push(0);
                    for (let r = 0; r < 4; r++) {
                        grid[r][c] = column[r];
                    }
                }
            } else if (direction === 'down') {
                for (let c = 0; c < 4; c++) {
                    const column = [];
                    for (let r = 0; r < 4; r++) {
                        if (grid[r][c] !== 0) column.push(grid[r][c]);
                    }
                    for (let i = column.length - 1; i > 0; i--) {
                        if (column[i] === column[i - 1]) {
                            column[i] *= 2;
                            score += column[i];
                            if (column[i] === 2048 && !won) {
                                won = true;
                                window.showMessage('You Win!', 'Congratulations! You reached 2048!');
                            }
                            column.splice(i - 1, 1);
                        }
                    }
                    while (column.length < 4) column.unshift(0);
                    for (let r = 0; r < 4; r++) {
                        grid[r][c] = column[r];
                    }
                }
            }
            
            for (let r = 0; r < 4; r++) {
                for (let c = 0; c < 4; c++) {
                    if (grid[r][c] !== oldGrid[r][c]) {
                        moved = true;
                        break;
                    }
                }
                if (moved) break;
            }
            
            if (moved) {
                addRandomTile();
                updateGrid();
                updateUI();
                checkGameOver();
            }
            
            if (score > best) {
                best = score;
                localStorage.setItem('best', best);
                updateUI();
            }
            
            return moved;
        }

        function checkGameOver() {
            for (let r = 0; r < 4; r++) {
                for (let c = 0; c < 4; c++) {
                    if (grid[r][c] === 0) return false;
                    if (c < 3 && grid[r][c] === grid[r][c + 1]) return false;
                    if (r < 3 && grid[r][c] === grid[r + 1][c]) return false;
                }
            }
            
            gameOver = true;
            document.getElementById('tryAgainBtn').style.display = 'inline-block';
            window.window.showMessage('Game Over!', 'No more moves available. Your score: ' + score);
            return true;
        }

        function setupEventListeners() {
            document.getElementById('moveUp').addEventListener('click', () => move('up'));
            document.getElementById('moveDown').addEventListener('click', () => move('down'));
            document.getElementById('moveLeft').addEventListener('click', () => move('left'));
            document.getElementById('moveRight').addEventListener('click', () => move('right'));
            
            document.getElementById('newGameBtn').addEventListener('click', initializeGame);
            document.getElementById('tryAgainBtn').addEventListener('click', initializeGame);
            
            document.addEventListener('keydown', function(e) {
                if (gameOver && !won) return;
                
                switch(e.key) {
                    case 'ArrowUp':
                        move('up');
                        e.preventDefault();
                        break;
                    case 'ArrowDown':
                        move('down');
                        e.preventDefault();
                        break;
                    case 'ArrowLeft':
                        move('left');
                        e.preventDefault();
                        break;
                    case 'ArrowRight':
                        move('right');
                        e.preventDefault();
                        break;
                }
            });
        }
    </script>
</body>
</html>
